              });
              if (!res.ok)
                throw new Error((await res.json().catch(() => ({}))).error || "Xato");
              await loadProjects();
              histState.loaded = false;
              if (trackerProjectId === slug) closeTracker();
              else refreshAllViews();
              showToast(`✅ "${label}" arxivlandi`);
            } catch (e) {
              showToast("⚠ " + e.message);
              if (btn) btn.disabled = false;
            }
          },
          "Arxivlash",
        );
      }

      // ── KIRISH TAQIQLANGAN ────────────────────────────────────────
      function showAccessDenied(username, code, message) {
        // Backend endi holatga qarab aniq xabar beradi (bloklangan /
        // ruxsat mavjud emas) — shuni ko'rsatamiz, bo'lmasa umumiy matn.
        const title = code === "BLOCKED" ? "Kirish bloklangan" : "Kirish taqiqlangan";
        const detail = message
          ? escHtml(message)
          : username
            ? `<span style="color:var(--brand);font-weight:600">@${escHtml(username)}</span> uchun ruxsat yo'q`
            : "Faqat Nasaf Digital jamoasi kirishi mumkin";
        document.body.innerHTML = `
          <div style="min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="background:var(--surf);border:1px solid var(--bd2);border-radius:16px;padding:36px 24px;max-width:320px;width:100%;text-align:center">
              <div style="width:52px;height:52px;border-radius:99px;background:var(--red-bg);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--red);font-weight:700">!</div>
              <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px">
                <div style="width:28px;height:28px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px">ND</div>
                <span style="font-size:13px;font-weight:600">Nasaf Digital</span>
              </div>
              <div style="font-size:17px;font-weight:600;margin-bottom:8px">${escHtml(title)}</div>
              <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:20px">
                ${detail}
              </div>
              <div style="background:var(--chip);border-radius:10px;padding:12px;font-size:11px;color:var(--t2);text-align:left;line-height:1.6">
                Murojaat uchun:<br><span style="color:var(--brand);font-weight:600">@jahongirjuraqulov</span>
              </div>
            </div>
          </div>`;
      }

      // ── INIT ──────────────────────────────────────────────────────
      // To'liq ekran rejimida Telegram o'zining sarlavha/yopish
      // tugmalarini kontent ustiga chizadi (contentSafeAreaInset) —
      // shuni --tg-safe-top CSS o'zgaruvchisiga yozib, .hdr/.trk-hdr/
      // .np-hdr/#sidebar shu bo'shliqni hisobga oladi (aks holda ekran
      // sarlavhasi Telegram'ning o'z tugmalari ostida yashiringan bo'lardi).
      function applyTelegramSafeArea() {
        const t = tg();
        if (!t) return;
        // Kompyuterda bo'shliq hech qachon qo'shilmaydi. To'liq ekran
        // so'ralmagani uchun Telegram o'z tugmalarini kontent ustiga
        // chizmaydi, ya'ni joy ajratish shart emas. Bu — exitFullscreen()
        // kechikib ishlagan yoki "fullscreenChanged" hodisasi kelmagan
        // holatlar uchun ham kafolat.
        const isDesktop = window.matchMedia("(min-width: 860px)").matches;
        const top = isDesktop
          ? 0
          : (t.safeAreaInset?.top || 0) + (t.contentSafeAreaInset?.top || 0);
        document.documentElement.style.setProperty("--tg-safe-top", top + "px");
        // Pastki chekka. Telegram qiymat bermasa — brauzerning o'z
        // `env(safe-area-inset-bottom)` qiymati ishlatiladi; u ham
        // bo'lmasa mobilda kamida 12px qoldiriladi, shunda tugma
        // ekranning o'ta chetiga yopishmaydi.
        const tgBottom = (t.safeAreaInset?.bottom || 0) + (t.contentSafeAreaInset?.bottom || 0);
        const bottom = isDesktop ? 0 : Math.max(tgBottom, 12);
        document.documentElement.style.setProperty("--tg-safe-bottom", bottom + "px");
      }
      async function initApp() {
        if (tg()) {
          tg().ready();
          tg().expand();
          try {
            // To'liq ekran FAQAT mobilda so'raladi. Kompyuterda Telegram
            // bu rejimda o'zining yopish/menyu tugmalarini kontent ustiga
            // chizadi va katta "xavfsiz zona" qaytaradi — u --tg-safe-top
            // orqali butun ilovani pastga surib, tepada ~100px bo'sh joy
            // qoldirardi. Kompyuterda oyna allaqachon katta, ya'ni to'liq
            // ekrandan yutuq yo'q, faqat zarari bor.
            if (window.matchMedia("(min-width: 860px)").matches) {
              if (tg().isFullscreen) tg().exitFullscreen?.();
            } else {
              tg().requestFullscreen?.(); // Bot API 8.0+
            }
            tg().disableVerticalSwipes?.();
          } catch (e) {}
          applyTelegramSafeArea();
          try {
            tg().onEvent?.("safeAreaChanged", applyTelegramSafeArea);
            tg().onEvent?.("contentSafeAreaChanged", applyTelegramSafeArea);
            tg().onEvent?.("fullscreenChanged", applyTelegramSafeArea);
          } catch (e) {}
        }

        // Ma'lumot so'rovlari /api/auth javobiga bog'liq emas — ularning
        // har biri o'zini initData bilan tasdiqlaydi. Shu sabab ular
        // auth bilan BIR VAQTDA boshlanadi va yana bitta navbat kutish
        // yo'qoladi. Ruxsati yo'q foydalanuvchida bu so'rovlar ham rad
        // etiladi — zarari yo'q, chunki javob baribir ishlatilmaydi.
        let profileIncomplete = false;
        let showBirthdayGreeting = false;
        const loadPerms = async () => {
          try {
            const r = await apiFetch("/api/permissions");
            if (r.ok) perms = await r.json();
          } catch (e) {}
        };
        const loadMe = async () => {
          try {
            const r = await apiFetch("/api/me");
            if (r.ok) {
              const d = await r.json();
              myProfile = d.user;
              if (typeof d.ncoinBalance === "number") myNcoinBalance = d.ncoinBalance;
              profileIncomplete = !!d.profileIncomplete;
              showBirthdayGreeting = !!d.showBirthdayGreeting;
            }
          } catch (e) {}
        };
        const dataReady = Promise.all([
          loadPerms(),
          loadMe(),
          loadProjects(),
          loadStaff(),
          loadTasks(),
          loadTags(),
        ]);

        const initData = getInitData();
        if (initData) {
          try {
            const res = await apiFetch("/api/auth", { method: "POST", body: "{}" });
            const d = await res.json();
            if (res.status === 403 || res.status === 401) {
              document.getElementById("loading").remove();
              showAccessDenied(
                d.username || tg()?.initDataUnsafe?.user?.username || null,
                d.code,
                d.error,
              );
              return;
            }
            currentUser = d.username;
            isAdmin = d.isAdmin || false;
            isSuperAdmin = d.isSuperAdmin || false;
            userRole = d.role || "employee";
          } catch (e) {
            console.warn("Auth offline:", e.message);
          }
        }

        if (!currentUser) {
          currentUser =
            (tg()?.initDataUnsafe?.user?.username || "").toLowerCase() || null;
          isSuperAdmin = SUPER_ADMINS.has(currentUser);
          isAdmin = isSuperAdmin;
          userRole = isSuperAdmin ? "super_admin" : "employee";
        }

        // Chat ID ni saqlash (bot bildirishnomalari uchun)
        const chatId = tg()?.initDataUnsafe?.user?.id;
        if (chatId && currentUser) {
          apiFetch("/api/register-chat", {
            method: "POST",
            body: JSON.stringify({ chatId }),
          }).catch(() => {});
        }

        // Yuqorida boshlangan so'rovlarning hammasi tugashini kutamiz.
        await dataReady;

        // Faollik kartasi ilovaning ochilishini kutdirmaydi — fonda
        // yuklanadi va kelgach o'z joyi qayta chiziladi.
        loadMyActivity().then(() => {
          if (document.getElementById("screen-today")?.classList.contains("active")) renderToday();
        });

        document.getElementById("nav-admin").style.display = isAdmin
          ? "flex"
          : "none";
        document.getElementById("sidebar-admin").style.display = isAdmin ? "block" : "none";
        // "Adminlar" va "E'lon" — faqat super admin uchun, Boshqaruv
        // ekranidagi tablar bilan bir xil qoida.
        document.querySelectorAll('#sidebar-admin .sb-aitem[data-super="1"]').forEach((el) => {
          el.style.display = isSuperAdmin ? "flex" : "none";
        });
        document.getElementById("atab-admins").style.display = isSuperAdmin
          ? "block"
          : "none";
        document.getElementById("atab-announcement").style.display = isSuperAdmin
          ? "block"
          : "none";

        // Grafik Dizayner — loyiha-tsikliga (post/stories) bog'liq
        // ishlamaydi, faqat vazifalar orqali ishlaydi — shu sabab
        // "Bugun" (tracker) va "Loyihalar" bo'limlari uning uchun
        // ko'rinmaydi (NShop/Tarix — coin sarflash/tarixini ko'rish
        // uchun qoladi). Lavozim matni profildagi qiymat bilan AYNAN
        // bir xil bo'lishi kerak (TASK_NCOIN_AMOUNT_BY_JOB_TITLE'dagi
        // bilan bir joydan keladi).
        const isDesignerOnlyNav = myProfile?.jobTitle === "Grafik Dizyayner";
        document.getElementById("nav-today").style.display = isDesignerOnlyNav ? "none" : "flex";
        document.getElementById("nav-projects").style.display = isDesignerOnlyNav ? "none" : "flex";
        document.getElementById("sidebar-nav-today").style.display = isDesignerOnlyNav ? "none" : "flex";
        document.getElementById("sidebar-nav-projects").style.display = isDesignerOnlyNav ? "none" : "flex";
        // "Bugun" bo'limi yashirilgan xodimlar uchun (masalan Grafik
        // Dizayner) mobilda profilga kirishning yagona joyi shu
        // "Bugun" ekranining o'zida edi — endi "Vazifalar" sarlavhasida
        // ham xuddi shunday avatar-tugma bor, harflari shu yerda
        // darhol to'ldiriladi (renderToday() kutilmaydi, chunki bu
        // xodimlar "Bugun"ga umuman kirmaydi).
        renderMeAvatars();

        renderSidebar();
        // Ko'rinish (mobil/desktop) faqat CSS orqali hal qilinadi
        // (.mobile-only/.desktop-only) — bloklarning o'zi har doim
        // quriladi, shuning uchun bu yerda faqat oyna hajmi chegaradan
        // o'tganda ma'lumotlarni yangilab turish uchun (masalan "N kun
        // qoldi" kabi qiymatlar) qayta render qilinadi.
        window
          .matchMedia("(min-width: 860px)")
          .addEventListener("change", refreshAllViews);

        // Coinning bir qismini boshqa odam beradi (montajchi postni
        // belgilasa, montaj qilgan xodim coin oladi; admin qo'lda
        // qo'shadi). Ilova ochiq turganda bu o'zgarishlar bu yerga
        // yetib kelmaydi, shuning uchun foydalanuvchi ilovaga qaytgan
        // zahoti balans qayta so'raladi.
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) return;
          refreshMyNcoin();
          checkAppVersion();
        });
        window.addEventListener("focus", () => {
          refreshMyNcoin();
          checkAppVersion();
        });
        // Ilova uzoq ochiq tursa, qaytib kirmasdan ham yangilanish
        // borligini bilsin.
        setTimeout(checkAppVersion, 60_000);
        setInterval(checkAppVersion, 30 * 60_000);

        // Brauzerning o'z signali — so'rov yuborilishini kutmasdan.
        window.addEventListener("offline", showOffline);
        window.addEventListener("online", () => {
          setOnline();
          refreshMyNcoin();
        });

        document.getElementById("loading").remove();
        // Jamoa faolligi — ilova ochilishini kutdirmasdan, fonda yuklanadi.
        // Kelgach renderToday() o'zi qayta chiziladi.
        loadTeamActivity();
        if (profileIncomplete) {
          showOnboarding();
        } else {
          // Bildirishnomadagi "Ilovani ochish" tugmasi (web_app URL'ga
          // qo'shilgan ?openTask=<id> yoki ?tab=<nom>) — bosilganda ilova
          // to'g'ridan-to'g'ri o'sha vazifaga/bo'limga ochiladi.
          const params = new URLSearchParams(window.location.search);
          const openTaskId = params.get("openTask");
          const openEventId = params.get("openEvent");
          const tabParam = params.get("tab");
          if (openTaskId) {
            showTab("tasks");
            openTaskActions(openTaskId);
          } else if (openEventId || location.pathname.startsWith("/kalendar")) {
            // Telegram xabaridagi tugma yoki nusxalangan havola —
            // ikkalasi ham to'g'ridan-to'g'ri kalendarni ochadi.
            showTab("kalendar");
            if (openEventId) kalOpenById(openEventId);
          } else if (tabParam && ROOT_TABS.includes(tabParam) && !(isDesignerOnlyNav && ["today", "projects"].includes(tabParam))) {
            showTab(tabParam);
          } else {
            showTab(isDesignerOnlyNav ? "tasks" : "today");
          }
          if (showBirthdayGreeting) openBirthdayGreetingModal();
        }
      }

      tdndInit();
      initApp();
    </script>
  </body>
</html>
