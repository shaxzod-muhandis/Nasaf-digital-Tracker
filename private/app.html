                  </div>
                </div>`,
              )
              .join("");
            staffHtml += `</div>`;
          });
        }

        c.innerHTML = `
          <div class="sec-upper">Telegram xodimlar · avtomatik</div>
          <div id="staff-tg-list" class="list-card" style="margin-bottom:20px">
            <div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Yuklanmoqda…</div>
          </div>
          <div class="sec-upper">Boshqa xodimlar · qo'lda qo'shiladi</div>
          <div class="list-card" style="padding:14px;margin-bottom:16px">
            <div class="f-group" style="margin-bottom:10px">
              <label class="f-label">Yangi xodim</label>
              <input class="f-input" id="staff-name" placeholder="Ism familiya" onblur="formatNameInputOnBlur(this)"/>
            </div>
            <div style="display:flex;gap:8px">
              <select class="f-input" id="staff-position" style="flex:1">${posOptions}</select>
              <button class="btn btn-blue" style="width:auto;padding:0 18px" onclick="addStaff()">Qo'shish</button>
            </div>
          </div>
          ${staffHtml}`;

        loadAndRenderTelegramStaff(q);
      }

      // Botga kirish holati belgisi — uch xil aniq holat (TZ: active/
      // blocked/removed), har biri o'z rangi/matni bilan.
      function userAccessBadgeHtml(u, extraStyle) {
        const style = extraStyle || "";
        if (u.access_status === "blocked") {
          return `<span class="debt-badge" style="${style}">Bloklangan</span>`;
        }
        if (u.access_status === "removed") {
          return `<span class="debt-badge" style="background:var(--chip3);color:var(--t3);${style}">Chiqarilgan</span>`;
        }
        return "";
      }
      // Telegram orqali botga kirib profilini to'ldirgan xodimlar —
      // hech qanday qo'lda kiritish shart emas, /api/users'dan o'zi keladi.
      async function loadAndRenderTelegramStaff(q) {
        const wrap = document.getElementById("staff-tg-list");
        if (!wrap) return;
        try {
          const res = await apiFetch("/api/users");
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          allUsers = (await res.json()).users || [];
          resetPersonColors();
        } catch (e) {
          wrap.innerHTML = `<div style="padding:16px 14px;font-size:12px;color:var(--red)">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        // Chiqarilgan (o'chirilgan) xodimlar standart ko'rinishda
        // yashiriladi — ro'yxat faol xodimlar bilan cheklanadi. Kerak
        // bo'lsa (masalan qayta ruxsat berish uchun) pastdagi havola
        // orqali ko'rsatish mumkin.
        const removedCount = allUsers.filter((u) => u.access_status === "removed").length;
        const base = showRemovedEmployees ? allUsers : allUsers.filter((u) => u.access_status !== "removed");
        const filtered = base.filter(
          (u) =>
            !q ||
            `${u.first_name || ""} ${u.last_name || ""} ${u.username}`.toLowerCase().includes(q),
        );
        const toggleHtml =
          removedCount > 0
            ? `<div class="stat-foot" style="margin:10px 0 4px"><span class="stat-link" onclick="toggleShowRemovedEmployees()">${showRemovedEmployees ? "Chiqarilganlarni yashirish" : `Chiqarilganlar (${removedCount}) →`}</span></div>`
            : "";
        if (!filtered.length) {
          wrap.innerHTML = `<div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Hali hech kim botga kirmagan</div>${toggleHtml}`;
          return;
        }
        const mobileRows = filtered
          .map((u) => {
            const complete = !!u.first_name;
            const displayName = complete ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
            const sub = complete
              ? u.job_title || (u.phone ? "" : `@${u.username}`)
              : "profil hali to'ldirilmagan";
            return `<div class="list-row">
              <div class="avatar" style="background:${personColor(u.username)};color:#fff">${u.username.slice(0, 1).toUpperCase()}${avatarImg(u.avatar_url)}</div>
              <div style="flex:1;min-width:0">
                <div class="r-name">${escHtml(displayName)}</div>
                <div class="r-subrow">
                  ${sub ? `<span class="r-sub"${complete ? "" : ' style="color:var(--red)"'}>${escHtml(sub)}</span>` : ""}
                  ${complete ? phoneCopyHtml(u.phone) : ""}
                </div>
              </div>
              ${userAccessBadgeHtml(u)}
              <div class="m-actions-inline">
                <button class="icon-btn" aria-label="Xodimni tahrirlash" title="Xodimni tahrirlash" onclick="openUserEditSheet('${escArg(u.username)}')">${ICON.edit}</button>
                ${isSuperAdmin && u.access_status !== "removed" ? `<button class="icon-btn danger" aria-label="Xodimni chiqarish" title="Xodimni chiqarish" onclick="deleteTelegramUser('${escArg(u.username)}','${escArg(displayName)}')">${ICON.trash}</button>` : ""}
              </div>
            </div>`;
          })
          .join("");

        const desktopCards = filtered
          .map((u) => {
            const complete = !!u.first_name;
            const displayName = complete ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
            const sub = complete
              ? u.job_title || (u.phone ? "" : `@${u.username}`)
              : "profil hali to'ldirilmagan";
            return `<div class="pcard">
              <div class="pcard-top">
                <div class="row" style="display:flex;align-items:center;gap:9px;min-width:0">
                  <div class="avatar" style="flex-shrink:0;background:${personColor(u.username)};color:#fff">${u.username.slice(0, 1).toUpperCase()}${avatarImg(u.avatar_url)}</div>
                  <div class="r-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(displayName)}</div>
                </div>
                <div class="m-actions-inline">
                  <button class="icon-btn" aria-label="Xodimni tahrirlash" title="Xodimni tahrirlash" onclick="openUserEditSheet('${escArg(u.username)}')">${ICON.edit}</button>
                  ${isSuperAdmin && u.access_status !== "removed" ? `<button class="icon-btn danger" aria-label="Xodimni chiqarish" title="Xodimni chiqarish" onclick="deleteTelegramUser('${escArg(u.username)}','${escArg(displayName)}')">${ICON.trash}</button>` : ""}
                </div>
              </div>
              <div class="r-subrow">
                ${sub ? `<span class="r-sub"${complete ? "" : ' style="color:var(--red)"'}>${escHtml(sub)}</span>` : ""}
                ${complete ? phoneCopyHtml(u.phone) : ""}
              </div>
              ${userAccessBadgeHtml(u, "margin-top:8px")}
            </div>`;
          })
          .join("");

        wrap.className = ""; // .list-card emas — endi ikkala variant ham o'z konteynerini olib keladi
        wrap.innerHTML = `<div class="mobile-only list-card">${mobileRows}</div><div class="desktop-only"><div class="pgrid">${desktopCards}</div></div>${toggleHtml}`;
      }
      let showRemovedEmployees = false;
      function toggleShowRemovedEmployees() {
        showRemovedEmployees = !showRemovedEmployees;
        loadAndRenderTelegramStaff(document.getElementById("admin-search")?.value.toLowerCase().trim() || "");
      }
      async function addStaff() {
        const name = document.getElementById("staff-name")?.value.trim();
        const position = document.getElementById("staff-position")?.value;
        if (!name) return showToast("⚠ Ism kiriting");
        try {
          const res = await apiFetch("/api/staff", {
            method: "POST",
            body: JSON.stringify({ fullName: name, position }),
          });
          const d = await res.json();
          if (!res.ok) throw new Error(d.error || "Xato");
          await loadStaff();
          renderStaffTab(document.getElementById("admin-body"));
          showToast(`✅ ${name} qo'shildi`);
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      function openStaffEdit(id) {
        const s = staffList.find((x) => x.id === id);
        if (!s) return;
        const posOptions = Object.keys(POSITION_LABELS)
          .map(
            (k) =>
              `<option value="${k}"${k === s.position ? " selected" : ""}>${POSITION_LABELS[k]}</option>`,
          )
          .join("");
        const { body } = makeSheet(`${escHtml(s.fullName)} — tahrirlash`);
        body.innerHTML = `
          <div class="f-group">
            <label class="f-label">Ism familiya</label>
            <input class="f-input" id="se-name" value="${escHtml(s.fullName)}" onblur="formatNameInputOnBlur(this)"/>
          </div>
          <div class="f-group">
            <label class="f-label">Lavozim</label>
            <select class="f-input" id="se-position">${posOptions}</select>
          </div>
          <button class="btn btn-blue" onclick="saveStaffEdit('${escArg(id)}')">Saqlash</button>`;
      }
      async function saveStaffEdit(id) {
        const fullName = document.getElementById("se-name")?.value.trim();
        const position = document.getElementById("se-position")?.value;
        if (!fullName) return showToast("⚠ Ism bo'sh bo'lmasin");
        try {
          const res = await apiFetch(`/api/staff/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ fullName, position }),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          await loadStaff();
          document.querySelector(".overlay")?.remove();
          renderAdminActiveTab();
          showToast("✅ Saqlandi");
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      function deleteStaff(id, name) {
        showConfirmModal(
          `${escHtml(name)} ni ro'yxatdan olish`,
          "Xodim selectlarda ko'rinmaydi. Oldin belgilangan postlardagi yozuvlar saqlanib qoladi.",
          async () => {
            try {
              const res = await apiFetch(`/api/staff/${id}`, { method: "DELETE" });
              if (!res.ok)
                throw new Error((await res.json().catch(() => ({}))).error || "Xato");
              await loadStaff();
              renderAdminActiveTab();
              showToast("✅ O'chirildi");
            } catch (e) {
              showToast("⚠ " + e.message);
            }
          },
        );
      }

      // Telegram xodimini o'chirish — "Chiqarish" bilan bir xil amal
      // (setUserAccessStatus), faqat ro'yxatdagi kartadan to'g'ridan
      // to'g'ri chaqiriladi. Backend shu bilan birga uning barcha
      // loyiha ruxsatlarini (permissions) ham tozalaydi — shu sabab
      // "faol xodimlar" ro'yxatida ishlamaydigan tag qolib ketmaydi.
      function deleteTelegramUser(username, name) {
        showConfirmModal(
          `${escHtml(name)} ni o'chirish`,
          "Xodim botdan chiqariladi, barcha loyihalardagi ruxsatlari olib tashlanadi va yangi vazifaga mas'ul sifatida tanlanmaydi. Keyinchalik qayta ruxsat berish mumkin.",
          async () => {
            try {
              await setUserAccessStatus(username, "removed");
            } catch (e) {
              showToast("⚠ " + e.message);
            }
          },
          "O'chirish",
        );
      }

      // ── TABEL (TZ 10a–10d) ────────────────────────────────────────
      // ── TABEL — MATRITSA ──────────────────────────────────────────
      // Bitta savolga javob beradi: har loyihada har rol bo'yicha ishni
      // kim qildi va hammasi joyidami. Qator — loyiha, ustun — rol.
      // Katak rangi holatni aytadi; sariq katak bosilsa, kim o'rniga
      // qilgani ochiladi.
      let tbx = null; // /api/tabel/matrix javobi
      let tbxFilter = "all"; // all | sub | missing | own
      let tbxOpen = null; // ochilgan katak: `${slug}:${role}`

      const TBX_STATE = {
        own: { label: "O'zi bajardi", cls: "own" },
        sub: { label: "Zamena bor", cls: "sub" },
        missing: { label: "Qilinmagan", cls: "missing" },
        unrecorded: { label: "Kim qilgani yozilmagan", cls: "unrec" },
      };

      // Oy hali tugamagan bo'lsa bajarilmagan ish "qilinmadi" emas —
      // uning navbati hali kelmagan. O'tgan oyda esa bu haqiqatan
      // bajarilmagan ish.
      function tbxMonthOver() {
        return (tbx?.month || worklogMonth) < isoOf(todayDate()).slice(0, 7);
      }
      function tbxMissingLabel(n) {
        return tbxMonthOver() ? `✕ ${n} ta qilinmadi` : `${n} ta qoldi`;
      }
      function tbxInitial(name) {
        return String(name || "?").trim().slice(0, 1).toUpperCase();
      }
      function tbxAvatar(p, size) {
        const s = size || 24;
        const st = `width:${s}px;height:${s}px;border-radius:${Math.round(s / 3)}px;font-size:${Math.round(s * 0.42)}px`;
        return `<span class="tbx-av" style="${st};background:${personColor(p?.username || p?.name || "?")}">${escHtml(tbxInitial(p?.name))}${avatarImg(p?.avatarUrl)}</span>`;
      }

      async function renderWorklogTab(c) {
        if (!worklogMonth) worklogMonth = isoOf(todayDate()).slice(0, 7);
        if (!tbx) {
          c.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
          try {
            const r = await apiFetch(`/api/tabel/matrix?month=${worklogMonth}`);
            if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Xato");
            tbx = await r.json();
          } catch (e) {
            c.innerHTML = `<div class="empty"><div class="empty-t">Tabel yuklanmadi</div><div class="empty-s">${escHtml(e.message)}</div>
              <button class="btn btn-soft" style="width:auto;padding:0 16px;margin-top:12px" onclick="tbxReload()">Qayta urinish</button></div>`;
            return;
          }
        }
        tbxRender(c);
      }
      function tbxReload() {
        tbx = null;
        tbxOpen = null;
        renderWorklogTab(document.getElementById("admin-body"));
      }
      function tbxShiftMonth(delta) {
        const [y, m] = worklogMonth.split("-").map(Number);
        const d = new Date(Date.UTC(y, m - 1 + delta, 1));
        worklogMonth = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
        tbxReload();
      }
      function tbxSetFilter(f) {
        tbxFilter = f;
        tbxOpen = null;
        tbxRender(document.getElementById("admin-body"));
      }
      // Katakni ochish/yopish. Ochilgan panel qatordan keyin chiziladi,
      // shuning uchun bitta vaqtda bittasi ochiq turadi — ikkitasi
      // ochilsa jadval uzilib ketardi.
      function tbxToggleCell(slug, role) {
        const key = `${slug}:${role}`;
        tbxOpen = tbxOpen === key ? null : key;
        tbxRender(document.getElementById("admin-body"));
      }
      function tbxCloseCell() {
        tbxOpen = null;
        tbxRender(document.getElementById("admin-body"));
      }
      function tbxFiltered() {
        const list = tbx?.projects || [];
        if (tbxFilter === "sub") return list.filter((p) => p.substituted > 0);
        if (tbxFilter === "missing") return list.filter((p) => p.missing > 0);
        if (tbxFilter === "own") return list.filter((p) => p.state === "own");
        return list;
      }

      // Katak — rejadagi xodim, bajarilgan/reja soni va holat satri.
      function tbxCellHtml(p, roleKey, cell) {
        // `data-role` — tor ekranda ustun sarlavhasi yo'q, shuning uchun
        // rol nomi katakning o'zida (CSS ::before) ko'rsatiladi.
        const roleLabel = (tbx.roles.find((r) => r.key === roleKey) || {}).label || roleKey;
        const attr = ` data-role="${escHtml(roleLabel)}"`;
        if (!cell) {
          return `<div class="tbx-cell empty"${attr}><span class="tbx-empty">Biriktirilmagan</span></div>`;
        }
        const open = tbxOpen === `${p.slug}:${roleKey}`;
        const clickable = cell.subs.length > 0;
        const numCls = cell.missing > 0 ? "bad" : cell.done >= cell.plan ? "ok" : "";
        // Katakda bir vaqtda bir nechta holat bo'lishi mumkin: ishning
        // bir qismini boshqa odam qilgan VA bir qismi umuman
        // bajarilmagan. Faqat bittasini ko'rsatish jadvalni yolg'on
        // qilardi, shuning uchun hammasi ketma-ket yoziladi.
        const foots = [];
        if (cell.subs.length) {
          const s0 = cell.subs[0];
          const more = cell.subs.length > 1 ? ` +${cell.subs.length - 1}` : "";
          foots.push(`<div class="tbx-sub">
            ${tbxAvatar(s0, 18)}
            <span class="tbx-sub-name">${escHtml(s0.name)}${more}</span>
            <span class="tbx-sub-n">${cell.substituted} ta</span>
            <span class="tbx-chev${open ? " open" : ""}">${ICON.chevronRight}</span>
          </div>`);
        }
        if (cell.missing > 0) {
          foots.push(`<div class="tbx-note bad">${tbxMissingLabel(cell.missing)}</div>`);
        }
        if (cell.unrecorded > 0) {
          foots.push(`<div class="tbx-note warn">${cell.unrecorded} ta kim qilgani yozilmagan</div>`);
        }
        if (!foots.length) foots.push(`<div class="tbx-note good">✓ O'zi bajardi</div>`);
        const foot = foots.join("");
        const cls = ["tbx-cell", TBX_STATE[cell.state].cls];
        if (open) cls.push("open");
        if (clickable) cls.push("clickable");
        return `<div class="${cls.join(" ")}"${attr}${clickable ? ` onclick="tbxToggleCell('${escArg(p.slug)}','${roleKey}')"` : ""}>
          <div class="tbx-top">
            ${tbxAvatar(cell.planned, 24)}
            <span class="tbx-name">${escHtml(cell.planned ? cell.planned.name : "Biriktirilmagan")}</span>
            <span class="tbx-num ${numCls}">${cell.done}/${cell.plan}</span>
          </div>
          ${foot}
        </div>`;
      }

      // Ochilgan katak — har bir ish alohida katakcha bo'lib, rangi kim
      // qilganini aytadi; o'ngda zamenalar ro'yxati.
      function tbxDetailHtml(p, roleKey, cell) {
        const roleLabel = (tbx.roles.find((r) => r.key === roleKey) || {}).label || roleKey;
        const [y, mm] = tbx.month.split("-").map(Number);
        const plannedColor = personColor(cell.planned?.username || cell.planned?.name || "?");
        const itemLabel = (it) => `${it.type === "k" ? "Post" : "Stories"} ${it.seq}`;

        const cells = cell.items
          .map((it) => {
            const c = it.doer ? personColor(it.doer.username || it.doer.name) : null;
            const d = it.workDate ? parseISO(String(it.workDate).slice(0, 10)) : null;
            const dayLbl = d ? `${d.getDate()}-${WD[(d.getDay() + 6) % 7]}` : "—";
            if (!it.doer) {
              return `<div class="tbx-sq-wrap"><div class="tbx-sq none" title="${escHtml(itemLabel(it))} — kim qilgani yozilmagan">?</div><div class="tbx-sq-lbl">${dayLbl}</div></div>`;
            }
            return `<div class="tbx-sq-wrap">
              <div class="tbx-sq${it.isSub ? " sub" : ""}" style="background:${c}" title="${escHtml(itemLabel(it))} — ${escHtml(it.doer.name)}">${escHtml(it.isSub ? tbxInitial(it.doer.name) : String(it.seq))}</div>
              <div class="tbx-sq-lbl${it.isSub ? " sub" : ""}">${dayLbl}</div>
            </div>`;
          })
          .join("");

        const subRows = cell.subs
          .flatMap((s) =>
            s.items.map((it) => {
              const d = it.workDate ? parseISO(String(it.workDate).slice(0, 10)) : null;
              return `<div class="tbx-srow">
                <div class="tbx-sdate">
                  <div class="tbx-sdate-d">${d ? fmtDay(d) : "—"}</div>
                  <div class="tbx-sdate-w">${d ? WEEKDAYS_FULL[(d.getDay() + 6) % 7] : ""}</div>
                </div>
                <span class="tbx-tag">${escHtml(itemLabel(it))}</span>
                <div style="flex:1"></div>
                ${tbxAvatar(s, 24)}
                <span class="tbx-sname">${escHtml(s.name)}</span>
                ${it.reasonLabel ? `<span class="tbx-reason">${escHtml(it.reasonLabel)}</span>` : ""}
              </div>`;
            }),
          )
          .join("");

        const subTotals = cell.subs
          .map(
            (s) => `<div class="tbx-sfoot">
              ${tbxAvatar(s, 26)}
              <div style="flex:1;min-width:0">
                <div class="tbx-sfoot-t">${escHtml(s.name)} — ${s.count} ta</div>
                <div class="tbx-sfoot-s">${s.jobTitle ? `Asosiy roli: ${escHtml(s.jobTitle)} · ` : ""}bu ishlar unga «qo'shimcha»</div>
              </div>
            </div>`,
          )
          .join("");

        return `<div class="tbx-detail">
          <div class="tbx-dmain">
            <div class="tbx-dhead">
              ${tbxAvatar(cell.planned, 36)}
              <div class="tbx-dhead-main">
                <div class="tbx-dtitle">${escHtml(cell.planned ? cell.planned.name : "Biriktirilmagan")} · ${escHtml(roleLabel)}</div>
                <div class="tbx-dsub">${escHtml(p.label)} · ${MONTHS[mm - 1]} ${y} · ${cell.plan} ta ish</div>
              </div>
              <span class="tbx-chip">O'zi ${cell.own}</span>
              <span class="tbx-chip sub">Zamena ${cell.substituted}</span>
              <button type="button" class="tbx-close" aria-label="Yopish" title="Yopish" onclick="event.stopPropagation();tbxCloseCell()">${ICON.close}</button>
            </div>
            <div class="tbx-dhint">Har katak — bitta ish. Rang — kim qilgani.</div>
            <div class="tbx-squares">${cells || `<div class="tbx-empty">Bu oyda bajarilgan ish yo'q</div>`}</div>
            <div class="tbx-dlegend">
              <span><i style="background:${plannedColor}"></i>${escHtml(cell.planned ? cell.planned.name.split(" ")[0] : "Rejada")} o'zi</span>
              ${cell.subs.map((s) => `<span><i class="sub" style="background:${personColor(s.username || s.name)}"></i>${escHtml(s.name.split(" ")[0])} (zamena)</span>`).join("")}
            </div>
          </div>
          <div class="tbx-dside">
            <div class="tbx-dside-t">${escHtml(cell.planned ? cell.planned.name.split(" ")[0] : "Rejadagi xodim")} o'rniga kim qildi</div>
            ${subRows || `<div class="tbx-empty" style="padding:10px 0">Zamena yo'q</div>`}
            ${subTotals}
          </div>
        </div>`;
      }

      // Oy xulosasi — Tabel ochilganda birinchi ko'rinadigan narsa:
      // oy qanday o'tdi. Tafsilot (qaysi loyihada kim nima qildi)
      // pastdagi jadvalda qoladi.
      function tbxSummaryHtml() {
        const s = tbx.summary;
        if (!s) return "";
        const over = tbxMonthOver();
        const [, mm] = tbx.month.split("-").map(Number);

        // O'tgan oy bilan solishtirish faqat oy tugagach ma'noli —
        // oyning uchinchi kunida "80 punktga tushdi" deyish yolg'on
        // bo'lardi, chunki oyning qolgan qismi hali oldinda.
        let delta = "";
        if (!over) {
          delta = `<div class="tbx-sum-note">oy hali davom etmoqda</div>`;
        } else if (s.deltaPct !== null && s.deltaPct !== 0) {
          const up = s.deltaPct > 0;
          delta = `<div class="tbx-sum-note ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(s.deltaPct)} punkt · o'tgan oy ${s.prevDonePct}%</div>`;
        } else if (s.deltaPct === 0) {
          delta = `<div class="tbx-sum-note">o'tgan oy bilan bir xil</div>`;
        }

        const card = (label, value, unit, extra, cls) => `<div class="tbx-sum-card">
          <div class="tbx-sum-l">${label}</div>
          <div class="tbx-sum-v"><span class="tbx-sum-n${cls ? " " + cls : ""}">${value}</span>${unit ? `<span class="tbx-sum-u">${unit}</span>` : ""}</div>
          ${extra || ""}
        </div>`;

        const worst = s.worst.length
          ? `<div class="tbx-sum-worst">
               <span class="tbx-sum-worst-l">${over ? "Eng ko'p bajarilmagani" : "Eng ko'p qolgani"}:</span>
               ${s.worst.map((w) => `<span class="tbx-sum-worst-i">${escHtml(w.label)} <b>${w.missing}</b></span>`).join("")}
             </div>`
          : `<div class="tbx-sum-worst"><span class="tbx-sum-worst-l">Hamma loyihada reja bajarilgan ✓</span></div>`;

        return `<div class="tbx-sum">
          <div class="tbx-sum-h">${MONTHS[mm - 1]} qanday o'tdi</div>
          <div class="tbx-sum-grid">
            ${card("Reja", s.planned, "ish")}
            ${card("Bajarildi", s.done, `${s.donePct}%`, delta)}

      async function tbxExport(btn) {

          a.download = `tabel-${worklogMonth}.xlsx`;

      async function loadUsersAndRenderPermList() {
        const wrap = document.getElementById("perm-list");
        if (!wrap) return;
        try {
          const [usersRes, rolesRes] = await Promise.all([
            apiFetch("/api/users"),
            apiFetch("/api/permissions/roles"),
          ]);
          if (!usersRes.ok)
            throw new Error((await usersRes.json().catch(() => ({}))).error || "Xato");
          const d = await usersRes.json();
          allUsers = (d.users || []).filter(
            (u) => u.role === "employee" && u.is_active,
          );
          permRoles = rolesRes.ok ? (await rolesRes.json()).roles || {} : {};
          renderPermList();
        } catch (e) {
          wrap.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
        }
      }
      // Loyihaga ruxsat berilgan xodimning shu loyihadagi rolini
      // o'zgartiradi (SMM menejer/montajchi/mobilograf/...) — post/
      // stories Ncoin taqsimoti shu rolga qarab ishlaydi.
      async function setPermissionRole(username, projectSlug, role) {
        const prevRole = permRoles[username]?.[projectSlug] || "";
        (permRoles[username] ||= {})[projectSlug] = role || undefined;
        try {
          const res = await apiFetch("/api/permissions/role", {
            method: "PATCH",
            body: JSON.stringify({ username, projectSlug, role: role || null }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
        } catch (e) {
          showToast("⚠ " + e.message);
          if (prevRole) permRoles[username][projectSlug] = prevRole;
          else delete permRoles[username][projectSlug];
          renderPermList();
        }
      }
      function permRoleSelectHtml(username, projectSlug) {
        const current = permRoles[username]?.[projectSlug] || "";
        const opts = Object.keys(POSITION_LABELS)
          .map((k) => `<option value="${k}"${k === current ? " selected" : ""}>${POSITION_LABELS[k]}</option>`)
          .join("");
        return `<select class="perm-role-select" onclick="event.stopPropagation()" onchange="setPermissionRole('${escArg(username)}','${escArg(projectSlug)}',this.value)">
          <option value=""${current ? "" : " selected"}>— rol yo'q —</option>
          ${opts}
        </select>`;
      }

      // ── RUXSATLAR MATRITSASI (faqat katta ekran) ────────────────────

      // Toggle bosilishi bilan butun ruxsatlar xaritasi PUT qilinadi
      // (backend shartnomasi o'zgarmadi — avvalgidek to'liq xarita kutadi).
      async function togglePermission(username, projectId, btnEl) {
        const list = perms[username] || (perms[username] = []);
        const idx = list.indexOf(projectId);
        const turningOn = idx === -1;
        if (turningOn) list.push(projectId);
        else {
          list.splice(idx, 1);
          // Ruxsat o'chirilsa — roli ham (backendda qator butunlay
          // o'chgani uchun) yo'qoladi; mahalliy keshni ham tozalab
          // qo'yamiz, aks holda keyinroq qayta yoqilganda eski rol
          // vaqtincha (yangilanguncha) noto'g'ri ko'rinib turadi.
          if (permRoles[username]) delete permRoles[username][projectId];
        }
        btnEl.classList.toggle("on", turningOn);
        btnEl.textContent = turningOn ? "✓" : "";
        try {
          const res = await apiFetch("/api/permissions", {
            method: "PUT",
            body: JSON.stringify(perms),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          renderPermList();
        } catch (e) {
          showToast("⚠ " + e.message);
          const i2 = list.indexOf(projectId);
          if (turningOn && i2 !== -1) list.splice(i2, 1);
          else if (!turningOn) list.push(projectId);
          btnEl.classList.toggle("on", !turningOn);
          btnEl.textContent = !turningOn ? "✓" : "";
        }
      }

        }
        try {

            method: "POST",
            body: JSON.stringify({ username }),
          });
          const d = await res.json();
          if (!res.ok) throw new Error(d.error || "Xato");
          inp.value = "";
          showToast(`✅ @${username} qo'shildi`);
          await loadUsersAndRenderPermList();
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      // Har bir holat uchun TZ 10-bandidagi aniq amallar:

          buttons = `<div class="f-row">

            <button class="btn btn-danger" onclick="setUserAccessStatus('${escArg(u.username)}','removed')">Chiqarish</button>
          </div>`;
        } else if (status === "blocked") {
          buttons = `<div class="f-row">

            <button class="btn btn-danger" onclick="setUserAccessStatus('${escArg(u.username)}','removed')">Chiqarish</button>
          </div>`;

          buttons = `<button class="btn btn-blue" onclick="setUserAccessStatus('${escArg(u.username)}','active')">Ruxsat berish</button>`;

          ${dates ? `<div class="f-hint" style="margin-bottom:8px">${dates}</div>` : ""}
          ${buttons}

      }

          <div class="f-group"><label class="f-label">Telefon raqami</label><input class="f-input" id="ue-phone" value="${escHtml(u.phone || "")}" placeholder="+998 90 123 45 67" oninput="formatPhoneInput(this)"/></div>
          <div class="f-group"><label class="f-label">Lavozimi</label><input class="f-input" id="ue-job" value="${escHtml(u.job_title || "")}"/></div>
          <div class="f-group"><label class="f-label">Tug'ilgan sana</label>${renderDateFieldHtml("ue-birth", u.birth_date ? String(u.birth_date).slice(0, 10) : "", "Sana tanlang")}</div>
          <button class="btn btn-blue" id="ue-save-btn" onclick="saveUserEdit('${escArg(username)}')" style="margin-bottom:18px">Saqlash</button>
          ${
            isSuperAdmin
              ? userAccessActionsHtml(u)
              : `<div class="f-hint">Botga kirish holatini faqat Super Admin o'zgartira oladi.</div>`
          }`;
      }
      // openUserEditSheet ikkala ekrandan ham (Boshqaruv → Xodimlar VA
      // Ruxsatlar) ochilishi mumkin — har ikkisi o'z ro'yxatini o'zi
      // yuklaydi, shuning uchun aynan qaysi biri hozir ochiqligini
      // tekshirib, o'shani yangilaymiz.
      async function refreshUsersView() {
        if (document.getElementById("perm-list")) await loadUsersAndRenderPermList();
        else if (document.getElementById("staff-tg-list")) await loadAndRenderTelegramStaff("");
      }
      // Botga kirish holatini o'zgartirish — faqat Super Admin (backend
      // ham shuni talab qiladi, bu yerda faqat UI qulayligi uchun).
      async function setUserAccessStatus(username, status) {
        try {
          const res = await apiFetch(`/api/users/${username}/access`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          document.querySelector(".overlay")?.remove();
          showToast("✅ Holat yangilandi");
          await refreshUsersView();
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      async function saveUserEdit(username) {
        const btn = document.getElementById("ue-save-btn");
        const body = {
          firstName: document.getElementById("ue-first")?.value.trim(),
          lastName: document.getElementById("ue-last")?.value.trim(),
          phone: document.getElementById("ue-phone")?.value.trim(),
          jobTitle: document.getElementById("ue-job")?.value.trim(),
          birthDate: document.getElementById("ue-birth")?.value || null,
        };
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Saqlanmoqda…";
        }
        try {
          const res = await apiFetch(`/api/users/${username}`, {
            method: "PATCH",
            body: JSON.stringify(body),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          document.querySelector(".overlay")?.remove();
          showToast("✅ Saqlandi");
          await refreshUsersView();
        } catch (e) {
          showToast("⚠ " + e.message);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Saqlash";
          }
        }
      }

      function renderAdminAdminsTab(c) {
        c.innerHTML = `
          <div style="max-width:640px">
            <div style="display:flex;gap:8px;margin-bottom:14px">
              <input class="f-input" id="new-admin-input" placeholder="@username" style="flex:1"/>
              <button class="btn btn-blue btn-sm" style="width:auto;padding:0 16px" onclick="addDynamicAdmin()">Qo'shish</button>
            </div>
            <div id="admin-list"><div class="empty"><div class="empty-s">Yuklanmoqda…</div></div></div>
          </div>`;
        refreshAdminList();
      }
      async function refreshAdminList() {
        const listEl = document.getElementById("admin-list");
        if (!listEl) return;
        try {
          const res = await apiFetch("/api/admins");
          const d = await res.json();
          const q = (document.getElementById("admin-search")?.value || "")
            .toLowerCase()
            .trim();
          const match = (u) => !q || u.toLowerCase().includes(q);
          let html = `<div class="sec-upper">Super adminlar (o'zgarmas)</div>`;
          (d.superAdmins || []).filter(match).forEach((u) => {
            html += `<div class="m-item" style="opacity:.65">
              <div class="m-item-info"><div class="m-item-label">@${escHtml(u)}</div></div>
              <span class="debt-badge" style="color:var(--brand);background:rgba(47,122,185,.12)">SUPER</span>
            </div>`;
          });
          html += `<div class="sec-upper" style="margin-top:16px">Qo'shilgan adminlar</div>`;
          const dyn = (d.dynamicAdmins || []).filter(match);
          if (!dyn.length) {
            html += `<div class="empty" style="padding:12px 0"><div class="empty-s">Hali qo'shilmagan</div></div>`;
          } else {
            dyn.forEach((u) => {
              html += `<div class="m-item">
                <div class="m-item-info"><div class="m-item-label">@${escHtml(u)}</div></div>
                <button class="btn btn-sm btn-danger" style="width:auto;padding:0 14px" onclick="removeDynamicAdmin('${escArg(u)}',this)">O'chirish</button>
              </div>`;
            });
          }
          listEl.innerHTML = html;
        } catch (e) {
          listEl.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
        }
      }
      async function addDynamicAdmin() {
        const inp = document.getElementById("new-admin-input");
        if (!inp) return;
        const username = inp.value.trim().replace("@", "");
        if (!username) {
          showToast("⚠ Username kiriting");
          return;
        }
        try {
          const res = await apiFetch("/api/admins", {
            method: "POST",
            body: JSON.stringify({ username }),
          });
          const d = await res.json();
          if (!res.ok) throw new Error(d.error || "Xato");
          inp.value = "";
          showToast(`✅ @${username} admin qilindi`);
          await refreshAdminList();
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      function removeDynamicAdmin(username, btn) {
        showConfirmModal(
          `@${escHtml(username)} ni adminlikdan olish`,
          "Bu foydalanuvchi endi Boshqaruv panelidan foydalana olmaydi.",
          async () => {
            if (btn) {
              btn.disabled = true;
              btn.textContent = "…";
            }
            try {
              const res = await apiFetch(`/api/admins/${username}`, {
                method: "DELETE",
              });
              if (!res.ok)
                throw new Error((await res.json().catch(() => ({}))).error || "Xato");
              showToast(`✅ @${username} admin emas`);
              await refreshAdminList();
            } catch (e) {
              showToast("⚠ " + e.message);
              if (btn) {
                btn.disabled = false;
                btn.textContent = "O'chirish";
              }
            }
          },
          "O'chirish",
        );
      }

      // ── NSHOP BOSHQARUVI (admin) ────────────────────────────────────
      // Mobilda — ixcham kartalar ro'yxati. Desktopda — statistika
      // kartochkalari + to'liq jadval ("Qoldiq" progress-bar
      // `stock_capacity`ga nisbatan — bu "to'liq zaxira", mahsulot
      // yaratilganda yoki qoldiq oshirilganda ko'tariladi, faqat xarid
      // kamaytirganda o'zgarmaydi) + "e'tibor talab qiladi"/"oxirgi
      // xaridlar" panellari (/api/ncoin/admin/nshop-stats).
      let nshopAdminProducts = [];
      let nshopAdminStats = null;
      let nshopAdminSearch = "";
      async function renderNShopAdminTab(c) {
        c.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        await refreshNShopAdminList(c);
      }
      async function refreshNShopAdminList(c) {
        c = c || document.getElementById("admin-body");
        if (!c) return;
        try {
          const [prodRes, statsRes] = await Promise.all([
            apiFetch("/api/ncoin/admin/products"),
            apiFetch("/api/ncoin/admin/nshop-stats"),
          ]);
          const prodData = await prodRes.json();
          if (!prodRes.ok) throw new Error(prodData.error || "Xato");
          nshopAdminProducts = prodData.products || [];
          nshopAdminStats = statsRes.ok ? await statsRes.json() : null;
        } catch (e) {
          c.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        renderNShopAdminBody(c);
      }
      function nshopAdminOnSearch(v) {
        nshopAdminSearch = v;
        renderNShopAdminBody();
      }
      function renderNShopAdminBody(c) {
        c = c || document.getElementById("admin-body");
        if (!c) return;
        const q = nshopAdminSearch.trim().toLowerCase();
        const list = nshopAdminProducts.filter((p) => !q || p.name.toLowerCase().includes(q));
        const s = nshopAdminStats;

        const mobileHtml = `<div class="mobile-only">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <button class="btn btn-blue btn-sm" style="width:auto;padding:0 16px;margin:0" onclick="openNShopProductSheet()">+ Mahsulot qo'shish</button>
            <div style="flex:1"></div>
            <span class="stat-link" onclick="openNcoinAdminHistory()">Ncoin tarixi →</span>
          </div>
          <div class="f-group">
            <input class="f-input" placeholder="Mahsulot qidirish" value="${escHtml(nshopAdminSearch)}" oninput="nshopAdminOnSearch(this.value)"/>
          </div>
          <div id="nshop-admin-list">${
            list.length
              ? list.map(nshopAdminMobileRowHtml).join("")
              : `<div class="empty"><div class="empty-s">Mahsulot topilmadi</div></div>`
          }</div>
        </div>`;

        const desktopHtml = `<div class="desktop-only">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
            <div style="flex:1">
              <div style="font:600 19px inherit;color:var(--ink);letter-spacing:-0.02em">NShop boshqaruvi</div>
              <div style="font-size:12px;color:var(--t2);margin-top:1px">${s ? `${s.productCount} mahsulot · ${s.totalStock} dona qoldiq · ${s.soldThisMonth} xarid` : ""}</div>
            </div>
            <div class="search-box" style="width:220px;margin-top:0">
              <div class="search-ico">${ICON.search}</div>
              <input placeholder="Mahsulot qidirish" value="${escHtml(nshopAdminSearch)}" oninput="nshopAdminOnSearch(this.value)"/>
            </div>
            <span class="stat-link" onclick="openNShopArchivedSheet()">Arxiv</span>
            <button type="button" class="btn btn-blue btn-sm" style="width:auto;padding:0 15px" onclick="openNShopProductSheet()">+ Mahsulot qo'shish</button>
          </div>
          ${s ? nshopAdminStatsGridHtml(s) : ""}
          <div class="dtbl-wrap">
            <table class="dtbl">
              <thead><tr>
                <th>Mahsulot</th><th style="width:90px">Narxi</th><th style="width:170px">Qoldiq</th><th style="width:70px">Sotildi</th><th style="width:80px">Ko'rinsin</th><th style="width:84px;text-align:right">Amal</th>
              </tr></thead>
              <tbody>${
                list.length
                  ? list.map(nshopAdminDesktopRowHtml).join("")
                  : `<tr><td colspan="6" style="text-align:center;color:var(--t3);padding:24px">Mahsulot topilmadi</td></tr>`
              }</tbody>
            </table>
          </div>
          ${s ? nshopAdminEmployeesTableHtml(s.employees) : ""}
          ${s ? nshopAdminBottomGridHtml(s) : ""}
        </div>`;

        c.innerHTML = mobileHtml + desktopHtml;
      }
      // Xodimlar qancha Ncoin ishlab topgani/sarflagani — eng ko'p
      // ishlab topgandan boshlab (jamoa faolligini bir qarashda ko'rish
      // uchun). Faqat desktopda — bu ko'proq "hisobot" xarakterli
      // ma'lumot, mobil admin ko'rinishi ataylab sodda saqlanadi.
      function nshopAdminEmployeesTableHtml(employees) {
        if (!employees) return "";
        const rows = employees.length
          ? employees
              .map(
                (e, i) => `<tr>
                  <td style="width:36px;color:var(--t3);font-variant-numeric:tabular-nums">${i + 1}</td>
                  <td class="dtbl-name">${escHtml(e.name)}<div style="font-weight:400;font-size:11.5px;color:var(--t3);margin-top:1px">@${escHtml(e.username)}${e.jobTitle ? " · " + escHtml(e.jobTitle) : ""}</div></td>
                  <td><div style="display:flex;align-items:center;gap:5px;color:var(--green)"><span class="n-badge" style="width:16px;height:16px;font-size:9.5px;background:var(--green)">N</span>${fmtNcoin(e.earned)}</div></td>
                  <td><div style="display:flex;align-items:center;gap:5px;color:var(--t3)"><span class="n-badge" style="width:16px;height:16px;font-size:9.5px">N</span>${fmtNcoin(e.spent)}</div></td>
                  <td style="font-weight:600;color:var(--ink)">${fmtNcoin(e.balance)}</td>
                </tr>`,
              )
              .join("")
          : `<tr><td colspan="5" style="text-align:center;color:var(--t3);padding:24px">Xodim topilmadi</td></tr>`;
        return `<div class="dtbl-wrap" style="margin-top:20px">
          <div class="card-hdr"><div class="card-hdr-title">Xodimlar bo'yicha Ncoin</div></div>
          <table class="dtbl">
            <thead><tr><th>#</th><th>Xodim</th><th>Ishlab topgan</th><th>Sarflagan</th><th>Balans</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      }
      function nshopAdminStatsGridHtml(s) {
        return `<div class="stat-grid">
          <div class="stat-card">
            <div class="stat-lbl">Mahsulot turi</div>
            <div class="stat-val">${s.productCount}</div>
            <div class="stat-foot">${s.visibleCount} tasi ko'rinadi</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Umumiy qoldiq</div>
            <div class="stat-val">${s.totalStock}</div>
            <div class="stat-foot">${s.totalCapacity} tadan</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Bu oy sotildi</div>
            <div class="stat-val">${s.soldThisMonth}</div>
            <div class="stat-foot">${fmtNcoin(s.revenueThisMonth)} Ncoin</div>
          </div>
          <div class="stat-card danger">
            <div class="stat-lbl">Qoldiq kam</div>
            <div class="stat-val">${s.lowStockCount}</div>
            <div class="stat-foot">to'liq zaxiraning 25%idan kam</div>
          </div>
        </div>`;
      }
      function nshopAdminMobileRowHtml(p) {
        return `<div class="m-item">
          <div class="m-item-info">
            <div class="m-item-label">${escHtml(p.name)}</div>
            <div class="f-hint" style="margin:2px 0 0">🪙 ${fmtNcoin(p.price)} · qoldiq ${p.stock}/${p.stock_capacity} · ${p.sold_count} sotildi · ${p.is_visible ? "Ko'rinadi" : "Yashirilgan"}</div>
          </div>
          <button type="button" class="icon-btn" aria-label="Mahsulot amallari" title="Mahsulot amallari" onclick="openNShopProductMenu('${escArg(p.id)}')">⋯</button>
          <button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 12px" onclick="toggleNShopVisible('${escArg(p.id)}',${p.is_visible})">${p.is_visible ? "Yashirish" : "Ko'rsatish"}</button>
          <button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 12px" onclick="openNShopProductSheet('${escArg(p.id)}')">Tahrirlash</button>
        </div>`;
      }
      function nshopAdminDesktopRowHtml(p) {
        const cap = p.stock_capacity || 0;
        const pct = cap > 0 ? Math.max(0, Math.min(100, Math.round((p.stock / cap) * 100))) : 0;
        return `<tr id="nshop-row-${p.id}"${p.is_visible ? "" : ' style="background:var(--surf2)"'}>
          <td>
            <div style="display:flex;align-items:center;gap:13px">
              ${nshopThumbHtml(p.image_url, "width:44px;height:44px;border-radius:11px")}
              <div>
                <div class="dtbl-name"${p.is_visible ? "" : ' style="color:var(--t2)"'}>${escHtml(p.name)}</div>
                <div style="font-size:11.5px;color:var(--t3);margin-top:2px">${p.is_visible ? "Ko'rinadi" : "Yashirilgan"}</div>
              </div>
            </div>
          </td>
          <td><div style="display:flex;align-items:center;gap:5px"><span class="n-badge" style="width:18px;height:18px;font-size:11px">N</span>${fmtNcoin(p.price)}</div></td>
          <td>
            <div class="dtbl-bar-wrap">
              <div class="hist-track"><div class="hist-fill" style="width:${pct}%;background:${p.is_visible ? "var(--brand)" : "var(--amber)"}"></div></div>
              <span style="font-size:12.5px;color:var(--t5);white-space:nowrap">${p.stock}/${cap}</span>
            </div>
          </td>
          <td>${p.sold_count}</td>
          <td><button type="button" class="tglsw brand ${p.is_visible ? "on" : ""}" onclick="toggleNShopVisible('${escArg(p.id)}',${p.is_visible})"><div class="knob"></div></button></td>
          <td style="text-align:right">
            <div style="display:flex;gap:6px;justify-content:flex-end">
              <button type="button" class="icon-btn" aria-label="Mahsulot qo'shish" title="Mahsulot qo'shish" onclick="openNShopProductSheet('${escArg(p.id)}')" title="Tahrirlash">✎</button>
              <button type="button" class="icon-btn" aria-label="Mahsulot amallari" title="Mahsulot amallari" onclick="openNShopProductMenu('${escArg(p.id)}')" title="Ko'proq">⋯</button>
            </div>
          </td>
        </tr>`;
      }
      function nshopAdminBottomGridHtml(s) {
        const alertsHtml = s.lowStock.length
          ? s.lowStock
              .map((p) => {
                const urgent = !p.isVisible;
                const desc = urgent
                  ? `${p.stock} ta qoldi · hozir yashirilgan`
                  : `${p.stock} ta qoldi · ${p.weeklySales > 0 ? `haftada ~${p.weeklySales} sotiladi` : "kam sotilmoqda"}`;
                const actionHtml = urgent
                  ? `<button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 14px;flex:none" onclick="promptAddStock('${escArg(p.id)}','${escArg(p.name)}')">Qoldiq qo'shish</button>`
                  : `<button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 14px;flex:none" onclick="scrollToNShopProduct('${escArg(p.id)}')">Ko'rish</button>`;
                return `<div style="display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid ${urgent ? "var(--red-bd)" : "var(--bd2)"};border-radius:11px;${urgent ? "background:var(--red-tint)" : ""}">
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:600;font-size:13px;color:var(--ink)">${escHtml(p.name)}</div>
                    <div style="font-size:11.5px;color:var(--t2);margin-top:2px">${desc}</div>
                  </div>
                  ${actionHtml}
                </div>`;
              })
              .join("")
          : `<div class="f-hint" style="padding:6px 0">Hammasi yetarli — kam qoldiq yo'q ✅</div>`;
        const activityHtml = s.recentActivity.length
          ? s.recentActivity
              .map((t) => {
                const positive = t.amount > 0;
                const isStory = positive && NCOIN_STORY_REASONS.has(t.reason);
                const amtColor = !positive ? "var(--red)" : isStory ? "var(--purple)" : "#16a34a";
                const reasonLabel = NCOIN_REASON_LABEL[t.reason] || t.reason;
                const detailText = t.detail ? `${reasonLabel} — ${t.detail}` : reasonLabel;
                return `<div class="nshop-purchase-row">
                  <div class="avatar mute" style="width:28px;height:28px;border-radius:9px;font-size:11px">${escHtml((t.userName || "?").slice(0, 1).toUpperCase())}</div>
                  <div style="flex:1;min-width:0;font-size:12.5px;color:var(--t5)"><b style="color:var(--ink);font-weight:600">${escHtml(t.userName)}</b> · ${escHtml(detailText)}</div>
                  <div style="font-size:11px;color:var(--t4);flex:none">${nshopPurchaseTimeLabel(t.createdAt)}</div>
                  <div class="nshop-purchase-amt" style="width:48px;text-align:right;flex:none;color:${amtColor}">${positive ? "+" : "−"}${fmtNcoin(Math.abs(t.amount))}</div>
                </div>`;
              })
              .join("")
          : `<div class="nshop-purchase-row"><div class="f-hint" style="margin:0">Hali harakat bo'lmagan</div></div>`;
        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
          <div class="rail-card" style="margin-bottom:0;border-color:var(--red-bd)">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
              <span style="width:7px;height:7px;border-radius:99px;background:var(--red);flex:none"></span>
              <div class="rail-title" style="margin:0;flex:1">E'tibor talab qiladi</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px">${alertsHtml}</div>
          </div>
          <div class="nshop-panel">
            <div class="nshop-panel-hdr">
              <div class="nshop-panel-title" style="flex:1">Oxirgi harakatlar</div>
              <span class="stat-link" onclick="openNcoinAdminHistory()">To'liq tarix →</span>
            </div>
            ${ncoinTotalsHtml(s.employees)}
            ${activityHtml}
          </div>
        </div>`;
      }
      // Tizimdagi umumiy Ncoin: qancha ishlab topilgan, qancha
      // sarflangan va hozir xodimlar qo'lida qancha turibdi. Yuqoridagi
      // "Xodimlar bo'yicha Ncoin" jadvalining o'sha ro'yxatidan
      // yig'iladi — ya'ni ikkala raqam doim bir-biriga mos keladi va
      // buning uchun qo'shimcha so'rov kerak emas.
      function ncoinTotalsHtml(employees) {
        if (!employees || !employees.length) return "";
        const earned = employees.reduce((a, e) => a + (e.earned || 0), 0);
        const spent = employees.reduce((a, e) => a + (e.spent || 0), 0);
        const balance = employees.reduce((a, e) => a + (e.balance || 0), 0);
        const item = (label, value, color) => `<div class="ncoin-tot-item">
          <div class="ncoin-tot-lbl">${label}</div>
          <div class="ncoin-tot-val"${color ? ` style="color:${color}"` : ""}>
            <span class="n-badge" style="width:15px;height:15px;font-size:9px${color ? `;background:${color}` : ""}">N</span>${fmtNcoin(value)}
          </div>
        </div>`;
        return `<div class="ncoin-tot">
          ${item("Jami ishlandi", earned, "#16a34a")}
          ${item("Jami sarflandi", spent, "var(--t3)")}
          ${item("Hozirgi qoldiq", balance, "")}
        </div>`;
      }
      // ── TO'LIQ NCOIN TARIXI (admin) ──────────────────────────────
      // NShop panelidagi "Oxirgi harakatlar" faqat oxirgi 6 tasini
      // ko'rsatadi. Bu yerda butun tarix: kim, qachon, nima uchun va
      // qancha olgan yoki ishlatgan — filtr va sahifalash bilan.
      let ncAdmHist = null;
      async function openNcoinAdminHistory() {
        const { body } = makeSheet("Ncoin tarixi — hamma xodimlar");
        ncAdmHist = { body, type: "all", username: "", rows: [], total: 0, earned: 0, spent: 0, hasMore: false, loading: false };
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        await ncAdmHistLoad(true);
      }
      function ncAdmHistSetType(type) {
        if (!ncAdmHist || ncAdmHist.type === type) return;
        ncAdmHist.type = type;
        ncAdmHistLoad(true);
      }
      function ncAdmHistSetUser(username) {
        if (!ncAdmHist) return;
        ncAdmHist.username = username;
        ncAdmHistLoad(true);
      }
      async function ncAdmHistLoad(reset) {
        if (!ncAdmHist || ncAdmHist.loading) return;
        ncAdmHist.loading = true;
        if (reset) ncAdmHist.rows = [];
        const q = new URLSearchParams({ type: ncAdmHist.type, limit: "50", offset: String(ncAdmHist.rows.length) });
        if (ncAdmHist.username) q.set("username", ncAdmHist.username);
        try {
          const res = await apiFetch(`/api/ncoin/admin/history?${q}`);
          const d = await res.json();
          if (!res.ok) throw new Error(d.error || "Xato");
          ncAdmHist.rows = ncAdmHist.rows.concat(d.transactions || []);
          ncAdmHist.total = d.total;
          ncAdmHist.earned = d.earned;
          ncAdmHist.spent = d.spent;
          ncAdmHist.hasMore = d.hasMore;
          ncAdmHist.loading = false;
          ncAdmHistRender();
        } catch (e) {
          ncAdmHist.loading = false;
          ncAdmHist.body.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
        }
      }
      function ncAdmHistRender() {
        const { body, type, username, rows, total, earned, spent, hasMore } = ncAdmHist;
        const chips = [
          ["all", "Barchasi"],
          ["earned", "Olingan"],
          ["spent", "Ishlatilgan"],
        ]
          .map(([f, lbl]) => `<button type="button" class="chip-btn${type === f ? " active" : ""}" onclick="ncAdmHistSetType('${f}')">${lbl}</button>`)
          .join("");

        // Xodim bo'yicha filtr — ro'yxat NShop panelidagi xodimlar
        // jadvalidan olinadi (qo'shimcha so'rovsiz).
        const people = (nshopAdminStats?.employees || []).map(
          (e) => `<option value="${escHtml(e.username)}"${e.username === username ? " selected" : ""}>${escHtml(e.name)}</option>`,
        ).join("");

        const sumHtml =
          type === "spent"
            ? `<div class="f-hint" style="margin:0">Jami ishlatilgan</div>
               <div style="font-size:26px;font-weight:700;color:var(--red);margin-top:4px">−${fmtNcoin(spent)} Ncoin</div>`
            : type === "earned"
              ? `<div class="f-hint" style="margin:0">Jami olingan</div>
                 <div style="font-size:26px;font-weight:700;color:#16a34a;margin-top:4px">+${fmtNcoin(earned)} Ncoin</div>`
              : `<div class="f-hint" style="margin:0">Jami olingan / ishlatilgan</div>
                 <div style="font-size:26px;font-weight:700;margin-top:4px"><span style="color:#16a34a">+${fmtNcoin(earned)}</span> <span style="color:var(--t4);font-weight:400">/</span> <span style="color:var(--red)">−${fmtNcoin(spent)}</span></div>
                 <div class="f-hint" style="margin:4px 0 0">Qoldiq ${fmtNcoin(earned - spent)} Ncoin</div>`;

        body.innerHTML = `
          <div style="text-align:center;padding:4px 0 18px">${sumHtml}</div>
          <div class="chip-group" style="margin-bottom:10px">${chips}</div>
          <div class="f-group">
            <select class="f-input" onchange="ncAdmHistSetUser(this.value)">
              <option value="">Barcha xodimlar</option>
              ${people}
            </select>
          </div>
          ${
            rows.length
              ? `<div class="list-card">${rows
                  .map((t) => ncoinHistoryRowHtml({ ...t, at: t.createdAt }))
                  .join("")}</div>
                 <div class="stat-foot" style="text-align:center;margin-top:12px">${rows.length} / ${total} ta yozuv</div>
                 ${hasMore ? `<button type="button" class="btn btn-soft" style="margin-top:10px" onclick="ncAdmHistLoad(false)">Yana yuklash</button>` : ""}`
              : `<div class="empty"><div class="empty-s">Yozuv topilmadi</div></div>`
          }`;
      }
      function nshopPurchaseTimeLabel(iso) {
        const d = new Date(iso);
        const diff = daysBetween(new Date(d.getFullYear(), d.getMonth(), d.getDate()), todayDate());
        if (diff === 0) return fmtTime(d);
        if (diff === 1) return "kecha";
        return fmtDay(d);
      }
      function scrollToNShopProduct(productId) {
        const el = document.getElementById("nshop-row-" + productId);

      // Mahsulot rasmi — tanlangan zahoti mahalliy oldindan ko'rish
      // ko'rsatiladi, shu bilan bir vaqtda Vercel Blob'ga yuklanadi

      let npImageUrl = null;
      function npImagePreviewInner(url) {
        return url

              <div id="np-image-preview" style="position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;cursor:pointer;flex:none" onclick="document.getElementById('np-image-input').click()">${npImagePreviewInner(npImageUrl)}</div>

            <div style="flex:1"><label class="f-label">Zaxira soni</label><input class="f-input" type="number" min="0" id="np-stock" value="${p ? p.stock : ""}" placeholder="0"/></div>

      function removeNpImage() {
        npImageUrl = null;
        document.getElementById("np-image-preview").innerHTML = npImagePreviewInner(null);
        document.getElementById("np-image-hint").textContent = "Yuklash uchun bosing (4MB gacha)";
        document.getElementById("np-image-remove")?.remove();
      }
      function handleNpImageSelect(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        if (file.size > 4 * 1024 * 1024) {
          showToast("⚠ Rasm hajmi 4MB dan oshmasligi kerak");
          input.value = "";
          return;
        }
        if (!/^image\/(png|jpeg|jpg|webp|gif)$/.test(file.type)) {
          showToast("⚠ Faqat PNG/JPEG/WEBP/GIF rasm qabul qilinadi");
          input.value = "";
          return;
        }
        const preview = document.getElementById("np-image-preview");
        const hint = document.getElementById("np-image-hint");
        const reader = new FileReader();
        reader.onload = async () => {
          const dataUrl = reader.result;
          preview.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;opacity:.5"/><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15);color:#fff"><span class="spinner"></span></div>`;
          hint.textContent = "Yuklanmoqda…";
          try {
            const res = await apiFetch("/api/ncoin/admin/upload-image", {
              method: "POST",
              body: JSON.stringify({ imageBase64: dataUrl }),
            });
            const d = await res.json();
            if (!res.ok) throw new Error(d.error || "Xato");
            npImageUrl = d.url;
            preview.innerHTML = npImagePreviewInner(npImageUrl);
            hint.textContent = "O'zgartirish uchun bosing";
            if (!document.getElementById("np-image-remove")) {
              hint.insertAdjacentHTML(
                "afterend",
                `<span id="np-image-remove" class="stat-link" style="font-size:12px;margin-top:6px;display:inline-block" onclick="removeNpImage()">Rasmni olib tashlash</span>`,
              );
            }
          } catch (e) {
            showToast("⚠ Rasm yuklanmadi: " + e.message);
            preview.innerHTML = npImagePreviewInner(npImageUrl);
            hint.textContent = npImageUrl ? "O'zgartirish uchun bosing" : "Yuklash uchun bosing (4MB gacha)";
          }
        };
        reader.readAsDataURL(file);
      }
      async function saveNShopProduct(productId) {
        const name = document.getElementById("np-name").value.trim();
        if (!name) return showToast("⚠ Mahsulot nomini kiriting");
        const description = document.getElementById("np-desc").value.trim() || null;
        const price = Math.max(0, parseFloat(document.getElementById("np-price").value) || 0);
        const stock = Math.max(0, parseInt(document.getElementById("np-stock").value, 10) || 0);
        const isVisible = document.getElementById("np-visible").checked;
        const btn = document.getElementById("np-save-btn");
        btn.disabled = true;
        btn.textContent = "Saqlanmoqda...";
        try {
          const url = productId ? `/api/ncoin/admin/products/${productId}` : "/api/ncoin/admin/products";
          const res = await apiFetch(url, {
            method: productId ? "PATCH" : "POST",
            body: JSON.stringify({ name, description, price, stock, isVisible, imageUrl: npImageUrl }),
          });
          const d = await res.json();
          if (!res.ok) throw new Error(d.error || "Xato");
          document.querySelector(".overlay")?.remove();
          showToast(`✅ ${name} saqlandi`);
          refreshNShopAdminList();
        } catch (e) {
          showToast("⚠ " + e.message);
          btn.disabled = false;
          btn.textContent = productId ? "Saqlash" : "Qo'shish";
        }
      }
      async function toggleNShopVisible(productId, currentlyVisible) {
        try {
          const res = await apiFetch(`/api/ncoin/admin/products/${productId}`, {
            method: "PATCH",
            body: JSON.stringify({ isVisible: !currentlyVisible }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          refreshNShopAdminList();
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      function promptAddStock(productId, name) {
        const { body } = makeSheet(`${escHtml(name)} — qoldiq qo'shish`);
        body.innerHTML = `
          <div class="f-group">
            <label class="f-label">Necha dona qo'shilsin?</label>

      async function submitAddStock(productId) {
        const qty = parseInt(document.getElementById("as-qty").value, 10);
        if (!qty || qty <= 0) return showToast("⚠ Sonni kiriting");
        const btn = document.getElementById("as-save-btn");
        btn.disabled = true;
        btn.textContent = "Saqlanmoqda...";
        try {
          const current = nshopAdminProducts.find((x) => x.id === productId);
          const newStock = (current ? current.stock : 0) + qty;
          const res = await apiFetch(`/api/ncoin/admin/products/${productId}`, {
            method: "PATCH",
            body: JSON.stringify({ stock: newStock }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          document.querySelector(".overlay")?.remove();
          showToast(`✅ ${qty} dona qo'shildi`);
          refreshNShopAdminList();
        } catch (e) {
          showToast("⚠ " + e.message);
          btn.disabled = false;
          btn.textContent = "Qo'shish";
        }
      }
      // "⋯" — arxivlash (yumshoq, tarix saqlanadi) yoki butunlay

      // ── E'LON (faqat super admin) ─────────────────────────────────

      async function renderAnnouncementTab(c) {
        c.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        if (!announcementUsersList) {
          try {
            const res = await apiFetch("/api/users/directory");

            announcementUsersList = [];

      // Matn maydonidagi yozilayotgan xabar yo'qolib qolmasin deb, qayta
      // chizishdan oldin qiymati saqlanadi va keyin tiklanadi.
      function renderAnnouncementBody(c) {
        const prevMessage = document.getElementById("announcement-message")?.value || "";
        const userRowsHtml = announcementUsersList.length
          ? announcementUsersList
              .map((u) => {
                const name = u.first_name ? `${u.first_name} ${u.last_name || ""}`.trim() : u.full_name || `@${u.username}`;
                const checked = announcementSelected.has(u.username);
                return `<label class="announcement-user-row">

        c.innerHTML = `
          <div style="max-width:520px">
            <div class="f-group">
              <label class="f-label">Kimga yuborilsin</label>
              <div class="seg" style="margin-top:0">
                <button type="button" class="seg-btn${announcementMode === "all" ? " active" : ""}" onclick="setAnnouncementMode('all')">Barchaga</button>

                <button type="button" id="announcement-toggle-all-btn" class="act-card-link" style="height:26px;padding:0 9px;font-size:11px" onclick="toggleAllAnnouncementUsers()">${announcementSelected.size && announcementSelected.size === announcementUsersList.length ? "Hech kimni tanlamaslik" : "Hammasini tanlash"}</button>
              </div>
              <div class="list-card" style="max-height:260px;overflow-y:auto;padding:4px 14px">${userRowsHtml}</div>

              <label class="f-label" for="announcement-message">Xabar matni</label>
              <textarea class="f-input" id="announcement-message" rows="7" maxlength="4000" placeholder="Jamoaga yuboriladigan xabarni yozing..."></textarea>
              <div class="f-hint">${announcementMode === "all" ? "Xabar Telegram chat ID'si ro'yxatdan o'tgan boshqa faol foydalanuvchilarga yuboriladi." : "Xabar faqat yuqorida tanlangan xodimlarga yuboriladi."}</div>

      function announcementSendLabel() {
        if (announcementMode === "all") return "Barchaga yuborish";
        return announcementSelected.size ? `${announcementSelected.size} kishiga yuborish` : "Xodim tanlang";
      }
      function setAnnouncementMode(mode) {
        announcementMode = mode;
        renderAnnouncementBody(document.getElementById("admin-body"));
      }
      // Checkbox bosilganda butun panelni qayta chizmaydi (ro'yxat scroll
      // holati va matn maydoni buzilmasin deb) — faqat sanoq va tugma
      // matnlarini yangilaydi.
      function toggleAnnouncementUser(username, checked) {
        if (checked) announcementSelected.add(username);
        else announcementSelected.delete(username);
        updateAnnouncementCounters();
      }
      function toggleAllAnnouncementUsers() {
        const allSelected = announcementSelected.size === announcementUsersList.length && announcementUsersList.length > 0;
        if (allSelected) announcementSelected.clear();
        else announcementUsersList.forEach((u) => announcementSelected.add(u.username));
        document.querySelectorAll(".announcement-user-cb").forEach((cb) => {
          cb.checked = announcementSelected.has(cb.dataset.username);
        });
        updateAnnouncementCounters();
      }
      function updateAnnouncementCounters() {
        const countLbl = document.getElementById("announcement-count-lbl");
        if (countLbl) countLbl.textContent = announcementSelected.size ? ` · ${announcementSelected.size} tanlangan` : "";
        const toggleAllBtn = document.getElementById("announcement-toggle-all-btn");
        if (toggleAllBtn) {
          toggleAllBtn.textContent =
            announcementSelected.size && announcementSelected.size === announcementUsersList.length
              ? "Hech kimni tanlamaslik"
              : "Hammasini tanlash";
        }
        const sendBtn = document.getElementById("announcement-send-btn");
        if (sendBtn && !sendBtn.disabled) sendBtn.textContent = announcementSendLabel();
      }
      async function sendAnnouncement() {
        const input = document.getElementById("announcement-message");
        const button = document.getElementById("announcement-send-btn");
        const message = input?.value.trim();
        if (!message) {
          showToast("⚠ Xabar matnini yozing");
          return;
        }
        if (announcementMode === "selected" && announcementSelected.size === 0) {
          showToast("⚠ Kamida bitta xodim tanlang");
          return;
        }
        const doneLabel = announcementSendLabel();
        button.disabled = true;
        button.textContent = "Yuborilmoqda...";
        try {
          const body = { message };
          if (announcementMode === "selected") body.usernames = [...announcementSelected];
          const response = await apiFetch("/api/announcements", {
            method: "POST",
            body: JSON.stringify(body),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "Xatolik");
          input.value = "";
          showToast(`✅ ${data.sent}/${data.total} foydalanuvchiga yuborildi`);
        } catch (error) {
          showToast("⚠ " + error.message);
        }
        button.disabled = false;
        button.textContent = doneLabel;
      }

      // ── SHEET / MODAL ─────────────────────────────────────────────

      // panellar uchun). opts.headerHtml — standart sarlavha matni
      // o'rniga maxsus HTML (masalan breadcrumb + prev/next tugmalari).
      function makeSheet(title, opts = {}) {
        const ov = document.createElement("div");
        ov.className = "overlay";
        ov.onclick = (e) => {
          if (e.target === ov) ov.remove();
        };
        const sh = document.createElement("div");
        sh.className = "sheet" + (opts.wide ? " wide" : "");
        sh.innerHTML = `
          <div class="sheet-handle"></div>
          <div class="sheet-hdr">
            ${opts.headerHtml || `<div class="sheet-title">${title}</div>`}
            <button class="sheet-close" onclick="this.closest('.overlay').remove()">×</button>
          </div>
          <div class="sheet-body"></div>`;
        ov.appendChild(sh);
        document.body.appendChild(ov);

      function pfComputeTaskSummary() {
        const username = myProfile?.username || currentUser;
        const today = isoOf(todayDate());
        const scope = tasksList.filter(
          (t) => t.assigneeUsername === username && taskBoardColumn(t) !== "archive",
        );
        const total = scope.length;
        const inProgress = scope.filter((t) => ["in_progress", "review"].includes(t.status)).length;

        const overdue = scope.filter(
          (t) => t.dueDate && t.dueDate < today && !["done", "cancelled"].includes(t.status),
        ).length;
        return { total, inProgress, done, overdue, pct: pct(done, total) };
