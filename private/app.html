          .map((x) => `<div class="actu-prow${x.p.slug === tanlanganSlug ? " is-sel" : ""}" onclick="actUserPickProj('${escArg(x.p.slug)}')">
              <span class="actu-pdot" style="background:${x.rang}"></span>
              <span class="actu-prow-txt">
                <span class="actu-pname">${escHtml(x.p.label)}</span>
                <span class="actu-prow-sub">
                  ${x.st ? `<b class="${x.st.cls}">${x.st.label}</b>` : ""}
                  ${x.kimOrniga ? `<b class="behind">${escHtml(x.kimOrniga)}</b>` : x.eskirgan ? `<b class="behind">· ${x.tanaffus} kundan beri yo'q</b>` : `<span>· ${escHtml(actLastWorkText(x.p.last))}</span>`}
                </span>
              </span>
              ${x.spark.sm}
              <span class="actu-prow-n">${x.p.n}${x.reja ? ` / ${x.reja}` : " ta"}</span>
            </div>`)
          .join("");

        body.innerHTML = `${header}${chartCard}
          <div class="act-seclbl actu-only-d">Loyihalar bo'yicha</div>
          <div class="actu-projs actu-only-d">${projCards || `<div class="act-empty">Loyiha ishi yo'q</div>`}</div>
          <div class="actu-card actu-only-m actu-plist">
            <div class="actu-ptitle">Loyihalar bo'yicha</div>
            ${projRows || `<div class="act-empty">Loyiha ishi yo'q</div>`}
          </div>`;
      }

      // O'sish grafigi: ko'k — joriy oy (oy boshidan to'plangan),
      // kulrang — o'tgan oy, uzuq — shu sur'atdagi prognoz. Pastda
      // kunlik ustunlar. Kompyuter va telefon uchun bir xil chizma,
      // faqat o'lchamlari boshqa.
      function actNiceStep(max) {
        const xom = Math.max(1, max) / 4;
        const daraja = Math.pow(10, Math.floor(Math.log10(xom)));
        return [1, 2, 2.5, 5, 10].map((k) => k * daraja).find((s) => s >= xom) || daraja * 10;
      }
      function actChartSvg(items, monthKey, prevKey, username, otgan, prognoz, mobil, proj) {
        const kunlar = actDaysInMonth(monthKey);
        const C = mobil
          ? { W: 328, H: 190, x0: 24, x1: 280, y0: 130, yTop: 18, barBase: 168, barH: 25, barW: 5, labY: 184, fs: 11, xTicks: [1, 8, 15, 22, kunlar], cw: 2.5, r: 4 }
          : { W: 966, H: 372, x0: 40, x1: 876, y0: 280, yTop: 24, barBase: 352, barH: 40, barW: 14, labY: 368, fs: 11, xTicks: [1, 5, 10, 15, 20, 25, kunlar], cw: 3, r: 5 };

        const ishlar = items.filter((it) => it.kind !== "task");
        const cur = actCumulative(ishlar, monthKey, monthKey === act.today.slice(0, 7) ? act.today : null);
        // Loyiha tanlangan bo'lsa o'tgan oy chizig'i ham faqat shu
        // loyiha bo'yicha chiziladi — aks holda taqqoslash noto'g'ri.
        const prevXom = actUserItems(username, prevKey).filter((it) => it.kind !== "task");
        const prev = actCumulative(proj ? prevXom.filter((it) => it.project && it.project.slug === proj) : prevXom, prevKey);
        const prevKunlar = actDaysInMonth(prevKey);
        const jami = cur.filter((v) => v !== null).pop() || 0;
        const prevJami = prev.length ? prev[prev.length - 1] : 0;
        const step = actNiceStep(Math.max(jami, prevJami, prognoz));
        const maxY = Math.max(step * 4, Math.ceil(Math.max(jami, prevJami, prognoz) / step) * step);
        const X = (i, n) => C.x0 + (i / ((n || kunlar) - 1)) * (C.x1 - C.x0);
        const Y = (v) => C.y0 - (v / maxY) * (C.y0 - C.yTop);
        const pts = (arr, n) =>
          arr
            .map((v, i) => (v === null ? null : `${X(i, n).toFixed(1)},${Y(v).toFixed(1)}`))
            .filter(Boolean)
            .join(" ");
        let oxirgiI = cur.length - 1;
        while (oxirgiI > 0 && cur[oxirgiI] === null) oxirgiI--;
        const bugunX = X(oxirgiI);
        const tugamagan = otgan < kunlar;

        // Y o'qi va to'r chiziqlari
        let g = "";
        for (let v = 0; v <= maxY; v += step) {
          const y = Y(v);
          g += `<line x1="${C.x0}" x2="${C.x1}" y1="${y}" y2="${y}" stroke="${v === 0 ? "#dde1e6" : "#eef0f3"}"/>
            <text x="${C.x0 - 10}" y="${y + 4}" font-size="${C.fs}" font-weight="500" fill="#7a828e" text-anchor="end">${v}</text>`;
        }
        // Kunlik ustunlar
        const byDay = actDayCounts(items);
        const maxKun = Math.max(1, ...Object.values(byDay));
        let bars = "";
        for (let d = 1; d <= kunlar; d++) {
          const iso = `${monthKey}-${actPad(d)}`;
          const n = byDay[iso] || 0;
          if (!n) continue;
          const h = Math.max(3, Math.round((n / maxKun) * C.barH));
          const x = X(d - 1) - C.barW / 2;
          const tanlangan = actUserState && actUserState.day === iso;
          bars += `<rect x="${x.toFixed(1)}" y="${C.barBase - h}" width="${C.barW}" height="${h}" rx="${mobil ? 1.5 : 3}" fill="${tanlangan ? "#2f7ab9" : "#a7c9e6"}"/>`;
        }
        const xlab = C.xTicks
          .map(
            (d) =>
              `<text x="${X(d - 1).toFixed(1)}" y="${C.labY}" font-size="${C.fs}" font-weight="${d === otgan ? 700 : 500}" fill="${d === otgan ? "#0e1726" : "#7a828e"}" text-anchor="middle">${d}</text>`,
          )
          .join("");

        const maydon = `${pts(cur)} ${bugunX.toFixed(1)},${C.y0}`;
        return `<svg viewBox="0 0 ${C.W} ${C.H}" class="actu-svg" preserveAspectRatio="xMidYMid meet">
          ${g}
          ${tugamagan ? `<line x1="${bugunX.toFixed(1)}" x2="${bugunX.toFixed(1)}" y1="${C.yTop - 4}" y2="${C.y0}" stroke="#c3c9d1" stroke-dasharray="3 4"/>
            <text x="${bugunX.toFixed(1)}" y="${C.yTop - 10}" font-size="${C.fs}" font-weight="600" fill="#0e1726" text-anchor="middle">${mobil ? "Bugun" : `Bugun — ${jami} ta`}</text>` : ""}
          ${prevJami ? `<polyline points="${pts(prev, prevKunlar)}" fill="none" stroke="#b8bec6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
          <polygon points="${C.x0},${C.y0} ${maydon}" fill="rgba(47,122,185,.08)"/>
          ${tugamagan ? `<line x1="${bugunX.toFixed(1)}" y1="${Y(jami).toFixed(1)}" x2="${C.x1}" y2="${Y(prognoz).toFixed(1)}" stroke="#2f7ab9" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" opacity=".75"/>` : ""}
          <polyline points="${pts(cur)}" fill="none" stroke="#2f7ab9" stroke-width="${C.cw}" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${bugunX.toFixed(1)}" cy="${Y(jami).toFixed(1)}" r="${C.r}" fill="#2f7ab9"/>
          ${tugamagan ? `<text x="${C.x1 + 6}" y="${(Y(prognoz) + 4).toFixed(1)}" font-size="${mobil ? 11 : 12}" font-weight="600" fill="#255f91" text-anchor="start">${mobil ? prognoz : "Prognoz " + prognoz}</text>` : ""}
          ${prevJami ? `<text x="${C.x1 - (mobil ? 3 : 20)}" y="${(Y(prevJami) + 4).toFixed(1)}" font-size="${mobil ? 11 : 12}" font-weight="600" fill="#7a828e" text-anchor="start">${mobil ? prevJami : MONTHS[Number(prevKey.slice(5, 7)) - 1] + " " + prevJami}</text>` : ""}
          ${bars}
          <line x1="${C.x0}" x2="${C.x1}" y1="${C.barBase}" y2="${C.barBase}" stroke="#dde1e6"/>
          ${mobil ? "" : `<text x="${C.x0 - 10}" y="${C.barBase - 8}" font-size="${C.fs}" font-weight="500" fill="#7a828e" text-anchor="end">Kunlik</text>`}
          ${xlab}
        </svg>`;
      }

      // Loyiha kartasidagi kichik chiziq: to'plangan ishlar va (reja
      // bo'lsa) uzuq chiziq bilan reja sur'ati.
      function actSparkSvg(p, monthKey, otgan, kunlar, reja, rang) {
        const byDay = p.days;
        const seriya = [];
        let sum = 0;
        for (let d = 1; d <= otgan; d++) {
          sum += byDay[`${monthKey}-${actPad(d)}`] || 0;
          seriya.push(sum);
        }
        const maxV = Math.max(1, reja || sum, sum);
        const chiz = (W, H) => {
          const x0 = 2;
          const x1 = W - 2;
          const yb = H - 3;
          const yt = 4;
          const X = (i) => x0 + (i / Math.max(1, kunlar - 1)) * (x1 - x0);
          const Y = (v) => yb - (v / maxV) * (yb - yt);
          const pts = seriya.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
          const oxirgi = seriya.length ? seriya[seriya.length - 1] : 0;
          return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="actu-spark">
            <line x1="${x0}" x2="${x1}" y1="${yb}" y2="${yb}" stroke="#eef0f3"/>
            ${reja ? `<line x1="${x0}" y1="${yb}" x2="${x1}" y2="${Y(reja).toFixed(1)}" stroke="#c3c9d1" stroke-width="1.5" stroke-dasharray="3 3"/>` : ""}
            <polyline points="${pts}" fill="none" stroke="${rang}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            <circle cx="${X(seriya.length - 1).toFixed(1)}" cy="${Y(oxirgi).toFixed(1)}" r="3" fill="${rang}"/>
          </svg>`;
        };
        return { big: chiz(163, 44), sm: chiz(72, 26) };
      }

      // ── TARIX (barcha loyihalarning davrlari) ─────────────────────
      function setHistFilter(k) {
        histState.filter = k;
        renderHistoryRows();
      }
      function setHistSort(v) {
        histState.sort = v;
        renderHistoryRows();
      }
      async function openHistoryTab() {
        renderHistChips();
        if (!histState.loaded) {
          document.getElementById("history-body").innerHTML =
            `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
          const rows = [];
          await Promise.all(
            projects.map(async (project) => {
              try {
                const r = await apiFetch(`/api/projects/${project.id}/cycles`);
                if (!r.ok) return;
                const d = await r.json();
                (d.cycles || []).forEach((cycle) => rows.push({ project, cycle }));
              } catch (e) {
                console.warn("History load error:", e.message);
              }
            }),
          );
          histState.rows = rows;
          histState.loaded = true;
        }
        renderHistoryRows();
      }
      function renderHistChips() {
        const chips = [
          { key: "all", label: "Hammasi" },
          { key: "active", label: "Davom etmoqda" },
          { key: "debt", label: "Qarzli", danger: true },
          { key: "done", label: "Tugagan" },
        ];
        document.getElementById("hist-chips").innerHTML = chips
          .map((c) => {
            const cls =
              "chip-btn" +
              (histState.filter === c.key ? " active" : c.danger ? " danger" : "");
            return `<button class="${cls}" onclick="setHistFilter('${c.key}')">${c.label}</button>`;
          })
          .join("");
      }
      function renderHistoryRows() {
        renderHistChips();
        const body = document.getElementById("history-body");
        if (!histState.loaded) return;
        const q = (document.getElementById("hist-search")?.value || "")
          .toLowerCase()
          .trim();
        const filtered = histState.rows
          .filter(({ project, cycle }) => {
            // Qarz — "davom etmoqda"dan ustun. Avval `active` birinchi
            // tekshirilardi, shuning uchun muddati o'tgan-u hali
            // yopilmagan davr "Joriy" bo'lib qolardi va "Qarzli"
            // filtriga hech qachon tushmasdi.
            const status = cycle.isDebt ? "debt" : cycle.status === "active" ? "active" : "done";
            const hay =
              `${project.label} ${project.id} ${cycle.periodStart} ${cycle.periodEnd}`.toLowerCase();
            return (
              (histState.filter === "all" || status === histState.filter) &&
              (!q || hay.includes(q))
            );
          })
          .sort((a, b) => {
            const dir = histState.sort === "oldest" ? 1 : -1;
            return a.cycle.periodStart.localeCompare(b.cycle.periodStart) * dir;
          });

        const head = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
          <div class="sec-upper" style="margin:0">${filtered.length} ta davr</div>
          <select class="sel" onchange="setHistSort(this.value)">
            <option value="newest"${histState.sort === "newest" ? " selected" : ""}>Yangi → eski</option>
            <option value="oldest"${histState.sort === "oldest" ? " selected" : ""}>Eski → yangi</option>
          </select>
        </div>`;

        if (!filtered.length) {
          body.innerHTML =
            head +
            `<div class="empty"><div class="empty-ico">⌕</div><div class="empty-t">Natija topilmadi</div><div class="empty-s">Qidiruv yoki filtr shartini o'zgartirib ko'ring.</div></div>`;
          return;
        }

        body.innerHTML =
          head +
          filtered
            .map(({ project, cycle }, i) => {
              const done = (cycle.doneK || 0) + (cycle.doneS || 0);
              const total = (cycle.k || 0) + (cycle.s || 0);
              const percent = pct(done, total);
              const status = cycle.isDebt ? "debt" : cycle.status === "active" ? "active" : "done";
              const statusLabel =
                status === "active" ? "Joriy" : status === "debt" ? "Qarz" : "Tugagan";
              const assignees = Object.entries(perms)
                .filter(([, ids]) => (ids || []).includes(project.id))
                .map(([u]) => "@" + u);
              return `<div class="hist-card" id="hist-${i}">
                <div class="hist-head" onclick="document.getElementById('hist-${i}').classList.toggle('open')">
                  <div class="avatar mute">${initials(project.label)}</div>
                  <div style="flex:1;min-width:0">
                    <div class="hist-name">${escHtml(project.label)}</div>
                    <div class="hist-date">${cycle.periodStart} → ${cycle.periodEnd}</div>
                  </div>
                  <div class="hist-pct num">${percent}%</div>
                  <span class="hist-status ${status}">${statusLabel}</span>
                  <span class="c-chev">▾</span>
                </div>
                <div class="hist-body">
                  <div class="hist-meta">
                    <span>Post ${cycle.doneK || 0}/${cycle.k || 0} · Stories ${cycle.doneS || 0}/${cycle.s || 0}</span>
                    <span>${status === "active" ? "Faol davr" : "Yopilgan davr"}</span>
                  </div>
                  <div class="hist-track"><div class="hist-fill" style="width:${percent}%"></div></div>
                  <div class="hist-assignees">${assignees.length ? "Biriktirilgan: " + assignees.map(escHtml).join(", ") : "Biriktirilgan xodimlar ko'rsatilmagan"}</div>
                  <button class="btn btn-soft btn-sm" style="margin-top:12px" onclick="openProjectHistorySheet('${escArg(project.id)}','${escArg(project.label)}')">Davrlarni ochish</button>
                </div>
              </div>`;
            })
            .join("");
      }

      // ── TRACKER ───────────────────────────────────────────────────
      function openTracker(id) {
        const p = projects.find((x) => x.id === id);
        if (!p) return;
        trackerProjectId = id;
        trackerType = p.k > 0 ? "k" : "s";
        openSubScreen("screen-tracker", closeTracker);
        renderTracker();
      }
      function closeTracker() {
        trackerProjectId = null;
        showTab(activeTab);
      }
      function setTrackerType(t) {
        trackerType = t;
        renderTracker();
      }
      function openTrackerMenu() {
        const p = projects.find((x) => x.id === trackerProjectId);
        if (!p) return;
        const { body } = makeSheet(escHtml(p.label));
        body.innerHTML = `
          <button class="btn btn-soft" style="margin-bottom:10px" onclick="document.querySelector('.overlay').remove();openProjectHistorySheet('${escArg(p.id)}','${escArg(p.label)}')">Davrlar tarixi</button>
          ${isAdmin ? `<button class="btn btn-soft" style="margin-bottom:10px" onclick="document.querySelector('.overlay').remove();openProjectEditSheet('${escArg(p.id)}')">Loyihani tahrirlash</button>` : ""}
          ${isAdmin ? `<button class="btn btn-danger" onclick="document.querySelector('.overlay').remove();archiveProject('${escArg(p.id)}','${escArg(p.label)}',null)">Arxivlash</button>` : ""}`;
      }
      function renderTracker() {
        const p = projects.find((x) => x.id === trackerProjectId);
        if (!p) return closeTracker();
        document.getElementById("trk-name").textContent = p.label;
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const today = todayDate();
        const daysLeft = projDaysLeft(p);
        document.getElementById("trk-period").textContent =
          `${MONTHS[start.getMonth()]} ${start.getFullYear()} · ${daysLeft >= 0 ? daysLeft + " kun qoldi" : "muddat tugagan"}`;

        const segK = document.getElementById("trk-seg-k");
        const segS = document.getElementById("trk-seg-s");
        segK.textContent = `Postlar ${p.doneK}/${p.k}`;
        segS.textContent = `Stories ${p.doneS}/${p.s}`;
        segK.style.display = p.k > 0 ? "flex" : "none";
        segS.style.display = p.s > 0 ? "flex" : "none";
        segK.className = "seg-btn" + (trackerType === "k" ? " active" : "");
        segS.className = "seg-btn" + (trackerType === "s" ? " active" : "");

        const count = trackerType === "k" ? p.k : p.s;
        const done = trackerType === "k" ? p.doneK : p.doneS;
        document.getElementById("trk-prog-fill").style.width = pct(done, count) + "%";

        const totalDays = daysBetween(start, end) + 1;
        let elapsedIdx = daysBetween(start, today);
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const tick = document.getElementById("trk-prog-tick");
        if (today >= start && today <= end) {
          tick.style.display = "block";
          tick.style.left =
            (totalDays > 1 ? (elapsedIdx / (totalDays - 1)) * 100 : 100) + "%";
        } else {
          tick.style.display = "none";
        }
        const expected =
          totalDays > 0 ? Math.round(((elapsedIdx + 1) / totalDays) * count) : 0;
        const delta = done - expected;
        const deltaEl = document.getElementById("trk-prog-delta");
        deltaEl.textContent = delta === 0 ? "±0" : delta > 0 ? "+" + delta : String(delta);
        deltaEl.className = "trk-prog-delta" + (delta >= 0 ? " ok" : "");

        // ── KALENDAR: faqat haqiqatda bajarilgan kunlar ─────────────
        const dayMap = buildDayMap(p, trackerType);
        const checks = p.checks || {};
        const det = p.checkDetails || {};
        const firstWeekday = (start.getDay() + 6) % 7; // Dushanba = 0
        let cells = "";
        for (let i = 0; i < firstWeekday; i++)
          cells += `<div class="cal-cell empty"></div>`;
        for (let d = 0; d < totalDays; d++) {
          const cur = new Date(start);
          cur.setDate(cur.getDate() + d);
          const key = isoOf(cur);
          const seqs = dayMap[key] || [];
          const isToday = key === isoOf(today);
          let cls = "cal-cell",
            inner;
          if (seqs.length) {
            // Shu kuni nechta chiqqan bo'lsa — o'sha son yoziladi
            cls += " done" + (isToday ? " done-today" : "");
            inner = `<div class="cn">${cur.getDate()}</div><div class="cs num">${seqs.length}</div>`;
          } else if (isToday) {
            cls += " today";
            inner = `<div class="cn">${cur.getDate()}</div><div class="cs">bugun</div>`;
          } else {
            cls += " pending";
            inner = `<div class="cn">${cur.getDate()}</div>`;
          }
          cells += `<div class="${cls}"${seqs.length ? ` title="${seqs.map((n) => (trackerType === "k" ? "Post " : "Stories ") + n).join(", ")}" onclick="openDayCell('${escArg(p.id)}','${trackerType}',[${seqs.join(",")}])"` : ""}>${inner}</div>`;
        }

        // ── BUGUN BELGILANGANLAR ────────────────────────────────────
        const todayKey = isoOf(today);
        const kToday = buildDayMap(p, "k")[todayKey] || [];
        const sToday = buildDayMap(p, "s")[todayKey] || [];
        const doneRow = (type, n, idx) => {
          const info = det[`${type}-${n}`] || {};
          const who = [info.editorName, info.videographerName]
            .filter(Boolean)
            .join(" · ");
          const label = `${idx}-${type === "k" ? "post" : "stories"}`;
          return `<div class="today-task done" onclick="openCheckModal('${escArg(p.id)}','${type}',${n})">
            <div class="today-box checked">✓</div>
            <div style="flex:1;min-width:0">
              <div class="today-lbl" style="text-decoration:none">${label}</div>
              ${who ? `<div class="r-sub">${escHtml(who)}</div>` : ""}
            </div>
            <div class="chev">›</div>
          </div>`;
        };
        let todayHtml = "";
        kToday.forEach((n, i) => (todayHtml += doneRow("k", n, i + 1)));
        sToday.forEach((n, i) => (todayHtml += doneRow("s", n, i + 1)));
        if (!todayHtml)
          todayHtml = `<div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Bugun hali hech narsa belgilanmagan</div>`;

        // ── BARCHA VAZIFALAR: 1..N alohida checkbox ─────────────────
        const typeLabel = trackerType === "k" ? "Post" : "Stories";
        let allHtml = "";
        for (let i = 1; i <= count; i++) {
          const on = !!checks[`${trackerType}-${i}`];
          allHtml += `<label class="cbi">
            <input type="checkbox" ${on ? "checked" : ""} onchange="onCheckboxToggle(event,'${escArg(p.id)}','${trackerType}',${i},this.checked)"/>
            <span class="cbi-box">${i}</span>
          </label>`;
        }

        document.getElementById("tracker-body").innerHTML = `
          <div class="cal-week">${WD.map((w) => `<span>${w}</span>`).join("")}</div>
          <div class="cal-grid">${cells}</div>
          <div class="cal-legend">
            <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--brand)"></div>bajarilgan (son = shu kuni nechta chiqqani)</div>
          </div>
          <div class="list-card" style="margin-top:16px">
            <div style="padding:11px 14px;border-bottom:1px solid var(--bd1);font-weight:600;font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase">${fmtDay(today)} · bugun belgilangan</div>
            ${todayHtml}
          </div>
          <div class="sec-upper" style="margin:20px 0 9px">Barcha ${trackerType === "k" ? "postlar" : "stories"}</div>
          <div class="list-card" style="padding:14px">
            <div class="cb-row">${allHtml}</div>
            <div class="f-hint" style="margin-top:12px">${trackerType === "k" ? "Post belgilanganda kim montaj qilgani va kim video olgani so'raladi." : "Belgilangan " + typeLabel.toLowerCase() + " bugungi kunga yoziladi — sanani o'zgartirish uchun ustiga bosing."}</div>
          </div>`;

        const railEl = document.getElementById("trk-rail");
        if (railEl) railEl.innerHTML = buildTrackerRailHtml(p);
      }

      // Muddati o'tgan (checksiz, kutilgan sanasi allaqachon o'tgan)
      // elementlar — bir tekis taqsimot asosida (xuddi trk-prog-tick
      // hisoblagani kabi, faqat har bir raqam uchun alohida).
      function findOverdueItems(p, type) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const today = todayDate();
        const totalDays = daysBetween(start, end) + 1;
        let elapsedIdx = daysBetween(start, today);
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const count = type === "k" ? p.k : p.s;
        const checks = p.checks || {};
        const items = [];
        for (let i = 1; i <= count; i++) {
          if (checks[`${type}-${i}`]) continue;
          const dueIdx =
            totalDays > 1 ? Math.round(((i - 1) / (count - 1 || 1)) * (totalDays - 1)) : 0;
          if (dueIdx <= elapsedIdx) items.push({ type, n: i, daysLate: elapsedIdx - dueIdx });
        }
        return items;
      }

      // ── TRACKER O'NG PANELI (faqat katta ekran — "MUDDAT") ─────────
      // Loyihaning haftalik hisobi.
      //
      // REJA qat'iy emas: har hafta boshida QOLGAN ishlar QOLGAN
      // haftalarga teng taqsimlanadi. Ya'ni bir haftada reja
      // bajarilmasa, farqi keyingi haftalarga ko'chadi va oy oxiriga
      // hammasi yozilib ulguradi. Avval reja chiziqli "muddat" kuni
      // bo'yicha qat'iy bo'lgani uchun o'tkazib yuborilgan ish
      // keyingi haftalarda ko'rinmay qolar, oxirgi haftada esa
      // birdan qalashib ketardi.
      //
      // BAJARILGAN son — checkDetails'dagi haqiqiy workDate asosida
      // (buildDayMap kabi). Ish sanasi yo'q yoki davrdan tashqaridagi
      // belgilangan ishlar haftaga yozilmaydi, lekin bajarilgan
      // hisoblanadi — shuning uchun ular rejadan chiqarib tashlanadi.
      function computeWeeklyProgress(p) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const totalDays = daysBetween(start, end) + 1;
        const weeks = Math.max(1, Math.min(5, Math.ceil(totalDays / 7)));
        const bounds = [];
        for (let w = 0; w < weeks; w++) {
          const s = w === 0 ? 0 : bounds[w - 1].end + 1;
          const e = Math.min(totalDays - 1, Math.round(((w + 1) / weeks) * totalDays) - 1);
          bounds.push({ start: s, end: Math.max(s, e) });
        }
        const weekOf = (idx) => {
          for (let w = 0; w < bounds.length; w++) if (idx <= bounds[w].end) return w;
          return bounds.length - 1;
        };
        const rows = bounds.map(() => ({
          plannedK: 0, plannedS: 0, doneK: 0, doneS: 0, idealK: 0, idealS: 0,
        }));

        const det = p.checkDetails || {};
        const checks = p.checks || {};
        // Haftaga yozib bo'lmagan, lekin bajarilgan ishlar
        let sanasizK = 0;
        let sanasizS = 0;
        Object.keys(checks).forEach((key) => {
          if (!checks[key]) return;
          const post = key.startsWith("k-");
          if (!post && !key.startsWith("s-")) return;
          const wd = det[key] && det[key].workDate;
          const idx = wd ? daysBetween(start, parseISO(String(wd).slice(0, 10))) : -1;
          if (!wd || idx < 0 || idx >= totalDays) {
            if (post) sanasizK++;
            else sanasizS++;
            return;
          }
          const w = weekOf(idx);
          if (post) rows[w].doneK++;
          else rows[w].doneS++;
        });

        // Bugun qaysi haftada — undan keyingi haftalar uchun reja
        // bajariladi deb olinadi, o'tganlari uchun esa haqiqat.
        let elapsedIdx = daysBetween(start, todayDate());
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const current = weekOf(elapsedIdx);

        // `ideal` — hech narsa o'tkazilmaganda reja qanday bo'lishini
        // ko'rsatadi; ikkisining farqi "necha ta ish ko'chdi" degani.
        const taqsimla = (jami, tashqari, reja, bajarilgan, ideal) => {
          let qolgan = Math.max(0, jami - tashqari);
          let tekis = qolgan;
          for (let w = 0; w < rows.length; w++) {
            const qoldiHafta = rows.length - w;
            rows[w][reja] = Math.ceil(qolgan / qoldiHafta);
            rows[w][ideal] = Math.ceil(tekis / qoldiHafta);
            tekis = Math.max(0, tekis - rows[w][ideal]);
            // O'tgan hafta — haqiqat (bajarilmagani keyinga ko'chadi).
            // Joriy hafta — rejasi bajariladi deb olinadi, aks holda
            // uning yuki keyingi haftalarda IKKI marta hisoblanardi;
            // bajarilmasa, kelasi hafta o'zi qayta taqsimlaydi.
            const yechildi =
              w < current ? rows[w][bajarilgan] : Math.max(rows[w][reja], rows[w][bajarilgan]);
            qolgan = Math.max(0, qolgan - yechildi);
          }
        };
        taqsimla(p.k, sanasizK, "plannedK", "doneK", "idealK");
        taqsimla(p.s, sanasizS, "plannedS", "doneS", "idealS");
        return { rows, current };
      }
      // Haftalik progress grafigi: ustun balandligi shu haftadagi umumiy
      // hajmni (post+stories), to'ldirilgan qism esa bajarilish foizini
      // bildiradi. Tafsilot hover orqali emas — ustunning o'ziga
      // bosish/tegish orqali pastdagi doimiy ko'rinadigan panelda
      // ochiladi (mobilda hover ishlamaydi, nuqtaga aniq tegish qiyin
      // edi — endi butun ustun bitta katta bosish nishoni).
      function buildWeeklyProgressHtml(p) {
        // Standart tanlangan hafta — bugungi kun tushadigan hafta; u
        // hisobning o'zida aniqlanadi, shunda ikki joyda ikki xil
        // chiqib qolmaydi.
        const { rows: weekly, current: defaultWeek } = computeWeeklyProgress(p);
        const volumes = weekly.map((r) => Math.max(r.plannedK + r.plannedS, r.doneK + r.doneS));
        const maxVolume = Math.max(1, ...volumes);

        const barsHtml = weekly
          .map((r, w) => {
            const planned = r.plannedK + r.plannedS;
            const done = r.doneK + r.doneS;
            const fillPct = planned > 0 ? Math.min(100, Math.round((done / planned) * 100)) : done > 0 ? 100 : 0;
            const trackH = Math.max(10, Math.round((volumes[w] / maxVolume) * 52));
            return `<div class="wk-bar-col${w === defaultWeek ? " active" : ""}" onclick="showWeekDetail(this,'${escArg(p.id)}',${w})">
              <div class="wk-bar-track" style="height:${trackH}px">
                <div class="wk-bar-fill" style="height:${fillPct}%"></div>
              </div>
              <div class="wk-bar-lbl">${w + 1}-h</div>
            </div>`;
          })
          .join("");

        return `<div class="wk-bars">${barsHtml}</div>
          <div class="wk-detail" id="wk-detail">${weekDetailHtml(weekly[defaultWeek], defaultWeek)}</div>`;
      }
      function weekDetailHtml(r, w) {
        // Reja tekis taqsimotdan farq qilsa — nega farq qilayotgani
        // aytiladi, aks holda son "o'z-o'zidan o'zgargandek" ko'rinadi.
        const kochgan = r.plannedK + r.plannedS - (r.idealK + r.idealS);
        const izoh =
          kochgan > 0
            ? `<div class="wk-detail-note late">Oldingi haftalardan ${kochgan} ta ish ko'chdi</div>`
            : kochgan < 0
              ? `<div class="wk-detail-note">Oldindan bajarilgani uchun ${-kochgan} ta kam</div>`
              : "";
        return `<div class="wk-detail-title">${w + 1}-hafta</div>
          <div class="mini-stat-row">
            <div class="mini-stat"><div class="mini-stat-val">${r.doneK}/${r.plannedK}</div><div class="mini-stat-lbl">Post</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${r.doneS}/${r.plannedS}</div><div class="mini-stat-lbl">Stories</div></div>
          </div>
          ${izoh}`;
      }
      function showWeekDetail(el, projectId, w) {
        const p = projects.find((pr) => pr.id === projectId);
        if (!p) return;
        const { rows: weekly } = computeWeeklyProgress(p);
        if (!weekly[w]) return;
        el.parentElement
          .querySelectorAll(".wk-bar-col")
          .forEach((c) => c.classList.toggle("active", c === el));
        const detailEl = el.closest(".rail-card")?.querySelector("#wk-detail");
        if (detailEl) detailEl.innerHTML = weekDetailHtml(weekly[w], w);
      }

      function buildTrackerRailHtml(p) {
        const todayItems = buildTodayItems(p);
        let kTodayIdx = 0,
          sTodayIdx = 0;
        const todayHtml = todayItems.length
          ? todayItems
              .map((it) => {
                const idx = it.type === "k" ? ++kTodayIdx : ++sTodayIdx;
                const label = `${idx}-${it.type === "k" ? "post" : "stories"}`;
                return `<div class="rail-item">
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${label}</div>
                  </div>
                </div>`;
              })
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Bugun hali hech narsa belgilanmagan</div>`;

        const overdue = [...findOverdueItems(p, "k"), ...findOverdueItems(p, "s")].sort(
          (a, b) => b.daysLate - a.daysLate,
        );
        const overdueHtml = overdue.length
          ? overdue
              .slice(0, 6)
              .map(
                (it) => `<div class="rail-item">
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${it.type === "k" ? "Post" : "Stories"} ${it.n}</div>
                    <div class="r-sub" style="color:var(--red)">${it.daysLate} kun kechikdi</div>
                  </div>
                </div>`,
              )
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Kechikkan vazifa yo'q</div>`;

        const barsHtml = buildWeeklyProgressHtml(p);

        // Maslahat matni ustunlar bilan bir xil hisobdan olinadi —
        // aks holda pastdagi son tepadagi rejaga to'g'ri kelmay qolardi.
        const { rows: hafta, current: joriy } = computeWeeklyProgress(p);
        const remaining = Math.max(0, p.k + p.s - (p.doneK + p.doneS));
        const qoldiHafta = hafta.length - joriy;
        const buHafta = hafta[joriy] ? hafta[joriy].plannedK + hafta[joriy].plannedS : 0;
        const keyingi = hafta[joriy + 1] ? hafta[joriy + 1].plannedK + hafta[joriy + 1].plannedS : 0;
        const advisory =
          remaining <= 0
            ? "Barcha vazifalar bajarilgan — davr yakunlanishiga tayyor."
            : qoldiHafta > 1
              ? `Qolgan ${remaining} ish ${qoldiHafta} haftaga teng taqsimlandi: bu hafta ${buHafta} ta, keyin haftasiga ~${keyingi} ta.`
              : `Oxirgi hafta — qolgan ${remaining} ishning hammasi shu haftaga to'g'ri keladi.`;

        const assignees = p.assignees || [];
        const assigneesHtml = assignees.length
          ? assignees
              .map((a) => {
                const name = a.fullName || (a.firstName ? `${a.firstName} ${a.lastName || ""}`.trim() : `@${a.username}`);
                return `<div class="rail-item">
                  <div class="avatar avatar-sm mute">${initials(name)}</div>
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${escHtml(name)}</div>
                  </div>
                </div>`;
              })
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Xodim biriktirilmagan</div>`;

        return `
          <div class="rail-card">
            <div class="rail-title">Mas'ul xodimlar${assignees.length ? " · " + assignees.length : ""}</div>
            ${assigneesHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">${fmtDay(todayDate())} · bugun</div>
            ${todayHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">O'tkazib yuborilgan${overdue.length ? " · " + overdue.length : ""}</div>
            ${overdueHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">Haftalik progress</div>
            ${barsHtml}
            <div class="f-hint">${advisory}</div>
          </div>`;
      }

      // Checkbox bosilishi — ikkala holatda ham (yangi belgilash yoki
      // allaqachon belgilangan itemni bosish) native checkbox holati
      // avvalgi holatiga qaytariladi va modal ochiladi: yangi belgilashda
      // kim qilgani so'raladi, mavjudini bosganda esa tafsilotlarni
      // tahrirlash yoki "Belgini olib tashlash" tugmasi bilan o'chirish
      // mumkin bo'ladi — holat faqat shu modal orqali o'zgaradi.
      function onCheckboxToggle(ev, slug, type, num, checked) {
        ev.target.checked = !checked;
        openCheckModal(slug, type, num);
      }

      // Kalendar katakchasi bosilganda — shu kunga tegishli post/stories
      // tafsilotini tahrirlash modalini ochadi. Bir kunga bir nechta
      // post/stories to'g'ri kelsa — avval qaysi biri ekanini tanlash
      // uchun kichik ro'yxat ko'rsatiladi.
      function openDayCell(slug, type, seqs) {
        if (!seqs || !seqs.length) return;
        if (seqs.length === 1) return openCheckModal(slug, type, seqs[0]);
        const label = type === "k" ? "Post" : "Stories";
        const { body } = makeSheet(`${label}lar — shu kun`);
        body.innerHTML = seqs
          .map(
            (n) =>
              `<button class="btn btn-soft" style="margin-bottom:8px" onclick="document.querySelector('.overlay').remove();openCheckModal('${escArg(slug)}','${type}',${n})">${label} ${n}</button>`,
          )
          .join("");
      }

      // ── BELGILASH SAHIFASI · KIM BAJARDI ──────────────────────────
      // Post/stories "bajarildi" deb belgilanadigan joy. Avval pastdan
      // chiqadigan varaq edi: uzun xodimlar ro'yxati, ikkita ochiladigan
      // ro'yxat va kalendar popover bitta oynaga tiqilgandi — telefonda
      // har bir formatni belgilab chiqish charchatardi. Endi vazifa
      // formasi bilan bir xil: to'liq sahifa, har bir tanlov — o'z
      // sahifasi. Asosiy savol o'zgarmagan: ishni KIM bajardi (rejadagi
      // mas'ul oldindan tanlangan, odatda bitta bosish yetadi; boshqa
      // xodim tanlansa — sabab so'raladi).
      const CWD_REASONS = [
        { key: "sick", label: "Kasallik" },
        { key: "vacation", label: "Ta'til" },
        { key: "urgent", label: "Shoshilinch" },
        { key: "other", label: "Boshqa" },
      ];
      const CWD_TITLES = {
        kim: "Kim bajardi?",
        sabab: "Nega boshqa xodim?",
        sana: "Qaysi kuni chiqdi?",
        turi: "Stories turi",
        montaj: "Video montajini kim qildi?",
        video: "Videoni kim oldi?",
      };
      let cwd = null;
      let cwdCal = null;

      function cwdShortName(first, last, username) {
        return shortPersonName(first, last, "@" + username);
      }
      function cwdPersonSub(u) {
        const projIds = perms[u.username] || [];
        const projLabel = projIds.length
          ? projects.find((x) => x.id === projIds[0])?.label || ""
          : "loyihasiz";
        return [u.jobTitle || u.job_title || "", projLabel].filter(Boolean).join(" · ");
      }
      function cwdIsSub() {
        return !!cwd.assigneeUsername && cwd.performerId !== cwd.assigneeUsername;
      }
      // Montaj/video tanlovi faqat postda va "atmosferali" storiesda
      // so'raladi — gapirib beriladigan storiesda montaj ham, suratga
      // olish ham bo'lmaydi.
      function cwdShowPickers() {
        return cwd.type === "k" || cwd.storyKind === "atmospheric";
      }

      async function openCheckModal(slug, type, num) {
        if (document.getElementById("cwd-page")) return;
        const p = projects.find((x) => x.id === slug);
        if (!p) return;
        const key = `${type}-${num}`;
        const info = (p.checkDetails || {})[key] || {};
        const already = !!(p.checks || {})[key];
        const label = type === "k" ? "Post" : "Stories";
        const workDate = info.workDate ? String(info.workDate).slice(0, 10) : isoOf(todayDate());
        // Rejadagi mas'ul — loyihaning SMM roli berilgan xodimi.
        const assignee = (p.assignees || []).find((a) => a.role === "smm") || null;
        cwd = {
          slug,
          type,
          num,
          already,
          label,
          projectLabel: p.label,
          workDate,
          storyKind: info.storyKind || "info",
          assigneeUsername: assignee ? assignee.username : null,
          performerId: info.performerUsername || (assignee ? assignee.username : currentUser),
          reason: info.substitutionReason || null,
          note: info.substitutionNote || "",
          // Loyihaga biriktirilgan xodimlar (montajchi, mobilograf,
          // dizayner...) — ishni amalda ular ham bajaradi, shuning uchun
          // "Kim bajardi?" ro'yxatida o'zlarini tanlay olishlari kerak.
          projectUsernames: (p.assignees || []).map((a) => a.username),
          assignee,
          editorUserId: info.editorUserId || null,
          videographerUserId: info.videographerUserId || null,
          directory: [],
          info,
        };

        const ov = document.createElement("div");
        ov.className = "ntv3-ov";
        ov.id = "cwd-page";
        // Katta ekranda bu karta bo'lib ko'rinadi — fonga bosish uni
        // yopadi. Telefonda karta butun ekranni egallaydi, shuning
        // uchun bu hodisa u yerda umuman ishlamaydi.
        ov.onclick = (e) => {
          if (e.target === ov) cwdClose();
        };
        ov.innerHTML = `<div class="ntv3">
          <div class="ntv3-hdr">
            <button type="button" class="ntv3-hbtn cancel" onclick="cwdClose()">Yopish</button>
            <div class="ntv3-title">${escHtml(label)} ${num}</div>
            <div class="ntv3-hbtn" aria-hidden="true"></div>
          </div>
          <div class="ntv3-body" id="cwd-body">
            <div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>
          </div>
          <div class="ntv3-foot" id="cwd-foot"></div>
        </div>`;
        document.body.appendChild(ov);
        pageBackStack = [cwdClose];
        pageSyncBack();
        document.addEventListener("keydown", pageOnKey);

        try {
          const res = await apiFetch("/api/users/directory");
          if (res.ok) cwd.directory = (await res.json()).users || [];
        } catch (e) {}
        if (!document.getElementById("cwd-page")) return;
        cwdRender();
      }

      function cwdClose() {
        document.getElementById("cwd-pick")?.remove();
        document.getElementById("cwd-page")?.remove();
        document.removeEventListener("keydown", pageOnKey);
        pageBackStack = [];
        pageSyncBack();
        cwd = null;
        cwdCal = null;
      }

      // ── Qaysi xodimlar tanlanishi mumkin ──────────────────────────
      // Ro'yxat ikki guruhga bo'linadi: loyiha jamoasi (shu loyihaga
      // biriktirilganlar) va boshqa xodim — loyihada bo'lmasa ham
      // post/stories ishini bajara oladiganlar (SMM va rahbariyat).
      // Loyihadan tashqaridagilarni faqat admin tanlay oladi (backend
      // ham shunday tekshiradi) — oddiy xodimga ularni ko'rsatish
      // ma'nosiz: tanlagan zahoti xato olardi.
      function cwdPerformerGroups() {
        const teamSet = new Set(cwd.projectUsernames || []);
        const pool = cwd.directory.filter((u) => u.username !== cwd.assigneeUsername);
        return {
          team: pool.filter((u) => teamSet.has(u.username)),
          others: isAdmin
            ? pool.filter((u) => !teamSet.has(u.username) && (u.can_smm || u.canSmm))
            : pool.filter((u) => !teamSet.has(u.username) && u.username === currentUser),
        };
      }
      function cwdPersonName(u) {
        return cwdShortName(u.firstName || u.first_name, u.lastName || u.last_name, u.username);
      }
      function cwdPerformerName() {
        if (cwd.performerId === cwd.assigneeUsername && cwd.assignee) return cwdPersonName(cwd.assignee);
        const u = cwd.directory.find((x) => x.username === cwd.performerId);
        return u ? cwdPersonName(u) : "@" + cwd.performerId;
      }
      // Montajchi/mobilograf ro'yxati: avval loyihaga shu rol bilan
      // biriktirilganlar, keyin qolgan xodimlar.
      function cwdRoleOptions(role) {
        const p = projects.find((x) => x.id === cwd.slug) || {};
        const assigned = (p.assignees || []).filter((a) => a.role === role);
        const assignedIds = new Set(assigned.map((a) => a.userId));
        const list = assigned.map((a) => ({
          id: a.userId,
          name: a.fullName || [a.firstName, a.lastName].filter(Boolean).join(" ") || `@${a.username}`,
          sub: "Loyihaga biriktirilgan",
          username: a.username,
          avatarUrl: a.avatarUrl,
        }));
        (cwd.directory || [])
          .filter((u) => !assignedIds.has(u.id))
          .sort((a, b) => (a.first_name || a.username).localeCompare(b.first_name || b.username))
          .forEach((u) =>
            list.push({
              id: u.id,
              name: u.first_name ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`,
              sub: u.job_title || "",
              username: u.username,
              avatarUrl: u.avatar_url,
            }),
          );
        return list;
      }
      function cwdRoleName(role, id) {
        if (!id) return "";
        return cwdRoleOptions(role).find((o) => o.id === id)?.name || "";
      }

      // ── Asosiy sahifa ─────────────────────────────────────────────
      function cwdRender() {
        const host = document.getElementById("cwd-body");
        if (!host || !cwd) return;
        const isSub = cwdIsSub();
        const pickers = cwdShowPickers();
        const reason = CWD_REASONS.find((r) => r.key === cwd.reason);
        const performer = cwdPerformerName();
        const assigneeName = cwd.assignee ? cwdPersonName(cwd.assignee) : null;
        const natija = isSub
          ? `Ish ${escHtml(performer.split(" ")[0])} nomiga yoziladi.${assigneeName ? ` ${escHtml(assigneeName.split(" ")[0])} rejasida «o'rniga bajarildi» deb turadi.` : ""}`
          : `Ish ${escHtml(performer.split(" ")[0])} rejasiga hisoblanadi.`;
        const avatar = (() => {
          const u =
            cwd.performerId === cwd.assigneeUsername && cwd.assignee
              ? cwd.assignee
              : cwd.directory.find((x) => x.username === cwd.performerId);
          if (!u) return "";
          return `<span class="ntv3-avs"><span class="ntv3-av" style="background:${personColor(cwd.performerId)}">${escHtml((performer || "?").slice(0, 1).toUpperCase())}${avatarImg(u.avatarUrl || u.avatar_url)}</span></span>`;
        })();

        // Hammasi bitta kartada va mantiqiy tartibda: kim → nega →
        // stories turi (montaj so'ralishini shu hal qiladi) → montaj →
        // video → qaysi kuni. Bo'lim sarlavhalari qo'yilmadi: forma
        // qisqa, "majburiy/qo'shimcha" deb ikkiga bo'lish faqat
        // chalg'itardi — bu yerda deyarli hammasi majburiy.
        const qoshimcha = [
          cwd.type === "s"
            ? fieldRowHtml({
                icon: "turi",
                label: "Stories turi",
                value: cwd.storyKind === "atmospheric" ? "Atmosferali video" : "Gapirib beriladigan",
                onclick: "openCwdPick('turi')",
              })
            : "",
          pickers
            ? fieldRowHtml({
                icon: "montaj",
                label: "Montaj",
                value: cwdRoleName("montajchi", cwd.editorUserId),
                placeholder: "Tanlang",
                required: true,
                onclick: "openCwdPick('montaj')",
              })
            : "",
          pickers
            ? fieldRowHtml({
                icon: "video",
                label: "Video olgan",
                value: cwdRoleName("mobilograf", cwd.videographerUserId),
                placeholder: "Tanlang",
                required: true,
                onclick: "openCwdPick('video')",
              })
            : "",
        ].filter(Boolean);

        host.innerHTML = `
          <div class="cwd-head">
            <span class="cwd-chip">${escHtml(cwd.label)} ${cwd.num}</span>
            <span class="cwd-sub">${escHtml(cwd.projectLabel)}</span>
          </div>
          <div class="ntv3-props" id="cwd-req">
            ${fieldRowHtml({ icon: "kimga", label: "Kim bajardi", value: performer, placeholder: "Tanlang", required: true, prefix: avatar, onclick: "openCwdPick('kim')" })}
            ${
              isSub
                ? fieldRowHtml({
                    icon: "sabab",
                    label: "Sabab",
                    value: reason ? (reason.key === "other" && cwd.note ? cwd.note : reason.label) : "",
                    placeholder: "Tanlang",
                    required: true,
                    onclick: "openCwdPick('sabab')",
                  })
                : ""
            }
            ${qoshimcha.join("")}
            ${fieldRowHtml({ icon: "muddat", label: "Qaysi kuni", value: fmtDay(parseISO(cwd.workDate)), required: true, onclick: "openCwdPick('sana')" })}
          </div>
          <div class="ntv3-err" id="cwd-req-err"></div>
          ${
            cwd.assignee
              ? ""
              : `<div class="ntv3-hint">Bu loyihada rejadagi mas'ul belgilanmagan — Ruxsatlar bo'limidan «SMM» roli beriladi.</div>`
          }
          <div class="cwd-note">
            <span class="cwd-note-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.8 3 2.6 3.5 5.2"/></svg></span>
            <span class="cwd-note-txt">${natija}</span>
          </div>`;

        const foot = document.getElementById("cwd-foot");
        if (foot) {
          foot.innerHTML = `<button type="button" class="ntv3-submit" id="cwd-save" onclick="cwdSave(this)">${cwd.already ? "Yangilash" : "Bajarildi deb belgilash"}</button>
            ${cwd.already ? `<button type="button" class="ntv3-submit ghost" style="margin-top:8px" onclick="cwdRemove()">Belgini olib tashlash</button>` : ""}`;
        }
        applyStaticIcons?.();
      }

      // ── Ichki tanlov sahifasi ─────────────────────────────────────
      function openCwdPick(key) {
        if (!cwd || document.getElementById("cwd-pick")) return;
        if (key === "sana") {
          const d = parseISO(cwd.workDate);
          cwdCal = { y: d.getFullYear(), m: d.getMonth(), sel: cwd.workDate };
        }
        const ov = document.createElement("div");
        ov.className = "ntv3-pick-ov";
        ov.id = "cwd-pick";
        ov.onclick = (e) => {
          if (e.target === ov) closeCwdPick();
        };
        ov.innerHTML = `<div class="ntv3-pick">
          <div class="ntv3-hdr">
            <button type="button" class="ntv3-hbtn cancel" onclick="closeCwdPick()">${ICON.chevronLeft}Orqaga</button>
            <div class="ntv3-title">${CWD_TITLES[key]}</div>
            ${key === "sana" || key === "sabab" ? `<button type="button" class="ntv3-hbtn save" onclick="closeCwdPick()">Tayyor</button>` : `<div class="ntv3-hbtn" aria-hidden="true"></div>`}
          </div>
          <div class="ntv3-pick-body" id="cwd-pick-body">${cwdPickBodyHtml(key)}</div>
        </div>`;
        ov.dataset.key = key;
        document.body.appendChild(ov);
        pageBackStack.push(closeCwdPick);
        pageSyncBack();
        applyStaticIcons?.();
      }
      function closeCwdPick() {
        const ov = document.getElementById("cwd-pick");
        if (!ov) return;
        if (ov.dataset.key === "sana" && cwdCal) cwd.workDate = cwdCal.sel || cwd.workDate;
        ov.remove();
        pageBackStack.pop();
        pageSyncBack();
        cwdRender();
      }
      function cwdOptHtml(on, avatarHtml, name, sub, onclick) {
        return `<div class="ntv3-opt${on ? " on" : ""}" onclick="${onclick}">
          ${avatarHtml || ""}
          <span class="ntv3-opt-txt"><b>${escHtml(name)}</b>${sub ? `<i>${escHtml(sub)}</i>` : ""}</span>
          <span class="ntv3-tick${on ? " on" : ""}">${on ? ICON.check : ""}</span>
        </div>`;
      }
      function cwdAvHtml(username, name, url) {
        return `<span class="ntv3-av" style="background:${personColor(username)}">${escHtml((name || "?").slice(0, 1).toUpperCase())}${avatarImg(url)}</span>`;
      }
      function cwdPickBodyHtml(key) {
        if (key === "sana") {
          return `<div id="cwd-cal">${cwdCalHtml()}</div>
            <div class="ntv3-quick">
              <button type="button" class="ntv3-qchip" onclick="cwdPickDay('${isoOf(todayDate())}')">Bugun</button>
              <button type="button" class="ntv3-qchip" onclick="cwdPickDay('${isoOf(new Date(todayDate().getFullYear(), todayDate().getMonth(), todayDate().getDate() - 1))}')">Kecha</button>
            </div>`;
        }
        if (key === "turi") {
          return [
            cwdOptHtml(cwd.storyKind === "info", "", "Gapirib beriladigan", "Montaj va suratga olish so'ralmaydi", `cwdPickValue('turi','info')`),
            cwdOptHtml(cwd.storyKind === "atmospheric", "", "Atmosferali video", "Montaj va video olgan xodim ham so'raladi", `cwdPickValue('turi','atmospheric')`),
          ].join("");
        }
        if (key === "sabab") {
          const list = CWD_REASONS.map((r) =>
            cwdOptHtml(cwd.reason === r.key, "", r.label, "", `cwdPickValue('sabab','${r.key}')`),
          ).join("");
          const note =
            cwd.reason === "other"
              ? `<div class="ntv3-newtag" style="margin-top:12px"><input id="cwd-note-inp" maxlength="200" placeholder="Qisqacha izoh" value="${escHtml(cwd.note || "")}" oninput="cwd.note=this.value"/></div>`
              : "";
          return `<div class="ntv3-count">Rejadagi mas'ul o'rniga boshqa xodim ishlagan — sababi hisobotda ko'rinadi</div>${list}${note}`;
        }
        if (key === "montaj" || key === "video") {
          const role = key === "montaj" ? "montajchi" : "mobilograf";
          const cur = key === "montaj" ? cwd.editorUserId : cwd.videographerUserId;
          const opts = cwdRoleOptions(role);
          if (!opts.length) return `<div class="ntv3-empty">Xodim yo'q</div>`;
          return opts
            .map((o) =>
              cwdOptHtml(cur === o.id, cwdAvHtml(o.username, o.name, o.avatarUrl), o.name, o.sub, `cwdPickValue('${key}','${escArg(o.id)}')`),
            )
            .join("");
        }
        // kim bajardi
        const { team, others } = cwdPerformerGroups();
        const row = (u, isAssignee) =>
          cwdOptHtml(
            cwd.performerId === u.username,
            cwdAvHtml(u.username, cwdPersonName(u), u.avatarUrl || u.avatar_url),
            cwdPersonName(u),
            isAssignee ? "Rejada mas'ul" : cwdPersonSub(u),
            `cwdPickValue('kim','${escArg(u.username)}')`,
          );
        const parts = [cwd.assignee ? row(cwd.assignee, true) : ""];
        if (team.length) parts.push(`<div class="ntv3-sec">Loyiha jamoasi</div>`, ...team.map((u) => row(u, false)));
        if (others.length) parts.push(`<div class="ntv3-sec">${isAdmin ? "Boshqa xodim" : "Men"}</div>`, ...others.map((u) => row(u, false)));
        if (!cwd.assignee && !team.length && !others.length) {
          parts.push(`<div class="ntv3-empty">Loyihaga hali hech kim biriktirilmagan.</div>`);
        }
        return parts.join("");
      }
      function cwdPickValue(key, value) {
        if (!cwd) return;
        if (key === "kim") {
          cwd.performerId = value;
          // Rejadagi mas'ulning o'ziga qaytarilsa, sabab keraksiz.
          if (value === cwd.assigneeUsername) {
            cwd.reason = null;
            cwd.note = "";
          }
          ntv3Haptic();
          closeCwdPick();
          return;
        }
        if (key === "turi") cwd.storyKind = value;
        else if (key === "montaj") cwd.editorUserId = value;
        else if (key === "video") cwd.videographerUserId = value;
        else if (key === "sabab") {
          cwd.reason = cwd.reason === value ? null : value;
          if (cwd.reason !== "other") cwd.note = "";
          // "Boshqa" — izoh maydoni shu sahifaning o'zida ochiladi,
          // shuning uchun sahifa yopilmaydi.
          const body = document.getElementById("cwd-pick-body");
          if (body) body.innerHTML = cwdPickBodyHtml("sabab");
          ntv3Haptic();
          return;
        }
        ntv3Haptic();
        closeCwdPick();
      }
      function cwdCalHtml() {
        const { y, m, sel } = cwdCal;
        const todayIso = isoOf(todayDate());
        const days = buildCalGridCells(y, m)
          .map((c) => {
            if (!c.iso) return `<button type="button" class="ntv3-day" disabled>${c.dNum}</button>`;
            const cls = ["ntv3-day"];
            if (c.iso === todayIso) cls.push("d-today");
            if (c.iso === sel) cls.push("d-sel", "d-s", "d-e");
            return `<button type="button" class="${cls.join(" ")}" onclick="cwdPickDay('${c.iso}')">${c.dNum}</button>`;
          })
          .join("");
        return `<div class="ntv3-cal-hdr">
            <button type="button" class="ntv3-cal-nav" onclick="cwdCalNav(-1)">${ICON.chevronLeft}</button>
            <div class="ntv3-cal-m">${MONTHS[m]} ${y}</div>
            <button type="button" class="ntv3-cal-nav" onclick="cwdCalNav(1)">${ICON.chevronRight}</button>
          </div>
          <div class="ntv3-wd">${WD.map((w) => `<div>${w}</div>`).join("")}</div>
          <div class="ntv3-days">${days}</div>`;
      }
      function cwdCalNav(delta) {
        if (!cwdCal) return;
        cwdCal.m += delta;
        if (cwdCal.m < 0) {
          cwdCal.m = 11;
          cwdCal.y--;
        } else if (cwdCal.m > 11) {
          cwdCal.m = 0;
          cwdCal.y++;
        }
        const el = document.getElementById("cwd-cal");
        if (el) el.innerHTML = cwdCalHtml();
      }
      function cwdPickDay(iso) {
        if (!cwdCal) return;
        const d = parseISO(iso);
        cwdCal = { y: d.getFullYear(), m: d.getMonth(), sel: iso };
        const el = document.getElementById("cwd-cal");
        if (el) el.innerHTML = cwdCalHtml();
        ntv3Haptic();
      }

      // ── Saqlash ───────────────────────────────────────────────────
      function cwdShowErr(matn) {
        const el = document.getElementById("cwd-req-err");
        if (el) {
          el.textContent = matn;
          el.classList.add("on");
          el.scrollIntoView({ block: "center", behavior: "smooth" });
        }
        document.getElementById("cwd-req")?.classList.add("bad");
        tg()?.HapticFeedback?.notificationOccurred?.("error");
      }
      async function cwdSave(btn) {
        if (!cwd) return;
        document.getElementById("cwd-req-err")?.classList.remove("on");
        document.getElementById("cwd-req")?.classList.remove("bad");
        const isSub = cwdIsSub();
        const pickers = cwdShowPickers();
        // Rejadagi mas'ul o'rniga boshqa xodim ishlagan bo'lsa, sabab
        // yozilmasa hisobot "kim nega ishlamadi"ni ko'rsata olmaydi.
        if (isSub && !cwd.reason) return cwdShowErr("«Sabab» — rejadagi mas'ul o'rniga kim nega ishlaganini tanlang.");
        if (isSub && cwd.reason === "other" && !(cwd.note || "").trim()) {
          return cwdShowErr("«Sabab» — «Boshqa» tanlandi, qisqacha izoh yozing.");
        }
        if (pickers && !cwd.editorUserId) return cwdShowErr("«Montaj» — montaj qilgan xodimni tanlang.");
        if (pickers && !cwd.videographerUserId) return cwdShowErr("«Video olgan» — videoni olgan xodimni tanlang.");
        if (!cwd.workDate) return cwdShowErr("«Qaysi kuni» — sanani tanlang.");
        setBtnLoading(btn, true, "Saqlanmoqda…");
        try {
          await onCheck(cwd.slug, cwd.type, cwd.num, true, null, {
            editorUserId: pickers ? cwd.editorUserId : null,
            videographerUserId: pickers ? cwd.videographerUserId : null,
            workDate: cwd.workDate,
            storyKind: cwd.type === "s" ? cwd.storyKind : undefined,
            performerUsername: cwd.performerId,
            substitutionReason: isSub ? cwd.reason : null,
            substitutionNote: isSub && cwd.reason === "other" ? cwd.note : null,
          });
          cwdClose();
          showToast("✅ Belgilandi");
        } catch (e) {
          setBtnLoading(btn, false);
        }
      }
      async function cwdRemove() {
        if (!cwd) return;
        try {
          await onCheck(cwd.slug, cwd.type, cwd.num, false);
          cwdClose();
          showToast("Belgi olib tashlandi");
        } catch (e) {}
      }

      // ── YANGI LOYIHA ──────────────────────────────────────────────
      // ── YANGI LOYIHA — MODAL (sahifa emas: markazlashgan modal, orqa
      // fon qoraytiriladi — makeSheet() bilan bir xil .overlay/.sheet
      // primitividan foydalanadi, lekin header/footer maxsus bo'lgani
      // uchun o'z DOM'ini o'zi quradi). ──────────────────────────────
      let npTemplates = [];
      function npDefaultState() {
        const t = todayDate();
        return {
          label: "",
          startMode: "today", // "today" | "month1" | "custom"
          anchor: isoOf(t),
          k: 10,
          s: 15,
          assignees: [],
          notify: true,
          calMonth: t.getMonth(),
          calYear: t.getFullYear(),
          calSel: null,
          tplPanelOpen: false,
          saving: false,
          labelErr: false,
        };
      }
      function npIsDirty() {
        const d = npState;
        return !!d.label.trim() || d.assignees.length > 0 || d.k !== 10 || d.s !== 15 || d.startMode !== "today";
      }
      function onNpEscKey(e) {
        if (e.key === "Escape") requestCloseNewProject();
      }
      function openNewProjectSheet() {
        npState = npDefaultState();
        const ov = document.createElement("div");
        ov.className = "overlay";
        ov.id = "np-overlay";
        ov.onclick = (e) => {
          if (e.target === ov) requestCloseNewProject();
        };
        ov.innerHTML = `
          <div class="sheet wide" style="display:flex;flex-direction:column">
            <div class="np-ov-hdr">
              <div class="np-ov-icon">+</div>
              <div style="flex:1;min-width:0">
                <div class="np-ov-title">Yangi loyiha</div>
                <div class="np-ov-sub">Oylik kontent rejasi avtomatik yaratiladi</div>
              </div>
              <button class="sheet-close" onclick="requestCloseNewProject()">×</button>
            </div>
            <div class="np-ov-body" id="np-body"></div>
            <div class="np-ov-footer" id="np-footer"></div>
          </div>`;
        document.body.appendChild(ov);
        document.addEventListener("keydown", onNpEscKey);
        renderNewProjectForm();
        ensureNpUsersLoaded().then(() => {
          if (document.getElementById("np-overlay")) renderNewProjectForm();
        });
        loadNpTemplates();
      }
      function requestCloseNewProject() {
        if (npIsDirty()) {
          showConfirmModal(
            "Chiqishni xohlaysizmi?",
            "Kiritilgan ma'lumotlar saqlanmaydi.",
            () => closeNewProjectSheet(),
            "Ha, chiqish",
          );
        } else {
          closeNewProjectSheet();
        }
      }
      function closeNewProjectSheet() {
        document.getElementById("np-overlay")?.remove();
        document.removeEventListener("keydown", onNpEscKey);
      }
      async function ensureNpUsersLoaded() {
        try {
          const res = await apiFetch("/api/users");
          if (!res.ok) return;
          const d = await res.json();
          allUsers = (d.users || []).filter((u) => u.role === "employee" && u.is_active);
          resetPersonColors();
        } catch (e) {}
      }
      async function loadNpTemplates() {
        try {
          const res = await apiFetch("/api/project-templates");
          if (res.ok) npTemplates = (await res.json()).templates || [];
          if (document.getElementById("np-overlay")) renderNewProjectForm();
        } catch (e) {}
      }

      // ── Hisob davri: tez tanlash + ichki (embed) kalendar ───────────
      function npCurrentMonthLabel() {
        const t = todayDate();
        return `1-${MONTHS[t.getMonth()].toLowerCase()}`;
      }
      function npSetStartMode(mode) {
        npState.startMode = mode;
        const t = todayDate();
        if (mode === "today") npState.anchor = isoOf(t);
        else if (mode === "month1") npState.anchor = isoOf(new Date(t.getFullYear(), t.getMonth(), 1));
        else if (mode === "custom") {
          const cur = parseISO(npState.anchor);
          npState.calYear = cur.getFullYear();
          npState.calMonth = cur.getMonth();
          npState.calSel = npState.anchor;
        }
        renderNewProjectForm();
      }
      function npCalNav(delta) {
        npState.calMonth += delta;
        if (npState.calMonth < 0) {
          npState.calMonth = 11;
          npState.calYear--;
        } else if (npState.calMonth > 11) {
          npState.calMonth = 0;
          npState.calYear++;
        }
        renderNewProjectForm();
      }
      function npCalSelectDay(iso) {
        npState.calSel = iso;
        renderNewProjectForm();
      }
      function npCalConfirm() {
        if (!npState.calSel) return;
        npState.anchor = npState.calSel;
        renderNewProjectForm();
      }
      function npPeriodEnd(startIso) {
        const nextStart = jsAddMonthsClamped(startIso, 1);
        const nd = parseISO(nextStart);
        nd.setDate(nd.getDate() - 1);
        return isoOf(nd);
      }
      function npBuildCalendarHtml() {
        const cells = buildCalGridCells(npState.calYear, npState.calMonth);
        const todayIso = isoOf(todayDate());
        const dayBtns = cells
          .map((c) => {
            const cls = ["np2-cal-day"];
            if (!c.iso) cls.push("other");
            if (c.iso === todayIso) cls.push("today");
            if (c.iso && c.iso === npState.calSel) cls.push("sel");
            return `<button type="button" class="${cls.join(" ")}" ${c.iso ? `onclick="npCalSelectDay('${c.iso}')"` : "disabled"}>${c.dNum}</button>`;
          })
          .join("");
        const selLabel = npState.calSel
          ? `${fmtDay(parseISO(npState.calSel))} → ${fmtDay(parseISO(npPeriodEnd(npState.calSel)))}`
          : "Kun tanlang";
        return `
          <div class="np2-cal">
            <div class="np2-cal-hdr">
              <div class="np2-cal-title">${MONTHS[npState.calMonth]} ${npState.calYear}</div>
              <div class="np2-cal-nav">

              </div>
            </div>
            <div class="np2-cal-grid">
              ${WD.map((w) => `<div class="np2-cal-wd">${w}</div>`).join("")}
              ${dayBtns}
            </div>
            <div class="np2-cal-foot">
              <div class="np2-cal-foot-txt">Tanlangan: <b>${selLabel}</b></div>
              <button type="button" class="np2-cal-confirm" ${npState.calSel ? "" : "disabled"} onclick="npCalConfirm()">Tasdiqlash</button>
            </div>
          </div>`;
      }

      // ── Hajm: tez tanlash / qo'lda / shablondan ─────────────────────
      function npStepK(d) {
        npState.k = Math.max(0, Math.min(200, npState.k + d));
        renderNewProjectForm();
      }
      function npStepS(d) {
        npState.s = Math.max(0, Math.min(200, npState.s + d));
        renderNewProjectForm();
      }
      function npSetVolume(k, s) {
        npState.k = k;
        npState.s = s;
        npState.tplPanelOpen = false;
        renderNewProjectForm();
      }
      function npToggleTplPanel() {
        npState.tplPanelOpen = !npState.tplPanelOpen;
        renderNewProjectForm();
      }
      function npApplyTemplate(id) {
        const t = npTemplates.find((x) => x.id === id);
        if (!t) return;
        npState.k = t.postsTarget;
        npState.s = t.storiesTarget;
        npState.tplPanelOpen = false;
        renderNewProjectForm();
        showToast(`✅ "${t.name}" shabloni qo'llanildi`);
      }
      function npDeleteTemplate(id, name, ev) {
        ev.stopPropagation();
        showConfirmModal(
          `"${escHtml(name)}" shablonini o'chirish`,
          "Bu amalni bekor qilib bo'lmaydi.",
          async () => {
            try {
              const res = await apiFetch(`/api/project-templates/${id}`, { method: "DELETE" });
              if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");

              renderNewProjectForm();

              showToast("⚠ " + e.message);

      function npOpenSaveTemplate() {
        document.getElementById("np-tpl-modal")?.remove();
        const modal = document.createElement("div");
        modal.id = "np-tpl-modal";
        modal.className = "overlay";
        modal.style.zIndex = "900";
        modal.innerHTML = `
          <div class="sheet" style="max-width:420px">
            <div class="sheet-handle"></div>
            <div style="padding:14px 20px calc(28px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)))">
              <div style="font-size:16px;font-weight:600;color:var(--ink);margin-bottom:14px">Shablon sifatida saqlash</div>
              <div class="f-group">
                <label class="f-label">Shablon nomi</label>
                <input class="f-input" id="np-tpl-name" placeholder="Masalan: Standart (10+15)"/>

              <div class="f-hint" style="margin-bottom:16px">${npState.k} post + ${npState.s} stories saqlanadi.</div>

      async function npSaveTemplate() {
        const nameInput = document.getElementById("np-tpl-name");
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.style.borderColor = "var(--red)";
          return;
        }
        const btn = document.getElementById("np-tpl-save-btn");
        btn.disabled = true;
        try {
          const res = await apiFetch("/api/project-templates", {
            method: "POST",
            body: JSON.stringify({ name, postsTarget: npState.k, storiesTarget: npState.s }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(d.error || "Xato");
          npTemplates.push(d.template);
          document.getElementById("np-tpl-modal")?.remove();
          if (document.getElementById("np-overlay")) renderNewProjectForm();
          showToast(`✅ "${name}" shablon sifatida saqlandi`);
        } catch (e) {
          showToast("⚠ " + e.message);
          btn.disabled = false;
        }
      }

      // ── Mas'ul — mavjud Ruxsatlar (permissions) tizimidan foydalanadi:
      // loyihaga "mas'ul" belgilash = shu loyihaga ruxsat berish, chunki

      function npToggleNotify() {

      // ── Preview (o'ng ustun) — real vaqtda hisoblanadi, hardcode yo'q ─
      function npBuildPreviewHtml() {
        const total = npState.k + npState.s;
        const anchor = parseISO(npState.anchor);
        const end = parseISO(npPeriodEnd(npState.anchor));
        const totalDays = daysBetween(anchor, end) + 1;
        const weeks = Math.max(1, totalDays / 7);
        const fullWeeks = Math.floor(totalDays / 7);
        const remDays = totalDays - fullWeeks * 7;
        const bars = [0, 1, 2, 3, 4]
          .map((i) => {
            let h;
            if (i < fullWeeks) h = 34;
            else if (i === fullWeeks && remDays > 0) h = Math.max(8, Math.round((remDays / 7) * 34));
            else h = 6;
            const dim = i >= fullWeeks;
            return `<div><div class="preview-bar ${dim ? "dim" : ""}" style="height:${h}px"></div><div class="preview-bar-lbl">${i + 1}-h</div></div>`;
          })
          .join("");
        const checklist = total
          ? `<div class="np2-check-list">
              <div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${npState.k} ta post vazifasi</div></div>
              <div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${npState.s} ta stories vazifasi</div></div>
              ${npState.assignees
                .map((username) => {
                  const u = allUsers.find((x) => x.username === username);
                  const name = u ? npUserDisplayName(u) : `@${username}`;
                  return `<div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${escHtml(name)}ga biriktiriladi</div></div>`;
                })
                .join("")}
            </div>`
          : "";
        return `
          <div class="preview-card">
            <div class="preview-upper">Yaratiladi</div>
            <div class="preview-title">${total} vazifa · ${fmtDay(anchor)} – ${fmtDay(end)}</div>
            <div class="preview-sub">Haftada ~${Math.round(npState.k / weeks)} post + ~${Math.round(npState.s / weeks)} stories</div>
            <div class="preview-bars">${bars}</div>
          </div>
          ${checklist}
          <div class="np2-debt-warn">Muddat <b>${fmtDay(end)}</b>. O'tib ketsa loyiha qarz ro'yxatiga tushadi.</div>`;
      }

          <div class="np2-grid">

                  <button type="button" class="np2-chip ${npState.tplPanelOpen ? "on" : ""}" onclick="npToggleTplPanel()">Shablondan</button>

                <div class="np2-vol-card">
                  <div class="stepper">
                    <div class="stepper-lbl">Postlar</div>
                    <div class="stepper-ctl">
                      <button class="stepper-btn" onclick="npStepK(-1)">−</button>
                      <div class="stepper-val num">${npState.k}</div>
                      <button class="stepper-btn" onclick="npStepK(1)">+</button>
                    </div>

                  <div class="divider"></div>
                  <div class="stepper">
                    <div class="stepper-lbl">Stories</div>

      async function submitNewProject() {
        const label = npState.label.trim();
        if (!label) {
          npState.labelErr = true;
          renderNewProjectForm();
          document.querySelector(".np2-name-input")?.focus();
          return;
        }
        npState.saving = true;
        const f = document.getElementById("np-footer");
        if (f) f.innerHTML = npBuildFooterHtml();
        try {
          const res = await apiFetch("/api/projects", {
            method: "POST",
            body: JSON.stringify({
              label,
              anchorDate: npState.anchor,
              postsTarget: npState.k,
              storiesTarget: npState.s,
              assigneeUsernames: npState.assignees,
              notifyTelegram: npState.notify,
            }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(d.error || "Xato");
          await loadProjects();
          histState.loaded = false;
          try {
            const pr = await apiFetch("/api/permissions");
            if (pr.ok) perms = await pr.json();
          } catch (e) {}
          closeNewProjectSheet();
          showToast("✅ " + label + " yaratildi!");
        } catch (e) {
          npState.saving = false;
          showToast("⚠ " + e.message);
          const f2 = document.getElementById("np-footer");
          if (f2) f2.innerHTML = npBuildFooterHtml();
        }
      }

      // ── BOSHQARUV ─────────────────────────────────────────────────
      const ADMIN_TABS = [
        "projects",
        "staff",
        "worklog",
        "perms",
        "admins",
        "announcement",
        "nshop",
      ];
      function switchATab(tabName) {
        adminActiveTab = tabName;
        ADMIN_TABS.forEach((t) => {
          const b = document.getElementById("atab-" + t);
          if (b) b.classList.toggle("active", t === tabName);
        });
        const noSearch = tabName === "announcement" || tabName === "worklog" || tabName === "nshop";
        document.getElementById("admin-search-box").style.display = noSearch
          ? "none"
          : "flex";

          tabName === "projects" ? "flex" : "none";

          projects: "Loyiha qidirish",
          staff: "Xodim qidirish",
          perms: "Xodim yoki loyiha",

        };
        const s = document.getElementById("admin-search");
        if (s && ph[tabName]) s.placeholder = ph[tabName];
        renderAdminActiveTab();
      }
      function renderAdminActiveTab() {
        const c = document.getElementById("admin-body");
        if (adminActiveTab === "projects") renderAdminProjectsTab(c);
        else if (adminActiveTab === "staff") renderStaffTab(c);
        else if (adminActiveTab === "worklog") renderWorklogTab(c);
        else if (adminActiveTab === "perms") renderAdminPermsTab(c);
        else if (adminActiveTab === "admins") renderAdminAdminsTab(c);
        else if (adminActiveTab === "nshop") renderNShopAdminTab(c);
        else renderAnnouncementTab(c);

      // ── XODIMLAR TABI ────────────────────────────────────────────
      // Ikki qism: (1) Telegram xodimlar — avtomatik, botga kirib profil
      // to'ldirgan userlar shu yerda o'zi paydo bo'ladi, admin qo'lda
      // qayta kiritmaydi; (2) Boshqa xodimlar — Telegram'siz ishlab
      // chiqarish jamoasi (montajchi/mobilograf/...), hali ham qo'lda.
      function renderStaffTab(c) {
        const q = (document.getElementById("admin-search")?.value || "")
          .toLowerCase()
          .trim();
        const posOptions = Object.keys(POSITION_LABELS)
          .map((k) => `<option value="${k}">${POSITION_LABELS[k]}</option>`)
          .join("");

        const groups = {};
        staffList
          .filter((s) => !q || s.fullName.toLowerCase().includes(q))
          .forEach((s) => (groups[s.position] = groups[s.position] || []).push(s));
        const order = Object.keys(POSITION_LABELS);
        const shown = order.filter((k) => groups[k] && groups[k].length);
        let staffHtml = "";
        if (!shown.length) {
          staffHtml = `<div class="empty"><div class="empty-t">Xodim yo'q</div><div class="empty-s">Yuqoridan ism va lavozimni kiritib qo'shing.</div></div>`;
        } else {
          shown.forEach((pos) => {
            staffHtml += `<div class="sec-upper">${POSITION_LABELS[pos]} · ${groups[pos].length}</div><div class="list-card" style="margin-bottom:14px">`;
            staffHtml += groups[pos]
              .map(
                (s) => `<div class="list-row">
                  <div class="avatar mute">${initials(s.fullName)}</div>
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${escHtml(s.fullName)}</div>
                    <div class="r-sub">${POSITION_LABELS[s.position] || s.position}</div>
