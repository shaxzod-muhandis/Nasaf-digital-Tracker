<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>Nasaf Digital — Tracker</title>
    <script>
      // Saqlangan tema (agar bo'lsa) CSS chizishdan OLDIN qo'llanadi —
      // aks holda sahifa avval yorug' holatda chaqnab, keyin qorong'iga
      // o'tib qolardi (FOUC).
      (function () {
        try {
          if (localStorage.getItem("nasaf_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Onest:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── DIZAYN TOKENLARI (1b "Ish paneli" — brend ko'ki) ───────── */
      :root {
        --bg: #f7f8fa;
        --surf: #ffffff;
        --surf2: #fafbfc;
        --brand: #2f7ab9;
        --ink: #0f172a;
        /* --ink matn rangi — temaga qarab o'zgaradi. --inkfill esa
           "to'liq to'q fon + ustida oq matn" elementlari (toast, faol
           chip, avatar, tugma) uchun — bu ATAYLAB ikkala temada ham
           bir xil qoladi (pastda qorong'i tema blokida qayta
           yozilmaydi), aks holda qorong'i temada bu fon ham
           yorishib, ustidagi oq matn/harflar ko'rinmay qolardi. */
        --inkfill: #0f172a;
        --t2: #6b7280;
        --t3: #8b929c;
        --t4: #9aa1ac;
        --t5: #374151;
        --chev: #b6bcc5;
        --red: #dc2626;
        --red-bg: #fdecec;
        --red-bd: rgba(220, 38, 38, 0.3);
        --red-bd2: rgba(220, 38, 38, 0.35);
        --bd1: rgba(15, 23, 42, 0.06);
        --bd2: rgba(15, 23, 42, 0.08);
        --bd3: rgba(15, 23, 42, 0.09);
        --bd4: rgba(15, 23, 42, 0.14);
        --chip: #f1f3f6;
        /* ── Yon menyu (v3 dizayni) ────────────────────────────────
           Ataylab mustaqil qiymatlar: ilovaning umumiy matn ranglari
           menyu dizaynidagidan ochroq, va bu o'zgarish faqat menyuga
           tegishli bo'lishi kerak. */
        --nav-ink: #374151;
        --nav-ink2: #5b6573;
        --nav-muted: #7a828e;
        --nav-act-bg: #eaf2f9;
        --nav-act-ink: #255f91;
        --nav-badge-bg: #eef0f3;
        --nav-badge-ink: #5b6573;
        --nav-coin-bg: #fbf1e4;
        --nav-coin-ink: #a45f08;
        --nav-coin-mark: #d97706;
        --chip2: #eef0f3;
        --chip3: #edeff2;
        --sw-off: #dce0e6;
        --nav-off: #c2c8d0;
        /* Vazifalar — taglar/ustuvorlik uchun FIKS (random emas)
           rang palitrasi: har bir nom shu massivdan deterministik
           tanlanadi (tagColor()). */
        --amber: #d97706;
        --amber-bg: #fbf1e4;
        --amber-ink: #8a5a1a;
        --teal: #1e6b57;
        --teal-bg: #e9f5f1;
        --tagblue: #23608f;
        --tagblue-bg: #ebf3fa;
        --purple: #4b41a8;
        --purple-bg: #efedfb;
        --pink: #92345f;
        --pink-bg: #faecf3;
        --green: #16a34a;
        --red-tint: #fffbfb;
        /* Faollik heatmap — bitta ko'k rangning 5 pog'onasi (dizayner
           TZ'i, 3.3-band): 0 = harakat yo'q, 4 = eng yuqori. Boshqa
           ranglar bilan (yashil=Bajarildi, siyohrang=Stories) qo'shilib
           ketmasligi uchun ATAYLAB shu bitta tonda qoldirilgan. */
        --act-lvl-0: #edeff2;
        --act-lvl-1: #d3e4f3;
        --act-lvl-2: #9cc3e3;
        --act-lvl-3: #5795c6;
        --act-lvl-4: #2f7ab9;
        --act-icon-bg: #ebf3fa;
        /* Telegram to'liq ekran rejimida o'zining sarlavha/yopish
           tugmalarini kontent ustiga chizadi — JS shu qiymatni
           Telegram.WebApp.safeAreaInset/contentSafeAreaInset'dan
           to'ldiradi (initApp, applyTelegramSafeArea). */
        --tg-safe-top: 0px;
      }

      /* ── DARK TEMA — Profil ekranidagi "Ilova ko'rinishi" tugmasi
         orqali tanlanadi (setTheme(), localStorage'da saqlanadi).
         Har bir token o'zining yorug' ma'nosini saqlab qoladi (masalan
         --surf hamon "karta yuzasi" degani), faqat rang qorong'i
         fonga mos qilib qayta hisoblangan. ────────────────────────── */
      :root[data-theme="dark"] {
        --bg: #0e1116;
        --surf: #171b22;
        --surf2: #1c212a;
        --brand: #5aa3dd;
        --ink: #eceef1;
        --t2: #9aa3b0;
        --t3: #7d8590;
        --t4: #6b7280;
        --t5: #c7ccd4;
        --chev: #5b6270;
        --red: #f0554a;
        --red-bg: rgba(240, 85, 74, 0.16);
        --red-bd: rgba(240, 85, 74, 0.4);
        --red-bd2: rgba(240, 85, 74, 0.45);
        --bd1: rgba(255, 255, 255, 0.08);
        --bd2: rgba(255, 255, 255, 0.1);
        --bd3: rgba(255, 255, 255, 0.12);
        --bd4: rgba(255, 255, 255, 0.18);
        --chip: #232833;
        --nav-ink: #c9cfd8;
        --nav-ink2: #a8b0bb;
        --nav-muted: #8b929c;
        --nav-act-bg: rgba(47, 122, 185, 0.18);
        --nav-act-ink: #7fb3dd;
        --nav-badge-bg: rgba(255, 255, 255, 0.08);
        --nav-badge-ink: #a8b0bb;
        --nav-coin-bg: rgba(217, 119, 6, 0.16);
        --nav-coin-ink: #e0a458;
        --nav-coin-mark: #d97706;
        --chip2: #272d38;
        --chip3: #2b313d;
        --sw-off: #3a4048;
        --nav-off: #5b6270;
        --amber: #f0a836;
        --amber-bg: rgba(217, 119, 6, 0.18);
        --amber-ink: #f0c479;
        --teal: #34d3a8;
        --teal-bg: rgba(30, 107, 87, 0.22);
        --tagblue: #6db3ea;
        --tagblue-bg: rgba(35, 96, 143, 0.22);
        --purple: #a89bf0;
        --purple-bg: rgba(75, 65, 168, 0.22);
        --pink: #e39cbe;
        --pink-bg: rgba(146, 52, 95, 0.22);
        --green: #34d066;
        --red-tint: rgba(240, 85, 74, 0.08);
        --act-lvl-0: #2b313d;
        --act-lvl-1: #2a3f52;
        --act-lvl-2: #355c7d;
        --act-lvl-3: #4180ad;
        --act-lvl-4: #5aa3dd;
        --act-icon-bg: rgba(90, 163, 221, 0.16);
      }

      html {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Sora", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-text-size-adjust: 100%;
        overflow-x: hidden;
      }
      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      ::-webkit-scrollbar {
        display: none;
      }

      /* ── KIRISH / LOADING (minimal — matn/marketing yo'q) ────────── */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .ld-mark {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        background: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .ld-bar {
        width: 140px;
        height: 3px;
        border-radius: 99px;
        background: var(--chip3);
        overflow: hidden;
      }
      .ld-bar-fill {
        width: 40%;
        height: 100%;
        background: var(--brand);
        border-radius: 99px;
        animation: ld-slide 1.1s ease-in-out infinite;
      }
      @keyframes ld-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      /* ── TOAST ──────────────────────────────────────────────────── */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 12px);
        background: var(--inkfill);
        color: #fff;
        font-size: 12.5px;
        font-weight: 500;
        padding: 10px 16px;
        border-radius: 11px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
        z-index: 900;
        max-width: 86vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ── EKRAN KARKASI ──────────────────────────────────────────── */
      .screen {
        display: none;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .screen.active {
        display: flex;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px 20px calc(100px + env(safe-area-inset-bottom, 0px));
      }
      .hdr {
        background: var(--surf);
        border-bottom: 1px solid var(--bd1);
        padding: calc(14px + var(--tg-safe-top)) 20px 14px;
        flex-shrink: 0;
      }
      .hdr-title {
        font-weight: 600;
        font-size: 19px;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .hdr-sub {
        font-size: 12px;
        color: var(--t2);
        margin-top: 1px;
      }
      .hdr-avatar-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--chip);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 12px;
        color: var(--ink);
        flex-shrink: 0;
        cursor: pointer;
        border: none;
      }

      /* ── PASTKI NAVIGATSIYA ─────────────────────────────────────── */
      #bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(80px + env(safe-area-inset-bottom, 0px));
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: var(--surf);
        border-top: 1px solid var(--bd2);
        display: flex;
        align-items: flex-start;
        padding-top: 11px;
        z-index: 200;
      }
      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        background: none;
        border: none;
        color: inherit;
        padding: 0;
      }
      .nav-ico {
        width: 21px;
        height: 21px;
        color: var(--nav-off);
      }
      .nav-ico svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .nav-item.active .nav-ico {
        color: var(--brand);
      }
      .nav-lbl {
        font-size: 10px;
        font-weight: 400;
        color: var(--t3);
      }
      .nav-item.active .nav-lbl {
        font-weight: 600;
        color: var(--brand);
      }

      /* ── TEMPO KARTASI ──────────────────────────────────────────── */
      .tempo {
        background: var(--brand);
        border-radius: 16px;
        padding: 18px;
        color: #fff;
      }
      .tempo-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .tempo-lbl {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .tempo-pct {
        font-weight: 600;
        font-size: 36px;
        line-height: 1;
        margin-top: 10px;
        letter-spacing: -0.03em;
      }
      .tempo-pct span {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.5);
      }
      .tempo-exp {
        text-align: right;
      }
      .tempo-exp .l1 {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.6);
      }
      .tempo-exp .l2 {
        font-weight: 600;
        font-size: 15px;
        margin-top: 6px;
      }
      .tempo-segs {
        margin-top: 16px;
        display: flex;
        gap: 3px;
      }
      .tempo-seg {
        flex: 1;
        height: 24px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.22);
      }
      .tempo-seg.done {
        background: var(--surf);
      }
      .tempo-seg.now {
        outline: 1.5px solid var(--red);
        outline-offset: 1px;
      }
      .tempo-foot {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.62);
        margin-top: 11px;
      }
      .tempo-note {
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.45);
        margin-top: 3px;
      }

      /* ── QARZ OGOHLANTIRISHI ────────────────────────────────────── */
      .debt-card {
        margin-top: 14px;
        background: var(--surf);
        border: 1px solid var(--red-bd2);
        border-radius: 14px;
        padding: 14px 15px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .debt-ico {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--red-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 15px;
        color: var(--red);
        flex-shrink: 0;
      }
      .debt-title {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .debt-sub {
        font-size: 12px;
        color: var(--t2);
        margin-top: 2px;
      }
      .debt-btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 9px;
        background: var(--inkfill);
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      /* ── BO'LIM SARLAVHALARI ────────────────────────────────────── */
      .sec-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 22px 0 10px;
      }
      .sec-title {
        font-weight: 600;
        font-size: 13.5px;
        color: var(--ink);
      }
      .sec-count {
        font-size: 12.5px;
        color: var(--t2);
      }
      .sec-upper {
        font-weight: 600;
        font-size: 11px;
        color: var(--t3);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 9px;
      }

      /* ── RO'YXAT KARTASI ────────────────────────────────────────── */
      .list-card {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        overflow: hidden;
      }
      .list-row {
        padding: 14px 15px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .list-row:last-child {
        border-bottom: none;
      }
      .list-row.clickable {
        cursor: pointer;
      }
      .list-card.late {
        border-color: rgba(220, 38, 38, 0.32);
      }
      .list-card.late .list-row {
        background: var(--red-tint);
      }
      .n-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #d97706;
        color: #fff;
        font-weight: 700;
        flex: none;
        line-height: 1;
      }
      .nshop-hdr-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        row-gap: 10px;
      }
      .nshop-hist-btn {
        height: 38px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--bd2);
        background: var(--surf);
        color: var(--ink);
        font: 500 13px inherit;
        white-space: nowrap;
        cursor: pointer;
        flex: none;
      }
      .nshop-balance-pill {
        height: 38px;
        padding: 0 6px 0 14px;
        border-radius: 10px;
        background: var(--inkfill);
        display: flex;
        align-items: center;
        gap: 11px;
        flex: none;
      }
      .nshop-balance-pill-label {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.65);
      }
      .nshop-balance-pill-value {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.12);
        font-size: 14px;
        font-weight: 600;
        color: #fff;
      }
      .nshop-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .nshop-card {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      /* NShop sahifasi birinchi ochilganda (mahsulotlar/balans hali
         so'ralayotganda) ko'rsatiladigan skelet — haqiqiy .nshop-grid
         qatoriga o'xshab quriladi, shu sabab yuklangach almashinish
         "sakramaydi". */
      .nshop-skel-img,
      .nshop-skel-line {
        background: linear-gradient(90deg, var(--surf2) 25%, var(--bd2) 37%, var(--surf2) 63%);
        background-size: 400% 100%;
        animation: nshop-shimmer 1.4s ease infinite;
      }
      .nshop-skel-img {
        height: 104px;
      }
      .nshop-skel-line {
        height: 10px;
        border-radius: 5px;
        margin: 11px 12px 0;
      }
      @keyframes nshop-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0 0;
        }
      }
      .nshop-img-placeholder {
        width: 100%;
        height: 104px;
        flex: none;
        background: repeating-linear-gradient(135deg, var(--surf2) 0px, var(--surf2) 9px, var(--bd2) 9px, var(--bd2) 18px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nshop-img-placeholder span {
        font-size: 11px;
        font-weight: 500;
        color: var(--t3);
      }
      .nshop-card-body {
        padding: 11px 12px 12px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .nshop-card-name {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.35;
      }
      .nshop-card-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 8px;
      }
      .nshop-coin-price {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }
      .nshop-stock-badge {
        height: 24px;
        padding: 0 9px;
        border-radius: 7px;
        background: var(--chip);
        font-size: 11.5px;
        font-weight: 600;
        color: var(--t5);
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      .nshop-stock-badge.low {
        background: rgba(217, 119, 6, 0.14);
        color: #a45f08;
      }
      .nshop-buy-btn {
        height: 36px;
        border-radius: 10px;
        margin-top: 10px;
        font-size: 12.5px;
      }
      .nshop-bottom-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 16px;
      }
      .nshop-panel {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        overflow: hidden;
      }
      .nshop-panel-hdr {
        padding: 15px 20px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
      }
      .nshop-panel-title {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }
      .nshop-panel-sub {
        font-size: 12px;
        color: var(--t3);
      }
      .nshop-purchase-row {
        padding: 13px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--bd1);
      }
      .nshop-purchase-row:last-child {
        border-bottom: none;
      }
      .nshop-purchase-thumb {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        flex: none;
        background: repeating-linear-gradient(135deg, var(--surf2) 0px, var(--surf2) 9px, var(--bd2) 9px, var(--bd2) 18px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nshop-purchase-thumb span {
        font-size: 10px;
        font-weight: 500;
        color: var(--t3);
      }

        width: 100%;
        height: 100%;
        display: block;
      }
      .chips {
        display: flex;
        gap: 7px;
        margin-top: 11px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .chip-btn {
        height: 29px;
        padding: 0 12px;
        border-radius: 8px;
        background: var(--chip);
        color: var(--t5);
        font-weight: 400;
        font-size: 12px;
        display: flex;
        align-items: center;
        white-space: nowrap;
        border: none;
        flex-shrink: 0;
        cursor: pointer;
      }
      .chip-btn.active {
        background: var(--inkfill);
        color: #fff;
        font-weight: 600;
      }
      .chip-btn.danger {
        background: var(--red-bg);
        color: var(--red);
        font-weight: 600;
      }

      /* ── LOYIHALAR RO'YXATI ─────────────────────────────────────── */
      .od-row,
      .pv-row {
        padding: 13px 15px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .od-row:last-child,
      .pv-row:last-child {
        border-bottom: none;
      }
      .od-bar {
        width: 6px;
        height: 34px;
        border-radius: 99px;
        background: var(--red);
        flex-shrink: 0;
      }
      .od-days {
        font-weight: 600;
        font-size: 12.5px;
        color: var(--red);
        flex-shrink: 0;
      }
      .pv-bar-wrap {
        width: 56px;
        flex-shrink: 0;
      }
      .pv-bar-track {
        height: 5px;
        border-radius: 99px;
        background: var(--chip3);
        overflow: hidden;
      }
      .pv-bar-fill {
        height: 100%;
        background: var(--brand);
      }
      .pv-pct {
        font-weight: 500;
        font-size: 10.5px;
        color: var(--t2);
        text-align: right;
        margin-top: 5px;
      }

      /* ── TRACKER ────────────────────────────────────────────────── */
      .trk-hdr {
        background: var(--surf);
        border-bottom: 1px solid var(--bd1);
        padding: calc(10px + var(--tg-safe-top)) 20px 13px;
        flex-shrink: 0;
      }
      .trk-main {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .trk-top {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .trk-back,
      .trk-more {
        font-weight: 600;
        font-size: 19px;
        color: var(--t3);
        background: none;
        border: none;
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }
      .trk-more {
        font-weight: 400;
        font-size: 17px;
      }
      .trk-name {
        font-weight: 600;
        font-size: 17px;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .trk-period {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 1px;
      }
      .seg {
        display: flex;
        gap: 4px;
        margin-top: 13px;
        background: var(--chip);
        padding: 3px;
        border-radius: 10px;
      }
      .seg-btn {
        flex: 1;
        height: 32px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: var(--t2);
        border: none;
        background: none;
        cursor: pointer;
      }
      .seg-btn.active {
        background: var(--surf);
        color: var(--ink);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
      }
      .trk-prog {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
      }
      .trk-prog-track {
        flex: 1;
        height: 6px;
        border-radius: 99px;
        background: var(--chip3);
        position: relative;
        overflow: hidden;
      }
      .trk-prog-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--brand);
        border-radius: 99px;
      }
      .trk-prog-tick {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 2px;
        background: var(--red);
      }
      .trk-prog-delta {
        font-weight: 600;
        font-size: 11.5px;
        color: var(--red);
        flex-shrink: 0;
      }
      .trk-prog-delta.ok {
        color: var(--t2);
      }

      .cal-week {
        display: flex;
        justify-content: space-between;
        margin-bottom: 9px;
      }
      .cal-week span {
        flex: 1;
        text-align: center;
        font-weight: 500;
        font-size: 10.5px;
        color: var(--t3);
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
      }
      .cal-cell {
        aspect-ratio: 1;
        border-radius: 11px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: transparent;
        border: none;
        padding: 0;
        font-family: inherit;
      }
      .cal-cell.empty {
        visibility: hidden;
      }
      .cal-cell .cn {
        font-weight: 400;
        font-size: 13px;
        color: var(--chev);
      }
      .cal-cell .cs {
        font-weight: 600;
        font-size: 9px;
        opacity: 0.7;
      }
      .cal-cell.pending {
        background: var(--surf);
        border: 1px solid var(--bd2);
      }
      .cal-cell.done {
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      .cal-cell.done .cn {
        font-weight: 600;
        color: #fff;
      }
      /* bugungi kun bajarilgan bo'lsa — ko'k, lekin ramka bilan ajratiladi */
      .cal-cell.done-today {
        outline: 2px solid var(--ink);
        outline-offset: -2px;
      }
      .cal-cell.done .cs {
        opacity: 1;
        font-size: 10px;
        font-weight: 700;
      }
      .cal-cell.today {
        background: var(--surf);
        border: 2px solid var(--brand);
      }
      .cal-cell.today .cn {
        font-weight: 600;
        color: var(--ink);
      }
      .cal-cell.today .cs {
        font-weight: 600;
        font-size: 8.5px;
        color: var(--t2);
        opacity: 1;
      }
      .cal-legend {
        display: flex;
        gap: 16px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .cal-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--t2);
      }
      .cal-legend-dot {
        width: 11px;
        height: 11px;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .today-task {
        padding: 13px 14px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .today-task:last-child {
        border-bottom: none;
      }
      .today-box {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        border: 1.8px solid var(--nav-off);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .today-box.checked {
        background: var(--brand);
        border-color: var(--brand);
      }
      .today-lbl {
        flex: 1;
        font-weight: 500;
        font-size: 14px;
        color: var(--ink);
      }
      .today-task.done .today-lbl {
        color: var(--t3);
        text-decoration: line-through;
      }

      /* checkbox to'ri (tarix sheet ichida) */
      .cb-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .cbi {
        position: relative;
        display: block;
      }
      .cbi input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: pointer;
      }
      .cbi-box {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1.5px solid var(--bd4);
        background: var(--surf);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--t2);
      }
      .cbi input:checked + .cbi-box {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }

      /* ── YANGI LOYIHA MODALI ────────────────────────────────────── */
      .np-ov-hdr {
        padding: 17px 22px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .np-ov-icon {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--tagblue-bg);
        color: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 15px;
        flex-shrink: 0;
      }
      .np-ov-title {
        font-weight: 600;
        font-size: 15px;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .np-ov-sub {
        font-size: 11.5px;
        color: var(--t3);
        margin-top: 1px;
      }
      .np-ov-body {
        padding: 20px 22px 4px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }
      .np2-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
      }
      @media (min-width: 860px) {
        .np2-grid {
          grid-template-columns: 1fr 300px;
          align-items: start;
        }
        .np2-preview-col {
          position: sticky;
          top: 0;
        }
        .np2-preview-col .preview-card {
          margin-top: 0;
        }
      }
      .np2-label {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--t3);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .np2-name-input {
        width: 100%;
        height: 52px;
        border-radius: 13px;
        border: 1.5px solid var(--bd4);
        padding: 0 15px;
        font-size: 17px;
        font-weight: 500;
        color: var(--ink);
        outline: none;
        font-family: inherit;
        background: var(--surf);
        margin-top: 9px;
      }
      .np2-name-input::placeholder {
        color: var(--t4);
        font-weight: 400;
      }
      .np2-name-input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(47, 122, 185, 0.12);
      }
      .np2-name-input.err {
        border-color: var(--red);
      }
      .np2-err-msg {
        font-size: 11.5px;
        color: var(--red);
        margin-top: 6px;
      }
      .np2-hint {
        font-size: 11.5px;
        color: var(--t3);
        line-height: 1.55;
        margin-top: 9px;
      }
      .np2-sub-hint {
        font-size: 11.5px;
        font-weight: 400;
        color: var(--t3);
        text-transform: none;
        letter-spacing: normal;
      }
      .np2-sec {
        margin-top: 22px;
      }
      .np2-chiprow {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .np2-chip {
        height: 36px;
        padding: 0 14px;
        border-radius: 11px;
        background: var(--chip);
        color: var(--t5);
        font-weight: 500;
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: none;
        cursor: pointer;
      }
      .np2-chip.on {
        background: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      .np2-chip.vol-on {
        background: var(--tagblue-bg);
        color: var(--brand);
        font-weight: 600;
        border: 1px solid rgba(47, 122, 185, 0.3);
      }
      .np2-anchor-card {
        margin-top: 11px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 15px;
        border-radius: 12px;
        background: var(--surf2);
        border: 1px solid var(--bd1);
      }
      .np2-anchor-cell {
        width: 38px;
        height: 42px;
        border-radius: 10px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .np2-anchor-mo {
        font-size: 9px;
        font-weight: 600;
        color: var(--t3);
        letter-spacing: 0.04em;
      }
      .np2-anchor-day {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.1;
        color: var(--ink);
      }
      .np2-anchor-arrow {
        font-size: 13px;
        color: var(--t3);
      }
      .np2-anchor-note {
        flex: 1;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--t2);
      }
      .np2-cal {
        margin-top: 11px;
        border: 1px solid var(--bd4);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.07);
      }
      .np2-cal-hdr {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .np2-cal-title {
        flex: 1;
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .np2-cal-nav {
        display: flex;
        gap: 5px;
      }
      .np2-cal-nav-btn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--chip);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--t2);
        cursor: pointer;
      }
      .np2-cal-nav-btn svg {
        width: 13px;
        height: 13px;
      }
      .np2-cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        margin-top: 14px;
      }
      .np2-cal-wd {
        text-align: center;
        font-size: 10.5px;
        font-weight: 500;
        color: var(--t3);
        padding-bottom: 3px;
      }
      .np2-cal-day {
        height: 34px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: var(--t5);
        background: none;
        border: none;
        cursor: pointer;
      }
      .np2-cal-day.other {
        color: var(--chev);
        cursor: default;
      }
      .np2-cal-day.today {
        box-shadow: inset 0 0 0 1px var(--bd4);
      }
      .np2-cal-day.sel {
        background: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      .np2-cal-foot {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid var(--bd1);
      }
      .np2-cal-foot-txt {
        flex: 1;
        font-size: 12px;
        color: var(--t2);
      }
      .np2-cal-confirm {
        height: 32px;
        padding: 0 13px;
        border-radius: 9px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        border: none;
        cursor: pointer;
      }
      .np2-vol-card {
        padding: 15px;
        border: 1px solid var(--bd1);
        border-radius: 14px;
        background: var(--surf);
        margin-top: 10px;
      }
      .np2-mas-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--bd1);
        flex-wrap: wrap;
      }
      .np2-mas-chip {
        height: 34px;
        padding: 0 11px 0 8px;
        border-radius: 10px;
        background: var(--chip);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .np2-mas-chip .av {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: var(--surf);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 600;
        color: var(--ink);
        flex-shrink: 0;
      }
      .np2-mas-chip .nm {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink);
      }
      .np2-mas-chip .rm {
        border: none;
        background: none;
        color: var(--t3);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        padding: 0 1px;
      }
      .np2-mas-add {
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px dashed var(--bd4);
        background: none;
        font-weight: 500;
        font-size: 12.5px;
        color: var(--t3);
        cursor: pointer;
      }
      .np2-err-inline {
        width: 100%;
        font-size: 11.5px;
        color: var(--red);
        margin-top: -2px;
      }
      .np2-tpl-panel {
        margin-top: 8px;
        border: 1px solid var(--bd2);
        border-radius: 12px;
        overflow: hidden;
      }
      .np2-tpl-row {
        padding: 11px 13px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--bd1);
        cursor: pointer;
      }
      .np2-tpl-row:last-child {
        border-bottom: none;
      }
      .np2-tpl-row:hover {
        background: var(--surf2);
      }
      .np2-tpl-name {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }
      .np2-tpl-meta {
        font-size: 11.5px;
        color: var(--t3);
      }
      .np2-tpl-del {
        border: none;
        background: none;
        color: var(--t4);
        cursor: pointer;
        font-size: 13px;
        padding: 2px 4px;
        display: flex;
        align-items: center;
      }
      .np2-tpl-del svg {
        width: 14px;
        height: 14px;
      }
      .np-ov-footer {
        padding: 14px 22px calc(18px + env(safe-area-inset-bottom, 0px));
        background: var(--surf);
        border-top: 1px solid var(--bd2);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }
      .np2-btn-outline {
        height: 42px;
        padding: 0 15px;
        border-radius: 11px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        font-weight: 500;
        font-size: 12.5px;
        color: var(--t5);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      .np2-btn-primary {
        height: 44px;
        padding: 0 18px;
        border-radius: 11px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 13.5px;
        border: none;
        cursor: pointer;
        white-space: nowrap;
      }
      .np2-btn-primary:disabled {
        opacity: 0.55;
      }
      .np2-notify-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .np2-notify-toggle .lbl {
        font-size: 12px;
        color: var(--t5);
        white-space: nowrap;
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .stepper-lbl {
        flex: 1;
        font-weight: 500;
        font-size: 14px;
        color: var(--ink);
      }
      .stepper-ctl {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .stepper-btn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--chip);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        border: none;
        cursor: pointer;
      }
      .stepper-val {
        width: 30px;
        text-align: center;
        font-weight: 600;
        font-size: 17px;
        color: var(--ink);
      }
      .divider {
        height: 1px;
        background: var(--bd1);
        margin: 14px 0;
      }
      .preview-card {
        margin-top: 20px;
        background: var(--brand);
        border-radius: 16px;
        padding: 17px;
        color: #fff;
      }
      .preview-upper {
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .preview-title {
        font-weight: 600;
        font-size: 17px;
        line-height: 1.4;
        margin-top: 10px;
        letter-spacing: -0.01em;
      }
      .preview-sub {
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.62);
        margin-top: 5px;
      }
      .preview-bars {
        display: flex;
        gap: 4px;
        margin-top: 15px;
        align-items: flex-end;
      }
      .preview-bars > div {
        flex: 1;
      }
      .preview-bar {
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.9);
      }
      .preview-bar.dim {
        background: rgba(255, 255, 255, 0.35);
      }
      .preview-bar-lbl {
        font-size: 9.5px;
        color: rgba(255, 255, 255, 0.55);
        text-align: center;
        margin-top: 6px;
      }
      .np2-check-list {
        margin-top: 14px;
      }
      .np2-check-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--bd1);
      }
      .np2-check-row:first-child {

      }
      .np2-check-ico {

        height: 18px;

        color: var(--brand);

        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .np2-check-txt {
        flex: 1;
        font-size: 12px;
        color: var(--t5);
      }
      .np2-debt-warn {
        margin-top: 14px;
        padding: 12px 13px;
        border-radius: 11px;

        border: 1px solid var(--red-bd);

        color: var(--t5);

        color: var(--red);

      /* ── BOSHQARUV ──────────────────────────────────────────────── */
      .fab {
        position: fixed;
        right: 20px;
        bottom: calc(100px + env(safe-area-inset-bottom, 0px));
        width: 54px;
        height: 54px;
        border-radius: 17px;
        background: var(--brand);
        color: #fff;
        font-weight: 300;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
        border: none;
        cursor: pointer;
        z-index: 150;
      }
      /* Vazifalar'da desktop'da header'da "+ Yangi vazifa" tugmasi
         allaqachon bor — pastdagi doira "+" tugmasi shu bilan
         takrorlanib, ikkita bir xil tugma chiqib qolardi. Mobilda esa
         (header tugmasi CSS orqali yashirin bo'lgani sabab) doira
         tugma yagona "yangi vazifa" yo'li bo'lib qolaveradi. */
      @media (min-width: 860px) {
        #tasks-fab {
          display: none !important;
        }
      }
      .grp-hdr {
        padding: 13px 15px;
        background: var(--surf2);
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--inkfill);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 12px;
        flex-shrink: 0;
      }
      .avatar.mute {
        background: var(--chip);
        color: var(--ink);
      }
      .grp-name {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .grp-sub {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 2px;
      }
      .grp-sub.warn {
        color: var(--red);
      }
      .grp-count {
        font-weight: 600;
        font-size: 12px;
        color: var(--t2);
        white-space: nowrap;
      }
      .toggle-row {
        padding: 12px 15px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .toggle-row:last-child {
        border-bottom: none;
      }
      .toggle-name {
        flex: 1;
        font-size: 13.5px;
        color: var(--t5);
      }
      .toggle-hint {
        font-size: 11.5px;
        color: var(--t4);
      }
      .tglsw {
        width: 40px;
        height: 24px;
        border-radius: 99px;
        background: var(--sw-off);
        padding: 2px;
        display: flex;
        justify-content: flex-start;
        cursor: pointer;
        border: none;
        flex-shrink: 0;
      }
      .tglsw.on {
        background: var(--inkfill);
        justify-content: flex-end;
      }
      .tglsw.brand.on {
        background: var(--brand);
      }
      .tglsw .knob {
        width: 20px;
        height: 20px;
        border-radius: 99px;
        background: var(--surf);
      }
      .m-item {
        padding: 12px 14px;
        border: 1px solid var(--bd2);
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        background: var(--surf);
      }
      .m-item-info {
        flex: 1;
        min-width: 0;
      }
      .m-item-label {
        font-weight: 600;
        font-size: 13.5px;
        color: var(--ink);
      }
      .m-item-sub {
        font-size: 11px;
        color: var(--t2);
        margin-top: 2px;
        line-height: 1.5;
      }
      .m-actions-inline {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .icon-btn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--chip);
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        cursor: pointer;
        font-size: 13px;
        color: var(--t2);
        flex-shrink: 0;
      }
      .icon-btn svg {
        width: 15px;
        height: 15px;
        display: block;
      }
      .icon-btn.danger {
        background: var(--red-bg);
        color: var(--red);
      }
      .debt-badge {
        font-size: 10px;
        font-weight: 700;
        color: var(--red);
        background: var(--red-bg);
        padding: 3px 7px;
        border-radius: 6px;
        flex-shrink: 0;
      }

      /* ── VAZIFA KARTOCHKASI: kanban'da HAM, mobil ro'yxatda HAM bir
         xil (global) — ikkalasida bir xil boy kontent ko'rinishi uchun */
      .kanban-col-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 12.5px;
        color: var(--t5);
        padding: 0 2px 10px;
      }
      .mini-chevron {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }
      .mini-chevron svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .kanban-dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .kanban-count {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--t4);
      }
      .kanban-add {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--chev);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .kanban-add:hover {
        background: var(--chip);
        color: var(--t2);
      }
      .kanban-add-row {
        height: 34px;
        border-radius: 10px;
        border: 1px dashed var(--bd4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--t4);

        margin-top: 2px;
      }
      .kanban-add-row:hover {
        border-color: var(--t4);
        color: var(--t2);
      }
      .kanban-archive-note {
        font-size: 11px;
        line-height: 1.5;
        color: var(--chev);
        padding: 6px 4px 0;
      }
      .chip-group {
        display: flex;
        gap: 4px;
        background: var(--chip);
        padding: 3px;
        border-radius: 9px;
      }
      .kcard {
        background: var(--surf);
        border: 1px solid var(--bd3);
        border-radius: 12px;
        padding: 13px;
        margin-bottom: 10px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .kcard:hover {
        border-color: var(--bd4);
      }
      .kcard.critical {
        border-color: var(--red-bd2);
      }
      .kcard.muted {
        background: var(--surf2);
        border-color: var(--bd1);

      }
      .kcard.muted:hover {
        border-color: var(--bd2);
      }
      .pri-urgent {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: var(--red);
        color: #fff;
        font-size: 9.5px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .kcard-check {
        width: 14px;
        height: 14px;
        border-radius: 99px;
        background: var(--green);
        color: #fff;
        font-size: 8.5px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .kcard-fail {
        width: 14px;
        height: 14px;
        border-radius: 99px;
        border: 1.8px solid var(--red);
        color: var(--red);
        font-size: 7.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .kcard-review {
        margin-top: 9px;
        padding: 7px 8px;
        border-radius: 8px;
        background: var(--amber-bg);
        font-size: 10px;
        font-weight: 500;
        color: var(--amber-ink);
      }
      .kcard-reason {
        margin-top: 9px;
        padding: 6px 8px;
        border-radius: 8px;
        background: var(--red-bg);
        font-size: 10px;
        font-weight: 600;
        color: var(--red);
      }
      .kcard-reason.muted {
        background: var(--chip3);
        color: var(--t3);
      }
      .tag-chip {
        font-size: 10.5px;
        font-weight: 500;
        color: var(--t5);
        background: var(--chip);
        padding: 2px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .avatar-sm {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        font-size: 10px;
      }
      .due-chip {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--t3);
        white-space: nowrap;
      }
      .due-chip.soon {
        color: var(--red);
        background: var(--red-bg);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .due-chip.late {
        color: #fff;
        background: var(--red);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .kcard-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .kcard-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--bd1);

      /* ── YUKLAMA QATORI (Vazifalar bosh sahifasi) ──────────────────── */

        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;

      .workload-item {
        display: flex;
        align-items: center;
        gap: 8px;

        padding: 8px 12px;
        flex-shrink: 0;
        min-width: 150px;
      }
      .workload-item.warn {
        background: var(--red-tint);
        border-color: var(--red-bd);
      }
      .workload-name {
        font-weight: 600;
        font-size: 12.5px;
        color: var(--ink);
      }
      .workload-sub {
        font-size: 11px;
        color: var(--t3);
        margin-top: 1px;
      }
      .workload-sub.warn {
        color: var(--red);
      }

      /* ── VAZIFA DETALI PANELI ───────────────────────────────────────── */
      .td-hdr {
        background: var(--surf);
        border-bottom: 1px solid var(--bd1);
        padding: calc(10px + var(--tg-safe-top)) 20px 10px;
        flex-shrink: 0;

      }
      .detail-breadcrumb {
        display: flex;

        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .detail-breadcrumb b {
        color: var(--ink);
        font-weight: 600;
      }
      .detail-breadcrumb .bc-link {
        cursor: pointer;
      }
      .detail-breadcrumb .bc-link:hover {
        color: var(--brand);

      }
      .detail-nav-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;

        color: var(--t2);
        font-size: 13px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .detail-nav-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .td-badge {
        height: 25px;
        padding: 0 10px;
        border-radius: 7px;
        font-size: 11.5px;
        font-weight: 600;
        display: inline-flex;

        gap: 6px;

      .td-badge.solid-red {
        background: var(--red);
        color: #fff;
      }
      .td-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .td-title {
        font-size: 21px;

        width: 8px;
        height: 8px;
        border-radius: 99px;
        flex-shrink: 0;

        color: #fff;

        background: var(--surf);

        background: var(--amber-bg);

        background: var(--amber);

      .td-status-btn.tint-red {
        background: var(--red-bg);
        color: var(--red);
        border: 1px solid rgba(220, 38, 38, 0.28);
      }
      .td-status-btn.tint-red .dot {
        background: var(--red);
      }
      .td-status-btn.tint-blue {
        background: var(--tagblue-bg);
        color: var(--tagblue);
        border: 1px solid rgba(47, 122, 185, 0.3);

        background: var(--brand);

      .td-status-btn:disabled {

      .td-check-row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 13px;
        border: 1px solid var(--bd2);

        margin-bottom: 10px;

        width: 20px;
        height: 20px;
        border-radius: 6px;

        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;

      .td-check-text {

        min-width: 0;

        font-weight: 500;
        color: var(--ink);
        word-break: break-word;

      .td-check-text.done {
        color: var(--t3);
        text-decoration: line-through;
      }
      .td-check-del {
        color: var(--t4);
        cursor: pointer;
        font-size: 15px;
        flex-shrink: 0;
        line-height: 1;

      .td-check-add-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 6px;

      .task-detail-grid {

          grid-template-columns: 1.4fr 1fr;
        }

      .detail-desc {

      .detail-prop-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--bd1);
        font-size: 13px;
      }
      .detail-prop-row:last-child {

      }
      .detail-prop-label {
        color: var(--t3);
        flex-shrink: 0;

        color: var(--t4);

        height: 32px;
        border-radius: 9px;

        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

        font-size: 13px;
        font-weight: 600;
        color: var(--red);

        margin-top: 2px;

        flex-shrink: 0;
