        return `<button type="button" class="tb-chip${current ? " on" : ""}" onclick="openTaskFilterPicker('${key}')">${escHtml(current || label)}${chev}</button>`;
      }
      // Filtr tanlash oynasi — barcha to'rt chip uchun bitta funksiya.
      function openTaskFilterPicker(key) {
        const titles = { assignee: "Xodim", project: "Loyiha", priority: "Ustuvorlik", tag: "Teg" };
        let options = [];
        if (key === "assignee") {
          options = computeWorkload(tasksList).map((w) => ({ v: w.username, label: w.name }));
        } else if (key === "project") {
          const seen = new Map();
          tasksList.forEach((t) => {
            if (t.projectSlug && !seen.has(t.projectSlug)) seen.set(t.projectSlug, t.projectLabel || t.projectSlug);
          });
          options = [...seen].map(([v, label]) => ({ v, label }));
        } else if (key === "priority") {
          options = Object.entries(TASK_PRIORITY_LABEL).map(([v, label]) => ({ v, label }));
        } else {
          options = tagsList.map((t) => ({ v: t.id, label: t.name }));
        }
        const { body } = makeSheet(titles[key]);
        const cur = taskBoardFilter[key];
        const rows = [{ v: "", label: "Hammasi" }, ...options]
          .map(
            (o) =>
              `<button type="button" class="btn ${o.v === cur ? "btn-blue" : "btn-soft"}" style="margin-bottom:8px;justify-content:flex-start;padding:0 14px" onclick="setTaskFilterValue('${key}','${escArg(o.v)}')">${escHtml(o.label)}</button>`,
          )
          .join("");
        body.innerHTML = rows;
      }
      function setTaskFilterValue(key, value) {
        taskBoardFilter[key] = value;
        document.querySelector(".overlay")?.remove();
        renderTasksBody();
      }
      // Chipda ko'rsatiladigan joriy qiymat matni (tanlanmagan bo'lsa "").
      function tbChipCurrent(key) {
        const v = taskBoardFilter[key];
        if (!v) return "";
        if (key === "assignee") return computeWorkload(tasksList).find((w) => w.username === v)?.name || v;
        if (key === "project") return tasksList.find((t) => t.projectSlug === v)?.projectLabel || v;
        if (key === "priority") return TASK_PRIORITY_LABEL[v] || v;
        return tagsList.find((t) => t.id === v)?.name || v;
      }
      // Doska — 4 ustun (Biriktirilgan/Jarayonda/Tekshiruvda/Bajarildi),
      // "Arxiv N" bosilganda beshinchisi qo'shiladi.
      // Ustun endi o'zi aylanadi — shuning uchun chegara kattaroq
      // (faqat DOM haddan tashqari katta bo'lib ketmasligi uchun).
      const TB_COL_LIMIT = 25;
      function buildTasksDesktopHtml(allTasks) {
        const scoped = tbApplySeg(allTasks);
        const archiveCount = allTasks.filter((t) => taskBoardColumn(t) === "archive").length;
        const cols = taskArchiveOpen ? TASK_BOARD_COLUMNS : TASK_BOARD_COLUMNS.filter((c) => c.key !== "archive");

        const colsHtml = cols
          .map((col, ci) => {
            const items = sortTasksForBoard(scoped.filter((t) => taskBoardColumn(t) === col.key));
            const expanded = taskColExpanded.has(col.key);
            const shown = expanded ? items : items.slice(0, TB_COL_LIMIT);
            const rest = items.length - shown.length;
            const cards = shown.map(tbCardHtml).join("");
            // Har bir ustunda "+" bor: shu yerdan ochilgan vazifa
            // o'sha ustunning holati bilan yaratiladi. Arxiv bundan
            // mustasno — unga vazifa qo'lda qo'yilmaydi.
            const ustunStatus = TDND_COL_STATUS[col.key];
            const addBtn = ustunStatus
              ? `<button type="button" class="tb-col-add" title="Shu ustunga yangi vazifa" onclick="openNewTaskSheet('${ustunStatus}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`
              : "";
            return `<div class="tb-col" data-col="${col.key}">
              <div class="tb-col-hdr">
                <span class="tb-col-dot" style="${col.dot}"></span>
                <span class="tb-col-title">${col.label}</span>
                <span class="tb-col-count">${items.length}</span>
                <div style="flex:1"></div>
                ${addBtn}
              </div>
              ${cards || `<div class="tb-col-empty">—</div>`}
              ${rest > 0 ? `<div class="tb-more" onclick="expandTaskCol('${col.key}')">+ yana ${rest} ta</div>` : ""}
            </div>`;
          })
          .join("");

        return `<div class="desktop-only tb-root">
          <div class="tb-filters">
            <div class="tb-seg">
              <button type="button" class="tb-seg-btn${taskSeg === "hammasi" ? " active" : ""}" onclick="setTaskSeg('hammasi')">Hammasi</button>
              <button type="button" class="tb-seg-btn${taskSeg === "menga" ? " active" : ""}" onclick="setTaskSeg('menga')">Menga</button>
              <button type="button" class="tb-seg-btn${taskSeg === "menberdim" ? " active" : ""}" onclick="setTaskSeg('menberdim')">Men berganlar</button>
            </div>
            <div class="tb-div"></div>
            ${tbChipHtml("assignee", "Xodim", tbChipCurrent("assignee"))}
            ${tbChipHtml("project", "Loyiha", tbChipCurrent("project"))}
            ${tbChipHtml("priority", "Ustuvorlik", tbChipCurrent("priority"))}
            ${tbChipHtml("tag", "Teg", tbChipCurrent("tag"))}
            <div style="flex:1"></div>
            <button type="button" class="tb-archive${taskArchiveOpen ? " on" : ""}" onclick="toggleTaskArchive()">Arxiv <b>${archiveCount}</b></button>
          </div>
          <div class="tb-board">${colsHtml}</div>
        </div>`;
      }
      // ── VAZIFALAR — mobil ro'yxat (v3) ────────────────────────────
      // Tepada 4 ta qisqa statistika kartasi (bosilsa — o'sha guruh
      // bo'yicha filtr), ostida holat bo'yicha guruhlangan ro'yxat.
      // Segment (Hammasi/Menga/Men berganlar) desktop bilan BIR XIL
      // holatdan (taskSeg) o'qiladi — pastki qismda alohida tugma yo'q,
      // sarlavha ostidagi segment ikkala o'lchamda ham amal qiladi.
      // Yorliqlar qisqartirilgan ("Jarayonda"/"Tekshiruvda" emas) — 375px
      // enli ekranda to'rtta karta bir qatorga sig'ishi uchun; pastdagi
      // guruh sarlavhalarida to'liq nomlar saqlanadi.
      const TM_STATS = [
        { key: "assigned", label: "Yangi" },
        { key: "in_progress", label: "Jarayon" },
        { key: "review", label: "Tekshiruv" },
        { key: "done", label: "Bajarildi" },
      ];
      function tmRowHtml(t) {
        const muted = ["done", "failed", "cancelled"].includes(t.status);
        const due = tbDueInfo(t);
        const pill = tbTagPillHtml(t);
        const av = taskPersonAvatarHtml(t, "tm-av");
        return `<div class="tm-row${muted ? " muted" : ""}" data-task="${escArg(t.id)}" onclick="openTaskActions('${escArg(t.id)}')">
          ${tbPriBarsHtml(t.priority)}
          <div class="tm-row-main">
            <div class="tm-row-title">${escHtml(t.title)}</div>
            <div class="tm-row-meta">
              ${pill}
              <span class="tm-row-proj">${escHtml(t.projectLabel || "Umumiy")}</span>
            </div>
          </div>
          <div class="tm-row-right">
            <span class="tm-row-due ${due.cls}">${escHtml(due.text)}</span>
            ${av}
          </div>
        </div>`;
      }
      function setTaskStatChip(key) {
        taskStatusChip = taskStatusChip === key ? "all" : key;
        renderTasksBody();
      }
      function buildTasksMobileHtml(allTasks) {
        const scoped = tbApplySeg(allTasks);
        const counts = {};
        TASK_BOARD_COLUMNS.forEach((c) => (counts[c.key] = scoped.filter((t) => taskBoardColumn(t) === c.key).length));

        const statsHtml = TM_STATS.map((st) => {
          const col = TASK_BOARD_COLUMNS.find((c) => c.key === st.key);
          return `<div class="tm-stat${taskStatusChip === st.key ? " on" : ""}" onclick="setTaskStatChip('${st.key}')">
            <div class="tm-stat-n">${counts[st.key]}</div>
            <div class="tm-stat-lbl"><span class="tm-stat-dot" style="${col.dot}"></span><span>${st.label}</span></div>
          </div>`;
        }).join("");

        // Ko'rsatiladigan guruhlar: stat kartasi tanlangan bo'lsa faqat
        // o'sha bittasi, aks holda barchasi (arxiv — faqat "Arxiv"
        // tanlanganda, u ham desktopdagi kabi ixtiyoriy).
        const groupKeys =
          taskStatusChip === "all"
            ? TASK_BOARD_COLUMNS.filter((c) => c.key !== "archive" || taskArchiveOpen).map((c) => c.key)
            : [taskStatusChip];

        const secsHtml = groupKeys
          .map((key) => {
            const col = TASK_BOARD_COLUMNS.find((c) => c.key === key);
            const items = sortTasksForBoard(scoped.filter((t) => taskBoardColumn(t) === key));
            if (!items.length) return "";
            return `<div class="tm-dz" data-col="${key}">
              <div class="tm-sec-hdr">
                <span class="tm-sec-dot" style="${col.dot}"></span>
                <span class="tm-sec-title">${col.label}</span>
                <span class="tm-sec-count">${items.length}</span>
              </div>
              <div class="tm-card">${items.map(tmRowHtml).join("")}</div>
            </div>`;
          })
          .join("");

        const segHtml = `<div class="tb-seg" style="width:100%">
            <button type="button" class="tb-seg-btn${taskSeg === "hammasi" ? " active" : ""}" style="flex:1" onclick="setTaskSeg('hammasi')">Hammasi</button>
            <button type="button" class="tb-seg-btn${taskSeg === "menga" ? " active" : ""}" style="flex:1" onclick="setTaskSeg('menga')">Menga</button>
            <button type="button" class="tb-seg-btn${taskSeg === "menberdim" ? " active" : ""}" style="flex:1" onclick="setTaskSeg('menberdim')">Men berganlar</button>
          </div>`;

        return `<div class="mobile-only tm-wrap">
          ${segHtml}
          <div class="tm-stats">${statsHtml}</div>
          ${tdndHintHtml()}
          ${secsHtml || `<div class="empty"><div class="empty-ico">✓</div><div class="empty-t">Vazifa yo'q</div><div class="empty-s">Filtrni o'zgartirib ko'ring.</div></div>`}
        </div>`;
      }
      // ── VAZIFANI SURIB KO'CHIRISH (drag & drop) ───────────────────
      // Kartani ushlab boshqa ustunga olib o'tish — vazifa statusi
      // o'zgaradi. Sichqoncha bilan sudrash darhol boshlanadi; barmoq
      // bilan esa avval bosib turish kerak (long-press), aks holda
      // ro'yxatni aylantirib bo'lmay qolardi.
      const TDND_HOLD_MS = 280;
      const TDND_SLOP = 8;
      // Ustun → qaysi statusga o'tkazadi. "Arxiv" ataylab yo'q: unga
      // vazifa bajarilmagani/bekor qilingani uchun yoki bajarilganiga
      // 30 kun o'tgani uchun tushadi — surib qo'yish bilan bu
      // holatlarning qaysi biri ekanini aytib bo'lmaydi.
      const TDND_COL_STATUS = { assigned: "todo", in_progress: "in_progress", review: "review", done: "done" };
      let tdnd = null;

      function canMoveTask(t) {
        // Backend bilan bir xil qoida: admin, vazifani ochgan kishi
        // yoki mas'ullardan biri statusni o'zgartira oladi.
        return isAdmin || taskIsMine(t) || canManageTask(t);
      }
      function tdndCanDrop(t, colKey) {
        const status = TDND_COL_STATUS[colKey];
        if (!status) return false;
        if (colKey === taskBoardColumn(t)) return false;
        // "Bajarildi" deb yakuniy tasdiqlash — faqat admin huquqi
        // (backend ham 403 qaytaradi), shuning uchun nishon ham
        // o'chirilgan ko'rinadi.
        if (status === "done" && !isAdmin) return false;
        return true;
      }
      function tdndHintSeen() {
        try {
          return localStorage.getItem("tdnd-hint") === "1";
        } catch (e) {
          // Shaxsiy rejimda localStorage xato beradi — izohni
          // ko'rsatmaganimiz ma'qul, har safar chiqaveradigan
          // yo'riqnoma bezor qiladi.
          return true;
        }
      }
      function tdndHintHtml() {
        if (tdndHintSeen()) return "";
        return `<div class="tdnd-hint">Kartani <b>bosib turing</b> va holatini o'zgartirish uchun pastdagi bo'limga suring</div>`;
      }
      function tdndInit() {
        document.addEventListener("pointerdown", tdndDown);
        // Sudrab turganda sahifa aylanmasin. Aynan `touchmove` —
        // `pointermove`da aylanishni to'xtatib bo'lmaydi.
        document.addEventListener("touchmove", (e) => { if (tdnd?.active) e.preventDefault(); }, { passive: false });
        // Uzoq bosilganda chiqadigan tizim menyusi sudrashni buzadi.
        document.addEventListener("contextmenu", (e) => { if (tdnd?.active) e.preventDefault(); });
      }
      function tdndDown(e) {
        if (tdnd || (e.pointerType === "mouse" && e.button !== 0)) return;
        const card = e.target?.closest?.("[data-task]");
        if (!card) return;
        const zone = card.closest("[data-col]");
        if (!zone) return;
        const t = tasksList.find((x) => x.id === card.dataset.task);
        if (!t || !canMoveTask(t)) return;
        tdnd = {
          task: t,
          card,
          from: zone.dataset.col,
          x: e.clientX,
          y: e.clientY,
          startX: e.clientX,
          startY: e.clientY,
          touch: e.pointerType !== "mouse",
          active: false,
          moved: false,
          ghost: null,
          over: null,
          raf: 0,
          timer: 0,
        };
        if (tdnd.touch) tdnd.timer = setTimeout(tdndStart, TDND_HOLD_MS);
        document.addEventListener("pointermove", tdndMove);
        document.addEventListener("pointerup", tdndUp);
        document.addEventListener("pointercancel", tdndEnd);
      }
      function tdndMove(e) {
        if (!tdnd) return;
        tdnd.x = e.clientX;
        tdnd.y = e.clientY;
        const surildi =
          Math.abs(e.clientX - tdnd.startX) > TDND_SLOP || Math.abs(e.clientY - tdnd.startY) > TDND_SLOP;
        if (!tdnd.active) {
          // Barmoq bosib turmasdan surilsa — bu ro'yxatni aylantirish,
          // sudrash emas: boshlamay, butunlay voz kechamiz.
          if (tdnd.touch) {
            if (surildi) tdndEnd();
            return;
          }
          if (!surildi) return;
          tdndStart();
        }
        tdnd.moved = true;
        tdndPaint();
      }
      function tdndStart() {
        if (!tdnd || tdnd.active) return;
        clearTimeout(tdnd.timer);
        tdnd.active = true;
        const r = tdnd.card.getBoundingClientRect();
        tdnd.dx = tdnd.x - r.left;
        tdnd.dy = tdnd.y - r.top;
        const g = tdnd.card.cloneNode(true);
        g.classList.add("tdnd-ghost");
        g.classList.remove("tdnd-src");
        g.style.width = r.width + "px";
        document.body.appendChild(g);
        tdnd.ghost = g;
        tdnd.card.classList.add("tdnd-src");
        document.body.classList.add("tdnd-on");
        // Telefonda ustunlar yo'q — pastda status chizig'i chiqadi,
        // shunda nishonni qidirib ro'yxatni aylantirish kerak emas.
        if (!window.matchMedia("(min-width: 860px)").matches) tdndShowBar();
        tdndZones().forEach((z) => z.classList.toggle("tdnd-no", !tdndCanDrop(tdnd.task, z.dataset.col)));
        tdndPaint();
        tg()?.HapticFeedback?.impactOccurred?.("light");
        tdnd.raf = requestAnimationFrame(tdndTick);
      }
      function tdndZones() {
        return [...document.querySelectorAll("[data-col]")];
      }
      function tdndShowBar() {
        const bar = document.createElement("div");
        bar.className = "tdnd-bar";
        bar.innerHTML = TASK_BOARD_COLUMNS.filter((c) => TDND_COL_STATUS[c.key])
          .map(
            (c) =>
              `<div class="tdnd-bar-z" data-col="${c.key}"><span class="tdnd-bar-dot" style="${c.dot}"></span>${escHtml(c.label)}</div>`,
          )
          .join("");
        document.body.appendChild(bar);
      }
      function tdndPaint() {
        if (!tdnd?.active) return;
        if (tdnd.ghost) {
          tdnd.ghost.style.left = tdnd.x - tdnd.dx + "px";
          tdnd.ghost.style.top = tdnd.y - tdnd.dy + "px";
        }
        // Nusxa `pointer-events: none` — shuning uchun ostidagi
        // nishon topiladi.
        const el = document.elementFromPoint(tdnd.x, tdnd.y);
        const zone = el?.closest("[data-col]");
        const nishon = zone && tdndCanDrop(tdnd.task, zone.dataset.col) ? zone : null;
        if (nishon !== tdnd.over) {
          tdnd.over?.classList.remove("tdnd-over");
          nishon?.classList.add("tdnd-over");
          if (nishon) tg()?.HapticFeedback?.selectionChanged?.();
          tdnd.over = nishon;
        }
      }
      // Chekkaga olib borilganda ro'yxat/doska o'zi suriladi — aks
      // holda ko'rinmayotgan ustunga vazifa olib o'tib bo'lmaydi.
      function tdndTick() {
        if (!tdnd?.active) return;
        tdndScrollEdges();
        tdnd.raf = requestAnimationFrame(tdndTick);
      }
      function tdndScroller(el) {
        for (let p = el; p; p = p.parentElement) {
          const oy = getComputedStyle(p).overflowY;
          if ((oy === "auto" || oy === "scroll") && p.scrollHeight > p.clientHeight + 1) return p;
        }
        return document.scrollingElement;
      }
      function tdndScrollEdges() {
        const EDGE = 64;
        const STEP = 11;
        const { x, y } = tdnd;
        const sc = tdndScroller(tdnd.over || tdnd.card);
        if (sc) {
          const r = sc === document.scrollingElement
            ? { top: 0, bottom: window.innerHeight }
            : sc.getBoundingClientRect();
          if (y < r.top + EDGE) sc.scrollTop -= STEP;
          else if (y > r.bottom - EDGE) sc.scrollTop += STEP;
        }
        const board = document.querySelector(".tb-board");
        if (board && board.scrollWidth > board.clientWidth + 1) {
          const r = board.getBoundingClientRect();
          if (x < r.left + EDGE) board.scrollLeft -= STEP;
          else if (x > r.right - EDGE) board.scrollLeft += STEP;
        }
      }
      function tdndUp() {
        const zone = tdnd?.over;
        const task = tdnd?.task;
        const kochdi = !!(tdnd?.active && tdnd?.moved);
        tdndEnd();
        if (!kochdi || !zone || !task) return;
        tdndApply(task, zone.dataset.col);
      }
      function tdndEnd() {
        if (!tdnd) return;
        clearTimeout(tdnd.timer);
        cancelAnimationFrame(tdnd.raf);
        const sudraldi = tdnd.active && tdnd.moved;
        tdnd.ghost?.remove();
        tdnd.card.classList.remove("tdnd-src");
        document.querySelector(".tdnd-bar")?.remove();
        tdndZones().forEach((z) => z.classList.remove("tdnd-over", "tdnd-no"));
        document.body.classList.remove("tdnd-on");
        document.removeEventListener("pointermove", tdndMove);
        document.removeEventListener("pointerup", tdndUp);
        document.removeEventListener("pointercancel", tdndEnd);
        tdnd = null;
        // Sudrashdan keyin keladigan "click" kartani ochib yubormasin.
        if (sudraldi) {
          document.addEventListener("click", tdndSwallowClick, true);
          setTimeout(() => document.removeEventListener("click", tdndSwallowClick, true), 350);
        }
      }
      function tdndSwallowClick(e) {
        e.stopPropagation();
        e.preventDefault();
        document.removeEventListener("click", tdndSwallowClick, true);
      }
      function tdndApply(t, colKey) {
        const status = TDND_COL_STATUS[colKey];
        if (!status) return;
        try {
          localStorage.setItem("tdnd-hint", "1");
        } catch (e) {}
        // Muddatsiz vazifa (hali navbatga qo'yilmagan) ishga tushmaydi —
        // backend muddat talab qiladi. Xato ko'rsatgandan ko'ra darhol
        // sana so'raymiz, chunki odam nima qilmoqchi ekani aniq.
        if (!t.dueDate && ["todo", "in_progress", "review"].includes(status)) {
          openSetDueDateForm(t.id, status);
          return;
        }
        setTaskStatus(t.id, status);
      }
      // Vazifani tahrirlash va o'chirish — admin yoki uni OCHGAN kishi.
      // (Statusni o'zgartirish alohida qoida bo'yicha: admin yoki mas'ul.)
      function canManageTask(t) {
        return isAdmin || (!!t.createdByUsername && t.createdByUsername === currentUser);
      }
      function taskShortRef(id) {
        return id.slice(0, 8).toUpperCase();
      }
      function splitDetail(detail) {
        const i = (detail || "").indexOf(":");
        if (i === -1) return [detail || "", ""];
        return [detail.slice(0, i), detail.slice(i + 1)];
      }
      function openTaskActions(id) {
        const t = tasksList.find((x) => x.id === id);
        if (!t) return;
        // Vazifa boshqa ekrandan ochilgan bo'lsa (masalan "Bugun"), u
        // ko'rinayotgan ro'yxatda bo'lmasligi mumkin — o'shanda butun
        // ro'yxat, lekin baribir shu ketma-ketlikda.
        let nav = visibleTasksInOrder();
        if (!nav.some((x) => x.id === id)) nav = sortTasksForBoard(tasksList);
        taskDetailNav = { ids: nav.map((x) => x.id), index: nav.findIndex((x) => x.id === id) };
        taskDetailTab = "comments";
        openSubScreen("screen-taskdetail", closeTaskDetailScreen);
        renderTaskDetailSheet(t);
      }
      function closeTaskDetailScreen() {
        showTab(activeTab);
      }
      function isTaskDetailScreenOpen() {
        return !!document.getElementById("screen-taskdetail")?.classList.contains("active");
      }
      // Vazifa mutatsiyasidan keyin (status, ustuvorlik, tag, muddat)
      // sahifa hali ochiq bo'lsa — yopib qo'ymasdan, yangilangan
      // ma'lumot bilan o'sha joyning o'zida qayta chiziladi.
      function refreshTaskDetailIfOpen(id) {
        if (!isTaskDetailScreenOpen()) return;
        const fresh = tasksList.find((x) => x.id === id);
        if (fresh) renderTaskDetailSheet(fresh);
      }
      function stepTaskDetail(dir) {
        const newIndex = taskDetailNav.index + dir;
        if (newIndex < 0 || newIndex >= taskDetailNav.ids.length) return;
        const t = tasksList.find((x) => x.id === taskDetailNav.ids[newIndex]);
        if (!t) return;
        taskDetailNav.index = newIndex;
        taskDetailTab = "comments";
        renderTaskDetailSheet(t);
      }
      // Muddat o'tib ketgan/bugun tugaydigan banner ostidagi izoh —
      // ishning qaysi bosqichida to'xtab qolgani.
      function taskWorkStateLabel(status) {
        if (status === "backlog" || status === "todo") return "ish hali boshlanmagan";
        if (status === "in_progress") return "ish jarayonda";
        if (status === "review") return "tekshiruvda";
        return "";
      }
      // "Keyingi qadam" bloki — 4 bosqichli vizual ko'rsatkich
      // (Biriktirilgan/Jarayonda/Tekshiruvda/Bajarildi, TASK_BOARD_COLUMNS
      // bilan bir xil guruhlash) + joriy holatdan mumkin bo'lgan amal
      // tugmalari. Bajarilmadi/Bekor qilingan — alohida (bosqichsiz).
      function buildTaskStepperHtml(t, canChangeStatus) {
        if (["failed", "cancelled"].includes(t.status)) {
          if (t.status === "failed" && t.reason) {
            return `<div class="rail-title" style="margin:0">Bajarilmagan sababi</div>
              <div style="background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px">${escHtml(t.reason)}</div>`;
          }
          return `<div class="rail-title" style="margin:0">Holat</div><div style="font-size:13px;color:var(--t3);margin-top:8px">${escHtml(TASK_STATUS_LABEL[t.status])}</div>`;
        }

        const steps = TASK_BOARD_COLUMNS.slice(0, 4); // assigned/in_progress/review/done — arxiv bu yerda kerak emas
        const curKey = taskBoardColumn(t);
        const curIdx = Math.max(0, steps.findIndex((s) => s.key === curKey));
        const stepsHtml = steps
          .map((s, i) => {
            const state = i < curIdx ? "done" : i === curIdx ? "current" : "";
            const line = i < steps.length - 1 ? `<div class="td-stepper-line${i < curIdx ? " done" : ""}"></div>` : "";
            return `<div class="td-stepper-step">
              <div class="td-stepper-dotwrap">
                <div class="td-stepper-dot${state ? " " + state : ""}"></div>
                <div class="td-stepper-lbl${state === "current" ? " current" : ""}">${s.label}</div>
              </div>
              ${line}
            </div>`;
          })
          .join("");

        let actionsHtml = "";
        if (canChangeStatus) {
          if (t.status === "backlog") {
            actionsHtml = `<button type="button" class="td-status-btn lg solid-blue" onclick="openSetDueDateForm('${escArg(t.id)}')"><span class="dot"></span>Navbatga qo'yish</button>`;
          } else if (t.status === "todo" || t.status === "in_progress") {
            const isTodo = t.status === "todo";
            const primary = isTodo
              ? `<button type="button" class="td-status-btn lg solid-blue" onclick="setTaskStatus('${escArg(t.id)}','in_progress',this)"><span class="dot"></span>Ishni boshladim</button>`
              : `<button type="button" class="td-status-btn lg solid-blue" onclick="setTaskStatus('${escArg(t.id)}','review',this)"><span class="dot"></span>Tekshiruvga yubordim</button>`;
            const secondary = [
              isAdmin
                ? `<button type="button" class="td-status-btn solid-green" onclick="setTaskStatus('${escArg(t.id)}','done',this)"><span class="dot"></span>Darhol bajarildi</button>`
                : "",
              `<button type="button" class="td-status-btn tint-red" onclick="openTaskFailForm('${escArg(t.id)}')"><span class="dot"></span>Bajarolmadim</button>`,
            ].filter(Boolean);
            actionsHtml = `${primary}<div class="td-status-row">${secondary.join("")}</div>`;
          } else if (t.status === "review") {
            if (isAdmin) {
              actionsHtml = `<button type="button" class="td-status-btn lg solid-green" onclick="setTaskStatus('${escArg(t.id)}','done',this)"><span class="dot"></span>Tasdiqlash</button>
                <div class="td-status-row">
                  <button type="button" class="td-status-btn tint-blue" onclick="setTaskStatus('${escArg(t.id)}','in_progress',this)"><span class="dot"></span>Qaytarish</button>
                  <button type="button" class="td-status-btn tint-red" onclick="openTaskFailForm('${escArg(t.id)}')"><span class="dot"></span>Bajarolmadim</button>
                </div>`;
            } else {
              actionsHtml = `<div class="f-hint" style="margin-top:2px">Vazifa tekshiruvda — admin tasdiqlashini kutmoqda.</div>`;
            }
          }
        }

        const hintHtml =
          actionsHtml && taskAssignees(t).length && t.status !== "review"
            ? `<div class="td-notify-hint">Har qadam Telegram orqali ${taskAssignees(t).map((a) => `<b>@${escHtml(a.username)}</b>`).join(", ")}ga xabar qiladi</div>`
            : "";

        return `<div class="rail-title" style="margin:0">Keyingi qadam</div>
          <div class="td-stepper">${stepsHtml}</div>
          ${actionsHtml ? `<div style="margin-top:17px">${actionsHtml}</div>` : ""}
          ${hintHtml}`;
      }
      // ── VAZIFA DETALI — mobil ko'rinish (v3) ──────────────────────
      // Joriy holatdan kelib chiqib BITTA asosiy amal tugmasi; qolgan
      // amallar "⋯" menyusida (desktopdagi buildTaskStepperHtml bilan
      // bir xil qoidalar, faqat mobil uchun bitta tugmaga yig'ilgan).
      function taskPrimaryAction(t, canChangeStatus) {
        if (!canChangeStatus) return null;
        if (["done", "failed", "cancelled"].includes(t.status)) return null;
        if (t.status === "backlog")
          return { label: "Navbatga qo'yish", onclick: `openSetDueDateForm('${escArg(t.id)}')` };
        if (t.status === "todo")
          return { label: "Ishni boshladim", onclick: `setTaskStatus('${escArg(t.id)}','in_progress',this)` };
        if (t.status === "in_progress")
          return { label: "Tekshiruvga yubordim", onclick: `setTaskStatus('${escArg(t.id)}','review',this)` };
        if (t.status === "review") {
          if (isAdmin) return { label: "Tasdiqlash", cls: "green", onclick: `setTaskStatus('${escArg(t.id)}','done',this)` };
          return { label: "Admin tasdiqlashini kutmoqda", disabled: true };
        }
        return null;
      }
      function openTaskMobileMenu(id) {
        const t = tasksList.find((x) => x.id === id);
        if (!t) return;
        const canChangeStatus = isAdmin || taskIsMine(t);
        const open = !["done", "failed", "cancelled"].includes(t.status);
        const close = () => `document.querySelector('.overlay')?.remove();`;
        const items = [];
        if (canChangeStatus && open && isAdmin && t.status !== "review")
          items.push(`<button type="button" class="btn btn-soft" style="margin-bottom:10px" onclick="${close()}setTaskStatus('${escArg(t.id)}','done')">Darhol bajarildi</button>`);
        if (canChangeStatus && open && t.status === "review" && isAdmin)
          items.push(`<button type="button" class="btn btn-soft" style="margin-bottom:10px" onclick="${close()}setTaskStatus('${escArg(t.id)}','in_progress')">Qaytarish</button>`);
        if (canChangeStatus && open && t.status !== "backlog")
          items.push(`<button type="button" class="btn btn-soft" style="margin-bottom:10px" onclick="${close()}openTaskFailForm('${escArg(t.id)}')">Bajarolmadim</button>`);
        if (isAdmin && open && t.dueDate)
          items.push(`<button type="button" class="btn btn-soft" style="margin-bottom:10px" onclick="${close()}openPushDueDateForm('${escArg(t.id)}')">Muddatni surish</button>`);
        if (canManageTask(t)) {
          items.push(`<button type="button" class="btn btn-soft" style="margin-bottom:10px" onclick="${close()}openEditTaskSheet('${escArg(t.id)}')">Tahrirlash</button>`);
          items.push(`<button type="button" class="btn btn-soft" style="margin-bottom:10px" onclick="${close()}duplicateTask('${escArg(t.id)}')">Nusxalash</button>`);
          items.push(`<button type="button" class="btn btn-danger" onclick="${close()}deleteTask('${escArg(t.id)}','${escArg(t.title)}')">O'chirish</button>`);
        }
        const { body } = makeSheet(t.title);
        body.innerHTML = items.join("") || `<div style="font-size:13px;color:var(--t3)">Amal mavjud emas</div>`;
      }
      // Sarlavha (ref · holat, sanoq) va pastki panel (bosqichlar + amal)
      function renderTaskDetailMobileChrome(t, canChangeStatus) {
        const hdr = document.getElementById("tdm-hdr");
        if (hdr) {
          const nav = taskDetailNav;
          const scopeWord = taskSeg === "menga" ? " menga" : taskSeg === "menberdim" ? " men berganlar" : "";
          const counter = nav.index >= 0 && nav.ids.length ? `${nav.index + 1} / ${nav.ids.length}${scopeWord}` : "";
          hdr.innerHTML = `
            <button type="button" class="tdm-iconbtn" onclick="closeTaskDetailScreen()" aria-label="Orqaga">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="tdm-hdr-mid">
              <div class="tdm-hdr-ref">${tbRef(t.id)} · ${escHtml(TASK_STATUS_LABEL[t.status])}</div>
              <div class="tdm-hdr-sub">${escHtml(counter)}</div>
            </div>
            <button type="button" class="tdm-iconbtn" onclick="openTaskMobileMenu('${escArg(t.id)}')" aria-label="Menyu">⋯</button>`;
        }

        const bar = document.getElementById("tdm-bar");
        if (!bar) return;
        const steps = TASK_BOARD_COLUMNS.slice(0, 4);
        const curIdx = Math.max(0, steps.findIndex((c) => c.key === taskBoardColumn(t)));
        const closed = ["failed", "cancelled"].includes(t.status);
        const stepsHtml = closed
          ? ""
          : `<div class="tdm-steps">${steps
              .map((st, i) => {
                const cls = i < curIdx ? "done" : i === curIdx ? "current" : "";
                const line = i < steps.length - 1 ? `<div class="tdm-step-line${i < curIdx ? " done" : ""}"></div>` : "";
                return `<div class="tdm-step-dot${cls ? " " + cls : ""}"></div>${line}`;
              })
              .join("")}</div>`;
        const act = taskPrimaryAction(t, canChangeStatus);
        const actHtml = act
          ? `<button type="button" class="tdm-act${act.cls ? " " + act.cls : ""}"${act.disabled ? " disabled" : ""}${act.onclick ? ` onclick="${act.onclick}"` : ""}>${escHtml(act.label)}</button>`
          : `<button type="button" class="tdm-act" disabled>${escHtml(TASK_STATUS_LABEL[t.status])}</button>`;
        bar.innerHTML = `${stepsHtml}
          <div class="tdm-bar-row">
            ${actHtml}
            <button type="button" class="tdm-more" onclick="openTaskMobileMenu('${escArg(t.id)}')">⋯</button>
          </div>`;
      }
      function buildTaskDetailMobileHtml(t, canChangeStatus) {
        const isOpen = !["done", "failed", "cancelled"].includes(t.status);
        const daysLeft = t.dueDate ? daysBetween(todayDate(), parseISO(t.dueDate)) : null;

        let banner = "";
        if (isOpen && daysLeft !== null && daysLeft <= 2) {
          const late = daysLeft < 0;
          const today = daysLeft === 0;
          const title = late ? `Muddat ${Math.abs(daysLeft)} kun oldin tugagan` : today ? "Muddat bugun tugaydi" : `Muddatga ${daysLeft} kun qoldi`;
          banner = `<div class="tdm-banner${late || today ? "" : " soft"}">
            <span class="tdm-banner-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
            <div style="flex:1;min-width:0">
              <div class="tdm-banner-t">${title}</div>
              <div class="tdm-banner-s">${escHtml(fmtDay(parseISO(t.dueDate)))}${taskWorkStateLabel(t.status) ? " · " + taskWorkStateLabel(t.status) : ""}</div>
            </div>
          </div>`;
        }

        const pill = tbTagPillHtml(t);
        const reasonHtml =
          t.status === "failed" && t.reason
            ? `<div class="tdm-banner" style="margin-top:12px"><div style="flex:1"><div class="tdm-banner-t">Bajarilmadi</div><div class="tdm-banner-s">${escHtml(t.reason)}</div></div></div>`
            : "";

        const av = taskPersonAvatarHtml(t, "tm-av");

        return `<div class="mobile-only tdm-wrap">
          ${banner}
          <div class="tdm-card">
            ${pill}
            <div class="tdm-title">${escHtml(t.title)}</div>
            ${t.description ? `<div class="tdm-desc">${escHtml(t.description)}</div>` : ""}
            ${reasonHtml}
          </div>
          <div class="tdm-props">
            <div class="tdm-prop">
              <div class="tdm-prop-lbl">Mas'ul</div>
              <div class="tdm-prop-val">${av}${escHtml(taskAssigneeNames(t) || "Biriktirilmagan")}</div>
            </div>
            <div class="tdm-prop">
              <div class="tdm-prop-lbl">Ustuvorlik</div>
              <div class="tdm-prop-val">${tbPriBarsHtml(t.priority)}${escHtml(TASK_PRIORITY_LABEL[t.priority])}</div>
            </div>
            <div class="tdm-prop">
              <div class="tdm-prop-lbl">${t.startDate && t.dueDate && t.startDate !== t.dueDate ? "Ish vaqti" : "Muddat"}</div>
              <div class="tdm-prop-val">${t.dueDate ? escHtml(fmtDateRangeField(t.startDate, t.dueDate)) : "Muddatsiz"}</div>
            </div>
            <div class="tdm-prop">
              <div class="tdm-prop-lbl">Loyiha</div>
              <div class="tdm-prop-val link">${escHtml(t.projectLabel || "Umumiy")}</div>
            </div>
            <div class="tdm-prop">
              <div class="tdm-prop-lbl">Biriktirdi</div>
              <div class="tdm-prop-val">${t.createdByUsername ? "@" + escHtml(t.createdByUsername) : "—"}</div>
            </div>
          </div>
          <div class="tdm-card" id="tdm-checklist" style="display:none"></div>
        </div>`;
      }
      // Checklist — mobil kartaga chizish (desktopdagi #td-checklist bilan
      // bir xil ma'lumotdan, bitta so'rov).
      function renderTaskChecklistMobile(taskId, items, canEdit) {
        const el = document.getElementById("tdm-checklist");
        if (!el) return;
        if (!items.length) {
          el.style.display = "none";
          el.innerHTML = "";
          return;
        }
        el.style.display = "";
        const done = items.filter((it) => it.done).length;
        el.innerHTML = `
          <div class="tdm-check-hdr">
            <div class="tdm-check-t">Checklist</div>
            <div class="tdm-check-n">${done} / ${items.length}</div>
          </div>
          ${items
            .map(
              (it) => `<div class="tdm-check-row">
                <div class="tdm-check-box${it.done ? " done" : ""}" ${canEdit ? `onclick="toggleChecklistItem('${escArg(taskId)}','${escArg(it.id)}',${!it.done})"` : ""}>${it.done ? "✓" : ""}</div>
                <div class="tdm-check-txt${it.done ? " done" : ""}">${escHtml(it.text)}</div>
              </div>`,
            )
            .join("")}`;
      }

      // Vazifa detali — chapda tavsif+checklist+izoh/faoliyat, o'ngda
      // keyingi qadam va xossalar (dizayn asosida). Prev/next joriy
      // ro'yxat bo'yicha.
      function renderTaskDetailSheet(t) {
        const canChangeStatus = isAdmin || taskIsMine(t);
        const nav = taskDetailNav;

        const bc = document.getElementById("td-breadcrumb");
        if (bc)
          bc.innerHTML = `<span class="bc-link" onclick="showTab('tasks')">Vazifalar</span> / <span class="bc-link" onclick="showTab('tasks')">${escHtml(TASK_STATUS_LABEL[t.status])}</span> / <b>${taskShortRef(t.id)}</b>`;
        const counterEl = document.getElementById("td-counter");
        if (counterEl) counterEl.textContent = nav.index >= 0 && nav.ids.length ? `${nav.index + 1} / ${nav.ids.length}` : "";
        const prevBtn = document.getElementById("td-prev-btn");
        const nextBtn = document.getElementById("td-next-btn");
        if (prevBtn) prevBtn.disabled = nav.index <= 0;
        if (nextBtn) nextBtn.disabled = nav.index < 0 || nav.index >= nav.ids.length - 1;

        const tagsRowHtml = `<div class="kcard-tags" style="margin-top:12px">
          ${(t.tags || [])
            .map((tg) => {
              const c = tagColor(tg.name);
              return `<span class="tag-chip" style="background:${c.bg};color:${c.ink}">${escHtml(tg.name)}${isAdmin ? ` <span style="cursor:pointer" onclick="removeTaskTag('${escArg(t.id)}','${escArg(tg.id)}')">×</span>` : ""}</span>`;
            })
            .join("")}
          ${isAdmin ? `<span class="tag-chip" style="cursor:pointer;color:var(--brand)" onclick="openAddTagPicker('${escArg(t.id)}')">+ tag</span>` : ""}
        </div>`;

        const daysLeft = t.dueDate ? daysBetween(todayDate(), parseISO(t.dueDate)) : null;
        // Oraliq bo'lsa — "5–12 oktabr", bo'lmasa avvalgidek bitta sana.
        const hasRange = !!(t.startDate && t.dueDate && t.startDate !== t.dueDate);
        const dueLabel = hasRange ? "Ish vaqti" : "Muddat";
        const dueText = t.dueDate
          ? `${hasRange ? fmtDateRangeField(t.startDate, t.dueDate) : fmtDay(parseISO(t.dueDate))}${daysLeft !== null ? ` · ${daysLeft >= 0 ? daysLeft + " kun qoldi" : Math.abs(daysLeft) + " kun o'tdi"}` : ""}`
          : "—";

        const dueInfo = t.dueDate ? dueChipInfo(t.dueDate) : null;
        const isOpenTask = !["done", "failed", "cancelled"].includes(t.status);
        const colDot = TASK_BOARD_COLUMNS.find((c) => c.key === taskBoardColumn(t))?.dot || "";
        const badgesHtml = `<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <span class="td-badge" style="background:var(--chip);color:var(--t5)"><span class="td-badge-dot" style="${colDot}"></span>${escHtml(TASK_STATUS_LABEL[t.status])}</span>
          ${t.priority === "urgent" ? `<span class="td-badge" style="background:var(--red-bg);color:var(--red)">${escHtml(TASK_PRIORITY_LABEL.urgent)}</span>` : ""}
          <div style="flex:1"></div>
          <span style="font-size:11px;color:var(--t4)">${taskShortRef(t.id)}</span>
        </div>`;

        const overdueBannerHtml =
          isOpenTask && daysLeft !== null && daysLeft <= 0
            ? `<div class="td-overdue-banner">
                <div class="td-overdue-ico">${Math.abs(daysLeft)}</div>
                <div style="flex:1;min-width:0">
                  <div class="td-overdue-title">${daysLeft === 0 ? "Muddat bugun tugaydi" : `Muddat ${Math.abs(daysLeft)} kun oldin tugagan`}</div>
                  <div class="td-overdue-sub">${fmtDay(parseISO(t.dueDate))} · ${taskWorkStateLabel(t.status)}</div>
                </div>
                ${isAdmin ? `<button type="button" class="td-overdue-btn" onclick="openPushDueDateForm('${escArg(t.id)}')">Muddatni surish</button>` : ""}
              </div>`
            : "";

        const stepperHtml = buildTaskStepperHtml(t, canChangeStatus);

        document.getElementById("td-body").innerHTML = `
          ${buildTaskDetailMobileHtml(t, canChangeStatus)}
          <div class="desktop-only"><div class="task-detail-grid two-col">
            <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
              ${overdueBannerHtml}
              <div class="td-card">
                ${badgesHtml}
                <div class="td-title">${escHtml(t.title)}</div>
                ${tagsRowHtml}
                ${t.description ? `<div style="height:1px;background:var(--bd1);margin:18px 0 16px"></div><div class="detail-desc">${escHtml(t.description)}</div>` : ""}
              </div>
              <div class="td-card">
                <div class="td-checklist" id="td-checklist"></div>
              </div>
              <div class="td-card">
                <div class="atabs" style="margin-top:0" id="td-atabs">
                  <button type="button" class="atab${taskDetailTab === "comments" ? " active" : ""}" id="td-atab-comments" onclick="setTaskDetailTab('comments')">Izohlar</button>
                  <button type="button" class="atab${taskDetailTab === "activity" ? " active" : ""}" id="td-atab-activity" onclick="setTaskDetailTab('activity')">Faoliyat</button>
                </div>
                <div class="activity-list" id="activity-list"><div style="font-size:12px;color:var(--t3)">Yuklanmoqda…</div></div>
                ${
                  canChangeStatus
                    ? `<div class="comment-composer">
                  <textarea class="f-input" id="comment-input" placeholder="Izoh yozing…"></textarea>
                  <button class="btn btn-blue" style="width:auto;padding:0 16px;flex-shrink:0" onclick="submitTaskComment('${escArg(t.id)}', this)">Yuborish</button>
                </div>`
                    : ""
                }
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px">
              ${stepperHtml ? `<div class="td-card">${stepperHtml}</div>` : ""}
              <div class="td-card">
                <div class="detail-prop-row">
                  <div class="detail-prop-label">Status</div>
                  <div class="detail-prop-val">${
                    isAdmin
                      ? `<select class="f-input" style="width:auto;padding:4px 8px;font-size:12.5px" onchange="setTaskStatus('${escArg(t.id)}', this.value)">${Object.entries(
                          TASK_STATUS_LABEL,
                        )
                          .map(([k, lbl]) => `<option value="${k}"${t.status === k ? " selected" : ""}>${lbl}</option>`)
                          .join("")}</select>`
                      : `<span class="td-badge-dot" style="${colDot};display:inline-block;margin-right:6px"></span>${escHtml(TASK_STATUS_LABEL[t.status])}`
                  }</div>
                </div>
                <div class="detail-prop-row"><div class="detail-prop-label">${taskAssignees(t).length > 1 ? "Mas'ullar" : "Mas'ul"}</div><div class="detail-prop-val" style="display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap">${taskAvatarsHtml(t, "avatar avatar-sm")}${escHtml(taskAssigneeNames(t) || "Biriktirilmagan")}</div></div>
                <div class="detail-prop-row">
                  <div class="detail-prop-label">Ustuvorlik</div>
                  <div class="detail-prop-val">${
                    isAdmin
                      ? `<select class="f-input" style="width:auto;padding:4px 8px;font-size:12.5px" onchange="setTaskPriority('${escArg(t.id)}', this.value)">${Object.entries(
                          TASK_PRIORITY_LABEL,
                        )
                          .map(([k, lbl]) => `<option value="${k}"${t.priority === k ? " selected" : ""}>${lbl}</option>`)
                          .join("")}</select>`
                      : escHtml(TASK_PRIORITY_LABEL[t.priority])
                  }</div>
                </div>
                <div class="detail-prop-row"><div class="detail-prop-label">${dueLabel}</div><div class="detail-prop-val"${dueInfo && dueInfo.cls === "late" && isOpenTask ? ` style="color:var(--red)"` : ""}>${dueText}</div></div>
                <div class="detail-prop-row"><div class="detail-prop-label">Loyiha</div><div class="detail-prop-val">${escHtml(t.projectLabel || "Umumiy")}</div></div>
                <div class="detail-prop-row"><div class="detail-prop-label">Biriktirdi</div><div class="detail-prop-val">${t.createdByUsername ? "@" + escHtml(t.createdByUsername) : "—"}</div></div>
                <div class="detail-prop-row"><div class="detail-prop-label">Yaratilgan</div><div class="detail-prop-val">${t.createdAt ? fmtDay(new Date(t.createdAt)) : "—"}</div></div>
              </div>
              ${
                canManageTask(t)
                  ? `<div class="td-bottom-actions">
                    <button type="button" class="td-bottom-link" onclick="openEditTaskSheet('${escArg(t.id)}')">Tahrirlash</button>
                    <button type="button" class="td-bottom-link" onclick="duplicateTask('${escArg(t.id)}')">Nusxalash</button>
                    <div style="flex:1"></div>
                    <button type="button" class="td-bottom-link danger" onclick="deleteTask('${escArg(t.id)}','${escArg(t.title)}')">O'chirish</button>
                  </div>`
                  : ""
              }
            </div>
          </div></div>`;
        renderTaskDetailMobileChrome(t, canChangeStatus);
        loadTaskActivity(t.id);
        loadTaskChecklist(t.id, canChangeStatus);
      }
      async function loadTaskActivity(id) {
        const el = document.getElementById("activity-list");
        if (!el) return;
        try {
          const res = await apiFetch(`/api/tasks/${id}/activity`);
          if (!res.ok) throw new Error();
          taskDetailActivityCache = (await res.json()).activity || [];
        } catch (e) {
          taskDetailActivityCache = null;
        }
        renderTaskDetailTabs();
      }

        if (a.kind === "priority_change") return `Ustuvorlik: ${TASK_PRIORITY_LABEL[oldV] || oldV} → ${TASK_PRIORITY_LABEL[newV] || newV}`;
        if (a.kind === "deadline_change")

        if (a.kind === "start_change")
