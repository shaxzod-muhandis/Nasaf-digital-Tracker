          if (!key.startsWith(type + "-")) return;
          const seq = parseInt(key.slice(type.length + 1), 10);
          const wd = det[key] && det[key].workDate;
          if (!wd) return;
          const day = String(wd).slice(0, 10);
          (map[day] = map[day] || []).push(seq);
        });
        Object.values(map).forEach((a) => a.sort((x, y) => x - y));
        return map;
      }

      // Post ("kontent") va Stories loyiha progressiga teng og'irlikda
      // qo'shilmaydi — Post umumiy progressning 70%ini, Stories esa 30%ini
      // tashkil qiladi. Loyihada faqat bittasi bo'lsa (masalan faqat
      // Stories), o'sha yagona turning o'zi 100% sifatida hisoblanadi.
      const PROJ_PCT_WEIGHT_K = 0.7; // post (kontent)
      const PROJ_PCT_WEIGHT_S = 0.3; // stories
      function projPct(p) {
        const hasK = p.k > 0,
          hasS = p.s > 0;
        if (!hasK && !hasS) return 0;
        const kFrac = hasK ? p.doneK / p.k : 0;
        const sFrac = hasS ? p.doneS / p.s : 0;
        if (hasK && hasS)
          return Math.round((kFrac * PROJ_PCT_WEIGHT_K + sFrac * PROJ_PCT_WEIGHT_S) * 100);
        return Math.round((hasK ? kFrac : sFrac) * 100);
      }
      // Kutilgan bajarilish HAFTALIK bosqichlar bo'yicha o'lchanadi,
      // kunlik chiziq bo'yicha emas. Sabab: kontent ishi kunlik tekis
      // chiqmaydi — postlar hafta ichida to'planib chiqadi, shuning
      // uchun kunlik o'lchovda hafta o'rtasida hamma loyiha "orqada"
      // bo'lib ko'rinardi.
      //
      // Har hafta teng ulush: 1-hafta oxirida 25%, keyin 50%, 75%,
      // 100%. Tugamagan hafta hisobga olinmaydi — joriy hafta xodimga
      // qarshi ishlamaydi.
      //
      // Teng ulush ataylab: 33/66/100 bo'lganda kutilgan foiz oxirgi
      // haftaga borib 100% ga yetardi va hech bir loyiha yashil bo'la
      // olmasdi, dastlabki ikki haftada esa aksincha hammasi yashil
      // bo'lib turardi.
      const EXPECTED_WEEK_STEPS = 4;
      function projElapsedFrac(p) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const total = daysBetween(start, end) + 1;
        if (total <= 0) return 0;
        let elapsed = daysBetween(start, todayDate()) + 1;
        if (elapsed < 0) elapsed = 0;
        if (elapsed > total) elapsed = total;
        return Math.min(1, Math.floor(elapsed / 7) / EXPECTED_WEEK_STEPS);
      }
      function projDaysLeft(p) {
        return daysBetween(todayDate(), parseISO(p.periodEnd));
      }

      // Bitta loyihaning BUGUN belgilangan post/stories'lari (k va s
      // ikkalasi ham) — Boshqaruv paneli va Tracker o'ng paneli umumiy
      // ishlatadi (faqat katta ekran).
      function buildTodayItems(p) {
        const todayKey = isoOf(todayDate());
        const kToday = buildDayMap(p, "k")[todayKey] || [];
        const sToday = buildDayMap(p, "s")[todayKey] || [];
        const items = [];
        kToday.forEach((n) => items.push({ type: "k", n }));
        sToday.forEach((n) => items.push({ type: "s", n }));
        return items;
      }

      // Xodim bo'yicha o'rtacha progress — unga ruxsat berilgan loyihalar
      // progressining o'rtachasi (faqat katta ekran, Boshqaruv paneli).
      function computeEmployeeProgress() {
        const rows = Object.keys(perms)
          .map((username) => {
            const projs = projects.filter((p) => (perms[username] || []).includes(p.id));
            if (!projs.length) return null;
            const avg = Math.round(projs.reduce((s, p) => s + projPct(p), 0) / projs.length);
            return { username, avg };
          })
          .filter(Boolean);
        rows.sort((a, b) => b.avg - a.avg);
        return rows.slice(0, 6);
      }

      // Joriy foydalanuvchi ko'rishi kerak bo'lgan vazifalar doirasi —
      // xodim uchun faqat o'ziga biriktirilganlari, admin/super admin
      // uchun barchasi (Phase 6: to'liq nazorat talabi).
      function myTaskScope() {
        return isAdmin
          ? tasksList
          : tasksList.filter(taskIsMine);
      }
      // Bosh sahifadagi "Biriktirilgan vazifalar" kartasi — bekor
      // qilinganlar hisobga olinmaydi, arxiv Dashboard'da ko'rsatilmaydi.
      function computeTaskSummary() {
        // "Jami" — faqat AKTIV (arxivlanmagan) vazifalar: bekor qilingan,
        // bajarilmagan va 30 kundan eski bajarilganlar (taskBoardColumn()
        // orqali — Vazifalar doskasidagi "Arxiv" bilan bir xil chegara)
        // hisobga olinmaydi.
        const scope = myTaskScope().filter((t) => taskBoardColumn(t) !== "archive");
        return {
          total: scope.length,
          // "review" ham hali hal qilinmagan/faol ish sifatida hisoblanadi —
          // kartada alohida 4-raqam qo'shilmaydi.
          inProgress: scope.filter((t) => ["in_progress", "review"].includes(t.status)).length,
          done: scope.filter((t) => t.status === "done").length,
        };
      }
      // Bugungacha muddati kelgan, hali hal qilinmagan vazifalar
      // ("Bugungi vazifalarim" — Dashboard). "review" chiqarib tashlanadi —
      // xodim tomonidan ish tugagan, endi admin navbati; "backlog"
      // avtomatik chiqib qoladi, chunki unda hali dueDate yo'q.
      function myOpenTasksToday() {
        const today = isoOf(todayDate());
        return myTaskScope()
          .filter(
            (t) =>
              !["done", "failed", "cancelled", "review"].includes(t.status) &&
              t.dueDate &&
              t.dueDate <= today,
          )
          .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
      }
      // Xodimning o'ziga biriktirilgan loyihalar bo'yicha umumiy holati
      // (admin uchun ko'rsatilmaydi — ularning umumiy ko'rinishi allaqachon
      // "Loyihalar" jadvali va "Xodimlar progresi" orqali mavjud).
      function computeMyProjectsProgress() {
        if (isAdmin) return null;
        const myProjects = projects.filter((p) => (perms[currentUser] || []).includes(p.id));
        if (!myProjects.length) return null;
        const doneSum = myProjects.reduce((s, p) => s + p.doneK + p.doneS, 0);
        const totalSum = myProjects.reduce((s, p) => s + p.k + p.s, 0);
        return { avgPct: pct(doneSum, totalSum), count: myProjects.length, doneSum, totalSum };
      }

      // ── XULOSA KARTALARI (bosh sahifa — mobil va desktopda bir xil) ─
      function buildAssignedTasksCardHtml() {
        const s = computeTaskSummary();
        return `<div class="rail-card">
          <div class="rail-title">Biriktirilgan vazifalar</div>
          <div class="mini-stat-row">
            <div class="mini-stat"><div class="mini-stat-val num">${s.total}</div><div class="mini-stat-lbl">Jami</div></div>
            <div class="mini-stat"><div class="mini-stat-val num" style="color:var(--brand)">${s.inProgress}</div><div class="mini-stat-lbl">Jarayonda</div></div>
            <div class="mini-stat"><div class="mini-stat-val num" style="color:#16a34a">${s.done}</div><div class="mini-stat-lbl">Bajarildi</div></div>
          </div>
        </div>`;
      }
      function buildTodayTasksCardHtml() {
        const items = myOpenTasksToday();
        const today = isoOf(todayDate());
        let rowsHtml;
        if (items.length) {
          const VISIBLE_CAP = 5;
          rowsHtml = items
            .slice(0, VISIBLE_CAP)
            .map((t) => {
              const overdue = t.dueDate && t.dueDate < today;
              const who = isAdmin && taskAssignees(t).length ? ` · ${escHtml(taskAssigneeNames(t))}` : "";
              return `<div class="rail-item" style="cursor:pointer" onclick="openTaskActions('${escArg(t.id)}')">
                <div class="task-dot${overdue ? " overdue" : ""}"></div>
                <div style="flex:1;min-width:0">
                  <div class="r-name">${escHtml(t.title)}</div>
                  <div class="r-sub"${overdue ? ' style="color:var(--red)"' : ""}>${escHtml(t.projectLabel || "Umumiy")}${who}${overdue ? " · muddati o'tgan" : ""}</div>
                </div>
              </div>`;
            })
            .join("");
          if (items.length > VISIBLE_CAP)
            rowsHtml += `<div class="stat-foot"><span class="stat-link" onclick="showTab('tasks')">Yana ${items.length - VISIBLE_CAP} ta →</span></div>`;
        } else {
          rowsHtml = `<div style="font-size:12px;color:var(--t3)">Bugun uchun ochiq vazifa yo'q</div>`;
        }
        return `<div class="rail-card">
          <div class="rail-title">Bugungi vazifalarim${items.length ? " · " + items.length : ""}</div>
          ${rowsHtml}
        </div>`;
      }
      function buildMyProgressCardHtml() {
        const mp = computeMyProjectsProgress();
        if (!mp) return "";
        return `<div class="rail-card">
          <div class="rail-title">Mening progressim</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
            <span class="num" style="font-weight:600;font-size:22px;color:var(--ink)">${mp.avgPct}%</span>
            <span class="r-sub">${mp.count} loyihada · ${mp.doneSum}/${mp.totalSum} post/stories</span>
          </div>
          <div class="hist-track"><div class="hist-fill" style="width:${mp.avgPct}%"></div></div>
        </div>`;
      }

      // ── MA'LUMOT YUKLASH ──────────────────────────────────────────
      async function loadProjects() {
        const res = await apiFetch("/api/projects");
        if (!res.ok) return;
        const d = await res.json();
        projects = d.projects || [];
        // Ro'yxat o'zgargan bo'lishi mumkin — ranglar qayta taqsimlanadi.
        resetPersonColors();
      }
      async function loadTasks() {
        try {
          const res = await apiFetch("/api/tasks");
          if (res.ok) {
            tasksList = (await res.json()).tasks || [];
            resetPersonColors();
          }
        } catch (e) {}
      }
      async function loadTags() {
        try {
          const res = await apiFetch("/api/tags");
          if (res.ok) tagsList = (await res.json()).tags || [];
        } catch (e) {}
      }
      async function loadMyActivity() {
        try {
          const res = await apiFetch("/api/activity-stats");
          if (res.ok) myActivity = await res.json();
        } catch (e) {}
      }

      // ── SIDEBAR (faqat katta ekran — "doimiy chap navigatsiya") ────
      const ROLE_LABEL_SIDEBAR = {
        super_admin: "Super admin",
        admin: "Admin",
        employee: "Xodim",
      };
      // Menyu pastidagi Ncoin belgisi ichidagi tanga ikonkasi.
      const NCOIN_MARK = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--nav-coin-mark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 15.5v-7l5 7v-7"/></svg>`;

      function renderSidebar() {
        const sbLetter = (myProfile?.firstName || currentUser || "?").slice(0, 1).toUpperCase();
        document.getElementById("sidebar-avatar").innerHTML =
          escHtml(sbLetter) + avatarImg(myProfile?.avatarUrl);
        // Chizmada bu yerda ism va familiya bosh harfi turadi ("Shaxzod S."),
        // @username emas: u uzun bo'lib, qirqilib ketardi. Profil hali
        // yuklanmagan bo'lsa — vaqtincha username.
        const first = (myProfile?.firstName || "").trim();
        const last = (myProfile?.lastName || "").trim();
        const shortName = first
          ? last
            ? `${first} ${last.slice(0, 1).toUpperCase()}.`
            : first
          : currentUser
            ? "@" + currentUser
            : "—";
        document.getElementById("sidebar-user-name").textContent = shortName;
        document.getElementById("sidebar-user-role").textContent =
          ROLE_LABEL_UZ[userRole] || userRole || "—";

        const debtCount = projects.filter((p) => p.outstandingDebt).length;
        const debtEl = document.getElementById("sidebar-debt-count");
        if (debtEl) {
          debtEl.textContent = debtCount;
          debtEl.style.display = debtCount > 0 ? "inline-flex" : "none";
        }

        // Vazifalar yonidagi son — hali hal qilinmagan vazifalar.
        const openTasks = myTaskScope().filter(
          (t) => !["done", "failed", "cancelled"].includes(t.status) && taskBoardColumn(t) !== "archive",
        ).length;
        const taskEl = document.getElementById("sidebar-task-count");
        if (taskEl) {
          taskEl.textContent = openTasks;
          taskEl.style.display = openTasks > 0 ? "inline-flex" : "none";
        }

        const coinEl = document.getElementById("sidebar-ncoin");
        if (coinEl) {
          if (myNcoinBalance === null) {
            coinEl.style.display = "none";
          } else {
            coinEl.innerHTML = NCOIN_MARK + escHtml(fmtNcoin(myNcoinBalance));
            coinEl.style.display = "inline-flex";
          }
        }

        syncSidebarAdminActive();
      }

      // Boshqaruv bo'limiga menyudan to'g'ridan-to'g'ri o'tish.
      function openAdminTab(key) {
        showTab("admin");
        switchATab(key);
        syncSidebarAdminActive();
      }

      function syncSidebarAdminActive() {
        document.querySelectorAll(".sb-aitem").forEach((el) => {
          const key = el.id.replace("sb-atab-", "");
          el.classList.toggle("active", activeTab === "admin" && adminActiveTab === key);
        });
      }

      // Menyudagi Ncoin raqami bitta shu funksiya orqali o'zgaradi —
      // shu bilan birga profil sahifasidagi "Ncoin balansim" ham
      // yangilanadi (ochiq bo'lsa), ya'ni ikkala joy hech qachon
      // bir-biridan farq qilmaydi.
      function setMyNcoinBalance(n) {
        if (typeof n !== "number" || n === myNcoinBalance) return;
        myNcoinBalance = n;
        renderSidebar();
        if (pfNcoinData) pfNcoinData.balance = n;
        const pfVal = document.querySelector(".pf-ncoin-value");
        if (pfVal) pfVal.textContent = fmtNcoin(n);
      }
      // Coin har xil sababdan o'zgaradi: ish belgilandi, vazifa yopildi,
      // NShopdan xarid qilindi, admin qo'lda sozladi — va bularning bir
      // qismini BOSHQA odam qiladi (masalan montajchi postni belgilasa,
      // montaj qilgan xodim coin oladi). Shuning uchun balans har bir
      // amaldan keyin va ilovaga qaytilganda qayta so'raladi.
      let ncoinRefreshPending = false;
      async function refreshMyNcoin() {
        if (ncoinRefreshPending) return;
        ncoinRefreshPending = true;
        try {
          const r = await apiFetch("/api/ncoin/me/balance");
          if (r.ok) setMyNcoinBalance((await r.json()).balance);
        } catch (e) {
        } finally {
          ncoinRefreshPending = false;
        }
      }

      function refreshAllViews() {
        const on = (id) =>
          document.getElementById(id).classList.contains("active");
        renderSidebar();
        if (on("screen-today")) renderToday();
        if (on("screen-projects")) renderProjectsScreen();
        if (on("screen-tasks")) renderTasksBody();
        if (on("screen-history")) renderHistoryRows();
        if (on("screen-admin")) renderAdminActiveTab();
        if (on("screen-tracker")) renderTracker();
        // Bu funksiya faqat biror amaldan keyin chaqiriladi (belgilash,
        // vazifa holati, ruxsat...), shuning uchun balansni shu yerda
        // bir marta so'rash yetarli — alohida chaqiruv joyini unutib
        // qoldirish xavfi ham qolmaydi.
        refreshMyNcoin();
      }

      // Barcha belgilashlar shu bitta funksiyadan o'tadi (Tracker, bugungi
      // ro'yxat va tarix sheet'i). cycleId berilsa — yopilgan davr tuzatiladi.
      async function onCheck(projectSlug, type, num, checked, cycleId, extra) {
        const body = { projectSlug, type, seqNumber: num, checked };
        if (cycleId) body.cycleId = cycleId;
        if (extra) Object.assign(body, extra); // editorId, videographerId, workDate
        const res = await apiFetch("/api/checks", {
          method: "PATCH",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showToast("⚠ " + (data.error || "Xato"));
          throw new Error(data.error || "Xato");
        }
        await loadProjects();
        histState.loaded = false;
        worklog = null;
        tabelData = null; // Tabel qayta yuklansin
        tabelEmp = null;
        refreshAllViews();
        return data;
      }

      async function loadStaff() {
        try {
          const r = await apiFetch("/api/staff");
          if (r.ok) staffList = (await r.json()).staff || [];
        } catch (e) {}
      }

      // ── TAB NAVIGATSIYASI ─────────────────────────────────────────
      const ROOT_TABS = ["today", "kalendar", "projects", "tasks", "nshop", "history", "admin"];
      function showTab(tab) {
        // Vazifa sahifasi ochiq bo'lsa, menyudan boshqa bo'limga
        // o'tish avval uni yopadi. Yozilgani qoralamada qoladi.
        if (document.getElementById("ntf-page") && !ntfLeaveFor(() => showTab(tab))) return;
        activeTab = tab;
        ROOT_TABS.forEach((t) => {
          document
            .getElementById("screen-" + t)
            .classList.toggle("active", t === tab);
          document
            .getElementById("nav-" + t)
            ?.classList.toggle("active", t === tab);
          document
            .getElementById("sidebar-nav-" + t)
            ?.classList.toggle("active", t === tab);
        });
        SUB_SCREENS.forEach((s) => document.getElementById(s)?.classList.remove("active"));
        // Bo'sh satr = inline override'ni olib tashlaydi, CSS (mobil:
        // flex, katta ekran: sidebar bor — none) o'zi hal qiladi.
        document.getElementById("bottom-nav").style.display = "";
        if (tg()?.BackButton) tg().BackButton.hide();
        if (tab !== "kalendar" && location.pathname.startsWith("/kalendar")) {
          history.replaceState(null, "", "/");
        }
        if (tab === "today") renderToday();
        else if (tab === "kalendar") openCalendar();
        else if (tab === "projects") renderProjectsScreen();
        else if (tab === "tasks") renderTasksScreen();
        else if (tab === "nshop") renderNShopScreen();
        else if (tab === "history") openHistoryTab();
        else if (tab === "admin") switchATab(adminActiveTab);
        syncSidebarAdminActive();
      }

      // Ichki (drill-in) ekranni ochish — root ekranlar yashiriladi
      const SUB_SCREENS = [
        "screen-tracker",
        "screen-taskdetail",
        "screen-profile",
        "screen-activity",
        "screen-activity-user",
      ];
      function openSubScreen(id, onBack) {
        ROOT_TABS.forEach((t) =>
          document.getElementById("screen-" + t).classList.remove("active"),
        );
        SUB_SCREENS.forEach((s) => document.getElementById(s)?.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        document.getElementById("bottom-nav").style.display = "none";
        if (tg()?.BackButton) {
          tg().BackButton.show();
          // Ustida to'liq sahifa (vazifa formasi, belgilash sahifasi)
          // ochiq bo'lsa, orqaga tugmasi avval o'shani yopadi —
          // ostidagi ekran joyida qoladi.
          tg().BackButton.onClick(() => {
            if (pageBackStack.length) return;
            onBack();
          });
        }
      }

      // ── BUGUN ─────────────────────────────────────────────────────
      // ── "BUGUN" SAHIFASI — UMUMIY YORDAMCHILAR (v3 dizayni) ────────
      // Ism-familiyani qisqa shaklga keltiradi: "Malika Rahimova" -> "Malika R."
      function shortPersonName(first, last, fallback) {
        const f = String(first || "").trim();
        const l = String(last || "").trim();
        if (!f) return fallback || "";
        return l ? `${f} ${l.slice(0, 1).toUpperCase()}.` : f;
      }

      // Loyiha mas'uli — Ruxsatlar'da "SMM manager" roli berilgan xodim.
      // Rol tanlanmagan loyihalarda (hozir ko'pchiligi shunday) xodimlar
      // soni ko'rsatiladi — bo'sh katak qoldirgandan ko'ra foydaliroq.
      function projOwnerLabel(p) {
        const smm = (p.assignees || []).find((a) => a.role === "smm");
        if (smm) return shortPersonName(smm.firstName, smm.lastName, "@" + smm.username);
        const n = (p.assignees || []).length;
        return n ? `${n} xodim` : "—";
      }

      function projExpectedPct(p) {
        return Math.round(projElapsedFrac(p) * 100);
      }

      // Loyiha holati. Qarz — alohida, eng og'ir holat. Qolganida
      // bajarilgan foiz davr bo'yicha kutilgan foizdan qanchalik
      // uzoqligiga qaraladi; 5 foiz ichidagi farq "rejada" deb olinadi,
      // aks holda har kichik tebranish holatni almashtirib turardi.
      // Chegaralar ataylab assimetrik. "Ortda" — ogohlantirish, shuning
      // uchun u faqat jiddiy farqda chiqadi: davrning oxiriga borib
      // kutilgan foiz tabiiy ravishda yuqori bo'ladi va kichik
      // kechikishda ham hamma loyiha qizarib ketardi. "Oldinda" esa
      // maqtov — uni qiyinlashtirishning ma'nosi yo'q.
      // Haftalik rejani bajargan (yoki oshirgan) loyiha — yashil
      // "Rejada". Shu sabab alohida "Oldinda" darajasi yo'q: rejani
      // bajarish va undan oshirish bir xil yaxshi xabar, ikkita yashil
      // daraja esa faqat chalkashtirardi.
      //
      // Orqada qolganlar ikkiga bo'linadi: ishning yarmidan o'tgani
      // "O'rtacha", yarmiga ham yetmagani "Ortda". Ya'ni 36% da turgan
      // loyiha hech qachon "o'rtacha" deb yumshatilmaydi.
      const PROJ_MID_MIN_PCT = 50;
      function projStatus(p) {
        if (p.outstandingDebt) return "debt";
        // To'liq bajarilgan — eng yaxshi holat, alohida. Tempo bilan
        // solishtirishning ma'nosi yo'q: ish tugagan.
        if ((p.k > 0 || p.s > 0) && p.doneK >= p.k && p.doneS >= p.s) return "done";
        const pc = projPct(p);
        if (pc >= projExpectedPct(p)) return "onplan";
        return pc >= PROJ_MID_MIN_PCT ? "mid" : "behind";
      }
      const PROJ_STATUS_LABEL = {
        done: "Bajarildi",
        debt: "Qarz",
        behind: "Ortda",
        mid: "O'rtacha",
        onplan: "Rejada",
        ahead: "Oldinda",
      };
      function statusPillHtml(status) {
        return `<span class="st-pill st-${status}">${PROJ_STATUS_LABEL[status]}</span>`;
      }

      // Progress chizig'i. Qora ko'rsatkich — davr bo'yicha bugungacha
      // kutilgan joy. Qarzdor loyihada u ko'rsatilmaydi: davr allaqachon
      // tugagan, "kutilgan joy" degan tushuncha ma'nosini yo'qotadi.
      function progressBarHtml(p, status) {
        const pc = Math.max(0, Math.min(100, projPct(p)));
        const exp = Math.max(0, Math.min(100, projExpectedPct(p)));
        const marker =
          status === "debt" || status === "done"
            ? ""
            : `<span class="pbar-marker" style="left:${exp}%"></span>`;
        return `<span class="pbar"><span class="pbar-fill st-fill-${status}" style="width:${pc}%"></span>${marker}</span>`;
      }

      // Muddat matni: qarzdorda "2 kun kechikdi", qolganida "6 kun".
      function projDaysInfo(p) {
        const today = todayDate();
        if (p.outstandingDebt) {
          const late = daysBetween(parseISO(p.outstandingDebt.periodEnd), today);
          return { text: `${late} kun kechikdi`, late: true };
        }
        const left = Math.max(0, daysBetween(today, parseISO(p.periodEnd)));
        return { text: `${left} kun`, late: false };
      }

      // Jamoa faolligi (desktop o'ng ustun) — /api/team-activity'dan.
      let teamActivity = null;
      async function loadTeamActivity() {
        try {
          const r = await apiFetch("/api/team-activity");
          if (r.ok) {
            teamActivity = await r.json();
            if (document.getElementById("screen-today").classList.contains("active")) renderToday();
          }
        } catch (e) {}
      }

      function computeHomeTempo() {
        let totalTasks = 0,
          weightedElapsed = 0,
          doneAll = 0;
        projects.forEach((p) => {
          const tot = p.k + p.s;
          totalTasks += tot;
          doneAll += p.doneK + p.doneS;
          weightedElapsed += tot * projElapsedFrac(p);
        });
        const expectedFrac = totalTasks ? weightedElapsed / totalTasks : 0;
        const expectedDone = Math.round(expectedFrac * totalTasks);
        return {
          overallPct: pct(doneAll, totalTasks),
          expectedPct: Math.round(expectedFrac * 100),
          expectedFrac,
          totalTasks,
          doneAll,
          expectedDone,
          behind: Math.max(0, expectedDone - doneAll),
        };
      }
      function buildSegs(frac) {
        const n = 5;
        const curIdx = Math.min(n - 1, Math.floor(frac * n));
        let html = "";
        for (let i = 0; i < n; i++) {
          let cls = "tempo-seg";
          if (i < curIdx || (i === curIdx && frac >= 1)) cls += " done";
          else if (i === curIdx) cls += " now";
          html += `<div class="${cls}"></div>`;
        }
        return html;
      }
      // Sarlavhadagi profil tugmasi (Bugun va Vazifalar ekranlarida) —
      // Telegram profil rasmi bo'lsa o'sha, bo'lmasa bosh harf.
      function renderMeAvatars() {
        const letter = escHtml((currentUser || "?").slice(0, 1).toUpperCase());
        const html = letter + avatarImg(myProfile?.avatarUrl);
        ["me-avatar", "me-avatar-tasks"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = html;
        });
      }
      function renderToday() {
        const body = document.getElementById("today-body");
        const today = todayDate();
        document.getElementById("today-date-label").textContent = fmtDay(today);
        renderMeAvatars();
        const npBtn = document.getElementById("today-new-project-btn");
        if (npBtn) npBtn.style.display = isAdmin ? "flex" : "none";

        if (projects.length === 0) {
          body.innerHTML = `<div class="empty">
            <div class="empty-ico">▤</div>
            <div class="empty-t">Tracker yo'q</div>
            <div class="empty-s">${isAdmin ? "Yangi loyiha yarating" : "Sizga hali loyiha biriktirilmagan"}</div>
          </div>`;
          return;
        }

        const t = computeHomeTempo();
        body.innerHTML =
          `<div class="mobile-only">${buildTodayMobileHtml(t)}</div>` +
          `<div class="desktop-only">${buildTodayDesktopHtml(t)}</div>`;
      }

      // ── Muddati yaqin vazifalar ────────────────────────────────────
      // "Bugun muddati" kartasi shundan to'ladi: muddati o'tgan, bugungi
      // va ertangi vazifalar. "Tekshiruvda" chiqarib tashlanadi — xodim
      // ishini tugatgan, endi admin navbati.
      function tasksDueSoon() {
        const todayIso = isoOf(todayDate());
        const tmr = new Date(todayDate());
        tmr.setDate(tmr.getDate() + 1);
        const tmrIso = isoOf(tmr);
        return myTaskScope()
          .filter(
            (t) =>
              !["done", "failed", "cancelled", "review"].includes(t.status) &&
              t.dueDate &&
              t.dueDate <= tmrIso,
          )
          .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
      }
      // Qatordan bitta bosishda bajariladigan keyingi qadam. Mantiq
      // vazifa ekranidagi bilan bir xil (buildTaskStepperHtml) — bu
      // yerda faqat ASOSIY harakat bor, ikkilamchilari ("Bajarolmadim",
      // "Qaytarish") vazifa ekranida qoladi. "Navbatga qo'yish" ham
      // yo'q: u muddat so'raydi, bitta bosishga sig'maydi.
      function taskQuickStep(t) {
        const canChange = isAdmin || taskIsMine(t);
        if (!canChange) return null;
        if (t.status === "todo") return { label: "Boshlash", status: "in_progress", ok: false };
        if (t.status === "in_progress") return { label: "Tekshiruvga", status: "review", ok: false };
        if (t.status === "review" && isAdmin) return { label: "Tasdiqlash", status: "done", ok: true };
        return null;
      }

      // Vazifa muddatining matni va rangi.
      function taskWhenInfo(task) {
        const todayIso = isoOf(todayDate());
        const tmr = new Date(todayDate());
        tmr.setDate(tmr.getDate() + 1);
        const tmrIso = isoOf(tmr);
        // Qisqa: mobil meta qatorida uzun matn loyiha nomini qirqib yuborardi.
        if (task.dueDate < todayIso) return { text: "Kechikdi", cls: "today" };
        if (task.dueDate === todayIso) return { text: "Bugun", cls: "today" };
        if (task.dueDate === tmrIso) return { text: "Ertaga", cls: "soon" };
        return { text: fmtDay(parseISO(task.dueDate)), cls: "" };
      }

      // ── MOBIL ──────────────────────────────────────────────────────
      function buildTodayMobileHtml(t) {
        const today = todayDate();

        // Davr kartasi. "N kun qoldi" — eng yaqin tugaydigan davr bo'yicha
        // (amalda loyihalarning davrlari bir xil kunda tugaydi).
        const ends = projects
          .filter((p) => !p.outstandingDebt && p.periodEnd)
          .map((p) => daysBetween(today, parseISO(p.periodEnd)))
          .filter((n) => n >= 0);
        const daysLeft = ends.length ? Math.min(...ends) : 0;
        const diff = t.doneAll - t.expectedDone;
        const badge =
          diff >= 0
            ? `<div class="dcard-badge">Rejadan +${diff}</div>`
            : `<div class="dcard-badge behind">Rejadan −${Math.abs(diff)}</div>`;
        const periodCard = `<div class="dcard">
          <div class="dcard-top">
            <span>${MONTHS[today.getMonth()]} davri</span>
            <span style="flex:1"></span>
            <span>${daysLeft} kun qoldi</span>
          </div>
          <div class="dcard-val">
            <div class="dcard-pct">${t.overallPct}<span>%</span></div>
            <div class="dcard-sub">${t.doneAll} / ${t.totalTasks} vazifa</div>
            <div style="flex:1"></div>
            ${badge}
          </div>
          <div class="dcard-bar">
            <div class="dcard-bar-fill" style="width:${Math.max(0, Math.min(100, t.overallPct))}%"></div>
            <div class="dcard-bar-marker" style="left:${Math.max(0, Math.min(100, t.expectedPct))}%"></div>
          </div>
          <div class="dcard-note">Oq chiziq — bugungacha kutilgan joy</div>
        </div>`;

        // Qarz ogohlantirishi
        const debts = projects.filter((p) => p.outstandingDebt);
        let debtHtml = "";
        if (debts.length) {
          const d0 = debts[0];
          const d = d0.outstandingDebt;
          const remaining = d.remainingPosts + d.remainingStories;
          const monthName = MONTHS[parseISO(d.periodStart).getMonth()];
          const title =
            debts.length === 1
              ? `${escHtml(d0.label)} qarzda`
              : `${debts.length} loyiha qarzda`;
          const sub =
            debts.length === 1
              ? `${monthName} davridan ${remaining} vazifa qolgan`
              : `${escHtml(d0.label)} · ${monthName} davridan ${remaining} vazifa qolgan`;
          debtHtml = `<div class="alert-card" onclick="openTracker('${escArg(d0.id)}')">
            <div class="alert-ico">!</div>
            <div style="flex:1;min-width:0">
              <div class="alert-title">${title}</div>
              <div class="alert-sub">${sub}</div>
            </div>
            <div style="color:var(--st-debt);display:flex">${ICON.chevronRight}</div>
          </div>`;
        }

        // Bugun muddati — vazifalar
        const due = tasksDueSoon();
        const dueRows = due.length
          ? due
              .slice(0, 6)
              .map((task) => {
                const w = taskWhenInfo(task);
                const step = taskQuickStep(task);
                // Chizmada meta qatorida faqat loyiha nomi turadi — mas'ul
                // emas. Mobil ekranda joy tor, ikkisi birga sig'maydi va
                // vazifa nomi qirqilib ketardi.
                return `<div class="v3-row" onclick="openTaskActions('${escArg(task.id)}')">
                  <div style="flex:1;min-width:0">
                    <div class="v3-title">${escHtml(task.title)}</div>
                    <div class="v3-meta">
                      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(task.projectLabel || "Umumiy")}</span>
                      <span class="v3-meta-dot"></span>
                      <span class="v3-when ${w.cls}">${w.text}</span>
                    </div>
                  </div>
                  ${
                    step
                      ? `<button type="button" class="v3-act${step.ok ? " ok" : ""}" onclick="event.stopPropagation();setTaskStatus('${escArg(task.id)}','${step.status}',this)">${step.label}</button>`
                      : `<span class="type-pill${task.status === "in_progress" ? " alt" : ""}">${escHtml(TASK_STATUS_LABEL[task.status] || "")}</span>`
                  }
                </div>`;
              })
              .join("")
          : `<div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Muddati yaqin vazifa yo'q</div>`;
        const dueSection = `<div>
          <div class="sec-hdr">
            <div class="sec-hdr-t">Bugun muddati</div>
            <div style="flex:1"></div>
            <div class="sec-hdr-a" onclick="showTab('tasks')">Hammasi</div>
          </div>
          <div class="v3-card">${dueRows}</div>
        </div>`;

        // Mening loyihalarim — bajarilish foizi bo'yicha kattadan
        // kichikka (desktopdagi jadval bilan bir xil tartib).
        const projRows = [...projects]
          .sort((a, b) => projPct(b) - projPct(a))
          .map((p) => {
            const st = projStatus(p);
            const d = projDaysInfo(p);
            return `<div class="v3-row" onclick="openTracker('${escArg(p.id)}')">
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="mproj-name">${escHtml(p.label)}</div>
                  ${statusPillHtml(st)}
                </div>
                <div style="margin-top:9px">${progressBarHtml(p, st)}</div>
                <div class="mproj-stats">
                  <b>Post ${p.doneK}/${p.k}</b>
                  <b>Stories ${p.doneS}/${p.s}</b>
                  <span style="flex:1"></span>
                  <span class="mproj-days${d.late ? " late" : ""}">${d.text}</span>
                </div>
              </div>
              <div class="v3-chev">${ICON.chevronRight}</div>
            </div>`;
          })
          .join("");
        const projSection = `<div>
          <div class="sec-hdr">
            <div class="sec-hdr-t">Mening loyihalarim</div>
            <div style="flex:1"></div>
            <div class="sec-hdr-n">${projects.length}</div>
          </div>
          <div class="v3-card">${projRows}</div>
        </div>`;

        const days = (teamActivity && teamActivity.days) || [];
        const maxDay = Math.max(0, ...days.map((d) => d.count || 0));
        const heatRow = days
          .map((d) => {
            if (!maxDay || !d.count) return `<span></span>`;
            const r = d.count / maxDay;
            return `<span class="${r > 0.66 ? "l3" : r > 0.33 ? "l2" : "l1"}"></span>`;
          })
          .join("");
        const faollik = `<div class="tm-act" onclick="openActivity()">
          <div class="tm-act-top">
            <div class="tm-act-t">Jamoa faolligi${newBadgeHtml("faollik")}</div>
            <div class="tm-act-n">${teamActivity ? teamActivity.todayCount : 0} ta bugun</div>
            <span class="tm-act-chev">›</span>
          </div>
          <div class="d2-heat">${heatRow}</div>
        </div>`;

        return `<div style="display:flex;flex-direction:column;gap:14px">
          ${periodCard}
          ${debtHtml}
          ${faollik}
          ${dueSection}
          ${projSection}
        </div>`;
      }

      // ── DESKTOP ────────────────────────────────────────────────────
      function setDashFilter(key) {
        dashProjFilter = key;
        renderToday();
      }
      function buildTodayDesktopHtml(t) {
        const behindCount = projects.filter((p) => projStatus(p) === "behind").length;
        const debtCount = projects.filter((p) => p.outstandingDebt).length;

        const stats = `<div class="d2-stats">
          <div class="d2-stat">
            <div class="d2-stat-l">Umumiy bajarilish</div>
            <div class="d2-stat-v"><div class="d2-stat-n">${t.overallPct}%</div><div class="d2-stat-s">reja ${t.expectedPct}%</div></div>
          </div>
          <div class="d2-stat">
            <div class="d2-stat-l">Bajarildi</div>
            <div class="d2-stat-v"><div class="d2-stat-n">${t.doneAll}</div><div class="d2-stat-s">/ ${t.totalTasks} vazifa</div></div>
          </div>
          <div class="d2-stat">
            <div class="d2-stat-l">Ortda</div>
            <div class="d2-stat-v"><div class="d2-stat-n${behindCount ? " warn" : ""}">${behindCount}</div><div class="d2-stat-s">loyiha</div></div>
          </div>
          <div class="d2-stat">
            <div class="d2-stat-l">Qarzda</div>
            <div class="d2-stat-v"><div class="d2-stat-n${debtCount ? " bad" : ""}">${debtCount}</div><div class="d2-stat-s">loyiha</div></div>
          </div>
        </div>`;

        // Jadval — filtr va qidiruv
        const q = (document.getElementById("today-search")?.value || "").toLowerCase().trim();
        const problem = (p) => p.outstandingDebt || projStatus(p) === "behind";
        let list = dashProjFilter === "problem" ? projects.filter(problem) : projects;
        if (q) {
          list = list.filter(
            (p) =>
              p.label.toLowerCase().includes(q) ||
              (p.assignees || []).some((a) =>
                [a.username, a.firstName, a.lastName].some((v) =>
                  String(v || "").toLowerCase().includes(q),
                ),
              ),
          );
        }
        list = [...list].sort((a, b) => projPct(b) - projPct(a));

        const rows = list.length
          ? list
              .map((p) => {
                const st = projStatus(p);
                const d = projDaysInfo(p);
                return `<div class="d2-row" onclick="openTracker('${escArg(p.id)}')">
                  <div style="min-width:0">
                    <div class="d2-name">${escHtml(p.label)}</div>
                    <div class="d2-owner">${escHtml(projOwnerLabel(p))}</div>
                  </div>
                  <div>${statusPillHtml(st)}</div>
                  <div class="d2-prog">
                    ${progressBarHtml(p, st)}
                    <span class="d2-pct">${projPct(p)}%</span>
                  </div>
                  <div class="d2-counts">${p.doneK}/${p.k} · ${p.doneS}/${p.s}</div>
                  <div class="d2-due${d.late ? " late" : ""}">${d.text}</div>
                </div>`;
              })
              .join("")
          : `<div style="padding:22px 18px;font-size:13px;color:var(--t3);border-top:1px solid var(--bd2)">Mos loyiha topilmadi</div>`;

        const problemCount = projects.filter(problem).length;
        const table = `<div class="d2-tbl">
          <div class="d2-tbl-hdr">
            <div class="d2-tbl-t">Loyihalar</div>
            <div class="d2-seg">
              <button class="${dashProjFilter === "problem" ? "" : "on"}" onclick="setDashFilter('all')">Hammasi ${projects.length}</button>
              <button class="${dashProjFilter === "problem" ? "on" : ""}" onclick="setDashFilter('problem')">Muammoli ${problemCount}</button>
            </div>
          </div>
          <div class="d2-cols">
            <div>Loyiha</div><div>Holat</div><div>Bajarilish</div><div>Post · Stories</div><div>Muddat</div>
          </div>
          ${rows}
        </div>`;

        // O'ng ustun — muddati yaqin vazifalar
        const due = tasksDueSoon();
        const dueItems = due.length
          ? due
              .slice(0, 5)
              .map((task) => {
                const w = taskWhenInfo(task);
                const who = taskAssignees(task).length ? " · " + escHtml(taskAssigneeNames(task)) : "";
                const color =
                  w.cls === "today" ? "var(--st-debt)" : w.cls === "soon" ? "var(--st-behind)" : "var(--t2)";
                return `<div class="d2-item" onclick="openTaskActions('${escArg(task.id)}')">
                  <div class="d2-item-top">
                    <div class="d2-item-t">${escHtml(task.title)}</div>
                    <div class="d2-item-w" style="color:${color}">${w.text}</div>
                  </div>
                  <div class="d2-item-s">${escHtml(task.projectLabel || "Umumiy")}${who}</div>
                </div>`;
              })
              .join("")
          : `<div style="padding:10px 0;font-size:12.5px;color:var(--t3)">Muddati yaqin vazifa yo'q</div>`;
        const dueCard = `<div class="d2-card tight">
          <div class="d2-card-hdr">
            <div class="d2-card-t">Bugun muddati</div>
            ${due.length ? `<span class="d2-card-n">${due.length}</span>` : ""}
          </div>
          ${dueItems}
        </div>`;

        // O'ng ustun — jamoa faolligi
        const days = teamActivity?.days || [];
        const max = days.reduce((m, d) => Math.max(m, d.count), 0);
        const cells = (days.length ? days : Array.from({ length: 28 }, () => ({ count: 0 })))
          .map((d) => {
            if (!max || !d.count) return `<span></span>`;
            const r = d.count / max;
            return `<span class="${r > 0.66 ? "l3" : r > 0.33 ? "l2" : "l1"}"></span>`;
          })
          .join("");
        const heatCard = `<div class="d2-card act-open" onclick="openActivity()" title="Faollik sahifasini ochish">
          <div class="d2-card-hdr">
            <div class="d2-card-t">Jamoa faolligi${newBadgeHtml("faollik")}</div>
            <div class="d2-card-side">Batafsil ›</div>
          </div>
          <div class="d2-heat">${cells}</div>
          <div class="d2-heat-foot">
            <div class="d2-card-side" style="flex:1">Bugun</div>
            <div style="font-size:12.5px;font-weight:600;color:var(--ink)">${teamActivity ? teamActivity.todayCount : 0} ta bajarildi</div>
          </div>
        </div>`;

        return `<div class="d2-grid">
          <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
            ${stats}
            ${table}
          </div>
          <div class="d2-side">
            ${dueCard}
            ${heatCard}
          </div>
        </div>`;
      }
      // Qarz hajmi — bajarilmay qolgan post va stories soni. Ro'yxat
      // shu bo'yicha kattadan kichikka saralanadi: eng og'ir qarz
      // tepada turishi kerak, aks holda ro'yxat tasodifiy tartibda
      // chiqib, qaysi loyiha eng muammoli ekani ko'rinmasdi.
      function projDebtSize(p) {
        const d = p.outstandingDebt;
        if (!d) return 0;
        return (d.remainingPosts || 0) + (d.remainingStories || 0);
      }
      function sortByDebt(list) {
        return [...list].sort(
          (a, b) =>
            projDebtSize(b) - projDebtSize(a) ||
            // Teng bo'lsa — muddati qachonroq o'tgani tepada.
            String(a.outstandingDebt?.periodEnd || "").localeCompare(
              String(b.outstandingDebt?.periodEnd || ""),
            ) ||
            a.label.localeCompare(b.label),
        );
      }
      function setProjFilter(k) {
        projFilter = k;
        renderProjectsScreen();
      }
      function renderProjectsScreen() {
        document.getElementById("projects-fab").style.display = isAdmin
          ? "flex"
          : "none";
        const debtCount = projects.filter((p) => p.outstandingDebt).length;
        const chips = [
          { key: "all", label: "Hammasi" },
          { key: "debt", label: `Qarzdor ${debtCount}`, danger: true },
          { key: "mine", label: "Mening" },
          { key: "done", label: "Tugagan" },
        ];
        document.getElementById("proj-chips").innerHTML = chips
          .map((c) => {
            const cls =
              "chip-btn" +
              (projFilter === c.key ? " active" : c.danger ? " danger" : "");
            return `<button class="${cls}" onclick="setProjFilter('${c.key}')">${c.label}</button>`;
          })
          .join("");

        const body = document.getElementById("projects-body");
        const q = (document.getElementById("proj-search")?.value || "")
          .toLowerCase()
          .trim();
        let list = projects.filter((p) => !q || p.label.toLowerCase().includes(q));
        if (projFilter === "debt") list = list.filter((p) => p.outstandingDebt);
        // "Mening" — menga biriktirilgan loyihalar. Avval shart
        // `isAdmin || ...` edi: admin uchun hamma loyiha o'tib ketardi
        // va filtr "Hammasi"dan farq qilmasdi.
        else if (projFilter === "mine")
          list = list.filter((p) => (perms[currentUser] || []).includes(p.id));
        else if (projFilter === "done")
          list = list.filter((p) => projPct(p) >= 100);

        if (list.length === 0) {
          body.innerHTML =
            `<div class="mobile-only"><div class="empty"><div class="empty-ico">⌕</div><div class="empty-t">Hech narsa topilmadi</div><div class="empty-s">Qidiruv yoki filtrni o'zgartirib ko'ring.</div></div></div>` +
            buildProjectsDesktopHtml();
          restorePdeskSearchFocus();
          return;
        }

        const today = todayDate();
        const overdue = sortByDebt(list.filter((p) => p.outstandingDebt));
        const active = list.filter((p) => !p.outstandingDebt);
        let html = `<div class="mobile-only">`;
        if (overdue.length) {
          html += `<div class="sec-upper">Muddati o'tgan · ${overdue.length}</div><div class="list-card" style="margin-bottom:20px">`;
          html += overdue
            .map((p) => {
              const daysAgo = daysBetween(
                parseISO(p.outstandingDebt.periodEnd),
                today,
              );
              const rem =
                p.outstandingDebt.remainingPosts +
                p.outstandingDebt.remainingStories;
              return `<div class="od-row" onclick="openTracker('${escArg(p.id)}')">
                <div class="od-bar"></div>
                <div style="flex:1;min-width:0">
                  <div class="r-name">${escHtml(p.label)}</div>
                  <div class="r-sub">${rem} vazifa qoldi</div>
                </div>
                <div class="od-days num">${daysAgo} kun</div>
              </div>`;
            })
            .join("");
          html += `</div>`;
        }
        if (active.length) {
          html += `<div class="sec-upper">Faol · ${active.length}</div><div class="list-card">`;
          html += active
            .map((p) => {
              const pc = projPct(p);
              const dl = projDaysLeft(p);
              return `<div class="pv-row" onclick="openTracker('${escArg(p.id)}')">
                <div style="flex:1;min-width:0">
                  <div class="r-name">${escHtml(p.label)}</div>
                  <div class="r-sub">${dl >= 0 ? dl + " kun qoldi" : "muddat tugagan"}</div>
                </div>
                <div class="pv-bar-wrap">
                  <div class="pv-bar-track"><div class="pv-bar-fill" style="width:${pc}%"></div></div>
                  <div class="pv-pct num">${pc}%</div>
                </div>
              </div>`;
            })
            .join("");
          html += `</div>`;
        }
        html += `</div>${buildProjectsDesktopHtml()}`;
        body.innerHTML = html;
        restorePdeskSearchFocus();
      }

      // ── LOYIHALAR — desktop ikki panelli ko'rinish (v3) ─────────────
      // Chapda loyihalar ro'yxati (holatiga qarab guruhlangan), o'ngda
      // tanlangan loyihaning batafsil ko'rinishi. Mobil ko'rinish
      // o'zgarishsiz qoladi — u renderProjectsScreen ichida quriladi.
      let pdeskId = null;
      let pdeskQuery = "";
      let pdeskCalFilter = "all";
      let pdeskSearchFocused = false;

      function setPdeskProject(id) {
        pdeskId = id;
        renderProjectsScreen();
      }
      function setPdeskFilter(key) {
        pdeskCalFilter = key;
        renderProjectsScreen();
      }
      function onPdeskSearch(el) {
        pdeskQuery = el.value;
        pdeskSearchFocused = true;
        renderProjectsScreen();
      }

      // Loyihaning davri bo'yicha kutilgan va haqiqiy bajarilgan ish
      // farqi — "Reja bo'yicha +2" ustuni uchun.
      // "Rejada" yashil ko'rsatiladi (haftalik rejani bajargan). Ko'k
      // "onplan" ranglari faqat tanlangan qator foni uchun qoladi, shu
      // sabab matn/nuqta rangi alohida xaritadan olinadi.
      const ST_COLOR = { debt: "debt", behind: "behind", mid: "mid", onplan: "ahead", ahead: "ahead", done: "ahead" };

      function projPlanDelta(p) {
        const total = p.k + p.s;
        const expected = Math.round(projElapsedFrac(p) * total);
        return p.doneK + p.doneS - expected;
      }

      function pdPeriodText(p) {
        const ps = parseISO(p.periodStart);
        const pe = parseISO(p.periodEnd);
        const m = (d) => MONTHS[d.getMonth()].toLowerCase();
        const range =
          ps.getMonth() === pe.getMonth()
            ? `${ps.getDate()}–${pe.getDate()} ${m(pe)}`
            : `${ps.getDate()} ${m(ps)} – ${pe.getDate()} ${m(pe)}`;
        const d = projDaysInfo(p);
        return `${range} · ${d.text}`;
      }

      function pdTeamHtml(p) {
        const list = (p.assignees || []).slice(0, 4);
        if (!list.length) return "";
        const extra = (p.assignees || []).length - list.length;
        const avs = list
          .map((a) => {
            const letter = (a.firstName || a.username || "?").slice(0, 1).toUpperCase();
            const name = shortPersonName(a.firstName, a.lastName, "@" + a.username);
            return `<div><div class="avatar" style="background:${personColor(a.username)};color:#fff" title="${escHtml(name)}">${escHtml(letter)}${avatarImg(a.avatar_url)}</div></div>`;
          })
          .join("");
        const more = extra > 0 ? `<div><div class="avatar" style="background:var(--nav-badge-bg);color:var(--v3-t2)">+${extra}</div></div>` : "";
        return `<div class="pd-team">${avs}${more}</div>`;
      }

      // Kalendar — qaysi post/stories qaysi kuni belgilangani
      // (checkDetails.workDate) asosida. Faqat HAQIQATNI ko'rsatadi:
      // yashil — o'sha kuni ish qilingan, oq — qilinmagan, ko'k — bugun.
      // "Rejalashtirilgan kun" degan tushuncha ma'lumotda yo'q.
      function pdCalendarHtml(p) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const today = todayDate();
        const todayIso = isoOf(today);

        const byDay = {};
        Object.entries(p.checkDetails || {}).forEach(([key, d]) => {
          if (!d || !d.workDate) return;
          const day = String(d.workDate).slice(0, 10);
          const type = key.split("-")[0];
          if (!byDay[day]) byDay[day] = { k: 0, s: 0 };
          byDay[day][type === "k" ? "k" : "s"]++;
        });

        const WD = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"];
        let cells = WD.map((w) => `<div class="pd-cal-wd">${w}</div>`).join("");
        // Dushanbadan boshlanadigan hafta: getDay() 0=yakshanba.
        const lead = (start.getDay() + 6) % 7;
        cells += `<div></div>`.repeat(lead);

        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
          const iso = isoOf(d);
          const info = byDay[iso];
          const isToday = iso === todayIso;
          const isFuture = iso > todayIso;
          const showK = pdeskCalFilter !== "s";
          const showS = pdeskCalFilter !== "k";
          const nK = info && showK ? info.k : 0;
          const nS = info && showS ? info.s : 0;
          const dots =
            `<span class="pd-dot k"></span>`.repeat(Math.min(nK, 3)) +
            `<span class="pd-dot s"></span>`.repeat(Math.min(nS, 3));
          const cls = [
            "pd-day",
            isToday ? "today" : nK + nS > 0 ? "done" : isFuture ? "future" : "",
          ]
            .filter(Boolean)
            .join(" ");
          cells += `<div class="${cls}">
            <div class="pd-day-n">${d.getDate()}</div>
            <div class="pd-dots">${dots}</div>
          </div>`;
        }
        return `<div class="pd-card pd-cal"><div class="pd-cal-grid">${cells}</div></div>`;
      }

      function pdDetailHtml(p) {
        const st = projStatus(p);
        const pc = projPct(p);
        const done = p.doneK + p.doneS;
        const total = p.k + p.s;
        const left = Math.max(0, total - done);
        const delta = projPlanDelta(p);
        const deltaCls = delta > 0 ? " good" : delta < 0 ? " bad" : "";
        const deltaText = delta > 0 ? `+${delta}` : String(delta);

        const segs = [
          { key: "all", label: `Hammasi ${total}` },
          { key: "k", label: `Post ${p.doneK}/${p.k}` },
          { key: "s", label: `Stories ${p.doneS}/${p.s}` },
        ]
          .map(
            (c) =>
              `<button class="${pdeskCalFilter === c.key ? "on" : ""}" onclick="setPdeskFilter('${c.key}')">${c.label}</button>`,
          )
          .join("");

        return `
          <div class="pd-head">
            <div class="pd-logo" style="cursor:pointer" title="Belgilash oynasini ochish" onclick="openTracker('${escArg(p.id)}')">${escHtml((p.label || "?").slice(0, 1).toUpperCase())}</div>
            <div style="flex:1;min-width:0;cursor:pointer" title="Belgilash oynasini ochish" onclick="openTracker('${escArg(p.id)}')">
              <div class="pd-name">${escHtml(p.label)}</div>
              <div class="pd-sub">${escHtml(pdPeriodText(p))}</div>
            </div>
            ${pdTeamHtml(p)}
            ${
              isAdmin
                ? `<button type="button" class="pd-btn" onclick="openProjectEditSheet('${escArg(p.id)}')">${ICON.edit}Tahrirlash</button>
                   <button type="button" class="pd-icon-btn" title="Amallar" onclick="openProjectHistorySheet('${escArg(p.id)}','${escArg(p.label)}')">⋯</button>`
                : ""
            }
          </div>

          <div class="pd-card pd-stats">
            <div class="pd-stat-main">
              <div class="pd-stat-row">
                <div class="pd-stat-pct">${pc}<span>%</span></div>
                <div class="pd-stat-frac">${done}/${total}</div>
                <div style="flex:1"></div>
                ${statusPillHtml(st)}
              </div>
              <div style="margin-top:10px">${progressBarHtml(p, st)}</div>
            </div>
            <div class="pd-stat-col">
              <div class="pd-stat-l">Post</div>
              <div class="pd-stat-v">${p.doneK}/${p.k}</div>
            </div>
            <div class="pd-stat-col">
              <div class="pd-stat-l">Stories</div>
              <div class="pd-stat-v">${p.doneS}/${p.s}</div>
            </div>
            <div class="pd-stat-col">
              <div class="pd-stat-l">Qolgan</div>
              <div class="pd-stat-v">${left}</div>
            </div>
            <div class="pd-stat-col">
              <div class="pd-stat-l">Reja bo'yicha</div>
              <div class="pd-stat-v${deltaCls}">${deltaText}</div>
            </div>
          </div>

          <div class="pd-filter">
            <div class="d2-seg lg">${segs}</div>
            <div style="flex:1"></div>
            <div class="pd-legend">
              <div><span class="pd-legend-dot" style="background:var(--type-post)"></span><span class="pd-legend-t">Post</span></div>
              <div><span class="pd-legend-dot" style="background:var(--type-story)"></span><span class="pd-legend-t">Stories</span></div>
              <div><span class="pd-legend-sq" style="background:var(--st-ahead-bg)"></span><span class="pd-legend-t">Bajarildi</span></div>
            </div>
          </div>

          ${pdCalendarHtml(p)}`;
      }

      function buildProjectsDesktopHtml() {
        const q = pdeskQuery.toLowerCase().trim();
        const list = projects.filter((p) => !q || p.label.toLowerCase().includes(q));

        // Tanlangan loyiha ro'yxatdan chiqib ketgan bo'lsa (qidiruv
        // tufayli) — birinchisiga o'tamiz.
        let sel = list.find((p) => p.id === pdeskId) || list[0] || null;
        if (sel) pdeskId = sel.id;

        const needsAttention = sortByDebt(
          list.filter((p) => ["debt", "behind", "mid"].includes(projStatus(p))),
        );
        const doingWell = list.filter((p) => !["debt", "behind", "mid"].includes(projStatus(p)));

        const itemHtml = (p) => {
          const st = projStatus(p);
          const d = projDaysInfo(p);
          return `<div class="pd-item${p.id === pdeskId ? " on" : ""}" onclick="setPdeskProject('${escArg(p.id)}')">
            <div class="pd-item-top">
              <div class="pd-item-name">${escHtml(p.label)}</div>
              <div class="pd-item-pct">${projPct(p)}%</div>
            </div>
            <div style="margin-top:8px">${progressBarHtml(p, st)}</div>
            <div class="pd-item-meta">
              <span class="pd-item-dot" style="background:var(--st-${ST_COLOR[st]}-dot)"></span>
              <span class="pd-item-st" style="color:var(--st-${ST_COLOR[st]})">${PROJ_STATUS_LABEL[st]}</span>
              <span class="pd-item-own">· ${escHtml(projOwnerLabel(p))}</span>
              <span class="pd-item-days${d.late ? " late" : ""}">${d.text}</span>
            </div>
          </div>`;
        };

        const groups =
          (needsAttention.length
            ? `<div class="pd-sec">Diqqat talab qiladi</div>${needsAttention.map(itemHtml).join("")}`
            : "") +
          (doingWell.length
            ? `<div class="pd-sec">Yaxshi ketmoqda</div>${doingWell.map(itemHtml).join("")}`
            : "") +
          (list.length ? "" : `<div style="padding:18px 14px;font-size:13px;color:var(--v3-t3)">Hech narsa topilmadi</div>`);

        const monthLabel = MONTHS[todayDate().getMonth()].toLowerCase();
        return `<div class="pd-root">
          <div class="pd-top">
            <div style="flex:1;min-width:0">
              <div class="pd-top-t">Loyihalar</div>
              <div class="pd-top-s">${projects.length} faol · ${monthLabel} davri</div>
            </div>
            <div class="d2-seg lg">
              <button class="on">Faol</button>
              <button onclick="showTab('history')">Tarix</button>
            </div>
            ${isAdmin ? `<button type="button" class="pd-new" onclick="openNewProjectSheet()">${ICON.plus}Yangi loyiha</button>` : ""}
          </div>
          <div class="pd-body">
            <div class="pd-list">
              <div class="pd-search">
                <div class="search-ico">${ICON.search}</div>
                <input id="pd-search" placeholder="Qidirish" value="${escHtml(pdeskQuery)}" oninput="onPdeskSearch(this)"/>
              </div>
              ${groups}
            </div>
            <div class="pd-main">
              ${sel ? pdDetailHtml(sel) : `<div style="padding:40px 0;text-align:center;font-size:13px;color:var(--v3-t3)">Loyiha tanlanmagan</div>`}
            </div>
          </div>
        </div>`;
      }

      // Qidiruv maydoniga har bosishda butun blok qayta chizilgani uchun
      // fokus yo'qoladi — uni qaytaramiz va kursorni oxiriga qo'yamiz.
      function restorePdeskSearchFocus() {
        if (!pdeskSearchFocused) return;
        const el = document.getElementById("pd-search");
        if (!el) return;
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
      // ── VAZIFALAR ─────────────────────────────────────────────────
      const TASK_STATUS_LABEL = {
        backlog: "Backlog",
        todo: "Boshlanmagan",
        in_progress: "Jarayonda",
        review: "Tekshiruvda",
        done: "Bajarilgan",
        failed: "Bajarilmadi",
        cancelled: "Bekor qilingan",
      };
      const TASK_PRIORITY_LABEL = {
        urgent: "Shoshilinch",
        high: "Yuqori",
        medium: "O'rta",
        low: "Past",
        no_priority: "Ustuvorlik yo'q",
      };
      const TASK_PRIORITY_RANK = { urgent: 0, high: 1, medium: 2, low: 3, no_priority: 4 };
      // Backenddagi TASK_NCOIN_AMOUNT_BY_JOB_TITLE bilan bir xil — faqat
      // tasdiqlash so'rovi/toast matnida to'g'ri miqdorni ko'rsatish uchun
      // (haqiqiy berish backendda hisoblanadi, bu shunchaki ko'rsatish oynasi).
      const TASK_NCOIN_AMOUNT_BY_JOB_TITLE = { "Grafik Dizyayner": 0.5 };
      const TASK_NCOIN_DEFAULT_AMOUNT = 0.2;
      const TASK_CREATOR_NCOIN_AMOUNT = 0.2;
      function taskNcoinAmount(t) {
        return TASK_NCOIN_AMOUNT_BY_JOB_TITLE[t?.assigneeJobTitle] ?? TASK_NCOIN_DEFAULT_AMOUNT;
      }
      // Doskadagi 5 ustun — dizayn asosida, mavjud 7 statusning VIZUAL
      // guruhlanishi (bazadagi statuslar o'zgarmaydi): Backlog+Boshlanmagan
      // → Biriktirilgan; Bajarilmadi/Bekor qilingan va 30 kundan eski
      // Bajarilgan'lar → Arxiv.
      function taskBoardColumn(t) {
        if (t.status === "backlog" || t.status === "todo") return "assigned";
        if (t.status === "in_progress") return "in_progress";
        if (t.status === "review") return "review";
        if (t.status === "failed" || t.status === "cancelled") return "archive";
        if (t.status === "done") return daysSince(t.completedAt) >= 30 ? "archive" : "done";
        return "assigned";
      }
      const TASK_BOARD_COLUMNS = [
        { key: "assigned", label: "Biriktirilgan", dot: "border:2px solid var(--t4)" },
        { key: "in_progress", label: "Jarayonda", dot: "background:var(--brand)" },
        { key: "review", label: "Tekshiruvda", dot: "background:var(--amber)" },
        { key: "done", label: "Bajarildi", dot: "background:var(--green)" },
        { key: "archive", label: "Arxiv", dot: "background:var(--chev)" },
      ];
      function daysSince(dateStr) {
        if (!dateStr) return Infinity;
        return daysBetween(parseISO(String(dateStr).slice(0, 10)), todayDate());
      }
      // Faol vazifalarda nisbiy matn (Bugun/N kun) — vazifa detali
      // sahifasida ishlatiladi. Doska va mobil ro'yxatdagi muddat
      // yorlig'i esa alohida — tbDueInfo().
      function dueChipInfo(dueDate) {
        if (!dueDate) return { text: "—", cls: "" };
        const diff = daysBetween(todayDate(), parseISO(dueDate));
        let text;
        if (diff < 0) text = `${-diff} kun o'tdi`;
        else if (diff === 0) text = "Bugun";
        else text = `${diff} kun`;
        if (diff < 0) return { text, cls: "late" };
        if (diff <= 2) return { text, cls: "soon" };
        return { text, cls: "" };
      }
      // Taglar — FIKS (random emas) palitra: standart 6 tag nomi bo'yicha
      // qat'iy biriktirilgan, boshqa (yangi qo'shilgan) nomlar esa shu
      // palitraga deterministik hash orqali tushadi. Rang hech qayerda
      // saqlanmaydi — har doim shu yerda hisoblanadi.
      const TAG_PALETTE = [
        { bg: "var(--amber-bg)", ink: "var(--amber-ink)" },
        { bg: "var(--teal-bg)", ink: "var(--teal)" },
        { bg: "var(--tagblue-bg)", ink: "var(--tagblue)" },
        { bg: "var(--purple-bg)", ink: "var(--purple)" },
        { bg: "var(--pink-bg)", ink: "var(--pink)" },
        { bg: "var(--chip)", ink: "var(--t5)" },
      ];
      const TAG_COLOR_BY_NAME = { Syomka: 0, Reels: 1, Post: 2, Stories: 3, Dizayn: 4, Matn: 5 };
      function tagColor(name) {
        if (name in TAG_COLOR_BY_NAME) return TAG_PALETTE[TAG_COLOR_BY_NAME[name]];
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return TAG_PALETTE[h % TAG_PALETTE.length];
      }
      // Xodimlar yuklamasi — faqat OCHIQ (hali yopilmagan) vazifalar
      // bo'yicha, shu ro'yxatdagi (allaqachon rolga qarab scope qilingan)
      // tasklardan hisoblanadi — yangi endpoint shart emas.
      function computeWorkload(list) {
        const today = isoOf(todayDate());
        const byUser = new Map();
        list.forEach((t) => {
          const masullar = taskAssignees(t);
          if (!masullar.length) return;
          if (["done", "failed", "cancelled"].includes(t.status)) return;
          // Umumiy vazifa har bir mas'ulning yukiga kiradi — ish
          // ikkalasining ham ro'yxatida turibdi.
          masullar.forEach((a) => {
            if (!byUser.has(a.username)) {
              byUser.set(a.username, { username: a.username, name: a.name || a.username, open: 0, late: 0 });
            }
            const row = byUser.get(a.username);
            row.open++;
            if (t.dueDate && t.dueDate < today) row.late++;
          });
        });
        return [...byUser.values()].sort((a, b) => b.late - a.late || b.open - a.open);
      }
      // Shoshilinch — alohida qizil "!" belgi (bars emas, ustuvor darajada
      // ko'zga yaqqol tashlanishi kerak). Qolganlari — Linear uslubidagi
      // 3 ta "signal bar": daraja qancha yuqori bo'lsa, shuncha ko'p
      // ustun to'ldirilgan (rangi ham darajaga qarab: yuqori=amber,
      // o'rta=brend ko'k, past=kul rang).
      function priorityIcon(priority) {
        if (priority === "urgent") {
          return `<div class="pri-urgent" title="${escHtml(TASK_PRIORITY_LABEL.urgent)}">!</div>`;
        }
        const level = { high: 3, medium: 2, low: 1, no_priority: 0 }[priority] ?? 0;
        const color = { high: "var(--amber)", medium: "var(--brand)", low: "var(--t4)" }[priority] || "var(--sw-off)";
        const bg = "var(--sw-off)";
        const bars = [6, 9, 12]
          .map((h, i) => {
            const filled = i < level;
            return `<rect x="${i * 5}" y="${12 - h}" width="3" height="${h}" rx="1" fill="${filled ? color : bg}"></rect>`;
          })
          .join("");
        return `<svg width="13" height="12" viewBox="0 0 13 12" style="flex-shrink:0;margin-top:1px" title="${escHtml(TASK_PRIORITY_LABEL[priority] || TASK_PRIORITY_LABEL.no_priority)}">${bars}</svg>`;
      }
      function setTaskStatusChip(key) {
        taskStatusChip = key;
        renderTasksBody();
      }
      async function renderTasksScreen() {
        // Vazifa yaratish — har qanday xodim uchun ochiq (faqat "Bajarildi"
        // deb belgilash admin uchun cheklangan, buttonlar darajasida
        // buildTaskStepperHtml'da).
        document.getElementById("tasks-fab").style.display = "flex";
        const newBtn = document.getElementById("tasks-new-btn");
        if (newBtn) newBtn.style.display = "flex";
        const body = document.getElementById("tasks-body");
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        try {
          const res = await apiFetch("/api/tasks");
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          tasksList = (await res.json()).tasks || [];
        } catch (e) {
          body.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        // Standart holat — rolga qarab: oddiy xodim avval o'ziga
        // tegishli vazifalarni ("Menda") ko'radi; admin/super admin esa
        // odatda o'ziga vazifa biriktirmaydi (u boshqalarniki bilan
        // shug'ullanadi), shuning uchun "Jamoada"dan boshlanadi. Faqat
        // BIR marta (screen birinchi ochilganda) — foydalanuvchi keyin
        // qo'lda boshqasini tanlasa, shu holatda qoladi.
        if (!taskScopeInitialized) {
          taskScopeInitialized = true;
          // Oddiy xodim avval o'ziga tegishli vazifalarni ko'radi; admin
          // esa odatda o'ziga vazifa biriktirmaydi — u "Hammasi"dan
          // boshlaydi. Faqat BIR marta, screen birinchi ochilganda.
          taskSeg = isAdmin ? "hammasi" : "menga";
        }
        renderTasksBody();
      }
      // Qidiruv (nomi/xodim/tag) + "Filtr" sheet'idagi tanlovlarni qo'llaydi.
      function applyTaskFilters(list) {
        const q = (document.getElementById("tasks-search")?.value || "").toLowerCase().trim();
        let out = list;
        if (q) {
          out = out.filter((t) => {
            if (t.title.toLowerCase().includes(q)) return true;
            if (taskAssigneeNames(t).toLowerCase().includes(q)) return true;
            return (t.tags || []).some((tag) => tag.name.toLowerCase().includes(q));
          });
        }
        if (taskBoardFilter.assignee)
          out = out.filter((t) => taskAssignees(t).some((a) => a.username === taskBoardFilter.assignee));
        if (taskBoardFilter.priority) out = out.filter((t) => t.priority === taskBoardFilter.priority);
        if (taskBoardFilter.project) out = out.filter((t) => t.projectSlug === taskBoardFilter.project);
        if (taskBoardFilter.tag) out = out.filter((t) => (t.tags || []).some((tag) => tag.id === taskBoardFilter.tag));
        return out;
      }
      function renderTasksBody() {
        const body = document.getElementById("tasks-body");
        if (!tasksList.length) {
          body.innerHTML = `<div class="empty"><div class="empty-ico">✓</div><div class="empty-t">Vazifa yo'q</div><div class="empty-s">${isAdmin ? "Pastdagi + tugmasi orqali yangi vazifa qo'shing." : "Sizga hali vazifa biriktirilmagan."}</div></div>`;
          const sumEl = document.getElementById("tasks-summary");
          if (sumEl) sumEl.textContent = "—";
          return;
        }

        const open = tasksList.filter((t) => !["done", "failed", "cancelled"].includes(t.status));
        const workload = computeWorkload(tasksList);
        // Sarlavha osti — dizayn bo'yicha shaxsiy xulosa: nechta vazifa
        // aynan MENGA biriktirilgan va ulardan nechtasi 2 kun ichida
        // tugaydi (kechikkanlar ham shu songa kiradi).
        const mine = open.filter(taskIsMine);
        const soon = mine.filter((t) => {
          if (!t.dueDate) return false;
          return daysBetween(todayDate(), parseISO(t.dueDate)) <= 2;
        });
        const sumEl = document.getElementById("tasks-summary");
        if (sumEl)
          sumEl.textContent = mine.length
            ? `${mine.length} ta menga${soon.length ? ` · ${soon.length} tasi 2 kun ichida` : ""}`
            : `${open.length} ochiq · ${workload.length} xodim`;

        const filtered = applyTaskFilters(tasksList);
        body.innerHTML = `${buildTasksMobileHtml(filtered)}${buildTasksDesktopHtml(filtered)}`;
      }

      // Vazifalar HAR JOYDA bitta ketma-ketlikda turadi:
      // bajarilmaganlar (Biriktirilgan) → Jarayonda → Tekshiruvda →
      // Bajarildi → Arxiv. Guruhlangan ko'rinishda bu guruhlar tartibi,
      // aralash ro'yxatda esa saralashning BIRINCHI mezoni; ustuvorlik
      // va muddat faqat shundan keyin hisobga olinadi.
      const TASK_ORDER = TASK_BOARD_COLUMNS.map((c) => c.key);
      function taskOrderRank(t) {
        const i = TASK_ORDER.indexOf(taskBoardColumn(t));
        return i === -1 ? TASK_ORDER.length : i;
      }
      function sortTasksForBoard(items) {
        return [...items].sort((a, b) => {
          const st = taskOrderRank(a) - taskOrderRank(b);
          if (st !== 0) return st;
          const pr = (TASK_PRIORITY_RANK[a.priority] ?? 4) - (TASK_PRIORITY_RANK[b.priority] ?? 4);
          if (pr !== 0) return pr;
          return (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
        });
      }
      // Ekranda AYNAN KO'RINAYOTGAN vazifalar, ko'rinish tartibida.
      // Vazifa detalidagi "oldingi/keyingi" va "N / M" sanog'i shu
      // ro'yxat bo'yicha yuradi — avval xom `tasksList` tartibi
      // ishlatilardi va u ekrandagi tartibga mos kelmasdi.
      function visibleTasksInOrder() {
        let list = tbApplySeg(applyTaskFilters(tasksList));
        if (!taskArchiveOpen) list = list.filter((t) => taskBoardColumn(t) !== "archive");
        const isMobile = !window.matchMedia("(min-width: 860px)").matches;
        if (isMobile && taskStatusChip !== "all") list = list.filter((t) => taskBoardColumn(t) === taskStatusChip);
        return sortTasksForBoard(list);
      }
      // ── VAZIFALAR DOSKASI (v3) ──────────────────────────────────────
      // Ustuvorlik ko'rsatkichi — 3 ta ustun (3px kenglik, 5/8/12px
      // balandlik): daraja qancha yuqori bo'lsa, shuncha ko'pi to'lgan.
      // Shoshilinch — barchasi qizil.
      // ── VAZIFA MAS'ULLARI ────────────────────────────────────────
      // Bitta vazifada bir nechta mas'ul bo'lishi mumkin. Backend
      // `assignees` massivini qaytaradi; eski maydonlar (assigneeUsername
      // va h.k.) birinchi mas'ulning nusxasi bo'lib qoladi. Shu yerda
      // har doim massiv bilan ishlanadi — qolgan kod bitta/ko'p holatni
      // farqlamasligi uchun.
      function taskAssignees(t) {
        if (Array.isArray(t?.assignees) && t.assignees.length) return t.assignees;
        if (t?.assigneeUsername) {
          return [
            {
              username: t.assigneeUsername,
              name: t.assigneeName || t.assigneeUsername,
              avatarUrl: t.assigneeAvatarUrl || null,
              jobTitle: t.assigneeJobTitle || null,
            },
          ];
        }
        return [];
      }
      function taskIsMine(t) {
        return taskAssignees(t).some((a) => a.username === currentUser);
      }
      function taskAssigneeNames(t) {
        return taskAssignees(t)
          .map((a) => a.name)
          .join(", ");
      }
      // Kartochkada mas'ullar — ustma-ust avatarlar. Uchtadan ko'p bo'lsa
      // qolganlari "+N" bo'lib ko'rsatiladi, aks holda qator kengayib
      // ketardi.
      function taskAvatarsHtml(t, cls) {
        const list = taskAssignees(t);
        if (!list.length) return "";
        const korinadigan = list.slice(0, 3);
        const qolgan = list.length - korinadigan.length;
        const bitta = (a, i) =>
          `<span class="${cls}" style="background:${personColor(a.username || a.name)};${i ? "margin-left:-7px" : ""}" title="${escHtml(a.name)}">${escHtml((a.name || "?").slice(0, 1).toUpperCase())}${avatarImg(a.avatarUrl)}</span>`;
        const more = qolgan
          ? `<span class="${cls} more" style="margin-left:-7px" title="${escHtml(list.slice(3).map((a) => a.name).join(", "))}">+${qolgan}</span>`
          : "";
        return `<span class="task-avs">${korinadigan.map(bitta).join("")}${more}</span>`;
      }

      function tbPriBarsHtml(priority) {
        const level = { urgent: 3, high: 3, medium: 2, low: 1, no_priority: 0 }[priority] ?? 0;
        const color =
          priority === "urgent"
            ? "var(--red)"
            : { high: "var(--amber)", medium: "var(--brand)", low: "var(--v3-t3)" }[priority] || "var(--track)";
        const bars = [5, 8, 12]
          .map((h, i) => `<i style="height:${h}px;background:${i < level ? color : "var(--track)"}"></i>`)
          .join("");
        return `<span class="tb-pri" title="${escHtml(TASK_PRIORITY_LABEL[priority] || TASK_PRIORITY_LABEL.no_priority)}">${bars}</span>`;
      }
      // Qisqa raqam — dizaynda 4 belgi (masalan "4FC1").
      function tbRef(id) {
        return String(id).replace(/-/g, "").slice(0, 4).toUpperCase();
      }
      // Muddat yorlig'i: kechikkan — qizil, 2 kun ichida — amber,
      // qolgani — kul rang. Yopilgan vazifalarda taqvim sanasi.
      function tbDueInfo(t) {
        const closed = ["done", "failed", "cancelled"].includes(t.status);
        if (closed) {
          const d = t.completedAt || t.updatedAt || t.dueDate;
          return { text: d ? fmtDay(parseISO(String(d).slice(0, 10))) : "—", cls: "norm" };
        }
        if (!t.dueDate) return { text: "Muddatsiz", cls: "norm" };
        const diff = daysBetween(todayDate(), parseISO(t.dueDate));
        const cls = diff < 0 ? "late" : diff <= 2 ? "soon" : "norm";
        // Ish oynasi bor bo'lsa — aynan o'sha oraliq ko'rsatiladi
        // ("3–8 okt"). Avval faqat "3-oktabr dan" yozilardi: xodim
        // qachon boshlashini ko'rardi-yu, qachongacha tugatishi
        // kerakligini ko'rmasdi. Rang holatni aytadi: qizil —
        // kechikkan, sariq — 2 kun ichida, kul rang — vaqt bor.
        if (t.startDate && t.startDate !== t.dueDate) {
          return { text: fmtRangeShort(t.startDate, t.dueDate), cls };
        }
        // Bir kunlik ishda oyna — o'sha kunning o'zi, shuning uchun
        // "2 kun" emas, aynan qaysi kun ekani yoziladi.
        if (t.startDate) {
          const d = parseISO(t.startDate);
          return { text: `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`, cls };
        }
        // Oraliqsiz (faqat muddatli) vazifada ko'rsatadigan oyna yo'q —
        // avvalgidek muddatgacha qolgan vaqt yoziladi.
        if (diff < 0) return { text: `${-diff} kun kechikdi`, cls: "late" };
        if (diff === 0) return { text: "Bugun", cls: "late" };
        if (diff <= 2) return { text: `${diff} kun qoldi`, cls: "soon" };
        return { text: `${diff} kun`, cls: "norm" };
      }
      // Vazifadagi mas'ul avatari — Telegram profil rasmi bo'lsa o'sha,
      // bo'lmasa (yoki rasm yuklanmasa) rangli harf ko'rinadi. Rasm
      // `.av-img` orqali ustiga qo'yiladi; `onerror` da o'zini o'chiradi,
      // shuning uchun harf doim zaxira bo'lib turadi.
      function taskPersonAvatarHtml(t, cls) {
        return taskAvatarsHtml(t, cls);
      }
      function tbAvatarHtml(t) {
        return taskPersonAvatarHtml(t, "tb-av");
      }
      function tbTagPillHtml(t) {
        const tag = (t.tags || [])[0];
        if (!tag) return "";
        const c = tagColor(tag.name);
        return `<span class="tag-chip" style="background:${c.bg};color:${c.ink}">${escHtml(tag.name)}</span>`;
      }
      function tbCardHtml(t) {
        const muted = ["done", "failed", "cancelled"].includes(t.status);
        const due = tbDueInfo(t);
        const check =
          t.checklistTotal > 0
            ? `<span class="tb-checkn">&#9745; ${t.checklistDone}/${t.checklistTotal}</span>`
            : "";
        const pill = tbTagPillHtml(t);
        const metaRow = pill || check ? `<div class="tb-card-meta">${pill}${check}</div>` : "";
        return `<div class="tb-card${muted ? " muted" : ""}" data-task="${escArg(t.id)}" onclick="openTaskActions('${escArg(t.id)}')">
          <div class="tb-card-top">
            ${tbPriBarsHtml(t.priority)}
            <span class="tb-ref">${tbRef(t.id)}</span>
            ${tbAvatarHtml(t)}
          </div>
          <div class="tb-card-title">${escHtml(t.title)}</div>
          ${metaRow}
          <div class="tb-card-foot">
            <span class="tb-due ${due.cls}">${escHtml(due.text)}</span>
            <span class="tb-proj">${escHtml(t.projectLabel || "Umumiy")}</span>
          </div>
        </div>`;
      }
      // Segment: Hammasi / Menga / Men berganlar.
      function tbApplySeg(list) {
        if (taskSeg === "menga") return list.filter(taskIsMine);
        if (taskSeg === "menberdim") return list.filter((t) => t.createdByUsername === currentUser);
        return list;
      }
      function setTaskSeg(v) {
        taskSeg = v;
        // Eski mobil guruhlash ham shu segmentga ergashadi.
        renderTasksBody();
      }
      function toggleTaskArchive() {
        taskArchiveOpen = !taskArchiveOpen;
        renderTasksBody();
      }
      function expandTaskCol(key) {
        taskColExpanded.add(key);
        renderTasksBody();
      }
      // Uzuq chiziqli filtr chipi — bosilganda tanlov ro'yxati ochiladi.
      function tbChipHtml(key, label, current) {
        const chev = `<span class="tb-chip-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>`;
