      // ── TAB NAVIGATSIYASI ─────────────────────────────────────────
      const ROOT_TABS = ["today", "projects", "tasks", "nshop", "history", "admin"];
      function showTab(tab) {
        activeTab = tab;
        ROOT_TABS.forEach((t) => {
          document
            .getElementById("screen-" + t)
            .classList.toggle("active", t === tab);
          document
            .getElementById("nav-" + t)
            ?.classList.toggle("active", t === tab);
          document
            .getElementById("sidebar-nav-" + t)
            ?.classList.toggle("active", t === tab);
        });
        SUB_SCREENS.forEach((s) => document.getElementById(s)?.classList.remove("active"));
        // Bo'sh satr = inline override'ni olib tashlaydi, CSS (mobil:
        // flex, katta ekran: sidebar bor — none) o'zi hal qiladi.
        document.getElementById("bottom-nav").style.display = "";
        if (tg()?.BackButton) tg().BackButton.hide();
        if (tab === "today") renderToday();
        else if (tab === "projects") renderProjectsScreen();
        else if (tab === "tasks") renderTasksScreen();
        else if (tab === "nshop") renderNShopScreen();
        else if (tab === "history") openHistoryTab();
        else if (tab === "admin") switchATab(adminActiveTab);
        syncSidebarAdminActive();
      }

      // Ichki (drill-in) ekranni ochish — root ekranlar yashiriladi
      const SUB_SCREENS = ["screen-tracker", "screen-taskdetail", "screen-profile"];
      function openSubScreen(id, onBack) {
        ROOT_TABS.forEach((t) =>
          document.getElementById("screen-" + t).classList.remove("active"),
        );
        SUB_SCREENS.forEach((s) => document.getElementById(s)?.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        document.getElementById("bottom-nav").style.display = "none";
        if (tg()?.BackButton) {
          tg().BackButton.show();
          tg().BackButton.onClick(onBack);
        }
      }

      // ── BUGUN ─────────────────────────────────────────────────────
      function computeHomeTempo() {
        let totalTasks = 0,
          weightedElapsed = 0,
          doneAll = 0;
        projects.forEach((p) => {
          const tot = p.k + p.s;
          totalTasks += tot;
          doneAll += p.doneK + p.doneS;
          weightedElapsed += tot * projElapsedFrac(p);
        });
        const expectedFrac = totalTasks ? weightedElapsed / totalTasks : 0;
        const expectedDone = Math.round(expectedFrac * totalTasks);
        return {
          overallPct: pct(doneAll, totalTasks),
          expectedPct: Math.round(expectedFrac * 100),
          expectedFrac,
          totalTasks,
          doneAll,
          expectedDone,
          behind: Math.max(0, expectedDone - doneAll),
        };
      }
      function buildSegs(frac) {
        const n = 5;
        const curIdx = Math.min(n - 1, Math.floor(frac * n));
        let html = "";
        for (let i = 0; i < n; i++) {
          let cls = "tempo-seg";
          if (i < curIdx || (i === curIdx && frac >= 1)) cls += " done";
          else if (i === curIdx) cls += " now";
          html += `<div class="${cls}"></div>`;
        }
        return html;
      }
      function renderToday() {
        const body = document.getElementById("today-body");
        const today = todayDate();
        document.getElementById("today-date-label").textContent = fmtDay(today);
        document.getElementById("me-avatar").textContent = (currentUser || "?")
          .slice(0, 1)
          .toUpperCase();
        const npBtn = document.getElementById("today-new-project-btn");
        if (npBtn) npBtn.style.display = isAdmin ? "flex" : "none";

        if (projects.length === 0) {
          body.innerHTML = `<div class="empty">
            <div class="empty-ico">▤</div>
            <div class="empty-t">Tracker yo'q</div>
            <div class="empty-s">${isAdmin ? "Yangi loyiha yarating" : "Sizga hali loyiha biriktirilmagan"}</div>
          </div>`;
          return;
        }

        const t = computeHomeTempo();

        const debtProjects = projects.filter((p) => p.outstandingDebt);
        let debtHtml = "";
        if (debtProjects.length) {
          const d0 = debtProjects[0];
          const debt = d0.outstandingDebt;
          const daysAgo = daysBetween(parseISO(debt.periodEnd), today);
          const remaining = debt.remainingPosts + debt.remainingStories;
          debtHtml = `<div class="debt-card" onclick="openProjectHistorySheet('${escArg(d0.id)}','${escArg(d0.label)}')">
            <div class="debt-ico">!</div>
            <div style="flex:1;min-width:0">
              <div class="debt-title">${debtProjects.length} loyiha qarzda</div>
              <div class="debt-sub">${escHtml(d0.label)} · ${daysAgo} kun · ${remaining} vazifa</div>
            </div>
            <div class="debt-btn">Ochish</div>
          </div>`;
        }

        const rows = projects
          .map((p) => {
            const pc = projPct(p);
            const color = p.outstandingDebt ? "var(--red)" : "var(--brand)";
            const donut = `conic-gradient(${color} 0% ${pc}%, var(--chip3) ${pc}% 100%)`;
            const sub = p.outstandingDebt
              ? `<div class="r-sub" style="color:var(--red)">Muddati o'tgan · ${MONTHS[parseISO(p.outstandingDebt.periodStart).getMonth()].toLowerCase()}</div>`
              : `<div class="r-sub">${p.doneK}/${p.k} post · ${p.doneS}/${p.s} stories</div>`;
            return `<div class="list-row clickable" onclick="openTracker('${escArg(p.id)}')">
              <div class="donut" style="background:${donut}">
                <div class="donut-in num" style="color:${color}">${pc}</div>
              </div>
              <div style="flex:1;min-width:0">
                <div class="r-name">${escHtml(p.label)}</div>
                ${sub}
              </div>
              <div class="chev">›</div>
            </div>`;
          })
          .join("");

        body.innerHTML = `
          <div class="mobile-only">
            ${buildActivityPanelCardHtml(true)}
            <div class="tempo" style="margin-top:14px">
              <div class="tempo-top">
                <div>
                  <div class="tempo-lbl">Umumiy bajarilish</div>
                  <div class="tempo-pct num">${t.overallPct}<span>%</span></div>
                </div>
                <div class="tempo-exp">
                  <div class="l1" title="Loyihalar davri (boshlanish–tugash sanasi)ga nisbatan bugun qancha % bajarilgan bo'lishi kerakligi">Kutilgan surhat</div>
                  <div class="l2 num">${t.expectedPct}%</div>
                </div>
              </div>
              <div class="tempo-segs">${buildSegs(t.expectedFrac)}</div>
              <div class="tempo-foot">${t.doneAll}/${t.totalTasks} vazifa bajarildi${t.behind > 0 ? ` · ${t.behind} ta muddatga nisbatan orqada` : ""}</div>
              <div class="tempo-note">Loyihalar muddatiga (boshlanish–tugash sanasi) asosan hisoblanadi</div>
            </div>
            ${debtHtml}
            <div style="margin-top:14px">
              ${buildAssignedTasksCardHtml()}
              ${buildTodayTasksCardHtml()}
              ${buildMyProgressCardHtml()}
            </div>
            <div class="sec-row">
              <div class="sec-title">Mening loyihalarim</div>
              <div class="sec-count num">${projects.length}</div>
            </div>
            <div class="list-card">${rows}</div>
          </div>
          ${buildDashboardDesktopHtml(t)}`;
      }

      // ── BOSHQARUV PANELI (faqat katta ekran — "Bugun" desktop bloki) ─
      function setDashFilter(key) {
        dashProjFilter = key;
        renderToday();
      }
      function buildDashboardDesktopHtml(t) {
        const today = todayDate();
        const debtProjects = projects.filter((p) => p.outstandingDebt);
        const empWithAccess = Object.keys(perms).filter((u) => (perms[u] || []).length > 0).length;
        const monthLabel = MONTHS[today.getMonth()];

        const chips = [
          { key: "all", label: "Hammasi" },
          { key: "debt", label: "Qarzdor" },
          { key: "mine", label: "Mening" },
        ];
        const chipsHtml = chips
          .map(
            (c) =>
              `<button class="chip-btn${dashProjFilter === c.key ? " active" : ""}" onclick="setDashFilter('${c.key}')">${c.label}</button>`,
          )
          .join("");

        const q = (document.getElementById("today-search")?.value || "").toLowerCase().trim();
        let tableList = projects;
        if (dashProjFilter === "debt") tableList = tableList.filter((p) => p.outstandingDebt);
        else if (dashProjFilter === "mine")
          tableList = tableList.filter((p) => isAdmin || (perms[currentUser] || []).includes(p.id));
        if (q) {
          tableList = tableList.filter((p) => {
            if (p.label.toLowerCase().includes(q)) return true;
            const owners = Object.keys(perms).filter((u) => (perms[u] || []).includes(p.id));
            return owners.some((u) => u.toLowerCase().includes(q));
          });
        }
        // Eng ko'p bajarilgandan eng kamiga — progress ustuni bo'yicha
        // kamayish tartibida (loyihalar filtr/qidiruvdan keyin, jadvalga
        // chizishdan oldin saralanadi).
        tableList = [...tableList].sort((a, b) => projPct(b) - projPct(a));

        const tableRows = tableList
          .map((p) => {
            const owners = Object.keys(perms).filter((u) => (perms[u] || []).includes(p.id)).length;
            const pc = projPct(p);
            const muddat = p.outstandingDebt
              ? `<span style="color:var(--red);font-weight:600">${daysBetween(parseISO(p.outstandingDebt.periodEnd), today)} kun o'tdi</span>`
              : fmtDay(parseISO(p.periodEnd));
            const holat = p.outstandingDebt
              ? `<span class="debt-badge">Qarz</span>`
              : `<span class="debt-badge" style="color:var(--brand);background:rgba(47,122,185,.12)">Faol</span>`;
            return `<tr class="clickable${p.outstandingDebt ? " debt-row" : ""}" onclick="openTracker('${escArg(p.id)}')">
              <td class="dtbl-name">${escHtml(p.label)}</td>
              <td>${owners ? owners + " xodim" : "—"}</td>
              <td>
                <div class="dtbl-bar-wrap">
                  <div class="hist-track"><div class="hist-fill" style="width:${pc}%"></div></div>
                  <span class="num">${pc}%</span>
                </div>
              </td>
              <td>${muddat}</td>
              <td>${holat}</td>
            </tr>`;
          })
          .join("");

        const empProgressHtml = computeEmployeeProgress().length
          ? computeEmployeeProgress()
              .map(
                (r) => `<div class="rail-item" style="flex-direction:column;align-items:stretch;gap:6px">
                  <div style="display:flex;justify-content:space-between;font-size:12.5px">
                    <span class="r-name">@${escHtml(r.username)}</span>
                    <span class="num" style="color:${r.avg < 40 ? "var(--red)" : "var(--t2)"}">${r.avg}%</span>
                  </div>
                  <div class="hist-track"><div class="hist-fill" style="width:${r.avg}%;background:${r.avg < 40 ? "var(--red)" : "var(--brand)"}"></div></div>
                </div>`,
              )
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Ma'lumot yo'q</div>`;

        return `
          <div class="desktop-only">
            ${buildActivityPanelCardHtml(false)}
            <div class="stat-grid" style="margin-top:18px">
              <div class="stat-card tempo">
                <div class="stat-lbl">Bajarilish darajasi</div>
                <div style="display:flex;align-items:baseline;gap:8px">
                  <div class="stat-val" style="margin-top:12px">${t.overallPct}%</div>
                  <div class="stat-foot" style="margin-top:12px" title="Loyihalar davri (boshlanish–tugash sanasi)ga nisbatan bugun qancha % bajarilgan bo'lishi kerakligi">Kutilgan: ${t.expectedPct}%${t.behind > 0 ? ` · ${t.behind} orqada` : ""}</div>
                </div>
                <div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.max(0, Math.min(100, t.overallPct))}%"></div></div>
              </div>
              <div class="stat-card">
                <div class="stat-lbl">Bajarilgan</div>
                <div class="stat-val">${t.doneAll}<span class="stat-sub">/${t.totalTasks}</span></div>
                <div class="stat-foot">${monthLabel} oyi bo'yicha</div>
              </div>
              <div class="stat-card">
                <div class="stat-lbl">Faol loyiha</div>
                <div class="stat-val">${projects.length}</div>
                <div class="stat-foot">${empWithAccess} xodim orasida</div>
              </div>
              <div class="stat-card danger">
                <div class="stat-lbl">Qarzda</div>
                <div class="stat-val">${debtProjects.length}</div>
                <div class="stat-foot"><span class="stat-link" onclick="showTab('projects');setProjFilter('debt')">Ko'rish →</span></div>
              </div>
            </div>
            <div class="dash-cols">
              <div>
                <div class="dtbl-wrap">
                  <div class="card-hdr">
                    <div class="card-hdr-title">Loyihalar</div>
                    <div class="chips" style="margin: 0">${chipsHtml}</div>
                  </div>
                  <table class="dtbl">
                    <thead><tr><th>Loyiha</th><th>Mas'ul</th><th>Progress</th><th>Muddat</th><th>Holat</th></tr></thead>
                    <tbody>${tableRows || `<tr><td colspan="5" style="text-align:center;color:var(--t3);padding:24px">Loyiha topilmadi</td></tr>`}</tbody>
                  </table>
                </div>
              </div>
              <div>
                ${buildAssignedTasksCardHtml()}
                ${buildTodayTasksCardHtml()}
                ${buildMyProgressCardHtml()}
                <div class="rail-card">
                  <div class="rail-title">Xodimlar progresi</div>
                  ${empProgressHtml}
                </div>
              </div>
            </div>
          </div>`;
      }

      // ── LOYIHALAR ─────────────────────────────────────────────────
      function setProjFilter(k) {
        projFilter = k;
        renderProjectsScreen();
      }
      function renderProjectsScreen() {
        document.getElementById("projects-fab").style.display = isAdmin
          ? "flex"
          : "none";
        const debtCount = projects.filter((p) => p.outstandingDebt).length;
        const chips = [
          { key: "all", label: "Hammasi" },
          { key: "debt", label: `Qarzdor ${debtCount}`, danger: true },
          { key: "mine", label: "Mening" },
          { key: "done", label: "Tugagan" },
        ];
        document.getElementById("proj-chips").innerHTML = chips
          .map((c) => {
            const cls =
              "chip-btn" +
              (projFilter === c.key ? " active" : c.danger ? " danger" : "");
            return `<button class="${cls}" onclick="setProjFilter('${c.key}')">${c.label}</button>`;
          })
          .join("");

        const body = document.getElementById("projects-body");
        const q = (document.getElementById("proj-search")?.value || "")
          .toLowerCase()
          .trim();
        let list = projects.filter((p) => !q || p.label.toLowerCase().includes(q));
        if (projFilter === "debt") list = list.filter((p) => p.outstandingDebt);
        else if (projFilter === "mine")
          list = list.filter(
            (p) => isAdmin || (perms[currentUser] || []).includes(p.id),
          );
        else if (projFilter === "done")
          list = list.filter((p) => projPct(p) >= 100);

        if (list.length === 0) {
          body.innerHTML = `<div class="empty"><div class="empty-ico">⌕</div><div class="empty-t">Hech narsa topilmadi</div><div class="empty-s">Qidiruv yoki filtrni o'zgartirib ko'ring.</div></div>`;
          return;
        }

        const today = todayDate();
        const overdue = list.filter((p) => p.outstandingDebt);
        const active = list.filter((p) => !p.outstandingDebt);
        let html = `<div class="mobile-only">`;
        if (overdue.length) {
          html += `<div class="sec-upper">Muddati o'tgan · ${overdue.length}</div><div class="list-card" style="margin-bottom:20px">`;
          html += overdue
            .map((p) => {
              const daysAgo = daysBetween(
                parseISO(p.outstandingDebt.periodEnd),
                today,
              );
              const rem =
                p.outstandingDebt.remainingPosts +
                p.outstandingDebt.remainingStories;
              return `<div class="od-row" onclick="openTracker('${escArg(p.id)}')">
                <div class="od-bar"></div>
                <div style="flex:1;min-width:0">
                  <div class="r-name">${escHtml(p.label)}</div>
                  <div class="r-sub">${rem} vazifa qoldi</div>
                </div>
                <div class="od-days num">${daysAgo} kun</div>
              </div>`;
            })
            .join("");
          html += `</div>`;
        }
        if (active.length) {
          html += `<div class="sec-upper">Faol · ${active.length}</div><div class="list-card">`;
          html += active
            .map((p) => {
              const pc = projPct(p);
              const dl = projDaysLeft(p);
              return `<div class="pv-row" onclick="openTracker('${escArg(p.id)}')">
                <div style="flex:1;min-width:0">
                  <div class="r-name">${escHtml(p.label)}</div>
                  <div class="r-sub">${dl >= 0 ? dl + " kun qoldi" : "muddat tugagan"}</div>
                </div>
                <div class="pv-bar-wrap">
                  <div class="pv-bar-track"><div class="pv-bar-fill" style="width:${pc}%"></div></div>
                  <div class="pv-pct num">${pc}%</div>
                </div>
              </div>`;
            })
            .join("");
          html += `</div>`;
        }
        html += `</div>${buildProjectsDesktopHtml(overdue, active)}`;
        body.innerHTML = html;
      }

      // Loyihalar — katta ekranda kartochka to'ri (list o'rniga)
      // Loyihalar — katta ekranda 3 ustunli board (Linear'dagi board
      // g'oyasi, lekin bizning data modelimizga mos real bosqichlar
      // bilan: har bir loyiha doim faol bo'lgani uchun Backlog/Planned
      // tushunchasi yo'q — Qarzdor/Faol/Tugagan real holatlar).
      function buildProjectsDesktopHtml(overdue, active) {
        const today = todayDate();
        const cardFor = (p) => {
          if (p.outstandingDebt) {
            const daysAgo = daysBetween(parseISO(p.outstandingDebt.periodEnd), today);
            const rem = p.outstandingDebt.remainingPosts + p.outstandingDebt.remainingStories;
            return `<div class="pcard" style="margin-bottom:10px" onclick="openTracker('${escArg(p.id)}')">
              <div class="pcard-top">
                <div class="r-name">${escHtml(p.label)}</div>
                <span class="debt-badge">${daysAgo} kun</span>
              </div>
              <div class="r-sub">${rem} vazifa qoldi</div>
            </div>`;
          }
          const pc = projPct(p);
          const dl = projDaysLeft(p);
          return `<div class="pcard" style="margin-bottom:10px" onclick="openTracker('${escArg(p.id)}')">
            <div class="pcard-top">
              <div class="r-name">${escHtml(p.label)}</div>
              <div class="pcard-pct num">${pc}%</div>
            </div>
            <div class="hist-track" style="margin-bottom:9px"><div class="hist-fill" style="width:${pc}%"></div></div>
            <div class="r-sub">${dl >= 0 ? dl + " kun qoldi" : "muddat tugagan"}</div>
          </div>`;
        };
        const inProgress = active.filter((p) => projPct(p) < 100);
        const finished = active.filter((p) => projPct(p) >= 100);
        const cols = [
          { label: "Qarzdor", items: overdue },
          { label: "Faol", items: inProgress },
          { label: "Tugagan", items: finished },
        ];
        const colsHtml = cols
          .map(
            (col) => `<div>
              <div class="kanban-col-hdr"><span>${col.label}</span><span class="kanban-count">${col.items.length}</span></div>
              ${col.items.map(cardFor).join("") || `<div style="font-size:12px;color:var(--t3);padding:4px 2px">Bo'sh</div>`}
            </div>`,
          )
          .join("");
        return `<div class="desktop-only"><div class="kanban" style="grid-template-columns:repeat(3,1fr)">${colsHtml}</div></div>`;
      }

      // ── VAZIFALAR ─────────────────────────────────────────────────
      const TASK_STATUS_LABEL = {
        backlog: "Backlog",
        todo: "Boshlanmagan",
        in_progress: "Jarayonda",
        review: "Tekshiruvda",
        done: "Bajarilgan",
        failed: "Bajarilmadi",
        cancelled: "Bekor qilingan",
      };
      const TASK_PRIORITY_LABEL = {
        urgent: "Shoshilinch",
        high: "Yuqori",
        medium: "O'rta",
        low: "Past",
        no_priority: "Ustuvorlik yo'q",
      };
      const TASK_PRIORITY_RANK = { urgent: 0, high: 1, medium: 2, low: 3, no_priority: 4 };
      // Backenddagi TASK_NCOIN_AMOUNT_BY_JOB_TITLE bilan bir xil — faqat
      // tasdiqlash so'rovi/toast matnida to'g'ri miqdorni ko'rsatish uchun
      // (haqiqiy berish backendda hisoblanadi, bu shunchaki ko'rsatish oynasi).
      const TASK_NCOIN_AMOUNT_BY_JOB_TITLE = { "Grafik Dizyayner": 0.5 };
      const TASK_NCOIN_DEFAULT_AMOUNT = 0.2;
      const TASK_CREATOR_NCOIN_AMOUNT = 0.2;
      function taskNcoinAmount(t) {
        return TASK_NCOIN_AMOUNT_BY_JOB_TITLE[t?.assigneeJobTitle] ?? TASK_NCOIN_DEFAULT_AMOUNT;
      }
      // Doskadagi 5 ustun — dizayn asosida, mavjud 7 statusning VIZUAL
      // guruhlanishi (bazadagi statuslar o'zgarmaydi): Backlog+Boshlanmagan
      // → Biriktirilgan; Bajarilmadi/Bekor qilingan va 30 kundan eski
      // Bajarilgan'lar → Arxiv.
      function taskBoardColumn(t) {
        if (t.status === "backlog" || t.status === "todo") return "assigned";
        if (t.status === "in_progress") return "in_progress";
        if (t.status === "review") return "review";
        if (t.status === "failed" || t.status === "cancelled") return "archive";
        if (t.status === "done") return daysSince(t.completedAt) >= 30 ? "archive" : "done";
        return "assigned";
      }
      const TASK_BOARD_COLUMNS = [
        { key: "assigned", label: "Biriktirilgan", dot: "border:2px solid var(--t4)" },
        { key: "in_progress", label: "Jarayonda", dot: "background:var(--brand)" },
        { key: "review", label: "Tekshiruvda", dot: "background:var(--amber)" },
        { key: "done", label: "Bajarildi", dot: "background:var(--green)" },
        { key: "archive", label: "Arxiv", dot: "background:var(--chev)" },
      ];
      function daysSince(dateStr) {
        if (!dateStr) return Infinity;
        return daysBetween(parseISO(String(dateStr).slice(0, 10)), todayDate());
      }
      // Faol vazifalarda nisbiy matn (Bugun/N kun) — dizaynga mos;
      // Bajarildi/Arxiv kartochkalarida esa taqvim sanasi ko'rsatiladi
      // (buildTaskCardHtml'da alohida, bu funksiyani chaqirmasdan).
      function dueChipInfo(dueDate) {
        if (!dueDate) return { text: "—", cls: "" };
        const diff = daysBetween(todayDate(), parseISO(dueDate));
        let text;
        if (diff < 0) text = `${-diff} kun o'tdi`;
        else if (diff === 0) text = "Bugun";
        else text = `${diff} kun`;
        if (diff < 0) return { text, cls: "late" };
        if (diff <= 2) return { text, cls: "soon" };
        return { text, cls: "" };
      }
      // Taglar — FIKS (random emas) palitra: standart 6 tag nomi bo'yicha
      // qat'iy biriktirilgan, boshqa (yangi qo'shilgan) nomlar esa shu
      // palitraga deterministik hash orqali tushadi. Rang hech qayerda
      // saqlanmaydi — har doim shu yerda hisoblanadi.
      const TAG_PALETTE = [
        { bg: "var(--amber-bg)", ink: "var(--amber-ink)" },
        { bg: "var(--teal-bg)", ink: "var(--teal)" },
        { bg: "var(--tagblue-bg)", ink: "var(--tagblue)" },
        { bg: "var(--purple-bg)", ink: "var(--purple)" },
        { bg: "var(--pink-bg)", ink: "var(--pink)" },
        { bg: "var(--chip)", ink: "var(--t5)" },
      ];
      const TAG_COLOR_BY_NAME = { Syomka: 0, Reels: 1, Post: 2, Stories: 3, Dizayn: 4, Matn: 5 };
      function tagColor(name) {
        if (name in TAG_COLOR_BY_NAME) return TAG_PALETTE[TAG_COLOR_BY_NAME[name]];
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return TAG_PALETTE[h % TAG_PALETTE.length];
      }
      function renderTagChipsHtml(tags, muted) {
        if (!tags || !tags.length) return "";
        const chips = tags
          .map((t) => {
            const c = muted ? { bg: "var(--chip3)", ink: "var(--t3)" } : tagColor(t.name);
            return `<span class="tag-chip" style="background:${c.bg};color:${c.ink}">${escHtml(t.name)}</span>`;
          })
          .join("");
        return `<div class="kcard-tags">${chips}</div>`;
      }
      function taskAvatarHtml(t, sizeCls, muted) {
        if (!t.assigneeName) return "";
        return `<div class="avatar${sizeCls ? " " + sizeCls : ""}" style="${muted ? "opacity:.6" : ""}" title="${escHtml(t.assigneeName)}">${escHtml(t.assigneeName.slice(0, 1).toUpperCase())}</div>`;
      }
      // Xodimlar yuklamasi — faqat OCHIQ (hali yopilmagan) vazifalar
      // bo'yicha, shu ro'yxatdagi (allaqachon rolga qarab scope qilingan)
      // tasklardan hisoblanadi — yangi endpoint shart emas.
      function computeWorkload(list) {
        const today = isoOf(todayDate());
        const byUser = new Map();
        list.forEach((t) => {
          if (!t.assigneeUsername) return;
          if (["done", "failed", "cancelled"].includes(t.status)) return;
          if (!byUser.has(t.assigneeUsername)) {
            byUser.set(t.assigneeUsername, { username: t.assigneeUsername, name: t.assigneeName || t.assigneeUsername, open: 0, late: 0 });
          }
          const row = byUser.get(t.assigneeUsername);
          row.open++;
          if (t.dueDate && t.dueDate < today) row.late++;
        });
        return [...byUser.values()].sort((a, b) => b.late - a.late || b.open - a.open);
      }
      // Shoshilinch — alohida qizil "!" belgi (bars emas, ustuvor darajada
      // ko'zga yaqqol tashlanishi kerak). Qolganlari — Linear uslubidagi
      // 3 ta "signal bar": daraja qancha yuqori bo'lsa, shuncha ko'p
      // ustun to'ldirilgan (rangi ham darajaga qarab: yuqori=amber,
      // o'rta=brend ko'k, past=kul rang).
      function priorityIcon(priority) {
        if (priority === "urgent") {
          return `<div class="pri-urgent" title="${escHtml(TASK_PRIORITY_LABEL.urgent)}">!</div>`;
        }
        const level = { high: 3, medium: 2, low: 1, no_priority: 0 }[priority] ?? 0;
        const color = { high: "var(--amber)", medium: "var(--brand)", low: "var(--t4)" }[priority] || "var(--sw-off)";
        const bg = "var(--sw-off)";
        const bars = [6, 9, 12]
          .map((h, i) => {
            const filled = i < level;
            return `<rect x="${i * 5}" y="${12 - h}" width="3" height="${h}" rx="1" fill="${filled ? color : bg}"></rect>`;
          })
          .join("");
        return `<svg width="13" height="12" viewBox="0 0 13 12" style="flex-shrink:0;margin-top:1px" title="${escHtml(TASK_PRIORITY_LABEL[priority] || TASK_PRIORITY_LABEL.no_priority)}">${bars}</svg>`;
      }
      function setTaskStatusChip(key) {
        taskStatusChip = key;
        renderTasksBody();
      }
      function setTaskScope(mode) {
        taskScope = mode;
        renderTasksBody();
      }
      function toggleEmployeeGroup(username) {
        if (taskEmployeeExpanded.has(username)) taskEmployeeExpanded.delete(username);
        else taskEmployeeExpanded.add(username);
        renderTasksBody();
      }
      async function renderTasksScreen() {
        // Vazifa yaratish — har qanday xodim uchun ochiq (faqat "Bajarildi"
        // deb belgilash admin uchun cheklangan, buttonlar darajasida
        // buildTaskStepperHtml'da).
        document.getElementById("tasks-fab").style.display = "flex";
        const newBtn = document.getElementById("tasks-new-btn");
        if (newBtn) newBtn.style.display = "flex";
        const body = document.getElementById("tasks-body");
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        try {
          const res = await apiFetch("/api/tasks");
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          tasksList = (await res.json()).tasks || [];
        } catch (e) {
          body.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        // Standart holat — rolga qarab: oddiy xodim avval o'ziga
        // tegishli vazifalarni ("Menda") ko'radi; admin/super admin esa
        // odatda o'ziga vazifa biriktirmaydi (u boshqalarniki bilan
        // shug'ullanadi), shuning uchun "Jamoada"dan boshlanadi. Faqat
        // BIR marta (screen birinchi ochilganda) — foydalanuvchi keyin
        // qo'lda boshqasini tanlasa, shu holatda qoladi.
        if (!taskScopeInitialized) {
          taskScopeInitialized = true;
          taskScope = isAdmin ? "jamoada" : "menda";
        }
        renderTasksBody();
      }
      // Qidiruv (nomi/xodim/tag) + "Filtr" sheet'idagi tanlovlarni qo'llaydi.
      function applyTaskFilters(list) {
        const q = (document.getElementById("tasks-search")?.value || "").toLowerCase().trim();
        let out = list;
        if (q) {
          out = out.filter((t) => {
            if (t.title.toLowerCase().includes(q)) return true;
            if (t.assigneeName && t.assigneeName.toLowerCase().includes(q)) return true;
            return (t.tags || []).some((tag) => tag.name.toLowerCase().includes(q));
          });
        }
        if (taskBoardFilter.assignee) out = out.filter((t) => t.assigneeUsername === taskBoardFilter.assignee);
        if (taskBoardFilter.priority) out = out.filter((t) => t.priority === taskBoardFilter.priority);
        if (taskBoardFilter.tag) out = out.filter((t) => (t.tags || []).some((tag) => tag.id === taskBoardFilter.tag));
        return out;
      }
      function openTasksFilterSheet() {
        const workload = computeWorkload(tasksList);
        const assigneeOptions = workload
          .map((w) => `<option value="${escArg(w.username)}"${taskBoardFilter.assignee === w.username ? " selected" : ""}>${escHtml(w.name)}</option>`)
          .join("");
        const { body } = makeSheet("Filtr");
        body.innerHTML = `
          <div class="f-group">
            <label class="f-label">Xodim</label>
            <select class="f-input" id="tf-assignee">
              <option value="">— Hammasi —</option>
              ${assigneeOptions}
            </select>
          </div>
          <div class="f-group">
            <label class="f-label">Ustuvorlik</label>
            <select class="f-input" id="tf-priority">
              <option value="">— Hammasi —</option>
              ${Object.entries(TASK_PRIORITY_LABEL)
                .map(([k, lbl]) => `<option value="${k}"${taskBoardFilter.priority === k ? " selected" : ""}>${lbl}</option>`)
                .join("")}
            </select>
          </div>
          <div class="f-group">
            <label class="f-label">Tag</label>
            <select class="f-input" id="tf-tag">
              <option value="">— Hammasi —</option>
              ${tagsList.map((t) => `<option value="${escArg(t.id)}"${taskBoardFilter.tag === t.id ? " selected" : ""}>${escHtml(t.name)}</option>`).join("")}
            </select>
          </div>
          <div class="f-row">
            <button class="btn btn-soft" onclick="clearTaskFilters()">Tozalash</button>
            <button class="btn btn-blue" onclick="applyTasksFilterSheet()">Qo'llash</button>
          </div>`;
      }
      function applyTasksFilterSheet() {
        taskBoardFilter.assignee = document.getElementById("tf-assignee")?.value || "";
        taskBoardFilter.priority = document.getElementById("tf-priority")?.value || "";
        taskBoardFilter.tag = document.getElementById("tf-tag")?.value || "";
        document.querySelector(".overlay")?.remove();
        renderTasksBody();
      }
      function clearTaskFilters() {
        taskBoardFilter = { assignee: "", priority: "", tag: "", q: "" };
        document.querySelector(".overlay")?.remove();
        renderTasksBody();
      }

      function renderTasksBody() {
        const body = document.getElementById("tasks-body");
        if (!tasksList.length) {
          body.innerHTML = `<div class="empty"><div class="empty-ico">✓</div><div class="empty-t">Vazifa yo'q</div><div class="empty-s">${isAdmin ? "Pastdagi + tugmasi orqali yangi vazifa qo'shing." : "Sizga hali vazifa biriktirilmagan."}</div></div>`;
          const sumEl = document.getElementById("tasks-summary");
          if (sumEl) sumEl.textContent = "—";
          return;
        }

        const open = tasksList.filter((t) => !["done", "failed", "cancelled"].includes(t.status));
        const late = open.filter((t) => t.dueDate && t.dueDate < isoOf(todayDate()));
        const workload = computeWorkload(tasksList);
        const sumEl = document.getElementById("tasks-summary");
        if (sumEl) sumEl.textContent = `${open.length} ochiq · ${late.length} kechikkan · ${workload.length} xodim`;

        const filtered = applyTaskFilters(tasksList);
        body.innerHTML = `${buildTasksMobileHtml(filtered, workload)}${buildTasksDesktopHtml(filtered, workload)}`;
      }

      function sortTasksForBoard(items) {
        return [...items].sort((a, b) => {
          const pr = (TASK_PRIORITY_RANK[a.priority] ?? 4) - (TASK_PRIORITY_RANK[b.priority] ?? 4);
          if (pr !== 0) return pr;
          return (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
        });
      }
      // Vazifa kartochkasi — kanban USTUNIDA ham, mobil RO'YXATDA ham
      // bir xil (bitta manba). Bajarildi/Arxiv ustunidagi kartochkalar
      // "muted" (xira) uslubda — asosiy e'tibor faol ishga qaratiladi.
      function buildTaskCardHtml(t) {
        const col = taskBoardColumn(t);
        const muted = col === "done" || col === "archive";
        const due = t.dueDate ? dueChipInfo(t.dueDate) : null;
        const critical = !muted && due && due.cls === "late";

        let icon;
        if (t.status === "done") icon = `<div class="kcard-check">✓</div>`;
        else if (t.status === "failed") icon = `<div class="kcard-fail">✕</div>`;
        else icon = priorityIcon(t.priority);

        let noteBox = "";
        if (t.status === "failed" && t.reason) {
          noteBox = `<div class="kcard-reason">Bajarilmadi · ${escHtml(t.reason)}</div>`;
        } else if (t.status === "cancelled") {
          noteBox = `<div class="kcard-reason muted">Bekor qilingan</div>`;
        } else if (t.status === "review") {
          // Kim tekshirayotgani alohida saqlanmaydi — faqat "qachondan
          // beri tekshiruvda" (oxirgi status o'zgarishi taxminan shu payt).
          const ms = t.updatedAt ? Date.now() - new Date(t.updatedAt).getTime() : null;
          const hrs = ms == null ? null : Math.max(0, Math.round(ms / 3600000));
          const elapsed = hrs == null ? "" : hrs < 24 ? ` · ${hrs} soat` : ` · ${Math.round(hrs / 24)} kun`;
          noteBox = `<div class="kcard-review">Tekshiruvda${elapsed}</div>`;
        }

        const footDate = muted
          ? `<span class="due-chip" style="color:var(--chev)">${escHtml(fmtDay(parseISO(t.completedAt || t.updatedAt || t.dueDate || isoOf(todayDate()))))}</span>`
          : due
            ? `<span class="due-chip ${due.cls}">${due.text}</span>`
            : "<span></span>";

        return `<div class="kcard${muted ? " muted" : ""}${critical ? " critical" : ""}" onclick="openTaskActions('${escArg(t.id)}')">
          <div style="display:flex;align-items:flex-start;gap:7px">
            ${icon}
            <div class="r-name" style="font-size:12.5px;flex:1;min-width:0;line-height:1.35;${muted ? "color:var(--t2);font-weight:500" : ""}">${escHtml(t.title)}</div>
            ${isAdmin ? `<span onclick="event.stopPropagation();openTaskCardMenu('${escArg(t.id)}')" style="width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--t3);font-size:13px;cursor:pointer;margin-top:-2px">⋯</span>` : ""}
          </div>
          ${renderTagChipsHtml(t.tags, muted)}
          ${noteBox}
          <div class="kcard-foot">
            ${taskAvatarHtml(t, "avatar-sm", muted) || "<span></span>"}
            <span class="r-sub" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${muted ? "color:var(--chev)" : ""}">${t.assigneeName ? `<b style="font-weight:600;${muted ? "" : "color:var(--t5)"}">${escHtml(t.assigneeName)}</b> · ` : ""}${escHtml(t.projectLabel || "Umumiy")}</span>
            ${footDate}
          </div>
        </div>`;
      }
      function buildWorkloadRowHtml(workload) {
        if (!workload.length) return "";
        const items = workload
          .map(
            (w) => `<div class="workload-item${w.late ? " warn" : ""}">
              <div class="avatar">${escHtml(w.name.slice(0, 1).toUpperCase())}</div>
              <div style="min-width:0">
                <div class="workload-name">${escHtml(w.name)}</div>
                <div class="workload-sub${w.late ? " warn" : ""}">${w.late ? w.late + " kechikkan · " : ""}${w.open} ochiq</div>
              </div>
            </div>`,
          )
          .join("");
        return `<div class="workload-row">${items}</div>`;
      }
      // Vazifalar — katta ekranda 5 ustunli doska (dizayn asosida:
      // Biriktirilgan/Jarayonda/Tekshiruvda/Bajarildi/Arxiv — taskBoardColumn()
      // orqali mavjud 7 statusning vizual guruhlanishi). "Ochiq/Barchasi"
      // — Bajarildi/Arxiv ustunlarini yashirish/ko'rsatish (faqat vizual,
      // backend so'rovi o'zgarmaydi).
      function buildTasksDesktopHtml(allTasks, workload) {
        const scoped = taskScope === "menda" ? allTasks.filter((t) => t.assigneeUsername === currentUser) : allTasks;
        const cols = taskOpenFilter === "barchasi" ? TASK_BOARD_COLUMNS : TASK_BOARD_COLUMNS.filter((c) => c.key !== "done" && c.key !== "archive");
        const colsHtml = cols
          .map((col) => {
            const items = sortTasksForBoard(scoped.filter((t) => taskBoardColumn(t) === col.key));
            // Bo'sh ustunda "Bo'sh" deb yozilmaydi — shunchaki jim turadi.
            const cards = items.map(buildTaskCardHtml).join("");
            const addBtn = col.key === "archive" ? "" : `<button class="kanban-add" onclick="openNewTaskSheet()" title="Yangi vazifa">+</button>`;
            const addRow = col.key === "archive" ? "" : `<div class="kanban-add-row" onclick="openNewTaskSheet()">+ Vazifa</div>`;
            const archiveNote = col.key === "archive" ? `<div class="kanban-archive-note">Yopilgan vazifalar 30 kundan keyin shu yerga o'tadi.</div>` : "";
            return `<div>
              <div class="kanban-col-hdr">
                <span style="display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden">
                  <span class="kanban-dot" style="${col.dot}"></span>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${col.label}</span>
                </span>
                <span style="display:flex;align-items:center;gap:4px;flex-shrink:0">
                  <span class="kanban-count">${items.length}</span>
                  ${addBtn}
                </span>
              </div>
              ${cards}
              ${addRow}
              ${archiveNote}
            </div>`;
          })
          .join("");
        return `<div class="desktop-only">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap">
            <div class="seg" style="margin-top:0;width:180px">
              <button class="seg-btn${taskScope === "menda" ? " active" : ""}" onclick="setTaskScope('menda')">Menda</button>
              <button class="seg-btn${taskScope === "jamoada" ? " active" : ""}" onclick="setTaskScope('jamoada')">Jamoada</button>
            </div>
            <div class="chip-group">
              <button class="chip-btn${taskOpenFilter === "ochiq" ? " active" : ""}" onclick="setTaskOpenFilter('ochiq')">Ochiq</button>
              <button class="chip-btn${taskOpenFilter === "barchasi" ? " active" : ""}" onclick="setTaskOpenFilter('barchasi')">Barchasi</button>
            </div>
          </div>
          ${buildWorkloadRowHtml(workload)}
          ${
            taskScope === "menda" && !scoped.length
              ? `<div class="empty"><div class="empty-ico">✓</div><div class="empty-t">Sizga biriktirilgan vazifa yo'q</div><div class="empty-s">"Jamoada" tugmasi orqali boshqa xodimlarning vazifalarini ko'rishingiz mumkin.</div></div>`
              : `<div class="kanban" style="grid-template-columns:repeat(${cols.length},1fr);margin-top:${workload.length ? "16px" : "0"}">${colsHtml}</div>`
          }
        </div>`;
      }
      function setTaskOpenFilter(v) {
        taskOpenFilter = v;
        renderTasksBody();
      }
      // Mobil: status-chip filtri + Menda/Jamoada almashtirgich (hammaga
      // ochiq). /api/tasks HAR BIR foydalanuvchiga barcha vazifalarni
      // qaytaradi (backendda scope yo'q) — "Menda" filtri shu list ustida
      // faqat frontendda qo'llanadi, "Jamoada"da esa xodim bo'yicha
      // guruhlangan ko'rinishga o'tadi.
      function buildTasksMobileHtml(allTasks, workload) {
        const chipsHtml = TASK_BOARD_COLUMNS.map((col) => {
          const count = allTasks.filter((t) => taskBoardColumn(t) === col.key).length;
          return `<button class="chip-btn${taskStatusChip === col.key ? " active" : ""}" onclick="setTaskStatusChip('${col.key}')">${col.label} ${count}</button>`;
        }).join("");
        const allChip = `<button class="chip-btn${taskStatusChip === "all" ? " active" : ""}" onclick="setTaskStatusChip('all')">Hammasi</button>`;

        // Menda/Jamoada — endi barcha xodimlarga ochiq (avval faqat
        // admin uchun edi): Vazifalar bo'limidagi barcha o'zgarishlar
        // hammaga ko'rinishi kerak degan talab bo'yicha.
        const scopeToggle = `<div class="seg" style="margin-bottom:12px">
              <button class="seg-btn${taskScope === "menda" ? " active" : ""}" onclick="setTaskScope('menda')">Menda</button>
              <button class="seg-btn${taskScope === "jamoada" ? " active" : ""}" onclick="setTaskScope('jamoada')">Jamoada</button>
            </div>`;

        let scoped = allTasks;
        if (taskScope === "menda") scoped = scoped.filter((t) => t.assigneeUsername === currentUser);

        let bodyHtml;
        if (taskScope === "jamoada") {
          bodyHtml = buildTasksByEmployeeHtml(scoped, workload);
        } else {
          const byChip = taskStatusChip === "all" ? scoped : scoped.filter((t) => taskBoardColumn(t) === taskStatusChip);
          const items = sortTasksForBoard(byChip);
          bodyHtml = items.length
            ? items.map(buildTaskCardHtml).join("")
            : `<div class="empty"><div class="empty-ico">✓</div><div class="empty-t">Vazifa yo'q</div><div class="empty-s">Filtrni o'zgartirib ko'ring.</div></div>`;
        }

        return `<div class="mobile-only">
          ${scopeToggle}
          <div class="chips" style="margin-top:0">${allChip}${chipsHtml}</div>
          <div style="margin-top:14px">${bodyHtml}</div>
        </div>`;
      }
      // Har bir ochiq vazifa uchun bitta mini-bar — holatiga qarab rangli
      // (kechikkan=qizil, jarayonda=ko'k, tekshiruvda=amber, boshqa=kul
      // rang) — xodim kartasida "kimda qancha va qay holatda" ekanini bir
      // qarashda ko'rsatadi (dizayndagi sparkline'ga mos).
      function buildEmpBarsHtml(userTasks) {
        const today = isoOf(todayDate());
        const colorFor = (t) => {
          if (t.dueDate && t.dueDate < today) return "var(--red)";
          if (t.status === "in_progress") return "var(--brand)";
          if (t.status === "review") return "var(--amber)";
          return "var(--nav-off)";
        };
        return `<div class="emp-bars">${userTasks
          .slice(0, 4)
          .map((t) => `<div class="emp-bar" style="background:${colorFor(t)}"></div>`)
          .join("")}</div>`;
      }
      // "Jamoada" — xodim bo'yicha guruhlangan, tap orqali kengaytiriladi.
      function buildTasksByEmployeeHtml(list, workload) {
        if (!workload.length) return `<div class="empty"><div class="empty-s">Hozircha hech kimga vazifa biriktirilmagan.</div></div>`;
        return workload
          .map((w) => {
            const expanded = taskEmployeeExpanded.has(w.username);
            const userTasks = sortTasksForBoard(
              list.filter((t) => t.assigneeUsername === w.username && !["done", "failed", "cancelled"].includes(t.status)),
            );
            return `<div class="list-card${w.late ? " late" : ""}" style="margin-bottom:${expanded ? "0" : "10px"}">
              <div class="list-row clickable" onclick="toggleEmployeeGroup('${escArg(w.username)}')">
                <div class="avatar">${escHtml(w.name.slice(0, 1).toUpperCase())}</div>
                <div style="flex:1;min-width:0">
                  <div class="r-name">${escHtml(w.name)}</div>
                  <div class="r-sub" style="${w.late ? "color:var(--red)" : ""}">${w.late ? w.late + " kechikkan · " : ""}${w.open} ochiq</div>
                </div>
                ${!expanded ? buildEmpBarsHtml(userTasks) : ""}
                <div class="chev">${expanded ? "⌃" : "⌄"}</div>
              </div>
            </div>
            ${expanded ? `<div style="margin:8px 0 14px">${userTasks.map(buildTaskCardHtml).join("") || `<div style="font-size:12px;color:var(--t3);padding:8px 4px">Ochiq vazifa yo'q</div>`}</div>` : ""}`;
          })
          .join("");
      }
      function taskShortRef(id) {
        return id.slice(0, 8).toUpperCase();
      }
      function splitDetail(detail) {
        const i = (detail || "").indexOf(":");
        if (i === -1) return [detail || "", ""];
        return [detail.slice(0, i), detail.slice(i + 1)];
      }
      function openTaskActions(id) {
        const t = tasksList.find((x) => x.id === id);
        if (!t) return;
        taskDetailNav = { ids: tasksList.map((x) => x.id), index: tasksList.findIndex((x) => x.id === id) };
        taskDetailTab = "comments";
        openSubScreen("screen-taskdetail", closeTaskDetailScreen);
        renderTaskDetailSheet(t);
      }
      function closeTaskDetailScreen() {
        showTab(activeTab);
      }
      function isTaskDetailScreenOpen() {
        return !!document.getElementById("screen-taskdetail")?.classList.contains("active");
      }
      // Vazifa mutatsiyasidan keyin (status, ustuvorlik, tag, muddat)
      // sahifa hali ochiq bo'lsa — yopib qo'ymasdan, yangilangan
      // ma'lumot bilan o'sha joyning o'zida qayta chiziladi.
      function refreshTaskDetailIfOpen(id) {
        if (!isTaskDetailScreenOpen()) return;
        const fresh = tasksList.find((x) => x.id === id);
        if (fresh) renderTaskDetailSheet(fresh);
      }
      function stepTaskDetail(dir) {
        const newIndex = taskDetailNav.index + dir;
        if (newIndex < 0 || newIndex >= taskDetailNav.ids.length) return;
        const t = tasksList.find((x) => x.id === taskDetailNav.ids[newIndex]);
        if (!t) return;
        taskDetailNav.index = newIndex;
        taskDetailTab = "comments";
        renderTaskDetailSheet(t);
      }
      // Muddat o'tib ketgan/bugun tugaydigan banner ostidagi izoh —
      // ishning qaysi bosqichida to'xtab qolgani.
      function taskWorkStateLabel(status) {
        if (status === "backlog" || status === "todo") return "ish hali boshlanmagan";
        if (status === "in_progress") return "ish jarayonda";
        if (status === "review") return "tekshiruvda";
        return "";
      }
      // "Keyingi qadam" bloki — 4 bosqichli vizual ko'rsatkich
      // (Biriktirilgan/Jarayonda/Tekshiruvda/Bajarildi, TASK_BOARD_COLUMNS
      // bilan bir xil guruhlash) + joriy holatdan mumkin bo'lgan amal
      // tugmalari. Bajarilmadi/Bekor qilingan — alohida (bosqichsiz).
      function buildTaskStepperHtml(t, canChangeStatus) {
        if (["failed", "cancelled"].includes(t.status)) {
          if (t.status === "failed" && t.reason) {
            return `<div class="rail-title" style="margin:0">Bajarilmagan sababi</div>
              <div style="background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px">${escHtml(t.reason)}</div>`;
          }
          return `<div class="rail-title" style="margin:0">Holat</div><div style="font-size:13px;color:var(--t3);margin-top:8px">${escHtml(TASK_STATUS_LABEL[t.status])}</div>`;
        }

        const steps = TASK_BOARD_COLUMNS.slice(0, 4); // assigned/in_progress/review/done — arxiv bu yerda kerak emas
        const curKey = taskBoardColumn(t);
        const curIdx = Math.max(0, steps.findIndex((s) => s.key === curKey));
        const stepsHtml = steps
          .map((s, i) => {
            const state = i < curIdx ? "done" : i === curIdx ? "current" : "";
            const line = i < steps.length - 1 ? `<div class="td-stepper-line${i < curIdx ? " done" : ""}"></div>` : "";
            return `<div class="td-stepper-step">
              <div class="td-stepper-dotwrap">
                <div class="td-stepper-dot${state ? " " + state : ""}"></div>
                <div class="td-stepper-lbl${state === "current" ? " current" : ""}">${s.label}</div>
              </div>
              ${line}
            </div>`;
          })
          .join("");

        let actionsHtml = "";
        if (canChangeStatus) {
          if (t.status === "backlog") {
            actionsHtml = `<button type="button" class="td-status-btn lg solid-blue" onclick="openSetDueDateForm('${escArg(t.id)}')"><span class="dot"></span>Navbatga qo'yish</button>`;
          } else if (t.status === "todo" || t.status === "in_progress") {
            const isTodo = t.status === "todo";
            const primary = isTodo
              ? `<button type="button" class="td-status-btn lg solid-blue" onclick="setTaskStatus('${escArg(t.id)}','in_progress',this)"><span class="dot"></span>Ishni boshladim</button>`
              : `<button type="button" class="td-status-btn lg solid-blue" onclick="setTaskStatus('${escArg(t.id)}','review',this)"><span class="dot"></span>Tekshiruvga yubordim</button>`;
            const secondary = [
              isAdmin
                ? `<button type="button" class="td-status-btn solid-green" onclick="setTaskStatus('${escArg(t.id)}','done',this)"><span class="dot"></span>Darhol bajarildi</button>`
                : "",
              `<button type="button" class="td-status-btn tint-red" onclick="openTaskFailForm('${escArg(t.id)}')"><span class="dot"></span>Bajarolmadim</button>`,
            ].filter(Boolean);
            actionsHtml = `${primary}<div class="td-status-row">${secondary.join("")}</div>`;
          } else if (t.status === "review") {
            if (isAdmin) {
              actionsHtml = `<button type="button" class="td-status-btn lg solid-green" onclick="setTaskStatus('${escArg(t.id)}','done',this)"><span class="dot"></span>Tasdiqlash</button>
                <div class="td-status-row">
                  <button type="button" class="td-status-btn tint-blue" onclick="setTaskStatus('${escArg(t.id)}','in_progress',this)"><span class="dot"></span>Qaytarish</button>
                  <button type="button" class="td-status-btn tint-red" onclick="openTaskFailForm('${escArg(t.id)}')"><span class="dot"></span>Bajarolmadim</button>
                </div>`;
            } else {
              actionsHtml = `<div class="f-hint" style="margin-top:2px">Vazifa tekshiruvda — admin tasdiqlashini kutmoqda.</div>`;
            }
          }
        }

        const hintHtml =
          actionsHtml && t.assigneeUsername && t.status !== "review"
            ? `<div class="td-notify-hint">Har qadam Telegram orqali <b>@${escHtml(t.assigneeUsername)}</b>ga xabar qiladi</div>`
            : "";

        return `<div class="rail-title" style="margin:0">Keyingi qadam</div>
          <div class="td-stepper">${stepsHtml}</div>
          ${actionsHtml ? `<div style="margin-top:17px">${actionsHtml}</div>` : ""}
          ${hintHtml}`;
      }
      // Vazifa detali — chapda tavsif+checklist+izoh/faoliyat, o'ngda
      // keyingi qadam va xossalar (dizayn asosida). Prev/next joriy
      // ro'yxat bo'yicha.
      function renderTaskDetailSheet(t) {
        const canChangeStatus = isAdmin || t.assigneeUsername === currentUser;
        const nav = taskDetailNav;

        const bc = document.getElementById("td-breadcrumb");
        if (bc)
          bc.innerHTML = `<span class="bc-link" onclick="showTab('tasks')">Vazifalar</span> / <span class="bc-link" onclick="showTab('tasks')">${escHtml(TASK_STATUS_LABEL[t.status])}</span> / <b>${taskShortRef(t.id)}</b>`;
        const counterEl = document.getElementById("td-counter");
        if (counterEl) counterEl.textContent = nav.index >= 0 && nav.ids.length ? `${nav.index + 1} / ${nav.ids.length}` : "";
        const prevBtn = document.getElementById("td-prev-btn");
        const nextBtn = document.getElementById("td-next-btn");
        if (prevBtn) prevBtn.disabled = nav.index <= 0;
        if (nextBtn) nextBtn.disabled = nav.index < 0 || nav.index >= nav.ids.length - 1;

        const tagsRowHtml = `<div class="kcard-tags" style="margin-top:12px">
          ${(t.tags || [])
            .map((tg) => {
              const c = tagColor(tg.name);
              return `<span class="tag-chip" style="background:${c.bg};color:${c.ink}">${escHtml(tg.name)}${isAdmin ? ` <span style="cursor:pointer" onclick="removeTaskTag('${escArg(t.id)}','${escArg(tg.id)}')">×</span>` : ""}</span>`;
            })
            .join("")}
          ${isAdmin ? `<span class="tag-chip" style="cursor:pointer;color:var(--brand)" onclick="openAddTagPicker('${escArg(t.id)}')">+ tag</span>` : ""}
        </div>`;

        const daysLeft = t.dueDate ? daysBetween(todayDate(), parseISO(t.dueDate)) : null;
        const dueText = t.dueDate
          ? `${fmtDay(parseISO(t.dueDate))}${daysLeft !== null ? ` · ${daysLeft >= 0 ? daysLeft + " kun qoldi" : Math.abs(daysLeft) + " kun o'tdi"}` : ""}`
          : "—";

        const dueInfo = t.dueDate ? dueChipInfo(t.dueDate) : null;
        const isOpenTask = !["done", "failed", "cancelled"].includes(t.status);
        const colDot = TASK_BOARD_COLUMNS.find((c) => c.key === taskBoardColumn(t))?.dot || "";
        const badgesHtml = `<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <span class="td-badge" style="background:var(--chip);color:var(--t5)"><span class="td-badge-dot" style="${colDot}"></span>${escHtml(TASK_STATUS_LABEL[t.status])}</span>
          ${t.priority === "urgent" ? `<span class="td-badge" style="background:var(--red-bg);color:var(--red)">${escHtml(TASK_PRIORITY_LABEL.urgent)}</span>` : ""}
          <div style="flex:1"></div>
          <span style="font-size:11px;color:var(--t4)">${taskShortRef(t.id)}</span>
        </div>`;

        const overdueBannerHtml =
          isOpenTask && daysLeft !== null && daysLeft <= 0
            ? `<div class="td-overdue-banner">
                <div class="td-overdue-ico">${Math.abs(daysLeft)}</div>
                <div style="flex:1;min-width:0">
                  <div class="td-overdue-title">${daysLeft === 0 ? "Muddat bugun tugaydi" : `Muddat ${Math.abs(daysLeft)} kun oldin tugagan`}</div>
                  <div class="td-overdue-sub">${fmtDay(parseISO(t.dueDate))} · ${taskWorkStateLabel(t.status)}</div>
                </div>
                ${isAdmin ? `<button type="button" class="td-overdue-btn" onclick="openPushDueDateForm('${escArg(t.id)}')">Muddatni surish</button>` : ""}
              </div>`
            : "";

        const stepperHtml = buildTaskStepperHtml(t, canChangeStatus);

        document.getElementById("td-body").innerHTML = `
          <div class="task-detail-grid two-col">
            <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
              ${overdueBannerHtml}
              <div class="td-card">
                ${badgesHtml}
                <div class="td-title">${escHtml(t.title)}</div>
                ${tagsRowHtml}
                ${t.description ? `<div style="height:1px;background:var(--bd1);margin:18px 0 16px"></div><div class="detail-desc">${escHtml(t.description)}</div>` : ""}
              </div>
              <div class="td-card">
                <div class="td-checklist" id="td-checklist"></div>
              </div>
              <div class="td-card">
                <div class="atabs" style="margin-top:0" id="td-atabs">
                  <button type="button" class="atab${taskDetailTab === "comments" ? " active" : ""}" id="td-atab-comments" onclick="setTaskDetailTab('comments')">Izohlar</button>
                  <button type="button" class="atab${taskDetailTab === "activity" ? " active" : ""}" id="td-atab-activity" onclick="setTaskDetailTab('activity')">Faoliyat</button>
                </div>
                <div class="activity-list" id="activity-list"><div style="font-size:12px;color:var(--t3)">Yuklanmoqda…</div></div>
                ${
                  canChangeStatus
                    ? `<div class="comment-composer">
                  <textarea class="f-input" id="comment-input" placeholder="Izoh yozing…"></textarea>
                  <button class="btn btn-blue" style="width:auto;padding:0 16px;flex-shrink:0" onclick="submitTaskComment('${escArg(t.id)}', this)">Yuborish</button>
                </div>`
                    : ""
                }
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px">
              ${stepperHtml ? `<div class="td-card">${stepperHtml}</div>` : ""}
              <div class="td-card">
                <div class="detail-prop-row">
                  <div class="detail-prop-label">Status</div>
                  <div class="detail-prop-val">${
                    isAdmin
                      ? `<select class="f-input" style="width:auto;padding:4px 8px;font-size:12.5px" onchange="setTaskStatus('${escArg(t.id)}', this.value)">${Object.entries(
                          TASK_STATUS_LABEL,
                        )
                          .map(([k, lbl]) => `<option value="${k}"${t.status === k ? " selected" : ""}>${lbl}</option>`)
                          .join("")}</select>`
                      : `<span class="td-badge-dot" style="${colDot};display:inline-block;margin-right:6px"></span>${escHtml(TASK_STATUS_LABEL[t.status])}`
                  }</div>
                </div>
                <div class="detail-prop-row"><div class="detail-prop-label">Mas'ul</div><div class="detail-prop-val" style="display:flex;align-items:center;gap:8px;justify-content:flex-end">${t.assigneeName ? `<div class="avatar avatar-sm">${escHtml(t.assigneeName.slice(0, 1).toUpperCase())}</div>` : ""}${escHtml(t.assigneeName || "Biriktirilmagan")}</div></div>
                <div class="detail-prop-row">
                  <div class="detail-prop-label">Ustuvorlik</div>
                  <div class="detail-prop-val">${
                    isAdmin
                      ? `<select class="f-input" style="width:auto;padding:4px 8px;font-size:12.5px" onchange="setTaskPriority('${escArg(t.id)}', this.value)">${Object.entries(
                          TASK_PRIORITY_LABEL,
                        )
                          .map(([k, lbl]) => `<option value="${k}"${t.priority === k ? " selected" : ""}>${lbl}</option>`)
                          .join("")}</select>`
                      : escHtml(TASK_PRIORITY_LABEL[t.priority])
                  }</div>
                </div>
                <div class="detail-prop-row"><div class="detail-prop-label">Muddat</div><div class="detail-prop-val"${dueInfo && dueInfo.cls === "late" && isOpenTask ? ` style="color:var(--red)"` : ""}>${dueText}</div></div>
                <div class="detail-prop-row"><div class="detail-prop-label">Loyiha</div><div class="detail-prop-val">${escHtml(t.projectLabel || "Umumiy")}</div></div>
                <div class="detail-prop-row"><div class="detail-prop-label">Biriktirdi</div><div class="detail-prop-val">${t.createdByUsername ? "@" + escHtml(t.createdByUsername) : "—"}</div></div>
                <div class="detail-prop-row"><div class="detail-prop-label">Yaratilgan</div><div class="detail-prop-val">${t.createdAt ? fmtDay(new Date(t.createdAt)) : "—"}</div></div>
              </div>
              ${
                isAdmin
                  ? `<div class="td-bottom-actions">
                    <button type="button" class="td-bottom-link" onclick="openEditTaskSheet('${escArg(t.id)}')">Tahrirlash</button>
                    <button type="button" class="td-bottom-link" onclick="duplicateTask('${escArg(t.id)}')">Nusxalash</button>
                    <div style="flex:1"></div>
                    <button type="button" class="td-bottom-link danger" onclick="deleteTask('${escArg(t.id)}','${escArg(t.title)}')">O'chirish</button>
                  </div>`
                  : ""
              }
            </div>
          </div>`;
        loadTaskActivity(t.id);
        loadTaskChecklist(t.id, canChangeStatus);
      }
      async function loadTaskActivity(id) {
        const el = document.getElementById("activity-list");
        if (!el) return;
        try {
          const res = await apiFetch(`/api/tasks/${id}/activity`);
          if (!res.ok) throw new Error();
          taskDetailActivityCache = (await res.json()).activity || [];
        } catch (e) {
          taskDetailActivityCache = null;
        }
        renderTaskDetailTabs();
      }
      // "Izohlar" (kind==='comment') va "Faoliyat" (qolgan barchasi —
      // status/ustuvorlik/muddat/mas'ul o'zgarishlari, yaratilishi) —
      // bitta so'rovdan (loadTaskActivity) kelgan ro'yxat shu yerda
      // ikkiga bo'linadi, tab almashtirishda qayta so'rov kerak emas.
      function renderTaskDetailTabs() {
        const list = document.getElementById("activity-list");
        if (!list) return;
        const commentsBtn = document.getElementById("td-atab-comments");
        const activityBtn = document.getElementById("td-atab-activity");
        if (taskDetailActivityCache === null) {
          list.innerHTML = `<div style="font-size:12px;color:var(--red)">Yuklab bo'lmadi</div>`;
          return;
        }
        const comments = taskDetailActivityCache.filter((a) => a.kind === "comment");
        const events = taskDetailActivityCache.filter((a) => a.kind !== "comment");
        if (commentsBtn) {
          commentsBtn.textContent = `Izohlar ${comments.length}`;
          commentsBtn.classList.toggle("active", taskDetailTab === "comments");
        }
        if (activityBtn) {
          activityBtn.textContent = `Faoliyat ${events.length}`;
          activityBtn.classList.toggle("active", taskDetailTab === "activity");
        }
        const shown = taskDetailTab === "comments" ? comments : events;
        list.innerHTML = shown.length
          ? shown.map(buildActivityItemHtml).join("")
          : `<div style="font-size:12px;color:var(--t3)">Hali hech narsa yo'q</div>`;
      }
      function setTaskDetailTab(tab) {
        taskDetailTab = tab;
        renderTaskDetailTabs();
      }
      // ── VAZIFA CHECKLIST — vazifa detali sahifasidagi band-band
      // tekshiruv ro'yxati (izoh qoldirish bilan bir xil ruxsat: admin
      // yoki shu vazifaning mas'uli).
      async function loadTaskChecklist(taskId, canEdit) {
        const el = document.getElementById("td-checklist");
        if (!el) return;
        try {
          const res = await apiFetch(`/api/tasks/${taskId}/checklist`);
          if (!res.ok) throw new Error();
          const { items } = await res.json();
          renderTaskChecklist(taskId, items, canEdit);
        } catch (e) {
          const target = document.getElementById("td-checklist");
          if (target) target.innerHTML = `<div style="font-size:12px;color:var(--red)">Checklist yuklab bo'lmadi</div>`;
        }
      }
      function renderTaskChecklist(taskId, items, canEdit) {
        const target = document.getElementById("td-checklist");
        if (!target) return;
        // Bandlar ham, qo'shish imkoniyati ham bo'lmasa (masalan o'zgartira
        // olmaydigan kishi ochgan bo'sh checklist) — butunlay bo'sh qoldiramiz,
        // aks holda sarlavha ostida hech narsa ko'rinmay g'alati bo'lib qolardi.
        if (!items.length && !canEdit) {
          target.innerHTML = "";
          return;
        }
        const doneCount = items.filter((it) => it.done).length;
        const pct = items.length ? Math.round((doneCount / items.length) * 100) : 0;
        const rows = items
          .map(
            (it) => `<div class="td-check-row">
              <div class="td-check-box${it.done ? " done" : ""}" ${canEdit ? `onclick="toggleChecklistItem('${escArg(taskId)}','${escArg(it.id)}',${!it.done})"` : ""}>${it.done ? "✓" : ""}</div>
              <div class="td-check-text${it.done ? " done" : ""}">${escHtml(it.text)}</div>
              ${canEdit ? `<span class="td-check-del" onclick="deleteChecklistItem('${escArg(taskId)}','${escArg(it.id)}',this)">×</span>` : ""}
            </div>`,
          )
          .join("");
        target.innerHTML = `
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">
            <div class="rail-title" style="margin:0">Checklist</div>
            ${
              items.length
                ? `<div style="font-size:11.5px;color:var(--t3)">${doneCount} / ${items.length}</div>
                  <div class="td-check-progress"><div class="td-check-progress-fill" style="width:${pct}%"></div></div>`
                : ""
            }
          </div>
          ${rows}
          ${
            canEdit
              ? `<div class="td-check-add-row">
                <input class="f-input" id="td-check-new-${escArg(taskId)}" placeholder="Yangi band qo'shish…" onkeydown="if(event.key==='Enter')addChecklistItem('${escArg(taskId)}', this.nextElementSibling)"/>
                <button class="btn btn-soft" style="width:auto;padding:0 16px;flex-shrink:0" onclick="addChecklistItem('${escArg(taskId)}', this)">+ Qo'shish</button>
              </div>`
              : ""
          }`;
      }
      async function toggleChecklistItem(taskId, itemId, done) {
        try {
          const res = await apiFetch(`/api/tasks/${taskId}/checklist/${itemId}`, {
            method: "PATCH",
            body: JSON.stringify({ done }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          await loadTaskChecklist(taskId, true);
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      async function addChecklistItem(taskId, btn) {
        const input = document.getElementById(`td-check-new-${taskId}`);
        const text = input?.value.trim();
        if (!text) return;
        setBtnLoading(btn, true);
        try {
          const res = await apiFetch(`/api/tasks/${taskId}/checklist`, {
            method: "POST",
            body: JSON.stringify({ text }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          await loadTaskChecklist(taskId, true);
        } catch (e) {
          showToast("⚠ " + e.message);
          setBtnLoading(btn, false);
        }
      }
      async function deleteChecklistItem(taskId, itemId, btn) {
        setBtnLoading(btn, true);
        try {
          const res = await apiFetch(`/api/tasks/${taskId}/checklist/${itemId}`, { method: "DELETE" });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          await loadTaskChecklist(taskId, true);
        } catch (e) {
          showToast("⚠ " + e.message);
          setBtnLoading(btn, false);
        }
      }
      function formatActivityDetail(a) {
        if (!a.detail) return a.kind === "created" ? "vazifani yaratdi" : "";
        const [oldV, newV] = splitDetail(a.detail);
        if (a.kind === "status_change") return `${TASK_STATUS_LABEL[oldV] || oldV} → ${TASK_STATUS_LABEL[newV] || newV}`;
        if (a.kind === "priority_change") return `Ustuvorlik: ${TASK_PRIORITY_LABEL[oldV] || oldV} → ${TASK_PRIORITY_LABEL[newV] || newV}`;
        if (a.kind === "deadline_change")
          return `Muddat: ${oldV ? fmtDay(parseISO(oldV)) : "—"} → ${newV ? fmtDay(parseISO(newV)) : "—"}`;
        if (a.kind === "assignment_change") return `Mas'ul: ${oldV} → ${newV}`;
        return a.detail;
      }
      // Sana + soat birgalikda — bir kunda bir nechta izoh/holat
      // o'zgarishi bo'lsa ham, qachon sodir bo'lgani aniq ko'rinishi
      // uchun (avval faqat sana ko'rsatilardi, hammasi bir xil kunda
      // "21-sentabr" bo'lib qolardi).
      function activityTimestamp(iso) {
        const d = new Date(iso);
        return `${fmtDay(d)}, ${fmtTime(d)}`;
      }
      function buildActivityItemHtml(a) {
        if (a.kind === "comment") {
          const name = a.actorName || a.actorUsername || "?";
          const c = tagColor(name);
          return `<div class="activity-item comment">
            <div class="avatar avatar-sm" style="background:${c.bg};color:${c.ink}">${escHtml(name.slice(0, 1).toUpperCase())}</div>
            <div style="flex:1;min-width:0">
              <div class="activity-comment-meta"><span class="name">${escHtml(name)}</span><span class="activity-time">${activityTimestamp(a.createdAt)}</span></div>
              <div class="activity-comment-body">${escHtml(a.body || "")}</div>
            </div>
          </div>`;
        }
        const who = a.actorUsername ? "@" + escHtml(a.actorUsername) : "Tizim";
        return `<div class="activity-item system">${who} <span class="activity-system-action">${formatActivityDetail(a)}</span><span class="activity-time">${activityTimestamp(a.createdAt)}</span></div>`;
      }
      async function submitTaskComment(id, btn) {
        const input = document.getElementById("comment-input");
        const text = input?.value.trim();
        if (!text) return;
        setBtnLoading(btn, true);
        try {
          const res = await apiFetch(`/api/tasks/${id}/comments`, { method: "POST", body: JSON.stringify({ text }) });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          if (input) input.value = "";
          await loadTaskActivity(id);
        } catch (e) {
          showToast("⚠ " + e.message);
        } finally {
          setBtnLoading(btn, false);
        }
      }
      async function removeTaskTag(taskId, tagId) {
        const t = tasksList.find((x) => x.id === taskId);
        if (!t) return;
        const newTagIds = (t.tags || []).filter((tg) => tg.id !== tagId).map((tg) => tg.id);
        await patchTaskTags(taskId, newTagIds);
      }

      // POST/PATCH /api/tasks javobidagi `notify` ({attempted, ok, reason})
      // obyektini o'qib beriladigan matnga aylantiradi — admin xabar
      // borgan-bormaganini darhol ko'radi (avval sukut bo'yicha jim
      // ketardi: xodim botni ochmagan bo'lsa ham "yaratildi" deb
      // ko'rsatilardi, muammo aniqlanmasdi).
      function describeNotifyResult(n) {
        if (!n) return "";
        if (n.ok) return " · xodimga Telegram xabari yuborildi";
        if (n.reason === "no_chat_id") return " · ⚠ xodim botni hali ochmagan, xabar yuborilmadi";
        if (n.reason === "no_assignee" || n.reason === "not_applicable" || n.reason === "no_bot_token") return "";
        return " · ⚠ Telegram xabari yuborilmadi";
      }
      async function createTask() {
        const btn = document.getElementById("nt-save-btn");
        const title = document.getElementById("nt-title")?.value.trim();
        if (!title) return showToast("⚠ Nomi kerak");
        const dueDate = document.getElementById("nt-due")?.value || "";
        if (ntStatus !== "backlog" && !dueDate) return showToast("⚠ Muddat (deadline) kerak");
        const description = document.getElementById("nt-desc")?.value.trim();
        const projectSlug = document.getElementById("nt-project")?.value || undefined;
        const assignee = document.getElementById("nt-assignee")?.value || "";
        const priority = document.getElementById("nt-priority")?.value || "no_priority";
        const notifyTelegram = document.getElementById("nt-notify")?.checked !== false;
        const body = {
          title,
          description: description || undefined,
          projectSlug,
          status: ntStatus,
          priority,
          tagIds: [...ntSelectedTagIds],
          notifyTelegram,
        };
        if (ntStatus !== "backlog") body.dueDate = dueDate;
        if (assignee.startsWith("u:")) body.assigneeUsername = assignee.slice(2);
        setBtnLoading(btn, true, "Yaratilmoqda…");
        try {
          const res = await apiFetch("/api/tasks", { method: "POST", body: JSON.stringify(body) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Xato");
          document.querySelector(".overlay")?.remove();
          const notifyNote = describeNotifyResult(data.notify);
          showToast("✅ Vazifa yaratildi" + notifyNote, notifyNote.includes("⚠") ? 4000 : 2200);
          await loadTasks();
          refreshAllViews();
        } catch (e) {
          showToast("⚠ " + e.message);
          setBtnLoading(btn, false);
        }
      }

      // ── TARIX (barcha loyihalarning davrlari) ─────────────────────

      // ── TRACKER ───────────────────────────────────────────────────
      function openTracker(id) {
        const p = projects.find((x) => x.id === id);

      function openTrackerMenu() {
        const p = projects.find((x) => x.id === trackerProjectId);
        if (!p) return;
        const { body } = makeSheet(escHtml(p.label));
        body.innerHTML = `
          <button class="btn btn-soft" style="margin-bottom:10px" onclick="document.querySelector('.overlay').remove();openProjectHistorySheet('${escArg(p.id)}','${escArg(p.label)}')">Davrlar tarixi</button>
