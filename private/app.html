      }
      function renderTracker() {
        const p = projects.find((x) => x.id === trackerProjectId);
        if (!p) return closeTracker();
        document.getElementById("trk-name").textContent = p.label;
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const today = todayDate();
        const daysLeft = projDaysLeft(p);
        document.getElementById("trk-period").textContent =
          `${MONTHS[start.getMonth()]} ${start.getFullYear()} · ${daysLeft >= 0 ? daysLeft + " kun qoldi" : "muddat tugagan"}`;

        const segK = document.getElementById("trk-seg-k");
        const segS = document.getElementById("trk-seg-s");
        segK.textContent = `Postlar ${p.doneK}/${p.k}`;
        segS.textContent = `Stories ${p.doneS}/${p.s}`;
        segK.style.display = p.k > 0 ? "flex" : "none";
        segS.style.display = p.s > 0 ? "flex" : "none";
        segK.className = "seg-btn" + (trackerType === "k" ? " active" : "");
        segS.className = "seg-btn" + (trackerType === "s" ? " active" : "");

        const count = trackerType === "k" ? p.k : p.s;
        const done = trackerType === "k" ? p.doneK : p.doneS;
        document.getElementById("trk-prog-fill").style.width = pct(done, count) + "%";

        const totalDays = daysBetween(start, end) + 1;
        let elapsedIdx = daysBetween(start, today);
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const tick = document.getElementById("trk-prog-tick");
        if (today >= start && today <= end) {
          tick.style.display = "block";
          tick.style.left =
            (totalDays > 1 ? (elapsedIdx / (totalDays - 1)) * 100 : 100) + "%";
        } else {
          tick.style.display = "none";
        }
        const expected =
          totalDays > 0 ? Math.round(((elapsedIdx + 1) / totalDays) * count) : 0;
        const delta = done - expected;
        const deltaEl = document.getElementById("trk-prog-delta");
        deltaEl.textContent = delta === 0 ? "±0" : delta > 0 ? "+" + delta : String(delta);
        deltaEl.className = "trk-prog-delta" + (delta >= 0 ? " ok" : "");

        // ── KALENDAR: faqat haqiqatda bajarilgan kunlar ─────────────
        const dayMap = buildDayMap(p, trackerType);
        const checks = p.checks || {};
        const det = p.checkDetails || {};
        const firstWeekday = (start.getDay() + 6) % 7; // Dushanba = 0
        let cells = "";
        for (let i = 0; i < firstWeekday; i++)
          cells += `<div class="cal-cell empty"></div>`;
        for (let d = 0; d < totalDays; d++) {
          const cur = new Date(start);
          cur.setDate(cur.getDate() + d);
          const key = isoOf(cur);
          const seqs = dayMap[key] || [];
          const isToday = key === isoOf(today);
          let cls = "cal-cell",
            inner;
          if (seqs.length) {
            // Shu kuni nechta chiqqan bo'lsa — o'sha son yoziladi
            cls += " done" + (isToday ? " done-today" : "");
            inner = `<div class="cn">${cur.getDate()}</div><div class="cs num">${seqs.length}</div>`;
          } else if (isToday) {
            cls += " today";
            inner = `<div class="cn">${cur.getDate()}</div><div class="cs">bugun</div>`;
          } else {
            cls += " pending";
            inner = `<div class="cn">${cur.getDate()}</div>`;
          }
          cells += `<div class="${cls}"${seqs.length ? ` title="${seqs.map((n) => (trackerType === "k" ? "Post " : "Stories ") + n).join(", ")}" onclick="openDayCell('${escArg(p.id)}','${trackerType}',[${seqs.join(",")}])"` : ""}>${inner}</div>`;
        }

        // ── BUGUN BELGILANGANLAR ────────────────────────────────────
        const todayKey = isoOf(today);
        const kToday = buildDayMap(p, "k")[todayKey] || [];
        const sToday = buildDayMap(p, "s")[todayKey] || [];
        const doneRow = (type, n, idx) => {
          const info = det[`${type}-${n}`] || {};
          const who = [info.editorName, info.videographerName]
            .filter(Boolean)
            .join(" · ");
          const label = `${idx}-${type === "k" ? "post" : "stories"}`;
          return `<div class="today-task done" onclick="openCheckModal('${escArg(p.id)}','${type}',${n})">
            <div class="today-box checked">✓</div>
            <div style="flex:1;min-width:0">
              <div class="today-lbl" style="text-decoration:none">${label}</div>
              ${who ? `<div class="r-sub">${escHtml(who)}</div>` : ""}
            </div>
            <div class="chev">›</div>
          </div>`;
        };
        let todayHtml = "";
        kToday.forEach((n, i) => (todayHtml += doneRow("k", n, i + 1)));
        sToday.forEach((n, i) => (todayHtml += doneRow("s", n, i + 1)));
        if (!todayHtml)
          todayHtml = `<div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Bugun hali hech narsa belgilanmagan</div>`;

        // ── BARCHA VAZIFALAR: 1..N alohida checkbox ─────────────────
        const typeLabel = trackerType === "k" ? "Post" : "Stories";
        let allHtml = "";
        for (let i = 1; i <= count; i++) {
          const on = !!checks[`${trackerType}-${i}`];
          allHtml += `<label class="cbi">
            <input type="checkbox" ${on ? "checked" : ""} onchange="onCheckboxToggle(event,'${escArg(p.id)}','${trackerType}',${i},this.checked)"/>
            <span class="cbi-box">${i}</span>
          </label>`;
        }

        document.getElementById("tracker-body").innerHTML = `
          <div class="cal-week">${WD.map((w) => `<span>${w}</span>`).join("")}</div>
          <div class="cal-grid">${cells}</div>
          <div class="cal-legend">
            <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--brand)"></div>bajarilgan (son = shu kuni nechta chiqqani)</div>
          </div>
          <div class="list-card" style="margin-top:16px">
            <div style="padding:11px 14px;border-bottom:1px solid var(--bd1);font-weight:600;font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase">${fmtDay(today)} · bugun belgilangan</div>
            ${todayHtml}
          </div>
          <div class="sec-upper" style="margin:20px 0 9px">Barcha ${trackerType === "k" ? "postlar" : "stories"}</div>
          <div class="list-card" style="padding:14px">
            <div class="cb-row">${allHtml}</div>
            <div class="f-hint" style="margin-top:12px">${trackerType === "k" ? "Post belgilanganda kim montaj qilgani va kim video olgani so'raladi." : "Belgilangan " + typeLabel.toLowerCase() + " bugungi kunga yoziladi — sanani o'zgartirish uchun ustiga bosing."}</div>
          </div>`;

        const railEl = document.getElementById("trk-rail");
        if (railEl) railEl.innerHTML = buildTrackerRailHtml(p);
      }

      // Muddati o'tgan (checksiz, kutilgan sanasi allaqachon o'tgan)
      // elementlar — bir tekis taqsimot asosida (xuddi trk-prog-tick
      // hisoblagani kabi, faqat har bir raqam uchun alohida).
      function findOverdueItems(p, type) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const today = todayDate();
        const totalDays = daysBetween(start, end) + 1;
        let elapsedIdx = daysBetween(start, today);
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const count = type === "k" ? p.k : p.s;
        const checks = p.checks || {};
        const items = [];
        for (let i = 1; i <= count; i++) {
          if (checks[`${type}-${i}`]) continue;
          const dueIdx =
            totalDays > 1 ? Math.round(((i - 1) / (count - 1 || 1)) * (totalDays - 1)) : 0;
          if (dueIdx <= elapsedIdx) items.push({ type, n: i, daysLate: elapsedIdx - dueIdx });
        }
        return items;
      }

      // ── TRACKER O'NG PANELI (faqat katta ekran — "MUDDAT") ─────────
      // Loyihaning haftalik hisobi — har hafta uchun REJALASHTIRILGAN son
      // (post/stories'ning chiziqli taqsimlangan "muddat" kuni asosida,
      // findOverdueItems bilan bir xil formula) va BAJARILGAN son
      // (checkDetails'dagi haqiqiy workDate asosida, buildDayMap kabi).
      function computeWeeklyProgress(p) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const totalDays = daysBetween(start, end) + 1;
        const weeks = Math.max(1, Math.min(5, Math.ceil(totalDays / 7)));
        const bounds = [];
        for (let w = 0; w < weeks; w++) {
          const s = w === 0 ? 0 : bounds[w - 1].end + 1;
          const e = Math.min(totalDays - 1, Math.round(((w + 1) / weeks) * totalDays) - 1);
          bounds.push({ start: s, end: Math.max(s, e) });
        }
        const weekOf = (idx) => {
          for (let w = 0; w < bounds.length; w++) if (idx <= bounds[w].end) return w;
          return bounds.length - 1;
        };
        const dueIdx = (i, count) =>
          totalDays > 1 ? Math.round(((i - 1) / (count - 1 || 1)) * (totalDays - 1)) : 0;

        const rows = bounds.map(() => ({ plannedK: 0, plannedS: 0, doneK: 0, doneS: 0 }));
        for (let i = 1; i <= p.k; i++) rows[weekOf(dueIdx(i, p.k))].plannedK++;
        for (let i = 1; i <= p.s; i++) rows[weekOf(dueIdx(i, p.s))].plannedS++;

        const det = p.checkDetails || {};
        const checks = p.checks || {};
        Object.keys(checks).forEach((key) => {
          if (!checks[key]) return;
          const wd = det[key] && det[key].workDate;
          if (!wd) return;
          const idx = daysBetween(start, parseISO(String(wd).slice(0, 10)));
          if (idx < 0 || idx >= totalDays) return;
          const w = weekOf(idx);
          if (key.startsWith("k-")) rows[w].doneK++;
          else if (key.startsWith("s-")) rows[w].doneS++;
        });
        return rows;
      }
      // Haftalik progress grafigi: ustun balandligi shu haftadagi umumiy
      // hajmni (post+stories), to'ldirilgan qism esa bajarilish foizini
      // bildiradi. Tafsilot hover orqali emas — ustunning o'ziga
      // bosish/tegish orqali pastdagi doimiy ko'rinadigan panelda
      // ochiladi (mobilda hover ishlamaydi, nuqtaga aniq tegish qiyin
      // edi — endi butun ustun bitta katta bosish nishoni).
      function buildWeeklyProgressHtml(p) {
        const weekly = computeWeeklyProgress(p);
        const volumes = weekly.map((r) => Math.max(r.plannedK + r.plannedS, r.doneK + r.doneS));
        const maxVolume = Math.max(1, ...volumes);

        // Standart tanlangan hafta — bugungi kun tushadigan hafta.
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const totalDays = daysBetween(start, end) + 1;
        let elapsedIdx = daysBetween(start, todayDate());
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const defaultWeek = Math.min(
          weekly.length - 1,
          Math.floor((elapsedIdx / totalDays) * weekly.length),
        );

        const barsHtml = weekly
          .map((r, w) => {
            const planned = r.plannedK + r.plannedS;
            const done = r.doneK + r.doneS;
            const fillPct = planned > 0 ? Math.min(100, Math.round((done / planned) * 100)) : done > 0 ? 100 : 0;
            const trackH = Math.max(10, Math.round((volumes[w] / maxVolume) * 52));
            return `<div class="wk-bar-col${w === defaultWeek ? " active" : ""}" onclick="showWeekDetail(this,'${escArg(p.id)}',${w})">
              <div class="wk-bar-track" style="height:${trackH}px">
                <div class="wk-bar-fill" style="height:${fillPct}%"></div>
              </div>
              <div class="wk-bar-lbl">${w + 1}-h</div>
            </div>`;
          })
          .join("");

        return `<div class="wk-bars">${barsHtml}</div>
          <div class="wk-detail" id="wk-detail">${weekDetailHtml(weekly[defaultWeek], defaultWeek)}</div>`;
      }
      function weekDetailHtml(r, w) {
        return `<div class="wk-detail-title">${w + 1}-hafta</div>
          <div class="mini-stat-row">
            <div class="mini-stat"><div class="mini-stat-val">${r.doneK}/${r.plannedK}</div><div class="mini-stat-lbl">Post</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${r.doneS}/${r.plannedS}</div><div class="mini-stat-lbl">Stories</div></div>
          </div>`;
      }
      function showWeekDetail(el, projectId, w) {
        const p = projects.find((pr) => pr.id === projectId);
        if (!p) return;
        const weekly = computeWeeklyProgress(p);
        if (!weekly[w]) return;
        el.parentElement
          .querySelectorAll(".wk-bar-col")
          .forEach((c) => c.classList.toggle("active", c === el));
        const detailEl = el.closest(".rail-card")?.querySelector("#wk-detail");
        if (detailEl) detailEl.innerHTML = weekDetailHtml(weekly[w], w);
      }

      function buildTrackerRailHtml(p) {
        const todayItems = buildTodayItems(p);
        let kTodayIdx = 0,
          sTodayIdx = 0;
        const todayHtml = todayItems.length
          ? todayItems
              .map((it) => {
                const idx = it.type === "k" ? ++kTodayIdx : ++sTodayIdx;
                const label = `${idx}-${it.type === "k" ? "post" : "stories"}`;
                return `<div class="rail-item">
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${label}</div>
                  </div>
                </div>`;
              })
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Bugun hali hech narsa belgilanmagan</div>`;

        const overdue = [...findOverdueItems(p, "k"), ...findOverdueItems(p, "s")].sort(
          (a, b) => b.daysLate - a.daysLate,
        );
        const overdueHtml = overdue.length
          ? overdue
              .slice(0, 6)
              .map(
                (it) => `<div class="rail-item">
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${it.type === "k" ? "Post" : "Stories"} ${it.n}</div>
                    <div class="r-sub" style="color:var(--red)">${it.daysLate} kun kechikdi</div>
                  </div>
                </div>`,
              )
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Kechikkan vazifa yo'q</div>`;

        const barsHtml = buildWeeklyProgressHtml(p);

        const remaining = Math.max(0, p.k + p.s - (p.doneK + p.doneS));
        const daysLeft = Math.max(1, projDaysLeft(p) + 1);
        const weeksLeft = Math.max(1, Math.ceil(daysLeft / 7));
        const weeklyNeed = Math.ceil(remaining / weeksLeft);
        const advisory =
          remaining > 0
            ? `Qolgan ${remaining} vazifa ${daysLeft} kunga taqsimlansa, haftada ~${weeklyNeed} ta yetarli.`
            : "Barcha vazifalar bajarilgan — davr yakunlanishiga tayyor.";

        const assignees = p.assignees || [];
        const assigneesHtml = assignees.length
          ? assignees
              .map((a) => {
                const name = a.fullName || (a.firstName ? `${a.firstName} ${a.lastName || ""}`.trim() : `@${a.username}`);
                return `<div class="rail-item">
                  <div class="avatar avatar-sm mute">${initials(name)}</div>
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${escHtml(name)}</div>
                  </div>
                </div>`;
              })
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Xodim biriktirilmagan</div>`;

        return `
          <div class="rail-card">
            <div class="rail-title">Mas'ul xodimlar${assignees.length ? " · " + assignees.length : ""}</div>
            ${assigneesHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">${fmtDay(todayDate())} · bugun</div>
            ${todayHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">O'tkazib yuborilgan${overdue.length ? " · " + overdue.length : ""}</div>
            ${overdueHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">Haftalik progress</div>
            ${barsHtml}
            <div class="f-hint">${advisory}</div>
          </div>`;
      }

      // Checkbox bosilishi — ikkala holatda ham (yangi belgilash yoki
      // allaqachon belgilangan itemni bosish) native checkbox holati
      // avvalgi holatiga qaytariladi va modal ochiladi: yangi belgilashda
      // kim qilgani so'raladi, mavjudini bosganda esa tafsilotlarni
      // tahrirlash yoki "Belgini olib tashlash" tugmasi bilan o'chirish
      // mumkin bo'ladi — holat faqat shu modal orqali o'zgaradi.
      function onCheckboxToggle(ev, slug, type, num, checked) {
        ev.target.checked = !checked;
        openCheckModal(slug, type, num);
      }

      // Kalendar katakchasi bosilganda — shu kunga tegishli post/stories
      // tafsilotini tahrirlash modalini ochadi. Bir kunga bir nechta
      // post/stories to'g'ri kelsa — avval qaysi biri ekanini tanlash
      // uchun kichik ro'yxat ko'rsatiladi.
      function openDayCell(slug, type, seqs) {
        if (!seqs || !seqs.length) return;
        if (seqs.length === 1) return openCheckModal(slug, type, seqs[0]);
        const label = type === "k" ? "Post" : "Stories";
        const { body } = makeSheet(`${label}lar — shu kun`);
        body.innerHTML = seqs
          .map(
            (n) =>
              `<button class="btn btn-soft" style="margin-bottom:8px" onclick="document.querySelector('.overlay').remove();openCheckModal('${escArg(slug)}','${type}',${n})">${label} ${n}</button>`,
          )
          .join("");
      }

      // ── BELGILASH MODALI (kim montaj qildi / kim video oldi) ──────
      // Post uchun ikkala select ham so'raladi; stories uchun faqat sana.
      // Tanlov ikki guruhga bo'linadi: "Loyihaga biriktirilgan" (berilgan
      // rolga ega — masalan "montajchi") va "Boshqa xodimlar" (loyihaga
      // biriktirilmagan bo'lsa ham, ishni bajargan bo'lishi mumkin —
      // masalan asosiy montajchi ishga chiqolmay qolsa, uni o'rniga
      // ishlagan boshqa xodim tanlanadi; bu Ncoin va oylik/Tabel
      // hisobotida AYNAN shu odamga tegishli bo'lib qoladi). SMM
      // menejer bunga kirmaydi — u har doim loyihaning o'z rolidan
      // avtomatik aniqlanadi, qo'lda tanlanmaydi.
      function checkPersonOptionsHtml(selectedUserId, role, assignees, directory) {
        const assigned = (assignees || []).filter((a) => a.role === role);
        const assignedIds = new Set(assigned.map((a) => a.userId));
        const assignedOpt = (a) => {
          const name = a.fullName || [a.firstName, a.lastName].filter(Boolean).join(" ") || `@${a.username}`;
          return `<option value="${escHtml(a.userId)}"${a.userId === selectedUserId ? " selected" : ""}>${escHtml(name)}</option>`;
        };
        const otherOpt = (u) => {
          const name = u.first_name ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
          const hint = u.job_title ? ` (${u.job_title})` : "";
          return `<option value="${escHtml(u.id)}"${u.id === selectedUserId ? " selected" : ""}>${escHtml(name)}${escHtml(hint)}</option>`;
        };
        const others = (directory || [])
          .filter((u) => !assignedIds.has(u.id))
          .sort((a, b) => (a.first_name || a.username).localeCompare(b.first_name || b.username));
        let html = `<option value=""${!selectedUserId ? " selected" : ""}>— tanlanmagan —</option>`;
        if (assigned.length) html += `<optgroup label="Loyihaga biriktirilgan">${assigned.map(assignedOpt).join("")}</optgroup>`;
        if (others.length) html += `<optgroup label="Boshqa xodimlar">${others.map(otherOpt).join("")}</optgroup>`;
        return html;
      }

      async function openCheckModal(slug, type, num) {
        const p = projects.find((x) => x.id === slug);
        if (!p) return;
        const key = `${type}-${num}`;
        const info = (p.checkDetails || {})[key] || {};
        const already = !!(p.checks || {})[key];
        const label = type === "k" ? "Post" : "Stories";
        const workDate = info.workDate
          ? String(info.workDate).slice(0, 10)
          : isoOf(todayDate());
        const storyKind = info.storyKind || "info";

        const { body } = makeSheet(`${label} ${num} — ${escHtml(p.label)}`);
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        let directory = [];
        try {
          const res = await apiFetch("/api/users/directory");
          if (res.ok) directory = (await res.json()).users || [];
        } catch (e) {}
        // Sheet ochiq turgan paytda foydalanuvchi yopib qo'ygan bo'lishi
        // mumkin — shu holatda endi mavjud bo'lmagan body'ga yozmaymiz.
        if (!document.body.contains(body)) return;

        const editorHtml = checkPersonOptionsHtml(info.editorUserId, "montajchi", p.assignees, directory);
        const videoHtml = checkPersonOptionsHtml(info.videographerUserId, "mobilograf", p.assignees, directory);
        const pickerPart = `
          <div class="f-group">
            <label class="f-label">Video montajini kim qildi?</label>
            <select class="f-input" id="cm-editor">${editorHtml}</select>
          </div>
          <div class="f-group">
            <label class="f-label">Videoni kim oldi?</label>
            <select class="f-input" id="cm-videographer">${videoHtml}</select>
          </div>`;

        // Stories ikki xil: "gapirib beriladigan" (faqat SMM menejerga
        // Ncoin) yoki "atmosferali" (video/montajga Ncoin, postdagi kabi
        // tanlovlar bilan). Post uchun bu tanlov shart emas — har doim
        // video+montaj ko'rsatiladi.
        const storyTypePart =
          type === "s"
            ? `<div class="f-group">
                 <label class="f-label">Stories turi</label>
                 <div class="seg" style="margin-top:0">
                   <button type="button" class="seg-btn cm-story-kind-btn${storyKind === "info" ? " active" : ""}" data-kind="info" onclick="setCheckModalStoryKind('info')">Gapirib beriladigan</button>
                   <button type="button" class="seg-btn cm-story-kind-btn${storyKind === "atmospheric" ? " active" : ""}" data-kind="atmospheric" onclick="setCheckModalStoryKind('atmospheric')">Atmosferali video</button>
                 </div>
               </div>
               <div id="cm-atmo-fields" style="display:${storyKind === "atmospheric" ? "" : "none"}">${pickerPart}</div>`
            : "";

        body.innerHTML = `
          ${type === "k" ? pickerPart : storyTypePart}
          <div class="f-group">
            <label class="f-label">Qaysi kuni chiqdi?</label>
            <input type="date" class="f-input" id="cm-date" value="${workDate}"/>
            <div class="f-hint">Kalendarda shu kun ko'k rangga o'tadi.</div>
          </div>
          <button class="btn btn-blue" id="cm-save" onclick="saveCheckModal('${escArg(slug)}','${type}',${num})">${already ? "Yangilash" : "Belgilash"}</button>
          ${
            already
              ? `<button class="btn btn-danger" style="margin-top:10px" onclick="removeCheck('${escArg(slug)}','${type}',${num})">Belgini olib tashlash</button>`
              : ""
          }`;
      }

      function setCheckModalStoryKind(kind) {
        document.querySelectorAll(".cm-story-kind-btn").forEach((b) => b.classList.toggle("active", b.dataset.kind === kind));
        const atmoFields = document.getElementById("cm-atmo-fields");
        if (atmoFields) atmoFields.style.display = kind === "atmospheric" ? "" : "none";
      }

      async function saveCheckModal(slug, type, num) {
        const btn = document.getElementById("cm-save");
        const storyKind = type === "s" ? document.querySelector(".cm-story-kind-btn.active")?.dataset.kind || "info" : undefined;
        // Video/montaj tanlovlari faqat post'da yoki "atmosferali"
        // stories'da ma'noli — boshqa holatda (masalan "gapirib
        // beriladigan" stories) hatto DOM'da qolgan eski qiymat bo'lsa
        // ham yubormaymiz.
        const showsPickers = type === "k" || storyKind === "atmospheric";
        const editorUserId = showsPickers ? document.getElementById("cm-editor")?.value || null : null;
        const videographerUserId = showsPickers ? document.getElementById("cm-videographer")?.value || null : null;
        const workDate = document.getElementById("cm-date")?.value || null;
        // Endi loyihaga biriktirilmagan xodim ham tanlanishi mumkin
        // bo'lgani sabab (butun kompaniya ro'yxati doim mavjud), tanlov
        // har doim majburiy — kim ishni bajargani Ncoin va oylik/Tabel
        // hisobotida aniq qayd etilishi shart.
        if (showsPickers) {
          if (!editorUserId) return showToast("⚠ Montaj qilgan xodimni tanlang");
          if (!videographerUserId) return showToast("⚠ Video olgan xodimni tanlang");
        }
        if (!workDate) return showToast("⚠ Sanani tanlang");
        btn.disabled = true;
        btn.textContent = "Saqlanmoqda…";
        try {
          await onCheck(slug, type, num, true, null, {
            editorUserId,
            videographerUserId,
            workDate,
            storyKind,
          });
          document.querySelector(".overlay")?.remove();
          showToast("✅ Belgilandi");
        } catch (e) {
          btn.disabled = false;
          btn.textContent = "Belgilash";
        }
      }

      async function removeCheck(slug, type, num) {
        try {
          await onCheck(slug, type, num, false);
          document.querySelector(".overlay")?.remove();
          showToast("Belgi olib tashlandi");
        } catch (e) {}
      }

      // ── YANGI LOYIHA ──────────────────────────────────────────────
      // ── YANGI LOYIHA — MODAL (sahifa emas: markazlashgan modal, orqa
      // fon qoraytiriladi — makeSheet() bilan bir xil .overlay/.sheet
      // primitividan foydalanadi, lekin header/footer maxsus bo'lgani
      // uchun o'z DOM'ini o'zi quradi). ──────────────────────────────
      let npTemplates = [];
      function npDefaultState() {
        const t = todayDate();
        return {
          label: "",
          startMode: "today", // "today" | "month1" | "custom"
          anchor: isoOf(t),
          k: 10,
          s: 15,
          assignees: [],
          notify: true,
          calMonth: t.getMonth(),
          calYear: t.getFullYear(),
          calSel: null,
          tplPanelOpen: false,
          saving: false,
          labelErr: false,
        };
      }
      function npIsDirty() {
        const d = npState;
        return !!d.label.trim() || d.assignees.length > 0 || d.k !== 10 || d.s !== 15 || d.startMode !== "today";
      }
      function onNpEscKey(e) {
        if (e.key === "Escape") requestCloseNewProject();
      }
      function openNewProjectSheet() {
        npState = npDefaultState();
        const ov = document.createElement("div");
        ov.className = "overlay";
        ov.id = "np-overlay";
        ov.onclick = (e) => {
          if (e.target === ov) requestCloseNewProject();
        };
        ov.innerHTML = `
          <div class="sheet wide" style="display:flex;flex-direction:column">
            <div class="np-ov-hdr">
              <div class="np-ov-icon">+</div>
              <div style="flex:1;min-width:0">
                <div class="np-ov-title">Yangi loyiha</div>
                <div class="np-ov-sub">Oylik kontent rejasi avtomatik yaratiladi</div>
              </div>
              <button class="sheet-close" onclick="requestCloseNewProject()">×</button>
            </div>
            <div class="np-ov-body" id="np-body"></div>
            <div class="np-ov-footer" id="np-footer"></div>
          </div>`;
        document.body.appendChild(ov);
        document.addEventListener("keydown", onNpEscKey);
        renderNewProjectForm();
        ensureNpUsersLoaded().then(() => {
          if (document.getElementById("np-overlay")) renderNewProjectForm();
        });
        loadNpTemplates();
      }
      function requestCloseNewProject() {
        if (npIsDirty()) {
          showConfirmModal(
            "Chiqishni xohlaysizmi?",
            "Kiritilgan ma'lumotlar saqlanmaydi.",
            () => closeNewProjectSheet(),
            "Ha, chiqish",
          );
        } else {
          closeNewProjectSheet();
        }
      }
      function closeNewProjectSheet() {
        document.getElementById("np-overlay")?.remove();
        document.removeEventListener("keydown", onNpEscKey);
      }
      async function ensureNpUsersLoaded() {
        try {
          const res = await apiFetch("/api/users");
          if (!res.ok) return;
          const d = await res.json();
          allUsers = (d.users || []).filter((u) => u.role === "employee" && u.is_active);
        } catch (e) {}
      }
      async function loadNpTemplates() {
        try {
          const res = await apiFetch("/api/project-templates");
          if (res.ok) npTemplates = (await res.json()).templates || [];
          if (document.getElementById("np-overlay")) renderNewProjectForm();
        } catch (e) {}
      }

      // ── Hisob davri: tez tanlash + ichki (embed) kalendar ───────────
      function npCurrentMonthLabel() {
        const t = todayDate();
        return `1-${MONTHS[t.getMonth()].toLowerCase()}`;
      }
      function npSetStartMode(mode) {
        npState.startMode = mode;
        const t = todayDate();
        if (mode === "today") npState.anchor = isoOf(t);
        else if (mode === "month1") npState.anchor = isoOf(new Date(t.getFullYear(), t.getMonth(), 1));
        else if (mode === "custom") {
          const cur = parseISO(npState.anchor);
          npState.calYear = cur.getFullYear();
          npState.calMonth = cur.getMonth();
          npState.calSel = npState.anchor;
        }
        renderNewProjectForm();
      }
      function npCalNav(delta) {
        npState.calMonth += delta;
        if (npState.calMonth < 0) {
          npState.calMonth = 11;
          npState.calYear--;
        } else if (npState.calMonth > 11) {
          npState.calMonth = 0;
          npState.calYear++;
        }
        renderNewProjectForm();
      }
      function npCalSelectDay(iso) {
        npState.calSel = iso;
        renderNewProjectForm();
      }
      function npCalConfirm() {
        if (!npState.calSel) return;
        npState.anchor = npState.calSel;
        renderNewProjectForm();
      }
      function npPeriodEnd(startIso) {
        const nextStart = jsAddMonthsClamped(startIso, 1);
        const nd = parseISO(nextStart);
        nd.setDate(nd.getDate() - 1);
        return isoOf(nd);
      }
      function npBuildCalendarHtml() {
        const cells = buildCalGridCells(npState.calYear, npState.calMonth);
        const todayIso = isoOf(todayDate());
        const dayBtns = cells
          .map((c) => {
            const cls = ["np2-cal-day"];
            if (!c.iso) cls.push("other");
            if (c.iso === todayIso) cls.push("today");
            if (c.iso && c.iso === npState.calSel) cls.push("sel");
            return `<button type="button" class="${cls.join(" ")}" ${c.iso ? `onclick="npCalSelectDay('${c.iso}')"` : "disabled"}>${c.dNum}</button>`;
          })
          .join("");
        const selLabel = npState.calSel
          ? `${fmtDay(parseISO(npState.calSel))} → ${fmtDay(parseISO(npPeriodEnd(npState.calSel)))}`
          : "Kun tanlang";
        return `
          <div class="np2-cal">
            <div class="np2-cal-hdr">
              <div class="np2-cal-title">${MONTHS[npState.calMonth]} ${npState.calYear}</div>
              <div class="np2-cal-nav">
                <button type="button" class="np2-cal-nav-btn" onclick="npCalNav(-1)">${ICON.chevronLeft}</button>
                <button type="button" class="np2-cal-nav-btn" onclick="npCalNav(1)">${ICON.chevronRight}</button>
              </div>
            </div>
            <div class="np2-cal-grid">
              ${WD.map((w) => `<div class="np2-cal-wd">${w}</div>`).join("")}
              ${dayBtns}
            </div>
            <div class="np2-cal-foot">
              <div class="np2-cal-foot-txt">Tanlangan: <b>${selLabel}</b></div>
              <button type="button" class="np2-cal-confirm" ${npState.calSel ? "" : "disabled"} onclick="npCalConfirm()">Tasdiqlash</button>
            </div>
          </div>`;
      }

      // ── Hajm: tez tanlash / qo'lda / shablondan ─────────────────────
      function npStepK(d) {
        npState.k = Math.max(0, Math.min(200, npState.k + d));
        renderNewProjectForm();
      }
      function npStepS(d) {
        npState.s = Math.max(0, Math.min(200, npState.s + d));
        renderNewProjectForm();
      }
      function npSetVolume(k, s) {
        npState.k = k;
        npState.s = s;
        npState.tplPanelOpen = false;
        renderNewProjectForm();
      }
      function npToggleTplPanel() {
        npState.tplPanelOpen = !npState.tplPanelOpen;
        renderNewProjectForm();
      }
      function npApplyTemplate(id) {
        const t = npTemplates.find((x) => x.id === id);
        if (!t) return;
        npState.k = t.postsTarget;
        npState.s = t.storiesTarget;
        npState.tplPanelOpen = false;
        renderNewProjectForm();
        showToast(`✅ "${t.name}" shabloni qo'llanildi`);
      }
      function npDeleteTemplate(id, name, ev) {
        ev.stopPropagation();
        showConfirmModal(
          `"${escHtml(name)}" shablonini o'chirish`,
          "Bu amalni bekor qilib bo'lmaydi.",
          async () => {
            try {
              const res = await apiFetch(`/api/project-templates/${id}`, { method: "DELETE" });
              if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
              npTemplates = npTemplates.filter((t) => t.id !== id);
              renderNewProjectForm();
            } catch (e) {
              showToast("⚠ " + e.message);
            }
          },
          "O'chirish",
        );
      }
      function npBuildTemplatePanelHtml() {
        if (!npTemplates.length) {
          return `<div class="np2-tpl-panel"><div style="padding:14px;font-size:12px;color:var(--t3);line-height:1.6">Hali shablon saqlanmagan. Hajmni tanlab, pastdagi "Shablon sifatida saqlash" orqali birinchisini yarating.</div></div>`;
        }
        return `<div class="np2-tpl-panel">${npTemplates
          .map(
            (t) => `<div class="np2-tpl-row" onclick="npApplyTemplate('${escArg(t.id)}')">
              <div class="np2-tpl-name">${escHtml(t.name)}</div>
              <div class="np2-tpl-meta">${t.postsTarget} post + ${t.storiesTarget} stories</div>

      // ── Preview (o'ng ustun) — real vaqtda hisoblanadi, hardcode yo'q ─
      function npBuildPreviewHtml() {
        const total = npState.k + npState.s;
        const anchor = parseISO(npState.anchor);
        const end = parseISO(npPeriodEnd(npState.anchor));
        const totalDays = daysBetween(anchor, end) + 1;
        const weeks = Math.max(1, totalDays / 7);
        const fullWeeks = Math.floor(totalDays / 7);
        const remDays = totalDays - fullWeeks * 7;
        const bars = [0, 1, 2, 3, 4]
          .map((i) => {
            let h;
            if (i < fullWeeks) h = 34;
            else if (i === fullWeeks && remDays > 0) h = Math.max(8, Math.round((remDays / 7) * 34));
            else h = 6;
            const dim = i >= fullWeeks;
            return `<div><div class="preview-bar ${dim ? "dim" : ""}" style="height:${h}px"></div><div class="preview-bar-lbl">${i + 1}-h</div></div>`;
          })
          .join("");
        const checklist = total
          ? `<div class="np2-check-list">
              <div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${npState.k} ta post vazifasi</div></div>
              <div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${npState.s} ta stories vazifasi</div></div>
              ${npState.assignees
                .map((username) => {
                  const u = allUsers.find((x) => x.username === username);
                  const name = u ? npUserDisplayName(u) : `@${username}`;
                  return `<div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${escHtml(name)}ga biriktiriladi</div></div>`;
                })
                .join("")}
            </div>`
          : "";
        return `
          <div class="preview-card">
            <div class="preview-upper">Yaratiladi</div>
            <div class="preview-title">${total} vazifa · ${fmtDay(anchor)} – ${fmtDay(end)}</div>
            <div class="preview-sub">Haftada ~${Math.round(npState.k / weeks)} post + ~${Math.round(npState.s / weeks)} stories</div>
            <div class="preview-bars">${bars}</div>
          </div>
          ${checklist}
          <div class="np2-debt-warn">Muddat <b>${fmtDay(end)}</b>. O'tib ketsa loyiha qarz ro'yxatiga tushadi.</div>`;
      }

      async function submitNewProject() {

          renderNewProjectForm();
          document.querySelector(".np2-name-input")?.focus();
          return;

              postsTarget: npState.k,
              storiesTarget: npState.s,
              assigneeUsernames: npState.assignees,
              notifyTelegram: npState.notify,
            }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(d.error || "Xato");
          await loadProjects();
          histState.loaded = false;
          try {
            const pr = await apiFetch("/api/permissions");

      // ── BOSHQARUV ─────────────────────────────────────────────────

      // ── XODIMLAR TABI ────────────────────────────────────────────

      function renderStaffTab(c) {
        const q = (document.getElementById("admin-search")?.value || "")
          .toLowerCase()
          .trim();
        const posOptions = Object.keys(POSITION_LABELS)
          .map((k) => `<option value="${k}">${POSITION_LABELS[k]}</option>`)

          .filter((s) => !q || s.fullName.toLowerCase().includes(q))

      // Botga kirish holati belgisi — uch xil aniq holat (TZ: active/
      // blocked/removed), har biri o'z rangi/matni bilan.
      function userAccessBadgeHtml(u, extraStyle) {
        const style = extraStyle || "";
        if (u.access_status === "blocked") {
          return `<span class="debt-badge" style="${style}">Bloklangan</span>`;
        }
        if (u.access_status === "removed") {
          return `<span class="debt-badge" style="background:var(--chip3);color:var(--t3);${style}">Chiqarilgan</span>`;
        }
        return "";
      }
      // Telegram orqali botga kirib profilini to'ldirgan xodimlar —
      // hech qanday qo'lda kiritish shart emas, /api/users'dan o'zi keladi.
      async function loadAndRenderTelegramStaff(q) {
        const wrap = document.getElementById("staff-tg-list");
        if (!wrap) return;
        try {
          const res = await apiFetch("/api/users");
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          allUsers = (await res.json()).users || [];
        } catch (e) {
          wrap.innerHTML = `<div style="padding:16px 14px;font-size:12px;color:var(--red)">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        // Chiqarilgan (o'chirilgan) xodimlar standart ko'rinishda
        // yashiriladi — ro'yxat faol xodimlar bilan cheklanadi. Kerak
        // bo'lsa (masalan qayta ruxsat berish uchun) pastdagi havola
        // orqali ko'rsatish mumkin.
        const removedCount = allUsers.filter((u) => u.access_status === "removed").length;
        const base = showRemovedEmployees ? allUsers : allUsers.filter((u) => u.access_status !== "removed");
        const filtered = base.filter(
          (u) =>
            !q ||
            `${u.first_name || ""} ${u.last_name || ""} ${u.username}`.toLowerCase().includes(q),
        );
        const toggleHtml =
          removedCount > 0
            ? `<div class="stat-foot" style="margin:10px 0 4px"><span class="stat-link" onclick="toggleShowRemovedEmployees()">${showRemovedEmployees ? "Chiqarilganlarni yashirish" : `Chiqarilganlar (${removedCount}) →`}</span></div>`
            : "";
        if (!filtered.length) {
          wrap.innerHTML = `<div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Hali hech kim botga kirmagan</div>${toggleHtml}`;
          return;
        }
        const mobileRows = filtered
          .map((u) => {
            const complete = !!u.first_name;
            const displayName = complete ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
            const sub = complete
              ? [u.job_title, u.phone].filter(Boolean).join(" · ") || `@${u.username}`
              : "profil hali to'ldirilmagan";
            return `<div class="list-row">
              <div class="avatar">${u.username.slice(0, 1).toUpperCase()}</div>
              <div style="flex:1;min-width:0">
                <div class="r-name">${escHtml(displayName)}</div>
                <div class="r-sub"${complete ? "" : ' style="color:var(--red)"'}>${escHtml(sub)}</div>
              </div>
              ${userAccessBadgeHtml(u)}
              <div class="m-actions-inline">
                <button class="icon-btn" onclick="openUserEditSheet('${escArg(u.username)}')">${ICON.edit}</button>
                ${isSuperAdmin && u.access_status !== "removed" ? `<button class="icon-btn danger" onclick="deleteTelegramUser('${escArg(u.username)}','${escArg(displayName)}')">${ICON.trash}</button>` : ""}
              </div>
            </div>`;
          })
          .join("");

        const desktopCards = filtered
          .map((u) => {
            const complete = !!u.first_name;
            const displayName = complete ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
            const sub = complete
              ? [u.job_title, u.phone].filter(Boolean).join(" · ") || `@${u.username}`
              : "profil hali to'ldirilmagan";
            return `<div class="pcard">
              <div class="pcard-top">
                <div class="row" style="display:flex;align-items:center;gap:9px;min-width:0">
                  <div class="avatar" style="flex-shrink:0">${u.username.slice(0, 1).toUpperCase()}</div>
                  <div class="r-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(displayName)}</div>

      async function setPermissionRole(username, projectSlug, role) {
        const prevRole = permRoles[username]?.[projectSlug] || "";
        (permRoles[username] ||= {})[projectSlug] = role || undefined;
        try {
          const res = await apiFetch("/api/permissions/role", {
            method: "PATCH",
            body: JSON.stringify({ username, projectSlug, role: role || null }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
        } catch (e) {
          showToast("⚠ " + e.message);
          if (prevRole) permRoles[username][projectSlug] = prevRole;
          else delete permRoles[username][projectSlug];
          renderPermList();

      // Toggle bosilishi bilan butun ruxsatlar xaritasi PUT qilinadi
      // (backend shartnomasi o'zgarmadi — avvalgidek to'liq xarita kutadi).
      async function togglePermission(username, projectId, btnEl) {
        const list = perms[username] || (perms[username] = []);
        const idx = list.indexOf(projectId);
        const turningOn = idx === -1;
        if (turningOn) list.push(projectId);
        else {
          list.splice(idx, 1);
          // Ruxsat o'chirilsa — roli ham (backendda qator butunlay
          // o'chgani uchun) yo'qoladi; mahalliy keshni ham tozalab
          // qo'yamiz, aks holda keyinroq qayta yoqilganda eski rol
          // vaqtincha (yangilanguncha) noto'g'ri ko'rinib turadi.
          if (permRoles[username]) delete permRoles[username][projectId];
        }
        btnEl.classList.toggle("on", turningOn);
        btnEl.textContent = turningOn ? "✓" : "";
        try {
          const res = await apiFetch("/api/permissions", {
            method: "PUT",
            body: JSON.stringify(perms),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          renderPermList();
        } catch (e) {
          showToast("⚠ " + e.message);
          const i2 = list.indexOf(projectId);
          if (turningOn && i2 !== -1) list.splice(i2, 1);
          else if (!turningOn) list.push(projectId);
          btnEl.classList.toggle("on", !turningOn);
          btnEl.textContent = !turningOn ? "✓" : "";
        }
      }

          });
          const d = await res.json();
          if (!res.ok) throw new Error(d.error || "Xato");
          inp.value = "";
          showToast(`✅ @${username} qo'shildi`);
          await loadUsersAndRenderPermList();
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      // Har bir holat uchun TZ 10-bandidagi aniq amallar:
      //   active  -> Block, Remove
      //   blocked -> Unblock/Activate, Remove
      //   removed -> Give Access
      function userAccessActionsHtml(u) {
        const status = u.access_status || (u.is_active ? "active" : "blocked");
        const dates = [
          u.access_granted_at ? `Ruxsat berilgan: ${escHtml(String(u.access_granted_at).slice(0, 10))}` : "",
          u.blocked_at ? `Bloklangan: ${escHtml(String(u.blocked_at).slice(0, 10))}` : "",
        ]
          .filter(Boolean)
          .join(" · ");
        let buttons = "";
        if (status === "active") {
          buttons = `<div class="f-row">
            <button class="btn btn-soft" onclick="setUserAccessStatus('${escArg(u.username)}','blocked')">Bloklash</button>
            <button class="btn btn-danger" onclick="setUserAccessStatus('${escArg(u.username)}','removed')">Chiqarish</button>
          </div>`;
        } else if (status === "blocked") {
          buttons = `<div class="f-row">
            <button class="btn btn-blue" onclick="setUserAccessStatus('${escArg(u.username)}','active')">Blokdan chiqarish</button>
            <button class="btn btn-danger" onclick="setUserAccessStatus('${escArg(u.username)}','removed')">Chiqarish</button>
          </div>`;
        } else {
          buttons = `<button class="btn btn-blue" onclick="setUserAccessStatus('${escArg(u.username)}','active')">Ruxsat berish</button>`;
        }
        return `<div class="f-group">
          <label class="f-label">Botga kirish holati</label>
          <div style="margin-bottom:8px">${userAccessBadgeHtml(u) || `<span class="debt-badge" style="background:var(--tagblue-bg);color:var(--tagblue)">Faol</span>`}</div>
          ${dates ? `<div class="f-hint" style="margin-bottom:8px">${dates}</div>` : ""}
          ${buttons}
        </div>`;
      }
      function openUserEditSheet(username) {
        const u = allUsers.find((x) => x.username === username);
        if (!u) return;
        const { body } = makeSheet(`@${escHtml(username)} — profil`);
        body.innerHTML = `
          <div class="f-row f-group">
            <div style="flex:1"><label class="f-label">Ism</label><input class="f-input" id="ue-first" value="${escHtml(u.first_name || "")}" onblur="formatNameInputOnBlur(this)"/></div>
            <div style="flex:1"><label class="f-label">Familiya</label><input class="f-input" id="ue-last" value="${escHtml(u.last_name || "")}" onblur="formatNameInputOnBlur(this)"/></div>
          </div>
          <div class="f-group"><label class="f-label">Telefon raqami</label><input class="f-input" id="ue-phone" value="${escHtml(u.phone || "")}" placeholder="+998 90 123 45 67" oninput="formatPhoneInput(this)"/></div>
          <div class="f-group"><label class="f-label">Lavozimi</label><input class="f-input" id="ue-job" value="${escHtml(u.job_title || "")}"/></div>
          <div class="f-group"><label class="f-label">Tug'ilgan sana</label><input class="f-input" type="date" id="ue-birth" value="${u.birth_date ? String(u.birth_date).slice(0, 10) : ""}"/></div>
          <button class="btn btn-blue" id="ue-save-btn" onclick="saveUserEdit('${escArg(username)}')" style="margin-bottom:18px">Saqlash</button>
          ${
            isSuperAdmin
              ? userAccessActionsHtml(u)
              : `<div class="f-hint">Botga kirish holatini faqat Super Admin o'zgartira oladi.</div>`
          }`;
      }
      // openUserEditSheet ikkala ekrandan ham (Boshqaruv → Xodimlar VA
      // Ruxsatlar) ochilishi mumkin — har ikkisi o'z ro'yxatini o'zi
      // yuklaydi, shuning uchun aynan qaysi biri hozir ochiqligini
      // tekshirib, o'shani yangilaymiz.
      async function refreshUsersView() {
        if (document.getElementById("perm-list")) await loadUsersAndRenderPermList();
        else if (document.getElementById("staff-tg-list")) await loadAndRenderTelegramStaff("");
      }
      // Botga kirish holatini o'zgartirish — faqat Super Admin (backend
      // ham shuni talab qiladi, bu yerda faqat UI qulayligi uchun).
      async function setUserAccessStatus(username, status) {
        try {
          const res = await apiFetch(`/api/users/${username}/access`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          document.querySelector(".overlay")?.remove();
          showToast("✅ Holat yangilandi");
          await refreshUsersView();
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      async function saveUserEdit(username) {
        const btn = document.getElementById("ue-save-btn");
        const body = {
          firstName: document.getElementById("ue-first")?.value.trim(),
          lastName: document.getElementById("ue-last")?.value.trim(),
          phone: document.getElementById("ue-phone")?.value.trim(),
          jobTitle: document.getElementById("ue-job")?.value.trim(),
          birthDate: document.getElementById("ue-birth")?.value || null,
        };
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Saqlanmoqda…";
        }
        try {
          const res = await apiFetch(`/api/users/${username}`, {
            method: "PATCH",
            body: JSON.stringify(body),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          document.querySelector(".overlay")?.remove();
          showToast("✅ Saqlandi");
          await refreshUsersView();
        } catch (e) {
          showToast("⚠ " + e.message);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Saqlash";
          }
        }
      }

      function renderAdminAdminsTab(c) {
        c.innerHTML = `
          <div style="max-width:640px">
            <div style="display:flex;gap:8px;margin-bottom:14px">
              <input class="f-input" id="new-admin-input" placeholder="@username" style="flex:1"/>
              <button class="btn btn-blue btn-sm" style="width:auto;padding:0 16px" onclick="addDynamicAdmin()">Qo'shish</button>
            </div>
            <div id="admin-list"><div class="empty"><div class="empty-s">Yuklanmoqda…</div></div></div>
          </div>`;
        refreshAdminList();
      }
      async function refreshAdminList() {
        const listEl = document.getElementById("admin-list");
        if (!listEl) return;
        try {
          const res = await apiFetch("/api/admins");
          const d = await res.json();
          const q = (document.getElementById("admin-search")?.value || "")
            .toLowerCase()
            .trim();
          const match = (u) => !q || u.toLowerCase().includes(q);
          let html = `<div class="sec-upper">Super adminlar (o'zgarmas)</div>`;
          (d.superAdmins || []).filter(match).forEach((u) => {
            html += `<div class="m-item" style="opacity:.65">
              <div class="m-item-info"><div class="m-item-label">@${escHtml(u)}</div></div>
              <span class="debt-badge" style="color:var(--brand);background:rgba(47,122,185,.12)">SUPER</span>
            </div>`;
          });
          html += `<div class="sec-upper" style="margin-top:16px">Qo'shilgan adminlar</div>`;
          const dyn = (d.dynamicAdmins || []).filter(match);
          if (!dyn.length) {
            html += `<div class="empty" style="padding:12px 0"><div class="empty-s">Hali qo'shilmagan</div></div>`;
          } else {
            dyn.forEach((u) => {
              html += `<div class="m-item">
                <div class="m-item-info"><div class="m-item-label">@${escHtml(u)}</div></div>
                <button class="btn btn-sm btn-danger" style="width:auto;padding:0 14px" onclick="removeDynamicAdmin('${escArg(u)}',this)">O'chirish</button>
              </div>`;
            });
          }
          listEl.innerHTML = html;
        } catch (e) {
          listEl.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
        }
      }
      async function addDynamicAdmin() {
        const inp = document.getElementById("new-admin-input");
        if (!inp) return;
        const username = inp.value.trim().replace("@", "");
        if (!username) {
          showToast("⚠ Username kiriting");
          return;
        }
        try {
          const res = await apiFetch("/api/admins", {
            method: "POST",
            body: JSON.stringify({ username }),
          });
          const d = await res.json();
          if (!res.ok) throw new Error(d.error || "Xato");
          inp.value = "";
          showToast(`✅ @${username} admin qilindi`);
          await refreshAdminList();
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      function removeDynamicAdmin(username, btn) {
        showConfirmModal(
          `@${escHtml(username)} ni adminlikdan olish`,
          "Bu foydalanuvchi endi Boshqaruv panelidan foydalana olmaydi.",
          async () => {
            if (btn) {
              btn.disabled = true;
              btn.textContent = "…";
            }
            try {
              const res = await apiFetch(`/api/admins/${username}`, {
                method: "DELETE",
              });
              if (!res.ok)
                throw new Error((await res.json().catch(() => ({}))).error || "Xato");
              showToast(`✅ @${username} admin emas`);
              await refreshAdminList();
            } catch (e) {
              showToast("⚠ " + e.message);
              if (btn) {
                btn.disabled = false;
                btn.textContent = "O'chirish";
              }
            }
          },
          "O'chirish",
        );
      }

      // ── NSHOP BOSHQARUVI (admin) ────────────────────────────────────
      // Mobilda — ixcham kartalar ro'yxati. Desktopda — statistika
      // kartochkalari + to'liq jadval ("Qoldiq" progress-bar
      // `stock_capacity`ga nisbatan — bu "to'liq zaxira", mahsulot
      // yaratilganda yoki qoldiq oshirilganda ko'tariladi, faqat xarid
      // kamaytirganda o'zgarmaydi) + "e'tibor talab qiladi"/"oxirgi
      // xaridlar" panellari (/api/ncoin/admin/nshop-stats).
      let nshopAdminProducts = [];
      let nshopAdminStats = null;
      let nshopAdminSearch = "";
      async function renderNShopAdminTab(c) {
        c.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        await refreshNShopAdminList(c);
      }
      async function refreshNShopAdminList(c) {
        c = c || document.getElementById("admin-body");
        if (!c) return;
        try {
          const [prodRes, statsRes] = await Promise.all([
            apiFetch("/api/ncoin/admin/products"),
            apiFetch("/api/ncoin/admin/nshop-stats"),
          ]);
          const prodData = await prodRes.json();
          if (!prodRes.ok) throw new Error(prodData.error || "Xato");
          nshopAdminProducts = prodData.products || [];
          nshopAdminStats = statsRes.ok ? await statsRes.json() : null;
        } catch (e) {
          c.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        renderNShopAdminBody(c);
      }
      function nshopAdminOnSearch(v) {
        nshopAdminSearch = v;
        renderNShopAdminBody();
      }
      function renderNShopAdminBody(c) {
        c = c || document.getElementById("admin-body");
        if (!c) return;
        const q = nshopAdminSearch.trim().toLowerCase();
        const list = nshopAdminProducts.filter((p) => !q || p.name.toLowerCase().includes(q));
        const s = nshopAdminStats;

        const mobileHtml = `<div class="mobile-only">
          <button class="btn btn-blue btn-sm" style="width:auto;padding:0 16px;margin-bottom:14px" onclick="openNShopProductSheet()">+ Mahsulot qo'shish</button>
          <div class="f-group">
            <input class="f-input" placeholder="Mahsulot qidirish" value="${escHtml(nshopAdminSearch)}" oninput="nshopAdminOnSearch(this.value)"/>
          </div>
          <div id="nshop-admin-list">${
            list.length
              ? list.map(nshopAdminMobileRowHtml).join("")
              : `<div class="empty"><div class="empty-s">Mahsulot topilmadi</div></div>`
          }</div>
        </div>`;

        const desktopHtml = `<div class="desktop-only">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
            <div style="flex:1">
              <div style="font:600 19px inherit;color:var(--ink);letter-spacing:-0.02em">NShop boshqaruvi</div>
              <div style="font-size:12px;color:var(--t2);margin-top:1px">${s ? `${s.productCount} mahsulot · ${s.totalStock} dona qoldiq · ${s.soldThisMonth} xarid` : ""}</div>
            </div>
            <div class="search-box" style="width:220px;margin-top:0">
              <div class="search-ico">${ICON.search}</div>
              <input placeholder="Mahsulot qidirish" value="${escHtml(nshopAdminSearch)}" oninput="nshopAdminOnSearch(this.value)"/>
            </div>
            <span class="stat-link" onclick="openNShopArchivedSheet()">Arxiv</span>
            <button type="button" class="btn btn-blue btn-sm" style="width:auto;padding:0 15px" onclick="openNShopProductSheet()">+ Mahsulot qo'shish</button>
          </div>
          ${s ? nshopAdminStatsGridHtml(s) : ""}
          <div class="dtbl-wrap">
            <table class="dtbl">
              <thead><tr>
                <th>Mahsulot</th><th style="width:90px">Narxi</th><th style="width:170px">Qoldiq</th><th style="width:70px">Sotildi</th><th style="width:80px">Ko'rinsin</th><th style="width:84px;text-align:right">Amal</th>
              </tr></thead>
              <tbody>${
                list.length
                  ? list.map(nshopAdminDesktopRowHtml).join("")
                  : `<tr><td colspan="6" style="text-align:center;color:var(--t3);padding:24px">Mahsulot topilmadi</td></tr>`
              }</tbody>
            </table>
          </div>
          ${s ? nshopAdminEmployeesTableHtml(s.employees) : ""}
          ${s ? nshopAdminBottomGridHtml(s) : ""}
        </div>`;

        c.innerHTML = mobileHtml + desktopHtml;
      }
      // Xodimlar qancha Ncoin ishlab topgani/sarflagani — eng ko'p
      // ishlab topgandan boshlab (jamoa faolligini bir qarashda ko'rish
      // uchun). Faqat desktopda — bu ko'proq "hisobot" xarakterli
      // ma'lumot, mobil admin ko'rinishi ataylab sodda saqlanadi.
      function nshopAdminEmployeesTableHtml(employees) {
        if (!employees) return "";
        const rows = employees.length
          ? employees
              .map(
                (e, i) => `<tr>
                  <td style="width:36px;color:var(--t3);font-variant-numeric:tabular-nums">${i + 1}</td>
                  <td class="dtbl-name">${escHtml(e.name)}${e.jobTitle ? `<div style="font-weight:400;font-size:11.5px;color:var(--t3);margin-top:1px">${escHtml(e.jobTitle)}</div>` : ""}</td>
                  <td><div style="display:flex;align-items:center;gap:5px;color:var(--green)"><span class="n-badge" style="width:16px;height:16px;font-size:9.5px;background:var(--green)">N</span>${fmtNcoin(e.earned)}</div></td>
                  <td><div style="display:flex;align-items:center;gap:5px;color:var(--t3)"><span class="n-badge" style="width:16px;height:16px;font-size:9.5px">N</span>${fmtNcoin(e.spent)}</div></td>
                  <td style="font-weight:600;color:var(--ink)">${fmtNcoin(e.balance)}</td>
                </tr>`,
              )
              .join("")
          : `<tr><td colspan="5" style="text-align:center;color:var(--t3);padding:24px">Xodim topilmadi</td></tr>`;
        return `<div class="dtbl-wrap" style="margin-top:20px">
          <div class="card-hdr"><div class="card-hdr-title">Xodimlar bo'yicha Ncoin</div></div>
          <table class="dtbl">
            <thead><tr><th>#</th><th>Xodim</th><th>Ishlab topgan</th><th>Sarflagan</th><th>Balans</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      }
      function nshopAdminStatsGridHtml(s) {
        return `<div class="stat-grid">
          <div class="stat-card">
            <div class="stat-lbl">Mahsulot turi</div>
            <div class="stat-val">${s.productCount}</div>
            <div class="stat-foot">${s.visibleCount} tasi ko'rinadi</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Umumiy qoldiq</div>
            <div class="stat-val">${s.totalStock}</div>
            <div class="stat-foot">${s.totalCapacity} tadan</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Bu oy sotildi</div>
            <div class="stat-val">${s.soldThisMonth}</div>
            <div class="stat-foot">${fmtNcoin(s.revenueThisMonth)} Ncoin</div>
          </div>
          <div class="stat-card danger">
            <div class="stat-lbl">Qoldiq kam</div>
            <div class="stat-val">${s.lowStockCount}</div>
            <div class="stat-foot">to'liq zaxiraning 25%idan kam</div>
          </div>
        </div>`;
      }
      function nshopAdminMobileRowHtml(p) {
        return `<div class="m-item">
          <div class="m-item-info">
            <div class="m-item-label">${escHtml(p.name)}</div>
            <div class="f-hint" style="margin:2px 0 0">🪙 ${fmtNcoin(p.price)} · qoldiq ${p.stock}/${p.stock_capacity} · ${p.sold_count} sotildi · ${p.is_visible ? "Ko'rinadi" : "Yashirilgan"}</div>
          </div>
          <button type="button" class="icon-btn" onclick="openNShopProductMenu('${escArg(p.id)}')">⋯</button>
          <button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 12px" onclick="toggleNShopVisible('${escArg(p.id)}',${p.is_visible})">${p.is_visible ? "Yashirish" : "Ko'rsatish"}</button>
          <button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 12px" onclick="openNShopProductSheet('${escArg(p.id)}')">Tahrirlash</button>
        </div>`;
      }
      function nshopAdminDesktopRowHtml(p) {
        const cap = p.stock_capacity || 0;
        const pct = cap > 0 ? Math.max(0, Math.min(100, Math.round((p.stock / cap) * 100))) : 0;
        return `<tr id="nshop-row-${p.id}"${p.is_visible ? "" : ' style="background:var(--surf2)"'}>
          <td>
            <div style="display:flex;align-items:center;gap:13px">
              ${nshopThumbHtml(p.image_url, "width:44px;height:44px;border-radius:11px")}
              <div>
                <div class="dtbl-name"${p.is_visible ? "" : ' style="color:var(--t2)"'}>${escHtml(p.name)}</div>
                <div style="font-size:11.5px;color:var(--t3);margin-top:2px">${p.is_visible ? "Ko'rinadi" : "Yashirilgan"}</div>
              </div>
            </div>
          </td>
          <td><div style="display:flex;align-items:center;gap:5px"><span class="n-badge" style="width:18px;height:18px;font-size:11px">N</span>${fmtNcoin(p.price)}</div></td>
          <td>
            <div class="dtbl-bar-wrap">
              <div class="hist-track"><div class="hist-fill" style="width:${pct}%;background:${p.is_visible ? "var(--brand)" : "var(--amber)"}"></div></div>
              <span style="font-size:12.5px;color:var(--t5);white-space:nowrap">${p.stock}/${cap}</span>
            </div>
          </td>
          <td>${p.sold_count}</td>
          <td><button type="button" class="tglsw brand ${p.is_visible ? "on" : ""}" onclick="toggleNShopVisible('${escArg(p.id)}',${p.is_visible})"><div class="knob"></div></button></td>
          <td style="text-align:right">
            <div style="display:flex;gap:6px;justify-content:flex-end">
              <button type="button" class="icon-btn" onclick="openNShopProductSheet('${escArg(p.id)}')" title="Tahrirlash">✎</button>
              <button type="button" class="icon-btn" onclick="openNShopProductMenu('${escArg(p.id)}')" title="Ko'proq">⋯</button>
            </div>
          </td>
        </tr>`;
      }
      function nshopAdminBottomGridHtml(s) {
        const alertsHtml = s.lowStock.length
          ? s.lowStock
              .map((p) => {
                const urgent = !p.isVisible;
                const desc = urgent
                  ? `${p.stock} ta qoldi · hozir yashirilgan`
                  : `${p.stock} ta qoldi · ${p.weeklySales > 0 ? `haftada ~${p.weeklySales} sotiladi` : "kam sotilmoqda"}`;
                const actionHtml = urgent
                  ? `<button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 14px;flex:none" onclick="promptAddStock('${escArg(p.id)}','${escArg(p.name)}')">Qoldiq qo'shish</button>`
                  : `<button type="button" class="btn btn-sm btn-soft" style="width:auto;padding:0 14px;flex:none" onclick="scrollToNShopProduct('${escArg(p.id)}')">Ko'rish</button>`;
                return `<div style="display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid ${urgent ? "var(--red-bd)" : "var(--bd2)"};border-radius:11px;${urgent ? "background:var(--red-tint)" : ""}">
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:600;font-size:13px;color:var(--ink)">${escHtml(p.name)}</div>
                    <div style="font-size:11.5px;color:var(--t2);margin-top:2px">${desc}</div>
                  </div>
                  ${actionHtml}
                </div>`;
              })
              .join("")
          : `<div class="f-hint" style="padding:6px 0">Hammasi yetarli — kam qoldiq yo'q ✅</div>`;
        const activityHtml = s.recentActivity.length
          ? s.recentActivity
              .map((t) => {
                const positive = t.amount > 0;
                const isStory = positive && NCOIN_STORY_REASONS.has(t.reason);
                const amtColor = !positive ? "var(--red)" : isStory ? "var(--purple)" : "#16a34a";
                const reasonLabel = NCOIN_REASON_LABEL[t.reason] || t.reason;
                const detailText = t.detail ? `${reasonLabel} — ${t.detail}` : reasonLabel;
                return `<div class="nshop-purchase-row">
                  <div class="avatar mute" style="width:28px;height:28px;border-radius:9px;font-size:11px">${escHtml((t.userName || "?").slice(0, 1).toUpperCase())}</div>
                  <div style="flex:1;min-width:0;font-size:12.5px;color:var(--t5)"><b style="color:var(--ink);font-weight:600">${escHtml(t.userName)}</b> · ${escHtml(detailText)}</div>
                  <div style="font-size:11px;color:var(--t4);flex:none">${nshopPurchaseTimeLabel(t.createdAt)}</div>
                  <div class="nshop-purchase-amt" style="width:48px;text-align:right;flex:none;color:${amtColor}">${positive ? "+" : "−"}${fmtNcoin(Math.abs(t.amount))}</div>
                </div>`;
              })
              .join("")
          : `<div class="nshop-purchase-row"><div class="f-hint" style="margin:0">Hali harakat bo'lmagan</div></div>`;
        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
          <div class="rail-card" style="margin-bottom:0;border-color:var(--red-bd)">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
              <span style="width:7px;height:7px;border-radius:99px;background:var(--red);flex:none"></span>
              <div class="rail-title" style="margin:0;flex:1">E'tibor talab qiladi</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px">${alertsHtml}</div>
          </div>
          <div class="nshop-panel">
            <div class="nshop-panel-hdr"><div class="nshop-panel-title">Oxirgi harakatlar</div></div>
            ${activityHtml}
          </div>
        </div>`;
      }
      function nshopPurchaseTimeLabel(iso) {
        const d = new Date(iso);

      function removeNpImage() {
        npImageUrl = null;
        document.getElementById("np-image-preview").innerHTML = npImagePreviewInner(null);
        document.getElementById("np-image-hint").textContent = "Yuklash uchun bosing (4MB gacha)";

      function handleNpImageSelect(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        if (file.size > 4 * 1024 * 1024) {
          showToast("⚠ Rasm hajmi 4MB dan oshmasligi kerak");
          input.value = "";
          return;
        }
        if (!/^image\/(png|jpeg|jpg|webp|gif)$/.test(file.type)) {
          showToast("⚠ Faqat PNG/JPEG/WEBP/GIF rasm qabul qilinadi");
          input.value = "";
          return;
        }
        const preview = document.getElementById("np-image-preview");
        const hint = document.getElementById("np-image-hint");
        const reader = new FileReader();
        reader.onload = async () => {
          const dataUrl = reader.result;
          preview.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;opacity:.5"/><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15);color:#fff"><span class="spinner"></span></div>`;
          hint.textContent = "Yuklanmoqda…";
          try {
            const res = await apiFetch("/api/ncoin/admin/upload-image", {
              method: "POST",
              body: JSON.stringify({ imageBase64: dataUrl }),
            });
            const d = await res.json();
            if (!res.ok) throw new Error(d.error || "Xato");
            npImageUrl = d.url;
            preview.innerHTML = npImagePreviewInner(npImageUrl);
            hint.textContent = "O'zgartirish uchun bosing";
            if (!document.getElementById("np-image-remove")) {
              hint.insertAdjacentHTML(
                "afterend",
                `<span id="np-image-remove" class="stat-link" style="font-size:12px;margin-top:6px;display:inline-block" onclick="removeNpImage()">Rasmni olib tashlash</span>`,
              );
            }
          } catch (e) {
            showToast("⚠ Rasm yuklanmadi: " + e.message);
            preview.innerHTML = npImagePreviewInner(npImageUrl);
            hint.textContent = npImageUrl ? "O'zgartirish uchun bosing" : "Yuklash uchun bosing (4MB gacha)";
          }
        };
        reader.readAsDataURL(file);
      }
      async function saveNShopProduct(productId) {

      // ── E'LON (faqat super admin) ─────────────────────────────────

      // Matn maydonidagi yozilayotgan xabar yo'qolib qolmasin deb, qayta

      function renderAnnouncementBody(c) {
        const prevMessage = document.getElementById("announcement-message")?.value || "";
        const userRowsHtml = announcementUsersList.length
          ? announcementUsersList
              .map((u) => {
                const name = u.first_name ? `${u.first_name} ${u.last_name || ""}`.trim() : u.full_name || `@${u.username}`;

      function announcementSendLabel() {
        if (announcementMode === "all") return "Barchaga yuborish";
        return announcementSelected.size ? `${announcementSelected.size} kishiga yuborish` : "Xodim tanlang";

      // Checkbox bosilganda butun panelni qayta chizmaydi (ro'yxat scroll
      // holati va matn maydoni buzilmasin deb) — faqat sanoq va tugma
      // matnlarini yangilaydi.
      function toggleAnnouncementUser(username, checked) {
        if (checked) announcementSelected.add(username);
        else announcementSelected.delete(username);
        updateAnnouncementCounters();
      }
      function toggleAllAnnouncementUsers() {
        const allSelected = announcementSelected.size === announcementUsersList.length && announcementUsersList.length > 0;

        else announcementUsersList.forEach((u) => announcementSelected.add(u.username));
        document.querySelectorAll(".announcement-user-cb").forEach((cb) => {

      async function sendAnnouncement() {
        const input = document.getElementById("announcement-message");

        const doneLabel = announcementSendLabel();
        button.disabled = true;
        button.textContent = "Yuborilmoqda...";
        try {
          const body = { message };
          if (announcementMode === "selected") body.usernames = [...announcementSelected];
          const response = await apiFetch("/api/announcements", {
            method: "POST",
            body: JSON.stringify(body),

          input.value = "";
          showToast(`✅ ${data.sent}/${data.total} foydalanuvchiga yuborildi`);

      function makeSheet(title, opts = {}) {

          const [meRes, ncoinRes] = await Promise.all([
            apiFetch("/api/me"),
            apiFetch("/api/ncoin/me"),

          if (!meRes.ok) throw new Error((await meRes.json().catch(() => ({}))).error || "Xato");
          myProfile = (await meRes.json()).user;
          pfNcoinData = ncoinRes.ok ? await ncoinRes.json() : null;
        } catch (e) {
          c.innerHTML = `<div style="color:var(--red);font-size:12px;padding:16px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        if (!myActivity) await loadMyActivity();

      function closeProfilePage() {

      // Faqat shu foydalanuvchiga biriktirilgan (rolidan qat'i nazar)
      // vazifalar — Panelning "Biriktirilgan vazifalar" kartasidan farqli
      // (u yerda admin uchun BARCHA vazifalar ko'rsatiladi).
      function pfComputeTaskSummary() {
        const username = myProfile?.username || currentUser;
        const today = isoOf(todayDate());
        const scope = tasksList.filter(
          (t) => t.assigneeUsername === username && taskBoardColumn(t) !== "archive",
        );
        const total = scope.length;
        const inProgress = scope.filter((t) => ["in_progress", "review"].includes(t.status)).length;
        const done = scope.filter((t) => t.status === "done").length;
        const overdue = scope.filter(
          (t) => t.dueDate && t.dueDate < today && !["done", "cancelled"].includes(t.status),
        ).length;
        return { total, inProgress, done, overdue, pct: pct(done, total) };
      }

      function pfTenureText() {
        if (!myActivity?.user?.joinedAt) return "";
        const joined = parseISO(isoOf(new Date(myActivity.user.joinedAt)));
        const days = Math.max(0, daysBetween(joined, todayDate())) + 1;
        return `Jamoada ${tenureLabel(days)}dan beri`;
      }

                    <div><label class="f-label">Ism</label><input class="f-input" id="pf-first" value="${escHtml(p.firstName || "")}" onblur="formatNameInputOnBlur(this)" oninput="pfCheckDirty()"/></div>
                    <div><label class="f-label">Familiya</label><input class="f-input" id="pf-last" value="${escHtml(p.lastName || "")}" onblur="formatNameInputOnBlur(this)" oninput="pfCheckDirty()"/></div>

                <div style="flex:1;position:relative">
