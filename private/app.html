        height: 9px;
        border-radius: 99px;
        background: var(--bd4);
      }
      .td-stepper-dot.done {
        background: var(--brand);
      }
      .td-stepper-dot.current {
        width: 13px;
        height: 13px;
        background: var(--brand);
        box-shadow: 0 0 0 4px rgba(47, 122, 185, 0.16);
      }
      .td-stepper-lbl {
        font-size: 10.5px;
        color: var(--t3);
        white-space: nowrap;
      }
      .td-stepper-lbl.current {
        color: var(--brand);
        font-weight: 600;
      }
      .td-stepper-line {
        flex: 1;
        height: 2px;
        background: var(--bd4);
        margin: 0 6px 17px;
      }
      .td-stepper-line.done {
        background: var(--brand);
      }
      .td-status-btn.lg {
        height: 50px;
        border-radius: 13px;
        font-size: 14.5px;
      }
      .td-status-btn.solid-blue {
        background: var(--brand);
        color: #fff;
      }
      .td-status-btn.solid-blue .dot {
        background: rgba(255, 255, 255, 0.85);
      }
      .td-status-row {
        display: flex;
        gap: 8px;
        margin-top: 9px;
        flex-wrap: wrap;
      }
      .td-status-row .td-status-btn {
        width: auto;
        flex: 1;
        min-width: 120px;
      }
      .td-notify-hint {
        font-size: 11px;
        line-height: 1.55;
        color: var(--t4);
        margin-top: 11px;
      }
      .td-notify-hint b {
        font-weight: 600;
        color: var(--t2);
      }
      .td-bottom-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 4px;
      }
      .td-bottom-link {
        font-size: 12px;
        font-weight: 500;
        color: var(--t2);
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
      }
      .td-bottom-link.danger {
        color: var(--t3);
      }
      .td-bottom-link.danger:hover {
        color: var(--red);
      }

      /* ── TARIX ──────────────────────────────────────────────────── */
      .hist-card {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        margin-bottom: 8px;
        overflow: hidden;
      }
      .hist-head {
        padding: 13px 15px;
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
      }
      .hist-name {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .hist-date {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 2px;
      }
      .hist-pct {
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
      }
      .hist-status {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .hist-status.active {
        background: rgba(47, 122, 185, 0.12);
        color: var(--brand);
      }
      .hist-status.debt {
        background: var(--red-bg);
        color: var(--red);
      }
      .hist-status.done {
        background: var(--chip2);
        color: var(--t5);
      }
      .hist-body {
        display: none;
        padding: 0 15px 14px;
      }
      .hist-card.open .hist-body {
        display: block;
      }
      .hist-card.open .c-chev {
        transform: rotate(180deg);
      }
      .hist-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 11.5px;
        color: var(--t2);
        margin-bottom: 8px;
      }
      .hist-track {
        height: 5px;
        border-radius: 99px;
        background: var(--chip3);
        overflow: hidden;
      }
      .hist-fill {
        height: 100%;
        background: var(--brand);
      }
      .hist-assignees {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 9px;
        line-height: 1.5;
      }
      .sel {
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--bd4);
        background: var(--surf);
        color: var(--t5);
        font-size: 12.5px;
        padding: 0 10px;
        outline: none;
      }

      /* ── SHEET / MODAL ──────────────────────────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 800;
        background: rgba(15, 23, 42, 0.45);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: 100%;
        max-width: 520px;
        max-height: 86vh;
        background: var(--surf);
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--bd4);
        margin: 10px auto 4px;
        flex-shrink: 0;
      }
      .sheet-hdr {
        padding: 10px 20px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--bd1);
        flex-shrink: 0;
      }
      .sheet-title {
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        min-width: 0;
      }
      .sheet-close {
        width: 28px;
        height: 28px;
        border-radius: 99px;
        background: var(--chip);
        border: none;
        font-size: 15px;
        color: var(--t2);
        cursor: pointer;
        flex-shrink: 0;
      }
      .sheet-body {
        padding: 16px 20px 24px;
        overflow-y: auto;
      }
      .f-group {
        margin-bottom: 14px;
      }
      .f-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--t3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 7px;
      }
      .f-input {
        width: 100%;
        height: 44px;
        border: 1px solid var(--bd4);
        border-radius: 11px;
        padding: 0 13px;
        font-size: 14px;
        color: var(--ink);
        background: var(--surf);
        outline: none;
      }
      .f-input:focus {
        border-color: var(--brand);
      }
      textarea.f-input {
        height: auto;
        padding: 12px 13px;
        line-height: 1.6;
        resize: vertical;
      }
      .f-row {
        display: flex;
        gap: 10px;
      }
      .f-hint {
        font-size: 11px;
        color: var(--t3);
        margin-top: 6px;
        line-height: 1.6;
      }
      .announcement-user-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--bd1);
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
      }
      .announcement-user-row:last-child {
        border-bottom: none;
      }
      .announcement-user-row input {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        accent-color: var(--brand);
      }
      .btn {
        width: 100%;
        height: 46px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      .btn-blue {
        background: var(--brand);
        color: #fff;
      }
      .btn-blue:disabled {
        opacity: 0.55;
      }
      .btn-soft {
        background: var(--chip);
        color: var(--t5);
      }
      .btn-sm {
        height: 38px;
        font-size: 12.5px;
      }
      .btn-danger {
        background: var(--red-bg);
        color: var(--red);
      }
      .btn-soft:disabled,
      .btn-danger:disabled {
        opacity: 0.55;
      }
      /* Tugma bosilganda ko'rsatiladigan "aylana" (spinner) — currentColor
         ishlatilgani uchun har qanday tugma rangiga (ko'k/qizil/yashil/
         neytral) avtomatik moslashadi, alohida variant kerak emas. */
      .spinner {
        display: inline-block;
        width: 13px;
        height: 13px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: btn-spin 0.6s linear infinite;
        vertical-align: -2px;
        opacity: 0.85;
      }
      @keyframes btn-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .cycle-item {
        border: 1px solid var(--bd2);
        border-radius: 12px;
        margin-bottom: 8px;
        overflow: hidden;
        background: var(--surf);
      }
      .cycle-item-top {
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
      }
      .cycle-item-label {
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
      }
      .cycle-item-sub {
        font-size: 11px;
        color: var(--t2);
        margin-top: 2px;
      }
      .cycle-item.debt .cycle-item-sub {
        color: var(--red);
      }
      .cycle-item-body {
        display: none;
        padding: 0 14px 14px;
      }
      .cycle-item.open .cycle-item-body {
        display: block;
      }
      .cycle-item.open .c-chev {
        transform: rotate(180deg);
      }
      .cb-section {
        margin-top: 12px;
      }
      .cb-head {
        margin-bottom: 8px;
      }
      .cb-badge {
        font-size: 10.5px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--chip2);
        color: var(--ink);
      }
      .c-chev {
        font-size: 12px;
        color: var(--chev);
        transition: transform 0.2s;
        flex-shrink: 0;
      }
      .perm-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ptag {
        border: 1px solid var(--bd4);
        background: var(--surf);
        color: var(--t5);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
      }
      .ptag.on {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .hidden-native {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
      }

      /* ── SANA TANLAGICH (custom calendar popover) — brauzer nativ
         input[type=date] o'rniga, dizayn tizimiga mos ────────────────── */
      .date-field {
        width: 100%;
        height: 44px;
        border: 1px solid var(--bd4);
        border-radius: 11px;
        padding: 0 13px;
        font-size: 14px;
        color: var(--ink);
        background: var(--surf);
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
      }
      .date-field:hover {
        border-color: var(--brand);
      }
      .date-field.placeholder {
        color: var(--t4);
      }
      .date-field-ico {
        width: 16px;
        height: 16px;
        color: var(--t3);
        flex-shrink: 0;
      }
      .date-field-ico svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .datepicker-pop {
        position: fixed;
        z-index: 850;
        width: 280px;
        background: var(--surf);
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18), 0 2px 8px rgba(15, 23, 42, 0.08);
        border: 1px solid var(--bd2);
        padding: 14px;
      }
      .dp-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .dp-hdr-label {
        font-weight: 600;
        font-size: 13.5px;
        color: var(--ink);
      }
      .dp-nav-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: none;
        background: var(--chip);
        color: var(--t2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .dp-nav-btn svg {
        width: 13px;
        height: 13px;
      }
      .dp-nav-btn:hover {
        background: var(--chip2);
      }
      .dp-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        margin-bottom: 2px;
      }
      .dp-weekday {
        text-align: center;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--t4);
        padding: 4px 0;
      }
      .dp-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .dp-day {
        height: 32px;
        border-radius: 8px;
        border: none;
        background: none;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dp-day:hover {
        background: var(--chip);
      }
      .dp-day:disabled {
        cursor: default;
        opacity: 0.4;
      }
      .dp-day.other-month {
        color: var(--chev);
      }
      .dp-day.today {
        box-shadow: inset 0 0 0 1.5px var(--brand);
      }
      .dp-day.selected {
        background: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      .dp-footer {
        display: flex;
        justify-content: center;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--bd1);
      }
      .dp-today-btn {
        font-size: 12px;
        font-weight: 600;
        color: var(--brand);
        background: none;
        border: none;
        cursor: pointer;
      }

      /* ── KATTA EKRAN (Telegram Desktop) ──────────────────────────
         Dizayn tizimi (ranglar, komponentlar) o'zgarmaydi — desktop
         dizaynerdan kelgan yo'nalishga mos: doimiy chap navigatsiya
         (Bottom Nav o'rniga), Boshqaruv/Tracker/Ruxsatlar kengroq
         joy — jadval va yonma-yon panellar bilan. 860px'dan pastda
         hech narsa o'zgarmaydi (mobil bir xilligicha qoladi). */
      .desktop-only {
        display: none !important;
      }
      .desktop-flex {
        display: none !important;
      }
      #sidebar {
        display: none;
      }
      @media (min-width: 860px) {
        body {
          display: block;
        }
        .desktop-only {
          display: block !important;
        }
        .desktop-flex {
          display: flex !important;
        }
        .mobile-only {
          display: none !important;
        }
        #bottom-nav {
          display: none;
        }
        .overlay {
          align-items: center;
        }
        .sheet {
          border-radius: 20px;
          max-height: 80vh;
        }
        .sheet.wide {
          max-width: 920px;
        }
        .sheet-handle {
          /* Pastdan tortib yopish ishorasi — faqat mobil bottom-sheet
             uchun ma'noli. Desktopda sheet markazlashgan modal bo'lgani
             uchun bu chiziqcha hech narsani anglatmaydi. */
          display: none;
        }
        .sheet-hdr {
          /* Chiziqcha olib tashlangach sarlavha tepaga juda yaqinlashib
             qolmasligi uchun bo'shliq bir oz kattalashtiriladi. */
          padding-top: 20px;
        }

        /* ── Chap sidebar ─────────────────────────────────────────── */
        #sidebar {
          display: flex;
          flex-direction: column;
          width: 224px;
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          background: var(--surf);
          border-right: 1px solid var(--bd2);
          padding: calc(16px + var(--tg-safe-top)) 12px 16px;
          font-family: Onest, "Sora", -apple-system, sans-serif;
          z-index: 100;
          transition: width 0.22s ease;
        }
        .sb-toggle {
          position: absolute;
          top: calc(22px + var(--tg-safe-top));
          right: -12px;
          width: 24px;
          height: 24px;
          border-radius: 50%;
          background: var(--surf);
          border: 1px solid var(--bd2);
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: var(--t3);
          box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
          z-index: 101;
          padding: 0;
          transition: background 0.15s ease, color 0.15s ease;
        }
        .sb-toggle:hover {
          background: var(--chip);
          color: var(--ink);
        }
        .sb-toggle svg {
          width: 14px;
          height: 14px;
          display: block;
          transition: transform 0.22s ease;
        }
        .sb-brand {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 2px 8px 18px;
        }
        .sb-brand-text,
        .sb-user-text {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-mark {
          width: 32px;
          height: 32px;
          border-radius: 11px;
          background: var(--brand);
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 600;
          font-size: 13px;
          flex-shrink: 0;
        }
        .sb-brand-name {
          font-weight: 600;
          font-size: 14px;
          color: var(--ink);
        }
        .sb-brand-sub {
          font-size: 11.5px;
          color: var(--nav-muted);
        }
        .sb-nav {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .sb-item {
          display: flex;
          align-items: center;
          gap: 11px;
          height: 38px;
          padding: 0 10px;
          border-radius: 10px;
          border: none;
          background: none;
          cursor: pointer;
          font-size: 13.5px;
          font-weight: 500;
          color: var(--nav-ink);
          text-align: left;
          font-family: inherit;
        }
        .sb-item .sb-ico {
          width: 19px;
          height: 19px;
          /* Dizaynda ikonka matn bilan bir xil rangda (currentColor). */
          color: inherit;
          flex-shrink: 0;
        }
        .sb-item .sb-ico svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        .sb-item .sb-lbl {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-item .sb-count {
          height: 20px;
          padding: 0 8px;
          border-radius: 7px;
          background: var(--nav-badge-bg);
          color: var(--nav-badge-ink);
          font-size: 11px;
          font-weight: 600;
          display: inline-flex;
          align-items: center;
          flex: none;
          transition: opacity 0.12s ease;
        }
        .sb-item .sb-count.danger {
          color: var(--red);
          background: var(--red-bg);
          padding: 2px 7px;
          border-radius: 99px;
          font-weight: 700;
        }
        .sb-item.active {
          background: var(--nav-act-bg);
          color: var(--nav-act-ink);
          font-weight: 600;
        }
        .sb-item.active .sb-ico {
          color: var(--nav-act-ink);
        }
        /* Qoida <svg>ning O'ZIGA yozilishi shart: elementdagi
           stroke-width atributi merosdan ustun turadi. */
        .sb-item .sb-ico svg,
        .sb-aitem .sb-ico svg {
          stroke-width: 1.7;
        }
        .sb-item.active .sb-ico svg {
          stroke-width: 2;
        }
        .sb-sub-label {
          font-weight: 600;
          font-size: 11px;
          color: var(--nav-muted);
          letter-spacing: 0.06em;
          text-transform: uppercase;
          margin: 18px 10px 6px;
        }
        /* Boshqaruv bandlari — asosiy navdan ataylab past darajada:
           pastroq bo'y, kichikroq ikonka va shrift, so'nuqroq rang. */
        .sb-aitem {
          display: flex;
          align-items: center;
          gap: 11px;
          height: 34px;
          padding: 0 10px;
          border-radius: 9px;
          border: none;
          background: none;
          cursor: pointer;
          font-size: 13px;
          font-weight: 500;
          color: var(--nav-ink2);
          text-align: left;
          font-family: inherit;
          width: 100%;
        }
        .sb-aitem .sb-ico {
          width: 17px;
          height: 17px;
          color: inherit;
          flex-shrink: 0;
        }
        .sb-aitem .sb-ico svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        .sb-aitem .sb-lbl {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-aitem.active {
          background: var(--nav-act-bg);
          color: var(--nav-act-ink);
          font-weight: 600;
        }
        .sb-spacer {
          flex: 1;
        }
        .sb-user {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 8px;
          border: none;
          border-top: 1px solid var(--bd2);
          background: none;
          cursor: pointer;
          text-align: left;
          width: 100%;
          font-family: inherit;
        }
        .sb-user .avatar {
          width: 30px;
          height: 30px;
          border-radius: 10px;
          background: #344054;
          color: #fff;
          font-weight: 600;
          font-size: 12px;
          flex-shrink: 0;
        }
        /* Balans belgisi — menyuning eng pastida, profil qatorida. */
        .sb-ncoin {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          height: 24px;
          padding: 0 8px;
          border-radius: 7px;
          background: var(--nav-coin-bg);
          color: var(--nav-coin-ink);
          font-size: 12px;
          font-weight: 600;
          flex: none;
          transition: opacity 0.12s ease;
        }
        .sb-ncoin svg {
          width: 13px;
          height: 13px;
          display: block;
          flex: none;
        }
        .sb-user-name {
          font-weight: 600;
          font-size: 13px;
          color: var(--ink);
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .sb-user-role {
          font-size: 11.5px;
          color: var(--nav-muted);
        }

        /* ── Sidebar yig'ilgan holati: faqat ikonkalar, kontent avtomatik
           kengayadi. body.sidebar-collapsed — yagona holat manbai. ────── */
        body.sidebar-collapsed #sidebar {
          width: 72px;
        }
        body.sidebar-collapsed .sb-toggle svg {
          transform: rotate(180deg);
        }
        body.sidebar-collapsed .sb-brand {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
        }
        body.sidebar-collapsed .sb-item,
        body.sidebar-collapsed .sb-aitem {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
          gap: 0;
        }
        body.sidebar-collapsed .sb-brand-text,
        body.sidebar-collapsed .sb-item .sb-lbl,
        body.sidebar-collapsed .sb-item .sb-count,
        body.sidebar-collapsed .sb-aitem .sb-lbl,
        body.sidebar-collapsed .sb-sub-label,
        body.sidebar-collapsed .sb-ncoin,
        body.sidebar-collapsed .sb-user-text {
          opacity: 0;
          pointer-events: none;
        }
        body.sidebar-collapsed .sb-item .sb-lbl,
        body.sidebar-collapsed .sb-item .sb-count,
        body.sidebar-collapsed .sb-aitem .sb-lbl,
        body.sidebar-collapsed .sb-ncoin {
          width: 0;
          min-width: 0;
          flex: 0;
          padding: 0;
          overflow: hidden;
        }
        /* box-sizing:border-box tufayli padding width:0'dan ustun
           turadi (chekka+padding yig'indisi minimal kenglik bo'lib
           qoladi) — shu sabab "Loyihalar" ikonkasidagi qarz-hisoblagichi
           14px joy band qilib, faqat o'sha ikonkani markazdan siljitib
           qo'yardi. Padding'ni ham 0'ga tushirish shart. */
        body.sidebar-collapsed .sb-item .sb-count {
          padding: 0;
        }
        body.sidebar-collapsed .sb-sub-label {
          height: 0;
          margin: 0;
          overflow: hidden;
        }
        body.sidebar-collapsed .sb-user {
          justify-content: center;
          padding-left: 6px;
          padding-right: 6px;
          gap: 0;
        }
        /* .sb-user-text (flex:1) o'zi kengayib ketmasligi, .chev esa
           (global .chev klassida flex-shrink:0 bor — boshqa joylarda
           kichraymasligi kerak bo'lgani uchun) shu yerda kichraymay
           qolib, tugmani sidebar chekkasidan tashqariga chiqarib
           yuborardi — xuddi qarz-hisoblagichidagi kabi (padding emas,
           bu safar flex-shrink:0 sabab). Ikkalasini ham 0'ga tushiramiz. */
        body.sidebar-collapsed .sb-user-text {
          width: 0;
          min-width: 0;
          flex: 0 0 0;
          overflow: hidden;
        }

        /* ── Kontent ustuni: sidebar uchun joy + kengroq o'qish maydoni ── */
        .screen {
          margin-left: 224px;
          max-width: none;
          width: auto;
          box-shadow: none;
          transition: margin-left 0.22s ease;
        }
        body.sidebar-collapsed .screen {
          margin-left: 72px;
        }
        .hdr,
        .trk-hdr,
        .np-hdr,
        .np-footer,
        .scroll {
          max-width: 880px;
          margin-left: auto;
          margin-right: auto;
          width: 100%;
        }
        #screen-today .hdr,
        #screen-today .scroll,
        #screen-projects .hdr,
        #screen-projects .scroll,
        #screen-tasks .hdr,
        #screen-tasks .scroll,
        #screen-tracker .trk-hdr,
        #screen-admin .hdr,
        #screen-admin .scroll,
        #screen-nshop .hdr,
        #screen-nshop .scroll {
          max-width: none;
          padding-left: 32px;
          padding-right: 32px;
          transition: padding-left 0.22s ease;
        }
        /* Sidebar yig'ilganda ikonka ustuni (72px) juda tor bo'lgani
           uchun avvalgi 32px chekka bo'shlig'i endi keragidan ortiq
           bo'sh joy qoldirardi — kontent ikonkalarga yaqinroq siljiydi. */
        body.sidebar-collapsed #screen-today .hdr,
        body.sidebar-collapsed #screen-today .scroll,
        body.sidebar-collapsed #screen-projects .hdr,
        body.sidebar-collapsed #screen-projects .scroll,
        body.sidebar-collapsed #screen-tasks .hdr,
        body.sidebar-collapsed #screen-tasks .scroll,
        body.sidebar-collapsed #screen-tracker .trk-hdr,
        body.sidebar-collapsed #screen-admin .hdr,
        body.sidebar-collapsed #screen-admin .scroll,
        body.sidebar-collapsed #screen-nshop .hdr,
        body.sidebar-collapsed #screen-nshop .scroll {
          padding-left: 20px;
        }
        body.sidebar-collapsed #screen-tracker .trk-main {
          padding-left: 20px;
        }
        #screen-history .hdr,
        #screen-history .scroll,
        #screen-profile .scroll {
          max-width: 1400px;
        }

        /* ── Sarlavha qatori: mobil bir ustunda, katta ekranda sarlavha
           chapda + qidiruv o'ngda, bitta qatorda (Loyihalar/Tarix/
           Boshqaruv sarlavhalari to'liq kenglikka cho'zilib ketmasin) ─── */
        .hdr-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
        }
        .hdr-row > *:first-child {
          flex: 1;
          min-width: 0;
        }
        .hdr-row .search-box {
          margin-top: 0;
          width: 320px;
          flex-shrink: 0;
        }
        /* Boshqaruv: DOM tartibi (sarlavha, atabs, qidiruv) mobilda
           saqlanishi shart bo'lgani uchun qidiruv katta ekranda faqat
           CSS order bilan sarlavha yoniga ko'chiriladi. */
        #admin-hdr {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 12px;
        }
        #admin-hdr .hdr-title {
          order: 1;
          flex: 1;
          min-width: 0;
        }
        #admin-hdr .search-box {
          order: 2;
          margin-top: 0;
          width: 320px;
          flex-shrink: 0;
        }
        #admin-hdr .atabs {
          order: 3;
          flex-basis: 100%;
          margin-top: 4px;
        }

        /* ── Tracker: kalendar + o'ng panel yonma-yon ────────────────── */
        #screen-tracker .trk-main {
          flex-direction: row;
          gap: 20px;
          align-items: flex-start;
          max-width: none;
          width: 100%;
          padding: 0 32px 28px;
        }
        #screen-tracker #tracker-body {
          max-width: none;
          margin: 0;
          flex: 1;
          min-width: 0;
          padding: 16px 0 0;
        }
        .trk-rail {
          width: 340px;
          flex-shrink: 0;
          position: sticky;
          top: 16px;
          padding-top: 16px;
        }
        /* Katta ekranda kalendar butun kenglikka cho'zilib, katakchalar
           haddan tashqari yirik bo'lib ketmasligi uchun ixcham kenglikka
           qisiladi (mobil o'lchamiga yaqin, faqat o'qilishi qulayroq). */
        #screen-tracker .cal-week,
        #screen-tracker .cal-grid {
          max-width: 400px;
        }

        /* ── Umumiy: statistik kartalar, jadval, ikki ustunli maket ──── */
        .dash-cols {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 20px;
          align-items: start;
        }
        .stat-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          margin-bottom: 20px;
        }
        .stat-card {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 18px;
        }
        .stat-card.tempo {
          background: var(--brand);
          border-color: var(--brand);
        }
        .stat-card.tempo .stat-lbl {
          color: rgba(255, 255, 255, 0.7);
        }
        .stat-card.tempo .stat-val {
          color: #fff;
        }
        .stat-card.tempo .stat-foot {
          color: rgba(255, 255, 255, 0.7);
        }
        .stat-card.danger {
          border-color: var(--red-bd);
        }
        .stat-card.danger .stat-lbl,
        .stat-card.danger .stat-val,
        .stat-card.danger .stat-foot,
        .stat-card.danger .stat-link {
          color: var(--red);
        }
        .stat-bar {
          margin-top: 14px;
          height: 6px;
          border-radius: 99px;
          background: rgba(255, 255, 255, 0.28);
          overflow: hidden;
        }
        .stat-bar-fill {
          height: 100%;
          background: var(--surf);
          border-radius: 99px;
        }
        .stat-lbl {
          font-size: 11px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }
        .stat-val {
          font-weight: 600;
          font-size: 34px;
          color: var(--ink);
          line-height: 1;
          margin-top: 12px;
          letter-spacing: -0.03em;
        }
        .stat-val .stat-sub {
          font-size: 17px;
          color: var(--t3);
          font-weight: 500;
        }
        .stat-foot {
          font-size: 12px;
          color: var(--t3);
          margin-top: 12px;
        }
        .stat-link {
          color: var(--brand);
          font-weight: 600;
          cursor: pointer;
        }
        .dtbl-wrap {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          overflow: hidden;
          margin-bottom: 20px;
        }
        .card-hdr {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 14px 16px;
          border-bottom: 1px solid var(--bd2);
          background: var(--surf2);
          flex-wrap: wrap;
        }
        .card-hdr-title {
          font-weight: 600;
          font-size: 13.5px;
          color: var(--ink);
          flex-shrink: 0;
        }
        .dtbl tr.debt-row td {
          background: var(--red-bg);
        }
        .dtbl tr.debt-row.clickable:hover td {
          background: #f9dcd9;
        }
        .dtbl-bar-wrap {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .dtbl-bar-wrap .hist-track {
          width: 60px;
          flex-shrink: 0;
        }
        .dtbl {
          width: 100%;
          border-collapse: collapse;
          font-size: 13px;
        }
        .dtbl th {
          text-align: left;
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.05em;
          padding: 11px 16px;
          border-bottom: 1px solid var(--bd2);
          background: var(--surf2);
        }
        .dtbl td {
          padding: 12px 16px;
          border-bottom: 1px solid var(--bd1);
          color: var(--t5);
        }
        .dtbl tr:last-child td {
          border-bottom: none;
        }
        .dtbl tr.clickable {
          cursor: pointer;
        }
        .dtbl tr.clickable:hover td {
          background: var(--surf2);
        }
        .dtbl .dtbl-name {
          font-weight: 600;
          color: var(--ink);
        }
        .wk-bars {
          display: flex;
          align-items: flex-end;
          height: 52px;
          margin: 14px 0 6px;
        }
        .wk-bar-col {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-end;
          height: 100%;
          cursor: pointer;
          padding: 6px 2px 0;
          border-radius: 8px;
          -webkit-tap-highlight-color: transparent;
        }
        .wk-bar-col:active {
          background: var(--surf2);
        }
        .wk-bar-track {
          position: relative;
          width: 60%;
          min-width: 10px;
          border-radius: 4px;
          background: var(--chip3);
          overflow: visible;
        }
        .wk-bar-fill {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          border-radius: 4px;
          background: var(--brand);
          opacity: 0.45;
        }
        .wk-bar-col.active .wk-bar-fill {
          opacity: 1;
        }
        .wk-bar-col.active .wk-bar-track {
          box-shadow: 0 0 0 2px var(--brand);
        }
        .wk-bar-lbl {
          font-size: 9.5px;
          color: var(--t3);
          text-align: center;
          margin-top: 6px;
        }
        .wk-bar-col.active .wk-bar-lbl {
          color: var(--brand);
          font-weight: 700;
        }
        .wk-detail {
          margin-top: 10px;
        }
        .wk-detail-title {
          font-size: 11px;
          font-weight: 600;
          color: var(--t3);
          margin-bottom: 6px;
        }

        /* ── Loyihalar/Vazifalar: kartochka to'ri va kanban ──────────── */
        .pgrid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 14px;
        }
        .pcard {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 16px;
          cursor: pointer;
        }
        .pcard:hover {
          border-color: var(--bd4);
        }
        .pcard-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 10px;
        }
        .pcard-pct {
          font-weight: 700;
          font-size: 13px;
          color: var(--brand);
        }
        .kanban {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
          align-items: start;
        }

        /* ── Tabel: ikki ustun yonma-yon ──────────────────────────────── */
        .two-col {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 24px;
          align-items: start;
        }

        /* ── Ruxsatlar matritsasi ─────────────────────────────────────── */
        .pmx-wrap {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          overflow: auto;
          margin-bottom: 16px;
        }
        .pmx {
          border-collapse: collapse;
          font-size: 12px;
          width: 100%;
        }
        .pmx th,
        .pmx td {
          padding: 12px 14px;
          text-align: center;
          border-bottom: 1px solid var(--bd1);
        }
        .pmx th.pmx-emp,
        .pmx td.pmx-emp {
          text-align: left;
          position: sticky;
          left: 0;
          background: var(--surf);
          z-index: 1;
          min-width: 190px;
        }
        .pmx thead th {
          font-size: 10.5px;
          font-weight: 500;
          line-height: 1.3;
          color: var(--t5);
          white-space: normal;
          background: var(--surf2);
          vertical-align: bottom;
          height: 58px;
        }
        .pmx thead th.pmx-emp {
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          background: var(--surf2);
        }
        .pmx thead th.pmx-total {
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          text-align: right;
        }
        .pmx-emp-name {
          font-weight: 600;
          font-size: 13.5px;
          color: var(--ink);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 140px;
        }
        .pmx-emp-sub {
          font-size: 11px;
          color: var(--chev);
          margin-top: 1px;
        }
        .pmx-cell {
          width: 26px;
          height: 26px;
          padding: 0;
          margin: 0 auto;
          cursor: pointer;
          font-size: 12px;
          font-weight: 700;
          border-radius: 8px;
          background: var(--chip);
          border: 1px solid var(--bd2);
          color: transparent;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .pmx-cell.on {
          width: auto;
          min-width: 108px;
          height: 30px;
          padding: 0 3px;
          background: var(--brand);
          border-color: var(--brand);
          color: #fff;
        }
        .perm-role-select {
          width: 100%;
          height: 100%;
          border: none;
          background: none;
          color: inherit;
          font-size: 11.5px;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          outline: none;
        }
        .perm-role-select option {
          color: var(--ink);
        }
        .pmx-total {
          font-weight: 600;
          font-size: 13px;
          color: var(--ink);
          text-align: right;
        }
        .pmx-total.zero {
          color: var(--chev);
          font-weight: 500;
        }
        .pmx-legend {
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 11.5px;
          color: var(--t2);
          margin: 0 0 18px;
        }
        .pmx-legend-dot {
          display: inline-block;
          width: 14px;
          height: 14px;
          border-radius: 5px;
          margin-right: 6px;
          vertical-align: middle;
        }
      }
    </style>
  </head>
  <body>
    <!-- ── KIRISH / YUKLANMOQDA ────────────────────────────────────── -->
    <div id="loading">
      <div class="ld-mark">ND</div>
      <div class="ld-bar"><div class="ld-bar-fill"></div></div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ── BUGUN ───────────────────────────────────────────────────── -->
    <div class="screen" id="screen-today">
      <div class="hdr" style="display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; min-width: 0">
          <div class="hdr-title">
            <span class="mobile-only">Bugun</span><span class="desktop-only">Panel</span>
          </div>
          <div class="hdr-sub" id="today-date-label">—</div>
        </div>
        <div class="desktop-flex" id="today-desktop-actions" style="align-items: center; gap: 10px; flex: 1; max-width: 520px">
          <div class="search-box" style="margin-top: 0; flex: 1">
            <div class="search-ico"></div>
            <input id="today-search" placeholder="Loyiha yoki xodim qidirish" oninput="renderToday()" />
          </div>
          <button class="btn btn-blue" id="today-new-project-btn" style="width: auto; height: 40px; padding: 0 18px; white-space: nowrap; display: none; align-items: center; justify-content: center" onclick="openNewProjectSheet()">+ Yangi loyiha</button>
        </div>
        <div id="me-avatar" class="hdr-avatar-btn mobile-only" onclick="openProfilePage()">?</div>
      </div>
      <div class="scroll" id="today-body"></div>
    </div>

    <!-- ── LOYIHALAR ───────────────────────────────────────────────── -->
    <div class="screen" id="screen-projects">
      <div class="hdr">
        <div class="hdr-row">
          <div class="hdr-title">Loyihalar</div>
          <div class="search-box">
            <div class="search-ico"></div>
            <input
              id="proj-search"
              placeholder="Qidirish"
              oninput="renderProjectsScreen()"
            />
          </div>
        </div>
        <div class="chips" id="proj-chips"></div>
      </div>
      <div class="scroll" id="projects-body"></div>
      <button
        class="fab"
        id="projects-fab"
        onclick="openNewProjectSheet()"
        style="display: none"
      >
        +
      </button>
    </div>

    <!-- ── VAZIFALAR ───────────────────────────────────────────────── -->
    <div class="screen" id="screen-tasks">
      <div class="hdr" style="display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; min-width: 0">
          <div class="hdr-title">Vazifalar</div>
          <div class="hdr-sub" id="tasks-summary">—</div>
        </div>
        <div class="desktop-flex" id="tasks-desktop-actions" style="align-items: center; gap: 10px">
          <div class="search-box" style="margin-top: 0; width: 240px; flex: none">
            <div class="search-ico"></div>
            <input id="tasks-search" placeholder="Vazifa, xodim, tag" oninput="renderTasksBody()" />
          </div>
          <button class="btn btn-soft" style="width: auto; height: 40px; padding: 0 16px; white-space: nowrap; display: flex; align-items: center; gap: 6px" onclick="openTasksFilterSheet()">Filtr <span class="mini-chevron" style="color: var(--chev)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>
          <button class="btn btn-blue" id="tasks-new-btn" style="width: auto; height: 40px; padding: 0 18px; white-space: nowrap; display: none; align-items: center; justify-content: center" onclick="openNewTaskSheet()">+ Yangi vazifa</button>
        </div>
        <div id="me-avatar-tasks" class="hdr-avatar-btn mobile-only" onclick="openProfilePage()">?</div>
      </div>
      <div class="scroll" id="tasks-body"></div>
      <button
        class="fab"
        id="tasks-fab"
        onclick="openNewTaskSheet()"
        style="display: none"
      >
        +
      </button>
    </div>

    <!-- ── NSHOP ───────────────────────────────────────────────────── -->
    <div class="screen" id="screen-nshop">
      <div class="hdr">
        <div class="nshop-hdr-row">
          <div style="flex: 1; min-width: 160px">
            <div class="hdr-title" style="display: flex; align-items: center; gap: 8px">
              NShop
            </div>
            <div class="hdr-sub" id="nshop-summary">—</div>
          </div>
          <button type="button" class="nshop-hist-btn" onclick="openNcoinHistorySheet()">Xaridlar tarixi</button>
          <div class="nshop-balance-pill">
            <span class="nshop-balance-pill-label">Balans</span>
            <span class="nshop-balance-pill-value" id="nshop-balance-pill">
              <span class="n-badge" style="width: 17px; height: 17px; font-size: 10px">N</span>—
            </span>
          </div>
        </div>
      </div>
      <div class="scroll" id="nshop-body"></div>
    </div>

    <!-- ── TARIX ───────────────────────────────────────────────────── -->
    <div class="screen" id="screen-history">
      <div class="hdr">
        <div class="hdr-row">
          <div>
            <div class="hdr-title">Tarix</div>
            <div class="hdr-sub">Davrlar, muddatlar va bajarilish holati</div>
          </div>
          <div class="search-box">
            <div class="search-ico"></div>
            <input
              id="hist-search"
              placeholder="Loyiha yoki oy bo'yicha qidirish"
              oninput="renderHistoryRows()"
            />
          </div>
        </div>
        <div class="chips" id="hist-chips"></div>
      </div>
      <div class="scroll" id="history-body"></div>
    </div>

    <!-- ── BOSHQARUV ───────────────────────────────────────────────── -->
    <div class="screen" id="screen-admin">
      <div class="hdr" id="admin-hdr">

    <script>
      // ── CONFIG ────────────────────────────────────────────────────
      const API = "";
      const SUPER_ADMINS = new Set(["jahongirjuraqulov", "shaxzodshokirov"]);
      const WD = ["Du", "Se", "Cho", "Pa", "Ju", "Sh", "Ya"];
      const MONTHS = [
        "Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun",
        "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr",
      ];

      // ── SANA TANLAGICH — brauzerning nativ input[type=date] popover'i
      // dizayn tizimiga mos emas (hech qanday CSS bilan o'zgartirib
      // bo'lmaydi), shuning uchun o'zimizning kalendar popover'imiz.
      // Har bir maydon: yashirin <input type=date> (qiymat/mavjud
      // .value o'qish kodlari o'zgarishsiz ishlaydi) + ko'rinadigan
      // "date-field" tugmasi. Kun tanlanganda yashirin input'ga haqiqiy
      // "change" event dispatch qilinadi — mavjud onchange="..."
      // ulanishlari ham (masalan np-anchor) o'zgarishsiz ishlayveradi.
      let dpState = null;
      function fmtDateField(iso) {
        if (!iso) return "";
        const d = parseISO(iso);
        return `${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
      }
      function renderDateFieldHtml(id, value, placeholder) {
        const hasVal = !!value;
        return `<div class="date-field${hasVal ? "" : " placeholder"}" id="${id}-field" onclick="openDatePicker('${id}')">
            <span class="date-field-ico">${ICON.calendar}</span>
            <span style="flex:1" id="${id}-label">${hasVal ? fmtDateField(value) : placeholder || "Sana tanlang"}</span>
          </div>
          <input type="date" id="${id}" class="hidden-native" value="${value || ""}"/>`;
      }
      function openDatePicker(id) {
        closeDatePicker();
        const trigger = document.getElementById(id + "-field");
        const hidden = document.getElementById(id);
        if (!trigger || !hidden) return;
        const current = hidden.value ? parseISO(hidden.value) : todayDate();
        dpState = { id, viewYear: current.getFullYear(), viewMonth: current.getMonth() };
        const pop = document.createElement("div");
        pop.className = "datepicker-pop";
        pop.id = "dp-pop";
        document.body.appendChild(pop);
        positionDatePicker(trigger, pop);
        renderDatePicker();
        document.addEventListener("mousedown", onDpOutsideClick);
        document.addEventListener("scroll", closeDatePicker, true);
      }
      function positionDatePicker(trigger, pop) {
        const r = trigger.getBoundingClientRect();
        const popW = 280;
        let left = r.left;
        if (left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
        if (left < 12) left = 12;
        let top = r.bottom + 6;
        if (top + 340 > window.innerHeight) top = Math.max(12, r.top - 346);
        pop.style.left = left + "px";
        pop.style.top = top + "px";
      }
      function onDpOutsideClick(e) {
        const pop = document.getElementById("dp-pop");
        const trigger = dpState && document.getElementById(dpState.id + "-field");
        if (pop && !pop.contains(e.target) && !(trigger && trigger.contains(e.target))) closeDatePicker();
      }
      function closeDatePicker() {
        document.getElementById("dp-pop")?.remove();
        document.removeEventListener("mousedown", onDpOutsideClick);
        document.removeEventListener("scroll", closeDatePicker, true);
        dpState = null;
      }
      function dpNav(delta) {
        if (!dpState) return;
        dpState.viewMonth += delta;
        if (dpState.viewMonth < 0) {
          dpState.viewMonth = 11;
          dpState.viewYear--;
        } else if (dpState.viewMonth > 11) {
          dpState.viewMonth = 0;
          dpState.viewYear++;
        }
        renderDatePicker();
      }
      function renderDatePicker() {
        const pop = document.getElementById("dp-pop");
        if (!pop || !dpState) return;
        const { viewYear, viewMonth, id } = dpState;
        const selectedIso = document.getElementById(id)?.value || "";
        const todayIso = isoOf(todayDate());
        const cells = buildCalGridCells(viewYear, viewMonth);
        const dayBtns = cells
          .map((c) => {
            const cls = ["dp-day"];
            if (!c.iso) cls.push("other-month");
            if (c.iso === todayIso) cls.push("today");
            if (c.iso && c.iso === selectedIso) cls.push("selected");
            return `<button type="button" class="${cls.join(" ")}" ${c.iso ? `onclick="selectDpDay('${c.iso}')"` : "disabled"}>${c.dNum}</button>`;
          })
          .join("");
        pop.innerHTML = `
          <div class="dp-hdr">
            <button type="button" class="dp-nav-btn" onclick="dpNav(-1)">${ICON.chevronLeft}</button>
            <div class="dp-hdr-label">${MONTHS[viewMonth]} ${viewYear}</div>
            <button type="button" class="dp-nav-btn" onclick="dpNav(1)">${ICON.chevronRight}</button>
          </div>
          <div class="dp-weekdays">${WD.map((w) => `<div class="dp-weekday">${w}</div>`).join("")}</div>
          <div class="dp-days">${dayBtns}</div>
          <div class="dp-footer"><button type="button" class="dp-today-btn" onclick="selectDpDay('${todayIso}')">Bugun</button></div>`;
      }
      function selectDpDay(iso) {
        if (!dpState) return;
        const hidden = document.getElementById(dpState.id);
        if (hidden) {
          hidden.value = iso;
          hidden.dispatchEvent(new Event("change", { bubbles: true }));
        }
        const label = document.getElementById(dpState.id + "-label");
        if (label) label.textContent = fmtDateField(iso);
        document.getElementById(dpState.id + "-field")?.classList.remove("placeholder");
        closeDatePicker();
      }

      // ── IKONKALAR (chiziqli SVG, currentColor — bordir-plейсхолдер
      // o'rniga; alohida icon kutubxonasi/build qadamisiz ishlaydi) ────
      const SVG_ATTRS = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
      const ICON = {
        home: `<svg ${SVG_ATTRS}><path d="M3 9.5 12 3l9 6.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>`,
        folder: `<svg ${SVG_ATTRS}><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>`,
        checkSquare: `<svg ${SVG_ATTRS}><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg>`,
        clock: `<svg ${SVG_ATTRS}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
        settings: `<svg ${SVG_ATTRS}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>`,
        search: `<svg ${SVG_ATTRS}><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`,
        edit: `<svg ${SVG_ATTRS}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
        trash: `<svg ${SVG_ATTRS}><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`,
        users: `<svg ${SVG_ATTRS}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
        plus: `<svg ${SVG_ATTRS}><path d="M12 5v14M5 12h14"/></svg>`,
        chevronLeft: `<svg ${SVG_ATTRS}><path d="m14 6-6 6 6 6"/></svg>`,
        chevronRight: `<svg ${SVG_ATTRS}><path d="m10 6 6 6-6 6"/></svg>`,
        chevronDown: `<svg ${SVG_ATTRS}><path d="m6 9 6 6 6-6"/></svg>`,
        calendar: `<svg ${SVG_ATTRS}><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
        shoppingBag: `<svg ${SVG_ATTRS}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
      };
      // Statik nav ikonalarini bir marta joylashtiradi (ma'lumot
      // yuklanishini kutmaydi — sahifa ochilgan zahoti chizilaveradi).
      function applyStaticIcons() {
        const map = {
          "nav-today": "home", "sidebar-nav-today": "home",
          "nav-projects": "folder", "sidebar-nav-projects": "folder",
          "nav-tasks": "checkSquare", "sidebar-nav-tasks": "checkSquare",
          "nav-nshop": "shoppingBag", "sidebar-nav-nshop": "shoppingBag",
          "nav-history": "clock",
          "nav-admin": "settings",
        };
        Object.entries(map).forEach(([id, icon]) => {
          const el = document.getElementById(id)?.querySelector(".nav-ico, .sb-ico");
          if (el) el.innerHTML = ICON[icon];
        });
        document.querySelectorAll(".search-ico").forEach((el) => (el.innerHTML = ICON.search));
        const toggleIco = document.getElementById("sidebar-toggle-ico");
        if (toggleIco) toggleIco.innerHTML = ICON.chevronLeft;
      }
      applyStaticIcons();
      // Menyudagi Boshqaruv bandlari ikonkalari — v3 chizmasidan
      // olingan aniq shakllar.
      const SB_ADMIN_ICONS = {
        staff: `<svg ${SVG_ATTRS}><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.8 3 2.6 3.5 5.2"/></svg>`,
        worklog: `<svg ${SVG_ATTRS}><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M9 9.5v10"/></svg>`,
        perms: `<svg ${SVG_ATTRS}><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l2 2"/></svg>`,
        nshop: `<svg ${SVG_ATTRS}><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>`,
        announcement: `<svg ${SVG_ATTRS}><path d="M4 10v4h3l7 4V6L7 10z"/><path d="M18 9a4 4 0 0 1 0 6"/></svg>`,
        admins: `<svg ${SVG_ATTRS}><path d="M12 3 5 6v5.5c0 4.3 3 7.8 7 9.5 4-1.7 7-5.2 7-9.5V6z"/></svg>`,

        const el = document.getElementById("sb-atab-" + key)?.querySelector(".sb-ico");
        if (el) el.innerHTML = svg;
      });


      // ── SIDEBAR YIG'ISH/OCHISH (faqat katta ekran) ──────────────────
      // Holat body'dagi bitta class orqali boshqariladi — CSS shu klassga
      // qarab kengligi/margin/label'larni silliq animatsiya qiladi.
      // localStorage'da saqlanadi, shuning uchun sahifa yangilanganda ham
      // tanlangan holat unutilmaydi.
      function applySidebarState(collapsed) {
        document.body.classList.toggle("sidebar-collapsed", collapsed);
        const btn = document.getElementById("sidebar-toggle");
        if (btn) btn.title = collapsed ? "Menyuni ochish" : "Menyuni yig'ish";
      }
      function toggleSidebar() {
        const collapsed = !document.body.classList.contains("sidebar-collapsed");
        applySidebarState(collapsed);
        try {
          localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "0");
        } catch (e) {}
      }
      (function initSidebarState() {
        let saved = "0";
        try {
          saved = localStorage.getItem("sidebarCollapsed") || "0";
        } catch (e) {}
        applySidebarState(saved === "1");
      })();

      // ── STATE ─────────────────────────────────────────────────────
      let currentUser = null,
        isAdmin = false,
        isSuperAdmin = false,
        userRole = "employee";
      let perms = {},
        allUsers = [];
      let permRoles = {}; // { username: { projectSlug: role } } — loyiha-ichidagi rol (Ncoin taqsimoti uchun)
      let projects = [];
      let activeTab = "today";
      let projFilter = "all";
      let trackerProjectId = null,

      // ── TEMA (Light/Dark) ────────────────────────────────────────
      // Sahifa boshida (<head>dagi kichik inline skript) FOUC'siz
      // qo'llash uchun localStorage'dan o'qilgan — shu yerdagi
      // funksiyalar Profil ekranidagi tugma bosilganda ishlatiladi.
      function getTheme() {
        try {
          return localStorage.getItem("nasaf_theme") === "dark" ? "dark" : "light";
        } catch (e) {
          return "light";
        }
      }
      function setTheme(theme) {

      // ── UTILS ─────────────────────────────────────────────────────
      const getInitData = () => window.Telegram?.WebApp?.initData || "";
      const tg = () => window.Telegram?.WebApp;
      async function apiFetch(url, opts = {}) {
        const h = { "Content-Type": "application/json", ...(opts.headers || {}) };
        const id = getInitData();
        if (id) h["X-Telegram-Init-Data"] = id;
        return fetch(`${API}${url}`, { ...opts, headers: h });
      }
      const pct = (d, t) => (t === 0 ? 0 : Math.round((d / t) * 100));
      function escHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escArg(s) {
        return String(s ?? "")
          .replace(/\\/g, "\\\\")
          .replace(/'/g, "\\'")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;");
      }
      function showToast(msg, ms = 2200) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), ms);
      }
      // Tugma bosilganda "aylana" (spinner) bilan yuklanish holatini
      // ko'rsatadi — asl matn dataset'da saqlanib, xato bo'lganda
      // qaytariladi (muvaffaqiyatda odatda butun blok qayta render
      // bo'lgani uchun buni qaytarish shart emas).
      function setBtnLoading(btn, loading, loadingText) {
        if (!btn) return;
        if (loading) {
          if (btn.dataset.origHtml === undefined) btn.dataset.origHtml = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = `<span class="spinner"></span>${loadingText ? " " + escHtml(loadingText) : ""}`;
        } else {
          btn.disabled = false;
          if (btn.dataset.origHtml !== undefined) {
            btn.innerHTML = btn.dataset.origHtml;
            delete btn.dataset.origHtml;
          }
        }
      }
      function initials(label) {
        return String(label || "?")
          .split(/\s+/)
          .map((w) => w[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      }
      // "shaxzod SHOKIROV" / "sHaXzOd" kabi qanday yozilishidan qat'i
      // nazar — "Shaxzod Shokirov" ko'rinishiga keltiradi. Backendda
      // ham AYNAN shu mantiq bor (saqlashda yakuniy tekshiruv) — bu
      // yerdagi nusxa faqat foydalanuvchiga darhol (blur'da) ko'rsatish
      // uchun.
      function titleCaseName(str) {
        return String(str || "")
          .trim()
          .split(/\s+/)
          .map((w) => (w.length ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w))
          .join(" ");
      }
      function formatNameInputOnBlur(el) {
        el.value = titleCaseName(el.value);
      }
      // Telefon input — +998 doim ko'rinadi, foydalanuvchi faqat 9 ta
      // raqam kiritadi ("99 999 99 99"), qolgani avtomatik joylashadi.
      // Xom (faqat raqamlardan iborat) qiymatni ham qabul qiladi —
      // "998991234567" yopishtirilsa "998" prefiksi avtomatik olib
      // tashlanadi.
      function formatPhoneInput(el) {
        let digits = el.value.replace(/\D/g, "");
        if (digits.startsWith("998")) digits = digits.slice(3);
        digits = digits.slice(0, 9);
        let out = "+998";
        if (digits.length) out += " " + digits.slice(0, 2);
        if (digits.length > 2) out += " " + digits.slice(2, 5);
        if (digits.length > 5) out += " " + digits.slice(5, 7);
        if (digits.length > 7) out += " " + digits.slice(7, 9);
        el.value = out;
      }

      // ── SANA YORDAMCHILARI ────────────────────────────────────────
      function parseISO(s) {
        const [y, m, d] = String(s).slice(0, 10).split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function isoOf(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function todayDate() {
        const t = new Date();
        return new Date(t.getFullYear(), t.getMonth(), t.getDate());
      }
      function daysBetween(a, b) {
        return Math.round((b - a) / 86400000);
      }
      function fmtDay(d) {
        return `${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()}`;
      }
      function fmtTime(d) {
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }
      // Backenddagi addMonthsClamped() bilan bir xil: N oy qo'shadi, kun
      // clamp bilan (masalan 31-yanvar + 1 oy = 28/29-fevral). "Yangi
      // loyiha" preview'i shu orqali davr tugash sanasini backend bilan
      // AYNAN bir xil hisoblaydi (naiv .setMonth() emas).
      function jsAddMonthsClamped(iso, n) {
        const [y, m, d] = iso.split("-").map(Number);
        const total = y * 12 + (m - 1) + n;
        const ny = Math.floor(total / 12);
        const nm0 = ((total % 12) + 12) % 12;
        const nm = nm0 + 1;
        const dim = new Date(ny, nm, 0).getDate();
        const nd = Math.min(d, dim);
        return `${ny}-${String(nm).padStart(2, "0")}-${String(nd).padStart(2, "0")}`;
      }
      // dp-pop popoveri va "Yangi loyiha" ichki kalendari ikkalasi ham
      // shu funksiyadan foydalanadi — kun-katak hisoblash logikasi
      // ikki joyda takrorlanmasin.
      function buildCalGridCells(viewYear, viewMonth) {
        const startOffset = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7; // Dushanba = 0
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) {
          cells.push({ dNum: daysInPrevMonth - startOffset + 1 + i, iso: null });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({ dNum: d, iso: `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}` });
        }
        let n = 1;
        while (cells.length < 42) cells.push({ dNum: n++, iso: null });
        return cells;
      }

      // Kalendar HAQIQIY bajarilgan kunlar bo'yicha chiziladi: har bir
      // belgilangan post/story o'zining work_date sanasiga tushadi.
      // Oldindan reja yo'q — shu sababli "o'tkazib yuborilgan" qizil
      // kunlar ham yo'q. Natija: { '2026-08-13': [3, 4] }
      function buildDayMap(p, type) {
        const map = {};
        const det = p.checkDetails || {};
        Object.keys(p.checks || {}).forEach((key) => {
          if (!key.startsWith(type + "-")) return;
          const seq = parseInt(key.slice(type.length + 1), 10);
          const wd = det[key] && det[key].workDate;
          if (!wd) return;
          const day = String(wd).slice(0, 10);
          (map[day] = map[day] || []).push(seq);
        });
        Object.values(map).forEach((a) => a.sort((x, y) => x - y));
        return map;
      }

      // Post ("kontent") va Stories loyiha progressiga teng og'irlikda
      // qo'shilmaydi — Post umumiy progressning 70%ini, Stories esa 30%ini
      // tashkil qiladi. Loyihada faqat bittasi bo'lsa (masalan faqat
      // Stories), o'sha yagona turning o'zi 100% sifatida hisoblanadi.
      const PROJ_PCT_WEIGHT_K = 0.7; // post (kontent)
      const PROJ_PCT_WEIGHT_S = 0.3; // stories
      function projPct(p) {
        const hasK = p.k > 0,
          hasS = p.s > 0;
        if (!hasK && !hasS) return 0;
        const kFrac = hasK ? p.doneK / p.k : 0;
        const sFrac = hasS ? p.doneS / p.s : 0;
        if (hasK && hasS)
          return Math.round((kFrac * PROJ_PCT_WEIGHT_K + sFrac * PROJ_PCT_WEIGHT_S) * 100);
        return Math.round((hasK ? kFrac : sFrac) * 100);
      }
      function projElapsedFrac(p) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const total = daysBetween(start, end) + 1;
        if (total <= 0) return 0;
        let elapsed = daysBetween(start, todayDate()) + 1;
        if (elapsed < 0) elapsed = 0;
        if (elapsed > total) elapsed = total;
        return elapsed / total;
      }
      function projDaysLeft(p) {
        return daysBetween(todayDate(), parseISO(p.periodEnd));
      }

      // Bitta loyihaning BUGUN belgilangan post/stories'lari (k va s
      // ikkalasi ham) — Boshqaruv paneli va Tracker o'ng paneli umumiy
      // ishlatadi (faqat katta ekran).
      function buildTodayItems(p) {
        const todayKey = isoOf(todayDate());
        const kToday = buildDayMap(p, "k")[todayKey] || [];
        const sToday = buildDayMap(p, "s")[todayKey] || [];
        const items = [];
        kToday.forEach((n) => items.push({ type: "k", n }));
        sToday.forEach((n) => items.push({ type: "s", n }));
        return items;
      }

      // Xodim bo'yicha o'rtacha progress — unga ruxsat berilgan loyihalar
      // progressining o'rtachasi (faqat katta ekran, Boshqaruv paneli).
      function computeEmployeeProgress() {
        const rows = Object.keys(perms)
          .map((username) => {
            const projs = projects.filter((p) => (perms[username] || []).includes(p.id));
            if (!projs.length) return null;
            const avg = Math.round(projs.reduce((s, p) => s + projPct(p), 0) / projs.length);
            return { username, avg };
          })
          .filter(Boolean);
        rows.sort((a, b) => b.avg - a.avg);
        return rows.slice(0, 6);
      }

      // Joriy foydalanuvchi ko'rishi kerak bo'lgan vazifalar doirasi —
      // xodim uchun faqat o'ziga biriktirilganlari, admin/super admin
      // uchun barchasi (Phase 6: to'liq nazorat talabi).
      function myTaskScope() {
        return isAdmin
          ? tasksList
          : tasksList.filter((t) => t.assigneeUsername === currentUser);
      }
      // Bosh sahifadagi "Biriktirilgan vazifalar" kartasi — bekor
      // qilinganlar hisobga olinmaydi, arxiv Dashboard'da ko'rsatilmaydi.
      function computeTaskSummary() {
        // "Jami" — faqat AKTIV (arxivlanmagan) vazifalar: bekor qilingan,
        // bajarilmagan va 30 kundan eski bajarilganlar (taskBoardColumn()
        // orqali — Vazifalar doskasidagi "Arxiv" bilan bir xil chegara)
        // hisobga olinmaydi.
        const scope = myTaskScope().filter((t) => taskBoardColumn(t) !== "archive");
        return {
          total: scope.length,
          // "review" ham hali hal qilinmagan/faol ish sifatida hisoblanadi —
          // kartada alohida 4-raqam qo'shilmaydi.
          inProgress: scope.filter((t) => ["in_progress", "review"].includes(t.status)).length,
          done: scope.filter((t) => t.status === "done").length,
        };
      }
      // Bugungacha muddati kelgan, hali hal qilinmagan vazifalar
      // ("Bugungi vazifalarim" — Dashboard). "review" chiqarib tashlanadi —
      // xodim tomonidan ish tugagan, endi admin navbati; "backlog"
      // avtomatik chiqib qoladi, chunki unda hali dueDate yo'q.
      function myOpenTasksToday() {
        const today = isoOf(todayDate());
        return myTaskScope()
          .filter(
            (t) =>
              !["done", "failed", "cancelled", "review"].includes(t.status) &&
              t.dueDate &&
              t.dueDate <= today,
          )
          .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
      }
      // Xodimning o'ziga biriktirilgan loyihalar bo'yicha umumiy holati
      // (admin uchun ko'rsatilmaydi — ularning umumiy ko'rinishi allaqachon
      // "Loyihalar" jadvali va "Xodimlar progresi" orqali mavjud).
      function computeMyProjectsProgress() {
        if (isAdmin) return null;
        const myProjects = projects.filter((p) => (perms[currentUser] || []).includes(p.id));
        if (!myProjects.length) return null;
        const doneSum = myProjects.reduce((s, p) => s + p.doneK + p.doneS, 0);
        const totalSum = myProjects.reduce((s, p) => s + p.k + p.s, 0);
        return { avgPct: pct(doneSum, totalSum), count: myProjects.length, doneSum, totalSum };
      }

      // ── XULOSA KARTALARI (bosh sahifa — mobil va desktopda bir xil) ─
      function buildAssignedTasksCardHtml() {
        const s = computeTaskSummary();
        return `<div class="rail-card">
          <div class="rail-title">Biriktirilgan vazifalar</div>
          <div class="mini-stat-row">
            <div class="mini-stat"><div class="mini-stat-val num">${s.total}</div><div class="mini-stat-lbl">Jami</div></div>
            <div class="mini-stat"><div class="mini-stat-val num" style="color:var(--brand)">${s.inProgress}</div><div class="mini-stat-lbl">Jarayonda</div></div>
            <div class="mini-stat"><div class="mini-stat-val num" style="color:#16a34a">${s.done}</div><div class="mini-stat-lbl">Bajarildi</div></div>
          </div>
        </div>`;
      }
      function buildTodayTasksCardHtml() {
        const items = myOpenTasksToday();
        const today = isoOf(todayDate());
        let rowsHtml;
        if (items.length) {
          const VISIBLE_CAP = 5;
          rowsHtml = items
            .slice(0, VISIBLE_CAP)

                <div class="task-dot${overdue ? " overdue" : ""}"></div>

        return `<div class="rail-card">

          ${rowsHtml}
        </div>`;
      }
      function buildMyProgressCardHtml() {
        const mp = computeMyProjectsProgress();

        </div>`;
      }

      // Barcha belgilashlar shu bitta funksiyadan o'tadi (Tracker, bugungi
      // ro'yxat va tarix sheet'i). cycleId berilsa — yopilgan davr tuzatiladi.
      async function onCheck(projectSlug, type, num, checked, cycleId, extra) {
        const body = { projectSlug, type, seqNumber: num, checked };
        if (cycleId) body.cycleId = cycleId;
        if (extra) Object.assign(body, extra); // editorId, videographerId, workDate
        const res = await apiFetch("/api/checks", {
          method: "PATCH",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showToast("⚠ " + (data.error || "Xato"));
          throw new Error(data.error || "Xato");

        await loadProjects();
        histState.loaded = false;
        worklog = null; // tabel qayta yuklansin
        refreshAllViews();
        return data;
