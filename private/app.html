      // ── ADMIN: boshqa xodimga Ncoin qo'shish/ayirish ────────────────
      // Profil sahifasidan to'g'ridan-to'g'ri — avval faqat bir martalik
      // skriptlar bilan qilinardi, endi doimiy UI. Ledger'ga oddiy
      // "admin_adjustment" yozuvi sifatida tushadi (Ncoin tarixida ham
      // shu nom bilan ko'rinadi), xodimga Telegram orqali xabar boradi.
      function pfNcoinGiftCardHtml() {
        return `<div class="pf-card">
          <div class="pf-card-hdr">Xodimga Ncoin qo'shish</div>
          <div class="pf-card-body">
            <div class="f-group">
              <label class="f-label">Xodim</label>
              <select class="f-input" id="pf-gift-user"><option value="">Yuklanmoqda…</option></select>
            </div>
            <div class="f-group">
              <label class="f-label">Miqdor (ayirish uchun manfiy son, masalan -2)</label>
              <input class="f-input" type="number" step="0.1" id="pf-gift-amount" placeholder="masalan: 5"/>
            </div>
            <div class="f-group" style="margin-bottom:0">
              <label class="f-label">Izoh (ixtiyoriy, xabarga qo'shiladi)</label>
              <input class="f-input" id="pf-gift-note" placeholder="Masalan: Bonus uchun"/>
            </div>
            <button type="button" class="btn btn-blue" id="pf-gift-btn" style="margin-top:12px" onclick="pfSubmitNcoinGift()">Yuborish</button>
          </div>
        </div>`;
      }
      async function pfLoadGiftUserOptions() {
        const sel = document.getElementById("pf-gift-user");
        if (!sel) return;
        try {
          const res = await apiFetch("/api/users/directory");
          const users = res.ok ? (await res.json()).users || [] : [];
          sel.innerHTML =
            `<option value="">— Tanlang —</option>` +
            users.map((u) => `<option value="${escArg(u.username)}">${escHtml(userDisplayLabel(u))}</option>`).join("");
        } catch (e) {
          sel.innerHTML = `<option value="">Yuklab bo'lmadi</option>`;
        }
      }
      async function pfSubmitNcoinGift() {
        const username = document.getElementById("pf-gift-user")?.value;
        const amountInput = document.getElementById("pf-gift-amount");
        const noteInput = document.getElementById("pf-gift-note");
        const amount = Number(amountInput?.value);
        if (!username) return showToast("⚠ Xodimni tanlang");
        if (!amountInput?.value || !Number.isFinite(amount) || amount === 0) return showToast("⚠ Miqdorni kiriting");
        const btn = document.getElementById("pf-gift-btn");
        setBtnLoading(btn, true, "Yuborilmoqda…");
        try {
          const res = await apiFetch("/api/ncoin/admin/adjust", {
            method: "POST",
            body: JSON.stringify({ username, amount, note: noteInput?.value.trim() }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Xato");
          showToast(`✅ ${data.name}ga ${amount > 0 ? "+" : ""}${fmtNcoin(amount)} Ncoin yuborildi`);
          if (amountInput) amountInput.value = "";
          if (noteInput) noteInput.value = "";
          if (myProfile?.username === username || currentUser === username) {
            const ncoinRes = await apiFetch("/api/ncoin/me");
            if (ncoinRes.ok) {
              pfNcoinData = await ncoinRes.json();
              renderProfilePage();
            }
          }
        } catch (e) {
          showToast("⚠ " + e.message);
        } finally {
          setBtnLoading(btn, false);
        }
      }

      function pfNcoinHistoryCardHtml() {
        const rows = (pfNcoinData?.transactions || []).slice(0, 5);
        return `<div class="pf-card">
          <div class="pf-card-hdr" style="display:flex;align-items:center;gap:10px">
            <span style="flex:1">Ncoin tarixi</span>
            <button type="button" class="act-card-link" style="height:28px;padding:0 10px;font-size:11.5px" onclick="openNcoinHistorySheet()">Barchasi</button>

          ${
            rows.length
              ? rows.map((t) => ncoinHistoryRowHtml(t, "12px 20px")).join("")

          }

      function pfTasksCardHtml() {

          <div class="pf-card-hdr">Biriktirilgan vazifalar</div>
          <div class="pf-card-body">

              <div class="pf-tasks-stat"><b style="color:#16a34a">${s.done}</b><span>Bajarildi</span></div>
            </div>
            ${
              s.total
                ? `<div class="pf-tasks-track">
                     <div class="pf-tasks-track-done" style="width:${donePct}%"></div>
                     <div class="pf-tasks-track-progress" style="width:${progressPct}%"></div>

            }

        return `<div class="pf-card">

            <span style="flex:1">Loyihalar tarixi</span>
            <button type="button" class="act-card-link" style="height:28px;padding:0 10px;font-size:11.5px" onclick="pfGoToHistory()">Ochish</button>
          </div>

      function pfUploadAvatarStub() {

      function pfToggleDarkMode() {

        document.getElementById("pf-toggle-track")?.classList.toggle("on", next === "dark");

      // ── Saqlanmagan o'zgarishlar ──────────────────────────────────
      function pfCollectValues() {
        return {
          "pf-first": document.getElementById("pf-first")?.value.trim() || "",
          "pf-last": document.getElementById("pf-last")?.value.trim() || "",
          "pf-phone": document.getElementById("pf-phone")?.value.trim() || "",
          "pf-job": document.getElementById("pf-job")?.value.trim() || "",
          "pf-birth": document.getElementById("pf-birth")?.value || "",
        };
      }
      function pfCheckDirty() {
        if (!pfOriginalValues) return;
        const current = pfCollectValues();
        const changed = Object.keys(current).filter((k) => current[k] !== pfOriginalValues[k]);
        pfUpdateSaveBar(changed);
      }
      function pfUpdateSaveBar(changedKeys) {
        const bar = document.getElementById("pf-savebar");
        if (!bar) return;
        if (!changedKeys.length) {
          bar.classList.remove("show");
          return;
        }
        bar.classList.add("show");
        document.getElementById("pf-savebar-fields").textContent = changedKeys
          .map((k) => PF_FIELD_LABELS[k] || k)
          .join(", ");
      }
      function pfCancelChanges() {
        if (!pfOriginalValues) return;
        document.getElementById("pf-first").value = pfOriginalValues["pf-first"];
        document.getElementById("pf-last").value = pfOriginalValues["pf-last"];
        document.getElementById("pf-phone").value = pfOriginalValues["pf-phone"];
        document.getElementById("pf-job").value = pfOriginalValues["pf-job"];
        document.getElementById("pf-birth").value = pfOriginalValues["pf-birth"];
        pfUpdateSaveBar([]);
      }
      async function pfSaveProfile() {
        const btn = document.getElementById("pf-save-btn");
        const values = pfCollectValues();
        const body = {
          firstName: values["pf-first"],
          lastName: values["pf-last"],
          phone: values["pf-phone"],
          jobTitle: values["pf-job"],
          birthDate: values["pf-birth"] || null,
        };
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Saqlanmoqda…";
        }
        try {
          const res = await apiFetch("/api/me", { method: "PATCH", body: JSON.stringify(body) });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          showToast("✅ Profil saqlandi");
          const meRes = await apiFetch("/api/me");
          if (meRes.ok) myProfile = (await meRes.json()).user;
          renderProfilePage();
        } catch (e) {
          showToast("⚠ " + e.message);
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Saqlash";
          }
        }
      }

      // ── NSHOP (Ncoin gamifikatsiya) ────────────────────────────────
      // Har bir bajarilgan post/stories/vazifa uchun 0.5 Ncoin beriladi
      // (backend, PATCH /api/checks va PATCH /api/tasks/:id ichida).
      // Bu yerda faqat ko'rsatish/xarid — hisob-kitobning o'zi
      // backend'da (ledger, netlify/functions/lib/ncoin.js).
      let nshopProducts = [];
      let nshopBalance = 0;
      let nshopMe = null;

      function nshopSkeletonHtml(count) {
        const card = `<div class="nshop-card">
          <div class="nshop-skel-img"></div>
          <div class="nshop-skel-line" style="width:75%"></div>
          <div class="nshop-skel-line" style="width:45%;margin-top:7px;margin-bottom:11px"></div>
        </div>`;
        return `<div class="nshop-grid">${card.repeat(count)}</div>`;
      }
      async function renderNShopScreen() {
        const c = document.getElementById("nshop-body");
        c.innerHTML = nshopSkeletonHtml(4);
        try {
          const [prodRes, meRes] = await Promise.all([
            apiFetch("/api/ncoin/products"),
            apiFetch("/api/ncoin/me"),
          ]);
          const prodData = await prodRes.json();
          const meData = await meRes.json();
          if (!prodRes.ok) throw new Error(prodData.error || "Xatolik");
          if (!meRes.ok) throw new Error(meData.error || "Xatolik");
          nshopProducts = prodData.products || [];
          nshopBalance = meData.balance || 0;
          nshopMe = meData;
        } catch (e) {
          c.innerHTML = `<div style="color:var(--red);font-size:12px;padding:16px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        renderNShopBody();
      }

      function renderNShopBody() {
        document.getElementById("nshop-summary").textContent = `${nshopProducts.length} mahsulot mavjud · qoldiq real vaqtda`;
        document.getElementById("nshop-balance-pill").innerHTML =
          `<span class="n-badge" style="width:17px;height:17px;font-size:10px">N</span>${fmtNcoin(nshopBalance)}`;
        const c = document.getElementById("nshop-body");
        const debtBannerHtml = nshopMe?.debtBlocked
          ? `<div style="display:flex;gap:10px;align-items:flex-start;background:var(--red-bg);color:var(--red);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.55">
              <span style="flex:none">🥶</span>
              <span><b>"${escHtml(nshopMe.debtProjectLabel)}" loyihasi qarzda</b> — shu loyihadagi ishingiz (post/stories) muddatidan kechikmoqda. Qarz yopilmaguncha NShopdan xarid qila olmaysiz.</span>
            </div>`
          : "";
        c.innerHTML = `
          ${debtBannerHtml}
          ${
            nshopProducts.length
              ? `<div class="nshop-grid">${nshopProducts.map(nshopCardHtml).join("")}</div>
                 <div class="f-hint" style="margin-top:14px;padding:0 2px">Ncoin post/stories va vazifalarni bajarganingiz uchun avtomatik beriladi. Mahsulotni ofis oshxonasidan olib ketasiz.</div>`
              : `<div class="empty"><div class="empty-s">Hozircha mahsulot yo'q</div></div>`
          }
          ${nshopBottomSectionHtml()}`;
      }

      function nshopBottomSectionHtml() {
        const purchases = (nshopMe?.transactions || []).filter((t) => t.reason === "purchase");
        const shown = purchases.slice(0, 6);
        return `
          <div class="nshop-bottom-grid">
            <div class="nshop-panel">
              <div class="nshop-panel-hdr">
                <div class="nshop-panel-title">Oxirgi xaridlarim</div>
                <div class="nshop-panel-sub">${purchases.length} ta${purchases.length ? " · " + fmtNcoin(nshopMe?.spent || 0) + " Ncoin" : ""}</div>
              </div>
              ${
                shown.length
                  ? shown
                      .map(
                        (t) => `<div class="nshop-purchase-row">
                          ${nshopThumbHtml(t.productImageUrl, "width:40px;height:40px;border-radius:10px")}
                          <div style="flex:1;min-width:0">
                            <div class="nshop-purchase-name">${escHtml(t.productName || "Mahsulot")}</div>
                            <div class="nshop-purchase-date">${fmtDay(new Date(t.at))}</div>
                          </div>
                          <div class="nshop-purchase-amt">−${fmtNcoin(-t.amount)}</div>
                        </div>`,
                      )
                      .join("")
                  : `<div class="nshop-purchase-row"><div class="f-hint" style="margin:0">Hali xarid qilmagansiz</div></div>`
              }
            </div>
            <div class="nshop-stats-card">
              <div class="nshop-stats-blob"></div>
              <div class="nshop-stats-label">Ncoin balansi</div>
              <div class="nshop-stats-value">${fmtNcoin(nshopBalance)}</div>
              <div class="nshop-stats-row">
                <div class="nshop-stats-item"><b>${fmtNcoin(nshopMe?.earned || 0)}</b><span>Topilgan</span></div>
                <div class="nshop-stats-item"><b>${fmtNcoin(nshopMe?.spent || 0)}</b><span>Ishlatilgan</span></div>
                <div class="nshop-stats-item"><b>${nshopMe?.purchaseCount || 0}</b><span>Xarid</span></div>
              </div>
            </div>
          </div>`;
      }

      function fmtNcoin(n) {
        const v = Number(n) || 0;
        return Number.isInteger(v) ? String(v) : v.toFixed(1);
      }

      // Mahsulot/xarid rasmi — bor bo'lsa asta ko'rinadigan (fade-in)
      // <img> (yuklanish paytida chizilgan fon "skelet" bo'lib turadi),
      // yo'q bo'lsa doimiy chizilgan placeholder. `sizeStyle` bo'sh
      // bo'lsa katta grid-karta o'lchami (.nshop-img-placeholder
      // standart qiymatlari) ishlatiladi, aks holda kichik tarix/jadval
      // qatorlari uchun aniq o'lcham beriladi.
      function nshopThumbHtml(url, sizeStyle) {
        const style = sizeStyle || "";
        if (!url) return `<div class="nshop-img-placeholder" style="${style}"><span>rasm</span></div>`;
        return `<div class="nshop-img-placeholder" style="${style};padding:0;overflow:hidden">
          <img src="${escArg(url)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s ease" onload="this.style.opacity='1'"/>
        </div>`;
      }

      function nshopCardHtml(p) {
        const debtBlocked = !!nshopMe?.debtBlocked;
        const canAfford = !debtBlocked && nshopBalance >= p.price && p.stock > 0;
        const low = p.stock > 0 && p.stock <= 5;
        const btnLabel = debtBlocked ? "Loyiha qarzda" : p.stock <= 0 ? "Tugagan" : canAfford ? "Sotib olish" : "Yetarli emas";
        return `
          <div class="nshop-card">
            ${nshopThumbHtml(p.image_url, "")}
            <div class="nshop-card-body">
              <div class="nshop-card-name">${escHtml(p.name)}</div>
              <div class="nshop-card-row">
                <span class="n-badge" style="width:20px;height:20px;font-size:13px">N</span>
                <span class="nshop-coin-price">${fmtNcoin(p.price)}</span>
                <span style="flex:1"></span>

      // `filter`: "all" | "earned" (faqat topilgan) | "spent" (faqat
      // sarflangan) — bitta sheet ichida almashtiriladi, ma'lumot bir
      // marta yuklanadi (ncoinHistoryState.data), faqat ro'yxat va
      // yuqoridagi summary filtrga qarab qayta chiziladi.
      let ncoinHistoryState = null;
      async function openNcoinHistorySheet() {

        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        try {

      function setNcoinHistoryFilter(filter) {

      function renderNcoinHistorySheet() {

        // Tartib: raqamlar (balans + "Barchasi"da uchta quticha) eng
        // tepada, filtr tugmalari ular ostida — ro'yxatga bevosita
        // yopishib, "shu tugmalar ro'yxatni boshqaradi" aniq ko'rinishi

          </div>`;
        } else {

            <div style="text-align:center;padding:4px 0 4px">
              <div class="f-hint" style="margin:0">Joriy balans</div>

            </div>
            <div class="mini-stat-row" style="margin:14px 0 20px">
              <div class="mini-stat"><div class="mini-stat-val" style="color:#16a34a">${fmtNcoin(data.earned)}</div><div class="mini-stat-lbl">Topilgan</div></div>
              <div class="mini-stat"><div class="mini-stat-val" style="color:var(--red)">${fmtNcoin(data.spent)}</div><div class="mini-stat-lbl">Ishlatilgan</div></div>
              <div class="mini-stat"><div class="mini-stat-val">${data.purchaseCount}</div><div class="mini-stat-lbl">Xarid</div></div>

        const emptyLabel =
          filter === "earned" ? "Hali coin topilmagan" : filter === "spent" ? "Hali xarajat yo'q" : "Hali harakat yo'q";

        body.innerHTML = `

            shown.length
              ? `<div class="list-card">${shown.map((t) => ncoinHistoryRowHtml(t)).join("")}</div>`

          }`;

      // ── FAOLLIK — umumiy hisob-kitob ─────────────────────────────
      // Dizayner TZ'siga asoslangan: bitta ko'k rangning 5 pog'onasi
      // (foydalanuvchining o'z o'rtachasiga nisbatan), Panelda qisqa
      // karta + to'liq sheet — bitta manba, ikki o'lcham. Barcha
      // hisob-kitob frontendda — backend faqat xom vaqt-belgilarni
      // qaytaradi (/api/activity-stats).

      // Xom ma'lumotdan "kun -> shu kungi harakatlar soni" xaritasini
      // quradi (butun tarix bo'yicha — pog'ona chegarasi shundan
      // hisoblanadi, ko'rsatilgan davrdan qat'i nazar barqaror bo'lishi
      // uchun).
      function buildActivityDayCounts(data) {
        const counts = {};
        data.checks.forEach((c) => {
          const key = isoOf(new Date(c.doneAt));
          const row = (counts[key] ||= { count: 0, content: 0, tasks: 0 });
          row.count++;
          row.content++;
        });
        data.taskEvents.forEach((t) => {
          const key = isoOf(new Date(t.createdAt));
          const row = (counts[key] ||= { count: 0, content: 0, tasks: 0 });
          row.count++;
          row.tasks++;
        });
        return counts;
      }
      // 3.2-band: pog'ona — o'z faol-kun o'rtachasiga nisbatan (kam
      // ishlaydigan xodimning grafigi ham "bo'sh" ko'rinmasin deb).
      // Faol kunlar 14 tadan kam bo'lsa (yangi xodim), jamoa o'rtachasi
      // ishlatiladi.
      function activityLevelFn(dayCounts, teamAvg) {
        const activeCounts = Object.values(dayCounts)
          .map((r) => r.count)
          .filter((c) => c > 0);
        const avg =
          activeCounts.length >= 14
            ? activeCounts.reduce((a, b) => a + b, 0) / activeCounts.length
            : teamAvg || 1;
        return (n) => {
          if (n === 0) return 0;
          if (n <= avg * 0.5) return 1;
          if (n <= avg) return 2;
          if (n <= avg * 1.75) return 3;
          return 4;
        };
      }
      // [start,end] oralig'idagi HAR BIR kun (bo'sh kunlar ham). `dataEnd`dan
      // keyingi kunlar "future" deb belgilanadi — ular uchun katak
      // butunlay chizilmaydi (0-pog'ona bilan aralashmasin, 3.4-band).
      function buildActivityDayRange(start, end, dataEnd, dayCounts) {
        const days = [];
        const totalDays = Math.max(0, daysBetween(start, end)) + 1;
        for (let i = 0; i < totalDays; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          const key = isoOf(d);
          const future = d > dataEnd;
          const row = dayCounts[key] || { count: 0, content: 0, tasks: 0 };
          days.push({
            date: d,
            key,
            count: future ? 0 : row.count,
            content: row.content,
            tasks: row.tasks,
            future,
            level: 0,
          });
        }
        return days;
      }
      // "year" (Panel qisqa kartasi — 1-yanvar/31-dekabr, joriy yilda
      // bugungacha) yoki "all"/"90d"/"30d" (to'liq sheet davr filtri).
      function resolveActivityRange(mode, year) {
        const today = todayDate();
        if (mode === "year") {
          const start = new Date(year, 0, 1);
          const end = new Date(year, 11, 31);
          const isCurrent = year === today.getFullYear();
          return { start, end, dataEnd: isCurrent ? today : end, includesToday: isCurrent };
        }
        if (mode === "90d" || mode === "30d") {
          const n = mode === "90d" ? 89 : 29;
          const start = new Date(today);
          start.setDate(start.getDate() - n);
          return { start, end: today, dataEnd: today, includesToday: true };
        }
        return { start: null, end: today, dataEnd: today, includesToday: true }; // "all" — start joined_atdan to'ldiriladi
      }
      // Streak — bugundan (yoki bugun hali bo'sh bo'lsa, kechadan) orqaga
      // qarab uzluksiz faol kunlar. Yakshanba qatorni UZMAYDI (dam olish
      // kuni), lekin davom ham ettirmaydi.
      function computeActivityStreaks(days, includesToday) {
        let longest = 0,
          run = 0,
          longestMonthIdx = null;
        days.forEach((d) => {
          if (d.future) return;
          if (d.count > 0) {
            run++;
            if (run > longest) {
              longest = run;
              longestMonthIdx = d.date.getMonth();
            }
          } else if (d.date.getDay() !== 0) {
            run = 0;
          }
        });
        let current = null;
        if (includesToday) {
          current = 0;
          let idx = days.length - 1;
          while (idx >= 0 && days[idx].future) idx--;
          if (days[idx] && days[idx].count === 0 && days[idx].date.getDay() !== 0) idx--;
          while (idx >= 0) {
            if (days[idx].count > 0) {
              current++;
              idx--;
            } else if (days[idx].date.getDay() === 0) {
              idx--;
            } else break;
          }
        }
        return { current, longest, longestMonth: longestMonthIdx != null ? MONTHS[longestMonthIdx] : null };
      }
      function computeActivityStats(data, days, includesToday) {
        const rangeStart = days[0].key;
        const rangeEnd = days[days.length - 1].key;
        const inRange = (iso) => iso >= rangeStart && iso <= rangeEnd;
        const checksInRange = data.checks.filter((c) => inRange(isoOf(new Date(c.doneAt))));
        const tasksInRange = data.taskEvents.filter((t) => inRange(isoOf(new Date(t.createdAt))));

        const streaks = computeActivityStreaks(days, includesToday);
        const realDays = days.filter((d) => !d.future);
        const activeDays = realDays.filter((d) => d.count > 0).length;

        const posts = checksInRange.filter((c) => c.type === "k").length;
        const stories = checksInRange.filter((c) => c.type === "s").length;

        const hourCounts = new Array(24).fill(0);
        checksInRange.forEach((c) => hourCounts[new Date(c.doneAt).getHours()]++);
        tasksInRange.forEach((t) => hourCounts[new Date(t.createdAt).getHours()]++);
        let peakHour = -1,
          peakHourN = 0;
        hourCounts.forEach((n, h) => {
          if (n > peakHourN) {
            peakHourN = n;
            peakHour = h;
          }
        });

        const projCounts = {};
        checksInRange.forEach((c) => {
          if (c.projectLabel) projCounts[c.projectLabel] = (projCounts[c.projectLabel] || 0) + 1;
        });
        let topProject = null,
          topProjectN = 0;
        Object.entries(projCounts).forEach(([label, n]) => {
          if (n > topProjectN) {
            topProjectN = n;
            topProject = label;
          }
        });

        let peakDay = null;
        realDays.forEach((d) => {
          if (!peakDay || d.count > peakDay.count) peakDay = d;
        });
        if (peakDay && peakDay.count === 0) peakDay = null;

        return {
          activeDays,
          totalDays: realDays.length,
          currentStreak: streaks.current,
          longestStreak: streaks.longest,
          longestStreakMonth: streaks.longestMonth,
          contentDone: posts + stories,
          posts,
          stories,
          taskActions: tasksInRange.length,
          peakHourLabel: peakHour < 0 ? "—" : `${String(peakHour).padStart(2, "0")}:00`,
          topProject,
          peakDay,
        };
      }
      // Ikkalasi (qisqa karta va to'liq sheet) shu bitta funksiyani
      // chaqiradi — faqat `mode`/`year` farq qiladi.
      function prepareActivityView(data, mode, year) {
        const dayCounts = buildActivityDayCounts(data);
        const joined = parseISO(isoOf(new Date(data.user.joinedAt)));
        const lifetimeActiveDays = Object.values(dayCounts).filter((r) => r.count > 0).length;
        const levelFn = activityLevelFn(dayCounts, data.teamAvgDailyActivity);

        const range = resolveActivityRange(mode, year);
        if (mode === "all") range.start = joined;
        if (range.start < joined) range.start = joined;

        const days = buildActivityDayRange(range.start, range.end, range.dataEnd, dayCounts);
        days.forEach((d) => {
          if (!d.future) d.level = levelFn(d.count);
        });

        const stats = computeActivityStats(data, days, range.includesToday);
        return { days, stats, lifetimeActiveDays, joined };
      }
      function tenureLabel(totalDays) {
        if (totalDays < 30) return `${totalDays} kun`;
        return `${Math.max(1, Math.round(totalDays / 30.44))} oy`;
      }

      // ── Heatmap to'ri — GitHub uslubida, oy/hafta-kuni yorliqlari
      // bilan. `opts.mini` — Panel kartasi yopilganda ko'rinadigan bitta
      // qatorli qisqartirilgan sparkline (haqiqiy to'r emas).
      function buildActivityHeatmapHtml(days, opts = {}) {
        const cellSize = opts.cellSize || 14;
        const gap = opts.gap || 3;
        const cellStyle = `width:${cellSize}px;height:${cellSize}px;border-radius:${Math.max(2, Math.round(cellSize * 0.22))}px`;

        if (opts.mini) {
          // "year" ko'rinishi kelajak (hali kelmagan) kunlar bilan
          // Dekabrgacha to'ldirilgan bo'lishi mumkin — sparklineda
          // ENG SO'NGGI HAQIQIY (o'tgan) kunlar ko'rinishi kerak, aks
          // holda oxirgi N kun bo'sh (kelajak) chiqib qolardi.
          const strip = days.filter((d) => !d.future).slice(-21);
          const cells = strip
            .map((d) => `<div class="act-cell${d.future ? " act-future" : ""}" style="width:7px;height:7px;border-radius:2px;background:${d.future ? "transparent" : `var(--act-lvl-${d.level})`}"></div>`)
            .join("");
          return `<div class="act-heat-mini">${cells}</div>`;
        }

        const weekdayFull = ["Dush", "Se", "Chor", "Pay", "Jum", "Sha", "Yak"];
        const weekdayShown = opts.mobile ? [0, 2, 4] : [0, 2, 4, 6];
        const firstDow = (days[0].date.getDay() + 6) % 7; // 0 = Dushanba
        const padded = new Array(firstDow).fill(null).concat(days);
        const weeks = [];
        for (let i = 0; i < padded.length; i += 7) weeks.push(padded.slice(i, i + 7));

        // Oy yorlig'i — har hafta ustuniga bittadan tor yorliq emas,
        // dizayn namunasidagi kabi: har oyga tegishli barcha hafta
        // ustunlari kengligicha BITTA CHO'ZILGAN yorliq (o'sha oyning
        // kataklari ustida to'liq turadi, o'qish osonroq).
        const weekStep = cellSize + gap;
        const monthSegments = [];
        weeks.forEach((week) => {
          const firstReal = week.find((d) => d);
          const monthIdx = firstReal ? firstReal.date.getMonth() : null;
          const last = monthSegments[monthSegments.length - 1];
          if (last && last.monthIdx === monthIdx) last.count++;
          else monthSegments.push({ monthIdx, count: 1 });
        });
        const monthCellsHtml = monthSegments
          .map((seg) => {
            const label = seg.monthIdx != null ? MONTHS[seg.monthIdx].slice(0, 3) : "";
            return `<div class="act-heat-monthcell" style="width:${seg.count * weekStep}px">${label}</div>`;
          })
          .join("");
        const weekdayColHtml = weekdayFull
          .map((lbl, i) => `<div class="act-heat-wdcell" style="height:${cellSize}px">${weekdayShown.includes(i) ? lbl : ""}</div>`)
          .join("");
        const cellsHtml = padded
          .map((d) => {
            if (!d) return `<div class="act-cell act-empty" style="${cellStyle}"></div>`;
            if (d.future) return `<div class="act-cell act-future" style="${cellStyle}"></div>`;
            const isPeak = opts.peakKey && d.key === opts.peakKey;
            const tipLine1 = `${fmtDay(d.date)} · ${d.count === 0 ? "harakat yo'q" : d.count + " harakat"}`;
            const tipLine2 = d.count > 0 ? `${d.content} post/stories · ${d.tasks} vazifa` : "";
            const tip = [tipLine1, tipLine2].filter(Boolean).join("|");
            return `<div class="act-cell${isPeak ? " act-peak" : ""}" style="${cellStyle};background:var(--act-lvl-${d.level})" data-tip="${escHtml(tip)}" onmouseenter="showActivityTooltip(this)" onmouseleave="hideActivityTooltip()" onclick="event.stopPropagation();showActivityTooltip(this)"></div>`;
          })
          .join("");

        return `<div class="act-heat-scroll">
          <div class="act-heat-wrap" style="grid-template-columns:auto 1fr">
            <div class="act-heat-corner"></div>
            <div class="act-heat-monthrow">${monthCellsHtml}</div>
            <div class="act-heat-wdcol" style="gap:${gap}px">${weekdayColHtml}</div>
            <div class="act-heat-grid" style="grid-template-rows:repeat(7,${cellSize}px);gap:${gap}px">${cellsHtml}</div>
          </div>
        </div>`;
      }
      function scrollActivityToEnd(root) {
        const el = root.querySelector(".act-heat-scroll");
        if (el) el.scrollLeft = el.scrollWidth;
      }
      function activityLegendScaleHtml() {
        return `<div class="act-legend-scale">
          <span>Kam</span>
          <span class="act-legend-swatch" style="background:var(--act-lvl-0)"></span>
          <span class="act-legend-swatch" style="background:var(--act-lvl-1)"></span>
          <span class="act-legend-swatch" style="background:var(--act-lvl-2)"></span>
          <span class="act-legend-swatch" style="background:var(--act-lvl-3)"></span>
          <span class="act-legend-swatch" style="background:var(--act-lvl-4)"></span>
          <span>Ko'p</span>
        </div>`;
      }
      function showActivityTooltip(el) {
        const lines = (el.dataset.tip || "").split("|").filter(Boolean);
        if (!lines.length) return;
        let tip = document.getElementById("act-tooltip");
        if (!tip) {
          tip = document.createElement("div");
          tip.id = "act-tooltip";
          tip.className = "act-tooltip";
          document.body.appendChild(tip);
        }
        tip.innerHTML = lines.map((l) => `<div>${escHtml(l)}</div>`).join("");
        const r = el.getBoundingClientRect();
        tip.style.left = `${r.left + r.width / 2}px`;
        tip.style.top = `${r.top - 8}px`;
        tip.classList.add("show");
      }
      function hideActivityTooltip() {
        document.getElementById("act-tooltip")?.classList.remove("show");
      }
      document.addEventListener("click", () => hideActivityTooltip());

      // ── Panel qisqa kartasi ───────────────────────────────────────
      function getActivityCollapsed() {
        try {
          return localStorage.getItem(`activity_card_collapsed:${currentUser}`) === "1";
        } catch (e) {
          return false;
        }
      }
      function toggleActivityCard() {
        const next = !getActivityCollapsed();
        try {
          localStorage.setItem(`activity_card_collapsed:${currentUser}`, next ? "1" : "0");
        } catch (e) {}
        renderToday();
      }
      function setActivityPanelYear(y) {
        activityPanelYear = parseInt(y, 10);
        renderToday();
      }
      // Yig'ish/kengaytirish tugmasidagi burchak ikonka — dizayn
      // namunasidagi texnika (chiziq-burchak, rotate bilan yo'nalish
      // beriladi), matn belgisi emas.
      function activityChevronIconHtml(direction) {
        const deg = direction === "up" ? 135 : -45;
        const mt = direction === "up" ? 2 : -2;
        return `<div class="act-chevron-icon" style="transform:rotate(${deg}deg);margin-top:${mt}px"></div>`;
      }
      // Yig'ilgan qatordagi ikonka — 2×2 rangli nuqtalar (heatmap
      // g'oyasining o'zi, emoji emas).
      function activityMiniIconHtml() {
        return `<div class="act-card-mini-ico">
          <div class="act-mini-dot" style="background:var(--act-lvl-4)"></div>
          <div class="act-mini-dot" style="background:var(--act-lvl-2)"></div>
          <div class="act-mini-dot" style="background:var(--act-lvl-3)"></div>
          <div class="act-mini-dot" style="background:var(--act-lvl-4)"></div>
        </div>`;
      }
      // `mobile` — chaqiruvchi kontekst (mobile-only yoki desktop-only
      // blokdan) aniq beriladi, funksiya ikkalasini ham qurib CSS bilan
      // yashirmaydi — chunki joylashuvning o'zi (heatmap yonida vertikal
      // panjara / mobilda alohida qator) tubdan farq qiladi.
      function buildActivityPanelCardHtml(mobile) {
        if (!myActivity) return "";
        const today = todayDate();
        const year = activityPanelYear || today.getFullYear();
        const { days, stats, lifetimeActiveDays, joined } = prepareActivityView(myActivity, "year", year);
        const isCurrentYear = year === today.getFullYear();
        const noActivityEver = lifetimeActiveDays === 0;
        const isNewEmployee = lifetimeActiveDays > 0 && lifetimeActiveDays < 14;
        const yearOptions = [];
        for (let y = today.getFullYear(); y >= joined.getFullYear(); y--) yearOptions.push(y);
        const periodLabel = isCurrentYear ? `Oxirgi ${today.getMonth() + 1} oy` : `${year}`;

        if (getActivityCollapsed()) {
          return `<div class="act-card act-card-collapsed" onclick="toggleActivityCard()">
            ${activityMiniIconHtml()}
            <div style="min-width:0">
              <div class="act-card-title" style="font-size:14px">Mening faolligim</div>
              <div class="act-card-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${stats.activeDays} faol kun · streak ${stats.currentStreak ?? 0} kun · ${stats.contentDone} belgilangan</div>
            </div>
            <div class="act-card-collapsed-spark">${buildActivityHeatmapHtml(days, { mini: true })}</div>
            <div class="act-card-period-lbl">${periodLabel}</div>
            <button type="button" class="act-card-toggle" title="Kengaytirish">${activityChevronIconHtml("down")}</button>
          </div>`;
        }

        if (noActivityEver) {
          return `<div class="act-card">
            <div class="act-card-hdr">
              <div class="act-card-title">Mening faolligim</div>
              <button type="button" class="act-card-toggle" onclick="toggleActivityCard()" title="Yig'ish">${activityChevronIconHtml("up")}</button>
            </div>
            <div class="f-hint" style="padding:0 22px 18px">Hali faollik yo'q — birinchi harakatingiz shu yerda ko'rinadi.</div>
          </div>`;
        }

        const yearSwitcherHtml = mobile
          ? `<select class="act-year-select" onchange="setActivityPanelYear(this.value)">${yearOptions.map((y) => `<option value="${y}"${y === year ? " selected" : ""}>${y}</option>`).join("")}</select>`
          : `<div class="seg" style="margin-top:0;width:${Math.max(1, yearOptions.length) * 52}px">${yearOptions.map((y) => `<button type="button" class="seg-btn${y === year ? " active" : ""}" onclick="setActivityPanelYear(${y})">${y}</button>`).join("")}</div>`;

        const heatHtml = buildActivityHeatmapHtml(
          days,
          mobile
            ? { cellSize: 11, gap: 3, mobile: true, peakKey: stats.peakDay?.key }
            : { cellSize: 16, gap: 4, mobile: false, peakKey: stats.peakDay?.key },
        );
        const footHtml = mobile
          ? `<div class="act-card-heat-foot act-card-heat-foot-mobile">${activityLegendScaleHtml()}</div>`
          : `<div class="act-card-heat-foot">
          <div class="f-hint" style="margin:0;flex:1;min-width:140px">Har bir katak — bir kun. To'qligi shu kundagi harakatlar soni.</div>
          ${activityLegendScaleHtml()}
        </div>`;
        const newEmployeeNote = isNewEmployee
          ? `<div class="f-hint" style="margin-top:8px">Grafik ${fmtDay(joined)}dan boshlanadi. Bir-ikki haftadan keyin tendensiya ko'rinadi.</div>`
          : "";

        const statVal = (v, unit) => `${v}${unit ? ` ${unit}` : ""}`;
        const bodyHtml = mobile
          ? `<div>
              <div class="mini-stat-row act-card-stats-mobile">
                <div class="mini-stat"><div class="mini-stat-val">${stats.activeDays}</div><div class="mini-stat-lbl">Faol kunlar</div></div>
                <div class="mini-stat"><div class="mini-stat-val">${statVal(stats.currentStreak ?? "—", stats.currentStreak != null ? "kun" : "")}</div><div class="mini-stat-lbl">Joriy streak</div></div>
              </div>
              <div class="act-card-heat-col" style="padding:0 16px 16px">
                ${heatHtml}
                ${newEmployeeNote}
                ${footHtml}
              </div>
            </div>`
          : `<div class="act-card-body-split">
              <div class="act-card-heat-col">
                ${heatHtml}
                ${newEmployeeNote}
                ${footHtml}
              </div>
              <div class="act-card-stats-col">
                <div class="act-stat-row"><div class="act-stat-row-lbl">Joriy streak</div><div class="act-stat-row-val">${statVal(stats.currentStreak ?? "—", stats.currentStreak != null ? "kun" : "")}</div></div>
                <div class="act-stat-row"><div class="act-stat-row-lbl">Eng uzun streak</div><div class="act-stat-row-val">${isNewEmployee ? "—" : statVal(stats.longestStreak, "kun")}${!isNewEmployee && stats.longestStreakMonth ? `<span class="act-stat-row-cap">${stats.longestStreakMonth}</span>` : ""}</div></div>
                <div class="act-stat-row"><div class="act-stat-row-lbl">Belgilangan</div><div class="act-stat-row-val">${stats.contentDone}<span class="act-stat-row-cap">post, stories</span></div></div>
                <div class="act-stat-row"><div class="act-stat-row-lbl">Eng faol soat</div><div class="act-stat-row-val">${isNewEmployee ? "—" : stats.peakHourLabel}</div></div>
              </div>
            </div>`;

        return `<div class="act-card">
          <div class="act-card-hdr">
            <div style="min-width:0">
              <div class="act-card-title">Mening faolligim</div>
              <div class="act-card-sub">${periodLabel}${!mobile ? ` · ${stats.activeDays} faol kun` : ""}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
              ${yearSwitcherHtml}
              <button type="button" class="act-card-link" onclick="openActivityStats()">To'liq ko'rish</button>
              <button type="button" class="act-card-toggle" onclick="toggleActivityCard()" title="Yig'ish">${activityChevronIconHtml("up")}</button>
            </div>
          </div>
          ${bodyHtml}
        </div>`;
      }

      // ── To'liq ko'rinish (sheet/modal) ───────────────────────────
      // `username` berilmasa — o'zining faolligi. Berilsa — boshqa
      // xodimning faolligi (faqat admin, Ruxsatlar jadvalidagi xodim
      // qatoridan).
      let activitySheetState = null;
      async function openActivityStats(username) {
        const { body } = makeSheet(username ? "Faollik" : "Mening faolligim", { wide: true });
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        let data;
        try {
          const qs = username ? `?username=${encodeURIComponent(username)}` : "";
          const res = await apiFetch(`/api/activity-stats${qs}`);
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          data = await res.json();
        } catch (e) {
          body.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        activitySheetState = { body, data, username, mode: "all" };
        renderActivityStats();
      }
      function setActivitySheetRange(mode) {
        if (!activitySheetState) return;
        activitySheetState.mode = mode;
        renderActivityStats();
      }
      function renderActivityStats() {
        const { body, data, username, mode } = activitySheetState;
        const { days, stats, lifetimeActiveDays, joined } = prepareActivityView(data, mode, null);
        const today = todayDate();
        const tenure = tenureLabel(Math.max(0, daysBetween(joined, today)) + 1);
        const noActivityEver = lifetimeActiveDays === 0;
        const isNewEmployee = lifetimeActiveDays > 0 && lifetimeActiveDays < 14;

        const statVal = (v, unit) => `${v}${unit ? `<span style="font-size:12px;font-weight:500"> ${unit}</span>` : ""}`;
        const rangeChips = [
          ["all", "Hammasi"],
          ["90d", "90 kun"],
          ["30d", "30 kun"],
        ]
          .map(([m, lbl]) => `<button class="chip-btn${mode === m ? " active" : ""}" onclick="setActivitySheetRange('${m}')">${lbl}</button>`)
          .join("");

        let html = `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <div class="avatar" style="width:38px;height:38px;border-radius:11px;font-size:13px">${initials(data.user.name)}</div>
            <div style="min-width:0;flex:1">
              <div style="font-weight:600;font-size:15px">${escHtml(data.user.name)}</div>
              <div style="font-size:12px;color:var(--t3)">${data.user.jobTitle ? escHtml(data.user.jobTitle) + " · " : ""}${tenure}dan beri jamoada</div>
            </div>
          </div>
          <div class="chip-group" style="margin-bottom:16px">${rangeChips}</div>`;

        if (noActivityEver) {
          html += `<div class="empty"><div class="empty-s">Hali hech qanday faollik yo'q.</div>${
            username
              ? `<button type="button" class="btn btn-soft" style="width:auto;margin-top:10px;padding:8px 14px" onclick="this.closest('.overlay').remove();openNewTaskSheet()">Vazifa biriktirish</button>`
              : ""
          }</div>`;
          body.innerHTML = html;
          return;
        }

        html += `
          <div class="mini-stat-row" style="margin-bottom:8px">
            <div class="mini-stat"><div class="mini-stat-val">${stats.activeDays}</div><div class="mini-stat-lbl">Faol kunlar</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${stats.contentDone}</div><div class="mini-stat-lbl">Post/Stories</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${stats.taskActions}</div><div class="mini-stat-lbl">Vazifa harakati</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${statVal(stats.currentStreak ?? "—", stats.currentStreak != null ? "kun" : "")}</div><div class="mini-stat-lbl">Joriy streak</div></div>
          </div>
          <div class="mini-stat-row" style="margin-bottom:18px">
            <div class="mini-stat"><div class="mini-stat-val">${statVal(isNewEmployee ? "—" : stats.longestStreak, !isNewEmployee ? "kun" : "")}</div><div class="mini-stat-lbl">Eng uzun streak</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${isNewEmployee ? "—" : stats.peakHourLabel}</div><div class="mini-stat-lbl">Eng faol soat</div></div>
            <div class="mini-stat"><div class="mini-stat-val" style="font-size:14px;line-height:1.3">${escHtml(stats.topProject || "—")}</div><div class="mini-stat-lbl">Eng faol loyiha</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${tenure}</div><div class="mini-stat-lbl">Jamoada</div></div>
          </div>
          ${buildActivityHeatmapHtml(days, { cellSize: 14, gap: 3, mobile: false, peakKey: stats.peakDay?.key })}
          ${isNewEmployee ? `<div class="f-hint" style="margin-top:10px">Grafik ${fmtDay(joined)}dan boshlanadi. Bir-ikki haftadan keyin tendensiya ko'rinadi.</div>` : ""}
          <div style="display:flex;align-items:center;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd1);flex-wrap:wrap">
            <div class="f-hint" style="margin:0;flex:1;min-width:140px">Katak to'qligi — shu kundagi harakatlar soni.</div>
            ${activityLegendScaleHtml()}
          </div>`;
        body.innerHTML = html;
        scrollActivityToEnd(body);
      }
      // ── ONBOARDING (profil to'liq bo'lmasa, kirishda majburiy) ─────
      function showOnboarding() {
        const ov = document.createElement("div");
        ov.id = "onboarding-screen";
        ov.style.cssText =
          "position:fixed;inset:0;z-index:550;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto";
        ov.innerHTML = `
          <div style="background:var(--surf);border:1px solid var(--bd2);border-radius:16px;padding:28px 22px;max-width:360px;width:100%">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
              <div style="width:28px;height:28px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px">ND</div>
              <span style="font-size:13px;font-weight:600">Nasaf Digital</span>
            </div>
            <div style="font-size:17px;font-weight:600;margin-bottom:6px">Profilni to'ldiring</div>
            <div style="font-size:12.5px;color:var(--t2);line-height:1.6;margin-bottom:20px">Davom etishdan oldin quyidagi ma'lumotlarni kiriting.</div>
            <div class="f-row f-group">
              <div style="flex:1"><label class="f-label">Ism</label><input class="f-input" id="ob-first" onblur="formatNameInputOnBlur(this)"/></div>
              <div style="flex:1"><label class="f-label">Familiya</label><input class="f-input" id="ob-last" onblur="formatNameInputOnBlur(this)"/></div>
            </div>
            <div class="f-group"><label class="f-label">Telefon raqami</label><input class="f-input" id="ob-phone" placeholder="+998 90 123 45 67" oninput="formatPhoneInput(this)"/></div>
            <div class="f-group"><label class="f-label">Lavozimi</label><input class="f-input" id="ob-job" placeholder="SMM manager"/></div>
            <div class="f-group"><label class="f-label">Tug'ilgan sana (ixtiyoriy)</label><input class="f-input" type="date" id="ob-birth"/></div>
            <div id="ob-err" style="color:var(--red);font-size:12px;margin-bottom:10px"></div>
            <button class="btn btn-blue" id="ob-save-btn" onclick="submitOnboarding()">Davom etish</button>
          </div>`;
        document.body.appendChild(ov);
      }
      async function submitOnboarding() {
        const btn = document.getElementById("ob-save-btn");
        const errEl = document.getElementById("ob-err");
        const firstName = document.getElementById("ob-first")?.value.trim();
        const lastName = document.getElementById("ob-last")?.value.trim();
        const phone = document.getElementById("ob-phone")?.value.trim();
        const jobTitle = document.getElementById("ob-job")?.value.trim();
        const birthDate = document.getElementById("ob-birth")?.value || null;
        if (!firstName || !lastName || !phone || !jobTitle) {
          errEl.textContent = "Iltimos barcha majburiy maydonlarni to'ldiring.";
          return;
        }
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Saqlanmoqda…";
        }
        try {
          const res = await apiFetch("/api/me", {
            method: "PATCH",
            body: JSON.stringify({ firstName, lastName, phone, jobTitle, birthDate }),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          document.getElementById("onboarding-screen")?.remove();
          showTab("today");
        } catch (e) {
          errEl.textContent = e.message;
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Davom etish";
          }
        }
      }

      function openProjectEditSheet(slug) {
        const p = projects.find((x) => x.id === slug);
        if (!p) return;
        const { body } = makeSheet(`${escHtml(p.label)} — tahrirlash`);
        body.innerHTML = `
          <div class="f-group">
            <label class="f-label">Loyiha nomi</label>
            <input class="f-input" id="pe-label" value="${escHtml(p.label)}"/>
          </div>
          <div class="f-row f-group">
            <div style="flex:1">
              <label class="f-label">Post (K)</label>
              <input type="number" min="0" max="99" class="f-input" id="pe-k" value="${p.k}"/>
            </div>
            <div style="flex:1">
              <label class="f-label">Stories (S)</label>
              <input type="number" min="0" max="99" class="f-input" id="pe-s" value="${p.s}"/>
            </div>
          </div>
          <div class="f-group">
            <label class="f-label">Joriy davr boshlanish sanasi</label>
            ${renderDateFieldHtml("pe-period-start", p.periodStart, "Sana tanlang")}
            <div class="f-hint">Loyiha oyning o'rtasidan boshlangan bo'lsa, shu yerda tuzating — keyingi davrlar ham shu kundan hisoblanadi.</div>
          </div>
          <div class="f-group" style="display:flex;align-items:center;gap:9px">
            <input type="checkbox" id="pe-apply-now" style="width:17px;height:17px;flex-shrink:0" checked/>
            <label for="pe-apply-now" style="font-size:12.5px;font-weight:500;color:var(--ink)">Joriy davrga ham qo'llash</label>
          </div>
          <button class="btn btn-soft" style="margin-bottom:10px" onclick="document.querySelector('.overlay').remove();openProjectHistorySheet('${escArg(slug)}','${escArg(p.label)}')">Davrlar tarixi</button>
          <button class="btn btn-blue" id="pe-save-btn" onclick="saveProjectEdit('${escArg(slug)}')">Saqlash</button>`;
      }
      async function saveProjectEdit(slug) {
        const btn = document.getElementById("pe-save-btn");
        const label = document.getElementById("pe-label")?.value.trim();
        const k = parseInt(document.getElementById("pe-k")?.value) || 0;
        const s = parseInt(document.getElementById("pe-s")?.value) || 0;
        const applyToCurrentCycle =
          document.getElementById("pe-apply-now")?.checked;
        const periodStart = document.getElementById("pe-period-start")?.value;
        if (!label) {
          showToast("⚠ Loyiha nomi kerak");
          return;
        }
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Saqlanmoqda…";
        }
        try {
          const res = await apiFetch(`/api/projects/${slug}`, {
            method: "PUT",
            body: JSON.stringify({
              label,
              postsTarget: k,
              storiesTarget: s,
              applyToCurrentCycle,
              periodStart,
            }),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          await loadProjects();
          histState.loaded = false;
          refreshAllViews();
          document.querySelector(".overlay")?.remove();
          showToast("✅ Saqlandi!");
        } catch (e) {
          showToast("⚠ " + e.message);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Saqlash";
          }
        }
      }

      // Yopilgan davrlarni ochib, qarzni orqaga qaytib yopish mumkin
      // (PATCH /api/checks so'roviga cycleId qo'shiladi).
      async function openProjectHistorySheet(slug, label) {
        const { body } = makeSheet(`${escHtml(label)} — davrlar`);
        await refreshHistoryBody(body, slug);
      }
      async function refreshHistoryBody(body, slug) {
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        try {
          const res = await apiFetch(`/api/projects/${slug}/cycles`);
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          const d = await res.json();
          if (!d.cycles.length) {
            body.innerHTML = `<div class="empty"><div class="empty-t">Davrlar yo'q</div></div>`;
            return;
          }
          body.innerHTML = "";
          // Loyiha oy o'rtasidan boshlangan, lekin davr chegarasi
          // noto'g'ri (masalan to'liq kalendar-oy) qo'yilgani uchun
          // OXIRGI yopilgan davr adolatsiz "qarz" bilan yopilgan bo'lishi
          // mumkin. Buni faqat joriy davrda hali hech narsa
          // belgilanmagan holatda tuzatishga ruxsat beramiz (aks holda
          // ikki davrni "birlashtirish" noaniq bo'lib qoladi) — bu
          // fix-previous-cycle endpoint'ining o'zidagi shartlar bilan
          // bir xil.
          const activeCyc = d.cycles.find((c) => c.status === "active");
          const canFixPrev =
            activeCyc &&
            activeCyc.doneK === 0 &&
            activeCyc.doneS === 0 &&
            d.cycles.find((c) => c.status === "closed" && c.cycleIndex === activeCyc.cycleIndex - 1);
          d.cycles.forEach((cyc) => {
            const item = document.createElement("div");
            item.className = "cycle-item" + (cyc.isDebt ? " debt" : "");
            item.id = `cyc-${cyc.cycleId}`;
            const statusLabel =
              cyc.status === "active"
                ? "Joriy davr"
                : cyc.isDebt
                  ? "⚠ Qarz"
                  : "✓ To'liq yopilgan";
            const isFixable = canFixPrev && cyc.status === "closed" && cyc.cycleIndex === activeCyc.cycleIndex - 1;
            const fixHtml = isFixable
              ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bd1)">
                  <div class="f-label">Loyiha aslida boshqa kunda boshlangan bo'lsa</div>
                  ${renderDateFieldHtml("pf-fix-start-" + cyc.cycleId, cyc.periodStart, "Sana tanlang")}
                  <div class="f-hint">Agar shu sana bilan davr muddati hali o'tmagan bo'lsa, "qarz" belgisi olib tashlanadi.</div>
                  <button class="btn btn-blue btn-sm" style="margin-top:8px" onclick="submitFixPreviousCycle('${escArg(slug)}','${escArg(cyc.cycleId)}')">Saqlash</button>
                </div>`
              : "";
            item.innerHTML = `
              <div class="cycle-item-top" onclick="document.getElementById('cyc-${cyc.cycleId}').classList.toggle('open')">
                <div style="min-width:0">
                  <div class="cycle-item-label">${cyc.periodStart} – ${cyc.periodEnd}</div>
                  <div class="cycle-item-sub">${statusLabel} · K ${cyc.doneK}/${cyc.k} · S ${cyc.doneS}/${cyc.s}</div>
                </div>
                <div class="c-chev">▾</div>
              </div>
              <div class="cycle-item-body">
                ${
                  cyc.status === "active"
                    ? `<div style="font-size:11.5px;color:var(--t3);line-height:1.6">Bu joriy davr — belgilash uchun Tracker ekranidan foydalaning.</div>`
                    : `<div class="cb-section"><div class="cb-head"><span class="cb-badge">Post</span></div><div class="cb-row" id="hist-${cyc.cycleId}-k"></div></div>
                       <div class="cb-section"><div class="cb-head"><span class="cb-badge">Stories</span></div><div class="cb-row" id="hist-${cyc.cycleId}-s"></div></div>`
                }
                ${fixHtml}
              </div>`;
            body.appendChild(item);
            if (cyc.status !== "active") {
              buildHistoryCBs(body, slug, cyc.cycleId, cyc.k, "k", cyc.checks);
              buildHistoryCBs(body, slug, cyc.cycleId, cyc.s, "s", cyc.checks);
            }
          });
        } catch (e) {
          body.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
        }
      }
      function buildHistoryCBs(body, projectSlug, cycleId, count, type, checksMap) {
        const row = body.querySelector(`#hist-${cycleId}-${type}`);
        if (!row) return;
        row.innerHTML = "";
        for (let i = 1; i <= count; i++) {
          const lbl = document.createElement("label");
          lbl.className = "cbi";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!checksMap?.[`${type}-${i}`];
          cb.addEventListener("change", async () => {
            const openIds = [...body.querySelectorAll(".cycle-item.open")].map(
              (n) => n.id,
            );
            try {
              const data = await onCheck(projectSlug, type, i, cb.checked, cycleId);
              showToast(data?.isDebt ? "⚠ Hali ham qarz bor" : "✅ Yangilandi");
              await refreshHistoryBody(body, projectSlug);
              openIds.forEach((id) =>
                document.getElementById(id)?.classList.add("open"),
              );
            } catch (e) {
              cb.checked = !cb.checked;
            }
          });
          const box = document.createElement("span");
          box.className = "cbi-box";
          box.textContent = i;
          lbl.appendChild(cb);
          lbl.appendChild(box);
          row.appendChild(lbl);
        }
      }
      // Oyning o'rtasidan boshlangan loyihaning oldingi (yopilgan) davri
      // noto'g'ri chegara bilan adolatsiz "qarz"ga chiqib qolgan bo'lsa —
      // shu yerda tuzatiladi (faqat joriy davr hali bo'sh bo'lsa).
      async function submitFixPreviousCycle(slug, cycleId) {
        const periodStart = document.getElementById("pf-fix-start-" + cycleId)?.value;
        if (!periodStart) return showToast("⚠ Sana tanlang");
        try {
          const res = await apiFetch(`/api/projects/${slug}/fix-previous-cycle`, {
            method: "POST",
            body: JSON.stringify({ periodStart }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Xato");
          showToast("✅ Davr sanasi tuzatildi");
          await loadProjects();
          refreshAllViews();
          const body = document.querySelector(".sheet-body");
          if (body) await refreshHistoryBody(body, slug);
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }

      // Telegram WebView confirm() ni qo'llab-quvvatlamaydi — o'z modalimiz
      function showConfirmModal(title, message, onConfirm, okLabel) {
        document.getElementById("confirm-modal")?.remove();
        const modal = document.createElement("div");
        modal.id = "confirm-modal";
        modal.className = "overlay";
        modal.style.zIndex = "900";
        modal.innerHTML = `
          <div class="sheet" style="max-width:480px">
            <div class="sheet-handle"></div>
            <div style="padding:14px 20px calc(28px + env(safe-area-inset-bottom,0px))">
              <div style="font-size:16px;font-weight:600;color:var(--ink);margin-bottom:10px">${title}</div>
              <div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:22px">${message}</div>
              <div style="display:flex;gap:10px">
                <button id="confirm-cancel-btn" class="btn btn-soft">Bekor qilish</button>
                <button id="confirm-ok-btn" class="btn btn-danger">${okLabel || "O'chirish"}</button>
              </div>
            </div>
          </div>`;
        document.body.appendChild(modal);
        document.getElementById("confirm-cancel-btn").onclick = () => modal.remove();
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.remove();
        });
        document.getElementById("confirm-ok-btn").onclick = () => {
          modal.remove();
          onConfirm();
        };
      }

      // Arxivlash — yumshoq o'chirish, tarix saqlanib qoladi
      function archiveProject(slug, label, btn) {
        showConfirmModal(
          `${escHtml(label)} ni arxivlash`,
          `Bu loyiha ro'yxatdan yashiriladi va yangi davrlar ochilmaydi.<br><br><span style="color:var(--t3);font-size:12px">Tarixi (o'tgan davrlar, belgilangan checklar) saqlanib qoladi.</span>`,
          async () => {
            if (btn) btn.disabled = true;
            try {
              const res = await apiFetch(`/api/projects/${slug}`, {
                method: "DELETE",
              });
              if (!res.ok)
                throw new Error((await res.json().catch(() => ({}))).error || "Xato");
              await loadProjects();
              histState.loaded = false;
              if (trackerProjectId === slug) closeTracker();
              else refreshAllViews();
              showToast(`✅ "${label}" arxivlandi`);
            } catch (e) {
              showToast("⚠ " + e.message);
              if (btn) btn.disabled = false;
            }
          },
          "Arxivlash",
        );
      }

      // ── KIRISH TAQIQLANGAN ────────────────────────────────────────
      function showAccessDenied(username, code, message) {
        // Backend endi holatga qarab aniq xabar beradi (bloklangan /
        // ruxsat mavjud emas) — shuni ko'rsatamiz, bo'lmasa umumiy matn.
        const title = code === "BLOCKED" ? "Kirish bloklangan" : "Kirish taqiqlangan";
        const detail = message
          ? escHtml(message)
          : username
            ? `<span style="color:var(--brand);font-weight:600">@${escHtml(username)}</span> uchun ruxsat yo'q`
            : "Faqat Nasaf Digital jamoasi kirishi mumkin";
        document.body.innerHTML = `
          <div style="min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="background:var(--surf);border:1px solid var(--bd2);border-radius:16px;padding:36px 24px;max-width:320px;width:100%;text-align:center">
              <div style="width:52px;height:52px;border-radius:99px;background:var(--red-bg);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--red);font-weight:700">!</div>
              <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px">
                <div style="width:28px;height:28px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px">ND</div>
                <span style="font-size:13px;font-weight:600">Nasaf Digital</span>
              </div>
              <div style="font-size:17px;font-weight:600;margin-bottom:8px">${escHtml(title)}</div>
              <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:20px">
                ${detail}
              </div>
              <div style="background:var(--chip);border-radius:10px;padding:12px;font-size:11px;color:var(--t2);text-align:left;line-height:1.6">
                Murojaat uchun:<br><span style="color:var(--brand);font-weight:600">@jahongirjuraqulov</span>
              </div>
            </div>
          </div>`;
      }

      // ── INIT ──────────────────────────────────────────────────────
      // To'liq ekran rejimida Telegram o'zining sarlavha/yopish
      // tugmalarini kontent ustiga chizadi (contentSafeAreaInset) —
      // shuni --tg-safe-top CSS o'zgaruvchisiga yozib, .hdr/.trk-hdr/
      // .np-hdr/#sidebar shu bo'shliqni hisobga oladi (aks holda ekran
      // sarlavhasi Telegram'ning o'z tugmalari ostida yashiringan bo'lardi).
      function applyTelegramSafeArea() {
        const t = tg();
        if (!t) return;
        const top = (t.safeAreaInset?.top || 0) + (t.contentSafeAreaInset?.top || 0);
        document.documentElement.style.setProperty("--tg-safe-top", top + "px");
      }
      async function initApp() {
        if (tg()) {
          tg().ready();
          tg().expand();
          try {
            tg().requestFullscreen?.(); // Bot API 8.0+ — kompyuterda ham to'liq ekran
            tg().disableVerticalSwipes?.();
          } catch (e) {}
          applyTelegramSafeArea();
          try {
            tg().onEvent?.("safeAreaChanged", applyTelegramSafeArea);
            tg().onEvent?.("contentSafeAreaChanged", applyTelegramSafeArea);
            tg().onEvent?.("fullscreenChanged", applyTelegramSafeArea);
          } catch (e) {}
        }

        const initData = getInitData();
        if (initData) {
          try {
            const res = await apiFetch("/api/auth", { method: "POST", body: "{}" });
            const d = await res.json();
            if (res.status === 403 || res.status === 401) {
              document.getElementById("loading").remove();
              showAccessDenied(
                d.username || tg()?.initDataUnsafe?.user?.username || null,
                d.code,
                d.error,
              );
              return;
            }
            currentUser = d.username;
            isAdmin = d.isAdmin || false;
            isSuperAdmin = d.isSuperAdmin || false;
            userRole = d.role || "employee";
          } catch (e) {
            console.warn("Auth offline:", e.message);
          }
        }

        if (!currentUser) {
          currentUser =
            (tg()?.initDataUnsafe?.user?.username || "").toLowerCase() || null;
          isSuperAdmin = SUPER_ADMINS.has(currentUser);
          isAdmin = isSuperAdmin;
          userRole = isSuperAdmin ? "super_admin" : "employee";
        }

        // Chat ID ni saqlash (bot bildirishnomalari uchun)
        const chatId = tg()?.initDataUnsafe?.user?.id;
        if (chatId && currentUser) {
          apiFetch("/api/register-chat", {
            method: "POST",
            body: JSON.stringify({ chatId }),
          }).catch(() => {});
        }

        try {
          const r = await apiFetch("/api/permissions");
          if (r.ok) perms = await r.json();
        } catch (e) {}

        let profileIncomplete = false;
        let showBirthdayGreeting = false;
        try {
          const r = await apiFetch("/api/me");
          if (r.ok) {
            const d = await r.json();
            myProfile = d.user;
            if (typeof d.ncoinBalance === "number") myNcoinBalance = d.ncoinBalance;
            profileIncomplete = !!d.profileIncomplete;
            showBirthdayGreeting = !!d.showBirthdayGreeting;
          }
        } catch (e) {}

        await loadProjects();
        await loadStaff();
        await loadTasks();
        await loadTags();
        await loadMyActivity();

        document.getElementById("nav-admin").style.display = isAdmin
          ? "flex"
          : "none";
        document.getElementById("sidebar-admin").style.display = isAdmin ? "block" : "none";
        // "Adminlar" va "E'lon" — faqat super admin uchun, Boshqaruv
        // ekranidagi tablar bilan bir xil qoida.
        document.querySelectorAll('#sidebar-admin .sb-aitem[data-super="1"]').forEach((el) => {
          el.style.display = isSuperAdmin ? "flex" : "none";
        });
        document.getElementById("atab-admins").style.display = isSuperAdmin
          ? "block"
          : "none";
        document.getElementById("atab-announcement").style.display = isSuperAdmin
          ? "block"
          : "none";

        // Grafik Dizayner — loyiha-tsikliga (post/stories) bog'liq
        // ishlamaydi, faqat vazifalar orqali ishlaydi — shu sabab
        // "Bugun" (tracker) va "Loyihalar" bo'limlari uning uchun
        // ko'rinmaydi (NShop/Tarix — coin sarflash/tarixini ko'rish
        // uchun qoladi). Lavozim matni profildagi qiymat bilan AYNAN
        // bir xil bo'lishi kerak (TASK_NCOIN_AMOUNT_BY_JOB_TITLE'dagi
        // bilan bir joydan keladi).
        const isDesignerOnlyNav = myProfile?.jobTitle === "Grafik Dizyayner";
        document.getElementById("nav-today").style.display = isDesignerOnlyNav ? "none" : "flex";
        document.getElementById("nav-projects").style.display = isDesignerOnlyNav ? "none" : "flex";
        document.getElementById("sidebar-nav-today").style.display = isDesignerOnlyNav ? "none" : "flex";
        document.getElementById("sidebar-nav-projects").style.display = isDesignerOnlyNav ? "none" : "flex";
        // "Bugun" bo'limi yashirilgan xodimlar uchun (masalan Grafik
        // Dizayner) mobilda profilga kirishning yagona joyi shu
        // "Bugun" ekranining o'zida edi — endi "Vazifalar" sarlavhasida
        // ham xuddi shunday avatar-tugma bor, harflari shu yerda
        // darhol to'ldiriladi (renderToday() kutilmaydi, chunki bu
        // xodimlar "Bugun"ga umuman kirmaydi).
        const meAvatarInitial = (currentUser || "?").slice(0, 1).toUpperCase();
        document.getElementById("me-avatar").textContent = meAvatarInitial;
        document.getElementById("me-avatar-tasks").textContent = meAvatarInitial;

        renderSidebar();
        // Ko'rinish (mobil/desktop) faqat CSS orqali hal qilinadi
        // (.mobile-only/.desktop-only) — bloklarning o'zi har doim
        // quriladi, shuning uchun bu yerda faqat oyna hajmi chegaradan
        // o'tganda ma'lumotlarni yangilab turish uchun (masalan "N kun
        // qoldi" kabi qiymatlar) qayta render qilinadi.
        window
          .matchMedia("(min-width: 860px)")
          .addEventListener("change", refreshAllViews);

        document.getElementById("loading").remove();
        if (profileIncomplete) {
          showOnboarding();
        } else {
          // Bildirishnomadagi "Ilovani ochish" tugmasi (web_app URL'ga
          // qo'shilgan ?openTask=<id> yoki ?tab=<nom>) — bosilganda ilova
          // to'g'ridan-to'g'ri o'sha vazifaga/bo'limga ochiladi.
          const params = new URLSearchParams(window.location.search);
          const openTaskId = params.get("openTask");
          const tabParam = params.get("tab");
          if (openTaskId) {
            showTab("tasks");
            openTaskActions(openTaskId);
          } else if (tabParam && ROOT_TABS.includes(tabParam) && !(isDesignerOnlyNav && ["today", "projects"].includes(tabParam))) {
            showTab(tabParam);
          } else {
            showTab(isDesignerOnlyNav ? "tasks" : "today");
          }
          if (showBirthdayGreeting) openBirthdayGreetingModal();
        }
      }

      initApp();
    </script>
  </body>
</html>
