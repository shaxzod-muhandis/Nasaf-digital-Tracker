        border-radius: 99px;
        border: 1.8px solid var(--red);
        color: var(--red);
        font-size: 7.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .kcard-review {
        margin-top: 9px;
        padding: 7px 8px;
        border-radius: 8px;
        background: var(--amber-bg);
        font-size: 10px;
        font-weight: 500;
        color: var(--amber-ink);
      }
      .kcard-reason {
        margin-top: 9px;
        padding: 6px 8px;
        border-radius: 8px;
        background: var(--red-bg);
        font-size: 10px;
        font-weight: 600;
        color: var(--red);
      }
      .kcard-reason.muted {
        background: var(--chip3);
        color: var(--t3);
      }
      .tag-chip {
        font-size: 10.5px;
        font-weight: 500;
        color: var(--t5);
        background: var(--chip);
        padding: 2px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .avatar-sm {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        font-size: 10px;
      }
      .due-chip {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--t3);
        white-space: nowrap;
      }
      .due-chip.soon {
        color: var(--red);
        background: var(--red-bg);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .due-chip.late {
        color: #fff;
        background: var(--red);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .kcard-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .kcard-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--bd1);
      }

      /* ── YUKLAMA QATORI (Vazifalar bosh sahifasi) ──────────────────── */
      .workload-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .workload-item {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 12px;
        padding: 8px 12px;
        flex-shrink: 0;
        min-width: 150px;
      }
      .workload-item.warn {
        background: var(--red-tint);
        border-color: var(--red-bd);
      }
      .workload-name {
        font-weight: 600;
        font-size: 12.5px;
        color: var(--ink);
      }
      .workload-sub {
        font-size: 11px;
        color: var(--t3);
        margin-top: 1px;
      }
      .workload-sub.warn {
        color: var(--red);
      }

      /* ── VAZIFALAR — mobil va desktop uchun UMUMIY bo'laklar ────────── */
      /* Segment (Hammasi / Menga / Men berganlar) — ikkala o'lchamda ham */
      .tb-seg {
        display: flex;
        height: 28px;
        background: var(--chip);
        border-radius: 8px;
        padding: 2px;
        gap: 2px;
        flex: none;
      }
      .tb-seg-btn {
        height: 24px;
        padding: 0 11px;
        border: 0;
        background: transparent;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--v3-t2);
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }
      .tb-seg-btn.active {
        background: var(--surf);
        color: var(--t5);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }
      /* Ustuvorlik ko'rsatkichi — 3 ta ustun (5/8/12px) */
      .tb-pri {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
        flex: none;
        margin-top: 3px;
      }
      .tb-pri i {
        width: 3px;
        border-radius: 1px;
        display: block;
      }

      /* ── VAZIFALAR — mobil ro'yxat (v3) ─────────────────────────────── */
      /* Vazifalar ro'yxati o'z chekka bo'shlig'ini o'zi beradi */
      #screen-tasks .scroll {
        padding: 0 0 calc(100px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
      }
      .tm-wrap {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px 16px 0;
      }
      /* Yuqoridagi 4 ta qisqa statistika kartasi */
      .tm-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .tm-stat {
        background: var(--surf);
        border-radius: 12px;
        padding: 9px 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .tm-stat.on { border-color: var(--brand); }
      .tm-stat-n {
        font-size: 18px;
        font-weight: 700;
        color: var(--t5);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .tm-stat-lbl {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        color: var(--v3-t3);
        min-width: 0;
      }
      .tm-stat-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: none;
      }
      .tm-stat-lbl span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Guruh sarlavhasi + oq karta ichidagi qatorlar */
      .tm-sec-hdr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 2px 8px;
      }
      .tm-sec-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .tm-sec-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--t5);
      }
      .tm-sec-count {
        font-size: 12.5px;
        color: var(--v3-t3);
        font-variant-numeric: tabular-nums;
      }
      .tm-card {
        background: var(--surf);
        border-radius: 14px;
        overflow: hidden;
      }
      .tm-row {
        display: flex;
        gap: 12px;
        padding: 12px 14px;
        align-items: flex-start;
        cursor: pointer;
      }
      .tm-row + .tm-row { border-top: 1px solid var(--bd1); }
      .tm-row.muted { opacity: 0.6; }
      .tm-row-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tm-row-title {
        font-size: 14.5px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--t5);
      }
      .tm-row-meta {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .tm-row-proj {
        font-size: 11.5px;
        color: var(--v3-t4);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tm-row-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        flex: none;
      }
      .tm-row-due {
        font-size: 11.5px;
        font-weight: 500;
        white-space: nowrap;
      }
      .tm-row-due.late { color: var(--red); }
      .tm-row-due.soon { color: var(--amber); }
      .tm-row-due.norm { color: var(--v3-t3); }
      .tm-av {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        flex: none;
        position: relative;
        overflow: hidden;
      }

      /* ── YANGI VAZIFA — mobil oyna (v3) ─────────────────────────────── */
      /* ── YANGI VAZIFA — TO'LIQ SAHIFA ──────────────────────────────
         Avval pastdan chiqadigan oyna edi va har bir tanlov (kalendar,
         xodim ro'yxati) uning USTIDAGI kichik oynachada ochilardi:
         telefonda ro'yxat sig'masdi, kalendar yarim ko'rinardi, tanlab
         bo'lgandan keyin qayerga qaytganini bilish qiyin edi. Endi
         mobil ilovalardagi odatiy naqsh: yaratish — alohida to'liq
         sahifa, har bir tanlov — ustiga o'ngdan surilib chiqadigan yana
         bitta to'liq sahifa, orqaga qaytish bilan yopiladi. */
      .ntv3-ov,
      .ntv3-pick-ov {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      .ntv3-ov { z-index: 800; }
      .ntv3-pick-ov { z-index: 820; }
      .ntv3,
      .ntv3-pick {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        /* Telegram to'liq ekran rejimida yuqorida o'zining paneli
           (yopish tugmasi) turadi — sarlavha qatori uning ostida qolib
           ketmasligi kerak. */
        padding-top: var(--tg-safe-top);
      }
      /* Ichki sahifa o'ngdan suriladi: qaysi tomonga "kirganini"
         ko'rsatadi, shundan keyin orqaga qaytish kutilgan harakat. */
      .ntv3-pick { animation: ntv3In 0.18s ease-out; }
      @keyframes ntv3In {
        from { transform: translateX(18px); opacity: 0.35; }
        to { transform: none; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ntv3-pick { animation: none; }
      }
      .ntv3-hdr {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--bd1);
        background: var(--surf);
        flex: none;
      }
      .ntv3-title {
        flex: 1;
        min-width: 0;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        color: var(--ink, var(--t5));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Balandligi 44px — barmoq bilan bosiladigan eng kichik o'lcham.
         Avvalgi 14px'lik matn tugmalarini xodimlar "bosilmaydi" deb
         shikoyat qilgan. */
      .ntv3-hbtn {
        border: 0;
        background: transparent;
        font-size: 14.5px;
        font-family: inherit;
        cursor: pointer;
        min-width: 64px;
        min-height: 44px;
        padding: 0 6px;
        display: flex;
        align-items: center;
        gap: 2px;
        white-space: nowrap;
      }
      .ntv3-hbtn.cancel { color: var(--v3-t2); }
      .ntv3-hbtn.save { color: var(--brand); font-weight: 600; justify-content: flex-end; }
      .ntv3-hbtn[disabled] { opacity: 0.4; cursor: default; }
      .ntv3-hbtn svg { width: 19px; height: 19px; flex: none; }
      .ntv3-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Ro'yxat oxiriga yetganda ortidagi ekran surilib ketmasin */
        overscroll-behavior: contain;
        padding: 14px 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* Yaratish tugmasi pastda doim ko'rinib turadi — forma uzun
         bo'lsa ham uni qidirib yurish kerak emas. */
      .ntv3-foot {
        flex: none;
        padding: 10px 16px calc(10px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
        border-top: 1px solid var(--bd1);
        background: var(--surf);
      }
      .ntv3-submit {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .ntv3-submit[disabled] { opacity: 0.6; }
      .ntv3-submit.ghost {
        background: var(--chip);
        color: var(--t5);
        height: 46px;
        font-weight: 500;
      }
      /* Bo'lim sarlavhasi — majburiy va qo'shimcha maydonlarni ajratadi.
         Xodimlar majburiy maydonlarni o'tkazib yuborgani uchun kerak. */
      .ntv3-sec {
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--v3-t3);
        padding: 10px 4px 2px;
      }
      .ntv3-props {
        background: var(--surf);
        border-radius: 14px;
        padding: 0 14px;
      }
      .ntv3-row {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 54px;
        cursor: pointer;
        background: transparent;
        border: 0;
        width: 100%;
        padding: 0;
        font-family: inherit;
        text-align: left;
      }
      .ntv3-row + .ntv3-row { border-top: 1px solid var(--bd1); }
      .ntv3-ico {
        width: 19px;
        height: 19px;
        color: var(--v3-t3);
        flex: none;
        display: flex;
      }
      .ntv3-lbl {
        font-size: 14.5px;
        font-weight: 500;
        color: var(--t5);
        flex: none;
      }
      .ntv3-lbl i {
        color: var(--red);
        font-style: normal;
        margin-left: 2px;
      }
      /* Qiymat tomoni o'ngga tortilgan: rasm(lar) va matn yonma-yon
         turadi. Avval rasmlar yorliqdan keyin, qatorning o'rtasida
         osilib qolardi. */
      .ntv3-val {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        font-size: 14px;
        color: var(--v3-t2);
      }
      .ntv3-valt {
        font-style: normal;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Joy egallovchi matn. Sinf nomi ataylab `ph` — umumiy `.empty`
         sinfida 40px padding bor va qatorni ikki baravar cho'zib
         yuborardi. */
      .ntv3-val.ph { color: var(--v3-t4); }
      .ntv3-chev {
        width: 16px;
        height: 16px;
        color: var(--v3-t4);
        flex: none;
        display: flex;
      }
      /* To'ldirilmagan majburiy maydon — qizil chegara bilan ajraladi.
         Faqat pastdagi "toast" yetarli emasdi: u tez yo'qolardi va
         qaysi maydon haqida ekani ko'rinmasdi. */
      .ntv3-props.bad {
        outline: 1.5px solid var(--red);
        outline-offset: -1.5px;
      }
      .ntv3-err {
        font-size: 12.5px;
        color: var(--red);
        padding: 2px 4px 0;
        display: none;
      }
      .ntv3-err.on { display: block; }
      .ntv3-hint {
        font-size: 12.5px;
        color: var(--v3-t3);
        padding: 2px 4px 0;
        line-height: 1.5;
      }

      /* ── ICHKI SAHIFA (Kimga / Ish vaqti / …) ─────────────────────── */
      .ntv3-pick-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 12px 16px calc(16px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
      }
      .ntv3-count {
        font-size: 12.5px;
        color: var(--v3-t3);
        padding: 0 4px 8px;
      }
      /* Ko'p tanlovli ro'yxatdagi belgi — tanlanmaganda bo'sh kvadrat,
         tanlanganda ko'k galochka. Faqat rang bilan belgilash yetarli
         emas: bir nechtasini tanlash mumkinligi ko'rinmaydi. */
      .ntv3-tick {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        border: 1.5px solid var(--bd4);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        color: #fff;
      }
      .ntv3-tick.on {
        background: var(--brand);
        border-color: var(--brand);
      }
      .ntv3-tick svg {
        width: 14px;
        height: 14px;
        stroke-width: 3;
      }
      .ntv3-opt {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 52px;
        background: var(--surf);
        border-radius: 12px;
        padding: 8px 14px;
        margin-bottom: 8px;
        font-size: 15px;
        color: var(--t5);
        cursor: pointer;
      }
      .ntv3-opt.on {
        outline: 1.5px solid var(--brand);
        outline-offset: -1.5px;
      }
      .ntv3-opt-txt { flex: 1; min-width: 0; }
      .ntv3-opt-txt b { display: block; font-size: 15px; font-weight: 500; }
      .ntv3-opt.on .ntv3-opt-txt b { font-weight: 600; color: var(--brand); }
      .ntv3-opt-txt i {
        display: block;
        font-size: 12.5px;
        font-style: normal;
        color: var(--v3-t3);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Xodim avatari — ro'yxatda kimni tanlaganini ism o'qimasdan
         ko'rish uchun (ilovaning boshqa joylarida ham shunday). */
      .ntv3-av {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex: none;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
      }
      .ntv3-avs { display: inline-flex; align-items: center; flex: none; }
      .ntv3-avs .ntv3-av {
        width: 24px;
        height: 24px;
        font-size: 10.5px;
        box-shadow: 0 0 0 2px var(--surf);
      }
      .ntv3-avs .ntv3-av + .ntv3-av { margin-left: -7px; }
      .ntv3-empty {
        font-size: 13.5px;
        color: var(--v3-t3);
        text-align: center;
        padding: 28px 10px;
      }
      .ntv3-newtag {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .ntv3-newtag input {
        flex: 1;
        min-width: 0;
        height: 46px;
        border: 1px solid var(--bd1);
        border-radius: 12px;
        background: var(--surf);
        padding: 0 13px;
        font-family: inherit;
        font-size: 16px;
        color: var(--ink, var(--t5));
        outline: none;
      }
      .ntv3-newtag button {
        flex: none;
        height: 46px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        background: var(--chip);
        color: var(--t5);
        font-family: inherit;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
      }

      /* ── KALENDAR SAHIFASI ────────────────────────────────────────── */
      .ntv3-cal-hdr {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 6px;
      }
      .ntv3-cal-m {
        flex: 1;
        text-align: center;
        font-size: 15.5px;
        font-weight: 700;
        color: var(--ink, var(--t5));
      }
      .ntv3-cal-nav {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: var(--chip);
        color: var(--t5);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: none;
      }
      .ntv3-cal-nav svg { width: 17px; height: 17px; }
      .ntv3-wd {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--v3-t4);
        text-transform: uppercase;
        padding-bottom: 4px;
      }
      .ntv3-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        /* Qatorlar orasida bo'shliq yo'q — oraliq uzluksiz chiziq
           bo'lib ko'rinishi uchun (kunlar orasidagi bo'shliqda fon
           uzilsa, oraliq alohida bo'laklarga bo'linib ketadi). */
        row-gap: 2px;
      }
      .ntv3-day {
        position: relative;
        height: 46px;
        border: 0;
        background: transparent;
        font-family: inherit;
        font-size: 15.5px;
        color: var(--t5);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 0;
      }
      .ntv3-day[disabled] { color: var(--v3-t4); opacity: 0.45; cursor: default; }
      /* Holat sinflari ataylab `d-` bilan boshlanadi: ilovada umumiy
         `.sel` sinfi bor (balandligi 34px) va kalendar kunini siqib
         qo'yardi. */
      .ntv3-day.d-today { font-weight: 700; color: var(--brand); }
      /* Oraliq fonini kun raqamining ORQASIGA qo'yamiz (::before),
         chekkalarni esa aylana qilamiz — Linear/iOS kalendarlaridagi
         "kapsula" ko'rinishi. */
      .ntv3-day.d-in::before,
      .ntv3-day.d-sel::before {
        content: "";
        position: absolute;
        inset: 3px 0;
        background: var(--chip);
        z-index: -1;
      }
      .ntv3-day.d-s::before { border-radius: 23px 0 0 23px; }
      .ntv3-day.d-e::before { border-radius: 0 23px 23px 0; }
      .ntv3-day.d-s.d-e::before { border-radius: 23px; }
      .ntv3-day.d-sel {
        color: #fff;
        font-weight: 700;
      }
      .ntv3-day.d-sel::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--brand);
        z-index: -1;
      }
      /* Tez tanlash — ko'p ishlatiladigan oraliqlar bir bosishda */
      .ntv3-quick {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 12px 0 2px;
      }
      .ntv3-qchip {
        border: 1px solid var(--bd1);
        background: var(--surf);
        border-radius: 999px;
        padding: 8px 14px;
        font-family: inherit;
        font-size: 13.5px;
        color: var(--t5);
        cursor: pointer;
      }
      /* Tanlash qaysi bosqichda ekanini aytadi: bitta kalendarda
         "birinchi bosish — boshlanishi, ikkinchisi — tugashi" qoidasi
         o'z-o'zidan ko'rinmaydi. */
      .ntv3-sum {
        background: var(--surf);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 12px;
        font-size: 14px;
        color: var(--t5);
        text-align: center;
      }
      .ntv3-sum b { font-weight: 700; }
      .ntv3-sum span { color: var(--v3-t3); }

      /* Kalendar hech qachon cho'zilmaydi: katta ekranda 7 ta ustun
         butun enga yoyilsa, kunlar bir-biridan uzoqlashib oraliqni
         ko'rish qiyinlashadi. */
      .ntv3-cal-hdr,
      .ntv3-wd,
      .ntv3-days {
        max-width: 420px;
        margin-left: auto;
        margin-right: auto;
      }
      /* Belgilash formasi qisqa — uch-to'rtta qator. Telefonda u
         to'liq sahifa bo'lgani ma'qul (barmoq bilan ishlash qulay),
         katta ekranda esa butun oynani egallab, ostida katta bo'sh
         joy qoldirardi. Shuning uchun katta ekranda — o'rtadagi
         karta, balandligi mazmunga qarab. */
      @media (min-width: 860px) {
        .ntv3-ov,
        .ntv3-pick-ov {
          background: rgba(14, 23, 38, 0.45);
          align-items: center;
          justify-content: center;
          padding: 24px;
        }
        .ntv3,
        .ntv3-pick {
          flex: none;
          width: 100%;
          max-width: 520px;
          height: auto;
          max-height: calc(100vh - 48px);
          border-radius: 20px;
          padding-top: 0;
          box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
        }
        .ntv3-body { flex: 0 1 auto; }
        .ntv3-hdr { border-radius: 20px 20px 0 0; }
        .ntv3-foot { border-radius: 0 0 20px 20px; }
      }

      /* "Bugun" sahifasidagi faollikka kirish kartasi (telefon) */
      .tm-act {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        padding: 13px 14px;
        cursor: pointer;
      }
      .tm-act-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .tm-act-t { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--marker); }
      .tm-act-n { font-size: 12px; color: var(--v3-t3); }
      .tm-act-chev { font-size: 16px; color: var(--v3-t4); line-height: 1; }

      /* ── "Yangi" belgisi ───────────────────────────────────────────
         Yangi qo'shilgan bo'lim nomi yonida turadi. Ko'zga tashlanishi
         uchun yengil puls beradi; 24 soatdan keyin o'zi yo'qoladi. */
      .nbadge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 19px;
        padding: 0 8px 0 7px;
        margin-left: 8px;
        border-radius: 99px;
        background: var(--brand);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        vertical-align: middle;
        flex: none;
        animation: nbadge-puls 2.6s ease-out infinite;
      }
      .nbadge i {
        width: 5px;
        height: 5px;
        border-radius: 99px;
        background: #fff;
        opacity: 0.9;
        flex: none;
      }
      @keyframes nbadge-puls {
        0% { box-shadow: 0 0 0 0 rgba(47, 122, 185, 0.5); }
        70% { box-shadow: 0 0 0 8px rgba(47, 122, 185, 0); }
        100% { box-shadow: 0 0 0 0 rgba(47, 122, 185, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .nbadge { animation: none; }
      }

      /* ═══ FAOLLIK — jamoa va xodim ══════════════════════════════════
         Kalendarning har qatori — bitta hafta; kun katagining rangi shu
         kungi ishlar soniga qarab. Qator oxirida haftaning jami va
         o'tgan haftaga farqi. */
      /* Issiqlik shkalasi — ko'k rangning besh bosqichi. Ataylab aniq
         qiymatlar: shaffoflik bilan qilinganda karta foni ostidan
         ko'rinib, bosqichlar bir-biridan ajralmay qolardi. */
      .act-day.l0 { background: #eef0f3; }
      .act-day.l1 { background: #d3e3f1; }

        #screen-activity > .hdr,
        #screen-activity-user > .hdr { display: none !important; }
        /* Faollik sahifasi kengroq joy oladi: kalendar 650px, qolgani
           o'ng panelga. Umumiy 880px chegarasi uni siqib qo'yardi. */
        /* Telegram kompyuterda "⋯" va "✕" tugmalarini kontent USTIGA,
           o'ng yuqori burchakka chizadi va bu joy uchun hech qanday
           o'lcham bermaydi. Avval bu bo'shliq "Telegram ichidamizmi?"
           degan tekshiruvga bog'langan edi — u ishonchsiz chiqdi
           (tugmalar baribir sarlavha ustida qolaverdi), shuning uchun
           endi joy har doim qoldiriladi: brauzerda ham shunchaki
           kengroq bo'shliq bo'lib ko'rinadi, zarari yo'q. */
        #screen-activity .scroll,
        #screen-activity-user .scroll {
          max-width: 1240px;
          padding-top: 56px;
          /* Yon chekka "Bugun" sahifasi bilan bir xil (32px) — avval
             20px edi va bu sahifalar yonbosh menyuga yaqinroq turardi. */
          padding-left: 32px;
          padding-right: 32px;

        /* Sarlavha qatori bilan grafik kartasi yopishib turardi.
           Oraliq "Bugun" sahifasidagi kartalar oralig'icha. */
        #screen-activity-user .actu-card { margin-top: 16px; }
        .act-top,
        .actu-hdr { padding-right: 132px; }
        /* Vazifa sahifasi ham o'sha burchakni bo'sh qoldiradi —
           "Qoralama saqlandi" yozuvi tugmalar ostida qolmasin.
           `#ntf-page` ataylab: `.ntf-hdr` ning asosiy qoidasi quyida,
           ya'ni kuchliroq selektorsiz u bu yerdagini bosib ketadi. */
        #ntf-page .ntf-hdr {
          height: auto;
          min-height: 64px;
          padding-top: 34px;
          padding-bottom: 10px;
          padding-right: 156px;

      .actu-sub { font-size: 13px; color: var(--v3-t2); margin-top: 2px; white-space: nowrap; }
      .actu-hkpis { display: flex; align-items: center; gap: 28px; flex: none; }
      .actu-hkpis .actu-kpi { text-align: right; }
      .actu-kpi b {
        display: block;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--marker);
        white-space: nowrap;
      }
      .actu-kpi b i { font-style: normal; font-weight: 500; color: var(--v3-t2); }
      .actu-kpi span { font-size: 12px; font-weight: 500; color: var(--v3-t2); margin-top: 2px; display: block; }
      .actu-div { width: 1px; height: 36px; background: var(--bd4); flex: none; }
      .actu-mnav { display: flex; align-items: center; gap: 6px; }
      .act-mbtn.sm { width: 32px; height: 32px; border-radius: 9px; }
      .act-mbtn.sm svg { width: 15px; height: 15px; }
      .actu-month { width: 96px; text-align: center; font-size: 13.5px; font-weight: 600; color: var(--marker); }
      .actu-mkpis { display: none; }

      .actu-card { background: var(--surf); border: 1px solid var(--bd2); border-radius: 16px; padding: 18px 20px 16px; }
      .actu-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .actu-bign { font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: var(--marker); }
      .actu-bigl { font-size: 14px; font-weight: 500; color: var(--v3-t2); }
      .actu-badge {
        height: 24px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        flex: none;
      }
      .actu-badge.up { background: var(--st-ahead-bg, #e8f6ec); color: var(--st-ahead, #15803d); }
      .actu-badge.down { background: var(--red-bg); color: var(--red); }
      /* Grafik qaysi loyiha bo'yicha chizilganini bildiradi; bosilsa
         yana barcha loyihalar ko'rinishiga qaytadi. */
      .actu-sel {
        height: 26px;
        padding: 0 7px 0 9px;
        border-radius: 8px;
        border: 1px solid var(--bd2);
        background: var(--chip2);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--marker);
        cursor: pointer;
        flex: none;
      }
      .actu-sel i { width: 8px; height: 8px; border-radius: 99px; flex: none; }
      .actu-sel em { font-style: normal; font-size: 13px; line-height: 1; color: var(--v3-t3); }
      .actu-sel:hover { border-color: var(--bd4); }
      .actu-sel:hover em { color: var(--marker); }
      .actu-cmp-sub { font-size: 12.5px; color: var(--v3-t2); margin-top: 6px; }
      .actu-legend { display: flex; align-items: center; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
      .actu-legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--v3-t2); }
      .actu-legend i { display: block; flex: none; }
      .actu-legend .actu-only-m { display: none; }
      .actu-legend i.cur { width: 18px; height: 3px; border-radius: 2px; background: var(--brand); }
      .actu-legend i.prev { width: 18px; height: 2px; border-radius: 2px; background: #b8bec6; }
      .actu-legend i.fc { width: 18px; border-top: 2px dashed var(--brand); opacity: 0.75; }
      .actu-legend i.bar { width: 8px; height: 12px; border-radius: 2px; background: #a7c9e6; }
      .actu-chart { margin-top: 12px; }
      .actu-svg { display: block; width: 100%; height: auto; overflow: visible; font-family: inherit; }

      /* Loyiha kartalari (katta ekran) */
      .actu-projs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
      .actu-proj {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        padding: 12px 14px;
        box-sizing: border-box;
        min-width: 0;
        /* Karta bosilsa yuqoridagi asosiy grafik shu loyihaga o'tadi */
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      /* 5 va undan ortiq kun ish bo'lmagan loyiha ajratib ko'rsatiladi */
      .actu-proj.stale { border-color: rgba(217, 119, 6, 0.5); }
      .actu-proj:hover { border-color: var(--bd4); }
      .actu-proj.is-sel { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
      .actu-ptop { display: flex; align-items: center; gap: 8px; }
      .actu-pdot { width: 8px; height: 8px; border-radius: 99px; flex: none; }
      .actu-pname {
        flex: 1;
        min-width: 0;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--marker);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actu-pmid { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .actu-pnum {
        flex: 1;
        min-width: 0;
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--marker);
      }
      .actu-pnum i { font-style: normal; font-size: 13px; font-weight: 500; color: var(--v3-t3); }
      .actu-pst {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        flex: none;
      }
      .actu-pst em { width: 6px; height: 6px; border-radius: 99px; display: block; }
      .actu-pst.ahead { background: var(--st-ahead-bg, #e8f6ec); color: var(--st-ahead, #15803d); }
      .actu-pst.ahead em { background: var(--st-ahead-dot, #16a34a); }
      .actu-pst.onplan { background: var(--st-onplan-bg, #eaf2f9); color: var(--st-onplan, #255f91); }
      .actu-pst.onplan em { background: var(--st-onplan-dot, #2f7ab9); }
      .actu-pst.behind { background: var(--st-behind-bg, #fbf1e4); color: var(--st-behind, #a45f08); }
      .actu-pst.behind em { background: var(--st-behind-dot, #d97706); }
      .actu-pspark { margin-top: 10px; }
      .actu-spark { display: block; max-width: 100%; height: auto; }
      .actu-pfoot { margin-top: 8px; }
      .actu-time { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; color: var(--v3-t2); }
      .actu-time svg { width: 13px; height: 13px; color: var(--v3-t3); flex: none; }
      .actu-warn { font-size: 11.5px; font-weight: 600; color: var(--st-behind-dot, #b45309); }

      /* Loyihalar ro'yxati (telefon) */
      .actu-plist { padding: 12px 14px 2px; }
      .actu-ptitle { font-size: 15px; font-weight: 700; color: var(--marker); }
      .actu-prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bd2); cursor: pointer; }
      .actu-prow:last-child { border-bottom: 0; }
      /* Tanlangan qator — grafik shu loyiha bo'yicha chizilyapti */
      .actu-prow.is-sel {
        background: var(--chip2);
        box-shadow: inset 2px 0 0 var(--brand);
        border-radius: 8px;
        margin: 0 -8px;
        padding-left: 10px;
        padding-right: 8px;
      }
      .actu-prow-txt { flex: 1; min-width: 0; }
      .actu-prow-sub { display: flex; gap: 4px; margin-top: 2px; font-size: 11.5px; white-space: nowrap; }
      .actu-prow-sub b { font-weight: 600; }
      .actu-prow-sub b.ahead { color: var(--st-ahead, #15803d); }
      .actu-prow-sub b.onplan { color: var(--st-onplan, #255f91); }
      .actu-prow-sub b.behind { color: var(--st-behind-dot, #b45309); }
      .actu-prow-sub span { font-weight: 400; color: var(--v3-t2); }
      .actu-prow-n { width: 54px; flex: none; text-align: right; font-size: 13.5px; font-weight: 700; color: var(--marker); }

      @media (max-width: 859px) {
        .actu-only-d { display: none !important; }
        .actu-only-m { display: block; }
        .actu-legend .actu-only-m { display: inline; }
        /* Sarlavha — yopishgan qator, qolgani aylanadigan qismda */
        .actu-hdr {
          gap: 10px;
          padding: calc(4px + var(--tg-safe-top)) 16px 12px;
          background: var(--surf);
          border-bottom: 1px solid var(--bd2);
        }
        .act-av.big { width: 36px; height: 36px; border-radius: 12px; font-size: 14px; }
        .actu-name { font-size: 16px; }
        .actu-sub { font-size: 12px; margin-top: 1px; }
        .actu-hkpis { display: none; }
        .actu-mkpis { display: flex; gap: 8px; margin: 12px 16px 0; }
        .actu-mkpis .actu-kpi {
          flex: 1;
          min-width: 0;
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 12px;
          padding: 9px 12px;
        }
        .actu-mkpis .actu-kpi b { font-size: 16px; font-variant-numeric: tabular-nums; }
        .actu-mkpis .actu-kpi span { font-size: 11.5px; font-weight: 400; }
        .actu-card { margin: 10px 16px 0; border-radius: 14px; padding: 14px; }
        .actu-top { gap: 8px; }
        .actu-bign { font-size: 26px; }
        .actu-bigl { font-size: 13px; }
        .actu-badge { height: 22px; font-size: 11.5px; }
        .actu-cmp-sub { font-size: 12px; }
        .actu-legend { gap: 14px; margin-top: 8px; }
        .actu-plist { margin-bottom: 16px; }
      }

      /* ── VAZIFANI SURIB KO'CHIRISH (drag & drop) ───────────────────
         Kartani ushlab boshqa ustunga olib o'tish. Sudralayotgan
         nusxa (`ghost`) barmoq/sichqoncha ostida suzadi, asl karta esa
         joyida xiralashib turadi — qayerdan olinganini ko'rsatadi. */
      .tdnd-ghost {
        position: fixed;
        z-index: 950;
        pointer-events: none;
        margin: 0;
        background: var(--surf);
        border-radius: 12px;
        box-shadow: 0 14px 32px rgba(15, 23, 42, 0.26);
        transform: rotate(1.4deg);
        opacity: 0.96;
      }
      .tdnd-src { opacity: 0.32; }
      /* Sudrash paytida matn ajralib ketmasin va uzoq bosilganda iOS
         "nusxa olish" oynachasini chiqarmasin. */
      body.tdnd-on {
        user-select: none;
        -webkit-user-select: none;
        cursor: grabbing;
      }
      body.tdnd-on * { -webkit-touch-callout: none; }
      /* Nishon ustun. Ikki sinf bo'lgani uchun ustunning o'z foni
         (media so'rovi ichida) ustidan yozadi. */
      .tb-col.tdnd-over,
      .tm-dz.tdnd-over {
        outline: 2px dashed var(--brand);
        outline-offset: -2px;
        background: var(--brand-bg, rgba(47, 122, 185, 0.1));
      }
      /* Telefonda butun guruhni xiralashtirmaymiz — ro'yxat o'qilmay
         qoladi; u yerda nishonni pastdagi chiziq ko'rsatadi. */
      .tb-col.tdnd-no { opacity: 0.45; }
      .tm-dz { border-radius: 14px; }
      /* Telefonda ustunlar yo'q — pastda status chizig'i chiqadi, shunda
         nishonni qidirib ro'yxatni aylantirish kerak bo'lmaydi. */
      .tdnd-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        /* Nusxadan (950) YUQORIDA: barmoq chiziq ustida turganda
           sudralayotgan karta nishonni to'sib qo'ymasligi kerak. */
        z-index: 960;
        display: flex;
        gap: 7px;
        padding: 10px 10px calc(10px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
        background: var(--surf);
        border-top: 1px solid var(--bd1);
        box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
      }
      .tdnd-bar-z {
        flex: 1;
        min-width: 0;
        border-radius: 12px;
        background: var(--chip);
        padding: 11px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.2;
        color: var(--t5);
        text-align: center;
      }
      .tdnd-bar-z.tdnd-over {
        background: var(--brand);
        color: #fff;
        transform: translateY(-3px);
      }
      .tdnd-bar-z.tdnd-no { opacity: 0.38; }
      .tdnd-bar-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
      }
      .tdnd-bar-z.tdnd-over .tdnd-bar-dot { background: #fff !important; border-color: #fff !important; }
      /* Telefonda sudrash ko'rinib turmaydi — birinchi muvaffaqiyatli
         ko'chirishgacha qisqa izoh turadi, keyin o'zi yo'qoladi. */
      .tdnd-hint {
        font-size: 12px;
        color: var(--v3-t3);
        background: var(--chip);
        border-radius: 10px;
        padding: 9px 12px;
        line-height: 1.5;
      }
      .tdnd-hint b { color: var(--t5); font-weight: 600; }

      /* ── TABRIK OVOZI — parcha tanlash ─────────────────────────────── */
      .pfs-file {
        display: flex;
        align-items: center;
        gap: 11px;
        background: var(--surf2);
        border: 1px solid var(--bd1);
        border-radius: 12px;
        padding: 11px 13px;
      }
      .pfs-note {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: rgba(47, 122, 185, 0.12);
        color: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        font-size: 16px;
      }
      .pfs-file-t { font-size: 13.5px; font-weight: 600; color: var(--t5); }
      .pfs-file-s { font-size: 12px; color: var(--t3); margin-top: 2px; }
      /* Qo'shiq chizig'i — tanlangan 10 soniyalik oyna ajratib turadi */
      .pfs-track {
        position: relative;
        height: 44px;
        border-radius: 10px;
        background: var(--chip);
        overflow: hidden;
        margin-top: 14px;
        cursor: pointer;
        touch-action: none; /* barmoq bilan surish uchun — sahifa aylanmasin */
        user-select: none;
      }
      .pfs-window {
        position: absolute;
        top: 0;
        bottom: 0;
        background: var(--brand);
        opacity: 0.9;
        border-radius: 8px;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }
      .pfs-track.dragging .pfs-window { cursor: grabbing; opacity: 1; }
      /* Ushlash belgisi — bu blok surilishini bildiradi */
      .pfs-window i {
        width: 2px;
        height: 14px;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.75);
        display: block;
      }
      .pfs-playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--marker);
        display: none;
      }
      .pfs-times {
        display: flex;
        align-items: center;
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--t3);
        font-variant-numeric: tabular-nums;
      }
      .pfs-times b { color: var(--t5); font-weight: 600; }
      .pfs-range {
        width: 100%;
        margin: 12px 0 2px;
        accent-color: var(--brand);
      }
      .pfs-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .pfs-actions .btn { width: auto; height: 38px; padding: 0 14px; }

      /* ── TABEL (TZ 10a–10d) ─────────────────────────────────────────── */
      /* ══ TABEL — MATRITSA (qator = loyiha, ustun = rol) ══════════ */
      .tbx-head {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      /* Ichki `style` media-query'ni bosib ketardi — kenglik klassda. */
      .tbx-head-main {
        flex: 1;
        min-width: 0;
      }
      .tbx-h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--ink);
      }
      .tbx-h2 {
        font-size: 12.5px;
        color: var(--v3-t2);
        margin-top: 2px;
      }
      /* ── BARMOQ UCHUN BOSISH MAYDONI ─────────────────────────────
         Bu boshqaruvlar ro'yxat zichligi uchun ataylab past (24–29px),
         lekin barmoq uchun shuncha joy kam. Ko'rinmas maydon ularni
         ~44px gacha kengaytiradi: tartibga ta'sir qilmaydi, chunki
         absolyut joylashgan. */
      .tb-seg-btn,
      .chip-btn,
      .sec-hdr-a,
      .tbx-chipbtn,
      .ntf-qbtn,
      .ntf-seg-b,
      .ntf-pill,
      .stat-link {
        position: relative;
      }
      .tb-seg-btn::after,
      .chip-btn::after,
      .sec-hdr-a::after,
      .tbx-chipbtn::after,
      .ntf-qbtn::after,
      .ntf-seg-b::after,
      .ntf-pill::after,
      .stat-link::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 44px;
        transform: translateY(-50%);
      }
      /* Juda past elementlarda (16px havola) yon tomonga ham biroz. */
      .sec-hdr-a::after,
      .stat-link::after {
        left: -6px;
        right: -6px;
      }
      .hdr-avatar-btn {
        position: relative;
      }
      .hdr-avatar-btn::after {
        content: "";
        position: absolute;
        inset: -5px;
      }

      /* ── KLAVIATURA BILAN YURISH ─────────────────────────────────
         Telegram Desktop'da Tab bilan yurish mumkin, lekin hech qayerda
         fokus ko'rinmasdi. `:focus-visible` — faqat klaviatura bilan
         kelganda chiziladi, sichqoncha bosganda bezovta qilmaydi. */
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .btn:focus-visible,
      .chip-btn:focus-visible,
      .tb-seg-btn:focus-visible,
      .icon-btn:focus-visible {
        outline-offset: 3px;
      }

      /* ── FORMA: bo'lim sarlavhasi, majburiy belgi, xato ──────────
         Avval qaysi maydon majburiyligi ko'rinmasdi (faqat bitta
         yulduzcha bor edi) va xato pastdagi "toast" bo'lib chiqib
         yo'qolardi — xodim qaysi maydonni to'ldirmaganini bilmasdi. */
      .f-sec {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--v3-t3);
        margin: 4px 0 12px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--bd1);
      }
      .f-group + .f-sec,
      .f-check + .f-sec {
        margin-top: 22px;
      }
      .f-err {
        display: none;
        font-size: 12px;
        font-weight: 500;
        color: var(--st-debt);
        margin-top: 6px;
        line-height: 1.45;
      }
      .f-err.on {
        display: block;
      }
      .f-input.invalid,
      .date-field.invalid {
        border-color: var(--st-debt);
      }
      /* Belgilash katagi — nima uchun kerakligi yonida yozilgan */
      .f-check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 11px 12px;
        margin-bottom: 16px;
        border: 1px solid var(--bd2);
        border-radius: 11px;
        cursor: pointer;
      }
      .f-check input {
        width: 18px;
        height: 18px;
        margin: 1px 0 0;
        flex: none;
        accent-color: var(--brand);
      }
      .f-check span {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .f-check b {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .f-check i {
        font-style: normal;
        font-size: 12px;
        color: var(--v3-t2);
        line-height: 1.45;
      }


      /* Kartochkadagi ustma-ust avatarlar */
      .task-avs {
        display: inline-flex;
        align-items: center;
        flex: none;
      }
      .task-avs > * {
        box-shadow: 0 0 0 2px var(--surf);
      }
      .task-avs .more {
        background: var(--chip2);
        color: var(--v3-t2);
        font-weight: 700;
      }

      /* Internet yo'qligi — tepada, doimiy chiziq. */
      .offline-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1900;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: calc(var(--tg-safe-top, 0px) + 7px) 14px 7px;
        background: var(--st-debt);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
      }
      .offline-dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: #fff;
        flex: none;
        animation: offlinePulse 1.4s ease-in-out infinite;
      }
      @keyframes offlinePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* Yangi versiya banneri — pastda, ishni to'smaydigan tarzda. */
      .new-version {
        position: fixed;
        left: 12px;

      /* ── Tor ekran: matritsa sig'maydi, qatorlar ustma-ust ───────
         Ustun sarlavhasi har katak ustida takrorlanadi, aks holda
         qaysi rol ekani ko'rinmay qolardi. */
      @media (max-width: 859px) {
        /* Element ikkala klassni ham olib yuradi (.tbx-grid.tbx-thead),
           shuning uchun yashirish qoidasi aniqroq bo'lishi kerak — aks
           holda pastdagi `.tbx-grid { display: block }` uni ochib
           yuborardi. */
        .tbx-grid.tbx-thead {
          display: none;
        }
        .tbx-grid {
          display: block;
          padding: 12px 14px;
        }
        .tbx-proj {
          margin-bottom: 10px;
        }
        .tbx-cell {
          margin-top: 8px;
        }
        .tbx-cell::before {
          content: attr(data-role);
          font-size: 10.5px;
          font-weight: 600;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--v3-t3);
        }
        .tbx-detail {
          grid-template-columns: minmax(0, 1fr);
          gap: 18px;
          padding: 14px;
          margin: 0 14px 14px;
        }
        /* Sarlavha qatori tor ekranda to'rtta narsani (avatar, nom,
           ikki chip, yopish) bitta qatorga sig'dira olmaydi — ism
           ustun bo'lib qisqarib ketardi. Yopish tugmasi burchakda
           qoladi, chiplar pastki qatorga tushadi. */
        .tbx-dhead {
          gap: 8px;
          position: relative;
          padding-right: 40px;
        }
        .tbx-dhead-main {
          flex: 1 0 calc(100% - 46px);
        }
        .tbx-close {
          position: absolute;
          right: 0;
          top: 0;
        }
        .tbx-srow {
          flex-wrap: wrap;
          gap: 8px;
        }
        .tbx-legend {
          display: none;
        }
        /* To'rtta ko'rsatkich 375px da yonma-yon sig'maydi — ikkitadan. */
        .tbx-sum-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px 10px;
        }
        .tbx-sum-card + .tbx-sum-card {
          padding-left: 0;
          border-left: none;
        }
        .tbx-sum-card:nth-child(even) {
          padding-left: 12px;
          border-left: 1px solid var(--bd1);
        }
        .tbx-sum {
          padding: 14px;
        }
        /* Sarlavha oy tanlagich bilan yonma-yon sig'maydi — tor
           ustunga siqilib ketmasligi uchun o'z qatorini oladi. */
        .tbx-head-main {
          flex: 1 0 100%;
        }
        /* Izoh qisqarib ketmasin — "o'tgan oy 64%" kabi ma'lumot
           kartaning o'zida qolishi kerak. */
        .tbx-sum-note {
          white-space: normal;
        }
        .tbx-h2 {
          font-size: 12px;
        }
        .tbx-squares {
          gap: 8px 6px;
        }
      }

      /* ═══ VAZIFA YARATISH SAHIFASI (TZ: ekranlar 16a–16d) ═══════════
         Modal emas, alohida sahifa. Katta ekranda chapda nom va tavsif,
         o'ngda parametrlar; telefonda bitta ustun. Kim/muddat/ustuvorlik
         ichki ekranga kirmasdan shu yerning o'zida tanlanadi.
         O'lchamlar va ranglar dizayn bilan 1:1 — ranglar ilovaning
         umumiy tokenlaridan olinadi (TZ 05 qiymatlari aynan shular),
         shunda tungi rejim ham o'z-o'zidan ishlaydi. */
      /* Sahifa yon menyuning O'NG tomonidagi joyni egallaydi — menyu
         ko'rinib turadi va boshqa bo'limga o'tish uchun sahifani
         yopish kerak emas. Shu sababli sahifaning o'z "orqaga"
         tugmasi ham yo'q: telefonda Telegram'ning tugmasi, katta
         ekranda esa yon menyu shu ishni bajaradi. */
      .ntf-ov {
        position: fixed;
        inset: 0;
        /* Telefonda pastki tab barni (200) qoplaydi; katta ekranda esa
           yon menyudan (100) past turadi va uning o'ng tomonidan
           boshlanadi. */
        z-index: 300;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        font-family: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        body.sidebar-collapsed .ntf-ov { left: 72px; }
      }

      /* ── Sarlavha ────────────────────────────────────────────────── */
      .ntf-hdr {
        flex: none;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        background: var(--surf);
        border-bottom: 1px solid var(--bd2);
      }
      .ntf-hdr-txt { flex: 1; min-width: 0; }
      .ntf-crumb {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
      }
      .ntf-crumb span { font-weight: 500; color: var(--v3-t2); }
      .ntf-crumb i { font-style: normal; font-weight: 400; color: var(--v3-t3); }
      .ntf-crumb b { font-weight: 600; color: var(--marker); }
      .ntf-h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--marker);
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntf-draft {
        flex: none;
        font-size: 12px;
        color: var(--v3-t3);
        white-space: nowrap;
      }

      /* ── Tartib ──────────────────────────────────────────────────── */
      .ntf-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .ntf-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 24px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 18px;
        align-items: stretch;
      }
      .ntf-side { display: flex; flex-direction: column; gap: 12px; }
      .ntf-card {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
      }
      .ntf-card.pad { padding: 16px; }

      /* ── Nom va tavsif kartasi ───────────────────────────────────── */
      .ntf-main {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      .ntf-main-top { padding: 22px 24px 0; flex: none; }
      .ntf-main-desc { padding: 16px 24px; flex: 1; display: flex; flex-direction: column; }
      /* Maydon ustidagi kichik izoh — "Vazifa nomi", "Tavsif" */
      .ntf-cap {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--v3-t2);
        white-space: nowrap;
      }
      .ntf-title-in,
      .ntf-desc-in {
        width: 100%;
        border: 0;
        outline: none;
        background: transparent;
        font-family: inherit;
        resize: none;
        display: block;
        padding: 0;
      }
      .ntf-title-in {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.02em;
        color: var(--marker);
        max-width: 26ch;
        margin-top: 8px;
      }
      .ntf-sep { height: 1px; background: var(--bd2); margin: 20px 24px 0; flex: none; }
      .ntf-desc-in {
        font-size: 15px;
        line-height: 1.75;
        color: var(--body-text, #2b3340);
        max-width: 60ch;
        margin-top: 10px;
        flex: 1;
        min-height: 96px;
      }
      .ntf-title-in::placeholder { color: var(--v3-t3); font-weight: 500; }
      .ntf-desc-in::placeholder { color: var(--v3-t3); }
      /* Tavsif asboblari — faqat katta ekranda; mobilda markdown qo'lda */
      .ntf-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        border-top: 1px solid var(--bd2);
        flex: none;
      }
      .ntf-tool {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--v3-t2);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ntf-tool.b { font-weight: 700; }
      .ntf-tool:hover,
      .ntf-toolbtn:hover { background: var(--chip2); color: var(--marker); }
      .ntf-tool svg,
      .ntf-toolbtn svg { width: 14px; height: 14px; }
      .ntf-tool-div { width: 1px; height: 18px; background: var(--bd2); }
      .ntf-toolbtn {
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--v3-t2);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .ntf-tools-hint { margin-left: auto; font-size: 11.5px; color: var(--v3-t3); }

      /* ── Maydon nomi qatori ──────────────────────────────────────── */
      .ntf-lbl {
        display: flex;
        align-items: baseline;
        gap: 5px;
        font-size: 13px;
        font-weight: 600;
        color: var(--t5);
        margin-bottom: 8px;
      }
      .ntf-lbl i { font-style: normal; font-weight: 700; color: var(--red); }
      /* O'ng chekkada: to'ldirilgan bo'lsa qiymat yoki maslahat, bo'sh
         majburiy maydonda esa qizil "Tanlanmagan" (TZ 07). */
      .ntf-lbl .ntf-lbl-r {
        margin-left: auto;
        font-size: 11.5px;
        font-weight: 400;
        color: var(--v3-t3);
        white-space: nowrap;
      }
      .ntf-lbl .ntf-lbl-r.miss { color: var(--red); font-weight: 600; }
      .ntf-lbl .ntf-lbl-r.val { color: var(--nav-act-ink, var(--brand)); font-weight: 600; }
      .ntf-next { margin-top: 16px; }

      /* ── Avatar (hamma joyda bir xil) ────────────────────────────── */
      .ntf-av {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 600;
        position: relative;
        overflow: hidden;
      }

      /* ── Kim bajaradi — katta ekran: chiplar ─────────────────────── */
      .ntf-asg-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .ntf-asg {
        height: 36px;
        border-radius: 10px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px 0 4px;
        box-sizing: border-box;
        flex: none;
        max-width: 100%;
      }
      .ntf-asg .ntf-av { width: 28px; height: 28px; border-radius: 10px; font-size: 11px; }
      .ntf-asg-txt { min-width: 0; }
      .ntf-asg-n {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.15;
        color: var(--marker);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntf-asg-s {
        font-size: 11px;
        line-height: 1.2;
        color: var(--v3-t2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Band xodim (5 tadan ko'p faol vazifa) ajralib tursin */
      .ntf-busy { color: var(--st-behind, #a45f08); font-weight: 600; }
      .ntf-x {
        flex: none;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--v3-t3);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ntf-x:hover { background: var(--chip2); color: var(--marker); }
      .ntf-x svg { width: 13px; height: 13px; }
      .ntf-add {
        height: 28px;
        border-radius: 8px;
        border: 1px dashed var(--bd4);
        background: transparent;
        color: var(--v3-t2);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        padding: 0 9px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        flex: none;
      }
      .ntf-add:hover { border-color: var(--brand); color: var(--brand); }
      .ntf-add svg { width: 13px; height: 13px; }
      /* Xodim qidirish oynachasi (katta ekran) */
      .ntf-pop {
        position: fixed;
        z-index: 860;
        width: 340px;
        max-height: 420px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(14, 23, 38, 0.16);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Kim bajaradi — telefon: avatar qatori ───────────────────── */
      /* Qator o'ngga suriladi; oxirgi element ekran chetidan qisman
         ko'rinib turadi — surish mumkinligini shu bildiradi. */
      .ntf-avrow {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scrollbar-width: none;
        margin-right: -16px;
        /* Tanlangan avatar atrofidagi halqa 4px chiqadi — gorizontal
           surish uni yuqoridan qirqib qo'ymasligi uchun joy qoldiramiz */
        padding: 5px 0 1px;
        margin-top: -5px;
      }
      .ntf-avrow::-webkit-scrollbar { display: none; }
      .ntf-avitem {
        width: 56px;
        flex: none;
        border: 0;
        background: transparent;
        padding: 0;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .ntf-avwrap { position: relative; border-radius: 16px; }
      .ntf-avitem .ntf-av { width: 46px; height: 46px; border-radius: 16px; font-size: 18px; }
      .ntf-avitem.on .ntf-avwrap {
        box-shadow: 0 0 0 2px var(--surf), 0 0 0 4px var(--brand);
      }
      .ntf-avtick {
        position: absolute;
        right: -4px;
        bottom: -4px;
        width: 18px;
        height: 18px;
        border-radius: 99px;
        background: var(--brand);
        border: 2px solid var(--surf);
        color: #fff;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
      }
      .ntf-avitem.on .ntf-avtick { display: flex; }
      .ntf-avn {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--t5);
        white-space: nowrap;
        max-width: 56px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntf-avitem.on .ntf-avn { font-weight: 700; color: var(--marker); }
      .ntf-avj {
        font-size: 10px;
        color: var(--v3-t3);
        white-space: nowrap;
        margin-top: -4px;
        max-width: 56px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntf-avitem.all .ntf-av {
        background: transparent !important;
        border: 1.5px dashed var(--bd4);
        color: var(--v3-t2);
        box-sizing: border-box;
      }
      .ntf-avitem.all .ntf-av svg { width: 18px; height: 18px; }

      /* ── Muddat ──────────────────────────────────────────────────── */
      .ntf-quick { display: flex; flex-wrap: wrap; gap: 6px; }
      .ntf-qbtn {
        height: 36px;
        border-radius: 10px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        color: var(--t5);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 0 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-sizing: border-box;
        white-space: nowrap;
        flex: none;
      }
      .ntf-qbtn span { font-weight: 400; color: var(--v3-t3); }
      .ntf-qbtn.on {
        background: var(--nav-act-bg, #eaf2f9);
        border: 1.5px solid var(--brand);
        color: var(--nav-act-ink, var(--brand));
        font-weight: 600;
      }
      .ntf-qbtn.on span { color: var(--nav-act-ink, var(--brand)); }
      .ntf-qbtn svg { width: 15px; height: 15px; flex: none; }
      /* Soat chipi — muddat tugmalaridan boshqa narsa, u doim bir xil
         ko'rinadi ("tanlangan" holati yo'q). */
      .ntf-timerow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      .ntf-qbtn.time { gap: 7px; padding: 0 12px; color: var(--v3-t2); }
      .ntf-qbtn.time b { font-size: 13px; font-weight: 600; color: var(--marker); }
      .ntf-qbtn.late { border-color: var(--red); color: var(--red); background: var(--red-bg); }
      .ntf-qbtn.late b { color: var(--red); }
      .ntf-when {
        font-size: 12.5px;
        color: var(--v3-t2);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Segmentlar ──────────────────────────────────────────────── */
      .ntf-seg {
        display: flex;
        gap: 2px;
        background: var(--chip2);
        border-radius: 11px;
        padding: 3px;
      }
      /* Ustuvorlik — to'rt teng bo'lak, matn uzunligi ularni
         turlicha kengaytirmasligi kerak */
      .ntf-seg.four { display: grid; grid-template-columns: repeat(4, 1fr); }
      .ntf-seg-b {
        flex: 1;
        min-width: 0;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--v3-t2);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .ntf-seg.four .ntf-seg-b { font-size: 12.5px; }
      .ntf-seg-b.on {
        background: var(--surf);
        color: var(--marker);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(14, 23, 38, 0.1);
      }
      /* Ustuvorlik ustunchalari — daraja qancha yuqori, shuncha ko'pi to'lgan */
      .ntf-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
      .ntf-bars i { display: block; width: 3px; border-radius: 1px; background: #d7dce2; }
      .ntf-bars i:nth-child(1) { height: 5px; }
      .ntf-bars i:nth-child(2) { height: 8px; }
      .ntf-bars i:nth-child(3) { height: 12px; }

      /* ── Loyiha va teglar (katta ekran) ──────────────────────────── */
      .ntf-select {
        width: 100%;
        height: 44px;
        border-radius: 11px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--marker);
        cursor: pointer;
        box-sizing: border-box;
      }
      .ntf-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
      .ntf-select-v {
        flex: 1;
        min-width: 0;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ntf-select svg { width: 16px; height: 16px; color: var(--v3-t3); flex: none; }
      .ntf-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .ntf-tag {
        height: 28px;
        border-radius: 8px;
        padding: 0 9px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        flex: none;
      }
      .ntf-tag button {
        border: 0;
        background: transparent;
        color: inherit;
        opacity: 0.6;
        font-weight: 500;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      .ntf-tag button:hover { opacity: 1; }

      /* ── Telegram kaliti ─────────────────────────────────────────── */
      .ntf-tg {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--bd2);
      }
      .ntf-tg-txt { flex: 1; min-width: 0; }
      .ntf-tg-t { font-size: 13.5px; font-weight: 600; color: var(--marker); white-space: nowrap; }
      .ntf-tg-s {
        font-size: 12px;
        color: var(--v3-t2);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntf-sw {
        flex: none;
        width: 44px;
        height: 26px;
        border-radius: 99px;
        background: #d3d8de;
        position: relative;
        transition: background 0.15s ease;
      }
      .ntf-sw.on { background: var(--brand); }
      .ntf-sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 99px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 0.15s ease;
      }
      .ntf-sw.on::after { transform: translateX(18px); }

      /* ── Telefondagi qatorlar (loyiha / teglar / boshlanishi) ────── */
      .ntf-rows { padding: 2px 16px; }
      .ntf-row {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        width: 100%;
        border: 0;
        background: transparent;
        padding: 0;
        font-family: inherit;
        cursor: pointer;
        text-align: left;
      }
      .ntf-row + .ntf-row { border-top: 1px solid var(--bd2); }
      .ntf-row.tg { height: 52px; cursor: pointer; }
      .ntf-row-ico { width: 19px; height: 19px; color: var(--v3-t2); flex: none; display: flex; }
      .ntf-row-l {
        font-size: 14px;
        font-weight: 500;
        color: var(--t5);
        flex: 1;
        min-width: 0;
        white-space: nowrap;
      }
      .ntf-row-v {
        font-size: 13.5px;
        font-weight: 400;
        color: var(--v3-t3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
      }
      .ntf-row-v.on { font-weight: 600; color: var(--marker); }
      .ntf-row-c { width: 15px; height: 15px; color: var(--v3-t3); flex: none; display: flex; }
      .ntf-row .ntf-tg-t,
      .ntf-row .ntf-tg-s { font-size: 14px; font-weight: 500; color: var(--t5); }
      .ntf-row .ntf-tg-s { font-size: 11.5px; font-weight: 400; color: var(--v3-t3); margin-top: 1px; }

      /* ── Pastki panel ────────────────────────────────────────────── */
      .ntf-foot { flex: none; background: var(--surf); border-top: 1px solid var(--bd2); }
      .ntf-foot-in {
        max-width: 1100px;
        margin: 0 auto;
        min-height: 68px;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .ntf-sum {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--v3-t2);
        overflow: hidden;
      }
      .ntf-sum .ntf-av { width: 24px; height: 24px; border-radius: 8px; font-size: 10px; }
      .ntf-sum-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ntf-sum-t b { font-weight: 600; color: var(--marker); }
      .ntf-acts { flex: none; display: flex; align-items: center; gap: 10px; }
      .ntf-btn {
        height: 44px;
        border-radius: 12px;
        font-family: inherit;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-sizing: border-box;
        flex: none;
      }
      .ntf-btn.ghost {
        background: var(--surf);
        border: 1px solid var(--bd4);
        color: var(--marker);
        padding: 0 16px;
      }
      .ntf-btn.primary { background: var(--brand); color: #fff; padding: 0 22px; }
      /* Majburiy maydon qolganda tugma xiralashadi, LEKIN bosiladi —
         bosilganda birinchi bo'sh maydonga olib boradi. O'chirib
         qo'yilgan tugma nega bosilmasligini aytmaydi. */
      .ntf-btn.primary.dim { opacity: 0.45; }
      .ntf-missing { font-size: 12.5px; font-weight: 600; color: var(--red); text-align: right; }
      .ntf-foot-m { display: none; }
      /* Xatoda maydon 2 soniya ajralib turadi */
      .ntf-card.shake { border-color: var(--red); box-shadow: 0 0 0 1.5px var(--red); }
      .ntf-spin {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: ntfSpin 0.7s linear infinite;
      }
      @keyframes ntfSpin { to { transform: rotate(360deg); } }
      /* Fokus halqasi — TZ 08 */
      .ntf-ov :focus-visible,
      .ntf-sheet :focus-visible {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(47, 122, 185, 0.25);
      }

      /* ── Pastdan chiqadigan oyna (16d) ───────────────────────────── */
      .ntf-sheet-ov {
        position: fixed;
        inset: 0;
        z-index: 870;
        background: rgba(14, 23, 38, 0.35);
        display: flex;
        align-items: flex-end;
      }
      .ntf-sheet {
        width: 100%;
        background: var(--bg);
        border-radius: 22px 22px 0 0;
        /* Tepada 70px bo'sh joy qoladi — ostida nima turganini
           ko'rsatadi va yopish uchun bosiladigan joy bo'ladi. */
        max-height: calc(100% - 70px);
        padding: 10px 16px 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: "Onest", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .ntf-grab {
        width: 38px;
        height: 5px;
        border-radius: 99px;
        background: var(--track);
        margin: 0 auto 12px;
        flex: none;
      }
      .ntf-sheet-hdr { display: flex; align-items: center; gap: 10px; flex: none; }
      .ntf-sheet-t {
        flex: 1;
        min-width: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--marker);
      }
      .ntf-sheet-n { font-size: 12.5px; font-weight: 600; color: var(--nav-act-ink, var(--brand)); }
      .ntf-search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        border-radius: 12px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        padding: 0 12px;
        margin-top: 12px;
        flex: none;
        box-sizing: border-box;
      }
      .ntf-search svg { width: 17px; height: 17px; color: var(--v3-t3); flex: none; }
      .ntf-search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        font-family: inherit;
        /* 16px dan kichik bo'lsa iOS bosilganda sahifani kattalashtiradi */
        font-size: 16px;
        color: var(--marker);
      }
      .ntf-search input::placeholder { font-size: 14px; color: var(--v3-t3); }
      .ntf-filters {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        margin-right: -16px;
        overflow-x: auto;
        scrollbar-width: none;
        flex: none;
      }
      .ntf-filters::-webkit-scrollbar { display: none; }
      .ntf-pill {
        flex: none;
        height: 32px;
        border-radius: 99px;
        border: 1px solid var(--bd4);
        background: var(--surf);
        color: var(--t5);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 0 12px;
        cursor: pointer;
        box-sizing: border-box;
      }
      .ntf-pill.on { background: var(--marker); border-color: var(--marker); color: var(--bg); }
      /* Ro'yxatning o'zi — oq karta, qatorlar ichkarida ajraladi */
      .ntf-sheet-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        margin-top: 12px;
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        padding: 0 14px;
      }
      .ntf-sheet-body.plain {
        background: transparent;
        border: 0;
        border-radius: 0;
        padding: 0;
      }
      .ntf-sheet-foot { flex: none; padding: 10px 0 calc(26px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px))); }
      .ntf-sheet-foot .ntf-btn { width: 100%; height: 52px; padding: 0 16px; }
      .ntf-prow {
        display: flex;
        align-items: center;
        gap: 11px;
        height: 58px;
        width: 100%;
        border: 0;
        background: transparent;
        padding: 0;
        font-family: inherit;
        cursor: pointer;
        text-align: left;
      }
      .ntf-prow + .ntf-prow { border-top: 1px solid var(--bd2); }
      .ntf-prow .ntf-av,
      .ntf-tile {
        width: 38px;
        height: 38px;
        border-radius: 13px;
        font-size: 15px;
        font-weight: 600;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .ntf-tile svg { width: 18px; height: 18px; }
      /* Yangi teg qatori — ro'yxatning oxirida */
      .ntf-newrow {
        display: flex;
        gap: 8px;
        padding: 10px 0 12px;
        border-top: 1px solid var(--bd2);
      }
      .ntf-newrow input {
        flex: 1;
        min-width: 0;
        height: 40px;
        border: 1px solid var(--bd4);
        border-radius: 11px;
        background: var(--surf);
        padding: 0 12px;
        font-family: inherit;
        font-size: 16px;
        color: var(--marker);
        outline: none;
      }
      .ntf-newrow .ntf-btn { height: 40px; padding: 0 14px; }
      .ntf-prow-txt { flex: 1; min-width: 0; }
      .ntf-prow-n {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--marker);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntf-prow-s {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        font-size: 12px;
        color: var(--v3-t2);
        white-space: nowrap;
      }
      .ntf-prow-s i { font-style: normal; color: var(--v3-t3); }
      .ntf-prow-s b { font-weight: 500; }
      .ntf-cb {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        border: 1.8px solid #c2c8d0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        box-sizing: border-box;
      }
      .ntf-cb.on { background: var(--brand); border-color: var(--brand); }
      .ntf-empty { padding: 28px 10px; text-align: center; font-size: 13.5px; color: var(--v3-t3); }

      /* ── Adaptivlik (TZ 04) ──────────────────────────────────────── */
      @media (max-width: 1199px) {
        .ntf-wrap { grid-template-columns: minmax(0, 1fr) 340px; }
      }
      @media (max-width: 899px) {
        .ntf-wrap { grid-template-columns: minmax(0, 1fr); max-width: 720px; }
        .ntf-main { min-height: 0; }
      }
      @media (max-width: 767px) {
        .ntf-hdr { height: auto; padding: calc(8px + var(--tg-safe-top)) 16px 8px; }
        .ntf-h1 { font-size: 17px; font-weight: 700; }
        .ntf-crumb { font-size: 12px; }
        .ntf-crumb span, .ntf-crumb b, .ntf-crumb i { font-weight: 400; color: var(--v3-t3); }
        .ntf-draft { display: none; }
        .ntf-wrap { padding: 14px 16px 0; gap: 12px; }
        /* Nom va tavsif — bitta ixcham karta, ichki izohlarsiz */
        .ntf-main { min-height: 0; }
        .ntf-main-top { padding: 14px 16px 0; }
        .ntf-main-desc { padding: 0 16px 14px; }
        .ntf-cap { display: none; }
        .ntf-title-in {
          font-size: 18px;
          line-height: 1.4;
          letter-spacing: -0.015em;
          max-width: none;
          margin-top: 0;
        }
        .ntf-title-in::placeholder { color: var(--v3-t3); }
        .ntf-sep { margin: 12px 16px; }
        .ntf-desc-in {
          font-size: 14px;
