<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>Nasaf Digital — Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── DIZAYN TOKENLARI (1b "Ish paneli" — brend ko'ki) ───────── */
      :root {
        --bg: #f7f8fa;
        --surf: #ffffff;
        --surf2: #fafbfc;
        --brand: #2f7ab9;
        --ink: #0f172a;
        --t2: #6b7280;
        --t3: #8b929c;
        --t4: #9aa1ac;
        --t5: #374151;
        --chev: #b6bcc5;
        --red: #dc2626;
        --red-bg: #fdecec;
        --red-bd: rgba(220, 38, 38, 0.3);
        --red-bd2: rgba(220, 38, 38, 0.35);
        --bd1: rgba(15, 23, 42, 0.06);
        --bd2: rgba(15, 23, 42, 0.08);
        --bd3: rgba(15, 23, 42, 0.09);
        --bd4: rgba(15, 23, 42, 0.14);
        --chip: #f1f3f6;
        --chip2: #eef0f3;
        --chip3: #edeff2;
        --sw-off: #dce0e6;
        --nav-off: #c2c8d0;
        /* Vazifalar — taglar/ustuvorlik uchun FIKS (random emas)
           rang palitrasi: har bir nom shu massivdan deterministik
           tanlanadi (tagColor()). */
        --amber: #d97706;
        --amber-bg: #fbf1e4;
        --amber-ink: #8a5a1a;
        --teal: #1e6b57;
        --teal-bg: #e9f5f1;
        --tagblue: #23608f;
        --tagblue-bg: #ebf3fa;
        --purple: #4b41a8;
        --purple-bg: #efedfb;
        --pink: #92345f;
        --pink-bg: #faecf3;
        --green: #16a34a;
        --red-tint: #fffbfb;
        /* Telegram to'liq ekran rejimida o'zining sarlavha/yopish
           tugmalarini kontent ustiga chizadi — JS shu qiymatni
           Telegram.WebApp.safeAreaInset/contentSafeAreaInset'dan
           to'ldiradi (initApp, applyTelegramSafeArea). */
        --tg-safe-top: 0px;
      }

      html {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Sora", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-text-size-adjust: 100%;
        overflow-x: hidden;
      }
      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      ::-webkit-scrollbar {
        display: none;
      }

      /* ── KIRISH / LOADING (minimal — matn/marketing yo'q) ────────── */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .ld-mark {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        background: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .ld-bar {
        width: 140px;
        height: 3px;
        border-radius: 99px;
        background: var(--chip3);
        overflow: hidden;
      }
      .ld-bar-fill {
        width: 40%;
        height: 100%;
        background: var(--brand);
        border-radius: 99px;
        animation: ld-slide 1.1s ease-in-out infinite;
      }
      @keyframes ld-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      /* ── TOAST ──────────────────────────────────────────────────── */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 12px);
        background: var(--ink);
        color: #fff;
        font-size: 12.5px;
        font-weight: 500;
        padding: 10px 16px;
        border-radius: 11px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
        z-index: 900;
        max-width: 86vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ── EKRAN KARKASI ──────────────────────────────────────────── */
      .screen {
        display: none;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .screen.active {
        display: flex;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px 20px calc(100px + env(safe-area-inset-bottom, 0px));
      }
      .hdr {
        background: var(--surf);
        border-bottom: 1px solid rgba(15, 23, 42, 0.07);
        padding: calc(14px + var(--tg-safe-top)) 20px 14px;
        flex-shrink: 0;
      }
      .hdr-title {
        font-weight: 600;
        font-size: 19px;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .hdr-sub {
        font-size: 12px;
        color: var(--t2);
        margin-top: 1px;
      }
      .hdr-avatar-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--chip);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 12px;
        color: var(--ink);
        flex-shrink: 0;
        cursor: pointer;
        border: none;
      }

      /* ── PASTKI NAVIGATSIYA ─────────────────────────────────────── */
      #bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(80px + env(safe-area-inset-bottom, 0px));
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: var(--surf);
        border-top: 1px solid var(--bd2);
        display: flex;
        align-items: flex-start;
        padding-top: 11px;
        z-index: 200;
      }
      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        background: none;
        border: none;
        color: inherit;
        padding: 0;
      }
      .nav-ico {
        width: 21px;
        height: 21px;
        color: var(--nav-off);
      }
      .nav-ico svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .nav-item.active .nav-ico {
        color: var(--brand);
      }
      .nav-lbl {
        font-size: 10px;
        font-weight: 400;
        color: var(--t3);
      }
      .nav-item.active .nav-lbl {
        font-weight: 600;
        color: var(--brand);
      }

      /* ── TEMPO KARTASI ──────────────────────────────────────────── */
      .tempo {
        background: var(--brand);
        border-radius: 16px;
        padding: 18px;
        color: #fff;
      }
      .tempo-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .tempo-lbl {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .tempo-pct {
        font-weight: 600;
        font-size: 36px;
        line-height: 1;
        margin-top: 10px;
        letter-spacing: -0.03em;
      }
      .tempo-pct span {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.5);
      }
      .tempo-exp {
        text-align: right;
      }
      .tempo-exp .l1 {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.6);
      }
      .tempo-exp .l2 {
        font-weight: 600;
        font-size: 15px;
        margin-top: 6px;
      }
      .tempo-segs {
        margin-top: 16px;
        display: flex;
        gap: 3px;
      }
      .tempo-seg {
        flex: 1;
        height: 24px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.22);
      }
      .tempo-seg.done {
        background: #fff;
      }
      .tempo-seg.now {
        outline: 1.5px solid var(--red);
        outline-offset: 1px;
      }
      .tempo-foot {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.62);
        margin-top: 11px;
      }
      .tempo-note {
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.45);
        margin-top: 3px;
      }

      /* ── QARZ OGOHLANTIRISHI ────────────────────────────────────── */
      .debt-card {
        margin-top: 14px;
        background: #fff;
        border: 1px solid var(--red-bd2);
        border-radius: 14px;
        padding: 14px 15px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .debt-ico {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--red-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 15px;
        color: var(--red);
        flex-shrink: 0;
      }
      .debt-title {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .debt-sub {
        font-size: 12px;
        color: var(--t2);
        margin-top: 2px;
      }
      .debt-btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 9px;
        background: var(--ink);
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      /* ── BO'LIM SARLAVHALARI ────────────────────────────────────── */
      .sec-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 22px 0 10px;
      }
      .sec-title {
        font-weight: 600;
        font-size: 13.5px;
        color: var(--ink);
      }
      .sec-count {
        font-size: 12.5px;
        color: var(--t2);
      }
      .sec-upper {
        font-weight: 600;
        font-size: 11px;
        color: var(--t3);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 9px;
      }

      /* ── RO'YXAT KARTASI ────────────────────────────────────────── */
      .list-card {
        background: #fff;
        border: 1px solid var(--bd2);
        border-radius: 14px;
        overflow: hidden;
      }
      .list-row {
        padding: 14px 15px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .list-row:last-child {
        border-bottom: none;
      }
      .list-row.clickable {
        cursor: pointer;
      }
      .list-card.late {
        border-color: rgba(220, 38, 38, 0.32);
      }
      .list-card.late .list-row {
        background: var(--red-tint);
      }
      .emp-bars {
        display: flex;
        gap: 3px;
        margin-right: 4px;
        flex-shrink: 0;
      }
      .emp-bar {
        width: 5px;
        height: 16px;
        border-radius: 2px;
      }
      .chev {
        font-size: 14px;
        color: var(--chev);
        flex-shrink: 0;
      }
      .donut {
        width: 38px;
        height: 38px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .donut-in {
        width: 28px;
        height: 28px;
        border-radius: 99px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 10.5px;
      }
      .r-name {
        font-weight: 600;
        font-size: 14.5px;
        color: var(--ink);
      }
      .r-sub {
        font-size: 12px;
        color: var(--t2);
        margin-top: 2px;
      }
      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--t3);
      }
      .empty-ico {
        font-size: 28px;
        margin-bottom: 10px;
      }
      .empty-t {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .empty-s {
        font-size: 12.5px;
        color: var(--t3);
        margin-top: 4px;
        line-height: 1.5;
      }

      /* ── XULOSA KARTASI (bosh sahifa: vazifalar, progress) ───────── */
      .rail-card {
        background: #fff;
        border: 1px solid var(--bd2);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .rail-title {
        font-weight: 600;
        font-size: 12.5px;
        color: var(--ink);
        margin-bottom: 10px;
      }
      .rail-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--bd1);
      }
      .rail-item:last-child {
        border-bottom: none;
      }
      .rail-item.warn {
        border: 1px solid var(--red-bd);
        border-radius: 11px;
        background: var(--red-tint);
        padding: 11px 13px;
        margin-bottom: 8px;
      }
      .rail-title-count {
        font-size: 12px;
        font-weight: 400;
        color: var(--chev);
      }
      .mini-stat-row {
        display: flex;
        gap: 8px;
      }
      .mini-stat {
        flex: 1;
        text-align: center;
        background: var(--surf2);
        border-radius: 10px;
        padding: 10px 6px;
      }
      .mini-stat-val {
        font-weight: 600;
        font-size: 19px;
        color: var(--ink);
      }
      .mini-stat-lbl {
        font-size: 10.5px;
        color: var(--t3);
        margin-top: 3px;
      }
      .task-dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--brand);
        flex-shrink: 0;
      }
      .task-dot.overdue {
        background: var(--red);
      }

      /* ── QIDIRUV VA FILTR ───────────────────────────────────────── */
      .search-box {
        margin-top: 12px;
        height: 40px;
        border-radius: 11px;
        background: var(--chip);
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 13px;
      }
      .search-box input {
        border: none;
        background: none;
        outline: none;
        flex: 1;
        font-size: 14px;
        color: var(--ink);
        min-width: 0;
      }
      .search-box input::placeholder {
        color: var(--t4);
      }
      .search-ico {
        width: 15px;
        height: 15px;
        color: var(--t4);
        flex-shrink: 0;
      }
      .search-ico svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .chips {
        display: flex;
        gap: 7px;
        margin-top: 11px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .chip-btn {
        height: 29px;
        padding: 0 12px;
        border-radius: 8px;
        background: var(--chip);
        color: var(--t5);
        font-weight: 400;
        font-size: 12px;
        display: flex;
        align-items: center;
        white-space: nowrap;
        border: none;
        flex-shrink: 0;
        cursor: pointer;
      }
      .chip-btn.active {
        background: var(--ink);
        color: #fff;
        font-weight: 600;
      }
      .chip-btn.danger {
        background: var(--red-bg);
        color: var(--red);
        font-weight: 600;
      }

      /* ── LOYIHALAR RO'YXATI ─────────────────────────────────────── */
      .od-row,
      .pv-row {
        padding: 13px 15px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .od-row:last-child,
      .pv-row:last-child {
        border-bottom: none;
      }
      .od-bar {
        width: 6px;
        height: 34px;
        border-radius: 99px;
        background: var(--red);
        flex-shrink: 0;
      }
      .od-days {
        font-weight: 600;
        font-size: 12.5px;
        color: var(--red);
        flex-shrink: 0;
      }
      .pv-bar-wrap {
        width: 56px;
        flex-shrink: 0;
      }
      .pv-bar-track {
        height: 5px;
        border-radius: 99px;
        background: var(--chip3);
        overflow: hidden;
      }
      .pv-bar-fill {
        height: 100%;
        background: var(--brand);
      }
      .pv-pct {
        font-weight: 500;
        font-size: 10.5px;
        color: var(--t2);
        text-align: right;
        margin-top: 5px;
      }

      /* ── TRACKER ────────────────────────────────────────────────── */
      .trk-hdr {
        background: var(--surf);
        border-bottom: 1px solid rgba(15, 23, 42, 0.07);
        padding: calc(10px + var(--tg-safe-top)) 20px 13px;
        flex-shrink: 0;
      }
      .trk-main {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .trk-top {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .trk-back,
      .trk-more {
        font-weight: 600;
        font-size: 19px;
        color: var(--t3);
        background: none;
        border: none;
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }
      .trk-more {
        font-weight: 400;
        font-size: 17px;
      }
      .trk-name {
        font-weight: 600;
        font-size: 17px;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .trk-period {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 1px;
      }
      .seg {
        display: flex;
        gap: 4px;
        margin-top: 13px;
        background: var(--chip);
        padding: 3px;
        border-radius: 10px;
      }
      .seg-btn {
        flex: 1;
        height: 32px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: var(--t2);
        border: none;
        background: none;
        cursor: pointer;
      }
      .seg-btn.active {
        background: #fff;
        color: var(--ink);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
      }
      .trk-prog {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
      }
      .trk-prog-track {
        flex: 1;
        height: 6px;
        border-radius: 99px;
        background: var(--chip3);
        position: relative;
        overflow: hidden;
      }
      .trk-prog-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--brand);
        border-radius: 99px;
      }
      .trk-prog-tick {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 2px;
        background: var(--red);
      }
      .trk-prog-delta {
        font-weight: 600;
        font-size: 11.5px;
        color: var(--red);
        flex-shrink: 0;
      }
      .trk-prog-delta.ok {
        color: var(--t2);
      }

      .cal-week {
        display: flex;
        justify-content: space-between;
        margin-bottom: 9px;
      }
      .cal-week span {
        flex: 1;
        text-align: center;
        font-weight: 500;
        font-size: 10.5px;
        color: var(--t3);
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
      }
      .cal-cell {
        aspect-ratio: 1;
        border-radius: 11px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: transparent;
        border: none;
        padding: 0;
        font-family: inherit;
      }
      .cal-cell.empty {
        visibility: hidden;
      }
      .cal-cell .cn {
        font-weight: 400;
        font-size: 13px;
        color: var(--chev);
      }
      .cal-cell .cs {
        font-weight: 600;
        font-size: 9px;
        opacity: 0.7;
      }
      .cal-cell.pending {
        background: #fff;
        border: 1px solid var(--bd2);
      }
      .cal-cell.done {
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      .cal-cell.done .cn {
        font-weight: 600;
        color: #fff;
      }
      /* bugungi kun bajarilgan bo'lsa — ko'k, lekin ramka bilan ajratiladi */
      .cal-cell.done-today {
        outline: 2px solid var(--ink);
        outline-offset: -2px;
      }
      .cal-cell.done .cs {
        opacity: 1;
        font-size: 10px;
        font-weight: 700;
      }
      .cal-cell.today {
        background: #fff;
        border: 2px solid var(--brand);
      }
      .cal-cell.today .cn {
        font-weight: 600;
        color: var(--ink);
      }
      .cal-cell.today .cs {
        font-weight: 600;
        font-size: 8.5px;
        color: var(--t2);
        opacity: 1;
      }
      .cal-legend {
        display: flex;
        gap: 16px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .cal-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--t2);
      }
      .cal-legend-dot {

        height: 11px;

      .today-task {
        padding: 13px 14px;
        border-bottom: 1px solid var(--bd1);

        align-items: center;
        gap: 12px;

        border-bottom: none;
      }
      .today-box {
        width: 24px;
        height: 24px;

        justify-content: center;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .today-box.checked {
        background: var(--brand);

      .today-lbl {
        flex: 1;
        font-weight: 500;
        font-size: 14px;
        color: var(--ink);

        display: flex;
        flex-wrap: wrap;
        gap: 7px;

        position: relative;
        display: block;
      }

        position: absolute;

        height: 100%;
        margin: 0;
        cursor: pointer;
      }
      .cbi-box {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1.5px solid var(--bd4);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--t2);
      }
      .cbi input:checked + .cbi-box {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }

        padding: 17px 22px;
        border-bottom: 1px solid var(--bd1);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .np-ov-icon {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--tagblue-bg);
        color: var(--brand);

        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 15px;
        flex-shrink: 0;
      }
      .np-ov-title {
        font-weight: 600;
        font-size: 15px;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .np-ov-sub {
        font-size: 11.5px;
        color: var(--t3);
        margin-top: 1px;
      }
      .np-ov-body {

        flex: 1;

        text-transform: uppercase;

      .np2-name-input {

        border-radius: 13px;

      .np2-err-msg {
        font-size: 11.5px;
        color: var(--red);

      }
      .np2-hint {

        line-height: 1.55;
        margin-top: 9px;
      }
      .np2-sub-hint {

      .np2-chip {

      .np2-anchor-day {

        font-weight: 600;

        color: var(--ink);

      .np2-anchor-arrow {

        color: var(--t3);

      .np2-anchor-note {

        color: var(--t2);

      .np2-cal {

      .np2-cal-title {

        color: var(--ink);

      .np2-cal-nav-btn {

        font-size: 10px;
        font-weight: 600;
        color: var(--ink);
        flex-shrink: 0;

        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink);
      }
      .np2-mas-chip .rm {

        color: var(--t3);
        font-size: 14px;
        line-height: 1;

      .np2-mas-add {
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px dashed var(--bd4);
        background: none;
        font-weight: 500;
        font-size: 12.5px;
        color: var(--t3);
        cursor: pointer;
      }
      .np2-err-inline {
        width: 100%;
        font-size: 11.5px;
        color: var(--red);
        margin-top: -2px;
      }
      .np2-tpl-panel {
        margin-top: 8px;
        border: 1px solid var(--bd2);
        border-radius: 12px;
        overflow: hidden;
      }

        padding: 11px 13px;

        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--bd1);

        background: var(--surf2);
      }
      .np2-tpl-name {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }
      .np2-tpl-meta {

        color: var(--t3);
      }
      .np2-tpl-del {

        background: none;
        color: var(--t4);
        cursor: pointer;
        font-size: 13px;
        padding: 2px 4px;
        display: flex;
        align-items: center;

        width: 14px;
        height: 14px;
      }
      .np-ov-footer {
        padding: 14px 22px calc(18px + env(safe-area-inset-bottom, 0px));
        background: var(--surf);
        border-top: 1px solid var(--bd2);

        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }
      .np2-btn-outline {
        height: 42px;
        padding: 0 15px;
        border-radius: 11px;
        background: var(--surf);
        border: 1px solid var(--bd4);
        font-weight: 500;
        font-size: 12.5px;
        color: var(--t5);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      .np2-btn-primary {
        height: 44px;
        padding: 0 18px;
        border-radius: 11px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 13.5px;
        border: none;
        cursor: pointer;
        white-space: nowrap;
      }
      .np2-btn-primary:disabled {
        opacity: 0.55;
      }
      .np2-notify-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .np2-notify-toggle .lbl {
        font-size: 12px;
        color: var(--t5);
        white-space: nowrap;
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .stepper-lbl {
        flex: 1;
        font-weight: 500;
        font-size: 14px;
        color: var(--ink);
      }

        display: flex;
        align-items: center;
        gap: 11px;
      }
      .stepper-btn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--chip);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        border: none;
        cursor: pointer;
      }
      .stepper-val {
        width: 30px;
        text-align: center;
        font-weight: 600;
        font-size: 17px;
        color: var(--ink);

      .divider {
        height: 1px;

        margin: 14px 0;

        border-radius: 16px;
        padding: 17px;
        color: #fff;
      }

        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .preview-title {
        font-weight: 600;
        font-size: 17px;
        line-height: 1.4;
        margin-top: 10px;
        letter-spacing: -0.01em;
      }
      .preview-sub {
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.62);
        margin-top: 5px;
      }

        gap: 4px;
        margin-top: 15px;
        align-items: flex-end;

        flex: 1;

        border-radius: 6px;
        background: rgba(255, 255, 255, 0.9);

        background: rgba(255, 255, 255, 0.35);
      }
      .preview-bar-lbl {
        font-size: 9.5px;
        color: rgba(255, 255, 255, 0.55);

        margin-top: 6px;
      }
      .np2-check-list {
        margin-top: 14px;

        display: flex;

      .np2-check-row:first-child {
        border-top: none;

        color: var(--brand);

        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        flex-shrink: 0;

        background: var(--red-tint);
        border: 1px solid var(--red-bd);

        line-height: 1.55;
        color: var(--t5);

        color: var(--red);

        color: #fff;
        font-weight: 300;
        font-size: 26px;
        display: flex;
        align-items: center;

        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);

        cursor: pointer;
        z-index: 150;

        padding: 13px 15px;
        background: var(--surf2);
        border-bottom: 1px solid var(--bd1);

        width: 32px;
        height: 32px;
        border-radius: 9px;

        font-weight: 600;
        font-size: 12px;
        flex-shrink: 0;

        background: var(--chip);
        color: var(--ink);

        font-weight: 600;
        font-size: 14px;

      }

        font-size: 11.5px;

        color: var(--red);

      .grp-count {
        font-weight: 600;
        font-size: 12px;
        color: var(--t2);

        gap: 11px;

        flex: 1;
        font-size: 13.5px;
        color: var(--t5);
      }

        font-size: 11.5px;
        color: var(--t4);
      }

        background: var(--sw-off);

        flex-shrink: 0;

        background: var(--ink);

      }

        background: var(--brand);

        width: 20px;
        height: 20px;

        background: #fff;

        background: #fff;
      }

        flex: 1;
        min-width: 0;

      .m-item-label {
        font-weight: 600;
        font-size: 13.5px;
        color: var(--ink);

      .m-item-sub {
        font-size: 11px;

        margin-top: 2px;

        flex-shrink: 0;

        align-items: center;

        cursor: pointer;
        font-size: 13px;
        color: var(--t2);
        flex-shrink: 0;

        width: 15px;

      .icon-btn.danger {
        background: var(--red-bg);

      .debt-badge {

        font-weight: 700;
        color: var(--red);
        background: var(--red-bg);

        color: var(--t4);
        cursor: pointer;
        margin-top: 2px;
      }
      .kanban-add-row:hover {
        border-color: var(--t4);
        color: var(--t2);
      }
      .kanban-archive-note {
        font-size: 11px;
        line-height: 1.5;
        color: var(--chev);
        padding: 6px 4px 0;
      }
      .chip-group {
        display: flex;
        gap: 4px;
        background: var(--chip);
        padding: 3px;
        border-radius: 9px;
      }
      .kcard {
        background: #fff;
        border: 1px solid var(--bd3);
        border-radius: 12px;
        padding: 13px;
        margin-bottom: 10px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .kcard:hover {
        border-color: var(--bd4);
      }
      .kcard.critical {
        border-color: var(--red-bd2);
      }
      .kcard.muted {
        background: var(--surf2);
        border-color: var(--bd1);
        box-shadow: none;
      }
      .kcard.muted:hover {
        border-color: var(--bd2);
      }
      .pri-urgent {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: var(--red);
        color: #fff;
        font-size: 9.5px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .kcard-check {
        width: 14px;
        height: 14px;
        border-radius: 99px;
        background: var(--green);
        color: #fff;
        font-size: 8.5px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .kcard-fail {
        width: 14px;
        height: 14px;
        border-radius: 99px;
        border: 1.8px solid var(--red);
        color: var(--red);
        font-size: 7.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .kcard-review {
        margin-top: 9px;
        padding: 7px 8px;
        border-radius: 8px;
        background: var(--amber-bg);
        font-size: 10px;
        font-weight: 500;
        color: var(--amber-ink);
      }
      .kcard-reason {
        margin-top: 9px;
        padding: 6px 8px;
        border-radius: 8px;
        background: var(--red-bg);
        font-size: 10px;
        font-weight: 600;
        color: var(--red);
      }
      .kcard-reason.muted {
        background: var(--chip3);
        color: var(--t3);
      }
      .tag-chip {
        font-size: 10.5px;
        font-weight: 500;
        color: var(--t5);
        background: var(--chip);
        padding: 2px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .avatar-sm {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        font-size: 10px;
      }
      .due-chip {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--t3);
        white-space: nowrap;
      }
      .due-chip.soon {
        color: var(--red);
        background: var(--red-bg);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .due-chip.late {
        color: #fff;
        background: var(--red);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .kcard-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .kcard-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--bd1);
      }

      /* ── YUKLAMA QATORI (Vazifalar bosh sahifasi) ──────────────────── */
      .workload-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .workload-item {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid var(--bd2);
        border-radius: 12px;
        padding: 8px 12px;
        flex-shrink: 0;
        min-width: 150px;
      }
      .workload-item.warn {
        background: var(--red-tint);
        border-color: var(--red-bd);
      }
      .workload-name {
        font-weight: 600;
        font-size: 12.5px;
        color: var(--ink);
      }
      .workload-sub {
        font-size: 11px;
        color: var(--t3);
        margin-top: 1px;
      }
      .workload-sub.warn {
        color: var(--red);
      }

      /* ── VAZIFA DETALI PANELI ───────────────────────────────────────── */
      .td-hdr {
        background: var(--surf);
        border-bottom: 1px solid rgba(15, 23, 42, 0.07);
        padding: calc(10px + var(--tg-safe-top)) 20px 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .detail-breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
        font-size: 12.5px;
        color: var(--t3);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .detail-breadcrumb b {
        color: var(--ink);
        font-weight: 600;
      }
      .detail-nav-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--chip);
        border: none;
        color: var(--t2);
        font-size: 13px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .detail-nav-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .td-badge {
        height: 25px;
        padding: 0 10px;
        border-radius: 7px;
        font-size: 11.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .td-badge.solid-red {
        background: var(--red);
        color: #fff;
      }
      .td-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .td-title {
        font-size: 21px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin-top: 14px;
      }
      .td-status-btn {
        width: 100%;
        height: 42px;
        border-radius: 11px;
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        cursor: pointer;
      }
      .td-status-btn .dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .td-status-btn.solid-green {
        background: var(--green);
        color: #fff;
      }
      .td-status-btn.solid-green .dot {
        background: #fff;
      }
      .td-status-btn.tint-amber {
        background: var(--amber-bg);
        color: var(--amber-ink);
        border: 1px solid rgba(217, 119, 6, 0.32);
      }
      .td-status-btn.tint-amber .dot {
        background: var(--amber);
      }
      .td-status-btn.tint-red {
        background: var(--red-bg);
        color: var(--red);
        border: 1px solid rgba(220, 38, 38, 0.28);
      }
      .td-status-btn.tint-red .dot {
        background: var(--red);
      }
      .td-status-btn.tint-blue {
        background: var(--tagblue-bg);
        color: var(--tagblue);
        border: 1px solid rgba(47, 122, 185, 0.3);
      }
      .td-status-btn.tint-blue .dot {
        background: var(--brand);
      }
      .td-status-btn:disabled {
        opacity: 0.6;
      }
      .td-check-row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 13px;
        border: 1px solid var(--bd2);
        border-radius: 11px;
        background: #fff;
        margin-bottom: 10px;
      }
      .td-check-box {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1.8px solid var(--nav-off);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .td-check-box.done {
        background: var(--brand);
        border-color: var(--brand);
      }
      .td-check-text {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        word-break: break-word;
      }
      .td-check-text.done {
        color: var(--t3);
        text-decoration: line-through;
      }
      .td-check-del {
        color: var(--t4);
        cursor: pointer;
        font-size: 15px;
        flex-shrink: 0;
        line-height: 1;
      }
      .td-check-add-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 6px;
      }
      .task-detail-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
      }
      @media (min-width: 860px) {
        .task-detail-grid.two-col {
          grid-template-columns: 1.4fr 1fr;
        }
      }
      .detail-desc {
        font-size: 13px;
        color: var(--t5);
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .detail-prop-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--bd1);
        font-size: 13px;
      }
      .detail-prop-row:last-child {
        border-bottom: none;
      }
      .detail-prop-label {
        color: var(--t3);
        flex-shrink: 0;
      }
      .detail-prop-val {
        color: var(--ink);
        font-weight: 500;
        text-align: right;
        min-width: 0;
      }
      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 14px 0;
      }
      .activity-item.system {
        font-size: 12px;
        color: var(--t3);
      }
      .activity-item.comment {
        display: flex;
        gap: 9px;
      }
      .activity-comment-body {
        background: var(--surf2);
        border-radius: 10px;
        padding: 8px 11px;
        font-size: 13px;
        color: var(--t5);
        line-height: 1.5;
        margin-top: 3px;
      }
      .activity-comment-meta {
        font-size: 11.5px;
        color: var(--t3);
      }
      .comment-composer {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .comment-composer textarea {
        flex: 1;
        min-height: 40px;
        resize: vertical;
      }
      .atabs {
        display: flex;
        gap: 4px;
        background: var(--chip);
        padding: 3px;
        border-radius: 10px;
        margin-top: 13px;
        overflow-x: auto;
      }
      .atab {
        flex: 1 0 auto;
        min-width: 76px;
        height: 31px;
        padding: 0 10px;
        border-radius: 7px;
        border: none;
        background: none;
        font-size: 12.5px;
        color: var(--t2);
        cursor: pointer;
        white-space: nowrap;
      }
      .atab.active {
        background: #fff;
        color: var(--ink);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
      }

      /* ── TARIX ──────────────────────────────────────────────────── */
      .hist-card {
        background: #fff;
        border: 1px solid var(--bd2);
        border-radius: 14px;
        margin-bottom: 8px;
        overflow: hidden;
      }
      .hist-head {
        padding: 13px 15px;
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
      }
      .hist-name {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .hist-date {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 2px;
      }
      .hist-pct {
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
      }
      .hist-status {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .hist-status.active {
        background: rgba(47, 122, 185, 0.12);
        color: var(--brand);
      }
      .hist-status.debt {
        background: var(--red-bg);
        color: var(--red);
      }
      .hist-status.done {
        background: var(--chip2);
        color: var(--t5);
      }
      .hist-body {
        display: none;
        padding: 0 15px 14px;
      }
      .hist-card.open .hist-body {
        display: block;
      }
      .hist-card.open .c-chev {
        transform: rotate(180deg);
      }
      .hist-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 11.5px;
        color: var(--t2);
        margin-bottom: 8px;
      }
      .hist-track {
        height: 5px;
        border-radius: 99px;
        background: var(--chip3);
        overflow: hidden;
      }
      .hist-fill {
        height: 100%;
        background: var(--brand);
      }
      .hist-assignees {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 9px;
        line-height: 1.5;
      }
      .sel {
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--bd4);
        background: #fff;
        color: var(--t5);
        font-size: 12.5px;
        padding: 0 10px;
        outline: none;
      }

      /* ── SHEET / MODAL ──────────────────────────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 800;
        background: rgba(15, 23, 42, 0.45);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: 100%;
        max-width: 520px;
        max-height: 86vh;
        background: var(--surf);
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--bd4);
        margin: 10px auto 4px;
        flex-shrink: 0;
      }
      .sheet-hdr {
        padding: 10px 20px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--bd1);
        flex-shrink: 0;
      }
      .sheet-title {
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        min-width: 0;
      }
      .sheet-close {
        width: 28px;
        height: 28px;
        border-radius: 99px;
        background: var(--chip);
        border: none;
        font-size: 15px;
        color: var(--t2);
        cursor: pointer;
        flex-shrink: 0;
      }
      .sheet-body {
        padding: 16px 20px 24px;
        overflow-y: auto;
      }
      .f-group {
        margin-bottom: 14px;
      }
      .f-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--t3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 7px;
      }
      .f-input {
        width: 100%;
        height: 44px;
        border: 1px solid var(--bd4);
        border-radius: 11px;
        padding: 0 13px;
        font-size: 14px;
        color: var(--ink);
        background: #fff;
        outline: none;
      }
      .f-input:focus {
        border-color: var(--brand);
      }
      textarea.f-input {
        height: auto;
        padding: 12px 13px;
        line-height: 1.6;
        resize: vertical;
      }
      .f-row {
        display: flex;
        gap: 10px;
      }
      .f-hint {
        font-size: 11px;
        color: var(--t3);
        margin-top: 6px;
        line-height: 1.6;
      }
      .btn {
        width: 100%;
        height: 46px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      .btn-blue {
        background: var(--brand);
        color: #fff;
      }
      .btn-blue:disabled {
        opacity: 0.55;
      }
      .btn-soft {
        background: var(--chip);
        color: var(--t5);
      }
      .btn-sm {
        height: 38px;
        font-size: 12.5px;
      }
      .btn-danger {
        background: var(--red-bg);
        color: var(--red);
      }
      .btn-soft:disabled,
      .btn-danger:disabled {
        opacity: 0.55;
      }
      /* Tugma bosilganda ko'rsatiladigan "aylana" (spinner) — currentColor
         ishlatilgani uchun har qanday tugma rangiga (ko'k/qizil/yashil/
         neytral) avtomatik moslashadi, alohida variant kerak emas. */
      .spinner {
        display: inline-block;
        width: 13px;
        height: 13px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: btn-spin 0.6s linear infinite;
        vertical-align: -2px;
        opacity: 0.85;
      }
      @keyframes btn-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .cycle-item {
        border: 1px solid var(--bd2);
        border-radius: 12px;
        margin-bottom: 8px;
        overflow: hidden;
        background: #fff;
      }
      .cycle-item-top {
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
      }
      .cycle-item-label {
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
      }
      .cycle-item-sub {
        font-size: 11px;
        color: var(--t2);
        margin-top: 2px;
      }
      .cycle-item.debt .cycle-item-sub {
        color: var(--red);
      }
      .cycle-item-body {
        display: none;
        padding: 0 14px 14px;
      }
      .cycle-item.open .cycle-item-body {
        display: block;
      }
      .cycle-item.open .c-chev {
        transform: rotate(180deg);
      }
      .cb-section {
        margin-top: 12px;
      }
      .cb-head {
        margin-bottom: 8px;
      }
      .cb-badge {
        font-size: 10.5px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--chip2);
        color: var(--ink);
      }
      .c-chev {
        font-size: 12px;
        color: var(--chev);
        transition: transform 0.2s;
        flex-shrink: 0;
      }
      .perm-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ptag {
        border: 1px solid var(--bd4);
        background: #fff;
        color: var(--t5);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
      }
      .ptag.on {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .hidden-native {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
      }

      /* ── SANA TANLAGICH (custom calendar popover) — brauzer nativ
         input[type=date] o'rniga, dizayn tizimiga mos ────────────────── */
      .date-field {
        width: 100%;
        height: 44px;
        border: 1px solid var(--bd4);
        border-radius: 11px;
        padding: 0 13px;
        font-size: 14px;
        color: var(--ink);
        background: #fff;
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
      }
      .date-field:hover {
        border-color: var(--brand);
      }
      .date-field.placeholder {
        color: var(--t4);
      }
      .date-field-ico {
        width: 16px;
        height: 16px;
        color: var(--t3);
        flex-shrink: 0;
      }
      .date-field-ico svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .datepicker-pop {
        position: fixed;
        z-index: 850;
        width: 280px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18), 0 2px 8px rgba(15, 23, 42, 0.08);
        border: 1px solid var(--bd2);
        padding: 14px;
      }
      .dp-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .dp-hdr-label {
        font-weight: 600;
        font-size: 13.5px;
        color: var(--ink);
      }
      .dp-nav-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: none;
        background: var(--chip);
        color: var(--t2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .dp-nav-btn svg {
        width: 13px;
        height: 13px;
      }
      .dp-nav-btn:hover {
        background: var(--chip2);
      }
      .dp-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        margin-bottom: 2px;
      }
      .dp-weekday {
        text-align: center;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--t4);
        padding: 4px 0;
      }
      .dp-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .dp-day {
        height: 32px;
        border-radius: 8px;
        border: none;
        background: none;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dp-day:hover {
        background: var(--chip);
      }
      .dp-day:disabled {
        cursor: default;
        opacity: 0.4;
      }
      .dp-day.other-month {
        color: var(--chev);
      }
      .dp-day.today {
        box-shadow: inset 0 0 0 1.5px var(--brand);
      }
      .dp-day.selected {
        background: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      .dp-footer {
        display: flex;
        justify-content: center;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--bd1);
      }
      .dp-today-btn {
        font-size: 12px;
        font-weight: 600;
        color: var(--brand);
        background: none;
        border: none;
        cursor: pointer;
      }

      /* ── KATTA EKRAN (Telegram Desktop) ──────────────────────────
         Dizayn tizimi (ranglar, komponentlar) o'zgarmaydi — desktop
         dizaynerdan kelgan yo'nalishga mos: doimiy chap navigatsiya
         (Bottom Nav o'rniga), Boshqaruv/Tracker/Ruxsatlar kengroq
         joy — jadval va yonma-yon panellar bilan. 860px'dan pastda
         hech narsa o'zgarmaydi (mobil bir xilligicha qoladi). */
      .desktop-only {
        display: none !important;
      }
      .desktop-flex {
        display: none !important;
      }
      #sidebar {
        display: none;
      }
      @media (min-width: 860px) {
        body {
          display: block;
        }
        .desktop-only {
          display: block !important;
        }
        .desktop-flex {
          display: flex !important;
        }
        .mobile-only {
          display: none !important;
        }
        #bottom-nav {
          display: none;
        }
        .overlay {
          align-items: center;
        }
        .sheet {
          border-radius: 20px;
          max-height: 80vh;
        }
        .sheet.wide {
          max-width: 920px;
        }

        /* ── Chap sidebar ─────────────────────────────────────────── */
        #sidebar {
          display: flex;
          flex-direction: column;
          width: 248px;
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          background: var(--surf);
          border-right: 1px solid var(--bd2);
          padding: calc(18px + var(--tg-safe-top)) 14px 18px;
          z-index: 100;
          transition: width 0.22s ease;
        }
        .sb-toggle {
          position: absolute;
          top: calc(22px + var(--tg-safe-top));
          right: -12px;
          width: 24px;
          height: 24px;
          border-radius: 50%;
          background: #fff;
          border: 1px solid var(--bd2);
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: var(--t3);
          box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
          z-index: 101;
          padding: 0;
          transition: background 0.15s ease, color 0.15s ease;
        }
        .sb-toggle:hover {
          background: var(--chip);
          color: var(--ink);
        }
        .sb-toggle svg {
          width: 14px;
          height: 14px;
          display: block;
          transition: transform 0.22s ease;
        }
        .sb-brand {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 4px 8px 20px;
        }
        .sb-brand-text,
        .sb-user-text {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-mark {
          width: 34px;
          height: 34px;
          border-radius: 10px;
          background: var(--brand);
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 600;
          font-size: 13px;
          flex-shrink: 0;
        }
        .sb-brand-name {
          font-weight: 600;
          font-size: 13.5px;
          color: var(--ink);
        }
        .sb-brand-sub {
          font-size: 11px;
          color: var(--t3);
          margin-top: 1px;
        }
        .sb-nav {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .sb-item {
          display: flex;
          align-items: center;
          gap: 11px;
          padding: 10px 12px;
          border-radius: 10px;
          border: none;
          background: none;
          cursor: pointer;
          font-size: 13.5px;
          font-weight: 500;
          color: var(--t5);
          text-align: left;
          font-family: inherit;
        }
        .sb-item .sb-ico {
          width: 19px;
          height: 19px;
          color: var(--nav-off);
          flex-shrink: 0;
        }
        .sb-item .sb-ico svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        .sb-item .sb-lbl {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-item .sb-count {
          font-size: 11.5px;
          color: var(--t3);
          font-weight: 500;
          transition: opacity 0.12s ease;
        }
        .sb-item .sb-count.danger {
          color: var(--red);
          background: var(--red-bg);
          padding: 2px 7px;
          border-radius: 99px;
          font-weight: 700;
        }
        .sb-item.active {
          background: rgba(47, 122, 185, 0.1);
          color: var(--brand);
          font-weight: 600;
        }
        .sb-item.active .sb-ico {
          color: var(--brand);
        }
        .sb-sub-label {
          font-weight: 600;
          font-size: 10.5px;
          color: var(--t3);
          letter-spacing: 0.06em;
          text-transform: uppercase;
          margin: 20px 12px 8px;
        }
        .sb-projects {
          display: flex;
          flex-direction: column;
          gap: 1px;
          max-height: 45vh;
          overflow-y: auto;
          overflow-x: hidden;
        }
        .sb-proj-row {
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 7px 12px;
          border-radius: 8px;
          font-size: 12.5px;
          color: var(--t5);
          cursor: pointer;
          border: none;
          background: none;
          font-family: inherit;
          width: 100%;
          text-align: left;
        }
        .sb-proj-row:hover {
          background: var(--bg);
        }
        .sb-proj-dot {
          width: 7px;
          height: 7px;
          border-radius: 99px;
          background: var(--brand);
          flex-shrink: 0;
        }
        .sb-proj-dot.debt {
          background: var(--red);
        }
        .sb-proj-name {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .sb-proj-val {
          font-size: 11.5px;
          color: var(--t3);
          font-weight: 500;
          flex-shrink: 0;
        }
        .sb-proj-val.debt {
          color: var(--red);
          font-weight: 600;
        }
        .sb-spacer {
          flex: 1;
        }
        .sb-user {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px;
          border: 1px solid var(--bd2);
          border-radius: 12px;
          background: none;
          cursor: pointer;
          text-align: left;
          width: 100%;
          font-family: inherit;
        }
        .sb-user-name {
          font-weight: 600;
          font-size: 12.5px;
          color: var(--ink);
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .sb-user-role {
          font-size: 11px;
          color: var(--t3);
          margin-top: 1px;
        }
        .sb-user .chev {
          transition: opacity 0.12s ease;
        }

        /* ── Sidebar yig'ilgan holati: faqat ikonkalar, kontent avtomatik
           kengayadi. body.sidebar-collapsed — yagona holat manbai. ────── */
        body.sidebar-collapsed #sidebar {
          width: 72px;
        }
        body.sidebar-collapsed .sb-toggle svg {
          transform: rotate(180deg);
        }
        body.sidebar-collapsed .sb-brand {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
        }
        body.sidebar-collapsed .sb-item {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
          gap: 0;
        }
        body.sidebar-collapsed .sb-brand-text,
        body.sidebar-collapsed .sb-item .sb-lbl,
        body.sidebar-collapsed .sb-item .sb-count,
        body.sidebar-collapsed .sb-sub-label,
        body.sidebar-collapsed .sb-projects,
        body.sidebar-collapsed .sb-user-text,
        body.sidebar-collapsed .sb-user .chev {
          opacity: 0;
          pointer-events: none;
        }
        body.sidebar-collapsed .sb-item .sb-lbl,
        body.sidebar-collapsed .sb-item .sb-count {
          width: 0;
          min-width: 0;
          flex: 0;
        }
        /* box-sizing:border-box tufayli padding width:0'dan ustun
           turadi (chekka+padding yig'indisi minimal kenglik bo'lib
           qoladi) — shu sabab "Loyihalar" ikonkasidagi qarz-hisoblagichi
           14px joy band qilib, faqat o'sha ikonkani markazdan siljitib
           qo'yardi. Padding'ni ham 0'ga tushirish shart. */
        body.sidebar-collapsed .sb-item .sb-count {
          padding: 0;
        }
        body.sidebar-collapsed .sb-sub-label,
        body.sidebar-collapsed .sb-projects {
          height: 0;
          margin: 0;
          overflow: hidden;
        }
        body.sidebar-collapsed .sb-user {
          justify-content: center;
          padding-left: 6px;
          padding-right: 6px;
          gap: 0;
        }
        /* .sb-user-text (flex:1) o'zi kengayib ketmasligi, .chev esa
           (global .chev klassida flex-shrink:0 bor — boshqa joylarda
           kichraymasligi kerak bo'lgani uchun) shu yerda kichraymay
           qolib, tugmani sidebar chekkasidan tashqariga chiqarib
           yuborardi — xuddi qarz-hisoblagichidagi kabi (padding emas,
           bu safar flex-shrink:0 sabab). Ikkalasini ham 0'ga tushiramiz. */
        body.sidebar-collapsed .sb-user-text,
        body.sidebar-collapsed .sb-user .chev {
          width: 0;
          min-width: 0;
          flex: 0 0 0;
          overflow: hidden;
        }

        /* ── Kontent ustuni: sidebar uchun joy + kengroq o'qish maydoni ── */
        .screen {
          margin-left: 248px;
          max-width: none;
          width: auto;
          box-shadow: none;
          transition: margin-left 0.22s ease;
        }
        body.sidebar-collapsed .screen {
          margin-left: 72px;
        }
        .hdr,
        .trk-hdr,
        .np-hdr,
        .np-footer,
        .scroll {
          max-width: 880px;
          margin-left: auto;
          margin-right: auto;
          width: 100%;
        }
        #screen-today .hdr,
        #screen-today .scroll,
        #screen-projects .hdr,
        #screen-projects .scroll,
        #screen-tasks .hdr,
        #screen-tasks .scroll,
        #screen-tracker .trk-hdr,
        #screen-admin .hdr,
        #screen-admin .scroll {
          max-width: none;
          padding-left: 32px;
          padding-right: 32px;
          transition: padding-left 0.22s ease;
        }
        /* Sidebar yig'ilganda ikonka ustuni (72px) juda tor bo'lgani
           uchun avvalgi 32px chekka bo'shlig'i endi keragidan ortiq
           bo'sh joy qoldirardi — kontent ikonkalarga yaqinroq siljiydi. */
        body.sidebar-collapsed #screen-today .hdr,
        body.sidebar-collapsed #screen-today .scroll,
        body.sidebar-collapsed #screen-projects .hdr,
        body.sidebar-collapsed #screen-projects .scroll,
        body.sidebar-collapsed #screen-tasks .hdr,
        body.sidebar-collapsed #screen-tasks .scroll,
        body.sidebar-collapsed #screen-tracker .trk-hdr,
        body.sidebar-collapsed #screen-admin .hdr,
        body.sidebar-collapsed #screen-admin .scroll {
          padding-left: 20px;
        }
        body.sidebar-collapsed #screen-tracker .trk-main {
          padding-left: 20px;
        }
        #screen-history .hdr,
        #screen-history .scroll {
          max-width: 1400px;
        }

        /* ── Sarlavha qatori: mobil bir ustunda, katta ekranda sarlavha
           chapda + qidiruv o'ngda, bitta qatorda (Loyihalar/Tarix/
           Boshqaruv sarlavhalari to'liq kenglikka cho'zilib ketmasin) ─── */
        .hdr-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
        }
        .hdr-row > *:first-child {
          flex: 1;
          min-width: 0;
        }
        .hdr-row .search-box {
          margin-top: 0;
          width: 320px;
          flex-shrink: 0;
        }
        /* Boshqaruv: DOM tartibi (sarlavha, atabs, qidiruv) mobilda
           saqlanishi shart bo'lgani uchun qidiruv katta ekranda faqat
           CSS order bilan sarlavha yoniga ko'chiriladi. */
        #admin-hdr {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 12px;
        }
        #admin-hdr .hdr-title {
          order: 1;
          flex: 1;
          min-width: 0;
        }
        #admin-hdr .search-box {
          order: 2;
          margin-top: 0;
          width: 320px;
          flex-shrink: 0;
        }
        #admin-hdr .atabs {
          order: 3;
          flex-basis: 100%;
          margin-top: 4px;
        }

        /* ── Tracker: kalendar + o'ng panel yonma-yon ────────────────── */
        #screen-tracker .trk-main {
          flex-direction: row;
          gap: 20px;
          align-items: flex-start;
          max-width: none;
          width: 100%;
          padding: 0 32px 28px;
        }
        #screen-tracker #tracker-body {
          max-width: none;
          margin: 0;
          flex: 1;
          min-width: 0;
          padding: 16px 0 0;
        }
        .trk-rail {
          width: 340px;
          flex-shrink: 0;
          position: sticky;
          top: 16px;
          padding-top: 16px;
        }
        /* Katta ekranda kalendar butun kenglikka cho'zilib, katakchalar
           haddan tashqari yirik bo'lib ketmasligi uchun ixcham kenglikka
           qisiladi (mobil o'lchamiga yaqin, faqat o'qilishi qulayroq). */
        #screen-tracker .cal-week,
        #screen-tracker .cal-grid {
          max-width: 400px;
        }

        /* ── Umumiy: statistik kartalar, jadval, ikki ustunli maket ──── */
        .dash-cols {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 20px;
          align-items: start;
        }
        .stat-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          margin-bottom: 20px;
        }
        .stat-card {
          background: #fff;
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 18px;
        }
        .stat-card.tempo {
          background: var(--brand);
          border-color: var(--brand);
        }
        .stat-card.tempo .stat-lbl {
          color: rgba(255, 255, 255, 0.7);
        }
        .stat-card.tempo .stat-val {
          color: #fff;
        }
        .stat-card.tempo .stat-foot {
          color: rgba(255, 255, 255, 0.7);
        }
        .stat-card.danger {
          border-color: var(--red-bd);
        }
        .stat-card.danger .stat-lbl,
        .stat-card.danger .stat-val,
        .stat-card.danger .stat-foot,
        .stat-card.danger .stat-link {
          color: var(--red);
        }
        .stat-bar {
          margin-top: 14px;
          height: 6px;
          border-radius: 99px;
          background: rgba(255, 255, 255, 0.28);
          overflow: hidden;
        }
        .stat-bar-fill {
          height: 100%;
          background: #fff;
          border-radius: 99px;
        }
        .stat-lbl {
          font-size: 11px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }
        .stat-val {
          font-weight: 600;
          font-size: 34px;
          color: var(--ink);
          line-height: 1;
          margin-top: 12px;
          letter-spacing: -0.03em;
        }
        .stat-val .stat-sub {
          font-size: 17px;
          color: var(--t3);
          font-weight: 500;
        }
        .stat-foot {
          font-size: 12px;
          color: var(--t3);
          margin-top: 12px;
        }
        .stat-link {
          color: var(--brand);
          font-weight: 600;
          cursor: pointer;
        }
        .dtbl-wrap {
          background: #fff;
          border: 1px solid var(--bd2);
          border-radius: 14px;
          overflow: hidden;
          margin-bottom: 20px;
        }
        .card-hdr {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 14px 16px;
          border-bottom: 1px solid var(--bd2);
          background: var(--surf2);
          flex-wrap: wrap;
        }
        .card-hdr-title {
          font-weight: 600;
          font-size: 13.5px;
          color: var(--ink);
          flex-shrink: 0;
        }
        .dtbl tr.debt-row td {
          background: var(--red-bg);
        }
        .dtbl tr.debt-row.clickable:hover td {
          background: #f9dcd9;
        }
        .dtbl-bar-wrap {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .dtbl-bar-wrap .hist-track {
          width: 60px;
          flex-shrink: 0;
        }
        .dtbl {
          width: 100%;
          border-collapse: collapse;
          font-size: 13px;
        }
        .dtbl th {
          text-align: left;
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.05em;
          padding: 11px 16px;
          border-bottom: 1px solid var(--bd2);
          background: var(--surf2);
        }
        .dtbl td {
          padding: 12px 16px;
          border-bottom: 1px solid var(--bd1);
          color: var(--t5);
        }
        .dtbl tr:last-child td {
          border-bottom: none;
        }
        .dtbl tr.clickable {
          cursor: pointer;
        }
        .dtbl tr.clickable:hover td {
          background: var(--surf2);
        }
        .dtbl .dtbl-name {
          font-weight: 600;
          color: var(--ink);
        }
        .wk-bars {
          display: flex;
          align-items: flex-end;
          height: 52px;
          margin: 14px 0 6px;
        }
        .wk-bar-col {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-end;
          height: 100%;
        }
        .wk-bar-track {
          position: relative;
          width: 60%;
          min-width: 10px;
          border-radius: 4px;
          background: var(--chip3);
          overflow: visible;
          cursor: default;
        }
        .wk-bar-fill {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          border-radius: 4px;
          background: var(--brand);
        }
        .wk-bar-drop {
          position: absolute;
          left: 50%;
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: var(--brand);
          border: 2px solid #fff;
          box-shadow: 0 0 0 1px var(--bd2);
          transform: translate(-50%, 50%);
        }
        .wk-bar-lbl {
          font-size: 9.5px;
          color: var(--t3);
          text-align: center;
          margin-top: 6px;
        }

        /* ── Loyihalar/Vazifalar: kartochka to'ri va kanban ──────────── */
        .pgrid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 14px;
        }
        .pcard {
          background: #fff;
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 16px;
          cursor: pointer;
        }
        .pcard:hover {
          border-color: var(--bd4);
        }
        .pcard-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 10px;
        }
        .pcard-pct {
          font-weight: 700;
          font-size: 13px;
          color: var(--brand);
        }
        .kanban {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
          align-items: start;
        }

        /* ── Tabel: ikki ustun yonma-yon ──────────────────────────────── */
        .two-col {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 24px;
          align-items: start;
        }

        /* ── Ruxsatlar matritsasi ─────────────────────────────────────── */
        .pmx-wrap {
          background: #fff;
          border: 1px solid var(--bd2);
          border-radius: 14px;
          overflow: auto;
          margin-bottom: 16px;
        }
        .pmx {
          border-collapse: collapse;
          font-size: 12px;
          width: 100%;
        }
        .pmx th,
        .pmx td {
          padding: 12px 14px;
          text-align: center;
          border-bottom: 1px solid var(--bd1);
        }
        .pmx th.pmx-emp,
        .pmx td.pmx-emp {
          text-align: left;
          position: sticky;
          left: 0;
          background: #fff;
          z-index: 1;
          min-width: 190px;
        }
        .pmx thead th {
          font-size: 10.5px;
          font-weight: 500;
          line-height: 1.3;
          color: var(--t5);
          white-space: normal;
          background: var(--surf2);
          vertical-align: bottom;
          height: 58px;
        }
        .pmx thead th.pmx-emp {
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          background: var(--surf2);
        }
        .pmx thead th.pmx-total {
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          text-align: right;
        }
        .pmx-emp-name {
          font-weight: 600;
          font-size: 13.5px;
          color: var(--ink);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 140px;
        }
        .pmx-emp-sub {
          font-size: 11px;
          color: var(--chev);
          margin-top: 1px;
        }
        .pmx-cell {
          width: 26px;
          height: 26px;
          padding: 0;
          margin: 0 auto;
          cursor: pointer;
          font-size: 12px;
          font-weight: 700;
          border-radius: 8px;
          background: var(--chip);
          border: 1px solid var(--bd2);
          color: transparent;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .pmx-cell.on {
