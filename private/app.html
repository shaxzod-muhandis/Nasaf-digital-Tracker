          line-height: 1.7;
          max-width: none;
          margin-top: 0;
          min-height: 48px;
        }
        .ntf-tools { display: none; }
        .ntf-card.pad { padding: 14px 16px 16px; }
        /* Tugmalar qatori telefonda o'ngga suriladi */
        .ntf-quick {
          flex-wrap: nowrap;
          overflow-x: auto;
          scrollbar-width: none;
          margin-right: -16px;
        }
        .ntf-quick::-webkit-scrollbar { display: none; }
        .ntf-foot-in { display: none; }
        .ntf-foot-m {
          display: block;
          padding: 10px 16px calc(26px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
        }
        .ntf-foot-m .ntf-sum { margin-bottom: 8px; font-size: 12.5px; }
        .ntf-foot-m .ntf-sum .ntf-av { width: 20px; height: 20px; border-radius: 7px; font-size: 9px; }
        .ntf-foot-m .ntf-btn { width: 100%; height: 52px; }
        .ntf-foot-m .ntf-missing { margin-bottom: 8px; text-align: left; }
      }
      /* Mobil/katta ekranga xos bloklar. Faqat yashirish qoidasi
         beriladi — `display: block` bilan yoqish flex/grid elementning
         o'z turini buzib yuborardi. */
      @media (min-width: 768px) {
        .ntf-only-m { display: none !important; }
      }
      @media (max-width: 767px) {
        .ntf-only-d { display: none !important; }
      }

      /* ── BELGILASH SAHIFASI ─────────────────────────────────────────
         Sahifaning o'zi vazifa formasi bilan bir xil ko'rinishdan
         (.ntv3-*) foydalanadi — bu yerda faqat unga xos uchta narsa. */
      .cwd-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 2px 4px 4px;
      }
      .cwd-chip {
        background: var(--brand);
        color: #fff;
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 12.5px;
        font-weight: 700;
      }
      .cwd-sub { font-size: 13px; color: var(--v3-t2); }
      /* Natija izohi — ish kimning nomiga yozilishini oldindan aytadi */
      .cwd-note {
        display: flex;
        gap: 9px;
        background: var(--surf);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 12px;
      }
      .cwd-note-ico { color: var(--brand); padding-top: 1px; flex: none; display: flex; }
      .cwd-note-txt { font-size: 12.5px; color: var(--t5); line-height: 1.5; }

      /* ── VAZIFA DETALI — mobil (v3) ─────────────────────────────────── */
      .tdm-hdr {
        background: var(--surf);
        border-bottom: 1px solid var(--bd1);
        padding: calc(10px + var(--tg-safe-top)) 16px 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tdm-iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 0;
        background: var(--chip);
        color: var(--t5);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        cursor: pointer;
        font-family: inherit;
      }
      .tdm-hdr-mid {
        flex: 1;
        min-width: 0;
        text-align: center;
      }
      .tdm-hdr-ref {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--t5);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tdm-hdr-sub {
        font-size: 11.5px;
        color: var(--v3-t3);
        margin-top: 1px;
        font-variant-numeric: tabular-nums;
      }
      .tdm-wrap {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 16px 0;
      }
      /* Muddat banneri */
      .tdm-banner {
        display: flex;
        align-items: center;
        gap: 11px;
        background: var(--red-bg);
        border: 1px solid rgba(220, 38, 38, 0.25);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .tdm-banner.soft {
        background: var(--amber-bg);
        border-color: rgba(217, 119, 6, 0.25);
      }
      .tdm-banner-ico {
        width: 20px;
        height: 20px;
        color: var(--red);
        flex: none;
        display: flex;
      }
      .tdm-banner.soft .tdm-banner-ico { color: var(--amber); }
      .tdm-banner-t {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--red);
      }
      .tdm-banner.soft .tdm-banner-t { color: var(--amber); }
      .tdm-banner-s {
        font-size: 12px;
        color: var(--v3-t2);
        margin-top: 2px;
      }
      /* Asosiy karta: teg + sarlavha + tavsif */
      .tdm-card {
        background: var(--surf);
        border-radius: 14px;
        padding: 14px;
      }
      .tdm-title {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--ink, var(--t5));
        margin-top: 10px;
      }
      .tdm-desc {
        font-size: 15px;
        font-weight: 400;
        line-height: 1.75;
        color: var(--v3-t2);
        margin-top: 12px;
        white-space: pre-wrap;
      }
      /* Xossalar kartasi */
      .tdm-props {
        background: var(--surf);
        border-radius: 14px;
        padding: 2px 14px;
      }
      .tdm-prop {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
      }
      .tdm-prop + .tdm-prop { border-top: 1px solid var(--bd1); }
      .tdm-prop-lbl {
        width: 108px;
        flex: none;
        font-size: 13px;
        color: var(--v3-t3);
      }
      .tdm-prop-val {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--t5);
        justify-content: flex-end;
        text-align: right;
      }
      .tdm-prop-val.link { color: var(--brand); }
      /* Checklist */
      .tdm-check-hdr {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 2px 0 6px;
      }
      .tdm-check-t {
        font-size: 13px;
        font-weight: 600;
        color: var(--t5);
        flex: 1;
      }
      .tdm-check-n {
        font-size: 12.5px;
        color: var(--v3-t3);
        font-variant-numeric: tabular-nums;
      }
      .tdm-check-row {
        display: flex;
        align-items: center;
        gap: 11px;
        height: 40px;
      }
      .tdm-check-row + .tdm-check-row { border-top: 1px solid var(--bd1); }
      .tdm-check-box {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1.5px solid var(--track);
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      .tdm-check-box.done {
        background: var(--green);
        border-color: var(--green);
      }
      .tdm-check-txt {
        font-size: 14px;
        color: var(--t5);
        flex: 1;
        min-width: 0;
      }
      .tdm-check-txt.done {
        text-decoration: line-through;
        color: var(--v3-t4);
      }
      /* Pastki panel: bosqich ko'rsatkichi + amal tugmasi */
      /* Bo'sh bo'lsa (detal hali chizilmagan) — ko'rinmasin */
      .tdm-bar:empty,
      .tdm-hdr:empty {
        display: none;
      }
      /* Ekran `min-height:100dvh` bo'lgani uchun (hujjatning o'zi
         aylanadi) panel `sticky` qilinadi — ro'yxat uzun bo'lsa ham
         pastda ko'rinib turadi. */
      .tdm-bar {
        position: sticky;
        bottom: 0;
        z-index: 5;
        flex-shrink: 0;
        background: var(--surf);
        border-top: 1px solid var(--bd1);
        padding: 12px 16px calc(12px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .tdm-steps {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tdm-step-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--track);
        flex: none;
      }
      .tdm-step-dot.done { background: var(--green); }
      .tdm-step-dot.current {
        width: 12px;
        height: 12px;
        background: var(--brand);
        box-shadow: 0 0 0 4px rgba(47, 122, 185, 0.18);
      }
      .tdm-step-line {
        height: 2px;
        flex: 1;
        background: var(--track);
        margin: 0 6px;
      }
      .tdm-step-line.done { background: var(--green); }
      .tdm-bar-row {
        display: flex;
        gap: 10px;
      }
      .tdm-act {
        flex: 1;
        height: 50px;
        border-radius: 12px;
        border: 0;
        background: var(--brand);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .tdm-act.green { background: var(--green); }
      .tdm-act[disabled] {
        background: var(--chip);
        color: var(--v3-t4);
        cursor: default;
      }
      .tdm-more {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        border: 0;
        background: var(--chip);
        color: var(--t5);
        font-size: 18px;
        flex: none;
        cursor: pointer;
        font-family: inherit;
      }

      /* ── VAZIFA DETALI PANELI ───────────────────────────────────────── */
      .td-hdr {
        background: var(--surf);
        border-bottom: 1px solid var(--bd1);
        padding: calc(10px + var(--tg-safe-top)) 20px 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .detail-breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
        font-size: 12.5px;
        color: var(--t3);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .detail-breadcrumb b {
        color: var(--ink);
        font-weight: 600;
      }
      .detail-breadcrumb .bc-link {
        cursor: pointer;
      }
      .detail-breadcrumb .bc-link:hover {
        color: var(--brand);
        text-decoration: underline;
      }
      .detail-nav-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--chip);
        border: none;
        color: var(--t2);
        font-size: 13px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .detail-nav-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .td-badge {
        height: 25px;
        padding: 0 10px;
        border-radius: 7px;
        font-size: 11.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .td-badge.solid-red {
        background: var(--red);
        color: #fff;
      }
      .td-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .td-title {
        font-size: 21px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin-top: 14px;
      }
      .td-status-btn {
        width: 100%;
        height: 42px;
        border-radius: 11px;
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        cursor: pointer;
      }
      .td-status-btn .dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .td-status-btn.solid-green {
        background: var(--green);
        color: #fff;
      }
      .td-status-btn.solid-green .dot {
        background: var(--surf);
      }
      .td-status-btn.tint-amber {
        background: var(--amber-bg);
        color: var(--amber-ink);
        border: 1px solid rgba(217, 119, 6, 0.32);
      }
      .td-status-btn.tint-amber .dot {
        background: var(--amber);
      }
      .td-status-btn.tint-red {
        background: var(--red-bg);
        color: var(--red);
        border: 1px solid rgba(220, 38, 38, 0.28);
      }
      .td-status-btn.tint-red .dot {
        background: var(--red);
      }
      .td-status-btn.tint-blue {
        background: var(--tagblue-bg);
        color: var(--tagblue);
        border: 1px solid rgba(47, 122, 185, 0.3);
      }
      .td-status-btn.tint-blue .dot {
        background: var(--brand);
      }
      .td-status-btn:disabled {
        opacity: 0.6;
      }
      .td-check-row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 13px;
        border: 1px solid var(--bd2);
        border-radius: 11px;
        background: var(--surf);
        margin-bottom: 10px;
      }
      .td-check-box {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1.8px solid var(--nav-off);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .td-check-box.done {
        background: var(--brand);
        border-color: var(--brand);
      }
      .td-check-text {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
        word-break: break-word;
      }
      .td-check-text.done {
        color: var(--t3);
        text-decoration: line-through;
      }
      .td-check-del {
        color: var(--t4);
        cursor: pointer;
        font-size: 15px;
        flex-shrink: 0;
        line-height: 1;
      }
      .td-check-add-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 6px;
      }
      .task-detail-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
      }
      @media (min-width: 860px) {
        .task-detail-grid.two-col {
          grid-template-columns: 1.4fr 1fr;
        }
      }
      .detail-desc {
        font-size: 13px;
        color: var(--t5);
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .detail-prop-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--bd1);
        font-size: 13px;
      }
      .detail-prop-row:last-child {
        border-bottom: none;
      }
      .detail-prop-label {
        color: var(--t3);
        flex-shrink: 0;
      }
      .detail-prop-val {
        color: var(--ink);
        font-weight: 500;
        text-align: right;
        min-width: 0;
      }
      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin: 14px 0;
      }
      .activity-item.system {
        display: flex;
        align-items: baseline;
        gap: 9px;
        font-size: 12px;
        color: var(--t3);
        line-height: 1.5;
      }
      .activity-item.system::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--bd4);
        flex: none;
        position: relative;
        top: -1px;
      }
      .activity-system-action {
        color: var(--t3);
      }
      .activity-item.comment {
        display: flex;
        gap: 10px;
      }
      .activity-comment-body {
        background: var(--surf2);
        border: 1px solid var(--bd1);
        border-radius: 12px;
        padding: 10px 13px;
        font-size: 13.5px;
        color: var(--t5);
        line-height: 1.65;
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .activity-comment-meta {
        font-size: 12.5px;
        display: flex;
        align-items: baseline;
        gap: 7px;
      }
      .activity-comment-meta .name {
        font-weight: 600;
        color: var(--t2);
      }
      .activity-time {
        font-size: 11px;
        color: var(--t4);
        white-space: nowrap;
      }
      .comment-composer {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .comment-composer textarea {
        flex: 1;
        min-height: 40px;
        resize: vertical;
      }
      .atabs {
        display: flex;
        gap: 4px;
        background: var(--chip);
        padding: 3px;
        border-radius: 10px;
        margin-top: 13px;
        overflow-x: auto;
      }
      .atab {
        flex: 1 0 auto;
        min-width: 76px;
        height: 31px;
        padding: 0 10px;
        border-radius: 7px;
        border: none;
        background: none;
        font-size: 12.5px;
        color: var(--t2);
        cursor: pointer;
        white-space: nowrap;
      }
      .atab.active {
        background: var(--surf);
        color: var(--ink);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
      }

      /* ── VAZIFA DETALI — kartalar, bosqich ko'rsatkichi ───────────── */
      .td-counter {
        font-size: 11.5px;
        color: var(--t4);
        flex-shrink: 0;
      }
      .td-card {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 16px;
        padding: 20px 22px 18px;
      }
      @media (max-width: 640px) {
        .td-card {
          padding: 16px 16px 14px;
          border-radius: 14px;
        }
      }
      .td-overdue-banner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        border-radius: 13px;
        background: var(--red-bg);
        border: 1px solid var(--red-bd);
      }
      .td-overdue-ico {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--red);
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .td-overdue-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--red);
      }
      .td-overdue-sub {
        font-size: 11.5px;
        color: var(--t3);
        margin-top: 2px;
      }
      .td-overdue-btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 9px;
        background: var(--surf);
        border: 1px solid var(--red-bd2);
        font-size: 12px;
        font-weight: 600;
        color: var(--red);
        cursor: pointer;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .td-check-progress {
        width: 76px;
        height: 5px;
        border-radius: 99px;
        background: var(--chip2);
        overflow: hidden;
        flex-shrink: 0;
      }
      .td-check-progress-fill {
        height: 100%;
        background: var(--green);
        border-radius: 99px;
      }
      .td-stepper {
        display: flex;
        align-items: flex-start;
        margin-top: 14px;
      }
      .td-stepper-step {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }
      .td-stepper-step:last-child {
        flex: 0 0 auto;
      }
      .td-stepper-dotwrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }
      .td-stepper-dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--bd4);
      }
      .td-stepper-dot.done {
        background: var(--brand);
      }
      .td-stepper-dot.current {
        width: 13px;
        height: 13px;
        background: var(--brand);
        box-shadow: 0 0 0 4px rgba(47, 122, 185, 0.16);
      }
      .td-stepper-lbl {
        font-size: 10.5px;
        color: var(--t3);
        white-space: nowrap;
      }
      .td-stepper-lbl.current {
        color: var(--brand);
        font-weight: 600;
      }
      .td-stepper-line {
        flex: 1;
        height: 2px;
        background: var(--bd4);
        margin: 0 6px 17px;
      }
      .td-stepper-line.done {
        background: var(--brand);
      }
      .td-status-btn.lg {
        height: 50px;
        border-radius: 13px;
        font-size: 14.5px;
      }
      .td-status-btn.solid-blue {
        background: var(--brand);
        color: #fff;
      }
      .td-status-btn.solid-blue .dot {
        background: rgba(255, 255, 255, 0.85);
      }
      .td-status-row {
        display: flex;
        gap: 8px;
        margin-top: 9px;
        flex-wrap: wrap;
      }
      .td-status-row .td-status-btn {
        width: auto;
        flex: 1;
        min-width: 120px;
      }
      .td-notify-hint {
        font-size: 11px;
        line-height: 1.55;
        color: var(--t4);
        margin-top: 11px;
      }
      .td-notify-hint b {
        font-weight: 600;
        color: var(--t2);
      }
      .td-bottom-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 4px;
      }
      .td-bottom-link {
        font-size: 12px;
        font-weight: 500;
        color: var(--t2);
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
      }
      .td-bottom-link.danger {
        color: var(--t3);
      }
      .td-bottom-link.danger:hover {
        color: var(--red);
      }

      /* ── TARIX ──────────────────────────────────────────────────── */
      .hist-card {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        margin-bottom: 8px;
        overflow: hidden;
      }
      .hist-head {
        padding: 13px 15px;
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
      }
      .hist-name {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
      }
      .hist-date {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 2px;
      }
      .hist-pct {
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
      }
      .hist-status {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .hist-status.active {
        background: rgba(47, 122, 185, 0.12);
        color: var(--brand);
      }
      .hist-status.debt {
        background: var(--red-bg);
        color: var(--red);
      }
      .hist-status.done {
        background: var(--chip2);
        color: var(--t5);
      }
      .hist-body {
        display: none;
        padding: 0 15px 14px;
      }
      .hist-card.open .hist-body {
        display: block;
      }
      .hist-card.open .c-chev {
        transform: rotate(180deg);
      }
      .hist-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 11.5px;
        color: var(--t2);
        margin-bottom: 8px;
      }
      .hist-track {
        height: 5px;
        border-radius: 99px;
        background: var(--chip3);
        overflow: hidden;
      }
      .hist-fill {
        height: 100%;
        background: var(--brand);
      }
      .hist-assignees {
        font-size: 11.5px;
        color: var(--t2);
        margin-top: 9px;
        line-height: 1.5;
      }
      .sel {
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--bd4);
        background: var(--surf);
        color: var(--t5);
        font-size: 12.5px;
        padding: 0 10px;
        outline: none;
      }

      /* ── SHEET / MODAL ──────────────────────────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 800;
        background: rgba(15, 23, 42, 0.45);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: 100%;
        max-width: 520px;
        max-height: 86vh;
        background: var(--surf);
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px));
      }
      .sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--bd4);
        margin: 10px auto 4px;
        flex-shrink: 0;
      }
      .sheet-hdr {
        padding: 10px 20px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--bd1);
        flex-shrink: 0;
      }
      .sheet-title {
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        min-width: 0;
      }
      .sheet-close {
        width: 28px;
        height: 28px;
        border-radius: 99px;
        background: var(--chip);
        border: none;
        font-size: 15px;
        color: var(--t2);
        cursor: pointer;
        flex-shrink: 0;
      }
      .sheet-body {
        /* Pastki bo'shliq — oxirgi tugma ekran chetiga yopishmasligi
           uchun. Oyna ichida aylantirish bor, lekin eng pastga
           kelganda ham tugma ostida bo'sh joy qolishi kerak. */
        padding: 16px 20px calc(24px + var(--tg-safe-bottom, 0px));
        overflow-y: auto;
      }
      .f-group {
        margin-bottom: 14px;
      }
      .f-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--t3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 7px;
      }
      .f-input {
        width: 100%;
        height: 44px;
        border: 1px solid var(--bd4);
        border-radius: 11px;
        padding: 0 13px;
        font-size: 14px;
        color: var(--ink);
        background: var(--surf);
        outline: none;
      }
      .f-input:focus {
        border-color: var(--brand);
      }
      textarea.f-input {
        height: auto;
        padding: 12px 13px;
        line-height: 1.6;
        resize: vertical;
      }
      .f-row {
        display: flex;
        gap: 10px;
      }
      .f-hint {
        font-size: 11px;
        color: var(--t3);
        margin-top: 6px;
        line-height: 1.6;
      }
      .announcement-user-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--bd1);
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
      }
      .announcement-user-row:last-child {
        border-bottom: none;
      }
      .announcement-user-row input {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        accent-color: var(--brand);
      }
      .btn {
        width: 100%;
        height: 46px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      .btn-blue {
        background: var(--brand);
        color: #fff;
      }
      .btn-blue:disabled {
        opacity: 0.55;
      }
      .btn-soft {
        background: var(--chip);
        color: var(--t5);
      }
      .btn-sm {
        height: 38px;
        font-size: 12.5px;
      }
      .btn-danger {
        background: var(--red-bg);
        color: var(--red);
      }
      .btn-soft:disabled,
      .btn-danger:disabled {
        opacity: 0.55;
      }
      /* Tugma bosilganda ko'rsatiladigan "aylana" (spinner) — currentColor
         ishlatilgani uchun har qanday tugma rangiga (ko'k/qizil/yashil/
         neytral) avtomatik moslashadi, alohida variant kerak emas. */
      .spinner {
        display: inline-block;
        width: 13px;
        height: 13px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: btn-spin 0.6s linear infinite;
        vertical-align: -2px;
        opacity: 0.85;
      }
      @keyframes btn-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .cycle-item {
        border: 1px solid var(--bd2);
        border-radius: 12px;
        margin-bottom: 8px;
        overflow: hidden;
        background: var(--surf);
      }
      .cycle-item-top {
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
      }
      .cycle-item-label {
        font-weight: 600;
        font-size: 13px;
        color: var(--ink);
      }
      .cycle-item-sub {
        font-size: 11px;
        color: var(--t2);
        margin-top: 2px;
      }
      .cycle-item.debt .cycle-item-sub {
        color: var(--red);
      }
      .cycle-item-body {
        display: none;
        padding: 0 14px 14px;
      }
      .cycle-item.open .cycle-item-body {
        display: block;
      }
      .cycle-item.open .c-chev {
        transform: rotate(180deg);
      }
      .cb-section {
        margin-top: 12px;
      }
      .cb-head {
        margin-bottom: 8px;
      }
      .cb-badge {
        font-size: 10.5px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--chip2);
        color: var(--ink);
      }
      .c-chev {
        font-size: 12px;
        color: var(--chev);
        transition: transform 0.2s;
        flex-shrink: 0;
      }
      .perm-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ptag {
        border: 1px solid var(--bd4);
        background: var(--surf);
        color: var(--t5);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
      }
      .ptag.on {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .hidden-native {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
      }

      /* ── SANA TANLAGICH (custom calendar popover) — brauzer nativ
         input[type=date] o'rniga, dizayn tizimiga mos ────────────────── */
      .date-field {
        width: 100%;
        height: 44px;
        border: 1px solid var(--bd4);
        border-radius: 11px;
        padding: 0 13px;
        font-size: 14px;
        color: var(--ink);
        background: var(--surf);
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
      }
      .date-field:hover {
        border-color: var(--brand);
      }
      .date-field.placeholder {
        color: var(--t4);
      }
      .date-field-ico {
        width: 16px;
        height: 16px;
        color: var(--t3);
        flex-shrink: 0;
      }
      .date-field-ico svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .datepicker-pop {
        position: fixed;
        z-index: 850;
        width: 280px;
        background: var(--surf);
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18), 0 2px 8px rgba(15, 23, 42, 0.08);
        border: 1px solid var(--bd2);
        padding: 14px;
      }
      .dp-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .dp-hdr-label {
        font-weight: 600;
        font-size: 13.5px;
        color: var(--ink);
      }
      .dp-nav-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: none;
        background: var(--chip);
        color: var(--t2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .dp-nav-btn svg {
        width: 13px;
        height: 13px;
      }
      .dp-nav-btn:hover {
        background: var(--chip2);
      }
      .dp-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        margin-bottom: 2px;
      }
      .dp-weekday {
        text-align: center;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--t4);
        padding: 4px 0;
      }
      .dp-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .dp-day {
        height: 32px;
        border-radius: 8px;
        border: none;
        background: none;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dp-day:hover {
        background: var(--chip);
      }
      .dp-day:disabled {
        cursor: default;
        opacity: 0.4;
      }
      .dp-day.other-month {
        color: var(--chev);
      }
      .dp-day.today {
        box-shadow: inset 0 0 0 1.5px var(--brand);
      }
      .dp-day.selected {
        background: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      /* ── Oraliq tanlash ────────────────────────────────────────────
         Ikki chekka to'q, oradagi kunlar ochroq yo'lak bo'lib turadi.
         Yo'lakning burchaklari faqat tashqi tomondan yumaloq — shunda
         chekkalar oradagi kunlar bilan bitta uzluksiz chiziq bo'lib
         ko'rinadi. */
      .dp-day.in-range {
        background: var(--nav-act-bg);
        color: var(--nav-act-ink);
        border-radius: 0;
      }
      /* Hafta qatori oxirida/boshida yo'lak kesilib qolmasin. */
      .dp-days .dp-day.in-range:nth-child(7n + 1) {
        border-radius: 8px 0 0 8px;
      }
      .dp-days .dp-day.in-range:nth-child(7n) {
        border-radius: 0 8px 8px 0;
      }
      .dp-day.r-start:not(.r-only) {
        border-radius: 8px 0 0 8px;
      }
      .dp-day.r-end:not(.r-only) {
        border-radius: 0 8px 8px 0;
      }
      .dp-rangebar {
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--bd1);
      }
      .dp-range-txt {
        font-size: 11.5px;
        color: var(--t2);
        text-align: center;
        margin-bottom: 8px;
        min-height: 15px;
      }
      .dp-range-btns {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dp-ghost-btn,
      .dp-done-btn {
        flex: 1;
        height: 32px;
        border-radius: 9px;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--bd2);
        background: var(--surf);
        color: var(--t5);
      }
      .dp-done-btn {
        border-color: transparent;
        background: var(--brand);
        color: #fff;
      }
      .dp-done-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .dp-footer {
        display: flex;
        justify-content: center;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--bd1);
      }
      .dp-today-btn {
        font-size: 12px;
        font-weight: 600;
        color: var(--brand);
        background: none;
        border: none;
        cursor: pointer;
      }

      /* ── KATTA EKRAN (Telegram Desktop) ──────────────────────────
         Dizayn tizimi (ranglar, komponentlar) o'zgarmaydi — desktop
         dizaynerdan kelgan yo'nalishga mos: doimiy chap navigatsiya
         (Bottom Nav o'rniga), Boshqaruv/Tracker/Ruxsatlar kengroq
         joy — jadval va yonma-yon panellar bilan. 860px'dan pastda
         hech narsa o'zgarmaydi (mobil bir xilligicha qoladi). */
      .desktop-only {
        display: none !important;
      }
      .desktop-flex {
        display: none !important;
      }
      #sidebar {
        display: none;
      }
      .pd-root { display: none; }

      /* ══ "BUGUN" SAHIFASI — v3 dizayni ═══════════════════════════ */
      /* Holat belgisi: qarz / ortda / rejada / oldinda. Nuqta ::before
         orqali — har holat uchun alohida markup yozilmasin. */
      .st-pill {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: none;
        white-space: nowrap;
      }
      .st-pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--dot);
      }
      .st-pill.st-debt { background: var(--st-debt-bg); color: var(--st-debt); --dot: var(--st-debt-dot); }
      .st-pill.st-behind { background: var(--st-behind-bg); color: var(--st-behind); --dot: var(--st-behind-dot); }
      .st-pill.st-mid { background: var(--st-mid-bg); color: var(--st-mid); --dot: var(--st-mid-dot); }
      .st-pill.st-onplan { background: var(--st-ahead-bg); color: var(--st-ahead); --dot: var(--st-ahead-dot); }
      .st-pill.st-ahead { background: var(--st-ahead-bg); color: var(--st-ahead); --dot: var(--st-ahead-dot); }
      .st-pill.st-done { background: var(--st-ahead-bg); color: var(--st-ahead); --dot: var(--st-ahead-dot); }

      /* Progress chizig'i + kutilgan joy ko'rsatkichi */
      .pbar {
        display: block;
        height: 6px;
        border-radius: 99px;
        background: var(--track);
        position: relative;
        overflow: visible;
      }
      .pbar-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 99px;
      }
      .pbar-marker {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        border-radius: 2px;
        background: var(--marker);
      }
      .st-fill-debt { background: var(--st-debt-dot); }
      .st-fill-behind { background: var(--st-behind-dot); }
      .st-fill-mid { background: var(--st-mid-dot); }
      .st-fill-onplan { background: var(--st-ahead-dot); }
      .st-fill-ahead { background: var(--st-ahead-dot); }
      .st-fill-done { background: var(--st-ahead-dot); }

      /* Tur belgisi — vazifa holati (Post/Stories o'rnida) */
      .type-pill {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        flex: none;
        white-space: nowrap;
        background: var(--type-post-bg);
        color: var(--type-post);
      }
      .type-pill.alt { background: var(--type-story-bg); color: var(--type-story); }

      /* ── Mobil: qorong'i davr kartasi ──────────────────────────── */
      .dcard {
        background: var(--dcard-bg);
        border-radius: 18px;
        padding: 16px 16px 14px;
        color: #fff;
      }
      .dcard-top {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
      }
      .dcard-val {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        margin-top: 8px;
      }
      .dcard-pct {
        font-size: 44px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .dcard-pct span { font-size: 22px; }
      .dcard-sub {
        font-size: 13.5px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        white-space: nowrap;
        padding-bottom: 5px;
      }
      .dcard-badge {
        height: 26px;
        padding: 0 9px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        margin-bottom: 3px;
        white-space: nowrap;
        background: rgba(74, 222, 128, 0.16);
        color: #86efac;
      }
      .dcard-badge.behind { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
      .dcard-bar {
        margin-top: 12px;
        height: 8px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        position: relative;
      }
      .dcard-bar-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 99px;
        background: #5795c6;
      }
      .dcard-bar-marker {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        border-radius: 2px;
        background: #fff;
      }
      .dcard-note {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 7px;
      }

      /* ── Mobil: qarz ogohlantirishi ────────────────────────────── */
      .alert-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--surf);
        border: 1.5px solid rgba(220, 38, 38, 0.35);
        cursor: pointer;
      }
      .alert-ico {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--st-debt-bg);
        color: var(--st-debt);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
        flex: none;
      }
      .alert-title { font-size: 14px; font-weight: 600; color: var(--ink); }
      .alert-sub { font-size: 12.5px; color: var(--v3-t2); margin-top: 1px; }

      /* ── Mobil: bo'lim sarlavhasi ──────────────────────────────── */
      .sec-hdr {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 0 0 8px;
      }
      .sec-hdr-t {
        font-size: 12px;
        font-weight: 600;
        color: var(--v3-t2);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .sec-hdr-a {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--brand);
        white-space: nowrap;
        cursor: pointer;
      }
      .sec-hdr-n { font-size: 12.5px; font-weight: 600; color: var(--v3-t2); }

      .v3-card {
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        overflow: hidden;
      }
      .v3-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        cursor: pointer;
      }
      .v3-row + .v3-row { border-top: 1px solid var(--bd2); }
      /* Qatordagi bitta bosishlik harakat tugmasi. Holat belgisining
         o'rnida turadi: harakat mumkin bo'lsa tugma, bo'lmasa belgi. */
      .v3-act {
        height: 28px;
        padding: 0 11px;
        border-radius: 8px;
        border: none;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
        flex: none;
        cursor: pointer;
        background: var(--st-onplan-bg);
        color: var(--st-onplan);
      }
      .v3-act.ok {
        background: var(--st-ahead-bg);
        color: var(--st-ahead);
      }
      .v3-title {
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .v3-meta {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 3px;
        font-size: 12.5px;
        color: var(--v3-t2);
        min-width: 0;
      }
      .v3-meta-dot {
        width: 3px;
        height: 3px;
        border-radius: 9px;
        background: var(--v3-t4);
        flex: none;
      }
      .v3-when { font-weight: 600; white-space: nowrap; }
      .v3-when.today { color: var(--st-debt); }
      .v3-when.soon { color: var(--st-behind); }
      .v3-chev { color: var(--v3-t4); flex: none; display: flex; }

      /* ── Mobil: loyiha qatori ──────────────────────────────────── */
      .mproj-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mproj-stats {
        display: flex;
        gap: 10px;
        margin-top: 7px;
        font-size: 12.5px;
      }
      .mproj-stats b { font-weight: 500; color: var(--t5); }
      .mproj-days { color: var(--v3-t2); }
      .mproj-days.late { color: var(--st-debt); font-weight: 600; }

      @media (min-width: 860px) {
        body {
          display: block;
        }
        .desktop-only {
          display: block !important;
        }
        .desktop-flex {
          display: flex !important;
        }
        .mobile-only {
          display: none !important;
        }
        #bottom-nav {
          display: none;
        }
        .overlay {
          align-items: center;
        }
        .sheet {
          border-radius: 20px;
          max-height: 80vh;
        }
        .sheet.wide {
          max-width: 920px;
        }
        .sheet-handle {
          /* Pastdan tortib yopish ishorasi — faqat mobil bottom-sheet
             uchun ma'noli. Desktopda sheet markazlashgan modal bo'lgani
             uchun bu chiziqcha hech narsani anglatmaydi. */
          display: none;
        }
        .sheet-hdr {
          /* Chiziqcha olib tashlangach sarlavha tepaga juda yaqinlashib
             qolmasligi uchun bo'shliq bir oz kattalashtiriladi. */
          padding-top: 20px;
        }

        /* ── Chap sidebar ─────────────────────────────────────────── */
        #sidebar {
          display: flex;
          flex-direction: column;
          width: 224px;
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          background: var(--surf);
          border-right: 1px solid var(--bd2);
          padding: calc(16px + var(--tg-safe-top)) 12px 16px;
          font-family: Onest, "Sora", -apple-system, sans-serif;
          z-index: 100;
          transition: width 0.22s ease;
        }
        .sb-toggle {
          position: absolute;
          top: calc(22px + var(--tg-safe-top));
          right: -12px;
          width: 24px;
          height: 24px;
          border-radius: 50%;
          background: var(--surf);
          border: 1px solid var(--bd2);
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: var(--t3);
          box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
          z-index: 101;
          padding: 0;
          transition: background 0.15s ease, color 0.15s ease;
        }
        .sb-toggle:hover {
          background: var(--chip);
          color: var(--ink);
        }
        .sb-toggle svg {
          width: 14px;
          height: 14px;
          display: block;
          transition: transform 0.22s ease;
        }
        .sb-brand {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 2px 8px 18px;
        }
        .sb-brand-text,
        .sb-user-text {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-mark {
          width: 32px;
          height: 32px;
          border-radius: 11px;
          background: var(--brand);
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 600;
          font-size: 13px;
          flex-shrink: 0;
        }
        .sb-brand-name {
          font-weight: 600;
          font-size: 14px;
          color: var(--ink);
        }
        .sb-brand-sub {
          font-size: 11.5px;
          color: var(--nav-muted);
        }
        .sb-nav {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .sb-item {
          display: flex;
          align-items: center;
          gap: 11px;
          height: 38px;
          padding: 0 10px;
          border-radius: 10px;
          border: none;
          background: none;
          cursor: pointer;
          font-size: 13.5px;
          font-weight: 500;
          color: var(--nav-ink);
          text-align: left;
          font-family: inherit;
        }
        .sb-item .sb-ico {
          width: 19px;
          height: 19px;
          /* Dizaynda ikonka matn bilan bir xil rangda (currentColor). */
          color: inherit;
          flex-shrink: 0;
        }
        .sb-item .sb-ico svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        .sb-item .sb-lbl {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-item .sb-count {
          height: 20px;
          padding: 0 8px;
          border-radius: 7px;
          background: var(--nav-badge-bg);
          color: var(--nav-badge-ink);
          font-size: 11px;
          font-weight: 600;
          display: inline-flex;
          align-items: center;
          flex: none;
          transition: opacity 0.12s ease;
        }
        .sb-item .sb-count.danger {
          color: var(--red);
          background: var(--red-bg);
          padding: 2px 7px;
          border-radius: 99px;
          font-weight: 700;
        }
        .sb-item.active {
          background: var(--nav-act-bg);
          color: var(--nav-act-ink);
          font-weight: 600;
        }
        .sb-item.active .sb-ico {
          color: var(--nav-act-ink);
        }
        /* Qoida <svg>ning O'ZIGA yozilishi shart: elementdagi
           stroke-width atributi merosdan ustun turadi. */
        .sb-item .sb-ico svg,
        .sb-aitem .sb-ico svg {
          stroke-width: 1.7;
        }
        .sb-item.active .sb-ico svg {
          stroke-width: 2;
        }
        .sb-sub-label {
          font-weight: 600;
          font-size: 11px;
          color: var(--nav-muted);
          letter-spacing: 0.06em;
          text-transform: uppercase;
          margin: 18px 10px 6px;
        }
        /* Boshqaruv bandlari — asosiy navdan ataylab past darajada:
           pastroq bo'y, kichikroq ikonka va shrift, so'nuqroq rang. */
        .sb-aitem {
          display: flex;
          align-items: center;
          gap: 11px;
          height: 34px;
          padding: 0 10px;
          border-radius: 9px;
          border: none;
          background: none;
          cursor: pointer;
          font-size: 13px;
          font-weight: 500;
          color: var(--nav-ink2);
          text-align: left;
          font-family: inherit;
          width: 100%;
        }
        .sb-aitem .sb-ico {
          width: 17px;
          height: 17px;
          color: inherit;
          flex-shrink: 0;
        }
        .sb-aitem .sb-ico svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        .sb-aitem .sb-lbl {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          transition: opacity 0.12s ease;
        }
        .sb-aitem.active {
          background: var(--nav-act-bg);
          color: var(--nav-act-ink);
          font-weight: 600;
        }
        .sb-spacer {
          flex: 1;
        }
        .sb-user {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 8px;
          border: none;
          border-top: 1px solid var(--bd2);
          background: none;
          cursor: pointer;
          text-align: left;
          width: 100%;
          font-family: inherit;
        }
        .sb-user .avatar {
          width: 30px;
          height: 30px;
          border-radius: 10px;
          background: #344054;
          color: #fff;
          font-weight: 600;
          font-size: 12px;
          flex-shrink: 0;
        }
        /* Balans belgisi — menyuning eng pastida, profil qatorida. */
        .sb-ncoin {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          height: 24px;
          padding: 0 8px;
          border-radius: 7px;
          background: var(--nav-coin-bg);
          color: var(--nav-coin-ink);
          font-size: 12px;
          font-weight: 600;
          flex: none;
          transition: opacity 0.12s ease;
        }
        .sb-ncoin svg {
          width: 13px;
          height: 13px;
          display: block;
          flex: none;
        }
        .sb-user-name {
          font-weight: 600;
          font-size: 13px;
          color: var(--ink);
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .sb-user-role {
          font-size: 11.5px;
          color: var(--nav-muted);
        }

        /* ── Sidebar yig'ilgan holati: faqat ikonkalar, kontent avtomatik
           kengayadi. body.sidebar-collapsed — yagona holat manbai. ────── */
        body.sidebar-collapsed #sidebar {
          width: 72px;
        }
        body.sidebar-collapsed .sb-toggle svg {
          transform: rotate(180deg);
        }
        body.sidebar-collapsed .sb-brand {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
        }
        body.sidebar-collapsed .sb-item,
        body.sidebar-collapsed .sb-aitem {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
          gap: 0;
        }
        body.sidebar-collapsed .sb-brand-text,
        body.sidebar-collapsed .sb-item .sb-lbl,
        body.sidebar-collapsed .sb-item .sb-count,
        body.sidebar-collapsed .sb-aitem .sb-lbl,
        body.sidebar-collapsed .sb-sub-label,
        body.sidebar-collapsed .sb-ncoin,
        body.sidebar-collapsed .sb-user-text {
          opacity: 0;
          pointer-events: none;
        }
        body.sidebar-collapsed .sb-item .sb-lbl,
        body.sidebar-collapsed .sb-item .sb-count,
        body.sidebar-collapsed .sb-aitem .sb-lbl,
        body.sidebar-collapsed .sb-ncoin {
          width: 0;
          min-width: 0;
          flex: 0;
          padding: 0;
          overflow: hidden;
        }
        /* box-sizing:border-box tufayli padding width:0'dan ustun
           turadi (chekka+padding yig'indisi minimal kenglik bo'lib
           qoladi) — shu sabab "Loyihalar" ikonkasidagi qarz-hisoblagichi
           14px joy band qilib, faqat o'sha ikonkani markazdan siljitib
           qo'yardi. Padding'ni ham 0'ga tushirish shart. */
        body.sidebar-collapsed .sb-item .sb-count {
          padding: 0;
        }
        body.sidebar-collapsed .sb-sub-label {
          height: 0;
          margin: 0;
          overflow: hidden;
        }
        body.sidebar-collapsed .sb-user {
          justify-content: center;
          padding-left: 6px;
          padding-right: 6px;
          gap: 0;
        }
        /* .sb-user-text (flex:1) o'zi kengayib ketmasligi, .chev esa
           (global .chev klassida flex-shrink:0 bor — boshqa joylarda
           kichraymasligi kerak bo'lgani uchun) shu yerda kichraymay
           qolib, tugmani sidebar chekkasidan tashqariga chiqarib
           yuborardi — xuddi qarz-hisoblagichidagi kabi (padding emas,
           bu safar flex-shrink:0 sabab). Ikkalasini ham 0'ga tushiramiz. */
        body.sidebar-collapsed .sb-user-text {
          width: 0;
          min-width: 0;
          flex: 0 0 0;
          overflow: hidden;
        }

        /* Vertikal bo'shliq chizmadagidek. Gorizontali ataylab
           o'zgartirilmaydi: u sahifa sarlavhasiniki bilan bir xil
           (32px) bo'lishi kerak, aks holda kartalar sarlavhadan
           chetga chiqib qolardi. Pastdagi katta bo'shliq mobil pastki
           navigatsiya uchun edi — desktopda u keraksiz. */
        #screen-today #today-body {
          padding-top: 20px;
          padding-bottom: 24px;
        }

        /* ══ LOYIHALAR — desktop ikki panelli maket (v3) ══════════════ */
        /* Sahifaning o'z sarlavhasi bor, umumiy .hdr kerak emas. */
        #screen-projects .hdr { display: none; }
        #screen-projects #projects-body {
          padding: 0;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        .pd-root {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }
        .pd-top {
          height: 64px;
          background: var(--surf);
          border-bottom: 1px solid var(--bd2);
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 0 24px;
          flex: none;
          box-sizing: border-box;
        }
        .pd-top-t {
          font-size: 18px;
          font-weight: 600;
          color: var(--ink);
          letter-spacing: -0.015em;
          white-space: nowrap;
        }
        .pd-top-s {
          font-size: 12.5px;
          color: var(--v3-t2);
          margin-top: 2px;
          white-space: nowrap;
        }
        .pd-new {
          height: 38px;
          padding: 0 16px;
          border-radius: 10px;
          border: none;
          background: var(--brand);
          color: #fff;
          font-family: inherit;
          font-size: 13px;
          font-weight: 600;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          flex: none;
          cursor: pointer;
          white-space: nowrap;
        }
        .pd-body {
          flex: 1;
          display: flex;
          min-height: 0;
        }
        .pd-list {
          width: 340px;
          flex: none;
          border-right: 1px solid var(--bd2);
          background: var(--surf);
          padding: 14px 12px;
          display: flex;
          flex-direction: column;
          gap: 4px;
          box-sizing: border-box;
          overflow-y: auto;
        }
        .pd-search {
          height: 36px;
          border-radius: 11px;
          background: var(--surf);
          border: 1px solid var(--bd3s, rgba(15, 23, 42, 0.13));
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 0 12px;
          margin: 0 2px 8px;
          box-sizing: border-box;
          flex: none;
        }
        .pd-search input {
          border: none;
          outline: none;
          background: none;
          font-family: inherit;
          font-size: 13.5px;
          color: var(--ink);
          width: 100%;
        }
        .pd-search .search-ico { width: 17px; height: 17px; color: var(--v3-t3); flex: none; }
        .pd-search .search-ico svg { width: 100%; height: 100%; display: block; }
        .pd-sec {
          font-size: 11.5px;
          font-weight: 600;
          color: var(--v3-t2);
          letter-spacing: 0.05em;
          text-transform: uppercase;
          padding: 6px 14px 2px;
          white-space: nowrap;
        }
        .pd-sec + .pd-sec,
        .pd-item + .pd-sec { padding-top: 10px; }
        .pd-item {
          padding: 12px 14px;
          border-radius: 12px;
          background: transparent;
          border: 1px solid transparent;
          cursor: pointer;
          box-sizing: border-box;

        .pd-card {

        .pd-filter { display: flex; align-items: center; gap: 12px; }
        .pd-legend { display: flex; gap: 14px; flex: none; }
        .pd-legend > div { display: flex; align-items: center; gap: 6px; }
        .pd-legend-t { font-size: 12px; font-weight: 500; color: var(--v3-t2); white-space: nowrap; }
        .pd-legend-dot { width: 7px; height: 7px; border-radius: 9px; }
        .pd-legend-sq { width: 12px; height: 12px; border-radius: 4px; border: 1px solid var(--bd3s, rgba(15, 23, 42, 0.13)); }

        /* Chiziq balandligi chizmada joyiga qarab farq qiladi:
           ro'yxatda ingichkaroq, statistika kartasida qalinroq. */
        .pd-item .pbar { height: 5px; }
        .pd-stat-main .pbar { height: 7px; }
        /* Desktopda "Yangi loyiha" sarlavhada turadi — suzuvchi tugma

        .pd-dot { width: 6px; height: 6px; border-radius: 9px; }
