        /* ══ "BUGUN" — desktop maketi (v3) ═══════════════════════════ */
        .d2-grid {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 288px;
          gap: 20px;
          align-items: start;
        }
        .d2-stats {
          display: flex;
          gap: 12px;
        }
        .d2-stat {
          flex: 1;
          min-width: 0;
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 14px 16px;
        }
        .d2-stat-l {
          font-size: 12.5px;
          font-weight: 500;
          color: var(--v3-t2);
          white-space: nowrap;
        }
        .d2-stat-v {
          display: flex;
          align-items: baseline;
          gap: 8px;
          margin-top: 6px;
        }
        .d2-stat-n {
          font-variant-numeric: tabular-nums;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: -0.025em;
          color: var(--ink);
          white-space: nowrap;
        }
        .d2-stat-n.warn { color: var(--st-behind); }
        .d2-stat-n.bad { color: var(--st-debt); }
        .d2-stat-s {
          font-size: 12.5px;
          color: var(--v3-t2);
          white-space: nowrap;
        }

        .d2-tbl {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          overflow: hidden;
        }
        .d2-tbl-hdr {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 14px 18px;
        }
        .d2-tbl-t {
          font-size: 15px;
          font-weight: 600;
          color: var(--ink);
          flex: 1;
          white-space: nowrap;
        }
        .d2-seg {
          display: flex;
          padding: 3px;
          border-radius: 11px;
          background: var(--nav-badge-bg);
          gap: 2px;
          width: max-content;
        }
        .d2-seg button {
          flex: none;
          height: 26px;
          padding: 0 12px;
          border-radius: 8px;
          border: none;
          background: transparent;
          box-shadow: none;
          font-family: inherit;
          font-size: 13px;
          font-weight: 500;
          color: var(--v3-t2);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          white-space: nowrap;
          cursor: pointer;
        }
        /* Loyihalar sahifasida segmentlar balandroq (chizma bo'yicha). */
        .d2-seg.lg button { height: 30px; }
        .d2-seg button.on {
          background: var(--surf);
          box-shadow: 0 1px 2px rgba(14, 23, 38, 0.1);
          font-weight: 600;
          color: var(--ink);
        }
        /* Ustun kengliklari sarlavha va qatorlarda BIR XIL bo'lishi shart —
           shuning uchun bitta o'zgaruvchida saqlanadi. */
        .d2-cols,
        .d2-row {
          display: grid;
          grid-template-columns: minmax(120px, 1.5fr) 84px minmax(0, 1fr) 92px 96px;
          gap: 14px;
          padding: 0 18px;
          align-items: center;
          border-top: 1px solid var(--bd2);
        }
        .d2-cols {
          height: 34px;
          background: var(--surf2, #fafbfc);
        }
        .d2-cols > div {
          font-size: 11.5px;
          font-weight: 600;
          color: var(--v3-t2);
          letter-spacing: 0.04em;
          text-transform: uppercase;
          white-space: nowrap;
        }
        .d2-cols > div:last-child { text-align: right; }
        .d2-row {
          height: 58px;
          cursor: pointer;
        }
        .d2-row:hover { background: var(--surf2, #fafbfc); }
        .d2-name {
          font-size: 14px;
          font-weight: 600;
          color: var(--ink);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .d2-owner {
          font-size: 12px;
          color: var(--v3-t2);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .d2-prog {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .d2-prog .pbar { flex: 1; }
        .d2-pct {
          font-variant-numeric: tabular-nums;
          font-size: 13px;
          font-weight: 600;
          color: var(--ink);
          width: 36px;
          text-align: right;
          white-space: nowrap;
        }
        .d2-counts {
          font-variant-numeric: tabular-nums;
          font-size: 13px;
          font-weight: 500;
          color: var(--t5);
          white-space: nowrap;
        }
        .d2-due {
          font-size: 13px;
          color: var(--v3-t2);
          text-align: right;
          white-space: nowrap;
        }
        .d2-due.late { color: var(--st-debt); font-weight: 600; }

        .d2-side {
          display: flex;
          flex-direction: column;
          gap: 16px;
          min-width: 0;
        }
        .d2-card {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 14px 16px;
          box-sizing: border-box;
        }
        .d2-card.tight { padding: 14px 16px 6px; }
        /* Bosiladigan karta — kursor va yengil ta'kid bilan bildiriladi */
        .d2-card.act-open { cursor: pointer; }
        .d2-card.act-open:hover { border-color: var(--bd4); }
        .d2-card.act-open:hover .d2-card-side { color: var(--brand); }
        .d2-card-hdr {
          display: flex;
          align-items: center;
          margin-bottom: 12px;
        }
        .d2-card.tight .d2-card-hdr { margin-bottom: 4px; }
        .d2-card-t {
          font-size: 14.5px;
          font-weight: 600;
          color: var(--ink);
          flex: 1;
          white-space: nowrap;
        }
        .d2-card-n {
          height: 20px;
          padding: 0 8px;
          border-radius: 7px;
          background: var(--st-debt-bg);
          color: var(--st-debt);
          font-size: 11.5px;
          font-weight: 600;
          display: inline-flex;
          align-items: center;
          flex: none;
        }
        .d2-card-side {
          font-size: 12px;
          color: var(--v3-t2);
          white-space: nowrap;
        }
        .d2-item {
          padding: 10px 0;
          cursor: pointer;
        }
        .d2-item + .d2-item { border-top: 1px solid var(--bd2); }
        .d2-item-top {
          display: flex;
          gap: 8px;
        }
        .d2-item-t {
          font-size: 13.5px;
          font-weight: 500;
          color: var(--ink);
          flex: 1;
          min-width: 0;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .d2-item-w {
          font-size: 12.5px;
          font-weight: 600;
          white-space: nowrap;
        }
        .d2-item-s {
          font-size: 12px;
          color: var(--v3-t2);
          margin-top: 2px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .d2-heat {
          display: grid;
          grid-template-columns: repeat(14, 1fr);
          gap: 4px;
        }
        .d2-heat span {
          aspect-ratio: 1 / 1;
          border-radius: 4px;
          background: var(--heat0, #edeff2);
        }
        .d2-heat span.l1 { background: #c9ddef; }
        .d2-heat span.l2 { background: #8db7dc; }
        .d2-heat span.l3 { background: #2f7ab9; }
        .d2-heat-foot {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-top: 12px;
        }

        /* ══ VAZIFALAR — desktop doska (v3) ══════════════════════════ */
        /* Filtr qatori: segment + uzuq chiziqli chiplar + Arxiv.
           Sarlavha ostida, doskadan tashqarida turadi. */
        .tb-filters {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 14px 24px 0;
          flex-wrap: wrap;
        }
        .tb-div {
          width: 1px;
          height: 22px;
          background: var(--bd1);
          flex: none;
        }
        .tb-chip {
          height: 32px;
          padding: 0 11px;
          display: flex;
          align-items: center;
          gap: 6px;
          border: 1px dashed var(--track);
          border-radius: 8px;
          background: transparent;
          font-size: 12.5px;
          font-weight: 500;
          color: var(--v3-t2);
          cursor: pointer;
          font-family: inherit;
          white-space: nowrap;
        }
        .tb-chip:hover { border-color: var(--v3-t4); }
        .tb-chip.on {
          border-style: solid;
          border-color: var(--brand);
          color: var(--brand);
          background: var(--brand-bg, rgba(47, 122, 185, 0.08));
        }
        .tb-chip .tb-chip-chev {
          width: 13px;
          height: 13px;
          color: var(--v3-t4);
          flex: none;
          display: flex;
        }
        .tb-chip.on .tb-chip-chev { color: var(--brand); }
        .tb-archive {
          height: 32px;
          padding: 0 11px;
          display: flex;
          align-items: center;
          gap: 6px;
          border: 0;
          background: transparent;
          border-radius: 8px;
          font-size: 12.5px;
          font-weight: 500;
          color: var(--v3-t2);
          cursor: pointer;
          font-family: inherit;
          white-space: nowrap;
        }
        .tb-archive:hover { background: var(--chip); }
        .tb-archive.on { background: var(--chip); color: var(--t5); font-weight: 600; }
        .tb-archive b { font-weight: 600; color: var(--v3-t3); font-variant-numeric: tabular-nums; }

        /* Doska: ustunlar teng kenglikda, butun balandlikni egallaydi */
        /* Doska ekranning butun eni va bo'yini egallaydi. Ustunlar
           kamida 240px, qolgan joyni teng bo'lishadi; sig'masa doska
           gorizontal aylanadi. Vertikal aylanish har bir ustun ICHIDA
           bo'ladi — sahifaning o'zi aylanmaydi (haqiqiy kanban). */
        .tb-board {
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: minmax(240px, 1fr);
          gap: 12px;
          padding: 14px 24px 24px;
          align-items: stretch;
          flex: 1;
          min-height: 0;
          overflow-x: auto;
          overflow-y: hidden;
        }
        .tb-col {
          background: var(--tb-col-bg);
          border-radius: 14px;
          padding: 10px;
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-width: 0;
          min-height: 0;
          overflow-y: auto;
        }
        .tb-col-hdr { position: sticky; top: -10px; background: var(--tb-col-bg); z-index: 1; }
        .tb-col-hdr {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 2px 4px 4px;
        }
        .tb-col-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          flex: none;
        }
        .tb-col-title {
          font-size: 13.5px;
          font-weight: 600;
          color: var(--t5);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .tb-col-count {
          font-size: 12.5px;
          color: var(--v3-t3);
          font-variant-numeric: tabular-nums;
          flex: none;
        }
        .tb-col-add {
          width: 20px;
          height: 20px;
          border: 0;
          background: transparent;
          border-radius: 6px;
          color: var(--v3-t3);
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          flex: none;
          font-family: inherit;
        }
        .tb-col-add:hover { background: var(--chip); color: var(--t5); }

        /* Kartochka */
        .tb-card {
          background: var(--surf);
          border-radius: 12px;
          padding: 11px 12px;
          /* Ushlab ko'chirsa bo'lishini kursorning o'zi aytib turadi */
          cursor: grab;
          display: flex;
          flex-direction: column;
          gap: 8px;
          box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }
        .tb-card:hover { box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1); }
        .tb-card.muted { opacity: 0.62; }
        .tb-card-top {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .tb-ref {
          font-size: 11px;
          font-weight: 500;
          color: var(--v3-t4);
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.02em;
          flex: 1;
        }
        .tb-av {
          width: 22px;
          height: 22px;
          border-radius: 7px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 10.5px;
          font-weight: 600;
          color: #fff;
          flex: none;
          position: relative;
          overflow: hidden;
        }
        .tb-card-title {
          font-size: 14px;
          font-weight: 500;
          line-height: 1.4;
          color: var(--t5);
        }
        .tb-card-meta {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }
        .tb-checkn {
          font-size: 11.5px;
          color: var(--v3-t3);
          font-variant-numeric: tabular-nums;
          display: flex;
          align-items: center;
          gap: 3px;
        }
        .tb-card-foot {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .tb-due {
          font-size: 11.5px;
          font-weight: 500;
          flex: none;
        }
        .tb-due.late { color: var(--red); }
        .tb-due.soon { color: var(--amber); }
        .tb-due.norm { color: var(--v3-t3); }
        .tb-proj {
          font-size: 11.5px;
          color: var(--v3-t4);
          flex: 1;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          text-align: right;
        }
        .tb-more {
          font-size: 12px;
          color: var(--v3-t3);
          text-align: center;
          padding: 6px 0 2px;
          cursor: pointer;
        }
        .tb-more:hover { color: var(--brand); }
        .tb-col-empty {
          font-size: 12px;
          color: var(--v3-t4);
          text-align: center;
          padding: 10px 0;
        }

        /* ── Kontent ustuni: sidebar uchun joy + kengroq o'qish maydoni ── */
        .screen {
          margin-left: 224px;
          max-width: none;
          width: auto;
          box-shadow: none;
          transition: margin-left 0.22s ease;
        }
        body.sidebar-collapsed .screen {
          margin-left: 72px;
        }
        .hdr,
        .trk-hdr,
        .np-hdr,
        .np-footer,
        .scroll {
          max-width: 880px;
          margin-left: auto;
          margin-right: auto;
          width: 100%;
        }
        #screen-today .hdr,
        #screen-today .scroll,
        #screen-projects .hdr,
        #screen-projects .scroll,
        #screen-tasks .hdr,
        #screen-tracker .trk-hdr,
        #screen-admin .hdr,
        #screen-admin .scroll,
        #screen-nshop .hdr,
        #screen-nshop .scroll {
          max-width: none;
          padding-left: 32px;
          padding-right: 32px;
          transition: padding-left 0.22s ease;
        }
        /* Sidebar yig'ilganda ikonka ustuni (72px) juda tor bo'lgani
           uchun avvalgi 32px chekka bo'shlig'i endi keragidan ortiq
           bo'sh joy qoldirardi — kontent ikonkalarga yaqinroq siljiydi. */
        body.sidebar-collapsed #screen-today .hdr,
        body.sidebar-collapsed #screen-today .scroll,
        body.sidebar-collapsed #screen-projects .hdr,
        body.sidebar-collapsed #screen-projects .scroll,
        body.sidebar-collapsed #screen-tasks .hdr,
        body.sidebar-collapsed #screen-tracker .trk-hdr,
        body.sidebar-collapsed #screen-admin .hdr,
        body.sidebar-collapsed #screen-admin .scroll,
        body.sidebar-collapsed #screen-nshop .hdr,
        body.sidebar-collapsed #screen-nshop .scroll {
          padding-left: 20px;
        }
        body.sidebar-collapsed #screen-tracker .trk-main {
          padding-left: 20px;
        }
        /* Vazifalar doskasi — filtr qatori va ustunlar bir xil chekkada
           turishi uchun padding'ni ichkaridagi .tb-filters/.tb-board
           o'zi beradi (umumiy 32px/20px qoidasi bu yerda qo'llanmaydi).
           `max-width: none` — aks holda umumiy `.scroll` qoidasidagi
           880px doskani tor qilib qo'yadi. */
        /* `.screen` odatda `min-height:100dvh` — kontent bilan o'sadi.
           Doska esa aynan ekran bo'yicha turishi va ustunlar o'z ichida
           aylanishi kerak, shuning uchun bu ekranda balandlik qat'iy. */
        #screen-tasks.screen {
          height: 100vh;
          height: 100dvh;
          min-height: 0;
        }
        #screen-tasks .scroll {
          max-width: none;
          padding: 0;
          display: flex;
          flex-direction: column;
          min-height: 0;
          overflow: hidden;
        }
        /* `.desktop-only` `display:block !important` beradi — doska
           ustuni bo'lishi uchun uni qaytadan flex qilamiz. */
        .tb-root {
          display: flex !important;
          flex-direction: column;
          flex: 1;
          min-height: 0;
        }
        #screen-history .hdr,
        #screen-history .scroll,
        #screen-profile .scroll {
          max-width: 1400px;
        }

        /* ── Sarlavha qatori: mobil bir ustunda, katta ekranda sarlavha
           chapda + qidiruv o'ngda, bitta qatorda (Loyihalar/Tarix/
           Boshqaruv sarlavhalari to'liq kenglikka cho'zilib ketmasin) ─── */
        .hdr-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
        }
        .hdr-row > *:first-child {
          flex: 1;
          min-width: 0;
        }
        .hdr-row .search-box {
          margin-top: 0;
          width: 320px;
          flex-shrink: 0;
        }
        /* Boshqaruv: DOM tartibi (sarlavha, atabs, qidiruv) mobilda
           saqlanishi shart bo'lgani uchun qidiruv katta ekranda faqat
           CSS order bilan sarlavha yoniga ko'chiriladi. */
        #admin-hdr {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 12px;
        }
        #admin-hdr .hdr-title {
          order: 1;
          flex: 1;
          min-width: 0;
        }
        #admin-hdr .search-box {
          order: 2;
          margin-top: 0;
          width: 320px;
          flex-shrink: 0;
        }
        #admin-hdr .atabs {
          order: 3;
          flex-basis: 100%;
          margin-top: 4px;
        }

        /* ── Tracker: kalendar + o'ng panel yonma-yon ────────────────── */
        #screen-tracker .trk-main {
          flex-direction: row;
          gap: 20px;
          align-items: flex-start;
          max-width: none;
          width: 100%;
          padding: 0 32px 28px;
        }
        #screen-tracker #tracker-body {
          max-width: none;
          margin: 0;
          flex: 1;
          min-width: 0;
          padding: 16px 0 0;
        }
        .trk-rail {
          width: 340px;
          flex-shrink: 0;
          position: sticky;
          top: 16px;
          padding-top: 16px;
        }
        /* Katta ekranda kalendar butun kenglikka cho'zilib, katakchalar
           haddan tashqari yirik bo'lib ketmasligi uchun ixcham kenglikka
           qisiladi (mobil o'lchamiga yaqin, faqat o'qilishi qulayroq). */
        #screen-tracker .cal-week,
        #screen-tracker .cal-grid {
          max-width: 400px;
        }

        /* ── Umumiy: statistik kartalar, jadval, ikki ustunli maket ──── */
        .dash-cols {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 20px;
          align-items: start;
        }
        .stat-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          margin-bottom: 20px;
        }
        .stat-card {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 18px;
        }
        .stat-card.tempo {
          background: var(--brand);
          border-color: var(--brand);
        }
        .stat-card.tempo .stat-lbl {
          color: rgba(255, 255, 255, 0.7);
        }
        .stat-card.tempo .stat-val {
          color: #fff;
        }
        .stat-card.tempo .stat-foot {
          color: rgba(255, 255, 255, 0.7);
        }
        .stat-card.danger {
          border-color: var(--red-bd);
        }
        .stat-card.danger .stat-lbl,
        .stat-card.danger .stat-val,
        .stat-card.danger .stat-foot,
        .stat-card.danger .stat-link {
          color: var(--red);
        }
        .stat-bar {
          margin-top: 14px;
          height: 6px;
          border-radius: 99px;
          background: rgba(255, 255, 255, 0.28);
          overflow: hidden;
        }
        .stat-bar-fill {
          height: 100%;
          background: var(--surf);
          border-radius: 99px;
        }
        .stat-lbl {
          font-size: 11px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }
        .stat-val {
          font-weight: 600;
          font-size: 34px;
          color: var(--ink);
          line-height: 1;
          margin-top: 12px;
          letter-spacing: -0.03em;
        }
        .stat-val .stat-sub {
          font-size: 17px;
          color: var(--t3);
          font-weight: 500;
        }
        .stat-foot {
          font-size: 12px;
          color: var(--t3);
          margin-top: 12px;
        }
        .stat-link {
          color: var(--brand);
          font-weight: 600;
          cursor: pointer;
        }
        .dtbl-wrap {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          overflow: hidden;
          margin-bottom: 20px;
        }
        .card-hdr {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 14px 16px;
          border-bottom: 1px solid var(--bd2);
          background: var(--surf2);
          flex-wrap: wrap;
        }
        .card-hdr-title {
          font-weight: 600;
          font-size: 13.5px;
          color: var(--ink);
          flex-shrink: 0;
        }
        .dtbl tr.debt-row td {
          background: var(--red-bg);
        }
        .dtbl tr.debt-row.clickable:hover td {
          background: #f9dcd9;
        }
        .dtbl-bar-wrap {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .dtbl-bar-wrap .hist-track {
          width: 60px;
          flex-shrink: 0;
        }
        .dtbl {
          width: 100%;
          border-collapse: collapse;
          font-size: 13px;
        }
        .dtbl th {
          text-align: left;
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.05em;
          padding: 11px 16px;
          border-bottom: 1px solid var(--bd2);
          background: var(--surf2);
        }
        .dtbl td {
          padding: 12px 16px;
          border-bottom: 1px solid var(--bd1);
          color: var(--t5);
        }
        .dtbl tr:last-child td {
          border-bottom: none;
        }
        .dtbl tr.clickable {
          cursor: pointer;
        }
        .dtbl tr.clickable:hover td {
          background: var(--surf2);
        }
        .dtbl .dtbl-name {
          font-weight: 600;
          color: var(--ink);
        }
        .wk-bars {
          display: flex;
          align-items: flex-end;
          height: 52px;
          margin: 14px 0 6px;
        }
        .wk-bar-col {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-end;
          height: 100%;
          cursor: pointer;
          padding: 6px 2px 0;
          border-radius: 8px;
          -webkit-tap-highlight-color: transparent;
        }
        .wk-bar-col:active {
          background: var(--surf2);
        }
        .wk-bar-track {
          position: relative;
          width: 60%;
          min-width: 10px;
          border-radius: 4px;
          background: var(--chip3);
          overflow: visible;
        }
        .wk-bar-fill {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          border-radius: 4px;
          background: var(--brand);
          opacity: 0.45;
        }
        .wk-bar-col.active .wk-bar-fill {
          opacity: 1;
        }
        .wk-bar-col.active .wk-bar-track {
          box-shadow: 0 0 0 2px var(--brand);
        }
        .wk-bar-lbl {
          font-size: 9.5px;
          color: var(--t3);
          text-align: center;
          margin-top: 6px;
        }
        .wk-bar-col.active .wk-bar-lbl {
          color: var(--brand);
          font-weight: 700;
        }
        .wk-detail {
          margin-top: 10px;
        }
        .wk-detail-title {
          font-size: 11px;
          font-weight: 600;
          color: var(--t3);
          margin-bottom: 6px;
        }
        /* Reja nega o'zgarganini aytadi — "ko'chgan" ishlar sababi */
        .wk-detail-note {
          margin-top: 6px;
          font-size: 11px;
          line-height: 1.35;
          color: var(--t3);
        }
        .wk-detail-note.late { color: var(--st-behind-dot, #b45309); }

        /* ── Loyihalar/Vazifalar: kartochka to'ri va kanban ──────────── */
        .pgrid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 14px;
        }
        .pcard {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          padding: 16px;
          cursor: pointer;
        }
        .pcard:hover {
          border-color: var(--bd4);
        }
        .pcard-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 10px;
        }
        .pcard-pct {
          font-weight: 700;
          font-size: 13px;
          color: var(--brand);
        }
        .kanban {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
          align-items: start;
        }

        /* ── Tabel: ikki ustun yonma-yon ──────────────────────────────── */
        .two-col {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 24px;
          align-items: start;
        }

        /* ── Ruxsatlar matritsasi ─────────────────────────────────────── */
        .pmx-wrap {
          background: var(--surf);
          border: 1px solid var(--bd2);
          border-radius: 14px;
          overflow: auto;
          margin-bottom: 16px;
        }
        .pmx {
          border-collapse: collapse;
          font-size: 12px;
          width: 100%;
        }
        .pmx th,
        .pmx td {
          padding: 12px 14px;
          text-align: center;
          border-bottom: 1px solid var(--bd1);
        }
        .pmx th.pmx-emp,
        .pmx td.pmx-emp {
          text-align: left;
          position: sticky;
          left: 0;
          background: var(--surf);
          z-index: 1;
          min-width: 190px;
        }
        .pmx thead th {
          font-size: 10.5px;
          font-weight: 500;
          line-height: 1.3;
          color: var(--t5);
          white-space: normal;
          background: var(--surf2);
          vertical-align: bottom;
          height: 58px;
        }
        .pmx thead th.pmx-emp {
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          background: var(--surf2);
        }
        .pmx thead th.pmx-total {
          font-size: 10.5px;
          font-weight: 600;
          color: var(--t3);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          text-align: right;
        }
        .pmx-emp-name {
          font-weight: 600;
          font-size: 13.5px;
          color: var(--ink);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 140px;
        }
        .pmx-emp-sub {
          font-size: 11px;
          color: var(--chev);
          margin-top: 1px;
        }
        .pmx-cell {
          width: 26px;
          height: 26px;
          padding: 0;
          margin: 0 auto;
          cursor: pointer;
          font-size: 12px;
          font-weight: 700;
          border-radius: 8px;
          background: var(--chip);
          border: 1px solid var(--bd2);
          color: transparent;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .pmx-cell.on {
          width: auto;
          min-width: 108px;
          height: 30px;
          padding: 0 3px;
          background: var(--brand);
          border-color: var(--brand);
          color: #fff;
        }
        .perm-role-select {
          width: 100%;
          height: 100%;
          border: none;
          background: none;
          color: inherit;
          font-size: 11.5px;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          outline: none;
        }
        .perm-role-select option {
          color: var(--ink);
        }
        .pmx-total {
          font-weight: 600;
          font-size: 13px;
          color: var(--ink);
          text-align: right;
        }
        .pmx-total.zero {
          color: var(--chev);
          font-weight: 500;
        }
        .pmx-legend {
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 11.5px;
          color: var(--t2);
          margin: 0 0 18px;
        }
        .pmx-legend-dot {
          display: inline-block;
          width: 14px;
          height: 14px;
          border-radius: 5px;
          margin-right: 6px;
          vertical-align: middle;
        }
      }

      /* ═══ KALENDAR ═══════════════════════════════════════════════════
         Umumiy kalendar: Kun / Hafta / Oy. Soat qatori balandligi —
         bitta o'zgaruvchi (`--kal-h`), chunki blok joylashuvi JS'da
         ham shu songa tayanadi: ikkisi bir joydan boshqarilmasa,
         bloklar vaqt chizig'idan siljib ketadi. */
      :root {
        --kal-h: 56px;        /* bitta soat qatori */
        --kal-gutter: 56px;   /* chapdagi soatlar ustuni */
        --kal-now: #dc2626;
        --kal-team: #475569;
        --kal-line: rgba(15, 23, 42, 0.09);
      }

      /* Kalendar — yagona ekran: tepa qatori joyida turadi, faqat
         vaqt to'ri suriladi. Buning uchun ekran balandligi ANIQ
         bo'lishi shart, aks holda `.kal-body` cho'zilib ketadi. */
      #screen-kalendar { height: 100vh; height: 100dvh; overflow: hidden; }
      .kal-wrap { display: flex; flex: 1; min-height: 0; }
      .kal-side {
        width: 236px;
        flex: none;
        border-right: 1px solid var(--kal-line);
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .kal-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

      /* ── Tepa panel ──────────────────────────────────────────────── */
      .kal-top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--kal-line);
        flex: none;
      }
      .kal-title { font-size: 20px; font-weight: 700; color: var(--marker); letter-spacing: -0.02em; }
      .kal-title i { font-style: normal; font-weight: 400; color: var(--v3-t3); margin-left: 6px; }
      .kal-seg {
        display: inline-flex;
        background: var(--chip2);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
      }
      .kal-seg button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--v3-t2);
        cursor: pointer;
      }
      .kal-seg button.on { background: var(--surf); color: var(--marker); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }
      .kal-nav { display: inline-flex; align-items: center; gap: 4px; }
      .kal-nbtn {
        width: 32px;
        height: 32px;
        border: 1px solid var(--bd2);
        border-radius: 9px;
        background: var(--surf);
        color: var(--v3-t2);
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .kal-nbtn:hover { border-color: var(--bd4); color: var(--marker); }
      .kal-nbtn.wide { width: auto; padding: 0 12px; font-size: 13px; font-weight: 600; }
      .kal-grow { flex: 1; }

      /* ── Chap panel ──────────────────────────────────────────────── */
      .kal-newbtn {
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .kal-newbtn:hover { filter: brightness(1.06); }
      .kal-mini-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
      .kal-mini-t { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--marker); }
      .kal-mini-b {
        width: 24px; height: 24px; border: 0; border-radius: 7px;
        background: transparent; color: var(--v3-t3); cursor: pointer; font: inherit;
      }
      .kal-mini-b:hover { background: var(--chip2); color: var(--marker); }
      .kal-mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
      .kal-mini-wd { font-size: 10.5px; font-weight: 600; color: var(--v3-t4); text-align: center; padding-bottom: 2px; }
      .kal-mini-d {
        height: 26px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        color: var(--v3-t2);
        cursor: pointer;
      }
      .kal-mini-d:hover { background: var(--chip2); }
      .kal-mini-d.out { color: var(--v3-t4); opacity: 0.6; }
      /* Ko'rsatilayotgan davr fonda belgilanadi — qaysi hafta ochiqligi
         kichik kalendardan ham ko'rinib tursin. */
      .kal-mini-d.in { background: rgba(47, 122, 185, 0.1); }
      .kal-mini-d.today { background: var(--brand); color: #fff; font-weight: 700; }

      .kal-flt-t { font-size: 12px; font-weight: 600; color: var(--v3-t3); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
      .kal-flt-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 4px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        color: var(--marker);
      }
      .kal-flt-row:hover { background: var(--chip2); }
      .kal-flt-box {
        width: 17px;
        height: 17px;
        border-radius: 5px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        border: 1.5px solid var(--bd4);
      }
      .kal-flt-row.on .kal-flt-box { border-color: transparent; }
      .kal-flt-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .kal-flt-hint { font-size: 11.5px; line-height: 1.4; color: var(--v3-t4); margin-top: 8px; }

      /* ── Hafta / Kun to'ri ───────────────────────────────────────── */
      .kal-head {
        display: grid;
        border-bottom: 1px solid var(--kal-line);
        flex: none;
      }
      .kal-head-pad { border-right: 1px solid var(--kal-line); }
      .kal-hd {
        padding: 8px 6px 10px;
        text-align: center;
        border-left: 1px solid var(--kal-line);
      }
      .kal-hd.we { background: rgba(15, 23, 42, 0.02); }
      .kal-hd-w { font-size: 11.5px; font-weight: 600; color: var(--v3-t3); }
      .kal-hd-n {
        margin: 3px auto 0;
        width: 30px;
        height: 30px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 600;
        color: var(--marker);
        cursor: pointer;
      }
      .kal-hd-n.today { background: var(--brand); color: #fff; }
      .kal-hd-n:hover { background: var(--chip2); }
      .kal-hd-n.today:hover { background: var(--brand); }

      /* «butun kun» qatori */
      .kal-allday {
        display: grid;
        border-bottom: 1px solid var(--kal-line);
        min-height: 30px;
        flex: none;
      }
      .kal-allday-lbl {
        font-size: 10.5px;
        color: var(--v3-t4);
        text-align: right;
        padding: 6px 8px 0 0;
        border-right: 1px solid var(--kal-line);
      }
      .kal-allday-col { border-left: 1px solid var(--kal-line); padding: 4px; display: flex; flex-direction: column; gap: 3px; }
      .kal-ad-ev {
        font-size: 11.5px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .kal-body { flex: 1; overflow-y: auto; position: relative; }
      .kal-grid { display: grid; position: relative; }
      .kal-hours { border-right: 1px solid var(--kal-line); position: relative; }
      .kal-hour {
        height: var(--kal-h);
        font-size: 11px;
        color: var(--v3-t3);
        text-align: right;
        padding-right: 8px;
        /* Yozuv chiziqning o'ziga emas, biroz tepasiga tushsin */
        transform: translateY(-7px);
      }
      .kal-col {
        position: relative;
        border-left: 1px solid var(--kal-line);
      }
      .kal-col.we { background: rgba(15, 23, 42, 0.02); }
      .kal-slot {
        height: var(--kal-h);
        border-bottom: 1px solid var(--kal-line);
        box-sizing: border-box;
      }
      /* Yarim soat chizig'i — xira, faqat ko'z uchun o'lchov */
      .kal-slot::after {
        content: "";
        display: block;
        height: calc(var(--kal-h) / 2);
        border-bottom: 1px dashed rgba(15, 23, 42, 0.05);
      }

      /* Hozirgi vaqt chizig'i */
      .kal-now { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; z-index: 4; }
      .kal-now::before { content: ""; display: block; border-top: 1px solid var(--kal-now); opacity: 0.35; }
      .kal-now.on::before { border-top-width: 2px; opacity: 1; }
      .kal-now-lbl {
        position: absolute;
        left: 4px;
        top: -9px;
        font-size: 10.5px;
        font-weight: 700;
        color: #fff;
        background: var(--kal-now);
        border-radius: 5px;
        padding: 1px 5px;
        z-index: 5;
      }

      /* ── Reja bloki ──────────────────────────────────────────────── */
      .kal-ev {
        position: absolute;
        border-radius: 7px;
        padding: 4px 7px 4px 10px;
        overflow: hidden;
        cursor: pointer;
        box-sizing: border-box;
        min-height: 22px;
        z-index: 2;
      }
      .kal-ev::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 7px 0 0 7px;
        background: var(--kal-c);
      }
      .kal-ev:hover { box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16); z-index: 3; }
      /* O'tib ketgan reja xiraroq — bugungi ish ko'zga birinchi tashlansin */
      .kal-ev.past { opacity: 0.6; }
      .kal-ev-t {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .kal-ev-s { font-size: 11px; font-weight: 500; opacity: 0.85; margin-top: 1px; }
      .kal-ev-av { display: flex; gap: 2px; margin-top: 4px; }
      .kal-ev-av span {
        width: 18px;
        height: 18px;
        border-radius: 99px;
        font-size: 9px;
        font-weight: 700;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1.5px solid var(--surf);
        margin-left: -5px;
      }
      .kal-ev-av span:first-child { margin-left: 0; }
      /* Tortib ko'chirilayotgan blok — asl joyida xiralashadi */
      .kal-ev.drag { opacity: 0.35; }
      .kal-ev-grip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 7px;
        cursor: ns-resize;
      }

      /* ── Oy ko'rinishi ───────────────────────────────────────────── */
      .kal-m {
        flex: 1;
        display: grid;
        grid-template-rows: auto repeat(6, 1fr);
        min-height: 0;
      }
      .kal-m-wd { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--kal-line); }
      .kal-m-wd div { padding: 7px 0; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--v3-t3); }
      .kal-m-row { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--kal-line); min-height: 0; }
      .kal-m-cell {
        border-left: 1px solid var(--kal-line);
        padding: 4px 5px 5px;
        min-width: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 2px;
        cursor: pointer;
      }
      .kal-m-cell.we { background: rgba(15, 23, 42, 0.02); }
      .kal-m-cell.out .kal-m-n { color: var(--v3-t4); }
      .kal-m-n {
        align-self: flex-start;
        min-width: 22px;
        height: 22px;
        padding: 0 5px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--marker);
      }
      .kal-m-n.today { background: var(--brand); color: #fff; }
      .kal-m-ev {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        line-height: 1.3;
        border-radius: 5px;
        padding: 1px 4px;
        white-space: nowrap;
        overflow: hidden;
      }
      .kal-m-dot { width: 6px; height: 6px; border-radius: 99px; flex: none; }
      .kal-m-time { font-weight: 600; color: var(--v3-t3); flex: none; }
      .kal-m-nm { overflow: hidden; text-overflow: ellipsis; color: var(--marker); }
      .kal-m-more { font-size: 11px; font-weight: 600; color: var(--brand); padding: 0 4px; cursor: pointer; }

      /* ── Tafsilot kartasi ────────────────────────────────────────── */
      .kal-pop {
        position: fixed;
        z-index: 1200;
        width: 340px;
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 14px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.22);
        padding: 16px 18px 14px;
      }
      .kal-pop-top { display: flex; align-items: flex-start; gap: 10px; }
      .kal-pop-bar { width: 4px; align-self: stretch; border-radius: 99px; flex: none; margin-top: 3px; }
      .kal-pop-t { flex: 1; min-width: 0; font-size: 16.5px; font-weight: 700; color: var(--marker); line-height: 1.25; }
      .kal-pop-x {
        width: 26px; height: 26px; flex: none; border: 0; border-radius: 8px;
        background: transparent; color: var(--v3-t3); font: inherit; font-size: 15px; cursor: pointer;
      }
      .kal-pop-x:hover { background: var(--chip2); color: var(--marker); }
      .kal-pop-when { font-size: 13px; color: var(--v3-t2); margin: 4px 0 0 14px; }
      .kal-pop-rows { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
      .kal-pop-row { display: flex; gap: 10px; font-size: 13px; }
      .kal-pop-k { width: 86px; flex: none; color: var(--v3-t3); }
      .kal-pop-v { flex: 1; min-width: 0; color: var(--marker); line-height: 1.45; white-space: pre-wrap; }
      .kal-pop-av { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
      .kal-pop-av span {
        width: 24px; height: 24px; border-radius: 99px; color: #fff;
        font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      }
      .kal-pop-foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
      .kal-pop-btn {
        height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--bd2);
        background: var(--surf); font: inherit; font-size: 13px; font-weight: 600;
        color: var(--marker); cursor: pointer;
      }
      .kal-pop-btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      .kal-pop-btn.danger { color: var(--red); }
      .kal-pop-btn:hover { border-color: var(--bd4); }

      /* ── Yaratish / tahrirlash oynasi ────────────────────────────── */
      .kal-ov {
        position: fixed;
        inset: 0;
        z-index: 1300;
        background: rgba(15, 23, 42, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .kal-form {
        width: 560px;
        max-width: 100%;
        max-height: 100%;
        background: var(--surf);
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .kal-f-hdr {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--bd2);
        flex: none;
      }
      .kal-f-t { flex: 1; font-size: 16px; font-weight: 700; color: var(--marker); }
      .kal-f-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
      .kal-f-title {
        width: 100%;
        height: 46px;
        border: 1px solid var(--bd2);
        border-radius: 10px;
        padding: 0 13px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        color: var(--marker);
        background: var(--surf);
      }
      .kal-f-title:focus { outline: none; border-color: var(--brand); }
      .kal-f-title.bad { border-color: var(--red); }
      .kal-f-lbl { font-size: 12px; font-weight: 600; color: var(--v3-t3); margin-bottom: 6px; }
      .kal-f-grid { display: flex; gap: 10px; }
      .kal-f-grid > div { flex: 1; min-width: 0; }
      .kal-f-in, .kal-f-sel {
        width: 100%;
        height: 40px;
        border: 1px solid var(--bd2);
        border-radius: 10px;
        padding: 0 11px;
        font: inherit;
        font-size: 14px;
        color: var(--marker);
        background: var(--surf);
      }
      .kal-f-in:focus, .kal-f-sel:focus { outline: none; border-color: var(--brand); }
      .kal-f-area {
        width: 100%;
        min-height: 72px;
        border: 1px solid var(--bd2);
        border-radius: 10px;
        padding: 10px 11px;
        font: inherit;
        font-size: 14px;
        color: var(--marker);
        background: var(--surf);
        resize: vertical;
      }
      .kal-f-area:focus { outline: none; border-color: var(--brand); }
      /* Belgilar hisoblagichi — chegaraga yaqinlashganini oldindan
         ko'rsatadi, oshib ketsa qizarib ogohlantiradi. */
      .kal-f-count { margin-top: 5px; font-size: 11.5px; color: var(--v3-t4); text-align: right; font-variant-numeric: tabular-nums; }
      .kal-f-count.over { color: var(--red); font-weight: 700; }
      .kal-f-sw { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--marker); cursor: pointer; }
      .kal-f-sw input { width: 18px; height: 18px; accent-color: var(--brand); }
      .kal-chips { display: flex; flex-wrap: wrap; gap: 7px; }
      .kal-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 11px 0 7px;
        border-radius: 99px;
        border: 1px solid var(--bd2);
        background: var(--surf);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--marker);
        cursor: pointer;
      }
      .kal-chip i {
        width: 22px; height: 22px; border-radius: 99px; font-style: normal;
        font-size: 9px; font-weight: 700; color: #fff;
        display: flex; align-items: center; justify-content: center;
      }
      .kal-chip.on { border-color: var(--brand); background: rgba(47, 122, 185, 0.08); font-weight: 600; }
      .kal-chip.busy { border-color: #d97706; }
      .kal-warn {
        display: flex;
        gap: 9px;
        background: #fcf1e1;
        border: 1px solid rgba(217, 119, 6, 0.35);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12.5px;
        line-height: 1.45;
        color: #92400e;
      }
      .kal-warn b { font-weight: 700; }
      .kal-f-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--bd2);
        flex: none;
      }
      .kal-f-note { flex: 1; font-size: 12px; color: var(--v3-t4); }
      .kal-f-err {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        color: var(--red);
        font-weight: 500;
        line-height: 1.35;
        max-height: 54px;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }

      /* ── Qidiruv natijalari ──────────────────────────────────────── */
      .kal-srch { position: relative; }
      .kal-srch input {
        width: 190px;
        height: 32px;
        border: 1px solid var(--bd2);
        border-radius: 9px;
        padding: 0 11px;
        font: inherit;
        font-size: 13px;
        color: var(--marker);
        background: var(--surf);
      }
      .kal-srch input:focus { outline: none; border-color: var(--brand); width: 260px; }
      .kal-res {
        position: absolute;
        top: 38px;
        right: 0;
        width: 340px;
        max-height: 380px;
        overflow-y: auto;
        background: var(--surf);
        border: 1px solid var(--bd2);
        border-radius: 12px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
        z-index: 1100;
        padding: 6px;
      }
      .kal-res-row { display: flex; gap: 9px; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
      .kal-res-row:hover { background: var(--chip2); }
      .kal-res-dot { width: 7px; height: 7px; border-radius: 99px; flex: none; margin-top: 6px; }
      .kal-res-t { font-size: 13px; font-weight: 600; color: var(--marker); }
      .kal-res-s { font-size: 11.5px; color: var(--v3-t3); margin-top: 1px; }

      .kal-empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        pointer-events: none;
      }
      .kal-empty div { font-size: 13.5px; color: var(--v3-t3); }
      .kal-empty button { pointer-events: auto; }
      .kal-skel {
        position: absolute;
        border-radius: 7px;
        background: var(--chip2);
        animation: kal-pulse 1.3s ease-in-out infinite;
      }
      @keyframes kal-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

      /* ── Telefon ─────────────────────────────────────────────────── */
      @media (max-width: 859px) {
        :root { --kal-h: 60px; --kal-gutter: 48px; }
        .kal-side { display: none; }
        .kal-top {
          padding: calc(8px + var(--tg-safe-top)) 14px 10px;
          flex-wrap: wrap;
          gap: 8px;
        }
        .kal-title { font-size: 17px; }
        .kal-srch { display: none; }
        .kal-seg button { padding: 0 11px; font-size: 12.5px; }
        /* Hafta tasmasi — telefonda kunlar shu yerdan tanlanadi */
        .kal-strip {
          display: flex;
          gap: 4px;
          padding: 8px 10px;
          overflow-x: auto;
          border-bottom: 1px solid var(--kal-line);
          flex: none;
          -webkit-overflow-scrolling: touch;
        }
        .kal-strip::-webkit-scrollbar { display: none; }
        .kal-sd {
          flex: 1;
          min-width: 44px;
          border: 0;
          background: transparent;
          border-radius: 12px;
          padding: 6px 2px 5px;
          font: inherit;
          cursor: pointer;
        }
        .kal-sd.on { background: var(--brand); }
        .kal-sd-w { font-size: 10.5px; font-weight: 600; color: var(--v3-t3); }
        .kal-sd-n { font-size: 16px; font-weight: 700; color: var(--marker); margin-top: 1px; }
        .kal-sd.on .kal-sd-w, .kal-sd.on .kal-sd-n { color: #fff; }
        .kal-sd-dots { display: flex; gap: 2px; justify-content: center; height: 6px; margin-top: 3px; }
        .kal-sd-dots i { width: 4px; height: 4px; border-radius: 99px; display: block; }
        .kal-fchips {
          display: flex;
          gap: 6px;
          padding: 8px 10px;
          overflow-x: auto;
          border-bottom: 1px solid var(--kal-line);
          flex: none;
        }
        .kal-fchips::-webkit-scrollbar { display: none; }
        .kal-fchip {
          flex: none;
          height: 30px;
          padding: 0 11px;
          border-radius: 99px;
          border: 1px solid var(--bd2);
          background: var(--surf);
          font: inherit;
          font-size: 12.5px;
          font-weight: 500;
          color: var(--v3-t2);
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .kal-fchip i { width: 7px; height: 7px; border-radius: 99px; display: block; }
        .kal-fchip.on { border-color: var(--brand); color: var(--marker); font-weight: 600; }
        /* Telefonda hafta ustunlari tor — blokda faqat nom */
        .kal-ev-s, .kal-ev-av { display: none; }
        .kal-ev { padding: 3px 5px 3px 8px; }
        .kal-ev-t { font-size: 11.5px; -webkit-line-clamp: 3; }
        body.kal-day .kal-ev-s { display: block; }
        .kal-fab {
          position: fixed;
          right: 16px;
          bottom: calc(96px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
          width: 54px;
          height: 54px;
          border-radius: 99px;
          border: 0;
          background: var(--brand);
          color: #fff;
          font-size: 26px;
          line-height: 1;
          box-shadow: 0 8px 22px rgba(47, 122, 185, 0.4);
          cursor: pointer;
          z-index: 500;
        }
        /* Oynalar pastdan chiqadi */
        .kal-ov { padding: 0; align-items: flex-end; }
        .kal-form {
          width: 100%;
          border-radius: 20px 20px 0 0;
          max-height: 92vh;
          padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px));
        }
        .kal-f-grid { flex-direction: column; }
        .kal-pop {
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          top: auto !important;
          width: auto;
          border-radius: 20px 20px 0 0;
          padding-bottom: calc(14px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
        }
        /* Kun ko'rinishida tepadagi ustun sarlavhasi keraksiz — hafta
           tasmasi allaqachon qaysi kun ochiqligini ko'rsatib turibdi. */
        body.kal-day .kal-head { display: none; }
        /* Pastdagi menyu `fixed` — oxirgi soatlar uning ostida qolmasin */
        .kal-body { padding-bottom: calc(96px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px))); }
        .kal-m { padding-bottom: calc(80px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px))); }
        .kal-m-ev { display: none; }
        .kal-m-dots { display: flex; gap: 3px; flex-wrap: wrap; }
        .kal-m-dots i { width: 5px; height: 5px; border-radius: 99px; display: block; }
      }
      @media (min-width: 860px) {
        .kal-strip, .kal-fchips, .kal-fab, .kal-m-dots { display: none; }
        /* Telegram kompyuterda "⋯" va "✕" tugmalarini kontent ustiga,
           o'ng yuqori burchakka chizadi. Faollik sahifalaridagi kabi
           tepadan va o'ngdan joy qoldiriladi — sarlavha qatori va
           qidiruv maydoni tugmalar ostida qolib ketmaydi. */
        .kal-top { padding: 56px 152px 14px 32px; }
        .kal-side { padding-top: 56px; }
      }
    </style>
  </head>
  <body>
    <!-- ── KIRISH / YUKLANMOQDA ────────────────────────────────────── -->
    <div id="loading">
      <div class="ld-mark">ND</div>
      <div class="ld-bar"><div class="ld-bar-fill"></div></div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ── BUGUN ───────────────────────────────────────────────────── -->
    <div class="screen" id="screen-today">
      <div class="hdr" style="display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; min-width: 0">
          <div class="hdr-title">
            <span class="mobile-only">Bugun</span><span class="desktop-only">Panel</span>
          </div>
          <div class="hdr-sub" id="today-date-label">—</div>
        </div>

            <input id="today-search" placeholder="Loyiha yoki xodim qidirish" oninput="renderToday()" />
          </div>

        </div>

    <!-- ── LOYIHALAR ───────────────────────────────────────────────── -->
    <div class="screen" id="screen-projects">
      <div class="hdr">
        <div class="hdr-row">
          <div class="hdr-title">Loyihalar</div>
          <div class="search-box">
            <div class="search-ico"></div>
            <input

          </div>

      </div>

        class="fab"

        +

    <script>
      // ── CONFIG ────────────────────────────────────────────────────
      const API = "";
      const SUPER_ADMINS = new Set(["jahongirjuraqulov", "shaxzodshokirov"]);
      const WD = ["Du", "Se", "Cho", "Pa", "Ju", "Sh", "Ya"];
      // To'liq nomlar — Tabeldagi zamena ro'yxatida sana ostida turadi.
      const WEEKDAYS_FULL = [
        "dushanba", "seshanba", "chorshanba", "payshanba",
        "juma", "shanba", "yakshanba",
      ];
      const MONTHS = [
        "Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun",
        "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr",
      ];
      // Kartochka va ro'yxat qatori — zich joylar, to'liq oy nomi
      // ("28-sentabr – 3-oktabr") sig'maydi.
      const MONTHS_SHORT = [
        "yan", "fev", "mar", "apr", "may", "iyn",
        "iyl", "avg", "sen", "okt", "noy", "dek",
      ];

      // ── SANA TANLAGICH — brauzerning nativ input[type=date] popover'i
      // dizayn tizimiga mos emas (hech qanday CSS bilan o'zgartirib
      // bo'lmaydi), shuning uchun o'zimizning kalendar popover'imiz.
      // Har bir maydon: yashirin <input type=date> (qiymat/mavjud
      // .value o'qish kodlari o'zgarishsiz ishlaydi) + ko'rinadigan
      // "date-field" tugmasi. Kun tanlanganda yashirin input'ga haqiqiy
      // "change" event dispatch qilinadi — mavjud onchange="..."
      // ulanishlari ham (masalan np-anchor) o'zgarishsiz ishlayveradi.
      let dpState = null;
      function fmtDateField(iso) {
        if (!iso) return "";
        const d = parseISO(iso);
        return `${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
      }
      // Oraliq yorlig'i: bir kun bo'lsa — bitta sana, bir oy ichida
      // bo'lsa oy bir marta ("5–12 oktabr"), oylar har xil bo'lsa
      // ikkalasi ham ("28-sentabr – 3-oktabr").
      function fmtDateRangeField(startIso, endIso) {
        if (!startIso && !endIso) return "";
        if (!startIso) return fmtDateField(endIso);
        if (!endIso) return fmtDateField(startIso);
        if (startIso === endIso) return fmtDateField(startIso);
        const a = parseISO(startIso);
        const b = parseISO(endIso);
        const mb = MONTHS[b.getMonth()].toLowerCase();
        if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()) {
          return `${a.getDate()}–${b.getDate()}-${mb} ${b.getFullYear()}`;
        }
        const ma = MONTHS[a.getMonth()].toLowerCase();
        const ay = a.getFullYear() === b.getFullYear() ? "" : ` ${a.getFullYear()}`;
        return `${a.getDate()}-${ma}${ay} – ${b.getDate()}-${mb} ${b.getFullYear()}`;
      }
      // Ish oynasining qisqa yorlig'i: "3–8 okt" yoki oylar har xil
      // bo'lsa "28 sen – 3 okt".
      function fmtRangeShort(startIso, endIso) {
        const a = parseISO(startIso);
        const b = parseISO(endIso);
        const mb = MONTHS_SHORT[b.getMonth()];
        if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()) {
          return `${a.getDate()}–${b.getDate()} ${mb}`;
        }
        return `${a.getDate()} ${MONTHS_SHORT[a.getMonth()]} – ${b.getDate()} ${mb}`;
      }
      // Oraliqdagi kunlar soni (ikkala chekka ham kiradi).
      function rangeDayCount(startIso, endIso) {
        if (!startIso || !endIso) return 0;
        return daysBetween(parseISO(startIso), parseISO(endIso)) + 1;
      }

      // Oraliq maydoni — bitta kalendar bilan "qaysi kundan qaysi
      // kungacha". Oxirgi sana ATAYLAB `${id}` nomli input'da turadi:
      // u muddat (deadline), ya'ni oraliqni o'qimaydigan eski kod
      // (`document.getElementById("et-due").value`) o'zgarishsiz
      // ishlayveradi. Boshlanish sanasi qo'shimcha `${id}-start`da.
      function renderDateRangeFieldHtml(id, startIso, endIso, placeholder, extraAttrs) {
        const label = fmtDateRangeField(startIso, endIso);
        return `<div class="date-field${label ? "" : " placeholder"}" id="${id}-field" onclick="openDateRangePicker('${id}')">
            <span class="date-field-ico">${ICON.calendar}</span>
            <span style="flex:1" id="${id}-label" data-ph="${escHtml(placeholder || "Vaqt oralig'ini tanlang")}">${label || placeholder || "Vaqt oralig'ini tanlang"}</span>
          </div>
          <input type="hidden" id="${id}-start" value="${startIso || ""}"/>
          <input type="date" id="${id}" class="hidden-native" value="${endIso || ""}" ${extraAttrs || ""}/>`;
      }

      // `extraAttrs` — yashirin <input>ga qo'shiladigan atributlar
      // (masalan onchange). Kun tanlanganda shu input'ga haqiqiy
      // "change" hodisasi yuboriladi, ya'ni ular ishlayveradi.
      function renderDateFieldHtml(id, value, placeholder, extraAttrs) {
        const hasVal = !!value;
        return `<div class="date-field${hasVal ? "" : " placeholder"}" id="${id}-field" onclick="openDatePicker('${id}')">
            <span class="date-field-ico">${ICON.calendar}</span>
            <span style="flex:1" id="${id}-label">${hasVal ? fmtDateField(value) : placeholder || "Sana tanlang"}</span>
          </div>
          <input type="date" id="${id}" class="hidden-native" value="${value || ""}" ${extraAttrs || ""}/>`;
      }
      function openDateRangePicker(id) {
        openDatePicker(id, true);
      }
      function openDatePicker(id, range) {
        closeDatePicker();
        const trigger = document.getElementById(id + "-field");
        const hidden = document.getElementById(id);
        if (!trigger || !hidden) return;
        const startEl = range ? document.getElementById(id + "-start") : null;
        const current = hidden.value ? parseISO(hidden.value) : todayDate();
        dpState = { id, viewYear: current.getFullYear(), viewMonth: current.getMonth() };
        if (range) {
          // Qayta ochilganda avvalgi oraliq ko'rinib turadi, lekin
          // birinchi bosish uni yangidan boshlaydi — kalendarda odatiy
          // xatti-harakat shu.
          dpState.range = true;
          dpState.start = startEl?.value || hidden.value || "";
          dpState.end = hidden.value || "";
          if (dpState.start) {
            const sd = parseISO(dpState.start);
            dpState.viewYear = sd.getFullYear();
            dpState.viewMonth = sd.getMonth();
          }
        }
        const pop = document.createElement("div");
        pop.className = "datepicker-pop";
        pop.id = "dp-pop";
        document.body.appendChild(pop);
        // Avval chiziladi, keyin joylashtiriladi: balandligi oyga (5 yoki
        // 6 hafta) va rejimga (oraliqda pastda qo'shimcha panel bor)
        // qarab o'zgaradi, shuning uchun uni taxmin qilib bo'lmaydi.
        renderDatePicker();
        positionDatePicker(trigger, pop);
        document.addEventListener("mousedown", onDpOutsideClick);
        document.addEventListener("scroll", closeDatePicker, true);
      }
      function positionDatePicker(trigger, pop) {
        const r = trigger.getBoundingClientRect();
        const popW = 280;
        let left = r.left;
        if (left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
        if (left < 12) left = 12;
        const popH = pop.offsetHeight || 340;
        let top = r.bottom + 6;
        // Pastda sig'masa — maydonning tepasiga. U yerda ham sig'masa,
        // ekran ichida qolishi uchun siljitiladi.
        if (top + popH > window.innerHeight - 12) top = r.top - popH - 6;
        if (top < 12) top = Math.max(12, window.innerHeight - popH - 12);
        pop.style.left = left + "px";
        pop.style.top = top + "px";
      }
      function onDpOutsideClick(e) {
        const pop = document.getElementById("dp-pop");
        const trigger = dpState && document.getElementById(dpState.id + "-field");
        if (pop && !pop.contains(e.target) && !(trigger && trigger.contains(e.target))) closeDatePicker();
      }
      function closeDatePicker() {
        // Oraliq rejimida tashqariga bosib yopish ham tanlanganini
        // saqlaydi — "Tayyor"ni bosmagani uchun ish yo'qolmasligi kerak.
        if (dpState?.range) commitDpRange();
        document.getElementById("dp-pop")?.remove();
        document.removeEventListener("mousedown", onDpOutsideClick);
        document.removeEventListener("scroll", closeDatePicker, true);
        dpState = null;
      }
      function dpNav(delta) {
        if (!dpState) return;
        dpState.viewMonth += delta;
        if (dpState.viewMonth < 0) {
          dpState.viewMonth = 11;
          dpState.viewYear--;
        } else if (dpState.viewMonth > 11) {

          .map((c) => {

            if (c.iso === todayIso) cls.push("today");
            if (c.iso && c.iso === selectedIso) cls.push("selected");
            if (c.iso && range) {
              if (c.iso === start) cls.push("selected", "r-start");
              if (c.iso === end) cls.push("selected", "r-end");
              if (start && end && c.iso > start && c.iso < end) cls.push("in-range");
              if (start && end && start === end) cls.push("r-only");
            }
            return `<button type="button" class="${cls.join(" ")}" ${c.iso ? `onclick="selectDpDay('${c.iso}')"` : "disabled"}>${c.dNum}</button>`;

      const getInitData = () => window.Telegram?.WebApp?.initData || "";

      // Telegram imzosi 24 soatdan keyin eskiradi. Ilova shuncha vaqt
      // ochiq tursa (desktopda bo'ladigan holat), har bir so'rov 401

      // Shuning uchun bunday javob bir marta ushlanib, foydalanuvchiga
      // nima qilish kerakligi aytiladi.
      let sessionExpiredShown = false;
      async function apiFetch(url, opts = {}) {
        const h = { "Content-Type": "application/json", ...(opts.headers || {}) };
        const id = getInitData();
        if (id) h["X-Telegram-Init-Data"] = id;
        let res;
        try {
          res = await fetch(`${API}${url}`, { ...opts, headers: h });
        } catch (e) {
          // Tarmoq uzilgan. Avval bu xato jim yutilardi: ekranda eski
          // ma'lumot turaverardi va xodim ko'rayotgan raqamlar
          // eskirganini ham, amal bajarilmaganini ham bilmasdi.
          showOffline();
          throw e;
        }
        setOnline();
        // 401 ikki xil bo'ladi: imzo umuman yo'q (Telegramdan tashqarida
        // ochilgan — buning o'z ekrani bor) va imzo eskirgan. Faqat
        // ikkinchisida "sessiya eskirdi" ko'rsatiladi, aks holda
        // brauzerda ochgan odamga noto'g'ri sabab aytilardi.
        if (res.status === 401 && !sessionExpiredShown && getInitData()) {
          sessionExpiredShown = true;
          res
            .clone()
            .json()
            .then((d) => {
              if (d?.code === "INVALID_SIGNATURE") showSessionExpired();

            .catch(() => {});
        }
        return res;

      function newBadgeHtml(key, label = "Yangi") {

        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), ms);
      }
      // Matnni buferga nusxalaydi. `navigator.clipboard` faqat xavfsiz
      // kontekstda (https) ishlaydi va Telegram WebView ba'zan uni rad
      // etadi, shuning uchun eski `execCommand` zaxira bo'lib qoladi.
      // Ikkalasi ham ishlamasa `false` qaytadi — chaqiruvchi tomon
      // foydalanuvchiga raqamni qo'lda belgilashni aytadi.
      async function copyToClipboard(text) {
        const value = String(text ?? "");
        if (!value) return false;
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(value);
            return true;
          }
        } catch (e) {}
        try {
          const ta = document.createElement("textarea");
          ta.value = value;
          ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, value.length);
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (e) {
          return false;
        }
      }

      // Telefon raqami — bir bosishda nusxalanadigan tugma. Ko'rinishda
      // raqam odam o'qiydigan shaklda ("+998 90 123 45 67") qoladi,
      // buferga esa bo'shliqsiz xalqaro shakl ketadi: uni terish
      // dasturiga, Telegramga yoki istalgan formaga tozalamasdan
      // qo'yish mumkin.
      function phoneCopyHtml(phone) {
        const shown = String(phone || "").trim();
        if (!shown) return "";
        const raw = shown.replace(/[^\d+]/g, "");
        return `<button type="button" class="copy-phone" onclick="event.stopPropagation();copyPhone(this,'${escArg(raw)}')" aria-label="Telefon raqamini nusxalash">
          <span class="copy-phone-num">${escHtml(shown)}</span>
          <span class="copy-phone-ico">${ICON.copy}</span>
          <span class="copy-phone-ok">${ICON.check}</span>
        </button>`;
      }

      async function copyPhone(btn, raw) {
        const ok = await copyToClipboard(raw);
        if (!ok) return showToast("⚠ Nusxalab bo'lmadi — raqamni qo'lda belgilang");
        tg()?.HapticFeedback?.notificationOccurred?.("success");
        btn.classList.add("ok");
        clearTimeout(btn._t);
        btn._t = setTimeout(() => btn.classList.remove("ok"), 1400);
        showToast("Raqam nusxalandi");
      }

      // Tugma bosilganda "aylana" (spinner) bilan yuklanish holatini
      // ko'rsatadi — asl matn dataset'da saqlanib, xato bo'lganda
      // qaytariladi (muvaffaqiyatda odatda butun blok qayta render
      // bo'lgani uchun buni qaytarish shart emas).
      function setBtnLoading(btn, loading, loadingText) {
        if (!btn) return;
        if (loading) {
          if (btn.dataset.origHtml === undefined) btn.dataset.origHtml = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = `<span class="spinner"></span>${loadingText ? " " + escHtml(loadingText) : ""}`;
        } else {
          btn.disabled = false;
          if (btn.dataset.origHtml !== undefined) {
            btn.innerHTML = btn.dataset.origHtml;
            delete btn.dataset.origHtml;
          }
        }
      }
      // ── XODIM RANGLARI ─────────────────────────────────────────────
      // Interfeysda xodimlar ko'pincha faqat bosh harfi bilan ko'rinadi
      // (avatarlar). Bir xil harfli xodimlar — "Mirshod / Malika",
      // "Jahongir / Jafar" — bir-biridan ajralmay qolardi. Har biriga
      // o'z rangi beriladi: palitradan ketma-ket, ism bo'yicha
      // tartiblangan holda, shu sabab ikki xodimga bir xil rang tushmaydi
      // (palitra jamoadan kattaroq).
      //
      // Ranglar holat ranglaridan (yashil/sariq/qizil) ataylab uzoq
      // tanlangan: xodim rangi hech qachon "muammo" yoki "bajarildi" deb
      // o'qilmasligi kerak.
      const PERSON_COLORS = [
        "#4f6bed", "#c23a6b", "#0b7f72", "#9e47c9", "#0e7490",
        "#9a6b3f", "#a21caf", "#64748b", "#7c6f57", "#344054",
        "#2563eb", "#be185d", "#0f766e", "#7c3aed", "#b45309",
        "#155e75", "#4d7c0f", "#9f1239", "#5b21b6", "#475569",
      ];
      let _personColorMap = null;
      // Ro'yxat o'zgarganda (yangi xodim qo'shilganda) qayta hisoblanadi.
      function resetPersonColors() {
        _personColorMap = null;
      }
      function buildPersonColorMap() {
        const names = new Set();
        const collect = (u) => {
          if (u?.username) names.add(u.username);
        };
        (allUsers || []).forEach(collect);
        (projects || []).forEach((p) => (p.assignees || []).forEach(collect));
        (tasksList || []).forEach((t) => taskAssignees(t).forEach((a) => names.add(a.username)));
        const map = {};
        let i = 0;
        [...names].sort().forEach((n) => {
          map[n] = PERSON_COLORS[i++ % PERSON_COLORS.length];
        });
        return map;
      }
      function personColor(key) {
        if (!_personColorMap) _personColorMap = buildPersonColorMap();
        const k = String(key || "");
        if (_personColorMap[k]) return _personColorMap[k];
        // Ro'yxatda yo'q (masalan Telegramsiz xodim yoki faqat ismi bor) —
        // barqaror zaxira: bir xil matn har doim bir xil rang beradi.
        let h = 0;
        for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
        return PERSON_COLORS[h % PERSON_COLORS.length];
      }

      // Profil rasmi teglari. Manzil bo'lmasa — hech narsa, ya'ni
      // avatarda rangli bosh harf qoladi.
      // Telegram profil rasmi avatar ustiga qo'yiladi. Rasm YUKLANGANDAN
      // keyingina ko'rinadi (`.ok`), yuklanmasa o'zini o'chiradi —
      // ikkala holatda ham ostidagi rangli harf zaxira bo'lib turadi va
      // brauzerning "buzuq rasm" ikonkasi hech qachon ko'rinmaydi.
      function avatarImg(url) {
        return url
          ? `<img class="av-img" src="${escHtml(url)}" alt="" onerror="this.remove()" onload="this.classList.add('ok')">`
          : "";
      }
      function initials(label) {
        return String(label || "?")
          .split(/\s+/)
          .map((w) => w[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      }
      // "shaxzod SHOKIROV" / "sHaXzOd" kabi qanday yozilishidan qat'i
      // nazar — "Shaxzod Shokirov" ko'rinishiga keltiradi. Backendda
      // ham AYNAN shu mantiq bor (saqlashda yakuniy tekshiruv) — bu
      // yerdagi nusxa faqat foydalanuvchiga darhol (blur'da) ko'rsatish
      // uchun.
      function titleCaseName(str) {
        return String(str || "")
          .trim()
          .split(/\s+/)
          .map((w) => (w.length ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w))
          .join(" ");
      }
      function formatNameInputOnBlur(el) {
        el.value = titleCaseName(el.value);
      }
      // Telefon input — +998 doim ko'rinadi, foydalanuvchi faqat 9 ta
      // raqam kiritadi ("99 999 99 99"), qolgani avtomatik joylashadi.
      // Xom (faqat raqamlardan iborat) qiymatni ham qabul qiladi —
      // "998991234567" yopishtirilsa "998" prefiksi avtomatik olib
      // tashlanadi.
      function formatPhoneInput(el) {
        let digits = el.value.replace(/\D/g, "");
        if (digits.startsWith("998")) digits = digits.slice(3);
        digits = digits.slice(0, 9);
        let out = "+998";
        if (digits.length) out += " " + digits.slice(0, 2);
        if (digits.length > 2) out += " " + digits.slice(2, 5);
        if (digits.length > 5) out += " " + digits.slice(5, 7);
        if (digits.length > 7) out += " " + digits.slice(7, 9);
        el.value = out;
      }

      // ── SANA YORDAMCHILARI ────────────────────────────────────────
      function parseISO(s) {
        const [y, m, d] = String(s).slice(0, 10).split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function isoOf(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function todayDate() {
        const t = new Date();
        return new Date(t.getFullYear(), t.getMonth(), t.getDate());
      }
      function daysBetween(a, b) {
        return Math.round((b - a) / 86400000);
      }
      function fmtDay(d) {
        return `${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()}`;
      }
      function fmtTime(d) {
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }
      // Backenddagi addMonthsClamped() bilan bir xil: N oy qo'shadi, kun
      // clamp bilan (masalan 31-yanvar + 1 oy = 28/29-fevral). "Yangi
      // loyiha" preview'i shu orqali davr tugash sanasini backend bilan
      // AYNAN bir xil hisoblaydi (naiv .setMonth() emas).
      function jsAddMonthsClamped(iso, n) {
        const [y, m, d] = iso.split("-").map(Number);
        const total = y * 12 + (m - 1) + n;
        const ny = Math.floor(total / 12);
        const nm0 = ((total % 12) + 12) % 12;
        const nm = nm0 + 1;
        const dim = new Date(ny, nm, 0).getDate();
        const nd = Math.min(d, dim);
        return `${ny}-${String(nm).padStart(2, "0")}-${String(nd).padStart(2, "0")}`;
      }
      // dp-pop popoveri va "Yangi loyiha" ichki kalendari ikkalasi ham
      // shu funksiyadan foydalanadi — kun-katak hisoblash logikasi
      // ikki joyda takrorlanmasin.
      function buildCalGridCells(viewYear, viewMonth) {
        const startOffset = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7; // Dushanba = 0
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) {
          cells.push({ dNum: daysInPrevMonth - startOffset + 1 + i, iso: null });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({ dNum: d, iso: `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}` });
        }
        let n = 1;
        while (cells.length < 42) cells.push({ dNum: n++, iso: null });
        return cells;
      }

      // Kalendar HAQIQIY bajarilgan kunlar bo'yicha chiziladi: har bir
      // belgilangan post/story o'zining work_date sanasiga tushadi.
      // Oldindan reja yo'q — shu sababli "o'tkazib yuborilgan" qizil
      // kunlar ham yo'q. Natija: { '2026-08-13': [3, 4] }
      function buildDayMap(p, type) {
        const map = {};
        const det = p.checkDetails || {};
        Object.keys(p.checks || {}).forEach((key) => {
