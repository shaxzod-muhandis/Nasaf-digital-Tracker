          priority: t.priority,
          tagIds: (t.tags || []).map((tg) => tg.id),
          notifyTelegram: false,
        };
        if (body.status !== "backlog") body.dueDate = t.dueDate;
        if (t.assigneeUsername) body.assigneeUsername = t.assigneeUsername;
        try {
          const res = await apiFetch("/api/tasks", { method: "POST", body: JSON.stringify(body) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Xato");
          showToast("✅ Nusxa yaratildi");
          await loadTasks();
          refreshAllViews();
          openTaskActions(data.task.id);
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }
      // ── TO'LIQ SAHIFALAR UCHUN UMUMIY QISM ───────────────────────
      // Vazifa formasi (ntf-*) va belgilash sahifasi (cwd-*) shu
      // mexanizmdan foydalanadi: orqaga qaytish steki, maydon qatori
      // va ularning ikonkalari.
      // To'liq sahifalar ustma-ust ochiladi (vazifa formasi, belgilash
      // sahifasi va ularning ichki tanlov sahifalari), shuning uchun
      // orqaga qaytish — stek: eng ustidagi sahifa yopiladi.
      let pageBackStack = [];
      let pageBackBound = false;

      const FIELD_ICONS = {
        kimga: `<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>`,
        muddat: `<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>`,
        ustuvorlik: `<path d="M4 20V10M10 20V4M16 20v-7M22 20v-3"/>`,
        loyiha: `<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5L10 3.5H4a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2Z"/>`,
        teglar: `<path d="M20.6 13.4 12 4.8H4.8V12l8.6 8.6a2 2 0 0 0 2.8 0l4.4-4.4a2 2 0 0 0 0-2.8Z"/><circle cx="8.5" cy="8.5" r="1.2"/>`,
        navbat: `<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>`,
        sabab: `<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>`,
        turi: `<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 9 5 3-5 3Z"/>`,
        montaj: `<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4Z"/>`,
        video: `<path d="M3 8a2 2 0 0 1 2-2h3l1.5-2h5L16 6h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.5"/>`,
      };
      const NTV3_TITLES = {
        kimga: "Kim bajaradi",
        muddat: "Ish vaqti",
        ustuvorlik: "Ustuvorlik",
        loyiha: "Loyiha",
        teglar: "Teglar",
        navbat: "Navbat",
      };

      // Telegram'ning orqaga tugmasi stekning eng ustidagi sahifani
      // yopadi. Sahifa yopilgandan keyin tugma ostidagi ekranga
      // qaytariladi — tracker/profil ochiq bo'lsa, u o'z holida qoladi.
      function pageOnBack() {
        const fn = pageBackStack[pageBackStack.length - 1];
        if (fn) fn();
      }
      function pageSyncBack() {
        const b = tg()?.BackButton;
        if (!b) return;
        if (pageBackStack.length) {
          if (!pageBackBound) {
            b.onClick(pageOnBack);
            pageBackBound = true;
          }
          b.show();
        } else {
          if (pageBackBound) {
            b.offClick(pageOnBack);
            pageBackBound = false;
          }
          if (!document.querySelector("#screen-tracker.active, #screen-taskdetail.active, #screen-profile.active")) b.hide();
        }
      }
      // Telegram ichida tanlov yengil tebranish bilan tasdiqlanadi —
      // mobil ilovalardagi odatiy javob.
      function ntv3Haptic() {
        tg()?.HapticFeedback?.selectionChanged?.();
      }
      // Kompyuterda Esc — xuddi orqaga tugmasi kabi.
      function pageOnKey(e) {
        if (e.key === "Escape") pageOnBack();
      }

      // Bosilganda o'z sahifasini ochadigan maydon qatori. Vazifa
      // formasi ham, belgilash sahifasi ham shundan foydalanadi —
      // ikkalasi bir xil ko'rinishda bo'lishi kerak.
      function fieldRowHtml(o) {
        const empty = !o.value;
        return `<button type="button" class="ntv3-row" onclick="${o.onclick}">
          <span class="ntv3-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${FIELD_ICONS[o.icon] || ""}</svg></span>
          <span class="ntv3-lbl">${o.label}${o.required ? "<i>*</i>" : ""}</span>
          <span class="ntv3-val${empty ? " ph" : ""}">${o.prefix || ""}<i class="ntv3-valt">${escHtml(empty ? o.placeholder : o.value)}</i></span>
          <span class="ntv3-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        </button>`;
      }
      // ═══ VAZIFA YARATISH SAHIFASI (TZ: 16a–16d) ════════════════════
      // Modal emas, alohida sahifa (/vazifalar/yangi). Tahrirlash ham
      // shu sahifa (/vazifalar/:id/tahrir), maydonlari to'ldirilgan.
      // Asosiy qoida: ko'p ishlatiladigan uchta maydon — kim, muddat,
      // ustuvorlik — ichki ekranga kirmasdan, sahifaning o'zida
      // tanlanadi.
      let ntf = null;
      let ntfUsers = [];
      let ntfDraftTimer = 0;
      let ntfSheetState = null;

      // TZ 09: ustuvorlik to'rt daraja. Bazadagi eski "urgent"
      // (Shoshilinch) saqlanadi — doskada avvalgidek ko'rinadi, lekin
      // yangi vazifaga qo'yilmaydi va tahrirlashda "Yuqori"ga tushadi.
      const NTF_PRIORITIES = [
        { v: "no_priority", label: "Yo'q", bars: 0 },
        { v: "low", label: "Past", bars: 1, color: "var(--brand)" },
        { v: "medium", label: "O'rta", bars: 2, color: "var(--st-behind-dot, #d97706)" },
        { v: "high", label: "Yuqori", bars: 3, color: "var(--red)" },
      ];
      const NTF_ICON = {
        cal: `<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>`,
        clock: `<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>`,
        plus: `<path d="M12 5v14M5 12h14"/>`,
        x: `<path d="M6 6l12 12M18 6 6 18"/>`,
        chev: `<path d="m6 9 6 6 6-6"/>`,
        chevR: `<path d="m9 5 7 7-7 7"/>`,
        search: `<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>`,
        check: `<path d="M20 6 9 17l-5-5"/>`,
        folder: `<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2h9A1.5 1.5 0 0 1 21 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>`,
        tag: `<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 3 3 5-6"/>`,
        queue: `<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>`,
        link: `<path d="M4 12 20 4l-5 16-3-7z"/>`,
      };
      function ntfSvg(key, cls) {
        return `<svg class="${cls || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${NTF_ICON[key]}</svg>`;
      }
      function ntfIsMobile() {
        return window.matchMedia("(max-width: 767px)").matches;
      }

      // ── Xodimlar: lavozim va hozirgi yuklama ──────────────────────
      // TZ 6.3: har xodim yonida "Lavozim · N ta faol". N — tugallanmagan
      // vazifalari soni; 5 tadan ko'p bo'lsa amber rangda ogohlantiradi.
      // Alohida so'rov kerak emas: vazifalar ro'yxati allaqachon bor.
      function ntfActiveCount(username) {
        return tasksList.filter(
          (t) => !["done", "failed", "cancelled"].includes(t.status) && taskAssignees(t).some((a) => a.username === username),
        ).length;
      }
      function ntfName(u) {
        const n = u.first_name ? `${u.first_name} ${u.last_name || ""}`.trim() : u.full_name;
        return n || `@${u.username}`;
      }
      function ntfShort(u) {
        return shortPersonName(u.first_name, u.last_name, "@" + u.username);
      }
      function ntfJob(u) {
        return u.job_title || "Xodim";
      }
      // "Ko'p ishlatiladigan" = joriy admin oxirgi 30 kunda eng ko'p
      // vazifa bergan xodimlar. Yetarli tarix bo'lmasa — ro'yxat
      // boshidan to'ldiriladi, qator hech qachon bo'sh qolmaydi.
      function ntfTopUsers(n) {
        const chegara = new Date();
        chegara.setDate(chegara.getDate() - 30);
        const soni = {};
        tasksList.forEach((t) => {
          if (t.createdByUsername !== currentUser) return;
          if (t.createdAt && new Date(t.createdAt) < chegara) return;
          taskAssignees(t).forEach((a) => {
            soni[a.username] = (soni[a.username] || 0) + 1;
          });
        });
        const tartib = ntfUsers.slice().sort((a, b) => (soni[b.username] || 0) - (soni[a.username] || 0));
        return tartib.slice(0, n);
      }

      // ── Muddat yordamchilari ──────────────────────────────────────
      function ntfShift(iso, n) {
        const d = parseISO(iso);
        d.setDate(d.getDate() + n);
        return isoOf(d);
      }
      // TZ 6.4: uchinchi tezkor tugma — eng yaqin juma; bugun juma
      // bo'lsa keyingi dushanba ("Dushanba" nomi bilan).
      function ntfThirdQuick() {
        const bugun = todayDate();
        const kun = bugun.getDay(); // 0 = yakshanba
        if (kun === 5) {
          const d = new Date(bugun);
          d.setDate(d.getDate() + 3);
          return { iso: isoOf(d), label: "Dushanba" };
        }
        const qadam = (5 - kun + 7) % 7 || 7;
        const d = new Date(bugun);
        d.setDate(d.getDate() + qadam);
        return { iso: isoOf(d), label: "Juma" };
      }
      function ntfDayShort(iso) {
        const d = parseISO(iso);
        return `${d.getDate()}-${MONTHS_SHORT[d.getMonth()]}`;
      }
      const NTF_WEEKDAYS = ["Yakshanba", "Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba"];
      function ntfFullWhen() {
        if (!ntf.dueDate) return "";
        if (ntf.startDate && ntf.startDate !== ntf.dueDate) {
          return `${fmtDateRangeField(ntf.startDate, ntf.dueDate)} · ${rangeDayCount(ntf.startDate, ntf.dueDate)} kun`;
        }
        const d = parseISO(ntf.dueDate);
        return `${NTF_WEEKDAYS[d.getDay()]}, ${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()}`;
      }
      // Bugunga belgilangan muddatning soati o'tib ketgan bo'lsa,
      // xodim buni yaratishdan OLDIN ko'rishi kerak.
      function ntfTimePassed() {
        if (!ntf.dueDate || !ntf.dueTime) return false;
        if (ntf.dueDate !== isoOf(todayDate())) return false;
        const [h, m] = ntf.dueTime.split(":").map(Number);
        const now = new Date();
        return h * 60 + m < now.getHours() * 60 + now.getMinutes();
      }

      // ── Sahifani ochish/yopish ────────────────────────────────────
      function openNewTaskSheet(status) {
        return openTaskFormPage(null, typeof status === "string" ? status : null);
      }
      function openEditTaskSheet(id) {
        return openTaskFormPage(id, null);
      }
      async function openTaskFormPage(editId, kanbanStatus) {
        if (document.getElementById("ntf-page")) return;
        const t = editId ? tasksList.find((x) => x.id === editId) : null;
        if (editId && !t) return;
        ntf = {
          mode: t ? "edit" : "new",
          id: t ? t.id : null,
          editStatus: t ? t.status : null,
          title: t ? t.title || "" : "",
          desc: t ? t.description || "" : "",
          assignees: t ? taskAssignees(t).map((a) => a.username) : [],
          startDate: t?.startDate || "",
          dueDate: t?.dueDate || "",
          // TZ 6.4: standart soat 18:00.
          dueTime: t ? t.dueTime || "" : "18:00",
          // Eski "Shoshilinch" to'rt darajali segmentda yo'q — tahrirda
          // u "Yuqori" bo'lib ko'rinadi (09-bo'lim).
          priority: t ? (t.priority === "urgent" ? "high" : t.priority || "no_priority") : "no_priority",
          projectSlug: t?.projectSlug || "",
          tagIds: new Set((t?.tags || []).map((g) => g.id)),
          startMode: t ? (t.status === "backlog" ? "queue" : "now") : "now",
          notify: true,
          // Kanban ustunidan ochilsa, vazifa o'sha ustunga tushadi.
          status: kanbanStatus || null,
          saving: false,
          draftAt: "",
          touched: false,
        };
        const yangi = !t;
        if (yangi) ntfLoadDraft();

        const ov = document.createElement("div");
        ov.className = "ntf-ov";
        ov.id = "ntf-page";
        ov.innerHTML = `
          <header class="ntf-hdr">
            <div class="ntf-hdr-txt">
              <div class="ntf-crumb">Vazifalar / <b>${t ? "Tahrirlash" : "Yangi vazifa"}</b></div>
              <div class="ntf-h1">${t ? "Vazifani tahrirlash" : "Yangi vazifa"}</div>
            </div>
            <div class="ntf-draft" id="ntf-draft"></div>
          </header>
          <div class="ntf-scroll" id="ntf-scroll">
            <div class="ntf-wrap">
              <div>
                <div class="ntf-card ntf-main" id="ntf-maincard">
                  <div class="ntf-main-top">
                    <div class="ntf-cap">Vazifa nomi</div>
                    <textarea class="ntf-title-in" id="ntf-title" rows="1" maxlength="200" placeholder="Vazifa nomi"></textarea>
                  </div>
                  <div class="ntf-sep"></div>
                  <div class="ntf-main-desc">
                    <div class="ntf-cap">Tavsif</div>
                    <textarea class="ntf-desc-in" id="ntf-desc" placeholder="Nima qilish kerak? (ixtiyoriy)"></textarea>
                  </div>
                  <div class="ntf-tools">
                    <button type="button" class="ntf-tool b" title="Qalin" onclick="ntfMd('bold')">B</button>
                    <button type="button" class="ntf-tool" title="Ro'yxat" onclick="ntfMd('ul')">•</button>
                    <button type="button" class="ntf-tool" title="Raqamli ro'yxat" onclick="ntfMd('ol')">1.</button>
                    <button type="button" class="ntf-tool" title="Havola" onclick="ntfMd('link')">${ntfSvg("link")}</button>
                    <span class="ntf-tool-div"></span>
                    <button type="button" class="ntf-toolbtn" onclick="ntfAttach()">${ntfSvg("plus")}Fayl biriktirish</button>
                    <span class="ntf-tools-hint">Ctrl + Enter — ${t ? "saqlash" : "yaratish"}</span>
                  </div>
                </div>
              </div>
              <aside class="ntf-side" id="ntf-side"></aside>
            </div>
          </div>
          <footer class="ntf-foot" id="ntf-foot"></footer>`;
        document.body.appendChild(ov);

        const titleEl = document.getElementById("ntf-title");
        const descEl = document.getElementById("ntf-desc");
        titleEl.value = ntf.title;
        descEl.value = ntf.desc;
        [titleEl, descEl].forEach((el) => {
          el.addEventListener("input", () => {
            ntf[el === titleEl ? "title" : "desc"] = el.value;
            ntfAutoGrow(el);
            ntf.touched = true;
            ntfRender();
            ntfQueueDraft();
          });
          el.addEventListener("blur", ntfSaveDraft);
        });
        ntfAutoGrow(titleEl);
        ntfAutoGrow(descEl);

        pageBackStack = [ntfExit];
        pageSyncBack();
        document.addEventListener("keydown", ntfKey);
        ntfPushRoute();
        ntfRender();
        // Sahifa ochilganda fokus nom maydonida (TZ 6.2)
        if (!ntfIsMobile()) titleEl.focus();

        try {
          const res = await apiFetch("/api/users/directory");
          if (res.ok) {
            ntfUsers = ((await res.json()).users || []).sort((a, b) => ntfName(a).localeCompare(ntfName(b), "uz"));
          }
        } catch (e) {}
        if (document.getElementById("ntf-page")) ntfRender();
      }
      // Yozuv maydoni matn bilan birga o'sadi — hech qayerda fiks
      // balandlik yo'q (TZ 04).
      function ntfAutoGrow(el) {
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      }
      function ntfClose() {
        document.querySelector(".ntf-sheet-ov")?.remove();
        document.getElementById("ntf-pop")?.remove();
        document.getElementById("ntf-page")?.remove();
        document.removeEventListener("keydown", ntfKey);
        clearTimeout(ntfDraftTimer);
        pageBackStack = [];
        pageSyncBack();
        ntfPopRoute();
        ntf = null;
        ntfSheetState = null;
      }
      // Saqlanmagan o'zgarish bo'lsa, chiqishdan oldin so'raladi —
      // yozilgan matn bitta tasodifiy bosishdan yo'qolmasligi kerak.
      function ntfExit() {
        if (!ntf) return;
        if (document.querySelector(".ntf-sheet-ov") || document.getElementById("ntf-pop")) return ntfCloseLayer();
        if (ntf.mode === "new" && ntfDirty()) {
          ntfConfirmExit();
          return;
        }
        ntfClose();
      }
      function ntfDirty() {
        return !!(ntf.title.trim() || ntf.desc.trim() || ntf.assignees.length || ntf.dueDate || ntf.tagIds.size || ntf.projectSlug);
      }
      // Sahifadan chiqib boshqa joyga o'tish: yozilgani bo'lsa avval
      // so'raladi, "Chiqish" bosilganda `keyin` bajariladi.
      function ntfLeaveFor(keyin) {
        if (ntf && ntf.mode === "new" && ntfDirty()) {
          ntfConfirmExit(keyin);
          return false;
        }
        ntfClose();
        return true;
      }
      function ntfConfirmExit(keyin) {
        const { body, ov } = makeSheet("Chiqasizmi?");
        body.innerHTML = `<div class="f-hint" style="margin-bottom:16px;font-size:13.5px;line-height:1.6">O'zgarishlar qoralamada qoladi — keyin qaytib davom ettirishingiz mumkin.</div>
          <div style="display:flex;flex-direction:column;gap:9px">
            <button class="btn btn-soft" id="ntf-stay">Qolish</button>
            <button class="btn btn-blue" id="ntf-leave">Chiqish</button>
          </div>`;
        document.getElementById("ntf-stay").onclick = () => ov.remove();
        document.getElementById("ntf-leave").onclick = () => {
          ov.remove();
          ntfSaveDraft();
          ntfClose();
          if (typeof keyin === "function") keyin();
        };
      }
      function ntfCloseLayer() {
        document.querySelector(".ntf-sheet-ov")?.remove();
        document.getElementById("ntf-pop")?.remove();
        ntfSheetState = null;
        ntfRender();
      }
      function ntfKey(e) {
        if (!ntf) return;
        if (e.key === "Escape") {
          e.preventDefault();
          return ntfExit();
        }
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          ntfSubmit();
        }
      }
      // Brauzerning orqaga tugmasi ← bilan bir xil ishlaydi (TZ 03).
      function ntfPushRoute() {
        try {
          const yol = ntf.mode === "edit" ? `/vazifalar/${ntf.id}/tahrir` : "/vazifalar/yangi";
          history.pushState({ ntf: 1 }, "", yol);
          window.addEventListener("popstate", ntfOnPop);
        } catch (e) {}
      }
      function ntfPopRoute() {
        window.removeEventListener("popstate", ntfOnPop);
        try {
          if (history.state && history.state.ntf) history.back();
          else if (location.pathname.startsWith("/vazifalar/")) history.replaceState(null, "", "/");
        } catch (e) {}
      }
      function ntfOnPop() {
        if (ntf) ntfClose();
      }

      // ── Qoralama (TZ 03) ──────────────────────────────────────────
      function ntfDraftKey() {
        return `ntf-draft:${currentUser || "anon"}`;
      }
      function ntfQueueDraft() {
        clearTimeout(ntfDraftTimer);
        ntfDraftTimer = setTimeout(ntfSaveDraft, 2000);
      }
      function ntfSaveDraft() {
        if (!ntf || ntf.mode !== "new") return;
        if (!ntfDirty()) return;
        try {
          localStorage.setItem(
            ntfDraftKey(),
            JSON.stringify({
              title: ntf.title,
              desc: ntf.desc,
              assignees: ntf.assignees,
              startDate: ntf.startDate,
              dueDate: ntf.dueDate,
              dueTime: ntf.dueTime,
              priority: ntf.priority,
              projectSlug: ntf.projectSlug,
              tagIds: [...ntf.tagIds],
              startMode: ntf.startMode,
              notify: ntf.notify,
              at: new Date().toTimeString().slice(0, 5),
            }),
          );
          ntf.draftAt = new Date().toTimeString().slice(0, 5);
          const el = document.getElementById("ntf-draft");
          if (el) el.textContent = `Qoralama saqlandi · ${ntf.draftAt}`;
        } catch (e) {}
      }
      function ntfLoadDraft() {
        try {
          const raw = localStorage.getItem(ntfDraftKey());
          if (!raw) return;
          const d = JSON.parse(raw);
          Object.assign(ntf, {
            title: d.title || "",
            desc: d.desc || "",
            assignees: Array.isArray(d.assignees) ? d.assignees : [],
            startDate: d.startDate || "",
            dueDate: d.dueDate || "",
            dueTime: d.dueTime || "18:00",
            priority: d.priority || "no_priority",
            projectSlug: d.projectSlug || "",
            tagIds: new Set(d.tagIds || []),
            startMode: d.startMode || "now",
            notify: d.notify !== false,
            // Qachon saqlangani sarlavhada ko'rinadi — qaytib
            // kelganda qoralama borligini shu aytadi.
            draftAt: d.at || "",
          });
        } catch (e) {}
      }
      function ntfClearDraft() {
        try {
          localStorage.removeItem(ntfDraftKey());
        } catch (e) {}
      }

      // ── Parametrlar ustuni ────────────────────────────────────────
      function ntfAv(u, extra) {
        const nom = ntfName(u);
        return `<span class="ntf-av" style="background:${personColor(u.username)}">${escHtml(nom.slice(0, 1).toUpperCase())}${avatarImg(u.avatar_url)}</span>${extra || ""}`;
      }
      // 5 tadan ko'p faol vazifa — xodim band, bu ko'rinib tursin.
      function ntfBusy(username) {
        const n = ntfActiveCount(username);
        return `<b class="${n >= 5 ? "ntf-busy" : ""}">${n} ta faol</b>`;
      }
      // O'ng chekkadagi izoh: bo'sh majburiy maydonda qizil
      // "Tanlanmagan", aks holda qiymat yoki maslahat.
      function ntfLbl(text, opt) {
        const o = opt || {};
        let right = "";
        if (o.required && !o.filled) right = `<span class="ntf-lbl-r miss">Tanlanmagan</span>`;
        else if (o.value) right = `<span class="ntf-lbl-r val ${o.cls || ""}">${escHtml(o.value)}</span>`;
        else if (o.hint) right = `<span class="ntf-lbl-r ${o.cls || ""}">${escHtml(o.hint)}</span>`;
        return `<div class="ntf-lbl">${escHtml(text)}${o.required ? "<i>*</i>" : ""}${right}</div>`;
      }
      function ntfRender() {
        if (!ntf) return;
        const side = document.getElementById("ntf-side");
        if (side) side.innerHTML = ntfSideHtml();
        const foot = document.getElementById("ntf-foot");
        if (foot) foot.innerHTML = ntfFootHtml();
        const draft = document.getElementById("ntf-draft");
        if (draft && ntf.draftAt) draft.textContent = `Qoralama saqlandi · ${ntf.draftAt}`;
      }
      function ntfSideHtml() {
        return ntfMainParamsCard() + ntfExtraCard();
      }

      // ── Karta 1: kim bajaradi · muddat · ustuvorlik ───────────────
      function ntfMainParamsCard() {
        return `<div class="ntf-card pad" id="ntf-card-asg">
          ${ntfAsgBlock()}
          <div class="ntf-next" id="ntf-card-due">${ntfDueBlock()}</div>
          <div class="ntf-next">${ntfPriorityBlock()}</div>
        </div>`;
      }
      function ntfAsgBlock() {
        const tanlangan = ntf.assignees.map((un) => ntfUsers.find((u) => u.username === un)).filter(Boolean);
        const chips =
          tanlangan
            .map(
              (u) => `<div class="ntf-asg">
                ${ntfAv(u)}
                <span class="ntf-asg-txt">
                  <span class="ntf-asg-n">${escHtml(ntfShort(u))}</span>
                  <span class="ntf-asg-s">${escHtml(ntfJob(u))} · ${ntfBusy(u.username)}</span>
                </span>
                <button type="button" class="ntf-x" aria-label="Olib tashlash" onclick="ntfToggleAsg('${escArg(u.username)}')">${ntfSvg("x")}</button>
              </div>`,
            )
            .join("") +
          `<button type="button" class="ntf-add" id="ntf-add-asg" onclick="ntfOpenAsgPop(this)">${ntfSvg("plus")}Qo'shish</button>`;

        const avrow =
          ntfTopUsers(5)
            .map((u) => {
              const on = ntf.assignees.includes(u.username);
              return `<button type="button" class="ntf-avitem${on ? " on" : ""}" onclick="ntfToggleAsg('${escArg(u.username)}')">
                <span class="ntf-avwrap">${ntfAv(u, `<span class="ntf-avtick">✓</span>`)}</span>
                <span class="ntf-avn">${escHtml(ntfShort(u).split(" ")[0])}</span>
                <span class="ntf-avj">${escHtml(ntfJob(u))}</span>
              </button>`;
            })
            .join("") +
          `<button type="button" class="ntf-avitem all" onclick="ntfOpenSheet('kim')">
             <span class="ntf-avwrap"><span class="ntf-av">${ntfSvg("search")}</span></span>
             <span class="ntf-avn">Hammasi</span>
           </button>`;

        const lbl = ntf.assignees.length
          ? `<div class="ntf-lbl">Kim bajaradi<i>*</i><span class="ntf-lbl-r ntf-only-d">Bir nechta tanlash mumkin</span></div>`
          : ntfLbl("Kim bajaradi", { required: true, filled: false });
        return `${lbl}
          <div class="ntf-asg-list ntf-only-d">${chips}</div>
          <div class="ntf-avrow ntf-only-m">${avrow}</div>`;
      }
      function ntfDueBlock() {
        const bugun = isoOf(todayDate());
        const ertaga = ntfShift(bugun, 1);
        const uchinchi = ntfThirdQuick();
        const bir = (iso) => ntf.dueDate === iso && ntf.startDate === iso;
        // Sana qismi faqat katta ekranda — telefonda tugma qatori tor.
        const btn = (iso, label, sana) =>
          `<button type="button" class="ntf-qbtn${bir(iso) ? " on" : ""}" onclick="ntfPickQuickDay('${iso}')">${label}${sana ? `<span class="ntf-only-d">${ntfDayShort(iso)}</span>` : ""}</button>`;
        const oraliq = !!(ntf.dueDate && (!ntf.startDate || ntf.startDate !== ntf.dueDate));
        const kech = ntfTimePassed();
        // Telefonda soat chipi yo'q — tanlangan muddat maydon nomining
        // o'ng tomonida ko'rinadi (TZ 6.4).
        const qisqa = ntf.dueDate
          ? `${ntfDayShort(ntf.dueDate)}${ntf.dueTime ? ", " + ntf.dueTime : ""}`
          : "";
        const lbl = ntf.dueDate
          ? `<div class="ntf-lbl">Muddat<i>*</i><span class="ntf-lbl-r val ntf-only-m">${escHtml(qisqa)}</span></div>`
          : ntfLbl("Muddat", { required: true, filled: false });
        return `${lbl}
          <div class="ntf-quick">
            ${btn(bugun, "Bugun", false)}
            ${btn(ertaga, "Ertaga", true)}
            ${uchinchi.iso === ertaga ? "" : btn(uchinchi.iso, uchinchi.label, true)}
            <button type="button" class="ntf-qbtn${oraliq ? " on" : ""}" onclick="ntfOpenPicker('sana', this)">${ntfSvg("cal")}Sana</button>
          </div>
          <div class="ntf-timerow ntf-only-d">
            <button type="button" class="ntf-qbtn time${kech ? " late" : ""}" onclick="ntfOpenPicker('soat', this)">
              ${ntfSvg("clock")}<b>${ntf.dueTime ? escHtml(ntf.dueTime) + " gacha" : "Soat"}</b>
            </button>
            <span class="ntf-when">${kech ? "Vaqt o'tib ketgan" : escHtml(ntfFullWhen())}</span>
          </div>`;
      }
      function ntfPriorityBlock() {
        const bars = (p) =>
          p.bars
            ? `<span class="ntf-bars">${[0, 1, 2].map((i) => `<i${i < p.bars ? ` style="background:${p.color}"` : ""}></i>`).join("")}</span>`
            : "";
        return `${ntfLbl("Ustuvorlik", {})}
          <div class="ntf-seg four" role="group">
            ${NTF_PRIORITIES.map(
              (p) =>
                `<button type="button" class="ntf-seg-b${ntf.priority === p.v ? " on" : ""}" aria-pressed="${ntf.priority === p.v}" onclick="ntfSet('priority','${p.v}')">${bars(p)}${p.label}</button>`,
            ).join("")}
          </div>`;
      }

      // ── Karta 2: loyiha · teglar · boshlanishi · Telegram ─────────
      function ntfProjectLabel() {
        const p = projects.find((x) => (x.slug || x.id) === ntf.projectSlug);
        return p ? p.label : "Umumiy";
      }
      function ntfProjectColor() {
        return ntf.projectSlug ? personColor(ntf.projectSlug) : "var(--v3-t4)";
      }
      function ntfTagList() {
        return tagsList.filter((t) => ntf.tagIds.has(t.id));
      }
      function ntfTagChip(t, xBtn) {
        const c = tagColor(t.name);
        return `<span class="ntf-tag" style="background:${c.bg};color:${c.ink}">${escHtml(t.name)}${xBtn ? `<button type="button" aria-label="Olib tashlash" onclick="event.stopPropagation();ntfToggleTag('${escArg(t.id)}')">×</button>` : ""}</span>`;
      }
      function ntfNotifyText() {
        const nomlar = ntf.assignees
          .map((un) => ntfUsers.find((u) => u.username === un))
          .filter(Boolean)
          .map((u) => ntfShort(u));
        if (!nomlar.length) return "Bajaruvchiga darhol boradi";
        const kim = nomlar.length > 2 ? `${nomlar.length} xodimga` : nomlar.join(", ") + " ga";
        return `${kim} darhol xabar boradi`;
      }
      function ntfExtraCard() {
        const teglar = ntfTagList();
        // Katta ekran: har biri o'z boshqaruvi bilan.
        const desktop = `<div class="ntf-card pad ntf-only-d">
          ${ntfLbl("Loyiha", {})}
          <button type="button" class="ntf-select" onclick="ntfOpenPicker('loyiha', this)">
            <span class="ntf-dot" style="background:${ntfProjectColor()}"></span>
            <span class="ntf-select-v">${escHtml(ntfProjectLabel())}</span>
            ${ntfSvg("chev")}
          </button>
          <div class="ntf-next">
            ${ntfLbl("Teglar", {})}
            <div class="ntf-tags">
              ${teglar.map((t) => ntfTagChip(t, true)).join("")}
              <button type="button" class="ntf-add" onclick="ntfOpenPicker('teglar', this)">${ntfSvg("plus")}Teg</button>
            </div>
          </div>
          <div class="ntf-next">
            ${ntfLbl("Boshlanishi", {})}
            <div class="ntf-seg">
              <button type="button" class="ntf-seg-b${ntf.startMode === "now" ? " on" : ""}" aria-pressed="${ntf.startMode === "now"}" onclick="ntfSet('startMode','now')">Hozir boshlanadi</button>
              <button type="button" class="ntf-seg-b${ntf.startMode === "queue" ? " on" : ""}" aria-pressed="${ntf.startMode === "queue"}" onclick="ntfSet('startMode','queue')">Navbatga qo'yish</button>
            </div>
          </div>
          <div class="ntf-tg" onclick="ntfSet('notify',${!ntf.notify})">
            <span class="ntf-tg-txt">
              <span class="ntf-tg-t">Telegramga xabar</span>
              <span class="ntf-tg-s">${escHtml(ntfNotifyText())}</span>
            </span>
            <span class="ntf-sw${ntf.notify ? " on" : ""}" role="switch" aria-checked="${ntf.notify}"></span>
          </div>
        </div>`;

        // Telefon: bir xil balandlikdagi qatorlar, har biri o'z oynasini ochadi.
        const row = (icon, label, valueHtml, onclick) =>
          `<button type="button" class="ntf-row" onclick="${onclick}">
            <span class="ntf-row-ico">${ntfSvg(icon)}</span>
            <span class="ntf-row-l">${label}</span>
            ${valueHtml}
            <span class="ntf-row-c">${ntfSvg("chevR")}</span>
          </button>`;
        const val = (text, on) => `<span class="ntf-row-v${on ? " on" : ""}">${escHtml(text)}</span>`;
        const tegVal = teglar.length
          ? teglar.length === 1
            ? ntfTagChip(teglar[0], false)
            : val(`${teglar.length} teg`, true)
          : val("Yo'q", false);
        const mobile = `<div class="ntf-card ntf-rows ntf-only-m">
          ${row("folder", "Loyiha", val(ntfProjectLabel(), !!ntf.projectSlug), "ntfOpenPicker('loyiha', this)")}
          ${row("tag", "Teglar", tegVal, "ntfOpenPicker('teglar', this)")}
          ${row("queue", "Boshlanishi", val(ntf.startMode === "queue" ? "Navbatga" : "Hozir", ntf.startMode === "queue"), "ntfOpenSheet('boshlanishi')")}
          <div class="ntf-row tg" onclick="ntfSet('notify',${!ntf.notify})">
            <span class="ntf-tg-txt" style="flex:1;min-width:0">
              <span class="ntf-tg-t">Telegramga xabar</span>
              <span class="ntf-tg-s">${escHtml(ntfNotifyText())}</span>
            </span>
            <span class="ntf-sw${ntf.notify ? " on" : ""}" role="switch" aria-checked="${ntf.notify}"></span>
          </div>
        </div>`;
        return desktop + mobile;
      }

      // ── Pastki panel (6.7) ────────────────────────────────────────
      // Xulosa faqat tanlangan qiymatlardan tuziladi — bo'sh maydon
      // xulosaga chiqmaydi.
      function ntfSummaryHtml() {
        const u = ntf.assignees.length ? ntfUsers.find((x) => x.username === ntf.assignees[0]) : null;
        const bolaklar = [];
        if (ntf.dueDate) {
          const bugun = isoOf(todayDate());
          const kun =
            ntf.dueDate === bugun
              ? "bugun"
              : ntf.dueDate === ntfShift(bugun, 1)
                ? "ertaga"
                : ntfDayShort(ntf.dueDate);
          bolaklar.push(ntf.dueTime ? `${kun} ${ntf.dueTime} gacha` : kun);
        }
        if (ntf.priority !== "no_priority") {
          bolaklar.push(NTF_PRIORITIES.find((p) => p.v === ntf.priority).label);
        }
        if (ntf.projectSlug) bolaklar.push(ntfProjectLabel());
        const ism = u ? `<b>${escHtml(ntfShort(u))}</b>` : "";
        const qolgani = bolaklar.length ? `${ism ? " · " : ""}${escHtml(bolaklar.join(" · "))}` : "";
        if (!ism && !qolgani) return "";
        return `<div class="ntf-sum">${u ? ntfAv(u) : ""}<span class="ntf-sum-t">${ism}${qolgani}</span></div>`;
      }
      function ntfMissing() {
        const yoq = [];
        if (!ntf.title.trim()) yoq.push({ key: "title", label: "nom" });
        if (!ntf.assignees.length) yoq.push({ key: "asg", label: "kim bajaradi" });
        if (!ntf.dueDate) yoq.push({ key: "due", label: "muddat" });
        return yoq;
      }
      function ntfFootHtml() {
        const yoq = ntfMissing();
        const tahrir = ntf.mode === "edit";
        const label = tahrir ? "Saqlash" : "Vazifani yaratish";
        const ichi = ntf.saving
          ? `<span class="ntf-spin"></span>${tahrir ? "Saqlanmoqda…" : "Yaratilmoqda…"}`
          : label;
        const miss = yoq.length
          ? `<div class="ntf-missing">${yoq.length} ta majburiy maydon: ${escHtml(yoq.map((x) => x.label).join(", "))}</div>`
          : "";
        const sum = ntfSummaryHtml();
        const btn = `<button type="button" class="ntf-btn primary${yoq.length ? " dim" : ""}" id="ntf-save"${ntf.saving ? " disabled" : ""} onclick="ntfSubmit()">${ichi}</button>`;
        return `<div class="ntf-foot-in">
            ${sum || `<div class="ntf-sum"></div>`}
            <div class="ntf-acts">
              ${miss}
              <button type="button" class="ntf-btn ghost" onclick="ntfExit()">Bekor qilish</button>
              ${btn}
            </div>
          </div>
          <div class="ntf-foot-m">
            ${miss || sum}
            ${btn}
          </div>`;
      }

      // ── O'zgartirishlar ───────────────────────────────────────────
      function ntfSet(key, value) {
        if (!ntf) return;
        ntf[key] = value;
        ntf.touched = true;
        ntfHaptic();
        ntfRender();
        ntfQueueDraft();
      }
      function ntfHaptic() {
        tg()?.HapticFeedback?.selectionChanged?.();
      }
      function ntfToggleAsg(username) {
        const i = ntf.assignees.indexOf(username);
        if (i === -1) ntf.assignees.push(username);
        else ntf.assignees.splice(i, 1);
        ntf.touched = true;
        ntfHaptic();
        ntfRender();
        ntfSyncSheet();
        ntfQueueDraft();
      }
      function ntfToggleTag(id) {
        if (ntf.tagIds.has(id)) ntf.tagIds.delete(id);
        else ntf.tagIds.add(id);
        ntf.touched = true;
        ntfHaptic();
        ntfRender();
        ntfSyncSheet();
        ntfQueueDraft();
      }
      // Tezkor tugma bir kunlik ish qo'yadi: boshlanishi ham, muddati
      // ham o'sha kun. Haqiqiy oraliq "Oraliq" tugmasi orqali.
      function ntfPickQuickDay(iso) {
        ntf.startDate = iso;
        ntf.dueDate = iso;
        ntf.touched = true;
        ntfHaptic();
        ntfRender();
        ntfQueueDraft();
      }
      // Tavsifga oddiy markdown qo'shish (faqat katta ekran asboblari)
      function ntfMd(kind) {
        const el = document.getElementById("ntf-desc");
        if (!el) return;
        const s = el.selectionStart;
        const e = el.selectionEnd;
        const tanlangan = el.value.slice(s, e);
        const yangi =
          kind === "bold"
            ? `**${tanlangan || "qalin"}**`
            : kind === "link"
              ? `[${tanlangan || "matn"}](https://)`
              : kind === "ul"
                ? `\n- ${tanlangan}`
                : `\n1. ${tanlangan}`;
        el.setRangeText(yangi, s, e, "end");
        ntf.desc = el.value;
        ntfAutoGrow(el);
        el.focus();
        ntfQueueDraft();
      }

      // Fayl biriktirish dizaynda bor, lekin backend'da vazifaga fayl
      // biriktirish hali yo'q — tugmani jim qoldirgandan ko'ra nega
      // ishlamayotganini aytgan ma'qul.
      function ntfAttach() {
        showToast("Fayl biriktirish hali tayyor emas — tavsifga havola qo'ying", 3000);
      }

      // ── Xodim tanlash: katta ekranda oynacha, mobilda sheet ───────
      // Xodim, loyiha va teg — uchalasi bitta tanlagichdan foydalanadi:
      // katta ekranda bosilgan joyning ostida ochiladigan oynacha,
      // telefonda esa pastdan chiqadigan oyna. Shunda bir xil ishni
      // uch xil qilib o'rganish kerak bo'lmaydi.
      function ntfOpenPicker(key, btn) {
        if (ntfIsMobile() || !btn) return ntfOpenSheet(key);
        document.getElementById("ntf-pop")?.remove();
        ntfInitPickState(key);
        const pop = document.createElement("div");
        pop.className = "ntf-pop";
        pop.id = "ntf-pop";
        pop.innerHTML = `<div style="padding:0 12px">${ntfSearchHtml()}${ntfFiltersHtml()}</div>
          <div class="ntf-sheet-body" id="ntf-sheet-body" style="margin:10px 12px 12px;border:0;padding:0;background:transparent">${ntfSheetBodyHtml()}</div>`;
        document.body.appendChild(pop);
        const r = btn.getBoundingClientRect();
        const w = 340;
        const h = Math.min(420, pop.offsetHeight || 420);
        let left = Math.min(r.left, window.innerWidth - w - 12);
        let top = r.bottom + 6;
        if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
        pop.style.left = Math.max(12, left) + "px";
        pop.style.top = top + "px";
        setTimeout(() => document.addEventListener("mousedown", ntfPopOutside), 0);
        pop.querySelector("input")?.focus();
      }
      function ntfOpenAsgPop(btn) {
        return ntfOpenPicker("kim", btn);
      }
      function ntfPopOutside(e) {
        const pop = document.getElementById("ntf-pop");
        if (pop && !pop.contains(e.target)) ntfClosePicker();
      }
      // Qaysi biri ochiq bo'lsa — o'shani yopadi.
      function ntfClosePicker() {
        const pop = document.getElementById("ntf-pop");
        if (pop) {
          ntfCommitPick();
          pop.remove();
          document.removeEventListener("mousedown", ntfPopOutside);
          ntfSheetState = null;
          ntfRender();
          ntfQueueDraft();
          return;
        }
        ntfCloseSheet();
      }

      // ── Pastdan chiqadigan oyna (16d) ────────────────────────────
      const NTF_SHEET_TITLES = {
        kim: "Kim bajaradi",
        loyiha: "Loyiha",
        teglar: "Teglar",
        boshlanishi: "Boshlanishi",
        sana: "Ish oralig'i",
        soat: "Muddat soati",
      };
      function ntfInitPickState(key) {
        ntfSheetState = { key, q: "", role: "" };
        if (key === "sana") {
          const b = ntf.startDate || ntf.dueDate || isoOf(todayDate());
          const d = parseISO(b);
          ntfSheetState.cal = { y: d.getFullYear(), m: d.getMonth(), start: ntf.startDate || "", end: ntf.dueDate || "" };
        }
      }
      // Kalendarda tanlangan oraliqni asosiy obyektga yozadi —
      // "Tayyor" bosilmasa ham tanlangani yo'qolmasligi kerak.
      function ntfCommitPick() {
        if (ntfSheetState?.key === "sana" && ntfSheetState.cal) {
          const c = ntfSheetState.cal;
          if (c.start) {
            ntf.startDate = c.start;
            ntf.dueDate = c.end || c.start;
          }
        }
      }
      function ntfOpenSheet(key) {
        document.querySelector(".ntf-sheet-ov")?.remove();
        ntfInitPickState(key);
        const ov = document.createElement("div");
        ov.className = "ntf-sheet-ov";
        ov.onclick = (e) => {
          if (e.target === ov) ntfCloseSheet();
        };
        // Sana va soat oynalarida ro'yxat yo'q — ular oq kartaga
        // solinmaydi (`plain`).
        const tekis = key === "sana" || key === "soat";
        ov.innerHTML = `<div class="ntf-sheet">
          <div class="ntf-grab"></div>
          <div class="ntf-sheet-hdr">
            <div class="ntf-sheet-t">${NTF_SHEET_TITLES[key]}</div>
            <div class="ntf-sheet-n" id="ntf-sheet-n">${ntfSheetCount()}</div>
          </div>
          ${ntfHasSearch(key) ? ntfSearchHtml() + ntfFiltersHtml() : ""}
          <div class="ntf-sheet-body${tekis ? " plain" : ""}" id="ntf-sheet-body">${ntfSheetBodyHtml()}</div>
          <div class="ntf-sheet-foot"><button type="button" class="ntf-btn primary" onclick="ntfCloseSheet()">${ntfSheetDone()}</button></div>
        </div>`;
        document.body.appendChild(ov);
        pageBackStack.push(ntfCloseSheet);
        pageSyncBack();
      }
      function ntfCloseSheet() {
        const ov = document.querySelector(".ntf-sheet-ov");
        if (!ov) return;
        ntfCommitPick();
        ov.remove();
        if (pageBackStack[pageBackStack.length - 1] === ntfCloseSheet) pageBackStack.pop();
        pageSyncBack();
        ntfSheetState = null;
        ntfRender();
        ntfQueueDraft();
      }
      function ntfSheetCount() {
        if (!ntfSheetState) return "";
        if (ntfSheetState.key === "kim") return ntf.assignees.length ? `${ntf.assignees.length} tanlandi` : "";
        if (ntfSheetState.key === "teglar") return ntf.tagIds.size ? `${ntf.tagIds.size} tanlandi` : "";
        return "";
      }
      function ntfSheetDone() {
        if (ntfSheetState?.key === "kim") return `Tayyor · ${ntf.assignees.length} xodim`;
        if (ntfSheetState?.key === "teglar") return `Tayyor · ${ntf.tagIds.size} teg`;
        return "Tayyor";
      }
      function ntfSyncSheet() {
        const body = document.getElementById("ntf-sheet-body");
        if (body && ntfSheetState) body.innerHTML = ntfSheetBodyHtml();
        const n = document.getElementById("ntf-sheet-n");
        if (n) n.textContent = ntfSheetCount();
        const d = document.querySelector(".ntf-sheet-foot .ntf-btn");
        if (d) d.textContent = ntfSheetDone();
      }

      const NTF_SEARCH_PH = {
        kim: "Ism yoki lavozim",
        loyiha: "Loyiha nomi",
        teglar: "Teg nomi",
      };
      // Qidiruv uchta ro'yxatda ham bor: xodim, loyiha, teg —
      // ularning tanlanishi bir xil ko'rinishda bo'lishi kerak.
      function ntfHasSearch(key) {
        return !!NTF_SEARCH_PH[key];
      }
      function ntfSearchHtml() {
        const ph = NTF_SEARCH_PH[ntfSheetState?.key] || "Qidirish";
        return `<div class="ntf-search">${ntfSvg("search")}<input id="ntf-q" placeholder="${escHtml(ph)}" autocomplete="off" oninput="ntfFilter(this.value)"/></div>`;
      }
      // Lavozim filtrlari bazadagi haqiqiy lavozimlardan tuziladi —
      // qo'lda yozilgan ro'yxat eskirib qolardi.
      function ntfRoles() {
        const bor = [];
        ntfUsers.forEach((u) => {
          const j = (u.job_title || "").trim();
          if (j && !bor.includes(j)) bor.push(j);
        });
        return bor.sort((a, b) => a.localeCompare(b, "uz"));
      }
      function ntfFiltersHtml() {
        if (ntfSheetState?.key !== "kim") return "";
        const roles = ntfRoles();
        if (!roles.length) return "";
        const cur = ntfSheetState?.role || "";
        return `<div class="ntf-filters">
          <button type="button" class="ntf-pill${cur ? "" : " on"}" onclick="ntfSetRole('')">Hammasi</button>
          ${roles.map((r) => `<button type="button" class="ntf-pill${cur === r ? " on" : ""}" onclick="ntfSetRole('${escArg(r)}')">${escHtml(r)}</button>`).join("")}
        </div>`;
      }
      function ntfSetRole(r) {
        if (!ntfSheetState) return;
        ntfSheetState.role = ntfSheetState.role === r ? "" : r;
        const host = document.querySelector(".ntf-filters")?.parentElement;
        if (host) {
          const f = host.querySelector(".ntf-filters");
          if (f) f.outerHTML = ntfFiltersHtml();
        }
        ntfSyncSheet();
      }
      function ntfFilter(q) {
        if (!ntfSheetState) return;
        ntfSheetState.q = q || "";
        ntfSyncSheet();
      }
      function ntfPeopleHtml() {
        const q = (ntfSheetState?.q || "").trim().toLowerCase();
        const role = ntfSheetState?.role || "";
        const list = ntfUsers.filter((u) => {
          if (role && (u.job_title || "") !== role) return false;
          if (!q) return true;
          return `${u.first_name || ""} ${u.last_name || ""} ${u.username} ${u.job_title || ""}`.toLowerCase().includes(q);
        });
        if (!list.length) return `<div class="ntf-empty">${ntfUsers.length ? "Xodim topilmadi" : "Yuklanmoqda…"}</div>`;
        return list
          .map((u) => {
            const on = ntf.assignees.includes(u.username);
            const n = ntfActiveCount(u.username);
            return `<button type="button" class="ntf-prow" onclick="ntfToggleAsg('${escArg(u.username)}')">
              ${ntfAv(u)}
              <span class="ntf-prow-txt">
                <span class="ntf-prow-n">${escHtml(ntfShort(u))}</span>
                <span class="ntf-prow-s">
                  ${escHtml(ntfJob(u))}<i>·</i><b class="${n >= 5 ? "ntf-busy" : ""}">${n} ta faol vazifa</b>
                </span>
              </span>
              <span class="ntf-cb${on ? " on" : ""}">${on ? "✓" : ""}</span>
            </button>`;
          })
          .join("");
      }
      function ntfOptRow(on, title, sub, onclick, dot) {
        return `<button type="button" class="ntf-prow" onclick="${onclick}">
          ${dot ? `<span class="ntf-dot" style="background:${dot};width:12px;height:12px;border-radius:4px"></span>` : ""}
          <span class="ntf-prow-txt">
            <span class="ntf-prow-n">${escHtml(title)}</span>
            ${sub ? `<span class="ntf-prow-s">${escHtml(sub)}</span>` : ""}
          </span>
          <span class="ntf-cb${on ? " on" : ""}">${on ? "✓" : ""}</span>
        </button>`;
      }
      function ntfSheetBodyHtml() {
        const key = ntfSheetState?.key;
        if (key === "kim") return ntfPeopleHtml();
        if (key === "loyiha") return ntfProjectsHtml();
        if (key === "teglar") return ntfTagsHtml();
        if (key === "boshlanishi") {
          return (
            ntfOptRow(ntf.startMode === "now", "Hozir boshlanadi", "Vazifa darhol xodimning ro'yxatiga tushadi", "ntfPickStart('now')") +
            ntfOptRow(ntf.startMode === "queue", "Navbatga qo'yish", "Hozircha ro'yxatda turadi", "ntfPickStart('queue')")
          );
        }
        if (key === "soat") {
          const hozir = ntf.dueTime || "";
          let html = ntfOptRow(!hozir, "Soatsiz", "Muddat faqat kun bo'yicha", "ntfPickTime('')");
          html += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px">`;
          for (let h = 8; h <= 21; h++) {
            for (const m of ["00", "15", "30", "45"]) {
              const v = `${String(h).padStart(2, "0")}:${m}`;
              html += `<button type="button" class="ntf-qbtn${hozir === v ? " on" : ""}" style="justify-content:center" onclick="ntfPickTime('${v}')">${v}</button>`;
            }

          return html + `</div>`;
        }
        if (key === "sana") return ntfCalHtml();
        return "";
      }
      // Loyiha: rangli katak + nom + mas'ul va vazifalar soni.
      // Xodim qatori bilan bir xil tuzilish (.ntf-prow).
      function ntfProjectTaskCount(slug) {
        return tasksList.filter(
          (t) => t.projectSlug === slug && !["done", "failed", "cancelled"].includes(t.status),
        ).length;
      }
      function ntfProjectsHtml() {
        const q = (ntfSheetState?.q || "").trim().toLowerCase();
        const mos = projects.filter((p) => !q || String(p.label || "").toLowerCase().includes(q));
        const umumiy = q
          ? ""
          : ntfPickRow({
              on: !ntf.projectSlug,
              tile: `<span class="ntf-tile" style="background:var(--chip2);color:var(--v3-t2)">${ntfSvg("folder")}</span>`,
              name: "Umumiy",
              sub: "Hech bir loyihaga tegishli emas",

        if (!mos.length && q) return `<div class="ntf-empty">Loyiha topilmadi</div>`;
        return (
          umumiy +
          mos
            .map((p) => {

              return ntfPickRow({

                name: p.label,
                // Mas'ul belgilanmagan loyihada "—" yozib o'tirishdan

                sub: `${mas === "—" ? "" : `${escHtml(mas)}<i>·</i>`}<b>${n} ta vazifa</b>`,

                onclick: `ntfPickProject('${escArg(v)}')`,

      }
      // Teg: o'z rangidagi katak + nom + nechta vazifada ishlatilgani
      function ntfTagUseCount(id) {
        return tasksList.filter((t) => (t.tags || []).some((g) => g.id === id)).length;
      }
      function ntfTagsHtml() {
        const q = (ntfSheetState?.q || "").trim().toLowerCase();
        const mos = tagsList.filter((t) => !q || String(t.name || "").toLowerCase().includes(q));
        const list = mos
          .map((t) => {

            return ntfPickRow({
              on: ntf.tagIds.has(t.id),
              tile: `<span class="ntf-tile" style="background:${c.bg};color:${c.ink}">${escHtml(String(t.name || "?").slice(0, 1).toUpperCase())}</span>`,

              sub: `${ntfTagUseCount(t.id)} ta vazifada`,

        return `${list || `<div class="ntf-empty">${tagsList.length ? "Teg topilmadi" : "Teg yo'q"}</div>`}
          <div class="ntf-newrow">
            <input id="ntf-newtag" placeholder="Yangi teg nomi" autocomplete="off"/>
            <button type="button" class="ntf-btn ghost" onclick="ntfCreateTag()">Qo'shish</button>
          </div>`;
      }
      function ntfPickRow(o) {
        return `<button type="button" class="ntf-prow" onclick="${o.onclick}">
          ${o.tile}
          <span class="ntf-prow-txt">
            <span class="ntf-prow-n">${escHtml(o.name)}</span>
            ${o.sub ? `<span class="ntf-prow-s">${o.subRaw ? o.sub : escHtml(o.sub)}</span>` : ""}
          </span>
          <span class="ntf-cb${o.on ? " on" : ""}">${o.on ? "✓" : ""}</span>
        </button>`;
      }
      function ntfPickProject(v) {
        ntf.projectSlug = v;
        ntf.touched = true;
        ntfHaptic();
        ntfClosePicker();
      }
      function ntfPickStart(v) {
        ntf.startMode = v;
        ntf.touched = true;
        ntfHaptic();
        ntfClosePicker();
      }
      function ntfPickTime(v) {
        ntf.dueTime = v;
        ntf.touched = true;
        ntfHaptic();
        ntfClosePicker();
      }
      async function ntfCreateTag() {
        const input = document.getElementById("ntf-newtag");
        const name = input?.value.trim();
        if (!name) return;
        try {
          const res = await apiFetch("/api/tags", { method: "POST", body: JSON.stringify({ name }) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok && res.status !== 409) throw new Error(data.error || "Xato");
          if (data.tag) {
            if (!tagsList.some((g) => g.id === data.tag.id)) tagsList.push(data.tag);
            ntf.tagIds.add(data.tag.id);
            if (input) input.value = "";
            ntfSyncSheet();
            ntfRender();
          }
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }

      // Oraliq kalendari. Ko'rinish belgilangan sinflari belgilash
      // sahifasi bilan umumiy (.ntv3-day…) — ikkala kalendar bir xil
      // bo'lishi kerak, nusxa ko'paytirishdan ma'no yo'q.
      function ntfCalHtml() {
        const c = ntfSheetState.cal;
        const bugun = isoOf(todayDate());
        const oxiri = c.end || c.start;
        const days = buildCalGridCells(c.y, c.m)
          .map((cell) => {
            // O'tgan kunlar tanlanmaydi (TZ 6.4)
            if (!cell.iso || cell.iso < bugun) {
              return `<button type="button" class="ntv3-day" disabled>${cell.dNum}</button>`;
            }
            const cls = ["ntv3-day"];
            if (cell.iso === bugun) cls.push("d-today");
            if (cell.iso === c.start || (oxiri && cell.iso === oxiri)) cls.push("d-sel");
            if (c.start && cell.iso === c.start) cls.push("d-s");
            if (oxiri && cell.iso === oxiri) cls.push("d-e");
            if (c.start && c.end && cell.iso > c.start && cell.iso < c.end) cls.push("d-in");
            return `<button type="button" class="${cls.join(" ")}" onclick="ntfCalPick('${cell.iso}')">${cell.dNum}</button>`;
          })
          .join("");
        const izoh = !c.start
          ? "Boshlanish kunini tanlang"
          : !c.end
            ? `${fmtDay(parseISO(c.start))} dan — endi tugash kunini tanlang`
            : `${fmtDateRangeField(c.start, c.end)} · ${rangeDayCount(c.start, c.end)} kun`;
        return `<div class="ntv3-cal-hdr">
            <button type="button" class="ntv3-cal-nav" onclick="ntfCalNav(-1)">${ICON.chevronLeft}</button>
            <div class="ntv3-cal-m">${MONTHS[c.m]} ${c.y}</div>
            <button type="button" class="ntv3-cal-nav" onclick="ntfCalNav(1)">${ICON.chevronRight}</button>
          </div>
          <div class="ntv3-wd">${WD.map((w) => `<div>${w}</div>`).join("")}</div>
          <div class="ntv3-days">${days}</div>
          <div class="ntv3-sum">${escHtml(izoh)}</div>`;
      }
      function ntfCalNav(d) {
        const c = ntfSheetState?.cal;
        if (!c) return;
        c.m += d;
        if (c.m < 0) {
          c.m = 11;
          c.y--;
        } else if (c.m > 11) {
          c.m = 0;
          c.y++;
        }
        ntfSyncSheet();
      }
      function ntfCalPick(iso) {
        const c = ntfSheetState?.cal;
        if (!c) return;
        if (!c.start || c.end) {
          c.start = iso;
          c.end = "";
        } else if (iso < c.start) {
          c.start = iso;
        } else {
          c.end = iso;
        }
        ntfHaptic();
        ntfSyncSheet();
      }

      // ── Tekshirish va yuborish (TZ 07) ───────────────────────────
      function ntfSubmit() {
        if (!ntf || ntf.saving) return;
        const yoq = ntfMissing();
        if (yoq.length) {
          // Tugma o'chirilmagan — bosilganda birinchi bo'sh maydonga
          // olib boradi va uni 2 soniya ajratib ko'rsatadi.
          const birinchi = yoq[0];
          if (birinchi.key === "title") {
            const el = document.getElementById("ntf-title");
            el?.scrollIntoView({ block: "center", behavior: "smooth" });
            el?.focus();
            ntfFlash("ntf-maincard");
          } else {
            const card = document.getElementById(birinchi.key === "asg" ? "ntf-card-asg" : "ntf-card-due");
            card?.scrollIntoView({ block: "center", behavior: "smooth" });
            ntfFlash(birinchi.key === "asg" ? "ntf-card-asg" : "ntf-card-due");
          }
          tg()?.HapticFeedback?.notificationOccurred?.("error");
          return;
        }
        ntfSave();
      }
      function ntfFlash(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add("shake");
        setTimeout(() => el.classList.remove("shake"), 2000);
      }
      async function ntfSave() {
        const tahrir = ntf.mode === "edit";
        ntf.saving = true;
        ntfRender();
        const body = {
          title: ntf.title.trim(),
          projectSlug: ntf.projectSlug || (tahrir ? "" : undefined),
          priority: ntf.priority,
          tagIds: [...ntf.tagIds],
          assigneeUsernames: ntf.assignees,
          startDate: ntf.startDate || "",
          dueDate: ntf.dueDate,
          dueTime: ntf.dueTime || "",
        };
        if (tahrir) body.description = ntf.desc.trim();
        else if (ntf.desc.trim()) body.description = ntf.desc.trim();
        if (!tahrir) {
          // Kanban ustunidan ochilgan bo'lsa — o'sha ustun holati.
          body.status = ntf.startMode === "queue" ? "backlog" : ntf.status || "todo";
          body.notifyTelegram = ntf.notify;
          if (body.status === "backlog") {
            delete body.startDate;
            delete body.dueDate;
          }
        }
        try {
          const res = await apiFetch(tahrir ? `/api/tasks/${ntf.id}` : "/api/tasks", {
            method: tahrir ? "PATCH" : "POST",
            body: JSON.stringify(body),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Xato");
          const yangiId = data.task?.id || ntf.id;
          if (!tahrir) ntfClearDraft();
          ntfClose();
          if (tahrir) {
            showToast("✅ Saqlandi");
          } else {
            const nota = describeNotifyResult(data.notify);
            showToast("✅ Vazifa yaratildi" + nota, nota.includes("⚠") ? 4000 : 2200);
          }
          await loadTasks();
          refreshAllViews();
          if (tahrir) refreshTaskDetailIfOpen(yangiId);
          else if (yangiId) openTaskActions(yangiId);
        } catch (e) {
          // Sahifada qolinadi, ma'lumot yo'qolmaydi (TZ 07).
          if (ntf) {
            ntf.saving = false;
            ntfRender();
          }
          showToast("⚠ Saqlanmadi: " + e.message, 4000);
        }
      }

      // POST/PATCH /api/tasks javobidagi `notify` ({attempted, ok, reason})
      // obyektini o'qib beriladigan matnga aylantiradi — admin xabar
      // borgan-bormaganini darhol ko'radi (avval sukut bo'yicha jim
      // ketardi: xodim botni ochmagan bo'lsa ham "yaratildi" deb
      // ko'rsatilardi, muammo aniqlanmasdi).
      function describeNotifyResult(n) {
        if (!n) return "";
        if (n.ok) return " · xodimga Telegram xabari yuborildi";
        if (n.reason === "no_chat_id") return " · ⚠ xodim botni hali ochmagan, xabar yuborilmadi";
        if (n.reason === "no_assignee" || n.reason === "not_applicable" || n.reason === "no_bot_token") return "";
        return " · ⚠ Telegram xabari yuborilmadi";
      }
      // Sana maydonida oraliq tanlanganda xato yozuvini o'chiradi
      // (kalendar `commitDpRange` ichidan chaqiradi).
      function ntClearErr(fieldId) {
        const el = document.getElementById(`${fieldId}-err`);
        if (el) {
          el.textContent = "";
          el.classList.remove("on");
        }
        (document.getElementById(`${fieldId}-field`) || document.getElementById(fieldId))?.classList.remove("invalid");
      }

      // ═══ KALENDAR ═══════════════════════════════════════════════════
      // Jamoaning umumiy kalendari: Kun / Hafta / Oy. Hamma hammaning
      // rejasini ko'radi, tahrirlashni esa faqat yaratgan odam va admin
      // (tekshiruv backendda ham bor — bu yerda faqat tugmalar).
      //
      // VAQT. Brauzer qaysi mintaqada turganidan qat'i nazar hamma
      // hisob Toshkent (UTC+5) bo'yicha yuritiladi — backend ham
      // shunday. Aks holda chet eldan kirilganda bloklar boshqa soatga
      // tushib qolardi.
      const KAL_TZ = 5 * 60 * 60 * 1000;
      const KAL_WD = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"];
      const KAL_STEP = 15; // tortib ko'chirish qadami, daqiqa
      const KAL_REMIND = [
        { v: "", t: "Yo'q" }, { v: "15", t: "15 daqiqa oldin" }, { v: "30", t: "30 daqiqa oldin" },
        { v: "60", t: "1 soat oldin" }, { v: "1440", t: "1 kun oldin" },
      ];
      const KAL_REPEAT = [
        { v: "", t: "Takrorlanmaydi" },
        { v: "FREQ=DAILY", t: "Har kuni" },
        { v: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR", t: "Har ish kuni (Du–Ju)" },
        { v: "FREQ=WEEKLY", t: "Har hafta" },
        { v: "FREQ=MONTHLY", t: "Har oy" },
      ];

      // Matn chegaralari — backend bilan bir xil. Oshib ketgan matn
      // JIMGINA kesilmaydi: hisoblagich qizaradi va saqlashda aniq
      // xato chiqadi, shunda yozilgan narsa yo'qolib ketmaydi.
      const KAL_LIMITS = { title: 120, place: 200, note: 400 };
      let kal = null;
      let kalNowTimer = null;

      // ── Vaqt yordamchilari (hammasi Toshkent bo'yicha) ─────────────
      // `kalLoc` qaytargan Date'ning UTC maydonlari Toshkent vaqtini
      // ko'rsatadi — shuning uchun quyida hamma joyda getUTC*.
      function kalLoc(x) { return new Date(new Date(x).getTime() + KAL_TZ); }
      function kalDateStr(x) { return kalLoc(x).toISOString().slice(0, 10); }
      function kalMinutes(x) { const d = kalLoc(x); return d.getUTCHours() * 60 + d.getUTCMinutes(); }
      function kalHHMM(x) {
        const d = kalLoc(x);
        return `${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
      }
      // Toshkentdagi sana + daqiqa → UTC ISO (backend shuni kutadi)
      function kalToIso(dateStr, minutes) {
        const [y, m, d] = dateStr.split("-").map(Number);
        return new Date(Date.UTC(y, m - 1, d, 0, minutes) - KAL_TZ).toISOString();
      }
      function kalAddDays(dateStr, n) {
        const [y, m, d] = dateStr.split("-").map(Number);
        const t = new Date(Date.UTC(y, m - 1, d));
        t.setUTCDate(t.getUTCDate() + n);
        return t.toISOString().slice(0, 10);
      }
      function kalWeekday(dateStr) {
        const [y, m, d] = dateStr.split("-").map(Number);
        return (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; // 0 = dushanba
      }
      function kalWeekStart(dateStr) { return kalAddDays(dateStr, -kalWeekday(dateStr)); }
      function kalToday() { return kalDateStr(Date.now()); }
      function kalNowMinutes() { return kalMinutes(Date.now()); }
      function kalDayLabel(dateStr) {
        const [y, m, d] = dateStr.split("-").map(Number);
        return `${KAL_WD[kalWeekday(dateStr)]}, ${d}-${MONTHS[m - 1].toLowerCase()}`;
      }
      function kalMonthLabel(dateStr) {
        const [y, m] = dateStr.split("-").map(Number);
        return `${MONTHS[m - 1]} <i>${y}</i>`;
      }

      // Rang: blok foni — rangning och varianti, matn — to'q varianti.
      // Shunda har xodim o'z rangida, lekin matn har doim o'qiladi.
      function kalRgb(hex) {
        const h = String(hex || "#2f7ab9").replace("#", "");
        const n = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
        return [parseInt(n.slice(0, 2), 16) || 0, parseInt(n.slice(2, 4), 16) || 0, parseInt(n.slice(4, 6), 16) || 0];
      }
      function kalTint(hex, a) { const [r, g, b] = kalRgb(hex); return `rgba(${r},${g},${b},${a})`; }
      function kalDark(hex) {
        const [r, g, b] = kalRgb(hex);
        const f = 0.72; // qora bilan aralashtirish — kontrast uchun
        return `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})`;
      }
      function kalEvColor(ev) { return ev.is_team ? "#475569" : (ev.owner && ev.owner.color) || "#2f7ab9"; }
      function kalInit(name) {
        return String(name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
      }

      // ── Ochilishi ─────────────────────────────────────────────────
      function kalReadUrl() {
        const q = new URLSearchParams(location.search);
        const v = q.get("view");
        const d = q.get("d");
        return {
          view: ["kun", "hafta", "oy"].includes(v) ? v : null,
          anchor: /^\d{4}-\d{2}-\d{2}$/.test(d || "") ? d : null,
        };
      }
      function kalWriteUrl() {
        if (!kal) return;
        const url = `/kalendar?view=${kal.view}&d=${kal.anchor}`;
        if (location.pathname + location.search !== url) history.replaceState({ kal: 1 }, "", url);
      }
      async function openCalendar(opts = {}) {
        const mobil = window.matchMedia("(max-width: 859px)").matches;
        const url = kalReadUrl();
        if (!kal) {
          let hidden = [];
          try { hidden = JSON.parse(localStorage.getItem("kal-hidden") || "[]"); } catch (e) {}
          kal = {
            view: opts.view || url.view || localStorage.getItem("kal-view") || (mobil ? "kun" : "hafta"),
            anchor: opts.anchor || url.anchor || kalToday(),
            items: [], from: null, to: null,
            hidden: new Set(hidden),
            users: [], projects: [],
            loading: true, scrolled: false, search: "", pop: null,
          };
        } else {
          if (opts.view) kal.view = opts.view;
          if (opts.anchor) kal.anchor = opts.anchor;
          kal.scrolled = false;
        }
        // Telefonda Hafta ko'rinishi juda tor — TZ bo'yicha default Kun.
        if (mobil && kal.view === "hafta" && !opts.view && !url.view) kal.view = "kun";
        kalWriteUrl();
        kalRender();
        await kalLoadUsers();
        await kalLoad();
      }
      function closeCalendar() { showTab("today"); }

      async function kalLoadUsers() {
        if (kal.users.length) return;
        try {
          const [u, p] = await Promise.all([
            apiFetch("/api/users/directory").then((r) => r.json()).catch(() => ({ users: [] })),
            apiFetch("/api/projects").then((r) => r.json()).catch(() => ({ projects: [] })),
          ]);
          kal.users = (u.users || []).filter((x) => x.isActive !== false);
          kal.projects = (p.projects || []).map((x) => ({ id: x.id, label: x.label }));
        } catch (e) {
          kal.users = [];
        }
      }

      // Ko'rinayotgan davr + ikki tomonga bir hafta zaxira: ‹ › bosilganda
      // kutish bo'lmasin (TZ 13-bo'lim).
      function kalRange() {
        if (kal.view === "kun") return [kalAddDays(kal.anchor, -3), kalAddDays(kal.anchor, 4)];
        if (kal.view === "hafta") {
          const s = kalWeekStart(kal.anchor);
          return [kalAddDays(s, -7), kalAddDays(s, 14)];
        }
        const [y, m] = kal.anchor.split("-").map(Number);
        const birinchi = `${kal.anchor.slice(0, 7)}-01`;
        const grid = kalWeekStart(birinchi);
        return [kalAddDays(grid, -7), kalAddDays(grid, 49)];
      }
      // Server xato qaytarsa — matnini ochib beradi. Admin uchun
      // `detail` ham keladi (aniq sabab), oddiy xodimga faqat qisqa
      // xabar.
      async function kalErrText(res) {
        const d = await res.json().catch(() => ({}));
        const asos = d.error || "Xato";
        return d.detail ? `${asos} — ${d.detail}` : asos;
      }
      async function kalLoad() {
        const [from, to] = kalRange();
        kal.loading = true;
        try {
          const res = await apiFetch(
            `/api/events?from=${encodeURIComponent(kalToIso(from, 0))}&to=${encodeURIComponent(kalToIso(to, 0))}`,
          );
          if (!res.ok) throw new Error(await kalErrText(res));
          const d = await res.json();
          kal.items = d.items || [];
          kal.from = from;
          kal.to = to;
          kal.error = null;
        } catch (e) {
          kal.error = e.message;
        }
        kal.loading = false;
        kalRender();
      }
      // Davr chetiga chiqdikmi — chiqqan bo'lsa qayta yuklanadi.
      function kalNeedsLoad() {
        if (!kal.from) return true;
        const [from, to] = kalRange();
        return from < kal.from || to > kal.to;
      }

      // ── Ko'rinish boshqaruvi ──────────────────────────────────────
      function kalSetView(v) {
        kal.view = v;
        localStorage.setItem("kal-view", v);
        kal.scrolled = false;
        kalWriteUrl();
        kalRender();
        if (kalNeedsLoad()) kalLoad();
      }
      function kalStep(dir) {
        if (kal.view === "kun") kal.anchor = kalAddDays(kal.anchor, dir);
        else if (kal.view === "hafta") kal.anchor = kalAddDays(kal.anchor, dir * 7);
        else {
          const [y, m] = kal.anchor.split("-").map(Number);
          const t = new Date(Date.UTC(y, m - 1 + dir, 1));
          kal.anchor = t.toISOString().slice(0, 10);
        }
        kalWriteUrl();
        kalRender();
        if (kalNeedsLoad()) kalLoad();
      }
      function kalGoToday() { kalGoDate(kalToday()); }
      function kalGoDate(dateStr, view) {
        kal.anchor = dateStr;
        if (view) { kal.view = view; localStorage.setItem("kal-view", view); }
        kal.scrolled = false;
        kalWriteUrl();
        kalRender();
        if (kalNeedsLoad()) kalLoad();
      }
      function kalToggleUser(id) {
        const key = String(id);
        if (kal.hidden.has(key)) kal.hidden.delete(key);
        else kal.hidden.add(key);
        localStorage.setItem("kal-hidden", JSON.stringify([...kal.hidden]));
        kalRender();
      }
      function kalClearFilter() {
        kal.hidden.clear();
        localStorage.setItem("kal-hidden", "[]");
        kalRender();
      }
      // Reja ko'rinadimi: egasi yoki ishtirokchisi yashirilmagan bo'lsa.
      function kalVisible(ev) {
        if (!kal.hidden.size) return true;
        if (ev.is_team && !kal.hidden.has("team")) return true;
        const ids = [ev.owner && ev.owner.id, ...(ev.participants || []).map((p) => p.id)].filter(Boolean);
        return ids.some((id) => !kal.hidden.has(String(id)));
      }
      function kalDayItems(dateStr) {
        return kal.items
          .filter((ev) => kalVisible(ev) && kalDateStr(ev.start) <= dateStr && kalDateStr(new Date(new Date(ev.end).getTime() - 1)) >= dateStr)
          .sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
      }

      // ── Xodim ma'lumoti ───────────────────────────────────────────
      function kalUserName(u) {
        if (!u) return "";
        return u.name || (u.first_name ? `${u.first_name} ${u.last_name || ""}`.trim() : u.username || "");
      }
      function kalUserShort(u) {
        const n = kalUserName(u).split(/\s+/);
        return n.length > 1 ? `${n[0]} ${n[1][0]}.` : n[0] || "";
      }
      function kalUserColor(u) {
        if (!u) return "#2f7ab9";
        return u.color || personColor(u.username || String(u.id));
      }
      function kalUser(id) { return kal.users.find((u) => String(u.id) === String(id)); }

      // ── Umumiy chizish ────────────────────────────────────────────
      function kalRender() {
        const host = document.getElementById("screen-kalendar");
        if (!host || !kal) return;
        const mobil = window.matchMedia("(max-width: 859px)").matches;
        document.body.classList.toggle("kal-day", kal.view === "kun");
        // To'r har safar qaytadan quriladi, shuning uchun skroll
        // joyini eslab qolamiz: filtrni bosganda yoki ma'lumot
        // yangilanganda kalendar tepaga sakrab ketmasin.
        const eski = document.getElementById("kal-body");
        const eskiScroll = eski ? eski.scrollTop : null;

        host.innerHTML = `
          <div class="kal-wrap">
            ${mobil ? "" : `<div class="kal-side">${kalSideHtml()}</div>`}
            <div class="kal-main">
              ${kalTopHtml(mobil)}
              ${mobil ? kalStripHtml() + kalChipsHtml() : ""}
              ${kal.view === "oy" ? kalMonthHtml() : kalGridHtml()}
            </div>
          </div>
          ${mobil ? `<button class="kal-fab" onclick="kalOpenForm({})" aria-label="Yangi reja">+</button>` : ""}`;

        if (kal.scrolled && eskiScroll != null) {
          const yangi = document.getElementById("kal-body");
          if (yangi) yangi.scrollTop = eskiScroll;
        }
        kalPaintNow();
        kalScrollToNow();
        kalBindDrag();
        if (kalNowTimer) clearInterval(kalNowTimer);
        // Hozirgi vaqt chizig'i har daqiqada suriladi (TZ 4-bo'lim).
        kalNowTimer = setInterval(() => {
          if (document.getElementById("screen-kalendar")?.classList.contains("active")) kalPaintNow();
        }, 60000);
      }

      function kalTopHtml(mobil) {
        const sarlavha = kal.view === "kun" ? kalDayLabel(kal.anchor) : kalMonthLabel(kal.anchor);
        return `<div class="kal-top">
            <div class="kal-title">${sarlavha}</div>
            ${mobil ? "" : '<div class="kal-grow"></div>'}
            <div class="kal-seg">
              ${["kun", "hafta", "oy"].map((v) => `<button class="${kal.view === v ? "on" : ""}" onclick="kalSetView('${v}')">${v === "kun" ? "Kun" : v === "hafta" ? "Hafta" : "Oy"}</button>`).join("")}
            </div>
            <div class="kal-nav">
              <button class="kal-nbtn" onclick="kalStep(-1)" aria-label="Oldingi">‹</button>
              <button class="kal-nbtn wide" onclick="kalGoToday()">Bugun</button>
              <button class="kal-nbtn" onclick="kalStep(1)" aria-label="Keyingi">›</button>
            </div>
            <div class="kal-srch">
              <input id="kal-search" placeholder="Qidirish" oninput="kalSearch(this.value)" onfocus="kalSearch(this.value)" />
              <div id="kal-results"></div>
            </div>
          </div>`;
      }

      // ── Chap panel: kichik kalendar + xodim filtri ────────────────
      function kalSideHtml() {
        const [y, m] = kal.anchor.split("-").map(Number);
        const birinchi = `${kal.anchor.slice(0, 7)}-01`;
        const grid = kalWeekStart(birinchi);
        const [ichFrom, ichTo] = kal.view === "oy"
          ? [birinchi, kalAddDays(`${kal.anchor.slice(0, 7)}-01`, 31)]
          : kal.view === "hafta"
            ? [kalWeekStart(kal.anchor), kalAddDays(kalWeekStart(kal.anchor), 6)]
            : [kal.anchor, kal.anchor];
        const bugun = kalToday();
        let kunlar = "";
        for (let i = 0; i < 42; i++) {
          const d = kalAddDays(grid, i);
          const tashqari = d.slice(0, 7) !== kal.anchor.slice(0, 7);
          const ich = d >= ichFrom && d <= ichTo;
          kunlar += `<button class="kal-mini-d${tashqari ? " out" : ""}${ich ? " in" : ""}${d === bugun ? " today" : ""}" onclick="kalGoDate('${d}')">${Number(d.slice(8, 10))}</button>`;
        }
        const xodimlar = kal.users
          .map((u) => {
            const id = String(u.id);
            const on = !kal.hidden.has(id);
            const c = kalUserColor(u);
            return `<div class="kal-flt-row${on ? " on" : ""}" onclick="kalToggleUser('${escArg(id)}')">
                <span class="kal-flt-box" style="${on ? `background:${c};` : ""}">${on ? "✓" : ""}</span>
                <span class="kal-flt-nm">${escHtml(kalUserShort(u))}</span>
              </div>`;
          })
          .join("");
        const hammasiOn = !kal.hidden.has("team");
        return `<button class="kal-newbtn" onclick="kalOpenForm({})">+ Yangi reja</button>
          <div>
            <div class="kal-mini-top">
              <div class="kal-mini-t">${MONTHS[m - 1]} ${y}</div>
              <button class="kal-mini-b" onclick="kalStepMini(-1)">‹</button>
              <button class="kal-mini-b" onclick="kalStepMini(1)">›</button>
            </div>
            <div class="kal-mini">
              ${KAL_WD.map((w) => `<div class="kal-mini-wd">${w}</div>`).join("")}
              ${kunlar}
            </div>
          </div>
          <div>
            <div class="kal-flt-t">Kimning rejalari</div>
            <div class="kal-flt-row${hammasiOn ? " on" : ""}" onclick="kalToggleUser('team')">
              <span class="kal-flt-box" style="${hammasiOn ? "background:#475569;" : ""}">${hammasiOn ? "✓" : ""}</span>
              <span class="kal-flt-nm">Hammasi</span>
            </div>
            ${xodimlar}
            <div class="kal-flt-hint">Belgini olib tashlasangiz, o'sha xodimning rejalari yashiriladi.</div>
          </div>`;
      }
      function kalStepMini(dir) {
        const [y, m] = kal.anchor.split("-").map(Number);
        kal.anchor = new Date(Date.UTC(y, m - 1 + dir, 1)).toISOString().slice(0, 10);
        kalWriteUrl();
        kalRender();
        if (kalNeedsLoad()) kalLoad();
      }

      // ── Telefon: hafta tasmasi va filtr chiplari ──────────────────
      function kalStripHtml() {
        const s = kalWeekStart(kal.anchor);
        const bugun = kalToday();
        let out = "";
        for (let i = 0; i < 7; i++) {
          const d = kalAddDays(s, i);
          const ranglar = [...new Set(kalDayItems(d).map((ev) => kalEvColor(ev)))].slice(0, 3);
          out += `<button class="kal-sd${d === kal.anchor ? " on" : ""}" onclick="kalGoDate('${d}')">
              <div class="kal-sd-w">${KAL_WD[i]}</div>
              <div class="kal-sd-n">${Number(d.slice(8, 10))}${d === bugun && d !== kal.anchor ? "" : ""}</div>
              <div class="kal-sd-dots">${ranglar.map((c) => `<i style="background:${c}"></i>`).join("")}</div>
            </button>`;
        }
        return `<div class="kal-strip">${out}</div>`;
      }
      function kalChipsHtml() {
        const chip = (id, nom, rang) => {
          const on = !kal.hidden.has(id);
          return `<button class="kal-fchip${on ? " on" : ""}" onclick="kalToggleUser('${escArg(id)}')">
              <i style="background:${on ? rang : "var(--bd4)"}"></i>${escHtml(nom)}
            </button>`;
        };
        return `<div class="kal-fchips">
            ${chip("team", "Hammasi", "#475569")}
            ${kal.users.map((u) => chip(String(u.id), kalUserShort(u).split(" ")[0], kalUserColor(u))).join("")}
          </div>`;
      }

      // ── Hafta / Kun to'ri ─────────────────────────────────────────
      function kalDays() {
        if (kal.view === "kun") return [kal.anchor];
        const s = kalWeekStart(kal.anchor);
        return Array.from({ length: 7 }, (_, i) => kalAddDays(s, i));
      }
      function kalGridHtml() {
        const kunlar = kalDays();
        const cols = `var(--kal-gutter) repeat(${kunlar.length}, minmax(0, 1fr))`;
        const bugun = kalToday();

        const sarlavhalar = kunlar
          .map((d) => {
            const wd = kalWeekday(d);
            return `<div class="kal-hd${wd >= 5 ? " we" : ""}">
                <div class="kal-hd-w">${KAL_WD[wd]}</div>
                <div class="kal-hd-n${d === bugun ? " today" : ""}" onclick="kalGoDate('${d}','kun')">${Number(d.slice(8, 10))}</div>
              </div>`;
          })
          .join("");

        // «butun kun» qatori — butun kunlik va bir necha kunlik rejalar
        const adQatori = kunlar
          .map((d) => {
            const list = kalDayItems(d).filter((ev) => ev.all_day || kalDateStr(ev.start) !== kalDateStr(new Date(new Date(ev.end).getTime() - 1)));
            return `<div class="kal-allday-col">${list
              .map((ev) => {
                const c = kalEvColor(ev);
                return `<div class="kal-ad-ev" style="background:${kalTint(c, 0.14)};color:${kalDark(c)}" onclick="kalOpenDetail(event,'${escArg(ev.id)}','${escArg(ev.occurrence_start)}')">${escHtml(ev.title)}</div>`;
              })
              .join("")}</div>`;
          })
          .join("");

        const soatlar = Array.from({ length: 24 }, (_, h) => `<div class="kal-hour">${h ? `${h}:00` : ""}</div>`).join("");
        const ustunlar = kunlar
