          .map((d, i) => {
            const wd = kalWeekday(d);
            const slots = Array.from({ length: 24 }, () => `<div class="kal-slot"></div>`).join("");
            return `<div class="kal-col${wd >= 5 ? " we" : ""}" data-day="${d}" ondblclick="kalEmptyClick(event,'${d}')">
                ${slots}
                ${kalBlocksHtml(d)}
                <div class="kal-now" data-now="${d}"><div class="kal-now-lbl" style="display:none"></div></div>
              </div>`;
          })
          .join("");

        const bosh = !kal.loading && !kal.items.filter(kalVisible).length;
        return `<div class="kal-head" style="grid-template-columns:${cols}">
            <div class="kal-head-pad"></div>${sarlavhalar}
          </div>
          <div class="kal-allday" style="grid-template-columns:${cols}">
            <div class="kal-allday-lbl">butun kun</div>${adQatori}
          </div>
          <div class="kal-body" id="kal-body">
            <div class="kal-grid" style="grid-template-columns:${cols}">
              <div class="kal-hours">${soatlar}</div>
              ${ustunlar}
            </div>
            ${bosh ? kalEmptyHtml() : ""}
          </div>`;
      }

      function kalEmptyHtml() {
        if (kal.error) {
          return `<div class="kal-empty"><div style="color:var(--red)">⚠ ${escHtml(kal.error)}</div>
            <button class="kal-pop-btn" onclick="kalLoad()">Qayta urinish</button></div>`;
        }
        if (kal.hidden.size) {
          return `<div class="kal-empty"><div>Tanlangan xodimlarda reja yo'q</div>
            <button class="kal-pop-btn" onclick="kalClearFilter()">Filtrni tozalash</button></div>`;
        }
        const qaysi = kal.view === "kun" ? "Bu kunda" : kal.view === "hafta" ? "Bu haftada" : "Bu oyda";
        return `<div class="kal-empty"><div>${qaysi} reja yo'q</div>
          <button class="kal-pop-btn primary" onclick="kalOpenForm({})">Yangi reja</button></div>`;
      }

      // Bir vaqtga to'g'ri kelgan rejalar ustun kengligini teng bo'lishadi.
      // Kesishgan GURUH bo'yicha hisoblanadi: a–b va b–c kesishsa, lekin
      // a–c kesishmasa ham uchalasi bitta guruhda uchdan bir bo'ladi —
      // aks holda bloklar bir-birining ustiga chiqib ketardi.
      function kalLayout(list) {
        const sorted = [...list].sort((a, b) => a.s - b.s || b.e - a.e);
        const guruhlar = [];
        let joriy = [];
        let maxE = -1;
        sorted.forEach((x) => {
          if (joriy.length && x.s >= maxE) {
            guruhlar.push(joriy);
            joriy = [];
            maxE = -1;
          }
          joriy.push(x);
          maxE = Math.max(maxE, x.e);
        });
        if (joriy.length) guruhlar.push(joriy);

        const out = [];
        guruhlar.forEach((g) => {
          // Har biriga eng chap bo'sh ustun beriladi.
          const ustunlar = [];
          g.forEach((x) => {
            let i = ustunlar.findIndex((oxiri) => oxiri <= x.s);
            if (i === -1) { i = ustunlar.length; ustunlar.push(x.e); }
            else ustunlar[i] = x.e;
            x.col = i;
          });
          const n = ustunlar.length;
          g.forEach((x) => out.push({ ...x, col: x.col, cols: n }));
        });
        return out;
      }

      function kalBlocksHtml(dateStr) {
        const H = window.matchMedia("(max-width: 859px)").matches ? 60 : 56;
        const list = kalDayItems(dateStr)
          .filter((ev) => !ev.all_day && kalDateStr(ev.start) === kalDateStr(new Date(new Date(ev.end).getTime() - 1)))
          .map((ev) => {
            const s = kalMinutes(ev.start);
            const e = Math.max(s + 15, kalMinutes(ev.end) || 1440);
            return { ev, s, e };
          });
        const hozir = Date.now();
        return kalLayout(list)
          .map((x) => {
            const ev = x.ev;
            const c = kalEvColor(ev);
            const top = (x.s / 60) * H;
            const h = Math.max(22, ((x.e - x.s) / 60) * H - 2);
            const w = 100 / x.cols;
            const otgan = new Date(ev.end).getTime() < hozir;
            const av = h > 70 && (ev.participants || []).length
              ? `<div class="kal-ev-av">${ev.participants.slice(0, 4).map((p) => `<span style="background:${kalUserColor(p)}">${kalInit(p.name)}</span>`).join("")}</div>`
              : "";
            return `<div class="kal-ev${otgan ? " past" : ""}" data-id="${escHtml(ev.id)}" data-occ="${escHtml(ev.occurrence_start)}"
                data-edit="${ev.can_edit ? "1" : ""}"
                style="--kal-c:${c};background:${kalTint(c, 0.13)};color:${kalDark(c)};top:${top.toFixed(1)}px;height:${h.toFixed(1)}px;left:calc(${x.col * w}% + 2px);width:calc(${w}% - 4px)"
                onclick="kalOpenDetail(event,'${escArg(ev.id)}','${escArg(ev.occurrence_start)}')">
                <div class="kal-ev-t">${escHtml(ev.title)}</div>
                <div class="kal-ev-s">${kalHHMM(ev.start)}–${kalHHMM(ev.end)}</div>
                ${av}
                ${ev.can_edit ? '<div class="kal-ev-grip"></div>' : ""}
              </div>`;
          })
          .join("");
      }

      // ── Oy ko'rinishi ─────────────────────────────────────────────
      function kalMonthHtml() {
        const birinchi = `${kal.anchor.slice(0, 7)}-01`;
        const grid = kalWeekStart(birinchi);
        const bugun = kalToday();
        const mobil = window.matchMedia("(max-width: 859px)").matches;
        let qatorlar = "";
        for (let r = 0; r < 6; r++) {
          let kataklar = "";
          for (let c = 0; c < 7; c++) {
            const d = kalAddDays(grid, r * 7 + c);
            const tashqari = d.slice(0, 7) !== kal.anchor.slice(0, 7);
            const list = kalDayItems(d);
            const ichi = mobil
              ? `<div class="kal-m-dots">${[...new Set(list.map(kalEvColor))].slice(0, 6).map((x) => `<i style="background:${x}"></i>`).join("")}</div>`
              : list.slice(0, 3).map((ev) => {
                  const col = kalEvColor(ev);
                  return `<div class="kal-m-ev"${ev.is_team ? ' style="background:#eef1f5"' : ""} onclick="event.stopPropagation();kalOpenDetail(event,'${escArg(ev.id)}','${escArg(ev.occurrence_start)}')">
                      <i class="kal-m-dot" style="background:${col}"></i>
                      ${ev.all_day ? "" : `<span class="kal-m-time">${kalHHMM(ev.start)}</span>`}
                      <span class="kal-m-nm">${escHtml(ev.title)}</span>
                    </div>`;
                }).join("")
                + (list.length > 3 ? `<div class="kal-m-more" onclick="event.stopPropagation();kalGoDate('${d}','kun')">+${list.length - 3} yana</div>` : "");
            kataklar += `<div class="kal-m-cell${tashqari ? " out" : ""}${c >= 5 ? " we" : ""}"
                ondblclick="kalEmptyClick(event,'${d}')" onclick="${mobil ? `kalGoDate('${d}','kun')` : "void 0"}">
                <div class="kal-m-n${d === bugun ? " today" : ""}" onclick="event.stopPropagation();kalGoDate('${d}','kun')">${Number(d.slice(8, 10))}</div>
                ${ichi}
              </div>`;
          }
          qatorlar += `<div class="kal-m-row">${kataklar}</div>`;
        }
        return `<div class="kal-m">
            <div class="kal-m-wd">${KAL_WD.map((w) => `<div>${w}</div>`).join("")}</div>
            ${qatorlar}
          </div>`;
      }

      // ── Hozirgi vaqt chizig'i ─────────────────────────────────────
      function kalPaintNow() {
        const H = window.matchMedia("(max-width: 859px)").matches ? 60 : 56;
        const bugun = kalToday();
        const m = kalNowMinutes();
        document.querySelectorAll("#screen-kalendar .kal-now").forEach((el) => {
          const d = el.getAttribute("data-now");
          el.style.top = `${((m / 60) * H).toFixed(1)}px`;
          const shu = d === bugun;
          el.classList.toggle("on", shu);
          const lbl = el.querySelector(".kal-now-lbl");
          // Belgi faqat birinchi ustunda — har ustunda takrorlansa
          // chalkash bo'lardi.
          const birinchi = el.parentElement && el.parentElement.previousElementSibling
            && el.parentElement.previousElementSibling.classList.contains("kal-hours");
          if (lbl) {
            // Belgi faqat eng chapda — TZ 4-bo'lim. Har ustunda
            // takrorlansa chizma shovqinli bo'lib ketardi.
            lbl.style.display = birinchi ? "" : "none";
            lbl.textContent = kalHHMM(Date.now());
          }
        });
      }
      function kalScrollToNow() {
        if (kal.scrolled || kal.view === "oy") return;
        const body = document.getElementById("kal-body");
        if (!body) return;
        // O'lchamlar hali hisoblanmagan bo'lishi mumkin — keyingi
        // kadrda suramiz, aks holda scrollTop 0 bo'lib qoladi.
        if (!body.clientHeight || body.scrollHeight <= body.clientHeight) {
          requestAnimationFrame(() => kalScrollToNow());
          return;
        }
        const H = window.matchMedia("(max-width: 859px)").matches ? 60 : 56;
        const kunlar = kalDays();
        // Bugun ko'rinayotgan davrda bo'lsa — hozirgi vaqtdan bir soat
        // oldinga, bo'lmasa 8:00 ga (TZ 4-bo'lim).
        const bugunBor = kunlar.includes(kalToday());
        const m = bugunBor ? Math.max(0, kalNowMinutes() - 60) : 8 * 60;
        body.scrollTop = (m / 60) * H;
        // Yuklanish paytidagi chizishda ham suriladi, lekin "bajarildi"
        // deb belgilanmaydi: ma'lumot kelgach to'r qaytadan chiziladi
        // va skroll nolga qaytib qolardi.
        if (!kal.loading) kal.scrolled = true;
      }

      // ── Tafsilot kartasi ──────────────────────────────────────────
      function kalFind(id, occ) {
        return kal.items.find((e) => String(e.id) === String(id) && e.occurrence_start === occ)
          || kal.items.find((e) => String(e.id) === String(id));
      }
      function kalCloseDetail() {
        document.getElementById("kal-pop")?.remove();
        kal.pop = null;
        kalPopBack(false);
      }
      function kalPopBack(on) {
        const i = pageBackStack.indexOf(kalCloseDetail);
        if (on && i === -1) pageBackStack.push(kalCloseDetail);
        if (!on && i !== -1) pageBackStack.splice(i, 1);
        pageSyncBack();
      }
      function kalOpenDetail(e, id, occ) {
        if (e) e.stopPropagation();
        const ev = kalFind(id, occ);
        if (!ev) return;
        kalCloseDetail();
        kal.pop = { id, occ };

        const c = kalEvColor(ev);
        const vaqt = ev.all_day
          ? `${kalDayLabel(kalDateStr(ev.start))} · butun kun`
          : `${kalDayLabel(kalDateStr(ev.start))} · ${kalHHMM(ev.start)}–${kalHHMM(ev.end)}`;
        const takror = ev.recurring ? KAL_REPEAT.find((r) => r.t) && "Takrorlanadi" : "";
        const row = (k, v) => (v ? `<div class="kal-pop-row"><div class="kal-pop-k">${k}</div><div class="kal-pop-v">${v}</div></div>` : "");
        const men = (ev.participants || []).some((p) => String(p.id) === String(kalMeId()));
        const eslatma = ev.remind_before != null
          ? (KAL_REMIND.find((x) => x.v === String(ev.remind_before)) || { t: `${ev.remind_before} daqiqa oldin` }).t
          : "";

        const el = document.createElement("div");
        el.className = "kal-pop";
        el.id = "kal-pop";
        el.innerHTML = `
          <div class="kal-pop-top">
            <div class="kal-pop-bar" style="background:${c}"></div>
            <div class="kal-pop-t">${escHtml(ev.title)}</div>
            <button class="kal-pop-x" onclick="kalCloseDetail()">✕</button>
          </div>
          <div class="kal-pop-when">${vaqt}${takror ? ` · ${takror}` : ""}</div>
          <div class="kal-pop-rows">
            ${row("Joy", ev.place ? escHtml(ev.place) : "")}
            ${row("Kim uchun", `<div class="kal-pop-av">${(ev.participants || []).slice(0, 8).map((p) => `<span style="background:${kalUserColor(p)}" title="${escHtml(p.name)}">${kalInit(p.name)}</span>`).join("")}${ev.is_team ? ' <b style="font-weight:600;font-size:12.5px">Hammasi</b>' : ""}</div>`)}
            ${row("Loyiha", ev.project ? escHtml(ev.project.label) : "")}
            ${row("Izoh", ev.note ? escHtml(ev.note) : "")}
            ${row("Eslatma", eslatma ? `${eslatma} · Telegram` : "")}
            ${row("Egasi", ev.owner ? escHtml(kalUserShort(ev.owner)) : "")}
          </div>
          <div class="kal-pop-foot">
            ${ev.can_edit
              ? `<button class="kal-pop-btn primary" onclick="kalOpenForm({id:'${escArg(ev.id)}',occ:'${escArg(ev.occurrence_start)}'})">Tahrirlash</button>
                 <button class="kal-pop-btn" onclick="kalDuplicate('${escArg(ev.id)}','${escArg(ev.occurrence_start)}')">Nusxalash</button>
                 <div style="flex:1"></div>
                 <button class="kal-pop-btn danger" onclick="kalDelete('${escArg(ev.id)}','${escArg(ev.occurrence_start)}')">O'chirish</button>`
              : men
                ? `<div style="flex:1"></div><button class="kal-pop-btn" onclick="kalDecline('${escArg(ev.id)}')">Men qatnasha olmayman</button>`
                : `<div class="kal-f-note">Bu rejani faqat egasi yoki admin o'zgartiradi</div>`}
          </div>`;
        document.body.appendChild(el);

        // Joylashuv: bosilgan blok yonida, ekran chetiga sig'masa — ichkarida.
        const mobil = window.matchMedia("(max-width: 859px)").matches;
        if (!mobil) {
          const r = (e && e.currentTarget && e.currentTarget.getBoundingClientRect()) || { right: 200, top: 120, left: 200 };
          const w = 340, g = 10;
          let left = r.right + g;
          if (left + w > innerWidth - 8) left = Math.max(8, r.left - w - g);
          let top = r.top;
          const h = el.offsetHeight;
          if (top + h > innerHeight - 8) top = Math.max(8, innerHeight - h - 8);
          el.style.left = `${left}px`;
          el.style.top = `${top}px`;
        }
        kalPopBack(true);
        setTimeout(() => document.addEventListener("mousedown", kalPopOutside), 0);
      }
      function kalPopOutside(e) {
        const el = document.getElementById("kal-pop");
        if (!el) { document.removeEventListener("mousedown", kalPopOutside); return; }
        if (!el.contains(e.target)) {
          document.removeEventListener("mousedown", kalPopOutside);
          kalCloseDetail();
        }
      }
      function kalMeId() {
        const u = kal.users.find((x) => x.username === currentUser);
        return u ? u.id : null;
      }

      async function kalDecline(id) {
        try {
          const r = await apiFetch(`/api/events/${encodeURIComponent(id)}/decline`, { method: "POST" });
          if (!r.ok) throw new Error(await kalErrText(r));
          showToast("Rejadan chiqdingiz");
          kalCloseDetail();
          kalLoad();
        } catch (e) { showToast("⚠ " + e.message); }
      }
      function kalDuplicate(id, occ) {
        const ev = kalFind(id, occ);
        if (!ev) return;
        kalCloseDetail();
        kalOpenForm({ copyFrom: ev });
      }

      // Takrorlanuvchi rejada qaysi nusxaga tegilayotgani so'raladi.
      function kalAskScope(ev, amal) {
        if (!ev.recurring) return Promise.resolve("all");
        return new Promise((resolve) => {
          const ov = document.createElement("div");
          ov.className = "kal-ov";
          ov.innerHTML = `<div class="kal-form" style="width:420px">
              <div class="kal-f-hdr"><div class="kal-f-t">${amal}</div></div>
              <div class="kal-f-body">
                <div class="kal-f-note" style="font-size:13px">Bu takrorlanuvchi reja. Qaysi nusxalarga tegsin?</div>
                <button class="kal-pop-btn" data-s="one">Faqat shu reja</button>
                <button class="kal-pop-btn" data-s="following">Shu va keyingilari</button>
                <button class="kal-pop-btn" data-s="all">Hammasi</button>
              </div>
              <div class="kal-f-foot"><div style="flex:1"></div><button class="kal-pop-btn" data-s="">Bekor qilish</button></div>
            </div>`;
          ov.onclick = (e) => {
            const b = e.target.closest("[data-s]");
            if (!b && e.target !== ov) return;
            ov.remove();
            resolve(b ? b.getAttribute("data-s") : "");
          };
          document.body.appendChild(ov);
        });
      }

      async function kalDelete(id, occ) {
        const ev = kalFind(id, occ);
        if (!ev) return;
        const scope = await kalAskScope(ev, "Rejani o'chirish");
        if (!scope) return;
        if (!ev.recurring && !confirm(`«${ev.title}» o'chirilsinmi?`)) return;
        try {
          const q = `?scope=${scope}&occurrence=${encodeURIComponent(occ)}`;
          const r = await apiFetch(`/api/events/${encodeURIComponent(id)}${q}`, { method: "DELETE" });
          if (!r.ok) throw new Error(await kalErrText(r));
          showToast("Reja o'chirildi");
          kalCloseDetail();
          kalLoad();
        } catch (e) { showToast("⚠ " + e.message); }
      }

      // ── Yaratish / tahrirlash oynasi ──────────────────────────────
      function kalEmptyClick(e, dateStr) {
        // Bo'sh joyga bosish — shu vaqtdan boshlanadigan 1 soatlik reja.
        const col = e.currentTarget;
        const H = window.matchMedia("(max-width: 859px)").matches ? 60 : 56;
        let start = 9 * 60;
        if (col && col.classList.contains("kal-col")) {
          const y = e.clientY - col.getBoundingClientRect().top;
          start = Math.max(0, Math.round((y / H) * 60 / KAL_STEP) * KAL_STEP);
        }
        kalOpenForm({ date: dateStr, start, end: Math.min(24 * 60, start + 60) });
      }

      function kalOpenForm(opts) {
        kalCloseDetail();
        const me = kalMeId();
        let f;
        if (opts.id) {
          const ev = kalFind(opts.id, opts.occ);
          if (!ev) return;
          f = {
            id: ev.id, occ: ev.occurrence_start, recurring: ev.recurring,
            title: ev.title,
            date: kalDateStr(ev.start),
            start: kalMinutes(ev.start),
            end: kalMinutes(ev.end) || 1440,
            allDay: ev.all_day,
            rrule: ev.recurring ? (ev.rrule || "FREQ=WEEKLY") : "",
            participants: new Set((ev.participants || []).map((p) => String(p.id))),
            isTeam: ev.is_team,
            project: ev.project ? ev.project.id : "",
            remind: ev.remind_before == null ? "" : String(ev.remind_before),
            place: ev.place || "", note: ev.note || "",
          };
        } else if (opts.copyFrom) {
          const ev = opts.copyFrom;
          f = {
            id: null, title: `${ev.title} (nusxa)`,
            date: kalDateStr(ev.start), start: kalMinutes(ev.start), end: kalMinutes(ev.end) || 1440,
            allDay: ev.all_day, rrule: "",
            participants: new Set((ev.participants || []).map((p) => String(p.id))),
            isTeam: ev.is_team, project: ev.project ? ev.project.id : "",
            remind: ev.remind_before == null ? "" : String(ev.remind_before),
            place: ev.place || "", note: ev.note || "",
          };
        } else {
          const start = opts.start != null ? opts.start : Math.min(23 * 60, Math.ceil(kalNowMinutes() / 60) * 60);
          f = {
            id: null, title: "",
            date: opts.date || kal.anchor,
            start, end: opts.end != null ? opts.end : Math.min(24 * 60, start + 60),
            allDay: false, rrule: "",
            participants: new Set(me ? [String(me)] : []),
            isTeam: false, project: "", remind: "30", place: "", note: "",
          };
        }
        f.saving = false; f.error = null; f.conflicts = []; f.dirty = false;
        kal.form = f;

        const ov = document.createElement("div");
        ov.className = "kal-ov";
        ov.id = "kal-form-ov";
        ov.onclick = (e) => { if (e.target === ov) kalFormClose(); };
        document.body.appendChild(ov);
        kalFormRender();
        pageBackStack.push(kalFormClose);
        pageSyncBack();
        document.addEventListener("keydown", kalFormKey);
        setTimeout(() => document.getElementById("kal-f-title")?.focus(), 30);
      }
      function kalFormClose() {
        const f = kal.form;
        if (f && f.dirty && !confirm("O'zgarishlar saqlanmaydi. Yopilsinmi?")) return;
        document.getElementById("kal-form-ov")?.remove();
        kal.form = null;
        const i = pageBackStack.indexOf(kalFormClose);
        if (i !== -1) pageBackStack.splice(i, 1);
        pageSyncBack();
        document.removeEventListener("keydown", kalFormKey);
      }
      function kalFormKey(e) {
        if (e.key === "Escape") { e.preventDefault(); kalFormClose(); }
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); kalSave(); }
      }
      function kalMin2hhmm(m) {
        return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
      }
      function kalHhmm2min(s) {
        const [h, m] = String(s || "0:0").split(":").map(Number);
        return (h || 0) * 60 + (m || 0);
      }

      function kalFormRender() {
        const ov = document.getElementById("kal-form-ov");
        const f = kal.form;
        if (!ov || !f) return;
        const admin = isAdmin;
        const chips = kal.users
          .map((u) => {
            const id = String(u.id);
            const on = f.participants.has(id);
            const band = f.conflicts.some((c) => String(c.user.id) === id);
            return `<button type="button" class="kal-chip${on ? " on" : ""}${band ? " busy" : ""}" onclick="kalToggleP('${escArg(id)}')">
                <i style="background:${kalUserColor(u)}">${kalInit(kalUserName(u))}</i>${escHtml(kalUserShort(u))}
              </button>`;
          })
          .join("");
        const ogoh = f.conflicts.length
          ? `<div class="kal-warn"><span>!</span><div>${f.conflicts
              .slice(0, 4)
              .map((c) => `<b>${escHtml(c.user.name)}</b> shu vaqtda band: ${escHtml(c.event.title)}, ${kalHHMM(c.event.start)}–${kalHHMM(c.event.end)}`)
              .join("<br>")}</div></div>`
          : "";

        ov.innerHTML = `<div class="kal-form" onclick="event.stopPropagation()">
            <div class="kal-f-hdr">
              <div class="kal-f-t">${f.id ? "Rejani tahrirlash" : "Yangi reja"}</div>
              <button class="kal-pop-x" onclick="kalFormClose()">✕</button>
            </div>
            <div class="kal-f-body">
              <div>
                <input id="kal-f-title" class="kal-f-title${f.error === "title" ? " bad" : ""}"
                       placeholder="Reja nomi" value="${escHtml(f.title)}" oninput="kalField('title',this.value)" />
                ${kalCountHtml("title", f.title)}
              </div>
              <div class="kal-f-grid">
                <div>
                  <div class="kal-f-lbl">Sana</div>
                  <input type="date" class="kal-f-in" value="${f.date}" onchange="kalField('date',this.value)" />
                </div>
                ${f.allDay ? "" : `
                <div>
                  <div class="kal-f-lbl">Boshlanishi</div>
                  <input type="time" step="900" class="kal-f-in" value="${kalMin2hhmm(f.start)}" onchange="kalTime('start',this.value)" />
                </div>
                <div>
                  <div class="kal-f-lbl">Tugashi</div>
                  <input type="time" step="900" class="kal-f-in" value="${kalMin2hhmm(f.end)}" onchange="kalTime('end',this.value)" />
                </div>`}
              </div>
              <div class="kal-f-grid">
                <label class="kal-f-sw"><input type="checkbox" ${f.allDay ? "checked" : ""} onchange="kalField('allDay',this.checked)" /> Butun kun</label>
                <div>
                  <select class="kal-f-sel" onchange="kalField('rrule',this.value)">
                    ${KAL_REPEAT.map((r) => `<option value="${r.v}"${f.rrule === r.v ? " selected" : ""}>${r.t}</option>`).join("")}
                  </select>
                </div>
              </div>
              <div>
                <div class="kal-f-lbl">Kim uchun</div>
                <div class="kal-chips">
                  ${chips}
                  ${admin ? `<button type="button" class="kal-chip${f.isTeam ? " on" : ""}" onclick="kalToggleTeam()"><i style="background:#475569"></i>Hammasi</button>` : ""}
                </div>
              </div>
              ${ogoh}
              <div class="kal-f-grid">
                <div>
                  <div class="kal-f-lbl">Loyiha</div>
                  <select class="kal-f-sel" onchange="kalField('project',this.value)">
                    <option value="">—</option>
                    ${kal.projects.map((p) => `<option value="${escHtml(p.id)}"${String(f.project) === String(p.id) ? " selected" : ""}>${escHtml(p.label)}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <div class="kal-f-lbl">Eslatma</div>
                  <select class="kal-f-sel" onchange="kalField('remind',this.value)">
                    ${KAL_REMIND.map((r) => `<option value="${r.v}"${f.remind === r.v ? " selected" : ""}>${r.t}</option>`).join("")}
                  </select>
                </div>
              </div>
              <div>
                <div class="kal-f-lbl">Joy</div>
                <input class="kal-f-in" placeholder="Masalan: Granix ofisi, Qarshi"
                       value="${escHtml(f.place)}" oninput="kalField('place',this.value)" />
                ${kalCountHtml("place", f.place)}
              </div>
              <div>
                <div class="kal-f-lbl">Izoh</div>
                <textarea class="kal-f-area" placeholder="Nima olinishi, kerakli jihozlar…"
                          oninput="kalField('note',this.value)">${escHtml(f.note)}</textarea>
                ${kalCountHtml("note", f.note)}
              </div>
            </div>
            <div class="kal-f-foot">
              ${f.error && f.error !== "title"
                ? `<div class="kal-f-err">${escHtml(f.error)}</div>`
                : `<div class="kal-f-note">Tanlanganlarga Telegram'da xabar boradi</div>`}
              <button class="kal-pop-btn" onclick="kalFormClose()">Bekor qilish</button>
              <button class="kal-pop-btn primary" onclick="kalSave()" ${f.saving ? "disabled" : ""}>${f.saving ? "Saqlanmoqda…" : "Saqlash"}</button>
            </div>
          </div>`;
      }

      function kalCountHtml(k, val) {
        const n = String(val || "").length;
        const max = KAL_LIMITS[k];
        // Maydon deyarli bo'sh bo'lsa hisoblagich ko'zga tashlanmasin.
        if (n < max * 0.5) return `<div class="kal-f-count" id="kal-count-${k}"></div>`;
        return `<div class="kal-f-count${n > max ? " over" : ""}" id="kal-count-${k}">${n} / ${max}</div>`;
      }
      // Matn yozilayotganda butun oynani qayta chizmaymiz (fokus va
      // kursor joyi yo'qolardi) — faqat hisoblagich yangilanadi.
      function kalCountSync() {
        const f = kal.form;
        if (!f) return;
        Object.keys(KAL_LIMITS).forEach((k) => {
          const el = document.getElementById("kal-count-" + k);
          if (!el) return;
          const n = String(f[k] || "").length;
          const max = KAL_LIMITS[k];
          el.textContent = n < max * 0.5 ? "" : `${n} / ${max}`;
          el.classList.toggle("over", n > max);
        });
      }
      let kalConflictTimer = null;
      function kalField(k, v) {
        const f = kal.form;
        if (!f) return;
        f[k] = v;
        f.dirty = true;
        if (k === "title" || k === "place" || k === "note") { kalCountSync(); return; }
        if (k === "date" || k === "allDay") kalCheckConflicts();
        kalFormRender();
      }
      function kalTime(k, v) {
        const f = kal.form;
        if (!f) return;
        const m = kalHhmm2min(v);
        if (k === "start") {
          // Boshlanish surilsa tugash davomiylikni saqlab suriladi.
          const dav = Math.max(15, f.end - f.start);
          f.start = m;
          f.end = Math.min(24 * 60, m + dav);
        } else {
          f.end = m;
        }
        f.dirty = true;
        kalFormRender();
        kalCheckConflicts();
      }
      function kalToggleP(id) {
        const f = kal.form;
        if (f.participants.has(id)) f.participants.delete(id);
        else f.participants.add(id);
        f.dirty = true;
        kalFormRender();
        kalCheckConflicts();
      }
      function kalToggleTeam() {
        const f = kal.form;
        f.isTeam = !f.isTeam;
        // «Hammasi» — barcha xodimlar ishtirokchi bo'ladi.
        if (f.isTeam) kal.users.forEach((u) => f.participants.add(String(u.id)));
        f.dirty = true;
        kalFormRender();
        kalCheckConflicts();
      }
      // Bandlik tekshiruvi — 300ms kechikish bilan (TZ 8-bo'lim).
      function kalCheckConflicts() {
        if (kalConflictTimer) clearTimeout(kalConflictTimer);
        kalConflictTimer = setTimeout(async () => {
          const f = kal.form;
          if (!f || f.allDay || !f.participants.size) return;
          try {
            const q = new URLSearchParams({
              users: [...f.participants].join(","),
              start: kalToIso(f.date, f.start),
              end: kalToIso(f.date, f.end),
            });
            if (f.id) q.set("exclude", f.id);
            const r = await apiFetch(`/api/events/conflicts?${q}`);
            const d = await r.json();
            if (kal.form === f) { f.conflicts = d.items || []; kalFormRender(); }
          } catch (e) { /* tekshiruv ishlamasa saqlash baribir ishlaydi */ }
        }, 300);
      }

      async function kalSave() {
        const f = kal.form;
        if (!f || f.saving) return;
        const title = String(f.title || "").trim();
        if (title.length < 2) { f.error = "title"; kalFormRender(); document.getElementById("kal-f-title")?.focus(); return; }
        // Chegaradan oshgan matnni serverga yubormaymiz — darhol
        // aytamiz, shunda yozilgani oynada turaveradi.
        const nomlar = { title: "Nomi", place: "Joy", note: "Izoh" };
        const oshgan = Object.keys(KAL_LIMITS).find((k) => String(f[k] || "").length > KAL_LIMITS[k]);
        if (oshgan) {
          f.error = `${nomlar[oshgan]} ${KAL_LIMITS[oshgan]} belgidan oshmasligi kerak (hozir ${String(f[oshgan]).length})`;
          kalFormRender();
          return;
        }
        if (!f.allDay && f.end <= f.start) { f.error = "Tugash vaqti boshlanishdan keyin bo'lishi kerak"; kalFormRender(); return; }
        if (!f.participants.size) { f.error = "Kamida bitta xodim tanlanishi kerak"; kalFormRender(); return; }

        const body = {
          title,
          start_at: f.allDay ? kalToIso(f.date, 0) : kalToIso(f.date, f.start),
          end_at: f.allDay ? kalToIso(kalAddDays(f.date, 1), 0) : kalToIso(f.date, f.end),
          all_day: !!f.allDay,
          rrule: f.rrule || null,
          is_team: !!f.isTeam,
          project_id: f.project || null,
          place: f.place || null,
          note: f.note || null,
          remind_before: f.remind === "" ? null : Number(f.remind),
          participants: [...f.participants],
        };
        f.saving = true; f.error = null; kalFormRender();
        try {
          let url = "/api/events";
          let method = "POST";
          if (f.id) {
            let scope = "all";
            if (f.recurring) {
              scope = await kalAskScope({ recurring: true }, "Rejani tahrirlash");
              if (!scope) { f.saving = false; kalFormRender(); return; }
            }
            url = `/api/events/${encodeURIComponent(f.id)}?scope=${scope}&occurrence=${encodeURIComponent(f.occ || "")}`;
            method = "PATCH";
          }
          const r = await apiFetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!r.ok) throw new Error(await kalErrText(r));
          f.dirty = false;
          kalFormClose();
          showToast("Reja saqlandi");
          tg()?.HapticFeedback?.notificationOccurred?.("success");
          await kalLoad();
        } catch (e) {
          f.saving = false;
          f.error = e.message;
          kalFormRender();
        }
      }

      // ── Tortib ko'chirish (faqat kompyuter va ruxsat bo'lsa) ──────
      // Blokni tortish vaqt va kunni, pastki chetidan tortish
      // davomiylikni o'zgartiradi. Qadam — 15 daqiqa. Qo'yib
      // yuborilganda darhol saqlanadi; xato bo'lsa joyiga qaytadi.
      let kalDrag = null;
      function kalBindDrag() {
        if (window.matchMedia("(max-width: 859px)").matches) return;
        const body = document.getElementById("kal-body");
        if (!body) return;
        body.addEventListener("pointerdown", kalDragStart);
      }
      function kalDragStart(e) {
        if (e.button !== 0) return;
        const blok = e.target.closest(".kal-ev");
        if (!blok || !blok.getAttribute("data-edit")) return;
        const col = blok.closest(".kal-col");
        if (!col) return;
        const H = 56;
        const resize = !!e.target.closest(".kal-ev-grip");
        const ev = kalFind(blok.getAttribute("data-id"), blok.getAttribute("data-occ"));
        if (!ev) return;
        kalDrag = {
          blok, ev, resize, H,
          y0: e.clientY, x0: e.clientX,
          start: kalMinutes(ev.start),
          end: kalMinutes(ev.end) || 1440,
          day: col.getAttribute("data-day"),
          moved: false,
        };
        blok.setPointerCapture?.(e.pointerId);
        document.addEventListener("pointermove", kalDragMove);
        document.addEventListener("pointerup", kalDragEnd, { once: true });
      }
      function kalDragMove(e) {
        const d = kalDrag;
        if (!d) return;
        const dy = e.clientY - d.y0;
        if (!d.moved && Math.abs(dy) < 4 && Math.abs(e.clientX - d.x0) < 4) return;
        d.moved = true;
        d.blok.classList.add("drag");
        const siljish = Math.round((dy / d.H) * 60 / KAL_STEP) * KAL_STEP;
        if (d.resize) {
          d.newStart = d.start;
          d.newEnd = Math.min(24 * 60, Math.max(d.start + KAL_STEP, d.end + siljish));
        } else {
          const dav = d.end - d.start;
          d.newStart = Math.max(0, Math.min(24 * 60 - dav, d.start + siljish));
          d.newEnd = d.newStart + dav;
          // Qaysi kun ustiga olib borilgani
          const ustida = document.elementFromPoint(e.clientX, e.clientY)?.closest(".kal-col");
          d.newDay = ustida ? ustida.getAttribute("data-day") : d.day;
        }
        d.blok.style.top = `${((d.newStart / 60) * d.H).toFixed(1)}px`;
        d.blok.style.height = `${Math.max(22, ((d.newEnd - d.newStart) / 60) * d.H - 2).toFixed(1)}px`;
        const s = d.blok.querySelector(".kal-ev-s");
        if (s) s.textContent = `${kalMin2hhmm(d.newStart)}–${kalMin2hhmm(d.newEnd)}`;
      }
      async function kalDragEnd() {
        document.removeEventListener("pointermove", kalDragMove);
        const d = kalDrag;
        kalDrag = null;
        if (!d) return;
        d.blok.classList.remove("drag");
        if (!d.moved) return;
        const kun = d.newDay || d.day;
        if (d.newStart === d.start && d.newEnd === d.end && kun === d.day) { kalRender(); return; }
        const ev = d.ev;
        try {
          let scope = "all";
          if (ev.recurring) {
            scope = await kalAskScope(ev, "Rejani ko'chirish");
            if (!scope) { kalRender(); return; }
          }
          const body = {
            title: ev.title,
            start_at: kalToIso(kun, d.newStart),
            end_at: kalToIso(kun, d.newEnd),
            all_day: ev.all_day,
            rrule: ev.recurring ? ev.rrule || "FREQ=WEEKLY" : null,
            is_team: ev.is_team,
            project_id: ev.project ? ev.project.id : null,
            place: ev.place, note: ev.note, remind_before: ev.remind_before,
            participants: (ev.participants || []).map((p) => p.id),
          };
          const r = await apiFetch(
            `/api/events/${encodeURIComponent(ev.id)}?scope=${scope}&occurrence=${encodeURIComponent(ev.occurrence_start)}`,
            { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) },
          );
          if (!r.ok) throw new Error(await kalErrText(r));
          showToast("Reja ko'chirildi");
          await kalLoad();
        } catch (e) {
          showToast("⚠ " + e.message);
          kalRender(); // joyiga qaytadi
        }
      }

      // ── Qidiruv ───────────────────────────────────────────────────
      let kalSearchTimer = null;
      function kalSearch(q) {
        kal.search = q;
        if (kalSearchTimer) clearTimeout(kalSearchTimer);
        const box = document.getElementById("kal-results");
        if (!box) return;
        if (String(q).trim().length < 2) { box.innerHTML = ""; return; }
        kalSearchTimer = setTimeout(async () => {
          try {
            const r = await apiFetch(`/api/events/search?q=${encodeURIComponent(q)}`);
            const d = await r.json();
            const list = d.items || [];
            const el = document.getElementById("kal-results");
            if (!el) return;
            el.className = "kal-res";
            el.innerHTML = list.length
              ? list
                  .map((ev) => `<div class="kal-res-row" onclick="kalJump('${escArg(ev.id)}','${escArg(ev.occurrence_start)}','${kalDateStr(ev.start)}')">
                      <i class="kal-res-dot" style="background:${kalEvColor(ev)}"></i>
                      <div style="flex:1;min-width:0">
                        <div class="kal-res-t">${escHtml(ev.title)}</div>
                        <div class="kal-res-s">${kalDayLabel(kalDateStr(ev.start))}${ev.all_day ? "" : ` · ${kalHHMM(ev.start)}`}${ev.project ? ` · ${escHtml(ev.project.label)}` : ""}</div>
                      </div>
                    </div>`)
                  .join("")
              : `<div class="kal-res-row"><div class="kal-res-s">Topilmadi</div></div>`;
          } catch (e) { /* jim */ }
        }, 250);
      }
      async function kalJump(id, occ, dateStr) {
        const box = document.getElementById("kal-results");
        if (box) { box.innerHTML = ""; box.className = ""; }
        const inp = document.getElementById("kal-search");
        if (inp) inp.value = "";
        kalGoDate(dateStr, kal.view === "oy" ? "kun" : kal.view);
        await kalLoad();
        // Kartani ochish uchun blokni topamiz
        setTimeout(() => {
          const blok = document.querySelector(`#screen-kalendar .kal-ev[data-id="${CSS.escape(String(id))}"]`);
          if (blok) blok.click();
        }, 80);
      }

      // Telegram xabaridagi «Ilovani ochish» tugmasi shu yo'l bilan
      // aynan o'sha rejani ochadi: avval sanasiga o'tiladi, keyin
      // blok topilib kartasi chiqariladi.
      async function kalOpenById(id) {
        try {
          const r = await apiFetch(`/api/events/${encodeURIComponent(id)}`);
          if (!r.ok) {
            showToast(r.status === 410 ? "Bu reja o'chirilgan" : "Reja topilmadi");
            return;
          }
          const ev = await r.json();
          kalGoDate(kalDateStr(ev.start), "kun");
          await kalLoad();
          setTimeout(() => {
            document.querySelector(`#screen-kalendar .kal-ev[data-id="${CSS.escape(String(id))}"]`)?.click();
          }, 100);
        } catch (e) { /* jim */ }
      }

      // ── Klaviatura (faqat kompyuter) ──────────────────────────────
      function kalKeys(e) {
        if (!document.getElementById("screen-kalendar")?.classList.contains("active")) return;
        if (document.getElementById("kal-form-ov")) return;
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) {
          if (e.key === "Escape") t.blur();
          return;
        }
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (e.key === "ArrowLeft") { e.preventDefault(); kalStep(-1); }
        else if (e.key === "ArrowRight") { e.preventDefault(); kalStep(1); }
        else if (k === "t") kalGoToday();
        else if (k === "d") kalSetView("kun");
        else if (k === "w") kalSetView("hafta");
        else if (k === "m") kalSetView("oy");
        else if (k === "n") { e.preventDefault(); kalOpenForm({}); }
        else if (e.key === "Escape") kalCloseDetail();
        else if (e.key === "/") { e.preventDefault(); document.getElementById("kal-search")?.focus(); }
      }
      document.addEventListener("keydown", kalKeys);

      // Boshqa xodim reja qo'shsa, ochiq kalendar o'zi yangilanadi.
      // SSE yo'q — 60 soniyalik tekshiruv va oyna fokusga qaytganda
      // (TZ 13-bo'lim; «5 soniya» uchun real-time kanal kerak).
      setInterval(() => {
        if (kal && document.getElementById("screen-kalendar")?.classList.contains("active")
            && !document.getElementById("kal-form-ov") && document.visibilityState === "visible") {
          kalLoad();
        }
      }, 60000);
      window.addEventListener("focus", () => {
        if (kal && document.getElementById("screen-kalendar")?.classList.contains("active")
            && !document.getElementById("kal-form-ov")) kalLoad();
      });

      // ═══ FAOLLIK — jamoa va xodim ═══════════════════════════════════
      // Ma'lumot manbasi: chiqqan post va stories hamda "Bajarildi"
      // holatiga o'tgan vazifalar. Har ish uni HAQIQATDA bajargan
      // xodimga yoziladi, bundan tashqari postga hissa qo'shganlar —
      // montaj qilgan va videoni olgan xodim ham ishtirokchi sanaladi.
      //
      // Shuning uchun ikki xil son bor va ular ataylab bir-biriga teng
      // emas: "N ta ish" — haqiqiy ishlar soni, xodim yonidagi son esa
      // u ishtirok etgan ishlar soni (bitta postda uch kishi ishlagan
      // bo'lsa, uchalasiga ham sanaladi).
      let act = null;
      const ACT_KIND_LABEL = { post: "Post", story: "Stories", task: "Vazifa" };

      function actPad(n) {
        return String(n).padStart(2, "0");
      }
      function actMonthKey(d) {
        return `${d.getFullYear()}-${actPad(d.getMonth() + 1)}`;
      }
      function actShiftMonth(key, delta) {
        const [y, m] = key.split("-").map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        return actMonthKey(d);
      }
      function actMonthLabel(key) {
        const [y, m] = key.split("-").map(Number);
        return `${MONTHS[m - 1]} ${y}`;
      }
      function actDaysInMonth(key) {
        const [y, m] = key.split("-").map(Number);
        return new Date(y, m, 0).getDate();
      }
      // Oy kalendarining qatorlari — har biri bitta hafta (dushanbadan).
      // Oyga tegishli bo'lmagan kunlar ham qoladi: dizaynda ular xira
      // ko'rinadi, lekin haftaning jamiga kiradi.
      function actWeeks(key) {
        const [y, m] = key.split("-").map(Number);
        const oxirgi = actDaysInMonth(key);
        const off = (new Date(y, m - 1, 1).getDay() + 6) % 7;
        const weeks = [];
        const cursor = new Date(y, m - 1, 1 - off);
        for (let i = 0; i < 6; i++) {
          const days = [];
          for (let d = 0; d < 7; d++) {
            days.push(isoOf(new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + i * 7 + d)));
          }
          weeks.push({ index: i, days, start: days[0], end: days[6] });
          if (days[6] >= `${y}-${actPad(m)}-${actPad(oxirgi)}`) break;
        }
        return weeks;
      }
      function actInMonth(iso, key) {
        return iso.slice(0, 7) === key;
      }

      // ── Sanash ───────────────────────────────────────────────────
      // Xodim filtri qo'yilgan bo'lsa, faqat o'sha xodim ishtirok
      // etgan ishlar qoladi.
      function actScoped(username) {
        const u = typeof username === "undefined" ? act.filter : username;
        if (!u) return act.items;
        return act.items.filter((it) => it.users.includes(u));
      }
      function actInRange(items, from, to) {
        return items.filter((it) => it.day >= from && it.day <= to);
      }
      function actDayCounts(items) {
        const map = {};
        items.forEach((it) => (map[it.day] = (map[it.day] || 0) + 1));
        return map;
      }
      function actKindCounts(items) {
        const c = { post: 0, story: 0, task: 0 };
        items.forEach((it) => (c[it.kind] = (c[it.kind] || 0) + 1));
        return c;
      }
      // Xodimlar bo'yicha: bitta ish bir nechta ishtirokchiga sanaladi.
      function actUserCounts(items) {
        const map = {};
        items.forEach((it) => it.users.forEach((u) => (map[u] = (map[u] || 0) + 1)));
        return map;
      }
      function actUser(username) {
        return act.users.find((u) => u.username === username) || { username, name: "@" + username };
      }
      function actShortName(u) {
        const parts = String(u.name || "").trim().split(/\s+/);
        if (parts.length < 2) return u.name || "@" + u.username;
        return `${parts[0]} ${parts[1].slice(0, 1).toUpperCase()}.`;
      }
      function actAv(u, cls) {
        const nom = u.name || u.username;
        return `<span class="act-av ${cls || ""}" style="background:${personColor(u.username)}">${escHtml(nom.slice(0, 1).toUpperCase())}${avatarImg(u.avatarUrl)}</span>`;
      }
      // Oyda ishi bo'lgan xodimlar — ko'pidan kamiga. Filtr tugmalari
      // va ro'yxatlar shu tartibda chiziladi.
      function actActiveUsers(items) {
        const counts = actUserCounts(items);
        return Object.keys(counts)
          .sort((a, b) => counts[b] - counts[a])
          .map((username) => ({ ...actUser(username), count: counts[username] }));
      }
      function actDiffHtml(diff, suffix) {
        if (diff === null || typeof diff === "undefined") return "";
        if (diff === 0) return `<span class="act-diff flat">0${suffix || ""}</span>`;
        const up = diff > 0;
        return `<span class="act-diff ${up ? "up" : "down"}">${up ? "↑ +" : "↓ −"}${Math.abs(diff)}${suffix || ""}</span>`;
      }

      // ── Ochilishi va yuklanishi ──────────────────────────────────
      async function openActivity(month) {
        const key = month || (act ? act.month : actMonthKey(todayDate()));
        openSubScreen("screen-activity", closeActivity);
        const body = document.getElementById("activity-body");
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        try {
          const res = await apiFetch(`/api/activity?month=${encodeURIComponent(key)}`);
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          const d = await res.json();
          act = {
            month: d.month,
            today: d.today,
            items: d.items || [],
            users: d.users || [],
            projects: d.projects || [],
            filter: act && act.month === d.month ? act.filter : "",
            weekIdx: null,
            dayIso: null,
            view: "weeks",
          };
          // Ochilganda joriy hafta tanlangan bo'ladi.
          const weeks = actWeeks(act.month);
          const cur = weeks.findIndex((w) => act.today >= w.start && act.today <= w.end);
          act.weekIdx = cur === -1 ? 0 : cur;
        } catch (e) {
          body.innerHTML = `<div style="color:var(--red);font-size:13px;padding:16px">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        renderActivity();
      }
      function closeActivity() {
        // Hafta tafsiloti ochiq bo'lsa, orqaga avval haftalar
        // ro'yxatiga qaytaradi — Telegram tugmasi ham shu yo'l bilan.
        if (act && act.view === "week") {
          actBackToWeeks();
          return;
        }
        showTab("today");
      }
      function actBack() {
        closeActivity();
      }
      function actSetMonth(delta) {
        openActivity(actShiftMonth(act.month, delta));
      }
      function actSetFilter(username) {
        act.filter = act.filter === username ? "" : username;
        renderActivity();
      }
      function actSelectWeek(i) {
        act.weekIdx = i;
        act.dayIso = null;
        renderActivity();
      }
      function actSelectDay(iso) {
        // Kun qayta bosilsa — butun haftaga qaytadi.
        act.dayIso = act.dayIso === iso ? null : iso;
        renderActivity();
      }
      function actOpenWeek(i) {
        act.weekIdx = i;
        act.dayIso = null;
        act.view = "week";
        renderActivity();
      }
      function actBackToWeeks() {
        act.view = "weeks";
        renderActivity();
      }

      function renderActivity() {
        const body = document.getElementById("activity-body");
        if (!body || !act) return;
        const hdr = document.getElementById("activity-title");
        if (hdr) hdr.textContent = act.view === "week" ? actWeekLabel(act.weekIdx) : "Jamoa faolligi";
        // Haftalar ro'yxati — asosiy sahifa, pastki menyu ko'rinadi.
        // Hafta tafsiloti esa ichki sahifa: u yerda menyu yashiriladi.
        const bn = document.getElementById("bottom-nav");
        const mobil = window.matchMedia("(max-width: 859px)").matches;
        const menyuBor = mobil && act.view === "weeks";
        if (bn) bn.style.display = menyuBor ? "" : "none";
        // Menyu `fixed` — kontent uning ostiga kirib ketmasligi uchun
        // aylanadigan qism pastdan shuncha joy qoldiradi.
        document.getElementById("screen-activity").classList.toggle("nav-on", menyuBor);
        body.innerHTML =
          act.view === "week"
            ? `<div class="mobile-only">${actWeekPageHtml()}</div>`
            : `<div class="mobile-only">${actMobileHtml()}</div><div class="desktop-only">${actDesktopHtml()}</div>`;
        applyStaticIcons?.();
      }
      function actWeekLabel(i) {
        const w = actWeeks(act.month)[i];
        if (!w) return "";
        return fmtRangeShort(w.start, w.end);
      }

      // ── Hafta hisoblari ──────────────────────────────────────────
      function actWeekStats(i) {
        const weeks = actWeeks(act.month);
        const w = weeks[i];
        if (!w) return null;
        const scoped = actScoped();
        const items = actInRange(scoped, w.start, w.end);
        const oldingi = i > 0 ? actInRange(scoped, weeks[i - 1].start, weeks[i - 1].end).length : null;
        // Hafta tugamagan bo'lsa farq ko'rsatilmaydi — yarim hafta
        // bilan to'liq haftani solishtirish chalg'itadi.
        const tugagan = w.end < act.today;
        const kelgusi = w.start > act.today;
        return {
          week: w,
          items,
          total: items.length,
          diff: tugagan && oldingi !== null ? items.length - oldingi : null,
          done: tugagan,
          future: kelgusi,
          kinds: actKindCounts(items),
        };
      }
      function actAllWeekStats() {
        return actWeeks(act.month).map((_, i) => actWeekStats(i));
      }
      // "Eng yaxshi hafta" — oydagi eng ko'p ishli hafta (tugaganlari
      // orasidan; davom etayotgan hafta hali to'liq emas).
      function actBestWeekIdx(stats) {
        let best = -1;
        stats.forEach((s, i) => {
          if (!s || s.future) return;
          if (best === -1 || s.total > stats[best].total) best = i;
        });
        return stats[best] && stats[best].total > 0 ? best : -1;
      }
      // Kun katagining rangi — oyning eng band kuniga nisbatan.
      function actHeatLevel(n, max) {
        if (!n) return 0;
        if (!max) return 1;
        const r = n / max;
        return r > 0.75 ? 4 : r > 0.5 ? 3 : r > 0.25 ? 2 : 1;
      }

      function actFilterBarHtml() {
        const users = actActiveUsers(act.items);
        return `<div class="act-filters">
          <button type="button" class="act-fchip${act.filter ? "" : " on"}" onclick="actSetFilter('')">Hammasi</button>
          ${users
            .map(
              (u) =>
                `<button type="button" class="act-fchip${act.filter === u.username ? " on" : ""}" onclick="actSetFilter('${escArg(u.username)}')">
                   <span class="act-fdot" style="background:${personColor(u.username)}"></span>${escHtml(actShortName(u))}
                 </button>`,
            )
            .join("")}
        </div>`;
      }
      function actMonthBarHtml() {
        const keyingi = actShiftMonth(act.month, 1) <= actMonthKey(todayDate());
        return `<div class="act-monthbar">
          <button type="button" class="act-mbtn" onclick="actSetMonth(-1)" aria-label="Oldingi oy">${ICON.chevronLeft}</button>
          <div class="act-month">${actMonthLabel(act.month)}</div>
          <button type="button" class="act-mbtn"${keyingi ? "" : " disabled"} onclick="actSetMonth(1)" aria-label="Keyingi oy">${ICON.chevronRight}</button>
        </div>`;
      }

      // ── Katta ekran (23a): kalendar kartasi + o'ng panel ─────────
      function actDesktopHtml() {
        const stats = actAllWeekStats();
        const best = actBestWeekIdx(stats);
        const dayMap = actDayCounts(actScoped());
        const max = Math.max(0, ...Object.values(dayMap));
        const WD2 = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"];

        const rows = stats
          .map((s, i) => {
            const cells = s.week.days
              .map((iso) => {
                const kelgusi = iso > act.today;
                const bugun = iso === act.today;
                const tashqari = !actInMonth(iso, act.month);
                const kun = parseISO(iso).getDate();
                // Kelgusi kunlar bo'sh — faqat sana, oq fonda.
                if (kelgusi) {
                  return `<button type="button" class="act-day next"><span class="act-dnum">${kun}</span></button>`;
                }
                const n = dayMap[iso] || 0;
                const cls = [
                  "act-day",
                  `l${actHeatLevel(n, max)}`,
                  tashqari ? "out" : "",
                  bugun ? "today" : "",
                  act.dayIso === iso ? "is-sel" : "",
                ].filter(Boolean);
                return `<button type="button" class="${cls.join(" ")}" onclick="event.stopPropagation();actSelectDay('${iso}')">
                  <span class="act-dnum">${kun}</span>
                  <span class="act-dbot">
                    <span class="act-dn">${n}</span>
                    ${bugun ? `<span class="act-today-lbl">bugun</span>` : ""}
                  </span>
                </button>`;
              })
              .join("");
            const sum = s.future
              ? `<div class="act-wsum nil">—</div>`
              : `<div class="act-wsum">
                   <div class="act-wtop"><span class="act-wn">${s.total}</span><span class="act-wl">ta ish</span></div>
                   ${
                     i === best
                       ? `<span class="act-best">Eng yaxshi hafta</span>`
                       : s.done
                         ? actDiffHtml(s.diff)
                         : `<span class="act-wgoing">davom etmoqda</span>`
                   }
                 </div>`;
            return `<div class="act-wrow${act.weekIdx === i ? " is-sel" : ""}" onclick="actSelectWeek(${i})">
              ${cells}
              ${sum}
            </div>`;
          })
          .join("");

        return `<div class="act-top">
            <div class="act-h1">Jamoa faolligi</div>
            ${actMonthBarHtml()}
          </div>
          ${actFilterBarHtml()}
          <div class="act-wrap">
            <div class="act-cal">
              <div class="act-calhdr">
                ${WD2.map((w, i) => `<div class="act-wd${i > 4 ? " dim" : ""}">${w}</div>`).join("")}
                <div class="act-wd act-wsum-hdr">Hafta jami</div>
              </div>
              <div class="act-rows">${rows}</div>
              <div class="act-legend">
                <span class="act-hint">Haftani bosing — o'ngda shu hafta ochiladi</span>
                <span class="act-scale">Kam ${[0, 1, 2, 3, 4].map((l) => `<i class="l${l}"></i>`).join("")} Ko'p</span>
              </div>
            </div>
            <aside class="act-panel">${actPanelHtml()}</aside>
          </div>`;
      }

      // O'ng panel (va mobil "hafta tafsiloti" sahifasi) — bir xil
      // mazmun: jami, bo'linish, kunlar va kim qancha qilgani.
      function actPanelHtml() {
        const s = actWeekStats(act.weekIdx);
        if (!s) return "";
        const best = actBestWeekIdx(actAllWeekStats()) === act.weekIdx;
        const sarlavha = `<div class="act-ptop">
            ${act.view === "week" ? "" : `<div class="act-prange">${escHtml(fmtRangeShort(s.week.start, s.week.end))}</div>`}
            ${best ? `<span class="act-best">Eng yaxshi hafta</span>` : ""}
          </div>`;
        if (!s.total) return `${sarlavha}<div class="act-empty">Bu haftada ish yo'q</div>`;

        // Kun tanlangan bo'lsa "kim qancha qildi" shu kunga torayadi.
        const kimItems = act.dayIso ? s.items.filter((it) => it.day === act.dayIso) : s.items;
        const counts = actUserCounts(kimItems);
        const weeks = actWeeks(act.month);
        const oldingi =
          act.weekIdx > 0 && !act.dayIso
            ? actUserCounts(actInRange(actScoped(), weeks[act.weekIdx - 1].start, weeks[act.weekIdx - 1].end))
            : null;
        const kishilar = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const maxKishi = Math.max(1, ...Object.values(counts));
        const dayMap = actDayCounts(s.items);
        const maxDay = Math.max(1, ...Object.values(dayMap));
        const WD2 = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"];

        return `${sarlavha}
          <div class="act-pbig">
            <div class="act-pn">${s.total}</div>
            <div class="act-pl">ta ish</div>
          </div>
          ${s.diff !== null ? `<div class="act-pdiff">${actDiffHtml(s.diff, "")} <span>o'tgan haftaga nisbatan</span></div>` : ""}
          <div class="act-split">
            ${["post", "story", "task"]
              .map(
                (k) => `<div class="act-sp"><div class="act-spn">${s.kinds[k] || 0}</div><div class="act-spl">${ACT_KIND_LABEL[k]}</div></div>`,
              )
              .join("")}
          </div>
          <div class="act-seclbl">Kunlar</div>
          <div class="act-bars">
            ${s.week.days
              .map((iso, di) => {
                const kelgusi = iso > act.today;
                const n = kelgusi ? 0 : dayMap[iso] || 0;
                const eng = n === maxDay && n > 0;
                return `<button type="button" class="act-bar${act.dayIso === iso ? " is-sel" : ""}" onclick="actSelectDay('${iso}')">
                  <span class="act-barn${eng ? " top" : ""}">${kelgusi || !n ? "" : n}</span>
                  <span class="act-barv${eng ? " top" : ""}" style="height:${Math.max(3, Math.round((n / maxDay) * 64))}px"></span>
                  <span class="act-barl">${WD2[di]}</span>
                </button>`;
              })
              .join("")}
          </div>
          <div class="act-seclbl">Kim qancha qildi</div>
          <div class="act-people">
            ${
              kishilar
                .map((un) => {
                  const u = actUser(un);
                  const d = oldingi ? counts[un] - (oldingi[un] || 0) : null;
                  const rang = personColor(un);
                  return `<button type="button" class="act-person" onclick="openActivityUser('${escArg(un)}')">
                    ${actAv(u)}
                    <span class="act-pname">${escHtml(actShortName(u))}</span>
                    <span class="act-ptrack"><span class="act-pfill" style="width:${Math.round((counts[un] / maxKishi) * 100)}%;background:${rang}"></span></span>
                    <span class="act-pcount">${counts[un]}</span>
                    <span class="act-pdelta">${s.done && d !== null ? actDiffHtml(d) : ""}</span>
                  </button>`;
                })
                .join("") || `<div class="act-empty">Bu kunda ish yo'q</div>`
            }
          </div>`;
      }

// ── Telefon (23b): ixcham kalendar + tanlangan hafta kartasi ──
      function actMobileHtml() {
        const stats = actAllWeekStats();
        const best = actBestWeekIdx(stats);
        const dayMap = actDayCounts(actScoped());
        const max = Math.max(0, ...Object.values(dayMap));
        const WD2 = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"];
        const keyingi = actShiftMonth(act.month, 1) <= actMonthKey(todayDate());

        const rows = stats
          .map((s, i) => {
            const cells = s.week.days
              .map((iso) => {
                const kun = parseISO(iso).getDate();
                // Mobil katakda faqat sana — ishlar soni rang bilan
                // beriladi, aniq son hafta tafsilotida.
                if (iso > act.today) return `<span class="act-mday next">${kun}</span>`;
                const n = dayMap[iso] || 0;
                const cls = [
                  "act-mday",
                  `l${actHeatLevel(n, max)}`,
                  actInMonth(iso, act.month) ? "" : "out",
                  iso === act.today ? "today" : "",
                ].filter(Boolean);
                return `<span class="${cls.join(" ")}">${kun}</span>`;
              })
              .join("");
            const sum = s.future
              ? `<span class="act-mwsum nil">—</span>`
              : `<span class="act-mwsum">
                   <b class="${i === best ? "best" : ""}">${s.total}</b>
                   ${s.done ? actDiffHtml(s.diff) : `<i>…</i>`}
                 </span>`;
            return `<button type="button" class="act-mrow${act.weekIdx === i ? " is-sel" : ""}" onclick="actSelectWeek(${i})">
              ${cells}${sum}
            </button>`;
          })
          .join("");

        const s = actWeekStats(act.weekIdx);
        const counts = s ? actUserCounts(s.items) : {};
        const kishilar = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const maxKishi = Math.max(1, ...Object.values(counts));
        const weeks = actWeeks(act.month);
        const oldingi =
          act.weekIdx > 0
            ? actUserCounts(actInRange(actScoped(), weeks[act.weekIdx - 1].start, weeks[act.weekIdx - 1].end))
            : null;
        const card = !s
          ? ""
          : `<div class="act-mcard">
              <div class="act-ptop">
                <div class="act-prange">${escHtml(fmtRangeShort(s.week.start, s.week.end))}</div>
                ${best === act.weekIdx ? `<span class="act-best">Eng yaxshi</span>` : ""}
              </div>
              ${
                s.total
                  ? `<div class="act-mbig">
                       <span class="act-mn">${s.total}</span>
                       <span class="act-ml">ta ish</span>
                       <span class="act-mgap"></span>
                       ${s.diff !== null ? `<span class="act-mdiff">${actDiffHtml(s.diff)} o'tgan haftaga</span>` : ""}
                     </div>
                     <div class="act-people">
                       ${kishilar
                         .slice(0, 3)
                         .map((un) => {
                           const u = actUser(un);
                           const d = oldingi ? counts[un] - (oldingi[un] || 0) : null;
                           return `<button type="button" class="act-person" onclick="openActivityUser('${escArg(un)}')">
                             ${actAv(u)}
                             <span class="act-pname">${escHtml(actShortName(u))}</span>
                             <span class="act-ptrack"><span class="act-pfill" style="width:${Math.round((counts[un] / maxKishi) * 100)}%;background:${personColor(un)}"></span></span>
                             <span class="act-pcount">${counts[un]}</span>
                             <span class="act-pdelta">${s.done && d !== null ? actDiffHtml(d) : ""}</span>
                           </button>`;
                         })
                         .join("")}
                     </div>
                     <button type="button" class="act-mlink" onclick="actOpenWeek(${act.weekIdx})">
                       <span>Hafta tafsiloti</span>${ICON.chevronRight}
                     </button>`
                  : `<div class="act-empty">Bu haftada ish yo'q</div>`
              }
            </div>`;

        return `<div class="act-mhdr">
            <div class="act-mh1">Jamoa faolligi</div>
            <button type="button" class="act-mnav" onclick="actSetMonth(-1)" aria-label="Oldingi oy">${ICON.chevronLeft}</button>
            <button type="button" class="act-mnav"${keyingi ? "" : " disabled"} onclick="actSetMonth(1)" aria-label="Keyingi oy">${ICON.chevronRight}</button>
          </div>
          <div class="act-mbody">
            <div class="act-mfilters">${actFilterBarHtml()}</div>
            <div class="act-mcal">
              <div class="act-mcal-top">
                <div class="act-mmonth">${actMonthLabel(act.month)}</div>
                <div class="act-mwsum-hdr">Hafta</div>
              </div>
              <div class="act-mwd-row">
                ${WD2.map((w, i) => `<span class="act-mwd${i > 4 ? " dim" : ""}">${w}</span>`).join("")}
                <span class="act-mwsum-sp"></span>
              </div>
              <div class="act-mrows">${rows}</div>
            </div>
            ${card}
          </div>`;
      }

      // ── Telefon (23c): hafta tafsiloti sahifasi ──────────────────
      function actWeekPageHtml() {
        const weeks = actWeeks(act.month);
        const s = actWeekStats(act.weekIdx);
        if (!s) return "";
        const oldingiBor = act.weekIdx > 0;
        // Joriy haftadan keyingisiga o'tib bo'lmaydi.
        const keyingiBor = act.weekIdx < weeks.length - 1 && weeks[act.weekIdx + 1].start <= act.today;
        return `<div class="act-whdr">
            <button type="button" class="act-wback" onclick="actBackToWeeks()" aria-label="Orqaga">${ICON.chevronLeft}</button>
            <div class="act-whdr-txt">
              <div class="act-whdr-t">${escHtml(fmtRangeShort(s.week.start, s.week.end))}</div>
              <div class="act-whdr-s">${act.weekIdx + 1}-hafta · ${actMonthLabel(act.month)}</div>
            </div>
            <button type="button" class="act-mnav sm"${oldingiBor ? "" : " disabled"} onclick="actSelectWeek(${act.weekIdx - 1})">${ICON.chevronLeft}</button>
            <button type="button" class="act-mnav sm"${keyingiBor ? "" : " disabled"} onclick="actSelectWeek(${act.weekIdx + 1})">${ICON.chevronRight}</button>
          </div>
          <div class="act-wbody">
            <div class="act-panel">${actPanelHtml()}</div>
          </div>`;
      }

      // ── Xodim sahifasi (26a / 26c) ───────────────────────────────
      let actUserState = null;
      async function openActivityUser(username, month) {
        const key = month || (act ? act.month : actMonthKey(todayDate()));
        // Faollik ma'lumoti yo'q bo'lsa (xodimlar ro'yxatidan to'g'ridan
        // ochilgan) — avval yuklaymiz.
        if (!act || act.month !== key) {
          try {
            const res = await apiFetch(`/api/activity?month=${encodeURIComponent(key)}`);
            if (!res.ok) throw new Error("Xato");
            const d = await res.json();
            act = {
              month: d.month, today: d.today, items: d.items || [], users: d.users || [],
              projects: d.projects || [], filter: "", weekIdx: 0, dayIso: null, view: "weeks",
            };
          } catch (e) {
            showToast("⚠ Faollik yuklanmadi");
            return;
          }
        }
        // Tanlangan loyiha oy almashganda ham saqlanadi — xodim bir
        // loyihani kuzatayotgan bo'lsa, har oyda qaytadan bosmaydi.
        const avvalgiProj = actUserState && actUserState.username === username ? actUserState.proj : "";
        actUserState = { username, day: null, proj: avvalgiProj || "" };
        openSubScreen("screen-activity-user", () => openActivity(act.month));
        renderActivityUser();
      }
      function actUserSetMonth(delta) {
        openActivityUser(actUserState.username, actShiftMonth(act.month, delta));
      }
      // Loyiha kartasi bosilganda asosiy grafik o'sha loyihaga o'tadi.
      // Qayta bosilsa yoki chipdagi "✕" bosilsa — barcha loyihalarga
      // qaytadi. Bo'sh slug ham shu yo'l bilan keladi.
      function actUserPickProj(slug) {
        if (!actUserState) return;
        actUserState.proj = actUserState.proj === slug ? "" : slug;
        tg()?.HapticFeedback?.selectionChanged?.();
        renderActivityUser();
        // Grafik tepada — tanlov natijasi ko'rinib tursin.
        const sc = document.querySelector("#screen-activity-user .scroll");
        if (sc) sc.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Xodimning oydagi ishlari. Asosiy raqam — post va stories
      // (vazifalar alohida, TZ shunday).
      function actUserItems(username, monthKey) {
        return act.items.filter((it) => it.users.includes(username) && it.day.slice(0, 7) === monthKey);
      }
      function actCumulative(items, monthKey, upto) {
        const n = actDaysInMonth(monthKey);
        const byDay = actDayCounts(items);
        const out = [];
        let sum = 0;
        for (let d = 1; d <= n; d++) {
          const iso = `${monthKey}-${actPad(d)}`;
          sum += byDay[iso] || 0;
          out.push(upto && iso > upto ? null : sum);
        }
        return out;
      }
      function actProjectStatus(done, expected) {
        if (!expected) return null;
        const r = done / expected;
        if (r >= 1.05) return { label: "Oldinda", cls: "ahead" };
        if (r >= 0.9) return { label: "Rejada", cls: "onplan" };
        return { label: "Ortda", cls: "behind" };
      }
      function actLastWorkText(at) {
        if (!at) return "";
        const d = new Date(at);
        const iso = isoOf(d);
        const soat = `${actPad(d.getHours())}:${actPad(d.getMinutes())}`;
        if (iso === act.today) return `bugun ${soat}`;
        const kecha = isoOf(new Date(parseISO(act.today).getTime() - 86400000));
        if (iso === kecha) return `kecha ${soat}`;
        return `${ntfDayShort(iso)} ${soat}`;
      }
      const ACT_CLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`;

      function renderActivityUser() {
        const body = document.getElementById("activity-user-body");
        if (!body || !actUserState) return;
        const un = actUserState.username;
        const u = actUser(un);
        const monthKey = act.month;
        const prevKey = actShiftMonth(monthKey, -1);
        const kunlar = actDaysInMonth(monthKey);
        const bugunOy = monthKey === act.today.slice(0, 7);
        const otgan = bugunOy ? Number(act.today.slice(8, 10)) : kunlar;

        // Loyiha tanlangan bo'lsa asosiy grafik o'shanga o'tadi, lekin
        // tepadagi KPI'lar va pastdagi kartalar oyning to'liq manzarasini
        // ko'rsatib turadi — shuning uchun ikki xil ro'yxat kerak.
        const barchaIsh = actUserItems(un, monthKey);
        const barchaIshlar = barchaIsh.filter((it) => it.kind !== "task");
        // Tanlangan loyihada bu oyda ish bo'lmasa — tanlov bekor qilinadi.
        if (actUserState.proj && !barchaIsh.some((it) => it.project && it.project.slug === actUserState.proj)) {
          actUserState.proj = "";
        }
        const tanlanganSlug = actUserState.proj || "";
        const faqatProj = (list) =>
          tanlanganSlug ? list.filter((it) => it.project && it.project.slug === tanlanganSlug) : list;
        const hammasi = faqatProj(barchaIsh);
        const ishlar = hammasi.filter((it) => it.kind !== "task");
        const prevIshlar = faqatProj(actUserItems(un, prevKey)).filter((it) => it.kind !== "task");
        // Taqqoslash — o'tgan oyning SHU kunigacha bo'lgan soni.
        const prevShuKunga = prevIshlar.filter((it) => Number(it.day.slice(8, 10)) <= otgan).length;
        const jami = ishlar.length;
        const farq = jami - prevShuKunga;
        const foiz = prevShuKunga ? Math.round((farq / prevShuKunga) * 100) : null;
        const faolKun = new Set(barchaIsh.map((it) => it.day)).size;
        // O'z loyihalari — xodim SMM mas'uli bo'lgan loyihalar.
        const ozLoyihalar = act.projects.filter((p) => p.smm === un);
        const ozReja = ozLoyihalar.reduce((s, p) => s + (p.plan || 0), 0);
        const ozBajarilgan = barchaIshlar.filter((it) => it.project && ozLoyihalar.some((p) => p.slug === it.project.slug)).length;
        const keyingiOy = actShiftMonth(monthKey, 1) <= actMonthKey(todayDate());
        const oyNomi = MONTHS[Number(monthKey.slice(5, 7)) - 1];
        const prevNomi = MONTHS[Number(prevKey.slice(5, 7)) - 1];

        const kpi = (val, lab) => `<div class="actu-kpi"><b>${val}</b><span>${lab}</span></div>`;
        const header = `<div class="actu-hdr">
            <button type="button" class="actu-back" onclick="openActivity(act.month)" aria-label="Orqaga">${ICON.chevronLeft}</button>
            ${actAv(u, "big")}
            <div class="actu-hdr-txt">
              <div class="actu-name">${escHtml(u.name || "@" + un)}</div>
              <div class="actu-sub">${escHtml(u.jobTitle || "Xodim")} · ${actMonthLabel(monthKey)}</div>
            </div>
            <div class="actu-hkpis">
              ${kpi(`${faolKun} / ${otgan}`, "faol kun")}
              ${kpi(`${ozBajarilgan} / ${ozReja}`, "o'z loyihalari rejasi")}
              <span class="actu-div"></span>
              <span class="actu-mnav">
                <button type="button" class="act-mbtn sm" onclick="actUserSetMonth(-1)">${ICON.chevronLeft}</button>
                <span class="actu-month">${actMonthLabel(monthKey)}</span>
                <button type="button" class="act-mbtn sm"${keyingiOy ? "" : " disabled"} onclick="actUserSetMonth(1)">${ICON.chevronRight}</button>
              </span>
            </div>
          </div>
          <div class="actu-mkpis">
            ${kpi(`${faolKun}<i> / ${otgan}</i>`, "faol kun")}
            ${kpi(`${ozBajarilgan}<i> / ${ozReja}</i>`, "o'z loyihalari rejasi")}
          </div>`;

        if (!barchaIsh.length) {
          body.innerHTML = `${header}<div class="act-empty big">Bu oyda hali ish yo'q</div>`;
          return;
        }

        const prognoz = otgan ? Math.round((jami / otgan) * kunlar) : 0;
        const badge =
          prevShuKunga && foiz !== null
            ? `<span class="actu-badge ${farq >= 0 ? "up" : "down"}">${farq >= 0 ? "+" : "−"}${Math.abs(farq)} ta · ${farq >= 0 ? "+" : "−"}${Math.abs(foiz)}%</span>`
            : "";
        const mbadge =
          prevShuKunga && foiz !== null
            ? `<span class="actu-badge ${farq >= 0 ? "up" : "down"}">${farq >= 0 ? "+" : "−"}${Math.abs(foiz)}%</span>`
            : "";
        // Tanlangan loyiha chipi — grafik nima bo'yicha chizilganini
        // aytadi va bosilsa barcha loyihalarga qaytaradi.
        const tanlanganIsh = tanlanganSlug
          ? barchaIsh.find((it) => it.project && it.project.slug === tanlanganSlug)
          : null;
        const projChip = tanlanganSlug
          ? `<button type="button" class="actu-sel" onclick="actUserPickProj('')" title="Barcha loyihalarga qaytish">
              <i style="background:${personColor(tanlanganSlug)}"></i>
              <span>${escHtml(tanlanganIsh ? tanlanganIsh.project.label : tanlanganSlug)}</span>
              <em>✕</em>
            </button>`
          : "";
        const chartCard = `<div class="actu-card">
            <div class="actu-top">
              <span class="actu-bign">${jami}</span>
              <span class="actu-bigl">ta ish · 1–${otgan} ${oyNomi.toLowerCase()}</span>
              <span class="actu-only-d">${badge}</span>
              <span class="actu-only-m">${mbadge}</span>
              ${projChip}
            </div>
            <div class="actu-cmp-sub">${
              prevShuKunga
                ? `${escHtml(prevNomi)}ning shu kuniga nisbatan (${prevShuKunga} ta)`
                : "O'tgan oyda taqqoslash uchun ma'lumot yo'q"
            }</div>
            <div class="actu-legend">
              <span><i class="cur"></i>${escHtml(oyNomi)}</span>
              <span><i class="prev"></i>${escHtml(prevNomi)}</span>
              <span><i class="fc"></i><span class="actu-only-d">Prognoz — shu sur'atda</span><span class="actu-only-m">Prognoz</span></span>
              <span class="actu-only-d"><i class="bar"></i>Kunlik ishlar</span>
            </div>
            <div class="actu-chart actu-only-d">${actChartSvg(hammasi, monthKey, prevKey, un, otgan, prognoz, false, tanlanganSlug)}</div>
            <div class="actu-chart actu-only-m">${actChartSvg(hammasi, monthKey, prevKey, un, otgan, prognoz, true, tanlanganSlug)}</div>
          </div>`;

        // Loyiha kartalari — shu oyda ishlangan har loyiha, ko'pidan kamiga.
        const byProj = {};
        barchaIshlar.forEach((it) => {
          const slug = it.project ? it.project.slug : "";
          if (!slug) return;
          byProj[slug] = byProj[slug] || { slug, label: it.project.label, n: 0, last: null, days: {} };
          byProj[slug].n++;
          byProj[slug].days[it.day] = (byProj[slug].days[it.day] || 0) + 1;
          if (!byProj[slug].last || it.at > byProj[slug].last) byProj[slug].last = it.at;
        });
        const projs = Object.values(byProj)
          .sort((a, b) => b.n - a.n)
          .map((p) => {
            const meta = act.projects.find((x) => x.slug === p.slug);
            const oz = meta && meta.smm === un;
            const reja = oz ? meta.plan || 0 : 0;
            const kutilgan = reja ? (reja * otgan) / kunlar : 0;
            const st = actProjectStatus(p.n, kutilgan);
            const oxirgiKun = Object.keys(p.days).sort().pop();
            const tanaffus = oxirgiKun ? daysBetween(parseISO(oxirgiKun), parseISO(act.today)) : 99;
            const eskirgan = tanaffus >= 5;
            const rang = personColor(p.slug);
            const kimOrniga = !oz && meta && meta.smm ? `${actShortName(actUser(meta.smm))} o'rniga` : "";
            const vaqt = eskirgan
              ? `<span class="actu-warn">${tanaffus} kundan beri yo'q</span>`
              : `<span class="actu-time">${ACT_CLOCK}${escHtml(actLastWorkText(p.last))}</span>`;
            const spark = actSparkSvg(p, monthKey, otgan, kunlar, reja, rang);
            return {
              p, meta, reja, st, eskirgan, rang, kimOrniga, vaqt, spark, tanaffus,
            };
          });

        const projCards = projs
          .map((x) => `<div class="actu-proj${x.eskirgan ? " stale" : ""}${x.p.slug === tanlanganSlug ? " is-sel" : ""}" onclick="actUserPickProj('${escArg(x.p.slug)}')" title="Grafikni shu loyiha bo'yicha ko'rish">
              <div class="actu-ptop">
                <span class="actu-pdot" style="background:${x.rang}"></span>
                <span class="actu-pname">${escHtml(x.p.label)}</span>
              </div>
              <div class="actu-pmid">
                <span class="actu-pnum">${x.p.n}<i>${x.reja ? ` / ${x.reja}` : " ta"}</i></span>
                ${x.st ? `<span class="actu-pst ${x.st.cls}"><em></em>${x.st.label}</span>` : ""}
              </div>
              <div class="actu-pspark">${x.spark.big}</div>
              <div class="actu-pfoot">${x.kimOrniga ? `<span class="actu-warn">${escHtml(x.kimOrniga)}</span>` : x.vaqt}</div>
            </div>`)
          .join("");

        const projRows = projs
