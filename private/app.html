      // ── TRACKER ───────────────────────────────────────────────────
      function openTracker(id) {
        const p = projects.find((x) => x.id === id);
        if (!p) return;
        trackerProjectId = id;
        trackerType = p.k > 0 ? "k" : "s";
        openSubScreen("screen-tracker", closeTracker);
        renderTracker();
      }
      function closeTracker() {
        trackerProjectId = null;
        showTab(activeTab);
      }
      function setTrackerType(t) {
        trackerType = t;
        renderTracker();
      }
      function openTrackerMenu() {
        const p = projects.find((x) => x.id === trackerProjectId);
        if (!p) return;
        const { body } = makeSheet(escHtml(p.label));
        body.innerHTML = `
          <button class="btn btn-soft" style="margin-bottom:10px" onclick="document.querySelector('.overlay').remove();openProjectHistorySheet('${escArg(p.id)}','${escArg(p.label)}')">Davrlar tarixi</button>
          ${isAdmin ? `<button class="btn btn-soft" style="margin-bottom:10px" onclick="document.querySelector('.overlay').remove();openProjectEditSheet('${escArg(p.id)}')">Loyihani tahrirlash</button>` : ""}
          ${isAdmin ? `<button class="btn btn-danger" onclick="document.querySelector('.overlay').remove();archiveProject('${escArg(p.id)}','${escArg(p.label)}',null)">Arxivlash</button>` : ""}`;
      }
      function renderTracker() {
        const p = projects.find((x) => x.id === trackerProjectId);
        if (!p) return closeTracker();
        document.getElementById("trk-name").textContent = p.label;
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const today = todayDate();
        const daysLeft = projDaysLeft(p);
        document.getElementById("trk-period").textContent =
          `${MONTHS[start.getMonth()]} ${start.getFullYear()} · ${daysLeft >= 0 ? daysLeft + " kun qoldi" : "muddat tugagan"}`;

        const segK = document.getElementById("trk-seg-k");
        const segS = document.getElementById("trk-seg-s");
        segK.textContent = `Postlar ${p.doneK}/${p.k}`;
        segS.textContent = `Stories ${p.doneS}/${p.s}`;
        segK.style.display = p.k > 0 ? "flex" : "none";
        segS.style.display = p.s > 0 ? "flex" : "none";
        segK.className = "seg-btn" + (trackerType === "k" ? " active" : "");
        segS.className = "seg-btn" + (trackerType === "s" ? " active" : "");

        const count = trackerType === "k" ? p.k : p.s;
        const done = trackerType === "k" ? p.doneK : p.doneS;
        document.getElementById("trk-prog-fill").style.width = pct(done, count) + "%";

        const totalDays = daysBetween(start, end) + 1;
        let elapsedIdx = daysBetween(start, today);
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const tick = document.getElementById("trk-prog-tick");
        if (today >= start && today <= end) {
          tick.style.display = "block";
          tick.style.left =
            (totalDays > 1 ? (elapsedIdx / (totalDays - 1)) * 100 : 100) + "%";
        } else {
          tick.style.display = "none";
        }
        const expected =
          totalDays > 0 ? Math.round(((elapsedIdx + 1) / totalDays) * count) : 0;
        const delta = done - expected;
        const deltaEl = document.getElementById("trk-prog-delta");
        deltaEl.textContent = delta === 0 ? "±0" : delta > 0 ? "+" + delta : String(delta);
        deltaEl.className = "trk-prog-delta" + (delta >= 0 ? " ok" : "");

        // ── KALENDAR: faqat haqiqatda bajarilgan kunlar ─────────────
        const dayMap = buildDayMap(p, trackerType);
        const checks = p.checks || {};
        const det = p.checkDetails || {};
        const firstWeekday = (start.getDay() + 6) % 7; // Dushanba = 0
        let cells = "";
        for (let i = 0; i < firstWeekday; i++)
          cells += `<div class="cal-cell empty"></div>`;
        for (let d = 0; d < totalDays; d++) {
          const cur = new Date(start);
          cur.setDate(cur.getDate() + d);
          const key = isoOf(cur);
          const seqs = dayMap[key] || [];
          const isToday = key === isoOf(today);
          let cls = "cal-cell",
            inner;
          if (seqs.length) {
            // Shu kuni nechta chiqqan bo'lsa — o'sha son yoziladi
            cls += " done" + (isToday ? " done-today" : "");
            inner = `<div class="cn">${cur.getDate()}</div><div class="cs num">${seqs.length}</div>`;
          } else if (isToday) {
            cls += " today";
            inner = `<div class="cn">${cur.getDate()}</div><div class="cs">bugun</div>`;
          } else {
            cls += " pending";
            inner = `<div class="cn">${cur.getDate()}</div>`;
          }
          cells += `<div class="${cls}"${seqs.length ? ` title="${seqs.map((n) => (trackerType === "k" ? "Post " : "Stories ") + n).join(", ")}" onclick="openDayCell('${escArg(p.id)}','${trackerType}',[${seqs.join(",")}])"` : ""}>${inner}</div>`;
        }

        // ── BUGUN BELGILANGANLAR ────────────────────────────────────
        const todayKey = isoOf(today);
        const kToday = buildDayMap(p, "k")[todayKey] || [];
        const sToday = buildDayMap(p, "s")[todayKey] || [];
        const doneRow = (type, n, label) => {
          const info = det[`${type}-${n}`] || {};
          const who = [info.editorName, info.videographerName]
            .filter(Boolean)
            .join(" · ");
          return `<div class="today-task done" onclick="openCheckModal('${escArg(p.id)}','${type}',${n})">
            <div class="today-box checked">✓</div>
            <div style="flex:1;min-width:0">
              <div class="today-lbl" style="text-decoration:none">${label} ${n}</div>
              ${who ? `<div class="r-sub">${escHtml(who)}</div>` : ""}
            </div>
            <div class="chev">›</div>
          </div>`;
        };
        let todayHtml = "";
        kToday.forEach((n) => (todayHtml += doneRow("k", n, "Post")));
        sToday.forEach((n) => (todayHtml += doneRow("s", n, "Stories")));
        if (!todayHtml)
          todayHtml = `<div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Bugun hali hech narsa belgilanmagan</div>`;

        // ── BARCHA VAZIFALAR: 1..N alohida checkbox ─────────────────
        const typeLabel = trackerType === "k" ? "Post" : "Stories";
        let allHtml = "";
        for (let i = 1; i <= count; i++) {
          const on = !!checks[`${trackerType}-${i}`];
          allHtml += `<label class="cbi">
            <input type="checkbox" ${on ? "checked" : ""} onchange="onCheckboxToggle(event,'${escArg(p.id)}','${trackerType}',${i},this.checked)"/>
            <span class="cbi-box">${i}</span>
          </label>`;
        }

        document.getElementById("tracker-body").innerHTML = `
          <div class="cal-week">${WD.map((w) => `<span>${w}</span>`).join("")}</div>
          <div class="cal-grid">${cells}</div>
          <div class="cal-legend">
            <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--brand)"></div>bajarilgan (son = shu kuni nechta chiqqani)</div>
          </div>
          <div class="list-card" style="margin-top:16px">
            <div style="padding:11px 14px;border-bottom:1px solid var(--bd1);font-weight:600;font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase">${fmtDay(today)} · bugun belgilangan</div>
            ${todayHtml}
          </div>
          <div class="sec-upper" style="margin:20px 0 9px">Barcha ${trackerType === "k" ? "postlar" : "stories"}</div>
          <div class="list-card" style="padding:14px">
            <div class="cb-row">${allHtml}</div>
            <div class="f-hint" style="margin-top:12px">${trackerType === "k" ? "Post belgilanganda kim montaj qilgani va kim video olgani so'raladi." : "Belgilangan " + typeLabel.toLowerCase() + " bugungi kunga yoziladi — sanani o'zgartirish uchun ustiga bosing."}</div>
          </div>`;

        const railEl = document.getElementById("trk-rail");
        if (railEl) railEl.innerHTML = buildTrackerRailHtml(p);
      }

      // Muddati o'tgan (checksiz, kutilgan sanasi allaqachon o'tgan)
      // elementlar — bir tekis taqsimot asosida (xuddi trk-prog-tick
      // hisoblagani kabi, faqat har bir raqam uchun alohida).
      function findOverdueItems(p, type) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const today = todayDate();
        const totalDays = daysBetween(start, end) + 1;
        let elapsedIdx = daysBetween(start, today);
        if (elapsedIdx < 0) elapsedIdx = 0;
        if (elapsedIdx > totalDays - 1) elapsedIdx = totalDays - 1;
        const count = type === "k" ? p.k : p.s;
        const checks = p.checks || {};
        const items = [];
        for (let i = 1; i <= count; i++) {
          if (checks[`${type}-${i}`]) continue;
          const dueIdx =
            totalDays > 1 ? Math.round(((i - 1) / (count - 1 || 1)) * (totalDays - 1)) : 0;
          if (dueIdx <= elapsedIdx) items.push({ type, n: i, daysLate: elapsedIdx - dueIdx });
        }
        return items;
      }

      // ── TRACKER O'NG PANELI (faqat katta ekran — "MUDDAT") ─────────
      // Loyihaning haftalik hisobi — har hafta uchun REJALASHTIRILGAN son
      // (post/stories'ning chiziqli taqsimlangan "muddat" kuni asosida,
      // findOverdueItems bilan bir xil formula) va BAJARILGAN son
      // (checkDetails'dagi haqiqiy workDate asosida, buildDayMap kabi).
      function computeWeeklyProgress(p) {
        const start = parseISO(p.periodStart);
        const end = parseISO(p.periodEnd);
        const totalDays = daysBetween(start, end) + 1;
        const weeks = Math.max(1, Math.min(5, Math.ceil(totalDays / 7)));
        const bounds = [];
        for (let w = 0; w < weeks; w++) {
          const s = w === 0 ? 0 : bounds[w - 1].end + 1;
          const e = Math.min(totalDays - 1, Math.round(((w + 1) / weeks) * totalDays) - 1);
          bounds.push({ start: s, end: Math.max(s, e) });
        }
        const weekOf = (idx) => {
          for (let w = 0; w < bounds.length; w++) if (idx <= bounds[w].end) return w;
          return bounds.length - 1;
        };
        const dueIdx = (i, count) =>
          totalDays > 1 ? Math.round(((i - 1) / (count - 1 || 1)) * (totalDays - 1)) : 0;

        const rows = bounds.map(() => ({ plannedK: 0, plannedS: 0, doneK: 0, doneS: 0 }));
        for (let i = 1; i <= p.k; i++) rows[weekOf(dueIdx(i, p.k))].plannedK++;
        for (let i = 1; i <= p.s; i++) rows[weekOf(dueIdx(i, p.s))].plannedS++;

        const det = p.checkDetails || {};
        const checks = p.checks || {};
        Object.keys(checks).forEach((key) => {
          if (!checks[key]) return;
          const wd = det[key] && det[key].workDate;
          if (!wd) return;
          const idx = daysBetween(start, parseISO(String(wd).slice(0, 10)));
          if (idx < 0 || idx >= totalDays) return;
          const w = weekOf(idx);
          if (key.startsWith("k-")) rows[w].doneK++;
          else if (key.startsWith("s-")) rows[w].doneS++;
        });
        return rows;
      }
      // Haftalik progress grafigi: ustun balandligi shu haftadagi umumiy
      // hajmni (post+stories), to'ldirilgan qism esa bajarilish foizini
      // bildiradi. Ustiga qo'yilgan "tomchi" belgisi to'ldirilgan chegara
      // — hover qilinganda aniq raqamlar (rejalashtirilgan/bajarilgan)
      // ko'rsatiladi.
      function buildWeeklyProgressHtml(p) {
        const weekly = computeWeeklyProgress(p);
        const volumes = weekly.map((r) => Math.max(r.plannedK + r.plannedS, r.doneK + r.doneS));
        const maxVolume = Math.max(1, ...volumes);
        return weekly
          .map((r, w) => {
            const planned = r.plannedK + r.plannedS;
            const done = r.doneK + r.doneS;
            const fillPct = planned > 0 ? Math.min(100, Math.round((done / planned) * 100)) : done > 0 ? 100 : 0;
            const trackH = Math.max(10, Math.round((volumes[w] / maxVolume) * 52));
            const tip = `Post: ${r.plannedK}/${r.doneK}\nStories: ${r.plannedS}/${r.doneS}`;
            return `<div class="wk-bar-col">
              <div class="wk-bar-track" style="height:${trackH}px" title="${escHtml(tip)}">
                <div class="wk-bar-fill" style="height:${fillPct}%"></div>
                <div class="wk-bar-drop" style="bottom:${fillPct}%"></div>
              </div>
              <div class="wk-bar-lbl">${w + 1}-h</div>
            </div>`;
          })
          .join("");
      }

      function buildTrackerRailHtml(p) {
        const todayItems = buildTodayItems(p);
        const todayHtml = todayItems.length
          ? todayItems
              .map(
                (it) => `<div class="rail-item">
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${it.type === "k" ? "Post" : "Stories"} ${it.n}</div>
                  </div>
                </div>`,
              )
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Bugun hali hech narsa belgilanmagan</div>`;

        const overdue = [...findOverdueItems(p, "k"), ...findOverdueItems(p, "s")].sort(
          (a, b) => b.daysLate - a.daysLate,
        );
        const overdueHtml = overdue.length
          ? overdue
              .slice(0, 6)
              .map(
                (it) => `<div class="rail-item">
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${it.type === "k" ? "Post" : "Stories"} ${it.n}</div>
                    <div class="r-sub" style="color:var(--red)">${it.daysLate} kun kechikdi</div>
                  </div>
                </div>`,
              )
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Kechikkan vazifa yo'q</div>`;

        const barsHtml = buildWeeklyProgressHtml(p);

        const remaining = Math.max(0, p.k + p.s - (p.doneK + p.doneS));
        const daysLeft = Math.max(1, projDaysLeft(p) + 1);
        const weeksLeft = Math.max(1, Math.ceil(daysLeft / 7));
        const weeklyNeed = Math.ceil(remaining / weeksLeft);
        const advisory =
          remaining > 0
            ? `Qolgan ${remaining} vazifa ${daysLeft} kunga taqsimlansa, haftada ~${weeklyNeed} ta yetarli.`
            : "Barcha vazifalar bajarilgan — davr yakunlanishiga tayyor.";

        const assignees = p.assignees || [];
        const assigneesHtml = assignees.length
          ? assignees
              .map((a) => {
                const name = a.fullName || (a.firstName ? `${a.firstName} ${a.lastName || ""}`.trim() : `@${a.username}`);
                return `<div class="rail-item">
                  <div class="avatar avatar-sm mute">${initials(name)}</div>
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${escHtml(name)}</div>
                  </div>
                </div>`;
              })
              .join("")
          : `<div style="font-size:12px;color:var(--t3)">Xodim biriktirilmagan</div>`;

        return `
          <div class="rail-card">
            <div class="rail-title">Mas'ul xodimlar${assignees.length ? " · " + assignees.length : ""}</div>
            ${assigneesHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">${fmtDay(todayDate())} · bugun</div>
            ${todayHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">O'tkazib yuborilgan${overdue.length ? " · " + overdue.length : ""}</div>
            ${overdueHtml}
          </div>
          <div class="rail-card">
            <div class="rail-title">Haftalik progress</div>
            <div class="wk-bars">${barsHtml}</div>
            <div class="f-hint">${advisory}</div>
          </div>`;
      }

      // Checkbox bosilishi — ikkala holatda ham (yangi belgilash yoki
      // allaqachon belgilangan itemni bosish) native checkbox holati
      // avvalgi holatiga qaytariladi va modal ochiladi: yangi belgilashda
      // kim qilgani so'raladi, mavjudini bosganda esa tafsilotlarni
      // tahrirlash yoki "Belgini olib tashlash" tugmasi bilan o'chirish
      // mumkin bo'ladi — holat faqat shu modal orqali o'zgaradi.
      function onCheckboxToggle(ev, slug, type, num, checked) {
        ev.target.checked = !checked;
        openCheckModal(slug, type, num);
      }

      // Kalendar katakchasi bosilganda — shu kunga tegishli post/stories
      // tafsilotini tahrirlash modalini ochadi. Bir kunga bir nechta
      // post/stories to'g'ri kelsa — avval qaysi biri ekanini tanlash
      // uchun kichik ro'yxat ko'rsatiladi.
      function openDayCell(slug, type, seqs) {
        if (!seqs || !seqs.length) return;
        if (seqs.length === 1) return openCheckModal(slug, type, seqs[0]);
        const label = type === "k" ? "Post" : "Stories";
        const { body } = makeSheet(`${label}lar — shu kun`);
        body.innerHTML = seqs
          .map(
            (n) =>
              `<button class="btn btn-soft" style="margin-bottom:8px" onclick="document.querySelector('.overlay').remove();openCheckModal('${escArg(slug)}','${type}',${n})">${label} ${n}</button>`,
          )
          .join("");
      }

      // ── BELGILASH MODALI (kim montaj qildi / kim video oldi) ──────
      // Post uchun ikkala select ham so'raladi; stories uchun faqat sana.
      function staffOptions(selectedId, mainPosition) {
        const main = staffList.filter((s) => s.position === mainPosition);
        const rest = staffList.filter((s) => s.position !== mainPosition);
        const opt = (s) =>
          `<option value="${escHtml(s.id)}"${s.id === selectedId ? " selected" : ""}>${escHtml(s.fullName)}</option>`;
        let html = `<option value=""${!selectedId ? " selected" : ""}>— tanlanmagan —</option>`;
        if (main.length)
          html += `<optgroup label="${POSITION_LABELS[mainPosition] || mainPosition}">${main.map(opt).join("")}</optgroup>`;
        if (rest.length)
          html += `<optgroup label="Boshqa xodimlar">${rest.map(opt).join("")}</optgroup>`;
        return html;
      }

      function openCheckModal(slug, type, num) {
        const p = projects.find((x) => x.id === slug);
        if (!p) return;
        const key = `${type}-${num}`;
        const info = (p.checkDetails || {})[key] || {};
        const already = !!(p.checks || {})[key];
        const label = type === "k" ? "Post" : "Stories";
        const workDate = info.workDate
          ? String(info.workDate).slice(0, 10)
          : isoOf(todayDate());

        const { body } = makeSheet(`${label} ${num} — ${escHtml(p.label)}`);
        const staffPart =
          type === "k"
            ? `<div class="f-group">
                 <label class="f-label">Video montajini kim qildi?</label>
                 <select class="f-input" id="cm-editor">${staffOptions(info.editorId, "montajchi")}</select>
               </div>
               <div class="f-group">
                 <label class="f-label">Videoni kim oldi?</label>
                 <select class="f-input" id="cm-videographer">${staffOptions(info.videographerId, "mobilograf")}</select>
               </div>
               ${
                 staffList.length === 0
                   ? `<div class="f-hint" style="color:var(--red);margin-top:-6px;margin-bottom:14px">Xodimlar ro'yxati bo'sh. Boshqaruv → Xodimlar bo'limidan qo'shing.</div>`
                   : ""
               }`
            : "";

        body.innerHTML = `
          ${staffPart}
          <div class="f-group">
            <label class="f-label">Qaysi kuni chiqdi?</label>
            <input type="date" class="f-input" id="cm-date" value="${workDate}"/>
            <div class="f-hint">Kalendarda shu kun ko'k rangga o'tadi.</div>
          </div>
          <button class="btn btn-blue" id="cm-save" onclick="saveCheckModal('${escArg(slug)}','${type}',${num})">${already ? "Yangilash" : "Belgilash"}</button>
          ${
            already
              ? `<button class="btn btn-danger" style="margin-top:10px" onclick="removeCheck('${escArg(slug)}','${type}',${num})">Belgini olib tashlash</button>`
              : ""
          }`;
      }

      async function saveCheckModal(slug, type, num) {
        const btn = document.getElementById("cm-save");
        const editorId = document.getElementById("cm-editor")?.value || null;
        const videographerId =
          document.getElementById("cm-videographer")?.value || null;
        const workDate = document.getElementById("cm-date")?.value || null;
        // Xodimlar kiritilgan bo'lsa — post uchun ikkalasi ham majburiy
        if (type === "k" && staffList.length > 0) {
          if (!editorId) return showToast("⚠ Montaj qilgan xodimni tanlang");
          if (!videographerId) return showToast("⚠ Video olgan xodimni tanlang");
        }
        if (!workDate) return showToast("⚠ Sanani tanlang");
        btn.disabled = true;
        btn.textContent = "Saqlanmoqda…";
        try {
          await onCheck(slug, type, num, true, null, {
            editorId,
            videographerId,
            workDate,
          });
          document.querySelector(".overlay")?.remove();
          showToast("✅ Belgilandi");
        } catch (e) {
          btn.disabled = false;
          btn.textContent = "Belgilash";
        }
      }

      async function removeCheck(slug, type, num) {
        try {
          await onCheck(slug, type, num, false);
          document.querySelector(".overlay")?.remove();
          showToast("Belgi olib tashlandi");
        } catch (e) {}
      }

      // ── YANGI LOYIHA ──────────────────────────────────────────────
      // ── YANGI LOYIHA — MODAL (sahifa emas: markazlashgan modal, orqa
      // fon qoraytiriladi — makeSheet() bilan bir xil .overlay/.sheet
      // primitividan foydalanadi, lekin header/footer maxsus bo'lgani
      // uchun o'z DOM'ini o'zi quradi). ──────────────────────────────
      let npTemplates = [];
      function npDefaultState() {
        const t = todayDate();
        return {
          label: "",
          startMode: "today", // "today" | "month1" | "custom"
          anchor: isoOf(t),
          k: 10,
          s: 15,
          assignees: [],
          notify: true,
          calMonth: t.getMonth(),
          calYear: t.getFullYear(),
          calSel: null,
          tplPanelOpen: false,
          saving: false,
          labelErr: false,
        };
      }
      function npIsDirty() {
        const d = npState;
        return !!d.label.trim() || d.assignees.length > 0 || d.k !== 10 || d.s !== 15 || d.startMode !== "today";
      }
      function onNpEscKey(e) {
        if (e.key === "Escape") requestCloseNewProject();
      }
      function openNewProjectSheet() {
        npState = npDefaultState();
        const ov = document.createElement("div");
        ov.className = "overlay";
        ov.id = "np-overlay";
        ov.onclick = (e) => {
          if (e.target === ov) requestCloseNewProject();
        };
        ov.innerHTML = `
          <div class="sheet wide" style="display:flex;flex-direction:column">
            <div class="np-ov-hdr">
              <div class="np-ov-icon">+</div>
              <div style="flex:1;min-width:0">
                <div class="np-ov-title">Yangi loyiha</div>
                <div class="np-ov-sub">Oylik kontent rejasi avtomatik yaratiladi</div>
              </div>
              <button class="sheet-close" onclick="requestCloseNewProject()">×</button>
            </div>
            <div class="np-ov-body" id="np-body"></div>
            <div class="np-ov-footer" id="np-footer"></div>
          </div>`;
        document.body.appendChild(ov);
        document.addEventListener("keydown", onNpEscKey);
        renderNewProjectForm();
        ensureNpUsersLoaded().then(() => {
          if (document.getElementById("np-overlay")) renderNewProjectForm();
        });
        loadNpTemplates();
      }
      function requestCloseNewProject() {
        if (npIsDirty()) {
          showConfirmModal(
            "Chiqishni xohlaysizmi?",
            "Kiritilgan ma'lumotlar saqlanmaydi.",
            () => closeNewProjectSheet(),
            "Ha, chiqish",
          );
        } else {
          closeNewProjectSheet();
        }
      }
      function closeNewProjectSheet() {
        document.getElementById("np-overlay")?.remove();
        document.removeEventListener("keydown", onNpEscKey);
      }
      async function ensureNpUsersLoaded() {
        try {
          const res = await apiFetch("/api/users");
          if (!res.ok) return;
          const d = await res.json();
          allUsers = (d.users || []).filter((u) => u.role === "employee" && u.is_active);
        } catch (e) {}
      }
      async function loadNpTemplates() {
        try {
          const res = await apiFetch("/api/project-templates");
          if (res.ok) npTemplates = (await res.json()).templates || [];
          if (document.getElementById("np-overlay")) renderNewProjectForm();
        } catch (e) {}
      }

      // ── Hisob davri: tez tanlash + ichki (embed) kalendar ───────────
      function npCurrentMonthLabel() {
        const t = todayDate();
        return `1-${MONTHS[t.getMonth()].toLowerCase()}`;
      }
      function npSetStartMode(mode) {
        npState.startMode = mode;
        const t = todayDate();
        if (mode === "today") npState.anchor = isoOf(t);
        else if (mode === "month1") npState.anchor = isoOf(new Date(t.getFullYear(), t.getMonth(), 1));
        else if (mode === "custom") {
          const cur = parseISO(npState.anchor);
          npState.calYear = cur.getFullYear();
          npState.calMonth = cur.getMonth();
          npState.calSel = npState.anchor;
        }
        renderNewProjectForm();
      }
      function npCalNav(delta) {
        npState.calMonth += delta;
        if (npState.calMonth < 0) {
          npState.calMonth = 11;
          npState.calYear--;
        } else if (npState.calMonth > 11) {
          npState.calMonth = 0;
          npState.calYear++;
        }
        renderNewProjectForm();
      }
      function npCalSelectDay(iso) {
        npState.calSel = iso;
        renderNewProjectForm();
      }
      function npCalConfirm() {
        if (!npState.calSel) return;
        npState.anchor = npState.calSel;
        renderNewProjectForm();
      }
      function npPeriodEnd(startIso) {
        const nextStart = jsAddMonthsClamped(startIso, 1);
        const nd = parseISO(nextStart);
        nd.setDate(nd.getDate() - 1);
        return isoOf(nd);
      }
      function npBuildCalendarHtml() {
        const cells = buildCalGridCells(npState.calYear, npState.calMonth);
        const todayIso = isoOf(todayDate());
        const dayBtns = cells
          .map((c) => {
            const cls = ["np2-cal-day"];
            if (!c.iso) cls.push("other");
            if (c.iso === todayIso) cls.push("today");
            if (c.iso && c.iso === npState.calSel) cls.push("sel");
            return `<button type="button" class="${cls.join(" ")}" ${c.iso ? `onclick="npCalSelectDay('${c.iso}')"` : "disabled"}>${c.dNum}</button>`;
          })
          .join("");
        const selLabel = npState.calSel
          ? `${fmtDay(parseISO(npState.calSel))} → ${fmtDay(parseISO(npPeriodEnd(npState.calSel)))}`
          : "Kun tanlang";
        return `
          <div class="np2-cal">
            <div class="np2-cal-hdr">
              <div class="np2-cal-title">${MONTHS[npState.calMonth]} ${npState.calYear}</div>
              <div class="np2-cal-nav">
                <button type="button" class="np2-cal-nav-btn" onclick="npCalNav(-1)">${ICON.chevronLeft}</button>
                <button type="button" class="np2-cal-nav-btn" onclick="npCalNav(1)">${ICON.chevronRight}</button>
              </div>
            </div>
            <div class="np2-cal-grid">
              ${WD.map((w) => `<div class="np2-cal-wd">${w}</div>`).join("")}
              ${dayBtns}
            </div>
            <div class="np2-cal-foot">
              <div class="np2-cal-foot-txt">Tanlangan: <b>${selLabel}</b></div>
              <button type="button" class="np2-cal-confirm" ${npState.calSel ? "" : "disabled"} onclick="npCalConfirm()">Tasdiqlash</button>
            </div>
          </div>`;
      }

      // ── Hajm: tez tanlash / qo'lda / shablondan ─────────────────────
      function npStepK(d) {
        npState.k = Math.max(0, Math.min(200, npState.k + d));
        renderNewProjectForm();
      }
      function npStepS(d) {
        npState.s = Math.max(0, Math.min(200, npState.s + d));
        renderNewProjectForm();
      }
      function npSetVolume(k, s) {
        npState.k = k;
        npState.s = s;
        npState.tplPanelOpen = false;
        renderNewProjectForm();
      }
      function npToggleTplPanel() {
        npState.tplPanelOpen = !npState.tplPanelOpen;
        renderNewProjectForm();
      }
      function npApplyTemplate(id) {
        const t = npTemplates.find((x) => x.id === id);
        if (!t) return;
        npState.k = t.postsTarget;
        npState.s = t.storiesTarget;
        npState.tplPanelOpen = false;
        renderNewProjectForm();
        showToast(`✅ "${t.name}" shabloni qo'llanildi`);
      }
      function npDeleteTemplate(id, name, ev) {
        ev.stopPropagation();
        showConfirmModal(
          `"${escHtml(name)}" shablonini o'chirish`,
          "Bu amalni bekor qilib bo'lmaydi.",
          async () => {
            try {
              const res = await apiFetch(`/api/project-templates/${id}`, { method: "DELETE" });
              if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Xato");
              npTemplates = npTemplates.filter((t) => t.id !== id);
              renderNewProjectForm();
            } catch (e) {
              showToast("⚠ " + e.message);
            }
          },
          "O'chirish",
        );
      }
      function npBuildTemplatePanelHtml() {
        if (!npTemplates.length) {
          return `<div class="np2-tpl-panel"><div style="padding:14px;font-size:12px;color:var(--t3);line-height:1.6">Hali shablon saqlanmagan. Hajmni tanlab, pastdagi "Shablon sifatida saqlash" orqali birinchisini yarating.</div></div>`;
        }
        return `<div class="np2-tpl-panel">${npTemplates
          .map(
            (t) => `<div class="np2-tpl-row" onclick="npApplyTemplate('${escArg(t.id)}')">
              <div class="np2-tpl-name">${escHtml(t.name)}</div>
              <div class="np2-tpl-meta">${t.postsTarget} post + ${t.storiesTarget} stories</div>
              <button type="button" class="np2-tpl-del" onclick="npDeleteTemplate('${escArg(t.id)}','${escArg(t.name)}',event)">${ICON.trash}</button>
            </div>`,
          )
          .join("")}</div>`;
      }
      function npOpenSaveTemplate() {
        document.getElementById("np-tpl-modal")?.remove();
        const modal = document.createElement("div");
        modal.id = "np-tpl-modal";
        modal.className = "overlay";
        modal.style.zIndex = "900";
        modal.innerHTML = `
          <div class="sheet" style="max-width:420px">
            <div class="sheet-handle"></div>
            <div style="padding:14px 20px calc(28px + env(safe-area-inset-bottom,0px))">
              <div style="font-size:16px;font-weight:600;color:var(--ink);margin-bottom:14px">Shablon sifatida saqlash</div>
              <div class="f-group">
                <label class="f-label">Shablon nomi</label>
                <input class="f-input" id="np-tpl-name" placeholder="Masalan: Standart (10+15)"/>
              </div>
              <div class="f-hint" style="margin-bottom:16px">${npState.k} post + ${npState.s} stories saqlanadi.</div>
              <div style="display:flex;gap:10px">
                <button class="btn btn-soft" onclick="this.closest('.overlay').remove()">Bekor qilish</button>
                <button class="btn btn-blue" id="np-tpl-save-btn" onclick="npSaveTemplate()">Saqlash</button>
              </div>
            </div>
          </div>`;
        document.body.appendChild(modal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.remove();
        });
        document.getElementById("np-tpl-name").focus();
      }
      async function npSaveTemplate() {
        const nameInput = document.getElementById("np-tpl-name");
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.style.borderColor = "var(--red)";
          return;
        }
        const btn = document.getElementById("np-tpl-save-btn");
        btn.disabled = true;
        try {
          const res = await apiFetch("/api/project-templates", {
            method: "POST",
            body: JSON.stringify({ name, postsTarget: npState.k, storiesTarget: npState.s }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(d.error || "Xato");
          npTemplates.push(d.template);
          document.getElementById("np-tpl-modal")?.remove();
          if (document.getElementById("np-overlay")) renderNewProjectForm();
          showToast(`✅ "${name}" shablon sifatida saqlandi`);
        } catch (e) {
          showToast("⚠ " + e.message);
          btn.disabled = false;
        }
      }

      // ── Mas'ul — mavjud Ruxsatlar (permissions) tizimidan foydalanadi:
      // loyihaga "mas'ul" belgilash = shu loyihaga ruxsat berish, chunki
      // amalda ham xodim faqat ruxsat berilgan loyihani ko'rib/belgilay
      // oladi. Alohida "responsible person" ustuni qo'shilmadi. ────────
      function npRemoveAssignee(username) {
        npState.assignees = npState.assignees.filter((u) => u !== username);
        renderNewProjectForm();
      }
      function npUserDisplayName(u) {
        return u.first_name ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
      }
      function npBuildAssigneesHtml() {
        const chips = npState.assignees
          .map((username) => {
            const u = allUsers.find((x) => x.username === username);
            const name = u ? npUserDisplayName(u) : `@${username}`;
            return `<div class="np2-mas-chip">
              <div class="av">${initials(name.replace(/^@/, ""))}</div>
              <div class="nm">${escHtml(name)}</div>
              <button type="button" class="rm" onclick="npRemoveAssignee('${escArg(username)}')">×</button>
            </div>`;
          })
          .join("");
        return `<div class="np2-mas-row">
          <div class="np2-label" style="width:100%">Mas'ul <span class="np2-sub-hint">loyihaga ruxsat va Telegram xabari shu tanlovga bog'liq</span></div>
          ${chips}
          <button type="button" class="np2-mas-add" onclick="npOpenAssigneePicker()">+ Yana</button>
        </div>`;
      }
      function npOpenAssigneePicker() {
        const { body } = makeSheet("Mas'ul tanlash");
        if (!allUsers.length) {
          body.innerHTML = `<div class="empty"><div class="empty-t">Xodimlar yo'q</div></div>`;
          return;
        }
        body.innerHTML = allUsers
          .map((u) => {
            const on = npState.assignees.includes(u.username);
            return `<div class="list-row">
              <div class="avatar mute">${initials(npUserDisplayName(u))}</div>
              <div style="flex:1;min-width:0">
                <div class="r-name">${escHtml(npUserDisplayName(u))}</div>
                <div class="r-sub">@${escHtml(u.username)}</div>
              </div>
              <button class="tglsw brand ${on ? "on" : ""}" onclick="npToggleAssigneeInPicker('${escArg(u.username)}', this)"><div class="knob"></div></button>
            </div>`;
          })
          .join("");
      }
      function npToggleAssigneeInPicker(username, btn) {
        const idx = npState.assignees.indexOf(username);
        if (idx >= 0) npState.assignees.splice(idx, 1);
        else npState.assignees.push(username);
        btn.classList.toggle("on");
        renderNewProjectForm();
      }

      // ── Preview (o'ng ustun) — real vaqtda hisoblanadi, hardcode yo'q ─
      function npBuildPreviewHtml() {
        const total = npState.k + npState.s;
        const anchor = parseISO(npState.anchor);
        const end = parseISO(npPeriodEnd(npState.anchor));
        const totalDays = daysBetween(anchor, end) + 1;
        const weeks = Math.max(1, totalDays / 7);
        const fullWeeks = Math.floor(totalDays / 7);
        const remDays = totalDays - fullWeeks * 7;
        const bars = [0, 1, 2, 3, 4]
          .map((i) => {
            let h;
            if (i < fullWeeks) h = 34;
            else if (i === fullWeeks && remDays > 0) h = Math.max(8, Math.round((remDays / 7) * 34));
            else h = 6;
            const dim = i >= fullWeeks;
            return `<div><div class="preview-bar ${dim ? "dim" : ""}" style="height:${h}px"></div><div class="preview-bar-lbl">${i + 1}-h</div></div>`;
          })
          .join("");
        const checklist = total
          ? `<div class="np2-check-list">
              <div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${npState.k} ta post vazifasi</div></div>
              <div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${npState.s} ta stories vazifasi</div></div>
              ${npState.assignees
                .map((username) => {
                  const u = allUsers.find((x) => x.username === username);
                  const name = u ? npUserDisplayName(u) : `@${username}`;
                  return `<div class="np2-check-row"><div class="np2-check-ico">✓</div><div class="np2-check-txt">${escHtml(name)}ga biriktiriladi</div></div>`;
                })
                .join("")}
            </div>`
          : "";
        return `
          <div class="preview-card">
            <div class="preview-upper">Yaratiladi</div>
            <div class="preview-title">${total} vazifa · ${fmtDay(anchor)} – ${fmtDay(end)}</div>
            <div class="preview-sub">Haftada ~${Math.round(npState.k / weeks)} post + ~${Math.round(npState.s / weeks)} stories</div>
            <div class="preview-bars">${bars}</div>
          </div>
          ${checklist}
          <div class="np2-debt-warn">Muddat <b>${fmtDay(end)}</b>. O'tib ketsa loyiha qarz ro'yxatiga tushadi.</div>`;
      }

      async function submitNewProject() {
        const label = npState.label.trim();
        if (!label) {
          npState.labelErr = true;
          renderNewProjectForm();
          document.querySelector(".np2-name-input")?.focus();
          return;
        }
        npState.saving = true;
        const f = document.getElementById("np-footer");
        if (f) f.innerHTML = npBuildFooterHtml();
        try {
          const res = await apiFetch("/api/projects", {
            method: "POST",
            body: JSON.stringify({
              label,
              anchorDate: npState.anchor,
              postsTarget: npState.k,
              storiesTarget: npState.s,
              assigneeUsernames: npState.assignees,
              notifyTelegram: npState.notify,
            }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(d.error || "Xato");
          await loadProjects();
          histState.loaded = false;
          try {
            const pr = await apiFetch("/api/permissions");
            if (pr.ok) perms = await pr.json();
          } catch (e) {}
          closeNewProjectSheet();

      // ── BOSHQARUV ─────────────────────────────────────────────────
      const ADMIN_TABS = [

        "perms",
        "admins",
        "announcement",

      function renderAdminActiveTab() {
        const c = document.getElementById("admin-body");
        if (adminActiveTab === "projects") renderAdminProjectsTab(c);
        else if (adminActiveTab === "staff") renderStaffTab(c);
        else if (adminActiveTab === "worklog") renderWorklogTab(c);
        else if (adminActiveTab === "perms") renderAdminPermsTab(c);
        else if (adminActiveTab === "admins") renderAdminAdminsTab(c);
        else renderAnnouncementTab(c);

      // ── XODIMLAR TABI ────────────────────────────────────────────
      // Ikki qism: (1) Telegram xodimlar — avtomatik, botga kirib profil
      // to'ldirgan userlar shu yerda o'zi paydo bo'ladi, admin qo'lda
      // qayta kiritmaydi; (2) Boshqa xodimlar — Telegram'siz ishlab
      // chiqarish jamoasi (montajchi/mobilograf/...), hali ham qo'lda.
      function renderStaffTab(c) {
        const q = (document.getElementById("admin-search")?.value || "")
          .toLowerCase()
          .trim();
        const posOptions = Object.keys(POSITION_LABELS)
          .map((k) => `<option value="${k}">${POSITION_LABELS[k]}</option>`)
          .join("");

        const groups = {};
        staffList
          .filter((s) => !q || s.fullName.toLowerCase().includes(q))
          .forEach((s) => (groups[s.position] = groups[s.position] || []).push(s));
        const order = Object.keys(POSITION_LABELS);
        const shown = order.filter((k) => groups[k] && groups[k].length);
        let staffHtml = "";
        if (!shown.length) {
          staffHtml = `<div class="empty"><div class="empty-t">Xodim yo'q</div><div class="empty-s">Yuqoridan ism va lavozimni kiritib qo'shing.</div></div>`;
        } else {
          shown.forEach((pos) => {
            staffHtml += `<div class="sec-upper">${POSITION_LABELS[pos]} · ${groups[pos].length}</div><div class="list-card" style="margin-bottom:14px">`;
            staffHtml += groups[pos]
              .map(
                (s) => `<div class="list-row">
                  <div class="avatar mute">${initials(s.fullName)}</div>
                  <div style="flex:1;min-width:0">
                    <div class="r-name">${escHtml(s.fullName)}</div>
                    <div class="r-sub">${POSITION_LABELS[s.position] || s.position}</div>
                  </div>
                  <div class="m-actions-inline">
                    <button class="icon-btn" onclick="openStaffEdit('${escArg(s.id)}')">${ICON.edit}</button>
                    <button class="icon-btn danger" onclick="deleteStaff('${escArg(s.id)}','${escArg(s.fullName)}')">${ICON.trash}</button>
                  </div>
                </div>`,
              )
              .join("");
            staffHtml += `</div>`;
          });
        }

        c.innerHTML = `
          <div class="sec-upper">Telegram xodimlar · avtomatik</div>
          <div id="staff-tg-list" class="list-card" style="margin-bottom:20px">
            <div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Yuklanmoqda…</div>
          </div>
          <div class="sec-upper">Boshqa xodimlar · qo'lda qo'shiladi</div>
          <div class="list-card" style="padding:14px;margin-bottom:16px">
            <div class="f-group" style="margin-bottom:10px">
              <label class="f-label">Yangi xodim</label>
              <input class="f-input" id="staff-name" placeholder="Ism familiya" onblur="formatNameInputOnBlur(this)"/>
            </div>
            <div style="display:flex;gap:8px">
              <select class="f-input" id="staff-position" style="flex:1">${posOptions}</select>
              <button class="btn btn-blue" style="width:auto;padding:0 18px" onclick="addStaff()">Qo'shish</button>
            </div>
          </div>
          ${staffHtml}`;

        loadAndRenderTelegramStaff(q);

      // Botga kirish holati belgisi — uch xil aniq holat (TZ: active/
      // blocked/removed), har biri o'z rangi/matni bilan.
      function userAccessBadgeHtml(u, extraStyle) {
        const style = extraStyle || "";
        if (u.access_status === "blocked") {
          return `<span class="debt-badge" style="${style}">Bloklangan</span>`;
        }
        if (u.access_status === "removed") {
          return `<span class="debt-badge" style="background:var(--chip3);color:var(--t3);${style}">Chiqarilgan</span>`;
        }
        return "";
      }
      // Telegram orqali botga kirib profilini to'ldirgan xodimlar —
      // hech qanday qo'lda kiritish shart emas, /api/users'dan o'zi keladi.
      async function loadAndRenderTelegramStaff(q) {
        const wrap = document.getElementById("staff-tg-list");
        if (!wrap) return;
        try {
          const res = await apiFetch("/api/users");
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          allUsers = (await res.json()).users || [];
        } catch (e) {
          wrap.innerHTML = `<div style="padding:16px 14px;font-size:12px;color:var(--red)">⚠ ${escHtml(e.message)}</div>`;
          return;
        }
        // Chiqarilgan (o'chirilgan) xodimlar standart ko'rinishda
        // yashiriladi — ro'yxat faol xodimlar bilan cheklanadi. Kerak
        // bo'lsa (masalan qayta ruxsat berish uchun) pastdagi havola
        // orqali ko'rsatish mumkin.
        const removedCount = allUsers.filter((u) => u.access_status === "removed").length;
        const base = showRemovedEmployees ? allUsers : allUsers.filter((u) => u.access_status !== "removed");
        const filtered = base.filter(
          (u) =>
            !q ||
            `${u.first_name || ""} ${u.last_name || ""} ${u.username}`.toLowerCase().includes(q),
        );
        const toggleHtml =
          removedCount > 0
            ? `<div class="stat-foot" style="margin:10px 0 4px"><span class="stat-link" onclick="toggleShowRemovedEmployees()">${showRemovedEmployees ? "Chiqarilganlarni yashirish" : `Chiqarilganlar (${removedCount}) →`}</span></div>`
            : "";
        if (!filtered.length) {
          wrap.innerHTML = `<div style="padding:16px 14px;font-size:12.5px;color:var(--t3)">Hali hech kim botga kirmagan</div>${toggleHtml}`;
          return;
        }
        const mobileRows = filtered
          .map((u) => {
            const complete = !!u.first_name;
            const displayName = complete ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
            const sub = complete
              ? [u.job_title, u.phone].filter(Boolean).join(" · ") || `@${u.username}`
              : "profil hali to'ldirilmagan";
            return `<div class="list-row">
              <div class="avatar">${u.username.slice(0, 1).toUpperCase()}</div>
              <div style="flex:1;min-width:0">
                <div class="r-name">${escHtml(displayName)}</div>
                <div class="r-sub"${complete ? "" : ' style="color:var(--red)"'}>${escHtml(sub)}</div>
              </div>
              ${userAccessBadgeHtml(u)}
              <div class="m-actions-inline">
                <button class="icon-btn" onclick="openUserEditSheet('${escArg(u.username)}')">${ICON.edit}</button>
                ${isSuperAdmin && u.access_status !== "removed" ? `<button class="icon-btn danger" onclick="deleteTelegramUser('${escArg(u.username)}','${escArg(displayName)}')">${ICON.trash}</button>` : ""}
              </div>
            </div>`;
          })
          .join("");

        const desktopCards = filtered
          .map((u) => {
            const complete = !!u.first_name;
            const displayName = complete ? `${u.first_name} ${u.last_name || ""}`.trim() : `@${u.username}`;
            const sub = complete
              ? [u.job_title, u.phone].filter(Boolean).join(" · ") || `@${u.username}`
              : "profil hali to'ldirilmagan";
            return `<div class="pcard">
              <div class="pcard-top">
                <div class="row" style="display:flex;align-items:center;gap:9px;min-width:0">
                  <div class="avatar" style="flex-shrink:0">${u.username.slice(0, 1).toUpperCase()}</div>
                  <div class="r-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(displayName)}</div>
                </div>
                <div class="m-actions-inline">
                  <button class="icon-btn" onclick="openUserEditSheet('${escArg(u.username)}')">${ICON.edit}</button>
                  ${isSuperAdmin && u.access_status !== "removed" ? `<button class="icon-btn danger" onclick="deleteTelegramUser('${escArg(u.username)}','${escArg(displayName)}')">${ICON.trash}</button>` : ""}
                </div>
              </div>
              <div class="r-sub"${complete ? "" : ' style="color:var(--red)"'}>${escHtml(sub)}</div>
              ${userAccessBadgeHtml(u, "margin-top:8px")}
            </div>`;
          })
          .join("");

        wrap.className = ""; // .list-card emas — endi ikkala variant ham o'z konteynerini olib keladi
        wrap.innerHTML = `<div class="mobile-only list-card">${mobileRows}</div><div class="desktop-only"><div class="pgrid">${desktopCards}</div></div>${toggleHtml}`;
      }
      let showRemovedEmployees = false;
      function toggleShowRemovedEmployees() {
        showRemovedEmployees = !showRemovedEmployees;
        loadAndRenderTelegramStaff(document.getElementById("admin-search")?.value.toLowerCase().trim() || "");
      }

        try {
          const res = await apiFetch("/api/staff", {
            method: "POST",

          await loadStaff();
          renderStaffTab(document.getElementById("admin-body"));

      // ── TABEL: oy davomida kim qaysi loyihada nima qilgan ─────────
      function shiftMonth(delta) {
        const [y, m] = worklogMonth.split("-").map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        worklogMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        worklog = null;
        renderWorklogTab(document.getElementById("admin-body"));
      }
      async function renderWorklogTab(c) {
        if (!worklogMonth) worklogMonth = isoOf(todayDate()).slice(0, 7);

      // ── RUXSATLAR MATRITSASI (faqat katta ekran) ────────────────────
      // Backend binar (bor/yo'q) — dizaynerning "faqat ko'rish" oraliq
      // holati backendda mavjud emas, shu sababli ataylab qo'shilmadi:
      // faqat ✓ (to'liq huquq) / bo'sh (ruxsat yo'q).
      function buildPermsMatrixHtml() {
        if (!allUsers.length || !projects.length) return "";

        const cols = projects.map((p) => `<th title="${escHtml(p.label)}">${escHtml(p.label)}</th>`).join("");
        const rows = allUsers
          .map((u) => {
            const assigned = perms[u.username] || [];
            const displayName = u.first_name
              ? `${u.first_name} ${u.last_name || ""}`.trim()
              : `@${u.username}`;
            const cells = projects
              .map((p) => {
                const on = assigned.includes(p.id);
                return `<td><div class="pmx-cell${on ? " on" : ""}" onclick="togglePermission('${escArg(u.username)}','${escArg(p.id)}',this)">${on ? "✓" : ""}</div></td>`;
              })
              .join("");
            return `<tr>
              <td class="pmx-emp">
                <div style="display:flex;align-items:center;gap:11px">
                  <div class="avatar" style="width:30px;height:30px;border-radius:9px;font-size:11.5px">${u.username.slice(0, 1).toUpperCase()}</div>
                  <div style="min-width:0">
                    <div class="pmx-emp-name">${escHtml(displayName)}</div>
                    ${u.job_title ? `<div class="pmx-emp-sub">${escHtml(u.job_title)}</div>` : ""}
                  </div>
                </div>
              </td>
              ${cells}
              <td class="pmx-total${assigned.length === 0 ? " zero" : ""}">${assigned.length}</td>
            </tr>`;
          })
          .join("");

        const orphans = allUsers.filter((u) => (perms[u.username] || []).length === 0);
        const debtProjects = projects.filter((p) => p.outstandingDebt);
        const attentionCount = orphans.length + debtProjects.length;
        const attentionHtml =
          attentionCount
            ? [
                ...orphans.map(
                  (u) => `<div class="rail-item warn">
                    <div style="flex:1;min-width:0">
                      <div class="r-name">${escHtml(u.first_name || u.username)} loyihasiz</div>
                      <div class="r-sub">Hech qanday loyiha biriktirilmagan</div>
                    </div>
                    <button class="btn btn-blue btn-sm" style="width:auto;padding:0 12px" onclick="openUserEditSheet('${escArg(u.username)}')">Biriktirish</button>
                  </div>`,
                ),
                ...debtProjects.map(
                  (p) => `<div class="rail-item">
                    <div style="flex:1;min-width:0">
                      <div class="r-name">${escHtml(p.label)} qarzda</div>
                      <div class="r-sub" style="color:var(--red)">${daysBetween(parseISO(p.outstandingDebt.periodEnd), todayDate())} kun</div>
                    </div>
                    <button class="btn btn-soft btn-sm" style="width:auto;padding:0 12px" onclick="openTracker('${escArg(p.id)}')">Ochish</button>
                  </div>`,
                ),
              ].join("")
            : `<div style="font-size:12px;color:var(--t3)">Hammasi tartibda</div>`;

        return `
          <div class="desktop-only">
            <div class="dash-cols">
              <div>
                <div class="pmx-wrap">
                  <table class="pmx">
                    <thead><tr><th class="pmx-emp">Xodim</th>${cols}<th class="pmx-total">Jami</th></tr></thead>
                    <tbody>${rows}</tbody>
                  </table>
                </div>
                <div class="pmx-legend">
                  <span><span class="pmx-legend-dot" style="background:var(--brand)"></span>to'liq huquq</span>
                  <span><span class="pmx-legend-dot" style="background:var(--chip);border:1px solid var(--bd2)"></span>ruxsat yo'q</span>
                </div>
                <div class="f-hint">Katakcha ustiga bosib ruxsatni almashtiring · o'zgarish darhol saqlanadi</div>
              </div>
              <div>
                <div class="rail-card">
                  <div class="rail-title" style="display:flex;align-items:center;justify-content:space-between">E'tibor talab qiladi${attentionCount ? `<span class="rail-title-count">${attentionCount}</span>` : ""}</div>
                  ${attentionHtml}
                </div>
              </div>
            </div>
          </div>`;
      }

      // Toggle bosilishi bilan butun ruxsatlar xaritasi PUT qilinadi
      // (backend shartnomasi o'zgarmadi — avvalgidek to'liq xarita kutadi).
      async function togglePermission(username, projectId, btnEl) {
        const list = perms[username] || (perms[username] = []);
        const idx = list.indexOf(projectId);
        const turningOn = idx === -1;
        if (turningOn) list.push(projectId);
        else list.splice(idx, 1);
        btnEl.classList.toggle("on", turningOn);
        btnEl.textContent = turningOn ? "✓" : "";
        try {
          const res = await apiFetch("/api/permissions", {
            method: "PUT",
            body: JSON.stringify(perms),
          });
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          renderPermList();
        } catch (e) {
          showToast("⚠ " + e.message);
          const i2 = list.indexOf(projectId);
          if (turningOn && i2 !== -1) list.splice(i2, 1);
          else if (!turningOn) list.push(projectId);
          btnEl.classList.toggle("on", !turningOn);
          btnEl.textContent = !turningOn ? "✓" : "";
        }
      }

      // Yopilgan davrlarni ochib, qarzni orqaga qaytib yopish mumkin
      // (PATCH /api/checks so'roviga cycleId qo'shiladi).
      async function openProjectHistorySheet(slug, label) {
        const { body } = makeSheet(`${escHtml(label)} — davrlar`);
        await refreshHistoryBody(body, slug);
      }
      async function refreshHistoryBody(body, slug) {
        body.innerHTML = `<div class="empty"><div class="empty-s">Yuklanmoqda…</div></div>`;
        try {
          const res = await apiFetch(`/api/projects/${slug}/cycles`);
          if (!res.ok)
            throw new Error((await res.json().catch(() => ({}))).error || "Xato");
          const d = await res.json();
          if (!d.cycles.length) {
            body.innerHTML = `<div class="empty"><div class="empty-t">Davrlar yo'q</div></div>`;
            return;
          }
          body.innerHTML = "";
          // Loyiha oy o'rtasidan boshlangan, lekin davr chegarasi
          // noto'g'ri (masalan to'liq kalendar-oy) qo'yilgani uchun
          // OXIRGI yopilgan davr adolatsiz "qarz" bilan yopilgan bo'lishi
          // mumkin. Buni faqat joriy davrda hali hech narsa
          // belgilanmagan holatda tuzatishga ruxsat beramiz (aks holda
          // ikki davrni "birlashtirish" noaniq bo'lib qoladi) — bu
          // fix-previous-cycle endpoint'ining o'zidagi shartlar bilan
          // bir xil.
          const activeCyc = d.cycles.find((c) => c.status === "active");
          const canFixPrev =
            activeCyc &&
            activeCyc.doneK === 0 &&
            activeCyc.doneS === 0 &&
            d.cycles.find((c) => c.status === "closed" && c.cycleIndex === activeCyc.cycleIndex - 1);
          d.cycles.forEach((cyc) => {
            const item = document.createElement("div");
            item.className = "cycle-item" + (cyc.isDebt ? " debt" : "");
            item.id = `cyc-${cyc.cycleId}`;
            const statusLabel =
              cyc.status === "active"
                ? "Joriy davr"
                : cyc.isDebt
                  ? "⚠ Qarz"
                  : "✓ To'liq yopilgan";
            const isFixable = canFixPrev && cyc.status === "closed" && cyc.cycleIndex === activeCyc.cycleIndex - 1;
            const fixHtml = isFixable
              ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bd1)">
                  <div class="f-label">Loyiha aslida boshqa kunda boshlangan bo'lsa</div>
                  ${renderDateFieldHtml("pf-fix-start-" + cyc.cycleId, cyc.periodStart, "Sana tanlang")}
                  <div class="f-hint">Agar shu sana bilan davr muddati hali o'tmagan bo'lsa, "qarz" belgisi olib tashlanadi.</div>
                  <button class="btn btn-blue btn-sm" style="margin-top:8px" onclick="submitFixPreviousCycle('${escArg(slug)}','${escArg(cyc.cycleId)}')">Saqlash</button>
                </div>`
              : "";
            item.innerHTML = `
              <div class="cycle-item-top" onclick="document.getElementById('cyc-${cyc.cycleId}').classList.toggle('open')">
                <div style="min-width:0">
                  <div class="cycle-item-label">${cyc.periodStart} – ${cyc.periodEnd}</div>
                  <div class="cycle-item-sub">${statusLabel} · K ${cyc.doneK}/${cyc.k} · S ${cyc.doneS}/${cyc.s}</div>
                </div>
                <div class="c-chev">▾</div>
              </div>
              <div class="cycle-item-body">
                ${
                  cyc.status === "active"
                    ? `<div style="font-size:11.5px;color:var(--t3);line-height:1.6">Bu joriy davr — belgilash uchun Tracker ekranidan foydalaning.</div>`
                    : `<div class="cb-section"><div class="cb-head"><span class="cb-badge">Post</span></div><div class="cb-row" id="hist-${cyc.cycleId}-k"></div></div>
                       <div class="cb-section"><div class="cb-head"><span class="cb-badge">Stories</span></div><div class="cb-row" id="hist-${cyc.cycleId}-s"></div></div>`
                }
                ${fixHtml}
              </div>`;
            body.appendChild(item);
            if (cyc.status !== "active") {
              buildHistoryCBs(body, slug, cyc.cycleId, cyc.k, "k", cyc.checks);
              buildHistoryCBs(body, slug, cyc.cycleId, cyc.s, "s", cyc.checks);
            }
          });
        } catch (e) {
          body.innerHTML = `<div style="color:var(--red);font-size:12px">⚠ ${escHtml(e.message)}</div>`;
        }
      }
      function buildHistoryCBs(body, projectSlug, cycleId, count, type, checksMap) {
        const row = body.querySelector(`#hist-${cycleId}-${type}`);
        if (!row) return;
        row.innerHTML = "";
        for (let i = 1; i <= count; i++) {
          const lbl = document.createElement("label");
          lbl.className = "cbi";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!checksMap?.[`${type}-${i}`];
          cb.addEventListener("change", async () => {
            const openIds = [...body.querySelectorAll(".cycle-item.open")].map(
              (n) => n.id,
            );
            try {
              const data = await onCheck(projectSlug, type, i, cb.checked, cycleId);
              showToast(data?.isDebt ? "⚠ Hali ham qarz bor" : "✅ Yangilandi");
              await refreshHistoryBody(body, projectSlug);
              openIds.forEach((id) =>
                document.getElementById(id)?.classList.add("open"),
              );
            } catch (e) {
              cb.checked = !cb.checked;
            }
          });
          const box = document.createElement("span");
          box.className = "cbi-box";
          box.textContent = i;
          lbl.appendChild(cb);
          lbl.appendChild(box);
          row.appendChild(lbl);
        }
      }
      // Oyning o'rtasidan boshlangan loyihaning oldingi (yopilgan) davri
      // noto'g'ri chegara bilan adolatsiz "qarz"ga chiqib qolgan bo'lsa —
      // shu yerda tuzatiladi (faqat joriy davr hali bo'sh bo'lsa).
      async function submitFixPreviousCycle(slug, cycleId) {
        const periodStart = document.getElementById("pf-fix-start-" + cycleId)?.value;
        if (!periodStart) return showToast("⚠ Sana tanlang");
        try {
          const res = await apiFetch(`/api/projects/${slug}/fix-previous-cycle`, {
            method: "POST",
            body: JSON.stringify({ periodStart }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Xato");
          showToast("✅ Davr sanasi tuzatildi");
          await loadProjects();
          refreshAllViews();
          const body = document.querySelector(".sheet-body");
          if (body) await refreshHistoryBody(body, slug);
        } catch (e) {
          showToast("⚠ " + e.message);
        }
      }

      // Telegram WebView confirm() ni qo'llab-quvvatlamaydi — o'z modalimiz
      function showConfirmModal(title, message, onConfirm, okLabel) {
        document.getElementById("confirm-modal")?.remove();
        const modal = document.createElement("div");
        modal.id = "confirm-modal";
        modal.className = "overlay";
        modal.style.zIndex = "900";
        modal.innerHTML = `
          <div class="sheet" style="max-width:480px">
            <div class="sheet-handle"></div>
            <div style="padding:14px 20px calc(28px + env(safe-area-inset-bottom,0px))">

              <div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:22px">${message}</div>
              <div style="display:flex;gap:10px">
                <button id="confirm-cancel-btn" class="btn btn-soft">Bekor qilish</button>
                <button id="confirm-ok-btn" class="btn btn-danger">${okLabel || "O'chirish"}</button>
              </div>
            </div>
          </div>`;
        document.body.appendChild(modal);
        document.getElementById("confirm-cancel-btn").onclick = () => modal.remove();
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.remove();
        });
        document.getElementById("confirm-ok-btn").onclick = () => {
          modal.remove();
          onConfirm();
        };
      }

      // ── KIRISH TAQIQLANGAN ────────────────────────────────────────
      function showAccessDenied(username, code, message) {
        // Backend endi holatga qarab aniq xabar beradi (bloklangan /
        // ruxsat mavjud emas) — shuni ko'rsatamiz, bo'lmasa umumiy matn.
        const title = code === "BLOCKED" ? "Kirish bloklangan" : "Kirish taqiqlangan";
        const detail = message
          ? escHtml(message)
          : username
            ? `<span style="color:var(--brand);font-weight:600">@${escHtml(username)}</span> uchun ruxsat yo'q`
            : "Faqat Nasaf Digital jamoasi kirishi mumkin";
        document.body.innerHTML = `
          <div style="min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="background:#fff;border:1px solid var(--bd2);border-radius:16px;padding:36px 24px;max-width:320px;width:100%;text-align:center">
              <div style="width:52px;height:52px;border-radius:99px;background:var(--red-bg);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--red);font-weight:700">!</div>
              <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px">
                <div style="width:28px;height:28px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px">ND</div>
                <span style="font-size:13px;font-weight:600">Nasaf Digital</span>
              </div>
              <div style="font-size:17px;font-weight:600;margin-bottom:8px">${escHtml(title)}</div>
              <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:20px">
                ${detail}
              </div>
              <div style="background:var(--chip);border-radius:10px;padding:12px;font-size:11px;color:var(--t2);text-align:left;line-height:1.6">
                Murojaat uchun:<br><span style="color:var(--brand);font-weight:600">@jahongirjuraqulov</span>
              </div>
            </div>
          </div>`;
      }

      // ── INIT ──────────────────────────────────────────────────────
      // To'liq ekran rejimida Telegram o'zining sarlavha/yopish
      // tugmalarini kontent ustiga chizadi (contentSafeAreaInset) —
      // shuni --tg-safe-top CSS o'zgaruvchisiga yozib, .hdr/.trk-hdr/
      // .np-hdr/#sidebar shu bo'shliqni hisobga oladi (aks holda ekran
      // sarlavhasi Telegram'ning o'z tugmalari ostida yashiringan bo'lardi).
      function applyTelegramSafeArea() {
        const t = tg();
        if (!t) return;
        const top = (t.safeAreaInset?.top || 0) + (t.contentSafeAreaInset?.top || 0);
        document.documentElement.style.setProperty("--tg-safe-top", top + "px");
      }
      async function initApp() {
        if (tg()) {
          tg().ready();
          tg().expand();
          try {
            tg().requestFullscreen?.(); // Bot API 8.0+ — kompyuterda ham to'liq ekran
            tg().disableVerticalSwipes?.();
          } catch (e) {}
          applyTelegramSafeArea();
          try {
            tg().onEvent?.("safeAreaChanged", applyTelegramSafeArea);
            tg().onEvent?.("contentSafeAreaChanged", applyTelegramSafeArea);
            tg().onEvent?.("fullscreenChanged", applyTelegramSafeArea);
          } catch (e) {}
        }

        const initData = getInitData();
        if (initData) {
          try {
            const res = await apiFetch("/api/auth", { method: "POST", body: "{}" });
            const d = await res.json();
            if (res.status === 403 || res.status === 401) {
              document.getElementById("loading").remove();
              showAccessDenied(
                d.username || tg()?.initDataUnsafe?.user?.username || null,
                d.code,
                d.error,
              );
              return;
            }
            currentUser = d.username;
            isAdmin = d.isAdmin || false;
            isSuperAdmin = d.isSuperAdmin || false;
            userRole = d.role || "employee";
          } catch (e) {
            console.warn("Auth offline:", e.message);
          }
        }

        if (!currentUser) {
          currentUser =
            (tg()?.initDataUnsafe?.user?.username || "").toLowerCase() || null;
          isSuperAdmin = SUPER_ADMINS.has(currentUser);
          isAdmin = isSuperAdmin;
          userRole = isSuperAdmin ? "super_admin" : "employee";
        }

        // Chat ID ni saqlash (bot bildirishnomalari uchun)
        const chatId = tg()?.initDataUnsafe?.user?.id;
        if (chatId && currentUser) {
          apiFetch("/api/register-chat", {
            method: "POST",
            body: JSON.stringify({ chatId }),
          }).catch(() => {});
        }

        try {
          const r = await apiFetch("/api/permissions");
          if (r.ok) perms = await r.json();
        } catch (e) {}

        let profileIncomplete = false;
        try {
          const r = await apiFetch("/api/me");
          if (r.ok) {
            const d = await r.json();
            myProfile = d.user;
            profileIncomplete = !!d.profileIncomplete;
          }
        } catch (e) {}

        await loadProjects();
        await loadStaff();
        await loadTasks();
        await loadTags();

        document.getElementById("nav-admin").style.display = isAdmin
          ? "flex"
          : "none";
        document.getElementById("sidebar-nav-admin").style.display = isAdmin
          ? "flex"
          : "none";
        document.getElementById("atab-admins").style.display = isSuperAdmin
          ? "block"
          : "none";
        document.getElementById("atab-announcement").style.display = isSuperAdmin
          ? "block"
          : "none";

        renderSidebar();
        // Ko'rinish (mobil/desktop) faqat CSS orqali hal qilinadi
        // (.mobile-only/.desktop-only) — bloklarning o'zi har doim
        // quriladi, shuning uchun bu yerda faqat oyna hajmi chegaradan
        // o'tganda ma'lumotlarni yangilab turish uchun (masalan "N kun
        // qoldi" kabi qiymatlar) qayta render qilinadi.
        window
          .matchMedia("(min-width: 860px)")
          .addEventListener("change", refreshAllViews);

        document.getElementById("loading").remove();
        if (profileIncomplete) {
          showOnboarding();
        } else {
          // Bildirishnomadagi "Ilovani ochish" tugmasi (web_app URL'ga
          // qo'shilgan ?openTask=<id> yoki ?tab=<nom>) — bosilganda ilova
          // to'g'ridan-to'g'ri o'sha vazifaga/bo'limga ochiladi.
          const params = new URLSearchParams(window.location.search);
          const openTaskId = params.get("openTask");
          const tabParam = params.get("tab");
          if (openTaskId) {
            showTab("tasks");
            openTaskActions(openTaskId);
          } else if (tabParam && ROOT_TABS.includes(tabParam)) {
            showTab(tabParam);
          } else {
            showTab("today");
          }
        }
      }

      initApp();
    </script>
  </body>
</html>
